# yaml-language-server: $schema=https://raw.githubusercontent.com/shuhei1101/dev-docs/e1740866425c5c8c49bbd2ebc610fbcbdf8061fd/schemas/dev-docs.schema.json
version: "3"
name: rule-inject
description: Claude Code がファイルを触る前に、そのファイルに当たるルールを案内するプラグインの設計書・公開ドキュメント・ソースコード・テスト
instructions: |-
  設計書（`dev/設計書/`）と各フォルダの `index.yaml` は YAML が正本で、種類ごとの行に分かれる。
  公開ドキュメント（`docs/`）の Markdown、ソースコード（`src/`・`hooks/`）、テスト（`tests/`）は、各フォルダの `files.yaml` が名前・概要文・タグ・関連を持つ。
  コードは `implements` で設計書を、テストは `tests` でコードを指す。設計書からコードを辿るときは `trace_related` を使う。
documents:
  - id: architecture
    title: アーキテクチャ図
    paths: ["dev/設計書/アーキテクチャ図/*.yaml"]
    exclude: [index.yaml]
    schema: dev/テンプレート/アーキテクチャ図.schema.yaml
    metadata:
      name: title
      description: lead
  - id: nonfunctional
    title: 非機能要件
    paths: ["dev/設計書/非機能要件/*.yaml"]
    exclude: [index.yaml]
    schema: dev/テンプレート/非機能要件.schema.yaml
    metadata:
      name: title
      description: lead
  - id: scenario
    title: シナリオ
    paths: ["dev/設計書/シナリオ/**/*.yaml"]
    exclude: [index.yaml]
    schema: dev/テンプレート/シナリオ.schema.yaml
    metadata:
      name: title
      description: lead
  - id: interface
    title: インターフェース定義
    paths: ["dev/設計書/インターフェース定義/**/*.yaml"]
    exclude: [index.yaml]
    schema: dev/テンプレート/インターフェース定義.schema.yaml
    metadata:
      name: title
      description: lead
  - id: module
    title: モジュール構成
    paths: ["dev/設計書/モジュール構成/**/*.yaml"]
    exclude: [index.yaml]
    schema: dev/テンプレート/モジュール構成.schema.yaml
    metadata:
      name: title
      description: lead
  - id: config
    title: 設定
    paths: ["dev/設計書/設定/*.yaml"]
    exclude: [index.yaml]
    schema: dev/テンプレート/設定.schema.yaml
    metadata:
      name: title
      description: lead
  - id: er
    title: ER図
    paths: ["dev/設計書/ER図/*.yaml"]
    exclude: [index.yaml]
    schema: dev/テンプレート/ER図.schema.yaml
    metadata:
      name: title
      description: lead
  - id: api
    title: 外部API
    paths: ["dev/設計書/外部API/*.yaml"]
    exclude: [index.yaml]
    schema: dev/テンプレート/外部API.schema.yaml
    metadata:
      name: title
      description: lead
  - id: library
    title: 外部ライブラリ
    paths: ["dev/設計書/外部ライブラリ/*.yaml"]
    exclude: [index.yaml]
    schema: dev/テンプレート/外部ライブラリ.schema.yaml
    metadata:
      name: title
      description: lead
  - id: test_procedure
    title: テスト実行方法
    paths: ["dev/設計書/テスト/*.yaml"]
    exclude: [index.yaml]
    schema: dev/テンプレート/テスト実行方法.schema.yaml
    metadata:
      name: title
  - id: index
    title: 目次
    paths:
      - dev/index.yaml
      - "dev/設計書/**/index.yaml"
      - "dev/エージェント運用/**/index.yaml"
      - dev/コーディング規約/index.yaml
      - dev/テンプレート/index.yaml
      - docs/index.yaml
      - "docs/**/index.yaml"
    schema: dev/テンプレート/index.schema.yaml
    metadata:
      description: summary
  - id: docs
    title: 公開ドキュメント
    paths: [docs/files.yaml]
    exclude: [README.md, index.md, index.yaml, _config.yml, nav.yml, nav.project.yml, default.html, sidebar-source.html, tab-link.html, app.js, style.css, llms.txt, search.json]
    schema: schemas/files.schema.yaml
    records: files
    body_file: path
  - id: src
    title: ソースコード
    paths: [src/files.yaml]
    schema: schemas/files.schema.yaml
    records: files
    body_file: path
  - id: hooks
    title: フックの起動
    paths: [hooks/files.yaml]
    schema: schemas/files.schema.yaml
    records: files
    body_file: path
  - id: tests
    title: テスト
    paths: [tests/files.yaml]
    schema: schemas/files.schema.yaml
    records: files
    body_file: path
