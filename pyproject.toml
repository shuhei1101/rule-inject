[project]
name = "rule-inject"
version = "0.2.3"
description = "ファイルに当たるルールを案内する Claude Code プラグイン"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
server = [
    "mcp>=2.2,<3",
    "jsonschema>=4.26,<5",
    "ruamel.yaml>=0.19,<0.20",
]

[dependency-groups]
dev = [
    "mcp>=2.2,<3",
    "jsonschema>=4.26,<5",
    "ruamel.yaml>=0.19,<0.20",
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "types-jsonschema>=4.26,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rule_inject"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP", "SIM", "RUF",
    "PLR2004",
    "BLE001",
    "TRY400",
    "DTZ",
    "ASYNC",
    "S101",
    "S602", "S604",
    "S301", "S506",
    "PT011", "PT012",
]
ignore = [
    "E501",
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["rule_inject"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
# 反映作業のスクリプトは PR ごとに同じファイル名を持つため、`mypy .` からは外し、フォルダごとに検査する
exclude = ["^dev/pr/"]

[tool.importlinter]
root_package = "rule_inject"

[[tool.importlinter.contracts]]
name = "hooks と server は features を使い、features は shared を使う"
type = "layers"
layers = [
    "rule_inject.hooks | rule_inject.server",
    "rule_inject.features",
    "rule_inject.shared",
]

[[tool.importlinter.contracts]]
name = "features の機能どうしは import しない"
type = "independence"
modules = [
    "rule_inject.features.command",
    "rule_inject.features.document",
    "rule_inject.features.guidance",
    "rule_inject.features.index",
    "rule_inject.features.record",
]
