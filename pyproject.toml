[project]
name = "rule-inject"
version = "0.2.2"
description = "ファイルに当たるルールを案内する Claude Code プラグイン"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rule_inject"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP", "SIM", "RUF",
    "PLR2004",
    "BLE001",
    "TRY400",
    "DTZ",
    "ASYNC",
    "S101",
    "S602", "S604",
    "S301", "S506",
    "PT011", "PT012",
]
ignore = [
    "E501",
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["rule_inject"]
