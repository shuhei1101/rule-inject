# rule-inject のルール索引（このリポジトリで作業するときに読む）
# rule: 索引ファイルからの相対パスか !{環境変数} で始まるパス / paths: 適用するファイルの glob（クォート必須）
# 設計書の Schema は AI Monitor の rules.global.yaml が案内する。knowledge の rules.yaml にある規約は記載しない
default_on: ["write"]
rules:
  - rule: docs/guide/索引の書式.md
    paths:
      - "**/rules.yaml"
  - rule: "!{KNOWLEDGE_ROOT}/docs/rule/python-core-naming.yaml"
    paths:
      - "**/*.py"
    read_tool:
      tool: mcp__plugin_project-index_project-index__search_docs
      args: '{"source": "knowledge", "filter": {"field": "id", "op": "eq", "values": ["python-core-naming"]}, "view": "full"}'
    read_by:
      - tools:
          - "mcp__plugin_dev-docs_dev-docs__search_docs"
        args:
          source:
            - "knowledge"
          filter[id]:
            - "python-core-naming"
  - rule: "!{KNOWLEDGE_ROOT}/docs/rule/python-core-type-hint.yaml"
    paths:
      - "**/*.py"
    read_tool:
      tool: mcp__plugin_project-index_project-index__search_docs
