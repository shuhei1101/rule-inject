  - item: Mermaid の図を mdmark の map のマーカーで囲んで補足を付ける
    reason: mdmark#324（新しい図 map）が open で、計画の依存に置かれていない。他の工程は map を待たずに進められる。この作業 PR で待つか別の Issue へ回すかの判断が分かれるため、要件.md の未確定のとおりレビューで確定する
    plan: to_file
  - item: schemas/ の Mermaid（common・interface・scenario の 3 件）
    reason: AI Monitor から配布された Schema で、このリポジトリでは書き換えない
    plan: none
  - item: 設計書（docs/ の種類のフォルダの YAML）へのタグの付与
    reason: 配布された Schema が設計書のタグのキーを持たない。Schema が持つようになったら AI Monitor の配布物への追従で付ける
    plan: none
  - item: 過去の PR ドキュメント（docs/pr/）の文を表へ・文の削減
    reason: 完了した作業の記録で、書き換えると当時の判断の記録が変わり、dev-docs の配信元にも含まれない。Issue 本文は docs/pr/ も範囲に含めるとしているため、判断が分かれる。レビューで確定する
    plan: none
