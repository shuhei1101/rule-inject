scope_out:
  - item: Mermaid の図を mdmark の map のマーカーで囲んで補足を付ける
    reason: 'mdmark#324（新しい図 map）が open で、計画の依存に置かれていない。Issue #99 の範囲を減らすため、別の Issue へ回すかをユーザーへ確認する（確認事項の回答で plan を確定する）'
    plan: to_file
  - item: schemas/ の Mermaid（common・interface・scenario の 3 件）
    reason: AI Monitor から配布された Schema で、このリポジトリでは書き換えない
    plan: none
  - item: 設計書（docs/ の種類のフォルダの YAML）へのタグの付与
    reason: 配布された Schema が設計書のタグのキーを持たない。Schema が持つようになったら AI Monitor の配布物への追従で付ける
    plan: none
  - item: 過去の PR ドキュメント（docs/pr/）の文を表へ・文の削減
    reason: '完了した作業の記録で、書き換えると当時の判断の記録が変わる。Issue #99 は docs/pr/ も範囲に含めると明記しているため、外すかをユーザーへ確認する（確認事項の回答で plan を確定する）'
    plan: to_file
  - item: 設計書の本文（lead 以外）の文を表へ・文の削減・AI slop の修正と、モジュール構成のファイル単位の文書（MOD-122-1〜51）の空の lead
    reason: '設計書は 120 件あり、1 つの PR でレビューしきれない。Issue #99 の範囲を減らすため、分類ごとの別の Issue へ分けるかをユーザーへ確認する（確認事項の回答で plan を確定する）'
    plan: to_file
  - item: 管理用の YAML のタグへの main と、管理用の YAML・設計書への aliases の登録
    reason: 配布された Schema では管理用の YAML のタグが文字列の並びで main を持てず、aliases も管理用の YAML と設計書の最上位には無い。Schema が持つようになったら AI Monitor の配布物への追従で付ける
    plan: none
  - item: '用語集（alias_type: term の文書）の新設と用語の登録'
    reason: 'リポジトリに用語を持つ文書の種類も Schema も無く、knowledge にも用語集の行が無い。この PR では文書の名前で照合する alias_type: doc だけを追加した'
    plan: to_file
  - item: 公開ドキュメントの「読む」の置き換え
    reason: 「読む」は Claude Code がルールを読んだかを既読として記録する、このプラグインの仕組みそのものを指す動詞で、「参照」へ置き換えると「既読」と意味がずれる
    plan: none
  - item: 公開ドキュメントへの mdmark の check と、画面で描いた図の確認
    reason: リポジトリに mdmark.config.yaml が無く、作るにはスキル mdmark:setup でキーを 1 つずつ利用者に確認する必要がある。図は Mermaid のままで、この PR で図を変えていない
    plan: to_file
