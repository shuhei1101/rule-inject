scope_out:
  - item: シナリオの Mermaid の図を mdmark の図へ書き換える
    reason: 起点 Issue の本文で、図は別の Issue で扱うと決めている
    plan: '#126'
  - item: シナリオの lead と管理用の YAML（index.yaml）
    reason: 'PR #125 で移行済み'
    plan: none
  - item: シナリオ以外の設計書（インターフェース定義・モジュール構成・その他）の本文
    reason: '設計書の分類ごとの Issue に分けている（インターフェース定義 #128・モジュール構成 #129・その他 #130）'
    plan: '#128'
  - item: シナリオ名（`scenarios[].name`）の AI slop の単語の置き換え
    reason: シナリオ名は `uses`・図の `click`・インターフェース定義から `{ID}#scenarios[{名前}]` で参照されるキーで、変えると参照が切れる。参照する側（インターフェース定義・複合ユースケースの図）と一緒に変える必要がある
    plan: '#138'
  - item: 「読む」と「書く操作」の置き換え
    reason: '「読む」は既読の記録の仕組みそのもの、「書く操作」は索引の操作の種別（`on: [read, write]`）を指すこのプラグインの語で、「参照」「記載」へ置き換えると意味がずれる（PR #125 の公開ドキュメントと同じ扱い）'
    plan: none
