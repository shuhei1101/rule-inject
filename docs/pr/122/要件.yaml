scope_out:
  - item: 移した文書の本文を mdmark の書き方と表し方の優先順位へ移す
    reason: '置き場所の移行と目的が違う。#99 が #120 の後に移した後の置き場所で行う'
    plan: '#99'
  - item: フォルダ構成の設計書（layout）の作成
    reason: '移した後のフォルダ構成を記載する別の作業。#114 が #120 の後に行う'
    plan: '#114'
  - item: 変更履歴の各版の PR へのリンク（dev/pr/{番号}/README.md）
    reason: リンクは版のタグに固定した URL で、移した後も同じ内容を開けるため書き換えない
    plan: none
  - item: ai-monitor-version.ini を v0.4.0 へ上げる
    reason: 版の記録は AI Monitor v0.4.0 の配布物への追従 Issue が上げる（ai-monitor#3307 の要件で、追従 Issue は移行済みを確かめるだけになる）。v0.4.0 はまだ版のタグを打っていない
    plan: none
