use_cases:
  - kind: composite
    scenario: dev/設計書/シナリオ/複合ユースケース/ルールを読んでからファイルを触る.yaml
    impact: none
    detail: ルールの案内の流れは変わらない。シナリオのファイルは docs/scenario/ へ移り、参照はパスから ID へ変わる
    depends_on: []
  - kind: composite
    scenario: dev/設計書/シナリオ/複合ユースケース/既読の記録を削除して案内を受け直す.yaml
    impact: none
    detail: 既読の記録の削除と案内の受け直しの流れは変わらない。シナリオのファイルは docs/scenario/ へ移る
    depends_on: []
  - kind: composite
    scenario: dev/設計書/シナリオ/複合ユースケース/索引のエントリを直して案内を確かめる.yaml
    impact: none
    detail: 索引のエントリの修正と案内の確認の流れは変わらない。シナリオのファイルは docs/scenario/ へ移る
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/端末をセットアップする.yaml
    impact: run_only
    detail: pyproject.toml の lint の除外を書き換えるため、利用者の入れ方で入れて起動できることを確かめる。手順は変わらない
    depends_on: []
