KNOWLEDGE_ROOT の追加:
  説明: エージェントのセッションが CLAUDE_CONFIG_DIR にする認証領域ごとの `settings.json`（`~/.claude`・`~/.claude-dev`・`~/.claude-dev1`・`~/.claude-sub`〜`~/.claude-sub7`。対象は同じフォルダの `targets.py` の固定値）の `env` に、knowledge のクローンの場所を値に持つ `KNOWLEDGE_ROOT` を追加し、`rules.yaml` の `!{KNOWLEDGE_ROOT}` で指す knowledge の Python のルール 9 件をフックが読み込める状態にする。認証領域の `settings.json` はリンクでなく別のファイルのため、全てを書き換える。書き換える前に同じ場所へ `settings.json.bak-{日時}` を取る
  タグ: [端末の設定, 環境変数]
  実行者: planner
  時期: マージの前
  回数: 1 回限り
  可逆: true
  疎通確認: KNOWLEDGE_ROOT の追加/疎通確認.py
  実行: KNOWLEDGE_ROOT の追加/実行.py
  確認: KNOWLEDGE_ROOT の追加/確認.py
  切り戻し: KNOWLEDGE_ROOT の追加/切り戻し.py
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: '認証領域ごとに、`settings.json` の `env` の `KNOWLEDGE_ROOT` が knowledge のクローンの場所で、その `env` だけを環境変数にしてフックと同じ索引の読み込み（`load_indexes`）でこのリポジトリの `rules.yaml` を読むと、読めない理由（変数参照を展開できない）が 0 件になる'
  状態: todo
