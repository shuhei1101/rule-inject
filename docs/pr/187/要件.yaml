  - item: mdmark check の plain_md_with_marks（記法を含む文書の拡張子を .mark.md へ改名する提案）
    reason: 拡張子の改名はリンク・files.yml・index.yaml・publish の書き出しに波及し、マーカーの書き方の移行と目的が異なる。改名するか check.suggestMarkExtension を false にするかの判断が要る
    plan: to_file
  - item: publish が書き出す docs/_config.yml の exclude の並びの入れ替え
    reason: AI Monitor の develop の publish の並び順の変更で、マーカーと関係しない。次に publish を流す作業で取り込まれる
    plan: none
