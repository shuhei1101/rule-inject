配布先の mdmark の設定へのノードの種類の記載:
  説明: 配布先のリポジトリの直下の mdmark.config.yaml の map.kinds に、AI Monitor の design_docs generate が生成する図のノードの種類（external・script・data・start・question・action・result）を、AI Monitor の design_docs の定数と同じ値で記載する。ファイルが無ければ作る。ほかのキーは変えない。スクリプトは `uv run --no-project --with ruamel.yaml python -B {スクリプト} {対象のリポジトリ}` で起動する。対象のリポジトリは作業 PR のブランチの worktree の直下にし、作った直下の mdmark.config.yaml を作業 PR へ commit + push する（https://github.com/shuhei1101/ai-monitor/tree/v0.5.0/docs/pr/3462/反映作業/配布先の mdmark の設定へのノードの種類の記載）
  タグ: [設定の追記]
  実行者: planner
  時期: マージの前
  回数: 1 回限り
  可逆: true
  疎通確認: 配布先の mdmark の設定へのノードの種類の記載/疎通確認.py
  実行: 配布先の mdmark の設定へのノードの種類の記載/実行.py
  確認: 配布先の mdmark の設定へのノードの種類の記載/確認.py
  切り戻し: 配布先の mdmark の設定へのノードの種類の記載/切り戻し.py
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: 直下の mdmark.config.yaml の map.kinds に 7 つのクラスがあり、生成した設計書の Markdown を mdmark check に渡すと map_unknown_class が出ない
  状態: 未
