  - item: 「読む」と「書く操作」の置き換え
    reason: 起点 Issue の終わりの条件が、このプラグインの単語として維持すると定めている
    plan: none
  - item: docs/guide/変更履歴.md の既存の行の置き換え
    reason: リリース済みのバージョンの変更内容の記録で、その時点の PR のタイトルを写している
    plan: none
  - item: docs/pr/ の過去の PR ドキュメントの置き換え
    reason: マージ済みの作業 PR の記録で、変更すると当時の計画と食い違う
    plan: none
  - item: schemas/・skills/・.claude-plugin/・docs/README.md に残る AI slop の単語の置き換え
    reason: 起点 Issue の範囲（src・tests・hooks・設計書・docs/guide）の外
    plan: '#152'
  - item: 'docs/guide の分類名・ページ名「使い方」（`category`・`permalink: /使い方/`・ページ `使い方.md`・目次の分類）'
    reason: 公開ドキュメントの分類と URL の名前で、置き換えると公開済みの URL とサイドバーの構成が変わる。文中の単語の置き換えと別に、公開 URL を変えるかを判断する
    plan: to_file
  - item: docs/rules.yaml の 2 行目のコメント「当てるファイルの glob」
    reason: このリポジトリのルール索引で、起点 Issue の範囲（src・tests・hooks・設計書・docs/guide）の外
