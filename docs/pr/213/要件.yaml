use_cases:
  - kind: single
    scenario: docs/scenario/SC-122-26.yaml
    impact: new
    detail: 索引を配信する配信元で、project-index の書き込みが索引のエントリを rule-inject の検査にかけ、合格したエントリだけを書き込む
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-122-19.yaml
    impact: run_only
    detail: エントリの書き込みのチェックの判定を検査の CLI と共有するため、書き込みのチェックの結果が変わらないことを確かめる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-122-20.yaml
    impact: run_only
    detail: 索引のチェックの判定を検査の CLI と共有するため、チェックの結果が変わらないことを確かめる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-122-4.yaml
    impact: run_only
    detail: パッケージの定義にコマンドを追加するため、クローンから MCP サーバーを起動して接続できることを確かめる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-122-18.yaml
    impact: run_only
    detail: パッケージの定義にコマンドを追加するため、端末のセットアップが変わらず終わることを確かめる
    depends_on: []
