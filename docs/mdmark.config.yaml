# mdmark の設定。パスと glob は、このファイルのあるフォルダからの相対パスで記載する
# 端末の設定（~/.config/mdmark/settings.yaml）に重ねて読み込む。guide/ の文書は guide/mdmark.config.yaml で扱う

# この設定・文書が合わせてある mdmark のバージョン（mdmark upgrade が書き換える）
version: v0.13.0

# mdmark build がまとめる文書と、書き出す先（docs/generated/ は git 管理外）
build:
  include: ["**/*.md"]
  exclude: ["guide/**"]
  out: generated/docs.html

# mdmark check が、記法を含む .md を .mark.md へ改名するよう提案しない
check:
  suggestMarkExtension: false

# 設計書から生成した図のノードと線の種類（AI Monitor の design_docs が生成する図のクラス）
map:
  kinds:
    external:
      label: 外部
      icon: globe
      shape: pill
      color: green
    script:
      label: 処理
      icon: cog
      shape: rounded
    data:
      label: 保存先
      icon: database
      shape: rect
      color: purple
    start:
      label: 開始
      icon: play
      shape: pill
      color: blue
    question:
      label: 質問
      icon: circle-help
      shape: double
      color: orange
    action:
      label: アクション
      icon: square-pen
      shape: rounded
    result:
      label: 結果
      icon: flag
      shape: pill
      color: green
  lines:
    "-.->":
      dash: dashed
      head: open
    "==>":
      width: thick
