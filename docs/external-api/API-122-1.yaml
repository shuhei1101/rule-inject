id: API-122-1
visibility: internal
title: "dev-docs"
version:
  api_version: バージョンを持たない（MCP のツールの引数は dev-docs の develop に従う）
  checked_on: '2026-10-30'
auth:
  method: なし（127.0.0.1 で待ち受けるローカルのサーバー）
endpoints:
  - name: POST /mcp
    method: POST
    path: /mcp
    summary: 'MCP の `tools/call` で `search_docs` を呼び、使われているタグを配信元をまたいで件数つきで引く（`group_by: tags`）'
    idempotent: true
    description: 'Streamable HTTP の MCP の入口。rule-inject は `mcp` の HTTP のクライアントでセッションを開き、`search_docs` だけを呼ぶ。`search_docs` は条件に当たる文書を返す読み取りのツール（`readOnlyHint: true`）で、`group_by` を渡すと指定した項目の値ごとの件数を `groups` で返す。配列の項目は要素ごとに数え、値は NFKC と `casefold` で正規化してまとめ、付いている文書が最も多い表記で返す。`groups` は `limit` で切られない。'
    request:
      - name: source
        type: str | list[str]
        required: false
        default: 作業中の配信元
        description: 配信元の ID。`*` で読める全配信元
        notes: rule-inject は `*` を渡す
      - name: group_by
        type: str
        required: false
        description: 値ごとの件数を返す項目
        notes: rule-inject は `tags` を渡す
      - name: format
        type: Literal['markdown', 'json']
        required: false
        default: markdown
        description: 結果の形式
        notes: rule-inject は `json` を渡す
      - name: cwd
        type: str
        required: false
        description: 作業場所の絶対パス。読める配信元は、配信元の設定の `scope` の `read`・`write` にこの場所が当たるかで決まる
        notes: 'rule-inject は `project_dir` を渡す。渡さない・どの配信元の `scope` にも当たらないときは、`source: "*"` でもどの配信元も読まず `total_count` が 0 で返る（エラーにならない）'
      - name: filter
        type: Condition | Group
        required: false
        default: 全件
        description: 条件の木。`Condition` は `field`・`op`・`values`、`Group` は `and`・`or`・`not` のどれか 1 つのキーを持つ
        notes: ルール案内の `args` の `{道筋}[{field}]` がこの木に当てる。rule-inject からは渡さない
    request_example: |-
      ```json
      {"name": "search_docs", "arguments": {"source": "*", "group_by": "tags", "format": "json", "cwd": "/mnt/c/Users/shuhe/repo/shuhdev-gateway/.claude/worktrees/develop"}}
      ```
    response:
      - name: total_count
        type: int
        description: 条件に当たった文書の数
        notes: 読める配信元が無いか文書が無いときは 0 で、`groups` のキー自体が返らない
      - name: groups[].value
        type: str
        description: タグ（まとめた値の代表の表記）
        notes: "タグを持たない文書は、値が `（なし）` のグループにまとめて返る（dev-docs の develop の `src/dev_docs/features/search/service.py` の `NONE_LABEL`）。rule-inject はこの値を使われているタグに含めない。`tags` を `- name: ...` の要素で持つ配信元は、配信元の `dev-docs.yaml` の `metadata`（`tags: tags[].name`）でタグの名前を返す。その対応が無い配信元は、辞書を文字列にした値（`{'name': ...}`）を返す"
      - name: groups[].count
        type: int
        description: そのタグが付いた文書の数
    response_example: |-
      ```json
      {"total_count": 51, "returned": 20, "groups": [{"value": "python", "count": 12}, {"value": "mcp", "count": 3}]}
      ```
    status_codes:
      - code: '200'
        condition: 'ツールを呼べた（引数の誤りも `isError: true` の結果として 200 で返る）'
      - code: 接続できない
        condition: dev-docs が起動していない・接続先が違う
lead: リポジトリの文書を配信元ごとに配信し、タグや文書の種類の条件で検索・集計する文書の MCP サーバー。
used_in:
  - src/rule_inject/server/check_tools.py
verification:
  state: 済
  date: '2026-11-01'
  detail: '手元で常駐している dev-docs（`http://127.0.0.1:8781/mcp`）を dev-docs の管理ツールの `restart` で起動し直し、dev-docs の develop の d358fe3（dev-docs#50 の 9bac461 を含む）と knowledge の develop の eb35a25 の `dev-docs.yaml` で応答させた。rule-inject の `fetch_used_tags` から `check_indexes` と同じ引数（`{"source": "*", "group_by": "tags", "format": "json"}`、`cwd`: rule-inject のクローン）で呼ぶと、約 35 秒でタグ 800 件が返り、`{` で始まる値は 0 件だった。`filter[tags]` に `topic:フロントエンド`・`scope:next`・`re:^topic:`・`re:^scope:`・`topic:存在しないタグ` を持つ一時の索引で `check_indexes` を呼ぶと、`tag_check.state` が `checked`、`unused_tag_patterns` は `topic:存在しないタグ` の 1 件だけだった'
base_urls:
  - env: 既定
    url: http://127.0.0.1:8781/mcp
official_url: https://github.com/shuhei1101/dev-docs
error_format: '引数の誤りは MCP のツールの結果の `isError: true` で返り、本文に項目のパス・期待する型・実際の値が載る。'
timeout: 非機能要件（NFR-122-1）の「dev-docs への問い合わせの待ち時間」
