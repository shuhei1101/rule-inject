id: API-122-1
visibility: internal
title: "dev-docs"
version:
  api_version: バージョンを持たない（MCP のツールの引数は dev-docs の develop に従う）
  checked_on: '2026-10-30'
auth:
  method: なし（127.0.0.1 で待ち受けるローカルのサーバー）
endpoints:
  - name: POST /mcp
    method: POST
    path: /mcp
    summary: 'MCP の `tools/call` で `search_docs` を呼び出し、使用されているタグを配信元をまたいで件数つきで取得する（`group_by: tags`）'
    idempotent: true
    description: 'Streamable HTTP の MCP の入口。rule-inject は `mcp` の HTTP のクライアントでセッションを開き、`search_docs` だけを呼び出す。

      `search_docs` は条件にヒットする文書を返却する読み取りのツール（`readOnlyHint: true`）で、`group_by` を指定すると、その項目の値ごとの件数を `groups` で返却する。

      配列の項目は要素ごとに数え、値は NFKC と `casefold` で正規化してまとめ、付いている文書が最も多い表記で返却する。`groups` は `limit` で切られない。'
    request:
      - name: source
        type: str | list[str]
        required: false
        default: 作業中の配信元
        description: 配信元の ID。`*` で参照できる全配信元
        notes: rule-inject は `*` を指定する
      - name: group_by
        type: str
        required: false
        description: 値ごとの件数を返却する項目
        notes: rule-inject は `tags` を指定する
      - name: format
        type: Literal['markdown', 'json']
        required: false
        default: markdown
        description: 結果の形式
        notes: rule-inject は `json` を指定する
      - name: cwd
        type: str
        required: false
        description: 作業場所の絶対パス。参照できる配信元は、配信元の設定の `scope` の `read`・`write` にこの場所がヒットするかで決まる
        notes: 'rule-inject は `project_dir` を指定する。指定しない・どの配信元の `scope` にもヒットしないときは、`source: "*"` でもどの配信元も参照せず、`total_count` が 0 で返却される（エラーにならない）'
      - name: filter
        type: Condition | Group
        required: false
        default: 全件
        description: 条件の木。`Condition` は `field`・`op`・`values`、`Group` は `and`・`or`・`not` のどれか 1 つのキーを持つ
        notes: ルール案内の `args` の `{道筋}[{field}]` がこの木に照合する。rule-inject からは指定しない
    request_example: |-
      ```json
      {"name": "search_docs", "arguments": {"source": "*", "group_by": "tags", "format": "json", "cwd": "/mnt/c/Users/shuhe/repo/shuhdev-gateway/.claude/worktrees/develop"}}
      ```
    response:
      - name: total_count
        type: int
        description: 条件にヒットした文書の数
        notes: 参照できる配信元が無いか文書が無いときは 0 で、`groups` のキー自体が返却されない
      - name: groups[].value
        type: str
        description: タグ（まとめた値の代表の表記）
        notes: "タグを持たない文書は、値が `（なし）` のグループにまとめて返却される（dev-docs の [`NONE_LABEL`](https://github.com/shuhei1101/dev-docs/blob/develop/src/dev_docs/features/search/service.py)）。rule-inject はこの値を使用されているタグに含めない。\n`tags` を `- name: ...` の要素で持つ配信元は、配信元の `dev-docs.yaml` の `metadata`（`tags: tags[].name`）でタグの名前を返却する。その対応が無い配信元は、辞書を文字列にした値（`{'name': ...}`）を返却する"
      - name: groups[].count
        type: int
        description: そのタグが付いた文書の数
    response_example: |-
      ```json
      {"total_count": 51, "returned": 20, "groups": [{"value": "python", "count": 12}, {"value": "mcp", "count": 3}]}
      ```
    status_codes:
      - code: '200'
        condition: 'ツールを呼び出せた（引数の誤りも `isError: true` の結果として 200 で返却される）'
      - code: 接続できない
        condition: dev-docs が起動していない・接続先が違う
lead: 文書を配信元ごとに配信してタグや種類で検索・集計する dev-docs の MCP サーバーの利用方法を定め、索引のタグの検査で使用中のタグを取得する処理を修正するときに参照する。
used_in:
  - src/rule_inject/server/check_tools.py
verification:
  state: 済
  date: '2026-11-01'
  detail: '手元で常駐している dev-docs（`http://127.0.0.1:8781/mcp`）を dev-docs の管理ツールの `restart` で再起動し、dev-docs の develop の d358fe3（[metadata のタグの取り出しを含む dev-docs の変更](https://github.com/shuhei1101/dev-docs/pull/50) の 9bac461 を含む）と knowledge の develop の eb35a25 の `dev-docs.yaml` で応答させた。


    | 呼び出し | 引数 | 結果 |

    | --- | --- | --- |

    | rule-inject の `fetch_used_tags` | `check_indexes` と同じ（`{"source": "*", "group_by": "tags", "format": "json"}`、`cwd`: rule-inject のクローン） | 約 35 秒でタグ 800 件が返却され、`{` で始まる値は 0 件 |

    | `check_indexes` | `filter[tags]` に `topic:フロントエンド`・`scope:next`・`re:^topic:`・`re:^scope:`・`topic:存在しないタグ` を持つ一時の索引 | `tag_check.state` が `checked`、`unused_tag_patterns` は `topic:存在しないタグ` の 1 件だけ |'
base_urls:
  - env: 既定
    url: http://127.0.0.1:8781/mcp
official_url: https://github.com/shuhei1101/dev-docs
error_format: '引数の誤りは MCP のツールの結果の `isError: true` で返却され、本文に項目のパス・期待する型・実際の値が含まれる。'
timeout: 非機能要件「dev-docs への問い合わせの待ち時間」
refs:
  - NFR-122-1#requirements[dev-docs への問い合わせの待ち時間]
