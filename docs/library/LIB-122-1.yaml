id: LIB-122-1
visibility: internal
title: "claude-code"
kind: "CLI"
version:
  current: 2.1.296
  checked_on: '2026-10-13'
  source: '`claude --version`'
catalogs:
  - name: フック
    version: 2.1.284
    entries:
      - name: PreToolUse
        kind: フック
        purpose: ツールの呼び出しの直前に、案内（`permissionDecision` / `permissionDecisionReason` / `additionalContext`）と引数の置き換え（`updatedInput`）を返却する
      - name: PostToolUse
        kind: フック
        purpose: ツールの呼び出しの後に、参照した場所を既読として記録する
      - name: PreCompact
        kind: フック
        purpose: 圧縮の前に既読の記録を削除する
      - name: SessionStart
        kind: フック
        purpose: セッションの開始時に作業の決まりをコンテキストへ追加し、保持期間を過ぎた既読の記録を削除する
  - name: プラグインのファイル
    version: 2.1.284
    entries:
      - name: .claude-plugin/plugin.json
        kind: ファイル
        purpose: プラグインの名前
      - name: hooks/hooks.json
        kind: ファイル
        purpose: フックの出来事・matcher・コマンド・timeout
      - name: CLAUDE_PLUGIN_ROOT
        kind: 環境変数
        purpose: フックの中でプラグインの場所を指す
      - name: .claude-plugin/marketplace.json
        kind: ファイル
        purpose: リポジトリを marketplace として公開し、`/plugin marketplace add` と `/plugin install` でインストールできるようにする
      - name: .mcp.json
        kind: ファイル
        purpose: プラグインのルートに配置し、MCP サーバーの接続先を配布する。`${変数:-既定}` を展開し、`plugin:{プラグイン}:{サーバー}` の名前で接続する。`claude --plugin-dir {フォルダ} mcp list` で確認できる（2.1.318）
      - name: skills/{名前}/SKILL.md
        kind: ファイル
        purpose: プラグインのスキル。`/{プラグイン}:{名前}` で呼び出す
  - name: セッションの記録
    version: 2.1.296
    entries:
      - name: attachment.type が hook_additional_context の行
        kind: 記録の行
        purpose: フックが返却した案内の文面を記録する、セッションの記録（`.jsonl`）の行。案内の回数はこの行の数で数える
        description: '`type` が `attachment`、`attachment.type` が `hook_additional_context`。`attachment.content` は文字列の配列で、行の直下の `rendered[].content` に `<system-reminder>` で包んだコピーを持つ。'
lead: プラグインのフックと MCP サーバーを読み込む Claude Code の CLI の利用方法を定め、フックの登録や出来事ごとの呼び出しを調べるときに参照する。
dependency_scope: 必須
adoption: 採用
upstream: anthropics/claude-code
license: Anthropic の商用利用規約（オープンソースではない）
docs_url: https://code.claude.com/docs/en/hooks
verification:
  state: 未確認
  date: '2026-09-29'
  detail: |-
    [PoC 検証](https://github.com/shuhei1101/rule-inject/pull/4) と設計の工程で、`-p` での `updatedInput` の注入・`permissionDecisionReason` の長さ・`/compact` での `PreCompact` を確認した。
    本実装のフックは、入力の JSON を標準入力へ指定する単体テストで確認し、`claude plugin validate` でプラグインと marketplace のマニフェストの検査に合格した。
    実際の Claude Code で本実装のフックを動かす確認は API の利用（課金）が要るため、E2E テストで tester が実施する
