visibility: internal
title: sse-starlette
lead: |-
  Server-Sent Events のストリームを返却する sse-starlette の利用方法を定め、サーバーの停止時のストリームの扱いを修正するときに参照する。
kind: ライブラリ
purl: pkg:pypi/sse-starlette
dependency_scope: 任意
adoption: 採用
used_in:
  - src/rule_inject/server/__main__.py
upstream: sysid/sse-starlette
verification:
  state: 済
  date: '2026-11-10'
  detail: |-
    3.5.0（uv.lock）で、`MCPServer.streamable_http_app(host="127.0.0.1")` を uvicorn 0.54.0 の `Server`（`timeout_graceful_shutdown=3`）で待ち受け、mcp 2.2.0 の `streamable_http_client` で、`delay` 秒待ってから戻るツールを呼んだ。ツールの中で `exit_after` 秒後に `should_exit` を立てた（各 3 回、2026-11-10、WSL）。

    | delay | exit_after | クライアントの結果 | `should_exit` から `serve()` が戻るまで |
    | --- | --- | --- | --- |
    | 0 | 0.3 | 3 回とも応答を受け取った | 0.10〜0.13 秒 |
    | 0.3 | 0 | 3 回とも応答を受け取れず、接続が切れた | 0.31〜0.34 秒 |
    | 0.5 | 0 | 3 回とも `SSE stream ended without a response` | 0.51〜1.50 秒 |
    | 1.0 | 0.2 | 3 回とも `SSE stream ended without a response` | 1.31〜1.38 秒 |

    応答を送信し終える前に `should_exit` が立つと、POST の応答のストリームは `timeout_graceful_shutdown` を待たずに取り消される。
version:
  current: 3.5.0
  checked_on: '2026-11-10'
  source: '`uv.lock`（`mcp` の依存）'
license: BSD-3-Clause（商用利用可）
official_url: https://github.com/sysid/sse-starlette
docs_url: https://github.com/sysid/sse-starlette#readme
selection:
  candidates: '`mcp` が依存に持つ sse-starlette だけを候補にした。'
  decision: '`mcp` の Streamable HTTP は GET と POST のどちらの応答にも `EventSourceResponse` を使うため、直接は呼ばず、停止の振る舞いだけを既定のまま使う。'
  consequences: 依存は `mcp` の依存のまま増やさない。版は `mcp` の依存の範囲に従う
catalogs:
  - name: API
    version: 3.5.0
    entries:
      - name: EventSourceResponse
        kind: クラス
        purpose: SSE のストリームを返す応答。停止を検知すると、送信しているストリームを取り消す
        params:
          - name: shutdown_grace_period
            type: '`float`'
            required: false
            default: '`0`'
            description: 停止を検知してから、ストリームを取り消すまでに待つ秒数
      - name: AppStatus.enable_automatic_graceful_drain
        kind: 属性
        purpose: 既定の `True` のとき、uvicorn の `Server.should_exit` を停止の合図として扱う
notes:
  停止の検知: |-
    ストリームを開いたイベントループごとに監視のタスクを 1 つ動かし、0.5 秒ごとに、SIGTERM のハンドラから取り出した uvicorn の `Server` の `should_exit` を確認する。
    立っていれば、そのイベントループの全ての `EventSourceResponse` を `shutdown_grace_period` の後に取り消す。
    確認が 0.5 秒ごとのため、`should_exit` を立ててから取り消すまでの時間は 0〜0.5 秒で揺れる。
id: LIB-122-6
