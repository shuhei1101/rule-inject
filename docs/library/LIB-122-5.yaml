id: LIB-122-5
visibility: internal
title: "uvicorn"
kind: "ライブラリ"
version:
  current: 0.54.0
  checked_on: '2026-11-06'
  source: '`uv.lock`（`mcp` の依存）'
catalogs:
  - name: API
    version: 0.54.0
    entries:
      - name: Config
        kind: クラス
        purpose: 待ち受けのアプリ・アドレス・ポートと、停止の待ちの上限を持つ
        params:
          - name: app
            type: ASGI のアプリ
            required: true
            description: '`MCPServer.streamable_http_app()` が返却する Starlette のアプリ'
          - name: host
            type: '`str`'
            required: false
            default: '`"127.0.0.1"`'
            description: 待ち受けるアドレス
          - name: port
            type: '`int`'
            required: false
            default: '`8000`'
            description: 待ち受けるポート
          - name: timeout_graceful_shutdown
            type: '`int | None`'
            required: false
            default: '`None`'
            description: 待ち受けを閉じた後、残った接続とタスクの終わりを待つ上限（秒）。`None` は上限なし。過ぎたら残りのタスクをキャンセルする
      - name: Server
        kind: クラス
        purpose: '`Config` で待ち受ける。`run()` は Ctrl+C・SIGTERM で止まるまで戻らない'
      - name: Server.should_exit
        kind: 属性
        purpose: 真にすると、次の周回で待ち受けを閉じて停止を始める（`run()` が戻る）
      - name: Server.started
        kind: 属性
        purpose: 待ち受けを始めたら真になる
lead: ASGI のアプリを HTTP で待ち受ける uvicorn の利用方法を定め、MCP サーバーの待ち受けや停止を修正するときに参照する。
purl: pkg:pypi/uvicorn
upstream: encode/uvicorn
verification:
  state: 済
  date: '2026-11-06'
  detail: |-
    0.54.0（uv.lock）で、`MCPServer.streamable_http_app(host="127.0.0.1")` を `Config(app, host, port, timeout_graceful_shutdown=...)` の `Server` で待ち受け、mcp 2.2.0 の `streamable_http_client` の `ClientSession` で `initialize` とツールの呼び出しをした後、接続を開いたままにして `should_exit` を真にした。
    `timeout_graceful_shutdown` が 3・0・`None` のいずれでも、GET のストリームが切られて `serve()` は 0.25〜0.44 秒で戻った（2026-11-06、WSL）。
    Claude Code のクライアントでの停止の時間は測っていない。上限は、クライアントが接続を閉じないときに停止が終わらなくなるのを防ぐために指定する
license: BSD-3-Clause（商用利用可）
official_url: https://github.com/encode/uvicorn
docs_url: https://www.uvicorn.org/settings/
dependency_scope: 任意
adoption: 採用
selection:
  candidates: '`mcp` が依存に持つ uvicorn だけを候補にした。'
  decision: '`MCPServer.run` は `Server` と `timeout_graceful_shutdown` を公開しないため、再起動で待ち受けを閉じるのに `Server` を直接使用する。'
  consequences: 依存は `mcp` の依存のまま増やさない。バージョンは `mcp` の依存の範囲に従う
used_in:
  - src/rule_inject/server/__main__.py
