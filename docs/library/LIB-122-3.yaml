id: LIB-122-3
visibility: internal
title: "mcp"
kind: "ライブラリ"
version:
  current: 2.2.0
  latest: 2.2.0
  checked_on: '2026-09-29'
  source: '`uv.lock`'
  pinning: '`mcp>=2.2,<3`'
catalogs:
  - name: API
    version: 2.2.0
    entries:
      - name: MCPServer
        kind: クラス
        purpose: stdio か Streamable HTTP の MCP サーバーを作る（`mcp.server.mcpserver`）
        params:
          - name: name
            type: '`str | None`'
            required: false
            default: '`None`'
            description: サーバーの名前
          - name: instructions
            type: '`str | None`'
            required: false
            default: '`None`'
            description: '`initialize` の応答の `instructions` に入る文面'
            notes: Claude Code は接続時に server instructions を参照する（[Connect Claude Code to tools via MCP](https://code.claude.com/docs/en/mcp)。上限 4,096 字）
      - name: MCPServer.tool
        kind: デコレータ
        purpose: 関数をツールとして登録し、引数の型と docstring から入力の Schema と説明を作る
      - name: MCPServer.run
        kind: メソッド
        purpose: stdio か Streamable HTTP でサーバーを動かす
        params:
          - name: transport
            type: '`"stdio" | "sse" | "streamable-http"`'
            required: false
            default: '`"stdio"`'
            description: 待ち受けの方式
          - name: host
            type: '`str`'
            required: false
            default: '`"127.0.0.1"`'
            description: HTTP で待ち受けるアドレス
            notes: '`streamable-http` のときだけ使用する'
          - name: port
            type: '`int`'
            required: false
            default: '`8000`'
            description: HTTP で待ち受けるポート
            notes: '`streamable-http` のときだけ使用する'
          - name: streamable_http_path
            type: '`str`'
            required: false
            default: '`"/mcp"`'
            description: MCP の要求を受けるパス
        params_example: |-
          ```python
          from mcp.server import MCPServer

          server = MCPServer("rule-inject")
          server.run("streamable-http", host="127.0.0.1", port=60808)
          ```
      - name: streamable_http_client
        kind: 関数
        purpose: Streamable HTTP の MCP サーバーへ接続し、`ClientSession` でツールを呼び出す
        description: 接続できないときは、`ClientSession.initialize()` で `httpx2.ConnectError`（`httpx2.HTTPError` の子）を包んだ `ExceptionGroup` が送出される。HTTP のクライアントは依存の `httpx2` で、`httpx` は依存に含まれない。MCP のエラーの例外は `mcp.shared.exceptions.MCPError`
        status: planned
lead: Model Context Protocol の公式の Python SDK の利用方法を定め、MCP サーバーのツールや接続を実装・修正するときに参照する。
purl: pkg:pypi/mcp
dependency_scope: 任意
adoption: 採用
upstream: modelcontextprotocol/python-sdk
license: MIT（商用利用可）
official_url: https://github.com/modelcontextprotocol/python-sdk
verification:
  state: 済
  date: '2026-10-28'
  detail: |-
    本実装で 2.2.0（uv.lock）の `MCPServer.tool`（`name`・`meta`・`Annotated` の `Field` による引数の説明）を、単体テストのインメモリのクライアントと stdio の子プロセスで動かし、ツールの一覧の `_meta`・引数の説明・`ToolError` のエラー応答が想定どおりに返却されることを確認した。

    | 確認した対象 | 確認した場所 | 結果 |
    | --- | --- | --- |
    | Claude Code からの stdio の呼び出し | [PoC 検証](https://github.com/shuhei1101/rule-inject/pull/4) | 呼び出せる |
    | Streamable HTTP の待ち受け（`run("streamable-http", host="127.0.0.1", port=...)`） | [PoC 検証](https://github.com/shuhei1101/rule-inject/pull/60) | 127.0.0.1 だけで待ち受ける。`claude mcp add --transport http -s user` で登録した Claude Code（2.1.312）の `claude -p` からツールを呼び出すと、`permission_denials` が空で戻り値が返却される。サーバーを停止しても `claude -p` が応答する |
selection:
  candidates: 公式の Python SDK（`mcp`）だけを候補にした。
  decision: 構成方針（MCP サーバーは Python の uv のプロジェクト）に合う公式の実装で、stdio のサーバーを数行で実装できる。
  consequences: |-
    2.x で `FastMCP` が `MCPServer`（`mcp.server.mcpserver`）に改名されているため、1.x の書き方は使用しない。メジャーバージョンで API が変わるので `<3` で固定する。

    プラグインの MCP サーバーを廃止し（[MCP サーバーと read_rules の廃止](https://github.com/shuhei1101/rule-inject/pull/44)）、プラグインの依存から除外した。
used_in:
  - src/rule_inject/server/app.py
  - src/rule_inject/server/tools.py
  - src/rule_inject/server/_format.py
  - src/rule_inject/server/dev_docs.py
