id: ER-122-1
visibility: internal
title: "ER 図: ログ"
lead: フックが失敗した操作を後から追えるように書き出すログの構造を定め、ログの項目や保持を変えるときに参照する。
tables:
  - name: '{log_dir}/{yyyymmdd}_rule-inject.log'
    title: ログ
    source: 'DATA-181-1#'
    datastore: JSON Lines（UTF-8、1 行 = 1 件）
    summary: 失敗した操作とその理由
    scale: '1 日 1 ファイル。失敗が続いても 1 ファイル数 MB で、残るのは非機能要件「ログの保持日数」の分のファイル'
    growth: 失敗のたびに、その時刻（UTC）の日付のファイルへ 1 行追記する。ファイルが無ければ作る
    retention: 'ファイル名の日付が今日（UTC）から非機能要件「ログの保持日数」以上前になったら、次のセッションの開始で削除する'
    deletion: ファイルごとの物理削除。利用者が手動で削除してもよい
    access: 追記（O_APPEND）だけで書き込む。プラグインは読み込まない
    description: |-
      フックの標準出力は Claude Code への応答の JSON だけにし、失敗はこのファイルへ書き込む。
      このファイルにも書き込めないときは、同じ 1 行を標準エラー出力へ出力する（Claude Code のデバッグのログに記録される）。

      | 記号 | 値 |
      | --- | --- |
      | `{log_dir}` | [設定: プラグイン](id:CFG-122-1) の `global.log_dir`。既定は `RULE_INJECT_STATE_DIR` の下の `logs`、無ければ `${XDG_STATE_HOME:-~/.local/state}/rule-inject/logs`。設定ファイルを読み込めなかったことのログは既定のフォルダへ書き込む |
      | `{yyyymmdd}` | `time` の UTC の日付 |
    columns:
      - name: time
        title: 時刻
        source: 'DATA-181-1#fields[time]'
        type: string
        not_null: true
        description: 'タイムゾーン付き ISO 8601 の文字列（`2026-09-29T08:00:00+00:00`）'
      - name: component
        title: 出した元
        source: 'DATA-181-1#fields[component]'
        type: string
        not_null: true
        description: 'データのキーの値をそのまま書く'
      - name: session_id
        title: セッション
        source: 'DATA-181-1#fields[session_id]'
        type: string
        not_null: false
        description: 'データのキーの値をそのまま書く'
      - name: operation
        title: 失敗の操作
        source: 'DATA-181-1#fields[operation]'
        type: string
        not_null: true
        description: 'データのキーの値をそのまま書く'
      - name: path
        title: 対象のパス
        source: 'DATA-181-1#fields[path]'
        type: string
        not_null: false
        description: 'データのキーの値をそのまま書く'
      - name: reason
        title: 理由
        source: 'DATA-181-1#fields[reason]'
        type: string
        not_null: true
        description: 'データのキーの値をそのまま書く'
