id: MOD-122-32
visibility: internal
title: "プラグイン / フック / work_rules.py"
test_files:
  - tests/unit/rule_inject/hooks/test_work_rules.py
functions:
  - name: work_rules
    title: 圧縮の後の通知の処理
    container: hooks/work_rules.py
    usecase: 圧縮で既読の記録が捨てられる
    summary: 圧縮の後に、削除できずに残った記録か設定ファイルが読めない理由を通知する
    kind: フック
    scope: public
    inherits: HookHandler
    args:
      - name: payload
        type: dict[str, Any]
        required: true
        passing: positional
        description: SessionStart の入力
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 環境変数
    returns:
      type: dict[str, Any] | None
      description: 通知があれば additionalContext にその通知。無ければ `None`（`run_hook` は何も出力しない）
    unit_tests:
      - name: test_work_rules
        case: 正常
        summary: 圧縮の後でなければ何も返却しない
        condition: '`source: startup`'
        mock: なし
        expected: '`None`'
      - name: test_work_rules_when_record_left_after_compact
        case: 正常
        summary: 圧縮の後の削除できずに残った記録を通知する
        condition: '`source: compact` で記録ファイルがある'
        mock: なし
        expected: additionalContext が `LEFTOVER_NOTICE` に記録ファイルとログの場所を入れた文だけ
      - name: test_work_rules_when_no_record_after_compact
        case: 正常
        summary: 圧縮の後でも記録が無ければ何も返却しない
        condition: '`source: compact` で記録ファイルが無い'
        mock: なし
        expected: '`None`'
      - name: test_work_rules_when_settings_unreadable_after_compact
        case: 正常
        summary: 圧縮の後に設定ファイルが読めなければ理由を通知する
        condition: '`source: compact`。`RULE_INJECT_CONFIG` が実在しないファイルを指す。`XDG_STATE_HOME` は一時フォルダ'
        mock: なし
        expected: additionalContext が `SETTINGS_FAILURE_SUMMARY` で始まり、設定ファイルの場所と理由・ログの場所を含む。ログに `read_settings` が 1 行
      - name: test_work_rules_when_settings_unreadable_at_startup
        case: 正常
        summary: 圧縮の後でなければ設定ファイルを読まない
        condition: '`source: startup`。`RULE_INJECT_CONFIG` が実在しないファイルを指す。`XDG_STATE_HOME` は一時フォルダ'
        mock: なし
        expected: '`None`。ログのファイルが無い'
    process: |-
      1. `source` が `compact` でないか、session_id の形式が外れていれば、設定ファイルを読まずに `None` を返却する
      2. `load_settings(env)` で設定を読む。SettingsReadError なら `settings_failure_notice` でログ（`read_settings`）へ記録し、その通知を additionalContext で返却する
      3. `record_exists(settings.state_dir, session_id)` が真なら `LEFTOVER_NOTICE`（記録ファイルと `settings.log_dir` の場所）を additionalContext で返却する。偽なら `None` を返却する
