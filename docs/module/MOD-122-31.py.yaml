id: MOD-122-31
visibility: internal
title: "プラグイン / フック / sweep_read.py"
test_files:
  - tests/unit/rule_inject/hooks/test_sweep_read.py
functions:
  - name: sweep_read
    title: 既読の記録の掃除の処理
    container: hooks/sweep_read.py
    usecase: 終わったセッションの既読の記録が掃除される
    summary: 保持期間を過ぎた別のセッションの既読の記録ファイル・案内済みの記録ファイル、変更前のログ、保持日数を過ぎたログのファイルを削除し、失敗をログへ書き込む
    kind: フック
    scope: public
    inherits: HookHandler
    args:
      - name: payload
        type: dict[str, Any]
        required: true
        passing: positional
        description: SessionStart の入力
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 環境変数
    returns:
      type: None
      description: 常に出力しない
    process: |-
      1. session_id の形式に合わなければ何もしない
      2. `load_settings(env)` で設定を読み込む。SettingsReadError なら `log_settings_failure` でログ（`read_settings`）へ書き込んで終える（何も削除しない）
      3. 失敗は全て `write_log(settings.log_dir, component=sweep_read, ...)` で記載する
      4. `sweep_records(settings.state_dir, session_id, retention_days=settings.record_retention_days)` を呼び、返った RecordDeleteError ごとにログ（`delete_record`）へ書き込む
      5. `delete_legacy_log(settings.state_dir)` を呼び、LogDeleteError が返ればログ（`delete_log`）へ書き込む
      6. `sweep_logs(settings.log_dir, settings.log_retention_days)` を呼び、返った LogDeleteError ごとにログ（`delete_log`）へ書き込む
    unit_tests:
      - name: test_sweep_read
        case: 正常
        summary: 保持期間を過ぎた記録を削除する
        condition: 最終更新が 31 日前の別のセッションの記録ファイル
        mock: なし（最終更新は `os.utime` で戻す）
        expected: 記録ファイルが無い
      - name: test_sweep_read_when_invalid_session_id
        case: 正常
        summary: session_id の形式に合わなければ何も削除しない
        condition: '`session_id` が `../x`、最終更新が 31 日前の記録ファイル'
        mock: なし
        expected: 記録ファイルが残る
      - name: test_sweep_read_when_undeletable
        case: 正常
        summary: 削除できず、ログにも書き込めないとき標準エラー出力に書き込む
        condition: 最終更新が 31 日前の記録ファイル、書き込み権限の無い記録フォルダと、書き込み権限の無い空のログのフォルダ（設定ファイルの `global.log_dir`）
        mock: なし
        expected: '標準エラー出力に `component: sweep_read`・`operation: delete_record`'
      - name: test_sweep_read_when_old_logs
        case: 正常
        summary: 保持日数を過ぎたログのファイルを削除する
        condition: 設定ファイルの `global.log_dir` に日付が今日と 3 日前（UTC）のログのファイル
        mock: なし
        expected: 3 日前のファイルが無く、今日のファイルが残る
      - name: test_sweep_read_when_legacy_log
        case: 正常
        summary: 変更前のログを削除する
        condition: 記録フォルダに最終更新が今の `rule-inject.log`
        mock: なし
        expected: '`rule-inject.log` が無い'
      - name: test_sweep_read_when_guided
        case: 正常
        summary: 保持期間を過ぎた案内済みの記録も削除する
        condition: 最終更新が 31 日前の別のセッションの `{id}.guided.txt`
        mock: なし（最終更新は `os.utime` で戻す）
        expected: '`{id}.guided.txt` が無い'
      - name: test_sweep_read_when_settings_unreadable
        case: 正常
        summary: 設定ファイルが読み込めないときはログに書き込むだけで何も削除しない
        condition: '設定ファイルが `global.log_retention_days: 0` を持つ。`XDG_STATE_HOME` は一時フォルダで、その下の `rule-inject/logs` に日付が 3 日前（UTC）のログのファイル'
        mock: なし
        expected: 3 日前のファイルが残る。今日のログのファイルに `read_settings` が 1 行
      - name: test_sweep_read_when_retention_configured
        case: 正常
        summary: 設定ファイルの保持の日数で、記録ファイルとログのファイルを削除する
        condition: '設定ファイルが `global.record_retention_days: 1`・`global.log_retention_days: 1` を持つ。最終更新が 2 日前の別のセッションの記録ファイル、日付が今日と 1 日前（UTC）のログのファイル'
        mock: なし
        expected: 記録ファイルと 1 日前のログのファイルが無く、今日のログのファイルが残る
lead: セッションの開始時に保持期間を過ぎた既読の記録とログを削除するフックの処理を定め、記録の掃除を修正するときに参照する。
