id: MOD-122-44
visibility: internal
title: "MCP サーバー / サーバー / types.py"
enums:
  - name: ResponseFormat
    title: 応答の形式
    container: server/types.py
    usecase: 共通
    summary: 読み込むツールの `format`（Literal）
    values:
      - value: markdown
        title: Markdown
        description: 同じ項目を Markdown の表で text に入れ、structuredContent を返却しない
      - value: json
        title: JSON
        description: structuredContent と text に同じ JSON を入れる
  - name: TagCheckState
    title: タグの確認の結果
    container: server/types.py
    usecase: 索引をチェックする
    summary: インターフェース定義「索引のチェック」の `tag_check.state`（Literal）
    values:
      - value: checked
        title: 確認した
        description: project-index のタグに照らした
      - value: skipped
        title: 飛ばした
        description: project-index に届かず、または読み込める文書が 0 件で飛ばした
      - value: no_patterns
        title: 確認するパターンが無い
        description: タグのパターンが無く、project-index に問い合わせなかった
  - name: UpdateState
    title: 更新の結果
    container: server/types.py
    usecase: rule-injectを更新する
    summary: インターフェース定義「サーバーの更新」の `state`（Literal）
    values:
      - value: up_to_date
        title: 最新
        description: 上流に取り込む commit が無く、何も変えなかった
      - value: restarting
        title: 再起動中
        description: 取り込んで再起動を始めた
      - value: migration_required
        title: 移し替えが要る
        description: 取り込んだが、設定の移し替えが要るため再起動しなかった
data_models:
  - name: RuleEntry
    title: 有効なエントリ
    container: server/types.py
    usecase: 有効なルールの一覧を確認する
    role: DTO
    summary: インターフェース定義「ルールの一覧」の `entries[]`
    properties:
      - name: index
        type: str
        description: エントリを持つ索引の場所
      - name: position
        type: int
        description: 索引の `rules` の中の位置
      - name: rev
        type: str
        description: エントリのバージョン
      - name: rule
        type: str
        description: 解いたルールの場所
      - name: paths
        type: list[str]
        description: 索引に記載したままのパターン
      - name: exclude
        type: list[str]
        description: 同上
      - name: tools
        type: list[str]
        description: 同上
      - name: args
        type: dict[str, list[str]]
        description: 同上
      - name: on
        type: list[Operation]
        description: '`default_on` を埋めた操作の種別（`OPERATIONS` の順）'
      - name: read_by
        type: list[dict[str, Any]]
        description: 索引に記載したままの `read_by`
      - name: read_tool
        type: dict[str, Any] | None
        description: 索引に記載したままの `read_tool`。記載しないエントリは None
  - name: IndexIssue
    title: 索引ごとの理由
    container: server/types.py
    usecase: 有効なルールの一覧を確認する
    role: DTO
    summary: '`unreadable_indexes[]`'
    properties:
      - name: index
        type: str
        description: 読み込めない索引の場所
      - name: reason
        type: str
        description: フックが案内に記載する理由
  - name: EntryIssue
    title: 照合に使用しないエントリ
    container: server/types.py
    usecase: 有効なルールの一覧を確認する
    role: DTO
    summary: '`skipped_entries[]` と `disabled_entries[]`'
    properties:
      - name: index
        type: str
        description: エントリを持つ索引の場所
      - name: position
        type: int
        description: 位置
      - name: rev
        type: str
        description: バージョン
      - name: rule
        type: str
        description: 索引に記載したままの `rule`
      - name: reason
        type: str | None
        description: スキップした理由。`disabled_entries` では応答に含めない（`exclude_none`）
  - name: ListRulesResult
    title: ルールの一覧の応答
    container: server/types.py
    usecase: 有効なルールの一覧を確認する
    role: DTO
    summary: インターフェース定義「ルールの一覧」のレスポンス
    properties:
      - name: success
        type: bool
        description: 常に `True`
      - name: output
        type: str
        description: 索引の数と各一覧の件数の 1 行
      - name: config_path
        type: str | None
        description: 設定ファイルの場所
      - name: indexes
        type: list[str]
        description: 読み込む索引の場所
      - name: entries
        type: list[RuleEntry]
        description: 有効なエントリのこのページ
      - name: unreadable_indexes
        type: list[IndexIssue]
        description: 先頭のページだけ
      - name: skipped_entries
        type: list[EntryIssue]
        description: 先頭のページだけ
      - name: disabled_entries
        type: list[EntryIssue]
        description: 先頭のページだけ
      - name: total
        type: int
        description: 有効なエントリの総数
      - name: next_cursor
        type: str | None
        description: 続きの位置
  - name: RuleMatch
    title: ヒットしたルール
    container: server/types.py
    usecase: 操作に該当するルールを検索する
    role: DTO
    summary: '`matched[]`'
    properties:
      - name: rule
        type: str
        description: 解いたルールの場所
      - name: blocking
        type: bool
        description: 未読のときに操作を止めるか
      - name: entries
        type: list[EntryRef]
        description: ヒットしたエントリ（`index`・`position`）
  - name: EntryRef
    title: エントリの場所
    container: server/types.py
    usecase: 操作に該当するルールを検索する
    role: DTO
    summary: '`matched[].entries[]`'
    properties:
      - name: index
        type: str
        description: 索引の場所
      - name: position
        type: int
        description: 位置
  - name: SearchRulesResult
    title: ルールの検索の応答
    container: server/types.py
    usecase: 操作に該当するルールを検索する
    role: DTO
    summary: インターフェース定義「ルールの検索」のレスポンス
    properties:
      - name: success
        type: bool
        description: 常に `True`
      - name: output
        type: str
        description: ヒットしたルールと止めるルールの件数の 1 行
      - name: config_path
        type: str | None
        description: 設定ファイルの場所
      - name: operation
        type: Operation
        description: 照合に使用した操作の種別
      - name: matched
        type: list[RuleMatch]
        description: ヒットしたルール
      - name: unreadable_indexes
        type: list[IndexIssue]
        description: 読み込めない索引
      - name: skipped_entries
        type: list[EntryIssue]
        description: スキップしたエントリ
  - name: IndexReport
    title: 索引ごとのチェックの結果
    container: server/types.py
    usecase: 索引をチェックする
    role: DTO
    summary: インターフェース定義「索引のチェック」の `indexes[]`。`IndexCheck` の問題を種類ごとの一覧に分ける
    properties:
      - name: index
        type: str
        description: 索引の場所
      - name: hook_error
        type: str | None
        description: '`hook_error` の理由'
      - name: violations
        type: list[dict[str, str]]
        description: '`violation` の `location`・`reason`'
      - name: missing_rules
        type: list[dict[str, Any]]
        description: '`missing_rule` の `position`・`rule`（理由に入れた解いた場所）'
      - name: skipped_entries
        type: list[dict[str, Any]]
        description: '`skipped_entry` の `position`・`reason`'
      - name: origin
        type: Literal["global", "project"]
        description: 索引の出所。`Settings.project_indexes` に入っていれば `project`
      - name: unmatched_paths
        type: list[dict[str, Any]]
        description: '`unmatched_path` の `position`・`rev`・`rule`（理由に入れた解いた場所）'
      - name: unused_tag_patterns
        type: list[dict[str, Any]]
        description: 使用されていないタグのパターンの `position`・`rev`・`location`・`key`・`pattern`（`TagPattern.pattern.source`）
        default: 空のリスト
  - name: CheckIndexesResult
    title: 索引のチェックの応答
    container: server/types.py
    usecase: 索引をチェックする
    role: DTO
    summary: インターフェース定義「索引のチェック」のレスポンス
    properties:
      - name: success
        type: bool
        description: 常に `True`
      - name: output
        type: str
        description: 索引の数と問題の件数の 1 行
      - name: config_path
        type: str | None
        description: 設定ファイルの場所
      - name: problem_count
        type: int
        description: 問題の件数の合計
      - name: indexes
        type: list[IndexReport]
        description: 索引ごとの結果（フックが読み込む順）
      - name: unmatched_scan
        type: UnmatchedScanReport
        description: '`paths` のヒットしないエントリの検出の状態'
      - name: tag_check
        type: TagCheckReport
        description: 使用されていないタグのパターンの確認の結果
        default: '`TagCheckReport(state="no_patterns", reason=None)`'
  - name: WriteEntryResult
    title: エントリの書き込みの応答
    container: server/types.py
    usecase: 索引のエントリを編集する
    role: DTO
    summary: インターフェース定義「エントリの書き込み」のレスポンス（`success`・`output`・`index`・`position`・`rev`・`written`・`diff`）
    properties:
      - name: success
        type: bool
        description: 常に `True`（書き込めないときは ToolError）
      - name: output
        type: str
        description: 書き込んだ索引と位置の 1 行
      - name: index
        type: str
        description: '`EditResult.index`'
      - name: position
        type: int
        description: '`EditResult.position`'
      - name: rev
        type: str
        description: '`EditResult.rev`'
      - name: written
        type: bool
        description: '`EditResult.written`'
      - name: diff
        type: str
        description: '`EditResult.diff`'
  - name: DeleteEntryResult
    title: エントリの削除の応答
    container: server/types.py
    usecase: 索引のエントリを編集する
    role: DTO
    summary: インターフェース定義「エントリの削除」のレスポンス（`success`・`output`・`index`・`rule`・`written`・`diff`）
    properties:
      - name: success
        type: bool
        description: 常に `True`
      - name: output
        type: str
        description: 削除した索引と位置の 1 行
      - name: index
        type: str
        description: '`EditResult.index`'
      - name: rule
        type: str
        description: '`EditResult.rule`'
      - name: written
        type: bool
        description: '`EditResult.written`'
      - name: diff
        type: str
        description: '`EditResult.diff`'
  - name: UnmatchedScanReport
    title: paths のヒットしないエントリの検出の状態
    container: server/types.py
    usecase: 索引をチェックする
    role: DTO
    summary: インターフェース定義「索引のチェック」の `unmatched_scan`
    properties:
      - name: completed
        type: bool
        description: 最後まで辿れたか
      - name: scanned_files
        type: int
        description: 最初の呼び出しから辿ったファイルの数
      - name: reason
        type: str | None
        description: 終えられなかった理由（上限の秒数と `cursor` の使用方法）
      - name: next_cursor
        type: str | None
        description: '`_encode_scan_cursor` の文字列'
  - name: ReadSummary
    title: 参照方法ごとの既読のまとめ
    container: server/types.py
    usecase: 既読の記録を確認する
    role: DTO
    summary: インターフェース定義「既読の記録の確認」の `rules[].reads[]`
    properties:
      - name: method
        type: ReadMethod
        description: 既読の履歴に残る参照方法
      - name: tool
        type: str
        description: 既読にしたツールの名前
      - name: last_time
        type: str
        description: その参照方法とツールで最後に既読にした時刻（履歴の `time` のまま）
      - name: count
        type: int
        description: その参照方法とツールで既読にした回数
  - name: RuleRead
    title: 既読のルール
    container: server/types.py
    usecase: 既読の記録を確認する
    role: DTO
    summary: インターフェース定義「既読の記録の確認」の `rules[]`
    properties:
      - name: location
        type: str
        description: 既読のルールの場所
      - name: state
        type: ReadState
        description: 今の本文と既読にした時点の本文の関係
      - name: reads
        type: list[ReadSummary]
        description: 参照方法とツール名の組ごとのまとめ（最後に既読にした時刻の古い順）
  - name: RecordSessionItem
    title: 既読の記録のあるセッション
    container: server/types.py
    usecase: 既読の記録を確認する
    role: DTO
    summary: インターフェース定義「既読の記録の確認」の `sessions[]`
    properties:
      - name: session_id
        type: str
        description: セッションの識別子
      - name: updated_at
        type: str
        description: 既読の記録のファイルの最終更新の時刻（ISO 8601、UTC）
      - name: rule_count
        type: int
        description: 既読のルールの場所の数
  - name: ReadRecordsResult
    title: 既読の記録の確認の応答
    container: server/types.py
    usecase: 既読の記録を確認する
    role: DTO
    summary: インターフェース定義「既読の記録の確認」のレスポンス
    properties:
      - name: success
        type: bool
        description: 常に `True`
      - name: output
        type: str
        description: ルールまたはセッションの件数の 1 行
      - name: config_path
        type: str | None
        description: 設定ファイルの場所
      - name: state_dir
        type: str
        description: 読み込んだ記録フォルダ
      - name: session_id
        type: str | None
        description: 確認したセッション
      - name: rules
        type: list[RuleRead]
        description: 既読のルール（セッションを省いたときは空）
      - name: sessions
        type: list[RecordSessionItem]
        description: 既読の記録のあるセッション（セッションを指したときは空）
      - name: total
        type: int
        description: ルールまたはセッションの総数
      - name: next_cursor
        type: str | None
        description: 続きを取るときに `cursor` へ引き渡す値
  - name: DeleteRecordsResult
    title: 既読の記録の削除の応答
    container: server/types.py
    usecase: 既読の記録を削除する
    role: DTO
    summary: インターフェース定義「既読の記録の削除」のレスポンス
    properties:
      - name: success
        type: bool
        description: 常に `True`
      - name: output
        type: str
        description: 削除した既読のルールの件数の 1 行
      - name: config_path
        type: str | None
        description: 設定ファイルの場所
      - name: state_dir
        type: str
        description: 削除した記録フォルダ
      - name: session_id
        type: str
        description: 削除したセッション
      - name: locations
        type: list[str]
        description: 削除する前に既読だったルールの場所（初めて現れた順）
  - name: TagCheckReport
    title: タグの確認の結果
    container: server/types.py
    usecase: 索引をチェックする
    role: DTO
    summary: インターフェース定義「索引のチェック」の `tag_check`
    properties:
      - name: state
        type: TagCheckState
        description: 確認の結果
      - name: reason
        type: str | None
        description: '`skipped` のときの `UsedTags.reason`。それ以外は `None`'
  - name: ConfigState
    title: 設定ファイルの状態
    container: server/types.py
    usecase: MCPサーバーの状態を確認する
    role: DTO
    summary: インターフェース定義「サーバーの状態の確認」の `config`
    properties:
      - name: path
        type: str | None
        description: 読み込んだ設定ファイルの場所（`admin_tools._read_config_path`）
      - name: readable
        type: bool
        description: 読み込めたか
      - name: error
        type: str | None
        description: '読み込めなかった理由（`{path}: {reason}`）'
  - name: ServerStatusResult
    title: サーバーの状態の応答
    container: server/types.py
    usecase: MCPサーバーの状態を確認する
    role: DTO
    summary: インターフェース定義「サーバーの状態の確認」のレスポンス
    properties:
      - name: success
        type: bool
        description: 常に `True`
      - name: output
        type: str
        description: バージョン・commit・ポートの 1 行
      - name: port
        type: int
        description: '`ServerControl.port`'
      - name: pid
        type: int
        description: '`ServerControl.pid`'
      - name: started_at
        type: str
        description: '`ServerControl.started_at` の ISO 8601（UTC）'
      - name: version
        type: str | None
        description: '`read_version` の値'
      - name: clone
        type: str
        description: クローンの直下
      - name: commit
        type: str | None
        description: '`head_commit` の値'
      - name: config
        type: ConfigState
        description: 設定ファイルの状態
      - name: restarting
        type: bool
        description: '`ServerControl.restarting`'
  - name: ReloadSettingsResult
    title: 設定の再読込の応答
    container: server/types.py
    usecase: MCPサーバーの設定を再読込する
    role: DTO
    summary: インターフェース定義「設定の再読込」のレスポンス
    properties:
      - name: success
        type: bool
        description: 常に `True`
      - name: output
        type: str
        description: 設定ファイルの場所と読み込む索引の数の 1 行
      - name: config_path
        type: str | None
        description: 設定ファイルの場所
      - name: indexes
        type: list[str]
        description: '`Settings.indexes`'
      - name: state_dir
        type: str
        description: '`Settings.state_dir`'
      - name: record_retention_days
        type: int
        description: '`Settings.record_retention_days`'
      - name: log_retention_days
        type: int
        description: '`Settings.log_retention_days`'
      - name: dev_docs_url
        type: str
        description: '`Settings.dev_docs_url`'
  - name: RestartResult
    title: サーバーの再起動の応答
    container: server/types.py
    usecase: MCPサーバーを再起動する
    role: DTO
    summary: インターフェース定義「サーバーの再起動」のレスポンス
    properties:
      - name: success
        type: bool
        description: 常に `True`
      - name: output
        type: str
        description: 再起動を始めた旨と、再接続して確認する旨の 1 行
      - name: pid
        type: int
        description: '`ServerControl.pid`'
      - name: restarting
        type: bool
        description: 常に `True`
  - name: UpdateResult
    title: サーバーの更新の応答
    container: server/types.py
    usecase: rule-injectを更新する
    role: DTO
    summary: インターフェース定義「サーバーの更新」のレスポンス
    properties:
      - name: success
        type: bool
        description: 常に `True`
      - name: output
        type: str
        description: 結果の 1 行。`migration_required` のときは `global-setup` の案内を含む
      - name: state
        type: UpdateState
        description: 更新の結果
      - name: before
        type: str
        description: '`PullOutcome.before`'
      - name: after
        type: str
        description: '`PullOutcome.after`'
      - name: steps
        type: list[str]
        description: '`plan_migrations` の結果。`migration_required` 以外は空'
lead: ツールの応答の形式の種類と、各ツールの応答のモデルを定め、ツールの応答の項目を修正するときに参照する。
