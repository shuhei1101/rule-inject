id: MOD-122-66
visibility: internal
title: プラグイン / SKILL.md の生成の入口 / __main__.py
lead: SKILL.md の生成のコマンドの出力と終了コードを定め、生成のコマンドを修正するときに参照する。
test_files:
  - tests/unit/rule_inject/build_skills/test_main.py
constants:
  - name: FAILURE_EXIT_CODE
    title: 失敗の終了コード
    container: build_skills/__main__.py
    summary: インターフェース定義「SKILL.md の生成」のどのファイルも書き換えなかったときの終了コード
    value: '`2`'
functions:
  - name: main
    title: SKILL.md の生成の入口
    container: build_skills/__main__.py
    usecase: スキルを生成する
    summary: 作業ディレクトリをリポジトリの直下として `build_skills` を呼び、書き換えたパスを標準出力へ書き込む（`python -m rule_inject.build_skills`）
    kind: 関数
    scope: public
    returns:
      type: None
      description: 失敗するときは終了コードで抜ける
    process: |-
      1. `build_skills(Path.cwd())` を呼ぶ
      2. 返却されたパスを 1 行に 1 件ずつ標準出力へ書き込む
      3. `SkillBuildError` は `problems` を 1 行に 1 件ずつ標準エラーへ書き込み、`FAILURE_EXIT_CODE` で終わる
    unit_tests:
      - name: test_main
        case: 正常
        summary: 書き換えたパスを出す
        condition: '`build_skills` が 1 件のパスを返却する'
        mock: '`build_skills`'
        expected: 標準出力がそのパスの 1 行
      - name: test_main_when_error
        case: 異常
        summary: 生成の誤り
        condition: '`build_skills` が `SkillBuildError` を送出する'
        mock: '`build_skills`'
        expected: '`SystemExit(2)` で、標準エラーに `problems` の行'
