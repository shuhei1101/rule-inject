id: MOD-122-53
visibility: internal
title: "MCP サーバー / サーバー"
lead: 常駐の MCP サーバーの起動の入口・コンポジションルート・ツールの本体と応答の形式の構成を定め、ツールを追加・修正するときに参照する。
directory: |-
  ```text
  src/rule_inject/server/
  ├── __init__.py
  ├── __main__.py      # 起動の入口（main）
  ├── app.py           # コンポジションルート（build_server）とツールの登録
  ├── tools.py         # ルールの一覧・検索・エントリの書き込み・削除のツールの本体と、設定・書き込める索引の解決
  ├── check_tools.py   # 索引のチェックのツールの本体と、続きの位置の文字列の変換
  ├── dev_docs.py      # dev-docs の search_docs で使用されているタグを取得するクライアント
  ├── record_tools.py  # 既読の記録の確認・削除のツールの本体
  ├── types.py         # ResponseFormat と応答のモデル（Pydantic）
  └── _format.py       # 応答の形式（JSON / Markdown）と長さの切り詰め
  ```
