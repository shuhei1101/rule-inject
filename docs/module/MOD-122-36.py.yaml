id: MOD-122-36
visibility: internal
title: "MCP サーバー / サーバー / admin_tools.py"
test_files:
  - tests/unit/rule_inject/server/test_admin_tools.py
functions:
  - name: get_server_status
    title: サーバーの状態の確認
    container: server/admin_tools.py
    usecase: MCPサーバーの状態を確認する
    summary: インターフェース定義「サーバーの状態の確認」のツールの本体
    kind: 関数
    scope: public
    args:
      - name: env
        type: Mapping[str, str]
        required: true
        passing: injected
        description: サーバーを起動した環境変数
      - name: control
        type: ServerControl
        required: true
        passing: injected
        description: サーバーの稼働の状態
      - name: clone
        type: Path
        required: true
        passing: injected
        description: クローンの直下（`find_clone`）
      - name: run
        type: RunCommand
        required: true
        passing: injected
        description: コマンドの実行
    returns:
      type: CallToolResult
      description: '`respond(ServerStatusResult, "json")`'
    process: |-
      1. `_read_settings(None, env)` を呼び、読み込めれば `ConfigState(path=_read_config_path(env), readable=True)`、`ToolError` なら `ConfigState(path=_read_config_path(env), readable=False, error=理由)` にする
      2. `read_version(clone)` と `head_commit(clone, run=run)` を取得する。`head_commit` の `UpdateFailedError`（打ち切り）は `commit=None` にする
      3. `control` の `port`・`pid`・`started_at`・`restarting` と合わせて返却する
    unit_tests:
      - name: test_get_server_status
        case: 正常
        summary: 稼働の状態とクローンを返却する
        condition: '`version.ini` を配置した一時フォルダ、`run` が commit を返却する、読み込める設定ファイル'
        mock: '`run`'
        expected: '`version`・`commit`・`port`・`pid` が引き渡した値で、`config.readable` が真'
      - name: test_get_server_status_when_settings_unreadable
        case: 正常
        summary: 設定ファイルが読み込めなくてもエラーにしない
        condition: '`global` に知らないキーを持つ設定ファイル'
        mock: '`run`'
        expected: '`isError` でなく、`config.readable` が偽で `config.error` に場所と理由'
  - name: reload_settings
    title: 設定の再読込
    container: server/admin_tools.py
    usecase: MCPサーバーの設定を読み直す
    summary: インターフェース定義「設定の再読込」のツールの本体
    kind: 関数
    scope: public
    args:
      - name: project_dir
        type: str | None
        required: false
        default: None
        passing: keyword
        description: 読み込む索引を決めるプロジェクトの直下
      - name: env
        type: Mapping[str, str]
        required: true
        passing: injected
        description: サーバーを起動した環境変数
    returns:
      type: CallToolResult
      description: '`respond(ReloadSettingsResult, "json")`'
    process: |-
      1. `_read_settings(project_dir, env)` で設定を読み込む
      2. `Settings` の `indexes`・`state_dir`・`record_retention_days`・`log_retention_days`・`dev_docs_url` と `_read_config_path(env)` を返却する
    exceptions:
      - name: ToolError
        condition: 設定ファイルが読み込めない、または `project_dir` が絶対パスでない
        message: 設定ファイルの場所と理由、または絶対パスで渡す旨
    unit_tests:
      - name: test_reload_settings
        case: 正常
        summary: 読み込んだ値を返却する
        condition: '`global.indexes` に 2 つ、`log_retention_days: 7` の設定ファイル'
        mock: なし
        expected: '`indexes` が 2 つ、`log_retention_days` が 7'
      - name: test_reload_settings_when_unreadable
        case: 異常
        summary: 読み込めない設定ファイル
        condition: '`global` に知らないキー'
        mock: なし
        expected: '`ToolError` に設定ファイルの場所'
        exception: 設定ファイルが読み込めない、または `project_dir` が絶対パスでない
  - name: restart_server
    title: サーバーの再起動
    container: server/admin_tools.py
    usecase: MCPサーバーを再起動する
    summary: インターフェース定義「サーバーの再起動」のツールの本体（`async def`）
    kind: 関数
    scope: public
    args:
      - name: control
        type: ServerControl
        required: true
        passing: injected
        description: サーバーの稼働の状態
    returns:
      type: CallToolResult
      description: '`respond(RestartResult, "json")`'
    process: '1. `control.begin_restart()` を呼び、`pid` と `restarting=True` を返却する。停止は `begin_restart` が作ったタスクが、この応答を返却し終えた後に進める'
    exceptions:
      - name: RestartInProgressError
        condition: 再起動の途中
        message: 再起動の途中である旨
    unit_tests:
      - name: test_restart_server
        case: 正常
        summary: 再起動を始める
        condition: イベントループの中で呼ぶ
        mock: '`uvicorn.Server`（`should_exit` だけを持つ代わり）'
        expected: '`restarting` が真で、`control.restarting` が真'
  - name: update_server
    title: サーバーの更新
    container: server/admin_tools.py
    usecase: rule-injectを更新する
    summary: インターフェース定義「サーバーの更新」のツールの本体（`async def`）
    kind: 関数
    scope: public
    args:
      - name: env
        type: Mapping[str, str]
        required: true
        passing: injected
        description: サーバーを起動した環境変数
      - name: control
        type: ServerControl
        required: true
        passing: injected
        description: サーバーの稼働の状態
      - name: clone
        type: Path
        required: true
        passing: injected
        description: クローンの直下
      - name: run
        type: RunCommand
        required: true
        passing: injected
        description: コマンドの実行
    returns:
      type: CallToolResult
      description: '`respond(UpdateResult, "json")`'
    process: |-
      1. `control.begin_update()` を呼ぶ。以降は `try` の `finally` で `control.end_update()` を呼ぶ
      2. `asyncio.to_thread(pull, clone, run=run)` で取り込む。`pulled` が偽なら `state="up_to_date"` を返却する
      3. `asyncio.to_thread` で `sync_dependencies(clone, env, run=run)` と `plan_migrations(clone, env, run=run)` を順に呼ぶ。どちらかの `UpdateFailedError` は、文面に取り込んだ commit（`outcome.after`）を添えて再送出する
      4. `migrations` が空でなければ、`state="migration_required"`・`steps`・`global-setup` の案内を `output` に記載して返却する
      5. 空なら `control.finish_update_and_restart()` を呼び、`state="restarting"` を返却する（更新のフラグを下ろすのと再起動の開始を 1 回で行い、その間に別のセッションの再起動が割り込まない）
    exceptions:
      - name: UpdateFailedError
        condition: '`pull`・`sync_dependencies`・`plan_migrations` が送出する'
        message: インターフェース定義「サーバーの更新」の例外の notes のとおり
      - name: RestartInProgressError
        condition: 再起動の途中か、別の更新が動いている
        message: 再起動の途中か、別の更新が動いている旨
    unit_tests:
      - name: test_update_server
        case: 正常
        summary: 取り込んで再起動を始める
        condition: '`pull` が `pulled=True`、`plan_migrations` が空を返却する'
        mock: '`pull`・`sync_dependencies`・`plan_migrations`（`monkeypatch`）、`uvicorn.Server` の代わり'
        expected: '`state` が `restarting` で、`control.restarting` が真'
      - name: test_update_server_when_up_to_date
        case: 正常
        summary: 新しい commit が無ければ何もしない
        condition: '`pull` が `pulled=False`'
        mock: '`pull`・`sync_dependencies`'
        expected: '`state` が `up_to_date` で、`sync_dependencies` が呼ばれず、`control.restarting` が偽'
      - name: test_update_server_when_migration_required
        case: 正常
        summary: 移し替えが要れば再起動しない
        condition: '`plan_migrations` が 1 件を返却する'
        mock: '`pull`・`sync_dependencies`・`plan_migrations`'
        expected: '`state` が `migration_required`、`output` に `global-setup`、`control.restarting` が偽'
      - name: test_update_server_when_failed
        case: 異常
        summary: 失敗したら更新のフラグを下ろす
        condition: '`sync_dependencies` が `UpdateFailedError` を送出する'
        mock: '`pull`・`sync_dependencies`'
        expected: '`UpdateFailedError` が送出され、続けて `begin_update` を呼べる'
        exception: '`pull`・`sync_dependencies`・`plan_migrations` が送出する'
  - name: _read_settings
    title: 設定の読み取り
    container: server/admin_tools.py
    usecase: MCPサーバーの設定を読み直す
    summary: フックと同じ規則で設定を読み込む。`project_dir` があればそのプロジェクトとして、無ければ `CLAUDE_PROJECT_DIR` 無しで読み込む
    kind: 関数
    scope: internal
    args:
      - name: project_dir
        type: str | None
        required: true
        passing: positional
        description: プロジェクトの直下か `None`
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: サーバーを起動した環境変数
    returns:
      type: Settings
      description: 読み込んだ設定
    process: '1. `project_dir` が絶対パスでなければ `ToolError`。`env` から `PROJECT_DIR_ENV` を除き、`project_dir` があれば `PROJECT_DIR_ENV` に入れて `load_settings` を返却する。`SettingsReadError` は `ToolError`（`{path}: {reason}`）'
    exceptions:
      - name: ToolError
        condition: '`project_dir` が絶対パスでない、または設定ファイルが読み込めない'
        message: 絶対パスで渡す旨、または設定ファイルの場所と理由
  - name: _read_config_path
    title: 読み込んだ設定ファイルの場所
    container: server/admin_tools.py
    usecase: MCPサーバーの設定を読み直す
    summary: '`shared.settings.config_path(env)` にファイルがあればその場所、無ければ `None` を返却する'
    kind: 関数
    scope: internal
    args:
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: サーバーを起動した環境変数
    returns:
      type: str | None
      description: 読み込んだ設定ファイルの場所。既定のパスにファイルが無く読み込まなかったときは `None`
notes:
  設定の読み取りの配置場所: |-
    `tools.py`・`record_tools.py` の内部関数は使用せず、`shared.settings` の公開の `load_settings`・`config_path`・`PROJECT_DIR_ENV` で読み込む。
    `tools._config_path` は `RULE_INJECT_CONFIG` が無いと既定のパスのファイルを読み込んでも `None` を返却し、インターフェース定義の `config_path`（読み込まなかったときだけ `null`）と合わないため。
lead: サーバーの状態の確認・設定の再読込・再起動・更新のツールを定め、サーバーを管理するツールを修正するときに参照する。
