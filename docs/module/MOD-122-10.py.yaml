id: MOD-122-10
visibility: internal
title: "MCP サーバー / 索引のチェック / types.py"
enums:
  - name: ProblemKind
    title: 問題の種類
    container: features/index/check/types.py
    usecase: 索引をチェックする
    summary: 索引の問題の種類（Literal）。インターフェース定義「索引のチェック」の応答の一覧に該当する
    values:
      - value: hook_error
        title: フックが読み込めない
        description: '`hook_error`'
      - value: violation
        title: JSON Schema への違反
        description: '`violations`'
      - value: missing_rule
        title: ルールの場所にファイルが無い
        description: '`missing_rules`'
      - value: skipped_entry
        title: フックがスキップするエントリ
        description: '`skipped_entries`'
      - value: unmatched_path
        title: paths がどのファイルにもヒットしない
        description: '`unmatched_paths`。`check_index_text` は返却せず、`scan_unmatched` だけが返却する'
data_models:
  - name: IndexProblem
    title: 索引の問題
    container: features/index/check/types.py
    usecase: 索引をチェックする
    role: DTO
    summary: 索引の 1 つの問題
    properties:
      - name: kind
        type: ProblemKind
        description: 問題の種類
      - name: location
        type: str
        description: 索引の中の場所。キーは `.`、リストの要素は `[位置]` で結ぶ（例 `rules[0].read_by[1].tools`）。索引全体にかかるときは `ROOT_LOCATION`
      - name: reason
        type: str
        description: 理由。`hook_error`・`skipped_entry` はフックが案内に記載する文言、`violation` は `jsonschema` の `message`、`missing_rule`・`unmatched_path` は解いたルールの場所
      - name: position
        type: int | None
        description: 問題のあるエントリの位置。エントリに属さない問題は `None`
      - name: rev
        type: str | None
        description: 問題のあるエントリのバージョン（`entry_rev`）。エントリに属さない問題は `None`
  - name: IndexCheck
    title: 索引のチェックの結果
    container: features/index/check/types.py
    usecase: 索引をチェックする
    role: DTO
    summary: 索引 1 つの問題の一覧
    properties:
      - name: index
        type: str
        description: チェックした索引の場所
      - name: problems
        type: tuple[IndexProblem, ...]
        description: 見つかった問題。`hook_error` があるときはその 1 件だけ
  - name: ScanCursor
    title: 辿る続きの位置
    container: features/index/check/types.py
    usecase: 索引をチェックする
    role: DTO
    summary: 辿る時間の上限で止まったときの続きの位置（`@dataclass(frozen=True, slots=True, kw_only=True)`）。文字列への変換はサーバーが行う
    properties:
      - name: last_file
        type: str
        description: 辿り終えた最後のファイルの、`project_dir` からの `/` 区切りのパス
      - name: scanned_files
        type: int
        description: 最初の呼び出しから辿ったファイルの数
      - name: unmatched
        type: tuple[tuple[str, int, str], ...]
        description: まだヒットしていないエントリの索引・位置・`rev`
      - name: fingerprint
        type: str
        description: 確認するエントリの一覧（索引・位置・`rev`）の SHA-256 の 16 進数
  - name: UnmatchedScan
    title: paths のヒットしないエントリの検出の結果
    container: features/index/check/types.py
    usecase: 索引をチェックする
    role: DTO
    summary: 1 回の呼び出しで辿った結果（`@dataclass(frozen=True, slots=True, kw_only=True)`）
    properties:
      - name: completed
        type: bool
        description: 最後まで辿れたか
      - name: scanned_files
        type: int
        description: 最初の呼び出しから辿ったファイルの数
      - name: checks
        type: tuple[IndexCheck, ...]
        description: 索引ごとの `unmatched_path` の問題（引き渡された索引の順、問題は位置の順）。`completed` が `False` のときはどの索引も空
      - name: next_cursor
        type: ScanCursor | None
        description: 続きの位置。`completed` が `True` のときは `None`
  - name: TagPattern
    title: タグのパターン
    container: features/index/check/types.py
    usecase: 索引をチェックする
    role: DTO
    summary: 有効なエントリの `args`・`read_by[].args` の、タグに適用するパターン 1 つとその場所。使用されているタグにヒットしないものは、索引を読み込めなくする問題ではなくキーとパターンも返却するため、`IndexProblem` にしないでこの型のまま返却する
    properties:
      - name: index
        type: str
        description: 索引の場所
      - name: position
        type: int
        description: エントリの位置
      - name: rev
        type: str
        description: エントリのバージョン（`entry_rev`）
      - name: location
        type: str
        description: パターンを記載した条件の場所。`args` か `read_by[{要素の位置}].args`
      - name: key
        type: str
        description: パターンを記載したキー（`ArgCondition.key`。例 `filter[tags]`）
      - name: pattern
        type: MatchPattern
        description: パターン。応答には `source`（索引に記載したまま）を記載する
lead: 索引のチェックの問題の種類・問題・結果・辿る続きの位置・タグのパターンの型を定め、チェックの結果を修正するときに参照する。
