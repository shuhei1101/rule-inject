id: MOD-122-22
visibility: internal
title: "プラグイン / サーバーの起動 / types.py"
enums:
  - name: UnitStart
    title: 起動の依頼の結果
    container: features/server_start/types.py
    usecase: 落ちていたMCPサーバーがセッションの開始時に起動される
    summary: '`request_unit_start` が返す、起動を依頼したか・依頼しなかった理由'
    values:
      - value: requested
        member: REQUESTED
        title: 依頼した
        description: '`start --no-block` が終了コード 0 で終わった'
      - value: not_enabled
        member: NOT_ENABLED
        title: 有効でない
        description: '`is-enabled` が 0 以外（有効でない・ユニットが無い・ユーザーの systemd に接続できない）'
      - value: systemctl_missing
        member: SYSTEMCTL_MISSING
        title: systemctl が無い
        description: '`systemctl` が `PATH` に無い'
