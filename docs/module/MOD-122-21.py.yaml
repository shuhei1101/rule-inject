id: MOD-122-21
visibility: internal
title: "プラグイン / サーバーの起動 / service.py"
test_files:
  - tests/unit/rule_inject/features/server_start/test_service.py
constants:
  - name: LOOPBACK
    title: 応答を確かめるアドレス
    container: features/server_start/service.py
    summary: サーバーの待ち受けのアドレス
    value: '`"127.0.0.1"`'
    refs:
      - NFR-122-1#requirements[MCPサーバーの待ち受けのアドレス]
  - name: PROBE_TIMEOUT_SECONDS
    title: 応答の確認の待ち
    container: features/server_start/service.py
    summary: ポートへ TCP で接続するときの待ちの上限（秒）
    value: '`0.1`'
    refs:
      - NFR-122-1#requirements[サーバーの応答の確認の待ち]
  - name: SYSTEMCTL_TIMEOUT_SECONDS
    title: systemctl の打ち切り
    container: features/server_start/service.py
    summary: '`systemctl --user` の 1 回の呼び出しの打ち切り（秒）'
    value: '`0.3`'
    refs:
      - NFR-122-1#requirements[ユニットの確認と起動の依頼の待ち]
functions:
  - name: server_responds
    title: サーバーの応答の確認
    container: features/server_start/service.py
    usecase: 落ちていたMCPサーバーがセッションの開始時に起動される
    summary: '`LOOPBACK` のポートへ TCP で接続できるかを返す'
    kind: 関数
    scope: public
    args:
      - name: port
        type: int
        required: true
        passing: positional
        description: サーバーの待ち受けのポート
      - name: timeout
        type: float
        required: false
        default: PROBE_TIMEOUT_SECONDS
        passing: keyword
        description: 接続の待ちの上限（秒）
    returns:
      type: bool
      description: 接続できれば True。拒まれた・待ちを過ぎた・その他の OSError は False
    process: |-
      1. `socket.create_connection((LOOPBACK, port), timeout=timeout)` で接続し、すぐに閉じて True を返す
         - `TimeoutError`（待ちを過ぎた）・その他の `OSError`（拒まれた等）の場合、False を返す。ログには書かない
    unit_tests:
      - name: test_server_responds
        case: 正常
        summary: 待ち受けているポートなら真
        condition: テストが空いているポートで待ち受ける
        mock: なし
        expected: 'True'
      - name: test_server_responds_when_refused
        case: 正常
        summary: 待ち受けていないポートなら偽
        condition: 空いているポートを取って閉じたポート
        mock: なし
        expected: 'False'
      - name: test_server_responds_when_timed_out
        case: 正常
        summary: 待ちを過ぎたら偽
        condition: '`socket.create_connection` が TimeoutError を送出する'
        mock: '`socket.create_connection`（monkeypatch）'
        expected: False。`timeout` に `PROBE_TIMEOUT_SECONDS` が渡る
  - name: request_unit_start
    title: ユニットの起動の依頼
    container: features/server_start/service.py
    usecase: 落ちていたMCPサーバーがセッションの開始時に起動される
    summary: ユニットが有効なときだけ `systemctl --user start --no-block` で起動を依頼し、結果を返す
    kind: 関数
    scope: public
    side_effects: ユニットの起動を依頼する
    args:
      - name: service
        type: str
        required: true
        passing: positional
        description: ユニットのサービス名（`global.server_service`）
      - name: timeout
        type: float
        required: false
        default: SYSTEMCTL_TIMEOUT_SECONDS
        passing: keyword
        description: 1 回の呼び出しの打ち切り（秒）
    returns:
      type: UnitStart
      description: '`REQUESTED`（依頼した）/ `NOT_ENABLED`（有効でない・無い・ユーザーの systemd に接続できない）/ `SYSTEMCTL_MISSING`（`systemctl` が無い）'
    process: |-
      1. `subprocess.run(["systemctl", "--user", "is-enabled", "--quiet", "--", service], stdin=DEVNULL, stdout=DEVNULL, stderr=DEVNULL, timeout=timeout, check=False)` を実行する
         - FileNotFoundError の場合、`SYSTEMCTL_MISSING` を返す（ログには書かない）
         - TimeoutExpired の場合、UnitCheckError を送出する
         - 終了コードが 0 以外の場合、`NOT_ENABLED` を返す
      2. 同じ形で `["systemctl", "--user", "start", "--no-block", "--", service]` を実行する
         - TimeoutExpired の場合、UnitStartError を送出する
         - 終了コードが 0 以外の場合、UnitStartError を送出する
      3. `REQUESTED` を返す
    exceptions:
      - name: UnitCheckError
        condition: '`is-enabled` が `timeout` を過ぎた'
        message: 'path は `systemctl --user is-enabled {service}`、reason は `describe(exc)`'
      - name: UnitStartError
        condition: '`start --no-block` が `timeout` を過ぎた'
        message: 'path は `systemctl --user start {service}`、reason は `describe(exc)`'
      - name: UnitStartError
        condition: '`start --no-block` が 0 以外の終了コードで終わった'
        message: 'path は `systemctl --user start {service}`、reason は `終了コード {N}`'
    unit_tests:
      - name: test_request_unit_start
        case: 正常
        summary: 有効なユニットへ起動を依頼する
        condition: '`subprocess.run` が `is-enabled` と `start` のどちらも終了コード 0 を返す'
        mock: '`subprocess.run`（monkeypatch）'
        expected: '`REQUESTED`。`["systemctl", "--user", "is-enabled", "--quiet", "--", "rule-inject"]`、`["systemctl", "--user", "start", "--no-block", "--", "rule-inject"]` の順に `timeout=SYSTEMCTL_TIMEOUT_SECONDS` で呼ばれる'
      - name: test_request_unit_start_when_not_enabled
        case: 正常
        summary: 有効でなければ起動を依頼しない
        condition: '`is-enabled` が終了コード 1 を返す'
        mock: '`subprocess.run`'
        expected: '`NOT_ENABLED`。`start` が呼ばれない'
      - name: test_request_unit_start_when_systemctl_missing
        case: 正常
        summary: systemctl が無ければ何もしない
        condition: '`subprocess.run` が FileNotFoundError を送出する'
        mock: '`subprocess.run`'
        expected: '`SYSTEMCTL_MISSING`'
      - name: test_request_unit_start_when_check_timed_out
        case: 異常
        summary: is-enabled の打ち切り
        condition: '`is-enabled` が TimeoutExpired を送出する'
        mock: '`subprocess.run`'
        expected: UnitCheckError。`start` が呼ばれない
        exception: '`is-enabled` が `timeout` を過ぎた'
      - name: test_request_unit_start_when_start_timed_out
        case: 異常
        summary: start の打ち切り
        condition: '`start` が TimeoutExpired を送出する'
        mock: '`subprocess.run`'
        expected: UnitStartError
        exception: '`start --no-block` が `timeout` を過ぎた'
      - name: test_request_unit_start_when_start_failed
        case: 異常
        summary: start の失敗
        condition: '`start` が終了コード 5 を返す'
        mock: '`subprocess.run`'
        expected: UnitStartError（reason に `終了コード 5`）
        exception: '`start --no-block` が 0 以外の終了コードで終わった'
