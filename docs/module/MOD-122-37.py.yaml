id: MOD-122-37
visibility: internal
title: "MCP サーバー / サーバー / app.py"
test_files:
  - tests/unit/rule_inject/server/test_app.py
constants:
  - name: SERVER_NAME
    title: サーバーの名前
    container: server/app.py
    summary: '`MCPServer` の `name`'
    value: '`"rule-inject"`'
  - name: UNMATCHED_SCAN_TIME_LIMIT
    title: プロジェクトのファイルを辿る時間の上限
    container: server/app.py
    summary: 非機能要件「プロジェクトのファイルを辿る時間」の決定値（秒）。`build_server` の `scan_time_limit` の既定
    value: '`30`'
  - name: DEV_DOCS_TIMEOUT
    title: project-indexへの問い合わせの待ち時間の上限
    container: server/app.py
    summary: 非機能要件「project-index への問い合わせの待ち時間」の決定値（秒）。`build_server` の `dev_docs_timeout` の既定
    value: '`207`'
  - name: SERVER_INSTRUCTIONS
    title: サーバーの instructions
    container: server/app.py
    summary: '`MCPServer` の `instructions`。インターフェース定義「サーバーの起動」の制約「instructions」の文面'
    value: '`rule-inject は、Claude Code がファイルを触る前に、そのファイルに該当する未読のルールを案内する。新しいファイルは Write で空の内容で作った時点でそのファイルに該当するルールが案内されるため、案内されたルールを参照してから Edit で中身を記載する。この MCP のツールは、ルールと索引そのものを扱う作業で呼ぶ。有効なルールの一覧は list_rules、ファイルやツールの呼び出しにヒットするルールの検索は search_rules、索引のエントリの編集と索引のチェックは write_index_entry・delete_index_entry・check_indexes、既読の記録の確認と削除は get_read_records・delete_read_records、設定ファイルを書き換えた後の再読込とサーバーの状態の確認・再起動・更新は reload_settings・get_server_status・restart_server・update_server で行う。ルールの本文は、案内された場所を Read で参照する。プロジェクトのコードや文書は grep・Read で探す。どのルールがヒットするかは、索引を grep・Read せずに search_rules で調べる。索引は Edit で編集せず、write_index_entry・delete_index_entry で編集する。エントリを書き換え・削除する前に、list_rules で position と rev を取得する。ルールが案内されないときは、search_rules でヒットするかを確認してから、get_read_records で既読かを確認する。`'
    refs:
      - IF-122-6#constraints[instructions]
functions:
  - name: build_server
    title: サーバーの組み立て
    container: server/app.py
    usecase: MCPサーバーを常駐させる
    summary: コンポジションルート。依存を作ってツールへ引き渡し、`MCPServer` にツールを登録する
    kind: 関数
    scope: public
    args:
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: サーバーを起動した環境変数
      - name: scan_time_limit
        type: float
        required: false
        default: UNMATCHED_SCAN_TIME_LIMIT
        passing: keyword
        description: '`check_indexes` がプロジェクトのファイルを辿る時間の上限（秒）。結合テストが 0 を引き渡して上限で止まる流れを確認する'
      - name: dev_docs_timeout
        type: float
        required: false
        default: DEV_DOCS_TIMEOUT
        passing: keyword
        description: '`check_indexes` の project-index への問い合わせの待ち時間の上限（秒）'
      - name: control
        type: ServerControl
        required: true
        passing: keyword
        description: サーバーの稼働の状態。起動の入口が作って引き渡す
      - name: clone
        type: Path
        required: true
        passing: keyword
        description: クローンの直下（`find_clone`）
      - name: run_command
        type: RunCommand
        required: false
        default: clone.run_command
        passing: keyword
        description: コマンドの実行。結合テストが差し替えてコマンドの失敗を発生させる
    returns:
      type: MCPServer
      description: ツールを登録したサーバー
    process: |-
      1. `validator = load_validator()`、`locks = IndexLocks()`、`check = partial(check_change, env=env, validator=validator)` を作る
      2. `MCPServer(SERVER_NAME, instructions=SERVER_INSTRUCTIONS)` を作る
      3. 各ツールを、依存（`env`・`validator`・`locks`・`check`・`scan_time_limit`・`dev_docs_timeout`・`control`・`clone`・`run_command`）を閉じ込めて引数をツールの引数だけにした関数で `add_tool(..., structured_output=False)` する（`partial` で引き渡すと依存の引数がツールの引数の Schema に残るため）。`check_indexes`・`restart_server`・`update_server` は `async def` で閉じ込める。`list_rules`・`search_rules`・`check_indexes`・`write_index_entry`・`delete_index_entry`・`get_read_records`・`delete_read_records` はツールの引数に `session_env: dict[str, str] | None = None` を持ち、`_session_environment(env, session_env)` の環境変数を `env` として引き渡す（`write_index_entry` の `check_change` も、その環境変数で `partial(check_change, env=..., validator=validator)` を作って引き渡す）。`annotations` は、各ツールのインターフェース定義の `read_only`・`destructive` のとおりにする。`list_rules`・`search_rules`・`check_indexes`・`get_read_records`・`get_server_status`・`reload_settings` が `readOnlyHint: true`、`write_index_entry`・`delete_index_entry`・`delete_read_records`・`update_server` が `destructiveHint: true`、`restart_server` が `destructiveHint: false` で、全て `openWorldHint: false`
      4. `get_server_status` と `restart_server` を除くツールを `control.guard` で包んでから登録する（再起動の途中は断り、処理中の数を数える）。`restart_server` は `begin_restart` が自分で断る
      5. サーバーを返却する
    unit_tests:
      - name: test_build_server
        case: 正常
        summary: 全てのツールを依存の引数なしで登録する
        condition: 空の `env`、`ServerControl`、`version.ini` を配置した一時フォルダの `clone`
        mock: なし
        expected: '`list_tools` が 11 の名前を返却し、どの入力の Schema にも `env`・`validator`・`locks`・`check_change`・`scan_time_limit`・`dev_docs_timeout`・`control`・`clone`・`run_command` が無く、`write_index_entry`・`delete_index_entry`・`delete_read_records`・`update_server` だけが `destructiveHint: true`'
      - name: test_build_server_when_restarting
        case: 異常
        summary: 再起動の途中は状態の確認だけを受け付ける
        condition: '`control.begin_restart()` の後に `call_tool` で `list_rules` と `get_server_status` を呼ぶ'
        mock: '`uvicorn.Server`（`should_exit` だけを持つ代わり）'
        expected: '`list_rules` が再起動の途中の `isError: true`、`get_server_status` が `restarting: true` を返却する'
        exception: 再起動を始めた後に呼ばれた
      - name: test_build_server_instructions
        case: 正常
        summary: instructions を指定する
        condition: 空の `env`、`ServerControl`、`version.ini` を配置した一時フォルダの `clone`
        mock: なし
        expected: サーバーの `instructions` が `SERVER_INSTRUCTIONS` で、4,096 字以内で、登録した全てのツールの名前と `Read`・`grep` を含む
      - name: test_build_server_session_env
        case: 正常
        summary: 設定を使用するツールだけが `session_env` を引数に持つ
        condition: 空の `env`、`ServerControl`、`version.ini` を配置した一時フォルダの `clone`
        mock: なし
        expected: '`list_rules`・`search_rules`・`check_indexes`・`write_index_entry`・`delete_index_entry`・`get_read_records`・`delete_read_records` の入力の Schema に `session_env`（必須でない）があり、`get_server_status`・`reload_settings`・`restart_server`・`update_server` には無い'
      - name: test_build_server_when_session_env
        case: 正常
        summary: '`session_env` の設定ファイルで照合する'
        condition: サーバーの `env` の `RULE_INJECT_CONFIG` が索引の無い設定ファイル、`session_env` の `RULE_INJECT_CONFIG` が索引を 1 つ指す設定ファイル。`call_tool` で `list_rules` を呼ぶ
        mock: なし（設定ファイルと索引は一時ファイル）
        expected: '`config_path` が `session_env` の設定ファイル、`indexes` がその索引'
  - name: _session_environment
    title: セッションの環境変数の重ね合わせ
    container: server/app.py
    usecase: 操作に該当するルールを検索する
    summary: サーバーの環境変数から `SESSION_ENV_KEYS` を除き、`session_env` を重ねた環境変数を返却する
    kind: 関数
    scope: internal
    args:
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: サーバーを起動した環境変数
      - name: session_env
        type: dict[str, str] | None
        required: true
        passing: positional
        description: ツールの引数 `session_env`
    returns:
      type: Mapping[str, str]
      description: ツールが設定・索引・記録フォルダを決める環境変数
    process: |-
      1. `session_env` が None なら `env` をそのまま返却する
      2. `env` から `SESSION_ENV_KEYS` の名前を除いた dict に `session_env` を重ねて返却する（`session_env` の変数参照の名前も重ねる）
    refs:
      - IF-122-7#constraints[設定ファイルの決め方]
    unit_tests:
      - name: test_session_environment
        case: 正常
        summary: 3 つの名前を除いて `session_env` を重ねる
        condition: '`env` に `RULE_INJECT_CONFIG`・`XDG_CONFIG_HOME`・`XDG_STATE_HOME`・`HOME`、`session_env` に `XDG_CONFIG_HOME`（別の値）と `RULE_ROOT`'
        mock: なし
        expected: '`HOME`・`session_env` の `XDG_CONFIG_HOME`・`RULE_ROOT` の 3 つだけを持つ'
      - name: test_session_environment_when_absent
        case: 正常
        summary: '`session_env` が無ければサーバーの環境変数を使用する'
        condition: '`session_env` が None'
        mock: なし
        expected: '`env` と同じ'
lead: MCP サーバーを組み立てるコンポジションルートとツール・接続時の instructions の登録を定め、ツールや instructions を追加するときや依存を差し替えるときに参照する。
