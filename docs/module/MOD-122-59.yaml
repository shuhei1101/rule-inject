id: MOD-122-59
visibility: internal
title: "プラグイン / 共通"
lead: フックが共有する設定ファイルの読み取り・記録フォルダ・変数参照・ログ・例外の構成を定め、共通の処理を修正するときに参照する。
directory: |-
  ```text
  src/rule_inject/
  ├── __init__.py
  └── shared/
      ├── __init__.py
      ├── errors.py          # 設定ファイル・索引の読み取りと編集・既読の記録・既読の履歴・ログの例外
      ├── paths.py           # 既定の記録フォルダ・ログのフォルダとルールの場所の解決
      ├── settings.py        # 設定ファイルの読み取りと `projects` の適用方法
      ├── _settings_yaml.py  # 設定ファイルの YAML の一部だけを読み込む
      ├── yaml_lines.py      # 設定ファイルと索引の YAML に共通の、行・文字列・リストの読み取り
      ├── variables.py       # `!{名前}` を環境変数の値へ展開する
      └── logger.py          # 失敗を日付ごとのログ（JSON Lines）へ書き込み、古いログを削除する
  ```
