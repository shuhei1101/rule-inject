id: MOD-122-1
visibility: internal
title: "プラグイン / コマンドの解析 / service.py"
test_files:
  - tests/unit/rule_inject/features/command/test_service.py
constants:
  - name: READ_COMMANDS
    title: 読み込むコマンド
    container: features/command/service.py
    summary: ルール案内が読み込む操作として扱うコマンド
    value: '`frozenset({"cat", "head", "tail", "less", "more", "grep", "rg", "sed", "awk", "wc", "bat"})`'
  - name: FULL_READ_COMMANDS
    title: 全体を読み込むコマンド
    container: features/command/service.py
    summary: 既読の記録が既読にするコマンド（本文全体を出すもの）
    value: '`frozenset({"cat", "bat", "less", "more"})`'
  - name: SEARCH_COMMANDS
    title: 検索のコマンド
    container: features/command/service.py
    summary: 検索結果の案内が結果を読み込むコマンド
    value: '`frozenset({"grep", "rg", "find", "ls"})`'
  - name: SEARCH_PATH_LIMIT
    title: 照合するパスの数
    container: features/command/service.py
    summary: 検索の結果から取得して照合するパスの上限
    value: '`100`'
    refs:
      - NFR-122-1#requirements[検索結果から照合するパスの数]
functions:
  - name: extract_read_paths
    title: 読み込むパスの取り出し
    container: features/command/service.py
    usecase: 共通
    summary: コマンドの文字列から、指定のコマンドが読み込む実在するファイルの絶対パスを返却する
    kind: 関数
    scope: public
    args:
      - name: command
        type: str
        required: true
        passing: positional
        description: Bash のコマンド
      - name: cwd
        type: Path
        required: true
        passing: positional
        description: 相対パスを解く基準（フックの入力の `cwd`）
      - name: commands
        type: frozenset[str]
        required: true
        passing: positional
        description: 対象にするコマンド名（`READ_COMMANDS` か `FULL_READ_COMMANDS`）
    returns:
      type: list[str]
      description: 実在するファイルの絶対パス（出てきた順、重なりなし）
    process: |-
      1. 単語に分ける前にコマンドの文字列を先頭から走査し、引用符の状態を追う（二重引用符の中の `\"` / `\\` はエスケープとして解釈し、一重引用符の中の `\` は文字どおり）。引用符の外の行継続（`\` + 改行）は空白に置き換える。引用符の外で、先頭か空白・区切りの記号の直後にある `#` から行末まではコメントとして捨てる（改行は残す）。引用符の中の `*` / `?` / `[` と、引用符の外で `\` の直後にある `*` / `?` / `[`（`\` ごと）は、`glob.escape` の形式（`[*]` / `[?]` / `[[]`）に置き換える
      2. `shlex`（`posix=True`、`punctuation_chars` は `();<>|&` と改行、`whitespace` は空白・タブ・CR、`whitespace_split=True`）で単語に分ける。引用符が閉じていないなどで分けられなければ空を返却する
      3. `&&` / `||` / `;` / `|` / 改行など記号だけの単語で区切る。`<<` の次の単語（先頭の `-` を除外する）をヒアドキュメントの終わりの単語とし、次の改行から、その単語だけの区切りまでの単語を捨てる
      4. 区切ったコマンドを順に確認する。`cd {フォルダ}` は以降の基準を動かす。フォルダが `*` / `?` / `[` を含むときは手順 7 と同じく `glob.glob` で解き、ヒットしたフォルダが 1 つのときだけそれを基準にする（それ以外は基準を動かさない）
      5. `for {変数} in {単語の並び}` の区切りは、変数と単語の並びをループのスタックに追加する。`while` / `until` の区切りも、変数を持たないループとして追加する。`do` で始まる区切りは `do` を除外した残りをコマンドとして扱う。`done` だけの区切りでスタックの最後を降ろす
      6. 先頭の単語のベース名が `commands` にあれば、`-` で始まらない引数を読み込む対象にする。引数がスタックのいずれかの変数の `$変数` / `${変数}` なら、その単語の並びを引数の代わりに読み込む対象にする
      7. 読み込む対象の単語のうち `*` / `?` / `[` を含むものは、基準から解いたパターンを `glob.glob`（`recursive=False`）に適用し、ヒットしたものを名前の順に並べる。含まない単語は基準から解く
      8. 実在するファイルだけを、出てきた順に重なりなしで残す
    unit_tests:
      - name: test_extract_read_paths
        case: 正常
        summary: cd とパイプをまたいでパスを取り出す
        condition: '`cd src && cat app.py | head -n 5`、`src/app.py` が実在、`READ_COMMANDS`'
        mock: なし
        expected: '`{cwd}/src/app.py` の 1 件'
      - name: test_extract_read_paths_when_pattern_arg
        case: 正常
        summary: 実在しない引数を捨てる
        condition: '`grep -n foo a.md`、`a.md` だけ実在'
        mock: なし
        expected: '`a.md` の絶対パスだけ'
      - name: test_extract_read_paths_when_not_full_read
        case: 正常
        summary: 対象外のコマンドは確認しない
        condition: '`grep foo a.md`、`FULL_READ_COMMANDS`'
        mock: なし
        expected: 空
      - name: test_extract_read_paths_when_unparsable
        case: 正常
        summary: 分けられないコマンド
        condition: '`cat "a.md`（引用符が閉じていない）'
        mock: なし
        expected: 空（例外を送出しない）
      - name: test_extract_read_paths_when_glob
        case: 正常
        summary: 引用符の外の glob を展開する
        condition: '`cat src/tasks/*.py`、`src/tasks/b.py`・`src/tasks/a.py`・`src/tasks/c.md` が実在、`READ_COMMANDS`'
        mock: なし
        expected: '`{cwd}/src/tasks/a.py`・`{cwd}/src/tasks/b.py` の 2 件（名前の順）'
      - name: test_extract_read_paths_when_quoted_glob
        case: 正常
        summary: 引用符の中の glob は展開しない
        condition: '`cat "src/*.py"`、`src/a.py` が実在'
        mock: なし
        expected: 空
      - name: test_extract_read_paths_when_glob_no_match
        case: 正常
        summary: ヒットするファイルが無い glob を捨てる
        condition: '`cat src/*.rs`、`src/a.py` だけ実在'
        mock: なし
        expected: 空
      - name: test_extract_read_paths_when_for_loop
        case: 正常
        summary: for の単語の並びを読み込む対象にする
        condition: '`for f in src/tasks/*.py tests/unit/tasks/test_service.py; do echo "=== $f"; cat "$f"; done`、`src/tasks/text_rules.py`・`src/tasks/service.py`・`tests/unit/tasks/test_service.py` が実在、`READ_COMMANDS`'
        mock: なし
        expected: '`src/tasks/service.py`・`src/tasks/text_rules.py`・`tests/unit/tasks/test_service.py` の絶対パスの 3 件（この順）'
      - name: test_extract_read_paths_when_for_loop_multiline
        case: 正常
        summary: 改行で区切った for の単語の並びを読み込む対象にする
        condition: '`for f in a.md b.md` / `do` / `  cat "${f}"` / `done` を改行でつないだコマンド、`a.md`・`b.md` が実在'
        mock: なし
        expected: '`a.md`・`b.md` の絶対パスの 2 件'
      - name: test_extract_read_paths_when_for_loop_not_read
        case: 正常
        summary: 読み込むコマンドが変数を取らない for は確認しない
        condition: '`for f in a.md; do echo "$f"; done`、`a.md` が実在、`READ_COMMANDS`'
        mock: なし
        expected: 空
      - name: test_extract_read_paths_when_for_loop_full_read
        case: 正常
        summary: 全体を読み込むコマンドの for と glob を既読の対象にする
        condition: '`for f in a.md; do cat "$f"; done && cat src/*.md`、`a.md`・`src/b.md` が実在、`FULL_READ_COMMANDS`'
        mock: なし
        expected: '`a.md`・`src/b.md` の絶対パスの 2 件'
      - name: test_extract_read_paths_when_newline
        case: 正常
        summary: 改行をコマンドの区切りにする
        condition: '`cd src` と `cat app.py` を改行でつないだコマンド、`src/app.py` が実在'
        mock: なし
        expected: '`{cwd}/src/app.py` の 1 件'
      - name: test_extract_read_paths_when_line_continuation
        case: 正常
        summary: 行継続は区切りにしない
        condition: '`cat \` / `  a.md \` / `  b.md` を改行でつないだコマンド、`a.md`・`b.md` が実在'
        mock: なし
        expected: '`a.md`・`b.md` の絶対パスの 2 件'
      - name: test_extract_read_paths_when_heredoc
        case: 正常
        summary: ヒアドキュメントの本文の行は確認しない
        condition: "`cat <<'EOF' > out.md` / `cat x.md` / `EOF` / `cat y.md` を改行でつないだコマンド、`x.md`・`y.md` が実在"
        mock: なし
        expected: '`y.md` の絶対パスの 1 件'
      - name: test_extract_read_paths_when_escaped_or_inner_quoted
        case: 正常
        summary: エスケープした空白・単語の途中の引用符・エスケープした引用符のパスを取り出す
        condition: "`cat a\\ b.md src/\"my dir\"/x.md dir/it\\'s.md`、`a b.md`・`src/my dir/x.md`・`dir/it's.md` が実在"
        mock: なし
        expected: "`a b.md`・`src/my dir/x.md`・`dir/it's.md` の絶対パスの 3 件"
      - name: test_extract_read_paths_when_escaped_glob
        case: 正常
        summary: 引用符の中と `\` の直後の glob の文字は文字どおりに扱う
        condition: '`cat "[x].md" \*.md`、`[x].md`・`*.md`・`x.md`・`a.md` が実在'
        mock: なし
        expected: '`[x].md`・`*.md` の絶対パスの 2 件'
      - name: test_extract_read_paths_when_cd_literal_glob
        case: 正常
        summary: 引用符で包んだ・エスケープした glob の文字を含むフォルダへ移る cd の後の読み込むコマンドを解く
        condition: '`cd "dir[1]" && cat r.md` と `cd dir\[1\] && cat r.md` の 2 つ、`dir[1]/r.md` が実在、`READ_COMMANDS`'
        mock: なし
        expected: どちらも `{cwd}/dir[1]/r.md` の 1 件
  - name: search_output_base
    title: 検索の出力の基準
    container: features/command/service.py
    usecase: 検索の結果に出たファイルのルールの案内を受ける
    summary: コマンドが検索のコマンドなら、その出力の相対パスを解くフォルダを返却する
    kind: 関数
    scope: public
    args:
      - name: command
        type: str
        required: true
        passing: positional
        description: Bash のコマンド
      - name: cwd
        type: Path
        required: true
        passing: positional
        description: フックの入力の `cwd`
    returns:
      type: Path | None
      description: 出力を解くフォルダ。検索のコマンドでなければ None
    process: |-
      1. `extract_read_paths` と同じ規則で単語に分け、記号だけの単語でコマンドごとに区切る（ヒアドキュメントの本文の単語も同じく捨てる）。分けられなければ None
      2. `cd {フォルダ}` を除いた最初のコマンドの先頭の単語のベース名が `SEARCH_COMMANDS` に無ければ None（名前の部分一致にしない）
      3. 基準は `cwd` をそれまでの `cd` で動かしたフォルダにする。`ls` で、`-` で始まらない引数が 1 つだけでそれが実在するフォルダなら、そのフォルダを基準にする。`cd` と `ls` の引数が `*` / `?` / `[` を含むときは `extract_read_paths` の手順 4 と同じく `glob.glob` で解き、ヒットしたフォルダが 1 つのときだけそれを使用する
    unit_tests:
      - name: test_search_output_base
        case: 正常
        summary: 検索のコマンドの基準を返却する
        condition: '`find src -type f | head`'
        mock: なし
        expected: '`cwd`'
      - name: test_search_output_base_when_cd
        case: 正常
        summary: cd で基準を動かす
        condition: '`cd sub && grep -rl foo .`'
        mock: なし
        expected: '`{cwd}/sub`'
      - name: test_search_output_base_when_ls_dir
        case: 正常
        summary: ls のフォルダを基準にする
        condition: '`ls -1 src`、`src` が実在するフォルダ'
        mock: なし
        expected: '`{cwd}/src`'
      - name: test_search_output_base_when_not_search
        case: 正常
        summary: 検索でないコマンドは None
        condition: '`git merge main`、`cat a.md`、`rgx foo`'
        mock: なし
        expected: どれも None
      - name: test_search_output_base_when_unparsable
        case: 正常
        summary: 分けられないコマンド
        condition: '`grep "foo`'
        mock: なし
        expected: None（例外を送出しない）
      - name: test_search_output_base_when_quoted_cd
        case: 正常
        summary: 引用符で包んだ cd の先を基準にする
        condition: '`cd "sub dir" && grep -rl foo .`'
        mock: なし
        expected: '`{cwd}/sub dir`'
      - name: test_search_output_base_when_escaped_cd
        case: 正常
        summary: エスケープした空白を含む cd の先を基準にする
        condition: '`cd my\ dir && grep -rl foo .`'
        mock: なし
        expected: '`{cwd}/my dir`'
      - name: test_search_output_base_when_literal_glob
        case: 正常
        summary: 引用符で包んだ glob の文字を含む cd と ls のフォルダを基準にする
        condition: '`cd "dir[1]" && ls` と `ls "dir[1]"` の 2 つ、`dir[1]` が実在'
        mock: なし
        expected: どちらも `{cwd}/dir[1]`
  - name: extract_result_paths
    title: 結果の行からのパスの取り出し
    container: features/command/service.py
    usecase: 検索の結果に出たファイルのルールの案内を受ける
    summary: 検索の結果の行から実在するファイルの絶対パスを取得し、上限までを照合するパスにする
    kind: 関数
    scope: public
    args:
      - name: lines
        type: Iterable[str]
        required: true
        passing: positional
        description: Grep・Glob の `filenames` の各要素か、Grep の `content`・Bash の `stdout` の各行
      - name: base
        type: Path
        required: true
        passing: positional
        description: 相対パスを解くフォルダ
      - name: limit
        type: int
        required: false
        default: SEARCH_PATH_LIMIT
        passing: keyword
        description: 照合するパスの上限
    returns:
      type: ResultPaths
      description: 照合するパスと照合しない件数
    process: |-
      1. 行ごとに前後の空白を落とし、行全体を `base` から解いて実在するファイルならそのパスを取得する
      2. そうでなければ最初の `:` より前を解いて、実在するファイルなら取得する（`{パス}:{行番号}:{行}` と `{パス}:{件数}`）。フォルダ・実在しないものは捨てる
      3. 取得したパスの重なりを落とし、出た順に先頭から `limit` 件を `paths`、残りの件数を `unchecked` にする
    unit_tests:
      - name: test_extract_result_paths
        case: 正常
        summary: パスだけの行と `{パス}:…` の行を取得する
        condition: '`a.py`・`b.md:3:x`・`b.md:1`・`missing.py`・`sub`（フォルダ）の 5 行。`a.py` と `b.md` が実在'
        mock: なし
        expected: '`paths` が `{base}/a.py` と `{base}/b.md` の 2 件、`unchecked` が 0'
      - name: test_extract_result_paths_when_colon_in_name
        case: 正常
        summary: 名前に `:` を含むファイルを行全体で取得する
        condition: 実在する `a:b.md` の 1 行
        mock: なし
        expected: '`{base}/a:b.md` の 1 件'
      - name: test_extract_result_paths_when_over_limit
        case: 正常
        summary: 上限を超えた分を件数にする
        condition: 実在するファイル 105 行、`limit=100`
        mock: なし
        expected: '`paths` が先頭 100 件、`unchecked` が 5'
data_models:
  - name: ResultPaths
    title: 検索の結果から取得したパス
    container: features/command/service.py
    usecase: 検索の結果に出たファイルのルールの案内を受ける
    role: DTO
    summary: 照合するパスと、上限で照合しなかったパスの件数
    properties:
      - name: paths
        type: tuple[str, ...]
        description: 照合する実在するファイルの絶対パス（出た順、重なりなし、`limit` 件まで）
      - name: unchecked
        type: int
        description: 上限を超えて照合しない実在するファイルの件数
lead: Bash のコマンドから読み込むファイルのパスと、検索のコマンドの結果に出た実在するファイルを取り出す関数を定め、コマンドの解析を修正するときに参照する。
