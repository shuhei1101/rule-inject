# mdmark の設定。パスと glob は、このファイルのあるフォルダからの相対パスで記載する
# 端末の設定（~/.config/mdmark/settings.yaml）に重ねて読み込む。端末の設定の config.cascade を true にすると、上のフォルダの mdmark.config.yaml も重ねる

# この設定・索引・文書が合わせてある mdmark のバージョン（mdmark upgrade が書き換える）
version: v0.13.0

# 書き出した HTML に埋める拡張のモジュール（使用するときは次の行の # を削除する）
# extensions: [extensions/example.ts]

# 配色のテーマ。dev-swiss・theme-paper・theme-slate・theme-contrast のどれか（使用するときは次の行の # を削除する）
# colorTheme: theme-paper

# mdmark build がまとめる文書と、書き出す先（docs/generated/ は git 管理外）
build:
  include: ["**/*.md"]
  out: ../generated/guide.html

# mdmark check が、記法を含む .md を .mark.md へ改名するよう提案しない
check:
  suggestMarkExtension: false
map:
  kinds:
    script:
      label: スクリプト
      icon: code-xml
      shape: rect
      color: blue
    mcp:
      label: MCP
      icon: plug
      shape: rounded
      color: green
    data:
      label: データ
      icon: database
      shape: double
      color: yellow
    external:
      label: 外部
      icon: globe
      shape: rounded
      color: gray
    start:
      label: 開始
      icon: play
      shape: pill
      color: green
    question:
      label: 質問
      icon: circle-question-mark
      shape: double
      color: orange
    action:
      label: アクション
      icon: wrench
      shape: rect
      color: blue
    result:
      label: 結果
      icon: flag
      shape: pill
      color: purple
  lines:
    read:
      dash: dashed
      width: normal
      head: open
    write:
      dash: solid
      width: thick
      head: filled
    loop:
      dash: long-dash
      width: normal
      head: open
