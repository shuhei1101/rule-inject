# yaml-language-server: $schema=../../schemas/files.schema.yaml
files:
  - path: 変更履歴.md
    name: 変更履歴
    description: バージョンごとの変更の一覧で、更新の前後で何が変わったかを調べるときに参照する。
    tags:
      - topic:変更履歴
    category: はじめに
    visibility: public
  - path: コアコンセプト-ルールの案内.md
    name: ルールの案内の仕組み
    description: 未読のルールの案内・既読の記録・既読の履歴・圧縮での破棄の仕組みを説明し、案内がいつどう出るかを知りたいときに参照する。
    tags:
      - topic:ルールの案内
      - topic:既読の記録
    category: はじめに
    visibility: public
  - path: コアコンセプト-MCPサーバー.md
    name: MCP サーバーの役割
    description: ローカルで常駐させる MCP サーバーの役割とフックとの関係を説明し、MCP サーバーを使用する理由を知りたいときに参照する。
    tags:
      - topic:MCPサーバー
      - tool:mcp
    category: はじめに
    visibility: public
  - path: セットアップ.md
    name: セットアップ
    description: プラグインを読み込み、設定ファイルを配置して環境変数で指すまでの手順で、初めて使用するときに参照する。
    tags:
      - topic:セットアップ手順
      - tool:claude-code
    category: 使用方法
    visibility: public
  - path: ルールにするか文書にするかを決める.md
    name: ルールにするか文書にするかの判定
    description: 規約・手順を索引へ登録して案内させるか、project-index の文書にしてタグで参照させるかを決める判定フローチャートで、規約や手順を追加するときに参照する。
    tags:
      - topic:判定フローチャート
      - topic:ルールの案内
    category: 使用方法
    visibility: public
  - path: 環境変数.md
    name: 環境変数
    description: 設定ファイルを指す環境変数と、索引の変数参照の値を説明し、環境変数の名前や配置場所を調べるときに参照する。
    tags:
      - topic:設定ファイル
      - topic:変数参照
    category: リファレンス
    visibility: public
  - path: 設定ファイル.md
    name: 設定ファイル
    description: 設定ファイルのキーと、global・projects の適用の仕方と重ね方を定め、設定ファイルを記載するときに参照する。
    tags:
      - topic:設定ファイル
    category: リファレンス
    visibility: public
  - path: 索引の書式.md
    name: 索引の書式
    description: ルール索引の YAML のキーと値の書式を定め、索引にルールを登録・修正するときに参照する。
    tags:
      - topic:ルール索引
    category: リファレンス
    visibility: public
  - path: MCPの結果の書式.md
    name: MCP の結果の書式
    description: 文書を返却する MCP のツールが結果に文書の場所と範囲を記載する書式を定め、MCP で読んだ文書を既読にしたいときに参照する。
    tags:
      - topic:既読の記録
      - tool:mcp
    category: リファレンス
    visibility: public
  - path: MCPツール.md
    name: MCP ツールの引数と応答
    description: 常駐の MCP サーバーが持つツールの引数と応答の一覧で、ツールの呼び方を調べるときに参照する。
    tags:
      - topic:MCPツール
      - tool:mcp
    category: リファレンス
    visibility: public
