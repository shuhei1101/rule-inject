id: IF-122-11
visibility: internal
title: "索引のチェック"
entry:
  kind: mcp_tool
  value: '`check_indexes`'
flows:
  - name: 正常系（違反が無い）
    summary: 問題の無い索引で `problem_count` が 0
    setup:
      - name: Mock
        description: なし（`127.0.0.1` の空いているポートで子プロセスとして起動したサーバーへ、MCP の Python SDK の Streamable HTTP のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: '`projects` にプロジェクトの直下を `match` とし索引を 1 つ持つ要素'
      - name: 索引
        description: 索引の書式どおりのエントリだけを持ち、各 `rule` の場所にルールの本文がある
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as check_indexes
        participant CF as 設定ファイル
        participant IDX as 索引
        participant FS as ルールの本文

        C->>IF: project_dir
        IF->>CF: 読む
        CF-->>IF: 索引の場所
        IF->>IDX: フックと同じ読み取りで読む
        IDX-->>IF: 読めた
        IF->>IF: JSON Schema に照らす
        IF->>FS: ルールの場所を確かめる
        FS-->>IF: ある
        IF-->>C: problem_count 0
      ```
    expected:
      - '`problem_count` が 0'
      - '`indexes` に索引の場所が載り、`hook_error` が `None` で `violations`・`missing_rules`・`skipped_entries` が空'
      - '`config_path` が `RULE_INJECT_CONFIG` の場所'
      - '`tag_check.state` が `no_patterns`（dev-docs に問い合わせない）'
    test: test_normal_when_no_violation
  - name: 正常系（Schemaに違反する）
    summary: フックは読めるが Schema に違反するエントリの場所と理由を返却する
    setup:
      - name: Mock
        description: なし（`127.0.0.1` の空いているポートで子プロセスとして起動したサーバーへ、MCP の Python SDK の Streamable HTTP のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: 違反が無いフローと同じ
      - name: 索引
        description: '1 つ目のエントリが `paths: []` を持つ'
        notes: フックは読めるが、Schema は要素が 1 つ以上のリストを求める
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as check_indexes
        participant IDX as 索引

        C->>IF: project_dir
        IF->>IDX: フックと同じ読み取りで読む
        IDX-->>IF: 読めた
        IF->>IF: JSON Schema に照らす（違反）
        IF-->>C: violations
      ```
    expected:
      - '`violations` に `location` が `rules[0].paths` の違反と理由が載っている'
      - '`hook_error` が `None`'
    test: test_normal_when_schema_violated
  - name: 正常系（フックが読めない）
    summary: フックが読めない索引は理由だけを返却し、Schema には照らさない
    setup:
      - name: Mock
        description: なし（`127.0.0.1` の空いているポートで子プロセスとして起動したサーバーへ、MCP の Python SDK の Streamable HTTP のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: 違反が無いフローと同じ
      - name: 索引
        description: 2 行にまたがるフロー形式のリストを含む
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as check_indexes
        participant IDX as 索引

        C->>IF: project_dir
        IF->>IDX: フックと同じ読み取りで読む
        IDX-->>IF: 読めない（行と理由）
        IF-->>C: hook_error
      ```
    expected:
      - '`hook_error` に行の番号を含む理由が載っている'
      - '`violations`・`missing_rules` が空'
    test: test_normal_when_unreadable_by_hook
  - name: 正常系（ルールの場所にファイルが無い）
    summary: ルールの場所にファイルが無いエントリを返却する
    setup:
      - name: Mock
        description: なし（`127.0.0.1` の空いているポートで子プロセスとして起動したサーバーへ、MCP の Python SDK の Streamable HTTP のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: 違反が無いフローと同じ
      - name: 索引
        description: 2 つ目のエントリの `rule` の場所にファイルが無い
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as check_indexes
        participant IDX as 索引
        participant FS as ルールの本文

        C->>IF: project_dir
        IF->>IDX: フックと同じ読み取りで読む
        IDX-->>IF: 読めた
        IF->>IF: JSON Schema に照らす
        IF->>FS: ルールの場所を確かめる
        FS-->>IF: 無い場所が 1 つ
        IF-->>C: missing_rules
      ```
    expected:
      - '`missing_rules` に `position` が 1 で、解いたルールの場所を持つ行が載っている'
      - '`problem_count` が 1'
    test: test_normal_when_rule_file_missing
  - name: 異常系（絶対パスでない・ToolError）
    summary: 相対パスの `project_dir` をエラーにする
    setup:
      - name: Mock
        description: なし（`127.0.0.1` の空いているポートで子プロセスとして起動したサーバーへ、MCP の Python SDK の Streamable HTTP のクライアントで接続し、ツールを呼ぶ）
      - name: 引数
        description: '`project_dir` に相対パスを指定する'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as check_indexes

        C->>IF: project_dir（相対パス）
        IF-->>C: isError: true（絶対パスで渡す旨）
      ```
    expected:
      - '結果が `isError: true` で、絶対パスで指定する旨が載っている'
    test: test_error_when_project_dir_not_absolute
  - name: 異常系（設定ファイルが読めない・ToolError）
    summary: 呼び出しの時点で読めない設定ファイルをエラーにする
    setup:
      - name: Mock
        description: なし（`127.0.0.1` の空いているポートで子プロセスとして起動したサーバーへ、MCP の Python SDK の Streamable HTTP のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: '`global` に知らないキーを持つ設定ファイル'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as check_indexes
        participant CF as 設定ファイル

        C->>IF: project_dir
        IF->>CF: 読む
        CF-->>IF: 知らないキー
        IF-->>C: isError: true（設定ファイルの場所と理由）
      ```
    expected:
      - '結果が `isError: true` で、設定ファイルの場所と知らないキーの理由が載っている'
    test: test_error_when_settings_unreadable
  - name: 正常系（pathsがどのファイルにも該当しない）
    summary: プロジェクトの索引の `paths` の該当しないエントリを返却し、ユーザー全体の索引の分は返却しない
    setup:
      - name: Mock
        description: なし（`127.0.0.1` の空いているポートで子プロセスとして起動したサーバーへ、MCP の Python SDK の Streamable HTTP のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: 違反が無いフローの設定に、`global.indexes` でユーザー全体の索引を指す
      - name: プロジェクトのファイル
        description: '`src/app.py` だけを配置する'
        notes: '`.git/config` も配置し、`.git` の下が辿られないことを確認する'
      - name: 索引
        description: '`paths: ["**/*.py"]` のエントリ、`paths: ["**/*.rs"]` のエントリ、`paths: ["**/config"]` のエントリ、`paths: ["**/*.py"]` と `exclude: ["**/src/**"]` のエントリ、`enabled: false` で `paths: ["**/*.go"]` のエントリを持ち、各 `rule` の場所にルールの本文がある'
        notes: 位置 1・2・3 が該当しない。位置 4 は無効のため確認しない
      - name: ユーザー全体の索引
        description: '`paths: ["**/*.java"]` のエントリを 1 つ持ち、`rule` の場所にルールの本文がある'
    flow: |-
      sequenceDiagram
        participant C as クライアント
        participant IF as check_indexes
        participant CF as 設定ファイル
        participant IDX as 索引
        participant PJ as プロジェクトのファイル

        C->>IF: project_dir
        IF->>CF: 読む
        CF-->>IF: 索引の場所と出所
        IF->>IDX: フックと同じ読み取りで読む
        IDX-->>IF: 読めた
        IF->>IF: JSON Schema に照らし、ルールの場所を確かめる
        IF->>PJ: .git を除いて辿る
        PJ-->>IF: ファイルの絶対パス
        IF->>IF: project の索引の効いているエントリの paths と exclude を当てる
        IF-->>C: unmatched_paths
    expected:
      - '`origin` が `project` の索引の `unmatched_paths` に、位置 1・2・3 のエントリが `rev` と解いたルールの場所つきで載っている'
      - 位置 0（該当する）と位置 4（無効）のエントリは `unmatched_paths` に載っていない
      - '`origin` が `global` の索引の `unmatched_paths` が空'
      - '`problem_count` が 3'
      - '`unmatched_scan.completed` が `true` で、`scanned_files` が 1（`.git` の下を数えない）'
    test: test_normal_when_paths_unmatched
  - name: 正常系（ユーザー全体の索引も確認する）
    summary: '`include_global` が `true` のとき、ユーザー全体の索引の `paths` の該当しないエントリも返却し、`problem_count` には数えない'
    setup:
      - name: Mock
        description: なし（`127.0.0.1` の空いているポートで子プロセスとして起動したサーバーへ、MCP の Python SDK の Streamable HTTP のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル・プロジェクトのファイル・索引
        description: paths がどのファイルにも該当しないフローと同じ
      - name: 引数
        description: '`include_global: true`'
    flow: |-
      sequenceDiagram
        participant C as クライアント
        participant IF as check_indexes
        participant PJ as プロジェクトのファイル

        C->>IF: project_dir・include_global true
        IF->>PJ: .git を除いて辿る
        PJ-->>IF: ファイルの絶対パス
        IF->>IF: global と project の索引の効いているエントリの paths と exclude を当てる
        IF-->>C: 索引ごとの unmatched_paths
    expected:
      - '`origin` が `global` の索引の `unmatched_paths` に、位置 0 のエントリが載っている'
      - '`origin` が `project` の索引の `unmatched_paths` は、paths がどのファイルにも該当しないフローと同じ'
      - '`problem_count` が 3（ユーザー全体の索引の分を数えない）'
    test: test_normal_when_global_included
  - name: 正常系（辿る時間の上限を超える）
    summary: 上限を超えたら辿るのをやめ、`paths` の該当しないエントリを返却せずに、終えられなかったことと続きの位置を返却する
    setup:
      - name: Mock
        description: なし（`127.0.0.1` の空いているポートで子プロセスとして起動したサーバーへ、MCP の Python SDK の Streamable HTTP のクライアントで接続し、ツールを呼ぶ）。サーバーの辿る時間の上限をテスト用に 0 秒へ差し替えて起動する
        notes: 差し替えのインターフェースはモジュール構成が決める。上限 0 秒では 1 回の呼び出しで 1 つのファイルだけを照合する
      - name: 設定ファイル・索引
        description: paths がどのファイルにも該当しないフローと同じ
      - name: プロジェクトのファイル
        description: paths がどのファイルにも該当しないフローのファイルに、どのエントリにも該当しない `docs/readme.md` を加える
        notes: 辿る順は `docs/readme.md`、`src/app.py`
    flow: |-
      sequenceDiagram
        participant C as クライアント
        participant IF as check_indexes
        participant PJ as プロジェクトのファイル

        C->>IF: project_dir
        IF->>PJ: .git を除いて名前の順に辿る
        IF->>IF: docs/readme.md を当てる
        IF->>IF: 次のファイルの前に上限を超えたのでやめる
        IF-->>C: unmatched_scan.completed false・next_cursor
    expected:
      - '`unmatched_scan.completed` が `false` で、`reason` に上限の秒数と `cursor` で続きから辿れる旨が載っている'
      - '`unmatched_scan.scanned_files` が 1 で、`next_cursor` が `None` でない'
      - どの索引の `unmatched_paths` も空
      - 違反・ファイルが無いエントリ・読み飛ばすエントリの確認は今どおり返っている
    test: test_normal_when_scan_timed_out
  - name: 正常系（続きから辿る）
    summary: 前の呼び出しの `next_cursor` を指定すると続きから辿り、最後まで辿れたら 1 回で辿ったときと同じ `paths` の該当しないエントリを返却する
    setup:
      - name: Mock
        description: 辿る時間の上限を超えるフローと同じ（上限 0 秒）
      - name: 設定ファイル・プロジェクトのファイル・索引
        description: 辿る時間の上限を超えるフローと同じ
      - name: 引数
        description: 1 回目は `cursor` を省き、2 回目は 1 回目の `unmatched_scan.next_cursor` を `cursor` に指定する
    flow: |-
      sequenceDiagram
        participant C as クライアント
        participant IF as check_indexes
        participant PJ as プロジェクトのファイル

        C->>IF: project_dir
        IF->>IF: docs/readme.md を当てて上限でやめる
        IF-->>C: completed false・next_cursor
        C->>IF: project_dir・cursor
        IF->>PJ: docs/readme.md より後から辿る
        IF->>IF: src/app.py をまだ当たっていないエントリに当てる
        IF-->>C: completed true・unmatched_paths
    expected:
      - 2 回目の `unmatched_scan.completed` が `true` で、`next_cursor` が `None`、`scanned_files` が 2
      - 2 回目の `origin` が `project` の索引の `unmatched_paths` が、paths がどのファイルにも該当しないフローと同じ位置 1・2・3
      - 2 回目の `problem_count` が 3
    test: test_normal_when_cursor_passed
  - name: 正常系（索引が変わった後に続きから辿る）
    summary: '`cursor` を返却した後に索引のエントリが変わったら、`cursor` を使用せず最初のファイルから辿る'
    setup:
      - name: Mock
        description: 辿る時間の上限を超えるフローと同じ（上限 0 秒）
      - name: 設定ファイル・プロジェクトのファイル・索引
        description: 辿る時間の上限を超えるフローと同じ
      - name: 索引の書き換え
        description: 1 回目の呼び出しの後、位置 1 のエントリの `paths` を `["**/*.toml"]` に書き換える
        notes: 位置 1 の `rev` が変わる
      - name: 引数
        description: 2 回目は 1 回目の `unmatched_scan.next_cursor` を `cursor` に指定する
    flow: |-
      sequenceDiagram
        participant C as クライアント
        participant IF as check_indexes
        participant PJ as プロジェクトのファイル

        C->>IF: project_dir
        IF-->>C: completed false・next_cursor
        C->>IF: project_dir・cursor（索引の書き換えの後）
        IF->>IF: エントリの一覧のハッシュが cursor と違う
        IF->>PJ: 最初のファイルから辿る
        IF->>IF: docs/readme.md を当てて上限でやめる
        IF-->>C: completed false・next_cursor
    expected:
      - 2 回目の `unmatched_scan.scanned_files` が 1（1 回目からの合計でない）で、`completed` が `false`
      - 2 回目の `next_cursor` が 1 回目の `next_cursor` と違う
    test: test_normal_when_index_changed_since_cursor
  - name: 異常系（cursorを使用できない・ToolError）
    summary: 読めない `cursor` と、別の `project_dir` で返却した `cursor` をエラーにする
    setup:
      - name: Mock
        description: なし（`127.0.0.1` の空いているポートで子プロセスとして起動したサーバーへ、MCP の Python SDK の Streamable HTTP のクライアントで接続し、ツールを呼ぶ）
      - name: 引数
        description: 1 つ目の呼び出しは `cursor` に `not-a-cursor` を指定する。2 つ目の呼び出しは、辿る時間の上限を超えるフローの `next_cursor` を、別の `project_dir` で指定する
    flow: |-
      sequenceDiagram
        participant C as クライアント
        participant IF as check_indexes

        C->>IF: project_dir・cursor（読めない）
        IF-->>C: isError: true（cursor を省いて呼び直す旨）
        C->>IF: 別の project_dir・cursor
        IF-->>C: isError: true（cursor を省いて呼び直す旨）
    expected:
      - 'どちらの呼び出しも結果が `isError: true` で、`cursor` を省いて再度呼び出す旨が載っている'
    test: test_error_when_cursor_invalid
  - name: 正常系（タグのパターンが使用中のどのタグにも該当しない）
    summary: dev-docs の使用されているタグに該当しないタグのパターンを、全ての索引について返却し、`problem_count` には数えない
    setup:
      - name: Mock
        description: '偽の dev-docs（テストが MCP の Python SDK で `127.0.0.1` の空いているポートに起動した MCP サーバー。`search_docs` が `groups: [{value: "Python", count: 2}, {value: "mcp", count: 1}]` を返却する）。サーバーは違反が無いフローと同じく子プロセスとして起動し、MCP の Python SDK の Streamable HTTP のクライアントで接続する'
      - name: 設定ファイル
        description: 違反が無いフローの設定に、`global.dev_docs_url` で偽の dev-docs の URL を指し、`global.indexes` でユーザー全体の索引を指す
      - name: 索引
        description: '`args: {"filter[tags]": ["python"]}` のエントリ、`args: {"filter[tags]": ["pyhton", "m*"]}` のエントリ、`read_by: [{tools: ["*search_docs"], args: {"filter[tags]": ["rust"]}}]` のエントリ、`args: {"filter.tags": ["go"]}` のエントリ、`enabled: false` で `args: {"filter[tags]": ["java"]}` のエントリを持つ'
        notes: 位置 0 は正規化したタグ `python` に該当する。位置 1 の `pyhton` と位置 2 の `rust` が該当しない。位置 3 はドットの道筋のため、位置 4 は無効のため確認しない
      - name: ユーザー全体の索引
        description: '`args: {"filter[tags]": ["re:^kotlin$"]}` のエントリを 1 つ持つ'
        notes: 正規表現のパターンも確認し、`global` の索引も記載することを確認する
    flow: |-
      sequenceDiagram
        participant C as クライアント
        participant IF as check_indexes
        participant IDX as 索引
        participant DD as dev-docs

        C->>IF: project_dir
        IF->>IDX: フックと同じ読み取りで読む
        IDX-->>IF: 読めた
        IF->>IF: 効いているエントリの [tags] のキーのパターンを集める
        IF->>DD: search_docs（source *・group_by tags）
        DD-->>IF: groups
        IF->>IF: パターンを返ったタグと正規化したタグに当てる
        IF-->>C: unused_tag_patterns・tag_check
    expected:
      - '`origin` が `project` の索引の `unused_tag_patterns` に、位置 1 の `args` の `filter[tags]` の `pyhton` と、位置 2 の `read_by[0].args` の `filter[tags]` の `rust` が `rev` つきで載っている'
      - 位置 1 の `m*`、位置 0・3・4 のパターンは載っていない
      - '`origin` が `global` の索引の `unused_tag_patterns` に、位置 0 の `re:^kotlin$` が載っている'
      - '`tag_check.state` が `checked` で `reason` が `None`'
      - '`problem_count` が 0（使用されていないタグのパターンを数えない）'
      - '偽の dev-docs が受けた `search_docs` の呼び出しが 1 回で、引数が `source: "*"`・`group_by: "tags"`・`format: "json"`・`cwd` が `project_dir`'
    test: test_normal_when_tag_pattern_unused
  - name: 正常系（dev-docsに届かない）
    summary: dev-docs に接続できないときは、使用されていないタグのパターンの確認だけを飛ばして理由を返却し、ツールのエラーにしない
    setup:
      - name: Mock
        description: なし（`127.0.0.1` の空いているポートで子プロセスとして起動したサーバーへ、MCP の Python SDK の Streamable HTTP のクライアントで接続し、ツールを呼ぶ）。dev-docs は起動しない
      - name: 設定ファイル
        description: 違反が無いフローの設定に、`global.dev_docs_url` で何も待ち受けていない `127.0.0.1` のポートの URL を指す
        notes: テストが `SO_REUSEADDR` を付けずにポート 0 で bind し、listen しないまま握っている番号を使用する（接続は拒否され、他のプロセスはそのポートで待ち受けられない）
      - name: 索引
        description: '`args: {"filter[tags]": ["python"]}` のエントリと、`rule` の場所にファイルが無いエントリを持つ'
        notes: ほかの確認が今どおり返ることを確認する
    flow: |-
      sequenceDiagram
        participant C as クライアント
        participant IF as check_indexes
        participant DD as dev-docs

        C->>IF: project_dir
        IF->>IF: 違反・ルールの場所・paths を確かめる
        IF->>DD: search_docs
        DD-->>IF: 接続できない
        IF->>IF: タグの確かめを飛ばす
        IF-->>C: tag_check.state skipped・reason
    expected:
      - ツールのエラーにならず `success` が `true`
      - '`tag_check.state` が `skipped` で、`reason` に接続先の URL と接続できなかった旨が載っている'
      - どの索引の `unused_tag_patterns` も空
      - '`missing_rules` にファイルが無いエントリが載り、`problem_count` が 1'
    test: test_normal_when_dev_docs_unreachable
  - name: 正常系（dev-docsが0件を返却する）
    summary: dev-docs が読める文書を 0 件と返却したときは、全てのパターンを使用されていないと報告せず、タグの確認を飛ばして理由を返却する
    setup:
      - name: Mock
        description: '偽の dev-docs（タグのパターンが使用されているどのタグにも該当しないフローと同じ起動方法）。`search_docs` が `groups` を持たない `{total_count: 0, returned: 0}` を返却する'
      - name: 設定ファイル・索引
        description: タグのパターンが使用されているどのタグにも該当しないフローと同じ
    flow: |-
      sequenceDiagram
        participant C as クライアント
        participant IF as check_indexes
        participant DD as dev-docs

        C->>IF: project_dir
        IF->>DD: search_docs（source *・group_by tags・cwd project_dir）
        DD-->>IF: total_count 0
        IF->>IF: タグの確かめを飛ばす
        IF-->>C: tag_check.state skipped・reason
    expected:
      - '`tag_check.state` が `skipped` で、`reason` に読める文書が 0 件だった旨が載っている'
      - どの索引の `unused_tag_patterns` も空
      - 偽の dev-docs が受けた `cwd` が `project_dir`
    test: test_normal_when_dev_docs_returns_nothing
  - name: 正常系（参照するツールの名前が無い）
    summary: '`read_tool` が `tool` を持たないエントリを、フックが読めない索引として理由を返却する'
    setup:
      - name: Mock
        description: なし（`127.0.0.1` の空いているポートで子プロセスとして起動したサーバーへ、MCP の Python SDK の Streamable HTTP のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: 違反が無いフローと同じ
      - name: 索引
        description: 1 つ目のエントリの `read_tool` が `args` だけを持つ（`tool` が無い）
        notes: ルール案内の制約「参照するツールの書式」のとおり、フックも読めない
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as check_indexes
        participant IDX as 索引

        C->>IF: project_dir
        IF->>IDX: フックと同じ読み取りで読む
        IDX-->>IF: 読めない（read_tool の書式の誤り）
        IF-->>C: hook_error
      ```
    expected:
      - '`hook_error` に、`read_tool` の `tool` が無い旨が載っている'
      - '`violations` が空（JSON Schema には照らさない）'
    test: test_normal_when_read_tool_name_missing
  - name: 正常系（参照するツールの記載がSchemaに違反する）
    summary: フックは読めるが、`read_tool.args` が空のオブジェクトのエントリの Schema の違反を返却する
    setup:
      - name: Mock
        description: なし（同上）
      - name: 設定ファイル
        description: 違反が無いフローと同じ
      - name: 索引
        description: '1 つ目のエントリの `read_tool` が `tool: mcp__docs__search_docs` と、`args` に空のオブジェクトの JSON の文字列 `{}` を持つ'
        notes: フックは読めるが、Schema は `args` を記載するときキーを 1 つ以上求める
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as check_indexes
        participant IDX as 索引

        C->>IF: project_dir
        IF->>IDX: フックと同じ読み取りで読む
        IDX-->>IF: 読めた
        IF->>IF: JSON Schema に照らす（違反）
        IF-->>C: violations
      ```
    expected:
      - '`violations` に `location` が `rules[0].read_tool.args` の違反と理由が載っている'
      - '`hook_error` が `None`'
    test: test_normal_when_read_tool_violates_schema
lead: プロジェクトで読み込む索引ごとに、読めない理由・スキーマの違反・ルールの無いエントリ・使われていないタグを返却するツールを定め、索引のチェックを修正するときに参照する。
identifier: check_indexes
idempotent: true
side_effects: なし（`readOnlyHint`）
request:
  - name: project_dir
    type: str
    required: true
    location: argument
    description: プロジェクトの直下
    constraints: 絶対パス
    notes: インターフェース定義「ルールの一覧」の `project_dir` と同じ
  - name: format
    type: Literal['markdown', 'json']
    required: false
    default: markdown
    location: argument
    description: 応答の形式
    notes: インターフェース定義「ルールの一覧」の `format` と同じ
  - name: include_global
    type: bool
    required: false
    default: 'False'
    location: argument
    description: ユーザー全体の索引（`global.indexes`、無ければユーザーの既定の索引）の `paths` の該当しないエントリも確認するか
    notes: 既定ではプロジェクトの索引だけを確認する。ユーザー全体の索引の違反・ファイルが無いエントリ・読み飛ばすエントリは、この引数によらず今どおり確認する
    status: planned
  - name: cursor
    type: str | None
    required: false
    default: なし（最初のファイルから辿る）
    location: argument
    description: 前の呼び出しの `unmatched_scan.next_cursor`。指定すると、`paths` の該当しないエントリの検出を前の呼び出しが止まった続きから行う
    notes: '`project_dir`・`include_global` は前の呼び出しと同じ値で指定する。違反・ファイルが無いエントリ・読み飛ばすエントリの確認は、この引数によらず毎回全て行う'
    status: planned
response:
  - name: success
    type: bool
    description: チェックを最後まで行えたか
    notes: 問題が見つかっても `true`。問題の有無は `problem_count` で確認する
  - name: output
    type: str
    description: チェックした索引の数と問題の件数の 1 行
  - name: config_path
    type: str | None
    description: サーバーが読んだ設定ファイルの場所
  - name: problem_count
    type: int
    description: 全ての索引の `hook_error`・`violations`・`missing_rules`・`skipped_entries` の件数と、プロジェクトの索引の `unmatched_paths` の件数の合計（ユーザー全体の索引の `unmatched_paths` と、どの索引の `unused_tag_patterns` も数えない）
  - name: indexes[].index
    type: str
    description: チェックした索引の場所
    notes: フックが読む順
  - name: indexes[].hook_error
    type: str | None
    description: フックがその索引を読めない理由
    notes: 書式の誤りは行の番号を含む。読めたときは `None`
  - name: indexes[].violations[].location
    type: str
    description: 索引の中の場所
    example: '`rules[0].paths`'
  - name: indexes[].violations[].reason
    type: str
    description: JSON Schema に違反する理由
  - name: indexes[].missing_rules[].position
    type: int
    description: ルールの場所にファイルが無いエントリの位置
  - name: indexes[].missing_rules[].rule
    type: str
    description: 変数参照を展開し、索引のフォルダから解いたルールの場所
  - name: indexes[].skipped_entries[].position
    type: int
    description: フックが読み飛ばすエントリの位置
  - name: indexes[].skipped_entries[].reason
    type: str
    description: 読み飛ばす理由
    notes: インターフェース定義「ルールの一覧」の `skipped_entries[].reason` と同じ
  - name: unmatched_scan.completed
    type: bool
    description: '`paths` の該当しないエントリの検出を最後まで行えたか'
    notes: '`false` のときはどの索引の `unmatched_paths` も空で、`next_cursor` を返却する'
  - name: unmatched_scan.scanned_files
    type: int
    description: 辿ったプロジェクトのファイルの数
    notes: '`cursor` を指定したときは、最初の呼び出しからの合計'
  - name: unmatched_scan.reason
    type: str | None
    description: 検出を終えられなかった理由
    notes: 辿る時間の上限で止まったとき、上限の秒数と、`next_cursor` を `cursor` に指定すると続きから辿れることを含む。終えられたときは `None`
  - name: indexes[].origin
    type: Literal['global', 'project']
    description: 索引の出所
    notes: '`global` は `global.indexes`（無ければユーザーの既定の索引）、`project` は該当した `projects[].indexes` とプロジェクトの既定の置き場所の索引'
  - name: indexes[].unmatched_paths[].position
    type: int
    description: '`paths` がプロジェクトのどのファイルにも該当しないエントリの位置'
    notes: '`global` の索引は `include_global` が `true` のときだけ記載する'
  - name: indexes[].unmatched_paths[].rev
    type: str
    description: エントリのバージョン
    notes: インターフェース定義「ルールの一覧」の `rev` と同じ。編集のツールの `expected_rev` に指定できる
  - name: indexes[].unmatched_paths[].rule
    type: str
    description: 変数参照を展開し、索引のフォルダから解いたルールの場所
  - name: unmatched_scan.next_cursor
    type: str | None
    description: 辿る時間の上限で止まったときの続きの位置。`cursor` に指定して再度呼び出すと続きから辿る
    notes: 最後まで辿れたときは `None`。中身は辿り終えた最後のファイル・それまでに辿ったファイルの数・まだ該当していないエントリ・確認するエントリの一覧のハッシュ・`project_dir`・`include_global` を持つ不透明な文字列
  - name: indexes[].unused_tag_patterns[].position
    type: int
    description: 使用されていないタグのパターンを持つエントリの位置
    notes: '`global` と `project` のどちらの索引も記載する。dev-docs の文書の状態で増減する警告のため `problem_count` には数えない'
  - name: indexes[].unused_tag_patterns[].rev
    type: str
    description: エントリのバージョン
    notes: インターフェース定義「ルールの一覧」の `rev` と同じ。編集のツールの `expected_rev` に指定できる
  - name: indexes[].unused_tag_patterns[].location
    type: str
    description: パターンを記載した条件の場所
    example: '`args` / `read_by[1].args`'
  - name: indexes[].unused_tag_patterns[].key
    type: str
    description: パターンを記載したキー
    example: '`filter[tags]`'
  - name: indexes[].unused_tag_patterns[].pattern
    type: str
    description: 使用されているどのタグにも該当しないパターン（索引に記載したまま）
  - name: tag_check.state
    type: Literal['checked', 'skipped', 'no_patterns']
    description: 使用されていないタグのパターンの確認の結果
    notes: '`checked` は dev-docs のタグに照らした、`skipped` は dev-docs に届かず飛ばした、`no_patterns` は確認するパターンが無く dev-docs に問い合わせなかった。`checked` 以外のときはどの索引の `unused_tag_patterns` も空'
  - name: tag_check.reason
    type: str | None
    description: 飛ばした理由
    notes: '`skipped` のとき、接続先と、接続できない・待ち時間の上限を超えた・エラーを返却した・読める文書が 0 件だったのどれかとその内容を含む。それ以外は `None`'
response_example: |-
  ```json
  {
    "success": true,
    "output": "索引 2 件・問題 2 件",
    "config_path": "/home/user/.config/rule-inject/settings.yaml",
    "problem_count": 2,
    "unmatched_scan": {"completed": true, "scanned_files": 1520, "reason": null, "next_cursor": null},
    "tag_check": {"state": "checked", "reason": null},
    "indexes": [
      {
        "index": "/home/user/.config/rule-inject/rules.yaml",
        "origin": "global",
        "hook_error": null,
        "violations": [],
        "missing_rules": [],
        "skipped_entries": [],
        "unmatched_paths": [],
        "unused_tag_patterns": [{"position": 0, "rev": "8b21e4f0a7c3", "location": "args", "key": "filter[tags]", "pattern": "pyhton"}]
      },
      {
        "index": "/home/user/project/rules.yaml",
        "origin": "project",
        "hook_error": null,
