        "unused_tag_patterns": []
      }
    ]
  }
  ```
exceptions:
  - name: なし（正常終了）
    condition: チェックを最後まで行えた
    notes: 索引の問題はエラーにせず応答に記載する
  - name: ToolError（絶対パスでない）
    condition: '`project_dir` が絶対パスでない'
    notes: インターフェース定義「ルールの一覧」と同じ
  - name: ToolError（設定ファイルが読めない）
    condition: インターフェース定義「ルールの一覧」と同じ
    notes: 設定ファイルの場所と理由を返却する
  - name: ToolError（cursor を使用できない）
    condition: '`cursor` が読めない、または `project_dir`・`include_global` が `cursor` を返却した呼び出しと違う'
    notes: '`cursor` を省いて再度呼び出す旨を返却する'
error_format: インターフェース定義「ルールの一覧」と同じ
constraints:
  - item: チェックの順
    constraint: 索引ごとに、フックと同じ読み取り（`parse_index`）→ JSON Schema → ルールの場所の実在の順に確認する。フックが読めない索引は JSON Schema に照らさず、ルールの場所も確認しない
    notes: フックが読めない索引はどのエントリも案内に使用されないため、その理由だけを返却する
  - item: 索引の JSON Schema
    constraint: 索引のキーと値の範囲を JSON Schema 2020-12 で記載した YAML を `jsonschema` で照らす。違反は全て並べる
    notes: 'Schema が受け付ける範囲は、フックの読み取りが受け付ける範囲の内側にする（例: `paths: []` はフックが読めるが Schema は要素を 1 つ以上求める）。置き場所はモジュール構成が決める。`read_tool` は `tool`（`^mcp__` の文字列）を必須、`args`（文字列。空のオブジェクト `{}` を除くため、`{` の後に空白を挟んで `"` が続く文字列を正規表現で求める）と `optional_args`（`args` と同じ）を任意とし、他のキーを許さない'
  - item: 索引の中の場所
    constraint: キーは `.`、リストの要素は `[位置]` で結ぶ（例 `rules[0].read_by[1].tools`）。最上位の違反は `$`
  - item: ルールの場所の実在
    constraint: '照合に使用するエントリ（`enabled: false` と読み飛ばすエントリを除く）の、解いた場所にファイルがあるかを確認する'
    notes: 読み飛ばすエントリは場所を解けないため `skipped_entries` に記載する
  - item: 読む索引
    constraint: インターフェース定義「ルールの一覧」の制約「読む索引」「変数参照」と同じ
    notes: 設定ファイルが指すのに無い索引は `hook_error` に理由を記載する
  - item: 認可
    constraint: 制限なし
  - item: paths の当たらないエントリ
    constraint: '有効なエントリ（`enabled: false`・読み飛ばすエントリ・フックが読めない索引のエントリを除く）のうち `paths` を持つものを、フックと同じ照合（`paths` と `exclude`。`on` は問わない）でプロジェクトのファイルの絶対パスに当て、どれにも該当しないものを返却する。確認するのは `project` の索引と、`include_global` が `true` のときの `global` の索引'
    notes: 書き込み前の検証（インターフェース定義「エントリの書き込み」「エントリの削除」）には含めない。記載するエントリがまだ無いファイルを指すことがあるため
  - item: 辿るファイル
    constraint: '`project_dir` の下を `.git` フォルダだけ除いて辿る。`.gitignore` で除いたファイルも辿る。フォルダへのシンボリックリンクは辿らない。辿る順はパスの部品ごとの名前の順に固定する。辿るのは 1 回の呼び出しで 1 回だけで、全ての索引のエントリをその結果と照合する'
    notes: フックは `.gitignore` で除いたファイルにも案内を出すため（[paths の該当しないエントリの検出の要件](https://github.com/shuhei1101/rule-inject/blob/5f011a1b5f42dfd0bd76655c01280a17b432e23c/dev/pr/69/%E8%A6%81%E4%BB%B6.md) の推奨案 A）。リンクを辿るとループしうる。順を固定するのは、`cursor` で続きの位置を決めるため
  - item: 辿る時間
    constraint: 1 回の呼び出しで、ファイルを辿り、エントリと照合する時間は 30 秒まで。その呼び出しの 2 つ目以降のファイルを照合する前ごとに経過時間を確認し、上限以上ならやめ、`unmatched_scan.completed` を `false` にしてどの索引の `unmatched_paths` も返却せず、`next_cursor` を返却する
    decided_by: NFR-122-1#requirements[プロジェクトのファイルを辿る時間]
    notes: 該当したエントリは残りのファイルと照合せず、まだ該当していないエントリだけを次のファイルと照合する。全てのエントリが該当したら辿るのもやめる。1 回の呼び出しで少なくとも 1 つのファイルを照合するため、再度呼び出すたびに必ず先へ進む
  - item: 続きから辿る
    constraint: '`cursor` を指定したときは、`cursor` の最後のファイルより後のファイルから辿り、`cursor` のまだ該当していないエントリだけを照合する。確認するエントリの一覧（索引・位置・`rev`）のハッシュが `cursor` と違うときは、`cursor` を使用せず最初のファイルから辿る'
    notes: 索引が書き換わると、前の呼び出しで該当したエントリが変わりうるため。再度呼び出すまでの間に増えたファイルのうち、辿り終えた位置より前のものは照合しない
  - item: 使われていないタグのパターン
    constraint: '`global` と `project` の全ての索引の有効なエントリ（`enabled: false`・読み飛ばすエントリ・フックが読めない索引のエントリを除く）の `args` と `read_by[].args` のうち、キーが `[tags]` で終わる条件のパターンを、dev-docs の使用されているタグに照らす。パターンはフックと同じ照合（glob・正規表現）で、返ったタグそのものか、NFKC と `casefold` で正規化したタグのどちらかに該当すれば使用されているとし、どれにも該当しないものを返却する'
    notes: 書き込み前の検証（インターフェース定義「エントリの書き込み」「エントリの削除」）には含めない。記載する時点で、まだ文書に付けていないタグを指すことがあるため。ドットの道筋のキー（`filter.tags`）はタグとみなさない
  - item: dev-docs への問い合わせ
    constraint: '確認するパターンが 1 つ以上あるときだけ、1 回の呼び出しにつき 1 回、`global.dev_docs_url` の dev-docs の `search_docs` を `source: "*"`・`group_by: "tags"`・`format: "json"`・`cwd: project_dir` で呼び、`groups[].value` を使用されているタグとする。接続できない・待ち時間の上限を超えた・`isError` が `true` のときと、`total_count` が 0（`project_dir` から読める配信元が無いか文書が無い。`groups` のキー自体が返らない）のときは、ツールのエラーにせず `tag_check.state` を `skipped` にして理由を記載する'
    decided_by: NFR-122-1#requirements[dev-docs への問い合わせの待ち時間]
    notes: 索引ごとに再度問い合わせない。ほかの確認（違反・ファイルが無いエントリ・読み飛ばすエントリ・`paths` の該当しないエントリ）は今どおり返却する。呼び出し方は外部 API「dev-docs」
  - item: 問い合わせと辿る順
    constraint: dev-docs への問い合わせは、ファイルを辿る前に始め、辿るのと並べて行う。辿り終えた後（辿る時間の上限で止まったときを含む）に問い合わせの応答を待ち、待ち時間の上限（207 秒）は問い合わせを始めた時点から数える。1 回の呼び出しの所要時間の上限は、問い合わせの待ち時間（207 秒）と辿る時間（30 秒）の大きい方に、余裕を加えた 212 秒
    decided_by: NFR-122-1#requirements[dev-docs への問い合わせの待ち時間]
    notes: 続けて行うと 237 秒 + 余裕になる。余裕は、内側の待ち以外の処理（索引の読み取り・JSON Schema・ルールの場所の実在・照合・結果の組み立て）の 1,000 回の実測の p99.9（4.071 秒。p50 1.247 秒・最大 4.781 秒）で、207 + 4.071 = 211.071 を秒に切り上げる（規約『資源の値の決め方』の「入れ子の待ち」）。実測は、手元の索引 3 件（エントリ 152 件）と、タグのパターンを 2 つずつ持つエントリ 152 件の索引（パターン 304 件）を 1 回ずつ順に確認し、1 回の全体の時間から辿る時間を差し引いた残りを測った。照合は、dev-docs が実際に返却する件数（最大 1,081 件）より多い 2,000 件の、どのパターンにも該当しないタグで測った（[実測の記録](https://github.com/shuhei1101/rule-inject/tree/4dee0c9f400d25d24bb562d381904449ac9df54d/dev/pr/90/%E5%AE%9F%E6%B8%AC)）
