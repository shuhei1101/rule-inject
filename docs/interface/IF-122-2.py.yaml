id: IF-122-2
visibility: internal
title: "エントリの書き込み"
entry:
  kind: mcp_tool
  value: '`write_index_entry`'
flows:
  - name: 正常系（エントリを新規作成する）
    summary: 末尾にエントリを追加し、他の行を変えない
    setup:
      - name: Mock
        description: なし（`127.0.0.1` の空いているポートで子プロセスとして起動したサーバーへ、MCP の Python SDK の Streamable HTTP のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: '`projects` にプロジェクトの直下を `match` とし索引を 1 つ持つ要素'
      - name: 索引
        description: コメント・引用符つきの値・1 行のフロー形式の `paths` を持つエントリを 1 つ持つ
        notes: 書き込みの前の内容を記録する
      - name: ルールの本文
        description: 新しいエントリが指す Markdown
      - name: 引数
        description: '`index` と、`rule`・80 字を超える `paths` の glob・`on` を持つ `entry`（`position` なし）'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as write_index_entry
        participant CF as 設定ファイル
        participant IDX as 索引

        C->>IF: project_dir・index・entry
        IF->>CF: 読む
        CF-->>IF: 読む索引
        IF->>IDX: round-trip で読む
        IDX-->>IF: 書式つきの内容
        IF->>IF: 末尾に追加し、チェックする
        IF->>IDX: 一時ファイルに書き込み、置き換える
        IF-->>C: position・rev・diff
      ```

      <!-- /map -->
    expected:
      - 索引の末尾に指定したエントリがあり、新しい `paths` が 1 行のフロー形式
      - 書き込みの前との差分が追加したエントリの行だけ
      - 索引を `load_indexes` で読むと、追加したエントリが読み飛ばされずに読める
      - '`position` が 1、`written` が `true`'
    test: test_normal_when_entry_created
  - name: 正常系（エントリを編集する）
    summary: 位置で指したエントリのキーだけを書き換える
    setup:
      - name: Mock
        description: なし（`127.0.0.1` の空いているポートで子プロセスとして起動したサーバーへ、MCP の Python SDK の Streamable HTTP のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: エントリを新規作成するフローと同じ
      - name: 索引
        description: コメントを持つエントリを 2 つ持つ
        notes: 書き込みの前の内容を記録する
      - name: 引数
        description: '`position: 1`、2 つ目のエントリの `expected_rev`、`entry` に新しい `paths` だけ'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as write_index_entry
        participant IDX as 索引

        C->>IF: index・position 1・expected_rev・entry
        IF->>IDX: round-trip で読む
        IDX-->>IF: 書式つきの内容
        IF->>IF: バージョンを比べ、paths を書き換えてチェックする
        IF->>IDX: 一時ファイルに書き込み、置き換える
        IF-->>C: position・rev・diff
      ```

      <!-- /map -->
    expected:
      - 2 つ目のエントリの `paths` が指定した値で、他のキーは変わっていない
      - 書き込みの前との差分が書き換えた行だけで、1 つ目のエントリとコメントは変わっていない
      - 応答の `rev` が `expected_rev` と違う
    test: test_normal_when_entry_updated
  - name: 正常系（エントリを無効にする）
    summary: '`enabled: false` を記載し、照合に使用されなくする'
    setup:
      - name: Mock
        description: なし（`127.0.0.1` の空いているポートで子プロセスとして起動したサーバーへ、MCP の Python SDK の Streamable HTTP のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: エントリを新規作成するフローと同じ
      - name: 索引
        description: '`enabled` を記載しないエントリを 1 つ持つ'
      - name: 引数
        description: '`position: 0`、`expected_rev`、`entry: {enabled: false}`'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as write_index_entry
        participant IDX as 索引

        C->>IF: index・position 0・expected_rev・enabled: false
        IF->>IDX: round-trip で読む
        IDX-->>IF: 書式つきの内容
        IF->>IF: enabled: false を記載し、チェックする
        IF->>IDX: 一時ファイルに書き込み、置き換える
        IF-->>C: position・rev・diff
      ```

      <!-- /map -->
    expected:
      - '対象のエントリに `enabled: false` が記載されている'
      - 索引を `load_indexes` で読むと、対象のエントリが読めたエントリに入っていない
    test: test_normal_when_entry_disabled
  - name: 正常系（書き込まずに確認する）
    summary: '`dry_run` でチェックと差分だけを返却する'
    setup:
      - name: Mock
        description: なし（`127.0.0.1` の空いているポートで子プロセスとして起動したサーバーへ、MCP の Python SDK の Streamable HTTP のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: エントリを新規作成するフローと同じ
      - name: 索引
        description: エントリを 1 つ持つ
        notes: 書き込みの前のバイト列を記録する
      - name: 引数
        description: 'エントリを新規作成するフローと同じ `entry` と `dry_run: true`'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as write_index_entry
        participant IDX as 索引

        C->>IF: index・entry・dry_run: true
        IF->>IDX: round-trip で読む
        IDX-->>IF: 書式つきの内容
        IF->>IF: 末尾に追加し、チェックする
        IF-->>C: written: false・diff
      ```

      <!-- /map -->
    expected:
      - '`written` が `false` で、`diff` に追加するエントリの行が載っている'
      - 索引のファイルが書き込みの前のバイト列のまま
    test: test_normal_when_dry_run
  - name: 正常系（もとから問題のある索引のエントリを修正する）
    summary: 他のエントリにもとから問題が残っていても、新しい問題を生まない書き込みは許可する
    setup:
      - name: Mock
        description: なし（`127.0.0.1` の空いているポートで子プロセスとして起動したサーバーへ、MCP の Python SDK の Streamable HTTP のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: エントリを新規作成するフローと同じ
      - name: 索引
        description: '1 つ目が `paths: []`、2 つ目が `rule` の場所にファイルが無いエントリを持つ'
      - name: 引数
        description: '`position: 0`、1 つ目のエントリの `expected_rev`、`entry` に空でない `paths`'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as write_index_entry
        participant IDX as 索引

        C->>IF: index・position 0・expected_rev・entry
        IF->>IDX: round-trip で読む
        IDX-->>IF: 書式つきの内容
        IF->>IF: 書き込む前と書き込んだ後をチェックし、新しい問題が無いことを確認する
        IF->>IDX: 一時ファイルに書き込み、置き換える
        IF-->>C: position・rev・diff
      ```

      <!-- /map -->
    expected:
      - '`written` が `true` で、1 つ目のエントリの `paths` が指定した値'
      - 2 つ目のエントリが書き込みの前のまま残っている
    test: test_normal_when_existing_problems_remain
  - name: 異常系（引数の組み合わせが誤り・ToolError）
    summary: '`position` だけを指定し `expected_rev` を指定しない呼び出しをエラーにする'
    setup:
      - name: Mock
        description: なし（`127.0.0.1` の空いているポートで子プロセスとして起動したサーバーへ、MCP の Python SDK の Streamable HTTP のクライアントで接続し、ツールを呼ぶ）
      - name: 引数
        description: '`position: 0` と `entry` を指定し、`expected_rev` を指定しない'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as write_index_entry

        C->>IF: index・position 0・entry
        IF-->>C: isError: true（expected_rev を指定する旨）
      ```

      <!-- /map -->
    expected:
      - '結果が `isError: true` で、`expected_rev` を指定する旨が載っている'
    test: test_error_when_arguments_invalid
  - name: 異常系（設定ファイルが読めない・ToolError）
    summary: 呼び出しの時点で読めない設定ファイルをエラーにする
    setup:
      - name: Mock
        description: なし（`127.0.0.1` の空いているポートで子プロセスとして起動したサーバーへ、MCP の Python SDK の Streamable HTTP のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: '`global` に知らないキーを持つ設定ファイル'
      - name: 索引
        description: エントリを 1 つ持つ
        notes: 書き込みの前のバイト列を記録する
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as write_index_entry
        participant CF as 設定ファイル

        C->>IF: project_dir・index・entry
        IF->>CF: 読む
        CF-->>IF: 知らないキー
        IF-->>C: isError: true（設定ファイルの場所と理由）
      ```

      <!-- /map -->
    expected:
      - '結果が `isError: true` で、設定ファイルの場所と知らないキーの理由が載っている'
      - 索引のファイルが書き込みの前のバイト列のまま
    test: test_error_when_settings_unreadable
  - name: 異常系（設定ファイルで読む索引でない・ToolError）
    summary: 設定ファイルで読まないファイルへの書き込みを断る
    setup:
      - name: Mock
        description: なし（`127.0.0.1` の空いているポートで子プロセスとして起動したサーバーへ、MCP の Python SDK の Streamable HTTP のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: エントリを新規作成するフローと同じ
      - name: 対象のファイル
        description: 設定ファイルで読まない場所に配置した、索引の書式の YAML
        notes: 書き込みの前のバイト列を記録する
      - name: 引数
        description: '`index` に対象のファイル、書式どおりの `entry`'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as write_index_entry
        participant CF as 設定ファイル

        C->>IF: project_dir・index（読まない場所）・entry
        IF->>CF: 読む
        CF-->>IF: 読む索引（index を含まない）
        IF-->>C: isError: true（設定ファイルで読む索引でない旨）
      ```

      <!-- /map -->
    expected:
      - '結果が `isError: true` で、設定ファイルで読む索引でない旨と読む索引の場所が載っている'
      - 対象のファイルが書き込みの前のバイト列のまま
    test: test_error_when_not_configured_index
  - name: 異常系（索引がYAMLとして読めない・ToolError）
    summary: YAML として読めない索引への書き込みを断る
    setup:
      - name: Mock
        description: なし（`127.0.0.1` の空いているポートで子プロセスとして起動したサーバーへ、MCP の Python SDK の Streamable HTTP のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: エントリを新規作成するフローと同じ
      - name: 索引
        description: 閉じていないフロー形式のリストを持ち、YAML として読めない
        notes: 書き込みの前のバイト列を記録する
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as write_index_entry
        participant IDX as 索引

        C->>IF: index・entry
        IF->>IDX: round-trip で読む
        IDX-->>IF: 読めない
        IF-->>C: isError: true（索引の場所と理由）
      ```

      <!-- /map -->
    expected:
      - '結果が `isError: true` で、索引の場所と読めない理由が載っている'
      - 索引のファイルが書き込みの前のバイト列のまま
    test: test_error_when_index_unparsable
  - name: 異常系（エントリの位置が無い・ToolError）
    summary: エントリの数以上の位置への書き込みを断る
    setup:
      - name: Mock
        description: なし（`127.0.0.1` の空いているポートで子プロセスとして起動したサーバーへ、MCP の Python SDK の Streamable HTTP のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: エントリを新規作成するフローと同じ
      - name: 索引
        description: エントリを 1 つ持つ
        notes: 書き込みの前のバイト列を記録する
      - name: 引数
        description: '`position: 1` と任意の `expected_rev`'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as write_index_entry
        participant IDX as 索引

        C->>IF: index・position 1・expected_rev・entry
        IF->>IDX: round-trip で読む
        IDX-->>IF: エントリ 1 つ
        IF-->>C: isError: true（位置が無い旨とエントリの数）
      ```

      <!-- /map -->
    expected:
      - '結果が `isError: true` で、位置が無い旨とエントリの数 1 が載っている'
      - 索引のファイルが書き込みの前のバイト列のまま
    test: test_error_when_entry_not_found
  - name: 異常系（バージョンが合わない・ToolError）
    summary: 一覧を取った後に書き換えられたエントリへの書き込みを断る
    setup:
      - name: Mock
        description: なし（`127.0.0.1` の空いているポートで子プロセスとして起動したサーバーへ、MCP の Python SDK の Streamable HTTP のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: エントリを新規作成するフローと同じ
      - name: 索引
        description: エントリを 1 つ持ち、一覧で `rev` を取った後にテストがそのエントリの `paths` を直接書き換える
        notes: 書き換えた後のバイト列を記録する
      - name: 引数
        description: '`position: 0` と、書き換える前に取った `expected_rev`'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as write_index_entry
        participant IDX as 索引

        C->>IF: index・position 0・古い expected_rev・entry
        IF->>IDX: round-trip で読む
        IDX-->>IF: 書き換えられたエントリ
        IF-->>C: isError: true（今のバージョンと再取得する旨）
      ```

      <!-- /map -->
    expected:
      - '結果が `isError: true` で、今のバージョンと一覧を再取得する旨が載っている'
      - 索引のファイルがテストが書き換えた後のバイト列のまま
    test: test_error_when_rev_mismatch
  - name: 異常系（書き込んだ後の索引がチェックに通らない・ToolError）
    summary: Schema に違反するエントリの新規作成を断る
    setup:
      - name: Mock
        description: なし（`127.0.0.1` の空いているポートで子プロセスとして起動したサーバーへ、MCP の Python SDK の Streamable HTTP のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: エントリを新規作成するフローと同じ
      - name: 索引
        description: エントリを 1 つ持つ
        notes: 書き込みの前のバイト列を記録する
      - name: 引数
        description: '`paths: []` を持つ `entry`（`position` なし）'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as write_index_entry
        participant IDX as 索引

        C->>IF: index・entry（paths: []）
        IF->>IDX: round-trip で読む
        IDX-->>IF: 書式つきの内容
        IF->>IF: 末尾に追加し、チェックする（違反）
        IF-->>C: isError: true（違反の場所と理由）
      ```

      <!-- /map -->
    expected:
      - '結果が `isError: true` で、`rules[1].paths` と違反の理由が載っている'
      - 索引のファイルが書き込みの前のバイト列のまま
    test: test_error_when_check_failed
  - name: 異常系（フックが読めない索引・ToolError）
    summary: フックが読めない索引の、位置で指した書き換えを断る
    setup:
      - name: Mock
        description: なし（`127.0.0.1` の空いているポートで子プロセスとして起動したサーバーへ、MCP の Python SDK の Streamable HTTP のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: エントリを新規作成するフローと同じ
      - name: 索引
        description: 'YAML としては読めるが、エントリに `on: [foo]` を持ちフックが読めない'
        notes: 書き込みの前のバイト列を記録する
      - name: 引数
        description: '`position: 0`、任意の `expected_rev`、`entry: {on: [write]}`'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as write_index_entry
        participant IDX as 索引

        C->>IF: index・position 0・expected_rev・entry
        IF->>IDX: 読む
        IDX-->>IF: フックの読み取りが読めない内容
        IF-->>C: isError: true（フックが読めない理由と手で修正する旨）
      ```

      <!-- /map -->
    expected:
      - '結果が `isError: true` で、フックが読めない理由（行の番号を含む）と、索引を手で修正する旨が載っている'
      - 索引のファイルが書き込みの前のバイト列のまま
    test: test_error_when_hook_unreadable
  - name: 異常系（索引の書式を保てない・ToolError）
    summary: 対象のエントリの外の行が変わる書き込みを断る
    setup:
      - name: Mock
        description: なし（`127.0.0.1` の空いているポートで子プロセスとして起動したサーバーへ、MCP の Python SDK の Streamable HTTP のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: エントリを新規作成するフローと同じ
      - name: 索引
        description: 'エントリ 2 件。`rules[1]` が `paths: [docs/**, ~]` を持つ'
        notes: 書き込みの前のバイト列を記録する
      - name: 引数
        description: '`position: 0`、`list_rules` で得た `rules[0]` の `rev` を `expected_rev`、`entry: {on: [write]}`'
    flow: |-
      sequenceDiagram
        participant C as クライアント
        participant IF as write_index_entry
        participant IDX as 索引

        C->>IF: index・position 0・expected_rev・entry
        IF->>IDX: 読む
        IDX-->>IF: 書式つきの内容
        IF->>IF: 書き出し、rules[0] の外の行を比べる
        IF-->>C: isError: true（書式を保てない旨・行の番号・手で修正する旨）
    expected:
      - '結果が `isError: true` で、索引の書式を保って書き込めない旨、`rules[1]` の `paths` の行の番号、索引を手で修正する旨が載っている'
      - 索引のファイルが書き込みの前のバイト列のまま
    test: test_error_when_layout_not_kept
  - name: 正常系（参照するツールを記載する）
    summary: 位置で指したエントリに `read_tool` を記載し、`read_by` の後ろに並べる
    setup:
      - name: Mock
        description: なし（`127.0.0.1` の空いているポートで子プロセスとして起動したサーバーへ、MCP の Python SDK の Streamable HTTP のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: エントリを新規作成するフローと同じ
      - name: 索引
        description: '`read_by` と `enabled` を持つエントリを 1 つ持つ'
        notes: 書き込みの前の内容を記録する
      - name: 引数
        description: '`position: 0`、エントリの `expected_rev`、`entry` に `read_tool`（`tool: mcp__docs__search_docs`、`args` に JSON の文字列 `{"filter": {"field": "id", "op": "eq", "values": ["python"]}, "sections": ["命名"]}`）だけ'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as write_index_entry
        participant IDX as 索引

        C->>IF: index・position 0・expected_rev・entry（read_tool）
        IF->>IDX: round-trip で読む
        IDX-->>IF: 書式つきの内容
        IF->>IF: バージョンを比べ、read_tool を加えてチェックする
        IF->>IDX: 一時ファイルに書き込み、置き換える
        IF-->>C: position・rev・diff
      ```

      <!-- /map -->
    expected:
      - 書き込みの前との差分が `read_tool` の行だけで、`read_by` の後ろ・`enabled` の前に並んでいる
      - '`read_tool` がブロックのマップで、`args` が単一引用符で囲んだ 1 行の文字列'
      - インターフェース定義「ルールの一覧」で読むと、そのエントリの `read_tool` が指定した値
    test: test_normal_when_read_tool_written
lead: 設定ファイルで読み込む索引へエントリを新規作成・書き換えするツールの入出力を定め、エントリの書き込みを修正するときに参照する。
identifier: write_index_entry
idempotent: false
side_effects: 索引のファイルを書き換える（`dry_run` のときとエラーのときは書き換えない）
exclusivity: 同じ索引への書き込み・削除は、サーバーのプロセスの中の索引ごとのロックで 1 つずつ行う
request:
  - name: project_dir
    type: str
    required: true
    location: argument
    description: プロジェクトの直下
    constraints: 絶対パス
    notes: 設定ファイルで読む索引を決めるのに使用する。インターフェース定義「ルールの一覧」の `project_dir` と同じ
  - name: index
    type: str
    required: true
    location: argument
    description: 書き込む索引の場所
    constraints: 絶対パスか `~` で始まるパス。設定ファイルで読む索引に限る
  - name: entry
    type: dict[str, Any]
    required: true
    location: argument
    description: 書き込むキーと値
    constraints: キーは `rule`・`paths`・`exclude`・`tools`・`args`・`on`・`read_by`・`read_tool`・`enabled`
    notes: '`position` が無いときは新しいエントリの全てのキー、あるときは書き換えるキーだけを指定する（指定しないキーはそのまま残る）'
  - name: position
    type: int
    required: false
    default: なし（`rules` の末尾に新規作成する）
    location: argument
    description: 書き換えるエントリの位置
    constraints: 0 以上
    notes: インターフェース定義「ルールの一覧」の `position`
  - name: expected_rev
    type: str
    required: false
    default: なし（`position` を指定するときは必須）
    location: argument
    description: 書き換える前のエントリのバージョン
    notes: インターフェース定義「ルールの一覧」の `rev`
  - name: remove_keys
    type: list[str]
    required: false
    default: なし（キーを削除しない）
    location: argument
    description: エントリから削除するキー
    notes: '`position` を指定するときだけ使用する。`entry` と同じキーは指定できない'
  - name: dry_run
    type: bool
    required: false
    default: 'false'
    location: argument
    description: 書き込まずにチェックと差分だけを返却するか
request_example: |-
  ```json
  {
    "project_dir": "/home/user/project",
    "index": "/home/user/project/rules.yaml",
    "entry": {"rule": "docs/python.md", "paths": ["**/*.py"], "on": ["write"]}
  }
  ```
response:
  - name: success
    type: bool
    description: 常に `true`（書き込めない・チェックに通らないときは ToolError。`dry_run` のときも同じ）
  - name: output
    type: str
    description: 書き込んだ索引と位置の 1 行
  - name: index
    type: str
    description: 書き込んだ索引の場所（`~` を展開した後）
  - name: position
    type: int
    description: 書き込んだエントリの位置
  - name: rev
    type: str
    description: 書き込んだ後のエントリのバージョン
  - name: written
    type: bool
    description: 索引のファイルを書き換えたか
    notes: '`dry_run` のときは `false`'
  - name: diff
    type: str
    description: 索引のファイルの書き換えの前後の unified diff
    notes: 前後 3 行を添える
response_example: |-
  ```json
  {
    "success": true,
    "output": "/home/user/project/rules.yaml の rules[2] を書き込みました",
    "index": "/home/user/project/rules.yaml",
    "position": 2,
    "rev": "8b1d0e7a4c2f",
    "written": true,
    "diff": "--- rules.yaml\n+++ rules.yaml\n@@ -8,3 +8,6 @@\n..."
  }
  ```
exceptions:
  - name: なし（正常終了）
    condition: 書き込んだ後の索引に新しい問題が無く、書き込んだ（`dry_run` のときは書き込まずに返却した）
  - name: ToolError（引数の組み合わせが誤り）
    condition: '`project_dir` が絶対パスでない、`position` を指定して `expected_rev` を指定しない、`position` が無いのに `remove_keys` を指定する、`entry` と `remove_keys` に同じキーがある'
    notes: 'ツールの結果を `isError: true` にし、指定方法を返却する'
  - name: ToolError（設定ファイルが読めない）
    condition: インターフェース定義「ルールの一覧」と同じ
    notes: 設定ファイルの場所と理由を返却する
  - name: ToolError（設定ファイルで読む索引でない）
    condition: '`index` が、`project_dir` で設定ファイルから決まる読む索引のどれでもない'
    notes: 設定ファイルで読む索引でない旨と、読む索引の場所を返却する
  - name: ToolError（索引が YAML として読めない）
    condition: 索引のファイルが無い・読めない・YAML として読めない、または最上位がマップでない
    notes: 索引の場所と理由を返却する
  - name: ToolError（エントリの位置が無い）
    condition: '`position` が索引のエントリの数以上'
    notes: 位置が無い旨と索引のエントリの数を返却する
  - name: ToolError（バージョンが合わない）
    condition: '`expected_rev` が今のエントリのバージョンと違う'
    notes: 今のバージョンと、一覧を再取得してから再度呼び出す旨を返却する
  - name: ToolError（書き込んだ後の索引がチェックに通らない）
    condition: 書き込んだ後の索引をフックが読めない、または書き込む前の索引に無かった問題（JSON Schema の違反・ルールの場所にファイルが無いエントリ）が出る
    notes: 書き込まずに、新しく出た問題ごとの索引の中の場所と理由を返却する
  - name: ToolError（フックが読めない索引）
    condition: '`position` を指定し、索引が YAML としては読めるがフックの読み取りが読めない（エントリのバージョンを求められない）'
    notes: 書き込まずに、フックが読めない理由（行の番号を含む）と、索引を手で修正する旨を返却する。`position` を指定しない新規作成も、書き込んだ後の索引をフックが読めないため「書き込んだ後の索引がチェックに通らない」で断る
  - name: ToolError（索引の書式を保てない）
    condition: 書き出した内容で、対象のエントリの外の行が変わる（他のエントリが `~`・アンカーなど round-trip が書き換える表記を持つ）
    notes: 書き込まずに、索引の書式を保って書き込めない旨、最初に変わる行の番号、索引を手で修正する旨を返却する
error_format: 'インターフェース定義「ルールの一覧」と同じ。チェックに通らないときは、問題を `{索引の中の場所}: {理由}` の行で全て並べる'
constraints:
  - item: 書き込める索引
    constraint: '`project_dir` を `CLAUDE_PROJECT_DIR` として設定ファイルから決めた読む索引だけ。`~` を展開し、シンボリックリンクを解いた場所で比べる'
    notes: 任意のファイルへの書き込みを防ぐ
  - item: 書き込みの手順
    constraint: ロックの中で、索引を読む → バージョンを比べる → 変更を適用する前と後の内容をチェックする → 同じフォルダの一時ファイルに書き込み、索引と置き換える
    notes: フックは置き換えの前か後のどちらかの内容だけを読む。書き込まなかったときは索引のファイルを 1 バイトも変えない
  - item: チェック
    constraint: インターフェース定義「索引のチェック」と同じ順と内容（フックと同じ読み取り → JSON Schema → ルールの場所の実在）で、書き込む前と書き込んだ後の索引を確認する。書き込んだ後にフックが読めないか、書き込む前に無かった問題が出るときだけ断る
    notes: 問題はエントリのバージョンと理由で照らし合わせる（位置は新規作成・削除でずれるため）。書き換えたエントリの問題は、書き込む前に同じ理由があっても新しい問題として扱う。もとからある問題は、この書き込みで生じたものではないため書き込みを止めない
  - item: 書式の維持
    constraint: '`ruamel.yaml` の round-trip で読み込みと書き込みをし、対象のエントリ以外の行（コメント・引用符・字下げ・キーの並び・改行）を変えない。書き出した内容で対象のエントリの外の行が変わるときは書き込まない。新しく書き込む文字列のリストは 1 行のフロー形式、`args` はブロックのマップ、`read_by` はブロックのリスト、`read_tool` はブロックのマップ（`tool`・`args`・`optional_args` の順。`args`・`optional_args` は単一引用符で囲んだ 1 行の文字列）で記載する'
    notes: 設定は PoC の結果（`width` 4096・`preserve_quotes`）。字下げは索引から推定し（推定できないときは mapping 2 / sequence 4 / offset 2）、改行は索引の改行に合わせる。`~`・アンカーなど round-trip が書き換える表記を他のエントリに持つ索引は、手で修正してもらう。フックの読み取りが受け付ける形式だけで書き込む。既にあるエントリへ無いキーを途中に書き込むと、挿入位置の直前のキーの後ろにあるコメント行は新しいキーの上に残る（コメントは対象のエントリの中のため、外の行を変えない確認には掛からない）
  - item: 新規作成の位置
    constraint: '`rules` の末尾。`rules` が無い索引では `rules` を追加する'
  - item: エントリのバージョン
    constraint: インターフェース定義「ルールの一覧」の制約「エントリのバージョン」と同じ求め方
    notes: 一覧を取った後に手で修正されたエントリを上書きしない
  - item: 反映
    constraint: 書き込んだ内容は、サーバーを再起動せずに次のツールの呼び出しと次のフックの呼び出しで有効になる
    notes: 索引をキャッシュしない
  - item: 認可
    constraint: 制限なし
    notes: 書き込める範囲は制約「書き込める索引」で絞る
