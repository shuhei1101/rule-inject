        CC->>H: 標準入力（MCP のツール名・引数）
        H->>IDX: 読む
        H->>H: 条件の木の field ごとの values に該当するエントリを選ぶ
        H->>ST: 既読を読む（未読）
        H-->>CC: permissionDecision: deny + 案内<br>終了コード 0
    expected:
      - '`permissionDecision` が `deny`'
      - '`permissionDecisionReason` にルールの場所が載っている'
    test: test_normal_when_mcp_filter_tree_match
  - name: 正常系（条件の木の否定の中だけに該当する）
    summary: パターンに該当する値が `not` の中か否定の `op` の条件にしか無い呼び出しは案内しない
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: 条件の木に該当するフローと同じ
      - name: 既読の記録
        description: 空
      - name: 入力
        description: '`tool_name: mcp__dev-docs__search_docs`、`tool_input` は `{filter: {and: [{field: "kind", op: "eq", values: ["rule"]}, {not: {field: "tags", op: "eq", values: ["python"]}}, {field: "tags", op: "ne", values: ["python"]}]}}`'
        notes: '`filter[kind]` は該当するが、`filter[tags]` の照合する値が無い'
    flow: |-
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant IDX as 索引

        CC->>H: 標準入力（MCP のツール名・引数）
        H->>IDX: 読む
        H->>H: not の中と否定の op を除くと tags の値が無いためエントリを除外する
        H-->>CC: 標準出力なし<br>終了コード 0
    expected:
      - 標準出力が空
      - 終了コードが `0`
    test: test_normal_when_mcp_filter_tree_negated
  - name: 正常系（参照するツールを添えて止めて案内する）
    summary: '`read_tool` を持つエントリの未読のルールで Write を止め、場所の下にツールの名前と引数を記載する'
    setup:
      - name: Mock
        description: なし（フックを子プロセスとして起動し、標準入力へ JSON を指定する）
      - name: 索引
        description: '`paths: ["**/*.py"]`・`on: [write]`・`read_tool` に `tool: mcp__docs__search_docs` と、`args` に JSON の文字列 `{"filter": {"field": "id", "op": "eq", "values": ["python"]}}`、`optional_args` に `{"sections": ["命名"]}` を持つエントリを 1 つ持つ'
      - name: 既読の記録
        description: 空
      - name: 入力
        description: '`tool_name: Write`、`tool_input.file_path` は `.py` のパス'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant IDX as 索引
        participant ST as 既読の記録

        CC->>H: 標準入力（Write・対象のパス）
        H->>IDX: 読む
        H->>H: 対象のパスに該当するエントリを選ぶ（read_tool あり）
        H->>ST: そのセッションの既読を読む（未読）
        H-->>CC: permissionDecision: deny + 場所とツールの行を並べた案内<br>終了コード 0
      ```

      <!-- /map -->
    expected:
      - '`permissionDecision` が `deny`'
      - '`permissionDecisionReason` のパスの行の次の行が `  ツール: mcp__docs__search_docs {"filter": {"field": "id", "op": "eq", "values": ["python"]}}（省略可: {"sections": ["命名"]}）`'
      - '`permissionDecisionReason` の 2 行目に、`ツール:` の行のツールで参照し、記載の引数は全て指定し、使用できないときはパスを Read で参照する旨が載っている'
      - 終了コードが `0`
    test: test_normal_when_blocked_with_read_tool
  - name: 正常系（参照するツールを添えて止めずに案内する）
    summary: '`read_tool` を持つエントリの未読のルールを、止めずにツールの名前と引数を添えて案内する'
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: '`paths: ["**/*.py"]`・`on: [write]`・`read_tool: {tool: mcp__docs__search_docs}` のエントリを 1 つ持つ'
        notes: '`args` を持たない'
      - name: 既読の記録
        description: 空
      - name: 入力
        description: '`tool_name: Read`、`tool_input.file_path` は `.py` のパス'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant IDX as 索引
        participant ST as 既読の記録
        participant GD as 案内済みの記録

        CC->>H: 標準入力（Read・対象のパス）
        H->>IDX: 読む
        H->>ST: 既読を読む（未読）
        H->>GD: 案内済みを読む（未案内）
        H->>GD: ルールの場所を追記する
        H-->>CC: additionalContext（場所とツールの行を並べた案内）<br>終了コード 0
      ```

      <!-- /map -->
    expected:
      - '`permissionDecision` が無い'
      - '`additionalContext` の場所の行の次の行が `  ツール: mcp__docs__search_docs {}`'
      - 案内済みの記録にルールの場所が 1 行ある
      - 終了コードが `0`
    test: test_normal_when_not_blocked_with_read_tool
  - name: 正常系（参照するツールを持つルールと持たないルールを並べる）
    summary: '`read_tool` を持つルールにだけツールの行を配置し、持たないルールは場所の行だけにする'
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: '`paths: ["**/*.py"]`・`on: [write]` のエントリを 2 つ持ち、1 つ目だけが `read_tool` を持つ（ルールの場所は別）'
      - name: 既読の記録
        description: 空
      - name: 入力
        description: '`tool_name: Write`、`tool_input.file_path` は `.py` のパス'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant IDX as 索引

        CC->>H: 標準入力（Write・対象のパス）
        H->>IDX: 読む
        H-->>CC: permissionDecision: deny + 2 件の案内<br>終了コード 0
      ```

      <!-- /map -->
    expected:
      - '`permissionDecisionReason` の 1 つ目のルールの場所の次の行が `ツール:` の行'
      - '`permissionDecisionReason` の 2 つ目のルールの場所の次に `ツール:` の行が無い'
    test: test_normal_when_read_tool_mixed
  - name: 正常系（同じルールの参照するツールをまとめる）
    summary: 同じルールを指すエントリ 2 つの `read_tool` を、同じ組は 1 つにして該当した順に並べる
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: '同じルールの場所を指し `on: [write]` のエントリを 3 つ持つ。1 つ目と 2 つ目は同じ `read_tool`（`tool` と `args` の組）、3 つ目は `args` の違う `read_tool`'
      - name: 既読の記録
        description: 空
      - name: 入力
        description: '`tool_name: Write`、3 つのエントリに該当するパス'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant IDX as 索引

        CC->>H: 標準入力（Write・対象のパス）
        H->>IDX: 読む
        H->>H: 同じルールの場所のエントリを 1 件にまとめ、read_tool の重なりを除く
        H-->>CC: permissionDecision: deny + 1 件の案内<br>終了コード 0
      ```

      <!-- /map -->
    expected:
      - '`permissionDecisionReason` にルールの場所の行が 1 行だけある'
      - その下に `ツール:` の行が 2 行あり、1 つ目のエントリの `read_tool`、3 つ目のエントリの `read_tool` の順
    test: test_normal_when_read_tools_merged
  - name: 異常系（参照するツールの書式が誤り・止めずに理由を記載する）
    summary: '`read_tool` が `tool` を持たない索引は読めない索引として扱い、操作を止めずに場所と理由を記載する'
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: '`paths: ["**/*.py"]`・`on: [write]`・`read_tool` に `args` だけ（`tool` が無い）のエントリを 1 つ持つ'
      - name: 入力
        description: '`tool_name: Write`、`tool_input.file_path` は `.py` のパス'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant IDX as 索引

        CC->>H: 標準入力（Write・対象のパス）
        H->>IDX: 読む（read_tool の書式の誤り）
        H-->>CC: additionalContext（索引の場所と理由）<br>終了コード 0
      ```

      <!-- /map -->
    expected:
      - '`permissionDecision` が無い'
      - '`additionalContext` に索引の場所と、`read_tool` の `tool` が無い旨が載っている'
      - ログに `read_index` の行がある
    test: test_error_when_read_tool_invalid
lead: 操作の対象にヒットする未読のルールを、操作を止めるか止めずに案内するフックの入出力を定め、ルール案内の判定や文面を修正するときに参照する。
idempotent: false
side_effects: 止めない案内に記載したルールの場所を、そのセッションの案内済みの記録へ 1 行ずつ追記する（既読の記録は読むだけ）
request:
  - name: '`session_id`'
    type: str
    required: true
    description: 呼び出し元のセッションの識別子
    constraints: 1〜128 文字の英数字 / `_` / `-`
    notes: 既読の記録のファイル名に使用する。形式に合わない値は既読なしとして扱う
  - name: '`cwd`'
    type: str
    required: true
    description: セッションの作業フォルダ
    notes: Bash のコマンドの相対パスを解く基準。設定ファイルの `projects` の索引の相対パスは `cwd` ではなく環境変数 `CLAUDE_PROJECT_DIR` から解く
  - name: '`tool_name`'
    type: str
    required: true
    description: 呼ばれるツールの名前
    constraints: '`Read` / `Grep` / `Edit` / `Write` / `NotebookEdit` / `Bash` / `mcp__` で始まる完全名'
    notes: 操作の種別へ読み替える（`Read`・`Grep`・`Bash` の読み取り → `read`、`Edit`・`Write`・`NotebookEdit` → `write`、`mcp__*` → `mcp`）
  - name: '`tool_input.file_path`'
    type: str
    required: false
    default: なし（パスでは照合しない）
    description: 操作の対象のファイルのパス
    notes: Read / Edit / Write のとき届く。まだ無いパスも受ける
  - name: '`tool_input.notebook_path`'
    type: str
    required: false
    default: なし（パスでは照合しない）
    description: 操作の対象のノートブックのパス
    notes: NotebookEdit のとき届く
  - name: '`tool_input.command`'
    type: str
    required: false
    default: なし（パスでは照合しない）
    description: Bash で実行しようとしているコマンド
    notes: 読むコマンド（制約の「読むコマンド」）の引数から、読む対象のパスを取り出す
  - name: '`tool_input.path`'
    type: str
    required: false
    default: なし（パスでは照合しない）
    description: Grep で検索するファイルかフォルダのパス
    notes: Grep のとき届く。ファイルを指すときだけ照合する（フォルダは中のどのファイルを読むかが実行前に決まらないため照合しない）
  - name: tool_input.*
    type: Any
    required: false
    default: なし（引数では照合しない）
    description: MCP のツールの引数
    notes: '`mcp__*` のとき、エントリの `args` と照合する。オブジェクトの子はドットで結んだキーで指す。`{道筋}[{field}]` のキーは、道筋の値を条件の木として、その中の条件を指す'
request_example: |-
  ```json
  {
    "session_id": "2f9c1b7e-0d54-4b7a-9d4f-5c3a1e2b7f10",
    "cwd": "/home/user/project",
    "hook_event_name": "PreToolUse",
    "tool_name": "Write",
    "tool_input": {"file_path": "/home/user/project/src/app.py", "content": ""}
  }
  ```
response:
  - name: '`hookSpecificOutput.hookEventName`'
    type: Literal['PreToolUse']
    description: フックの種類
    notes: 案内があるときだけ出力する。案内が無いときは標準出力に何も出さない
  - name: '`hookSpecificOutput.permissionDecision`'
    type: Literal['deny']
    description: 操作を止める
    notes: 操作の種別が `on` に該当する未読のルールが 1 件でもあるときだけ記載する
  - name: '`hookSpecificOutput.permissionDecisionReason`'
    type: str
    description: 止める案内。参照してから同じ操作を再試行することと、参照の方法（制約「案内文の構成」）と、未読のルールのパス。`read_tool` を持つエントリのルールは、パスの行の下にツールの名前と引数の行
    constraints: 10,000 字以内
    notes: '`permissionDecision` を記載したときだけ記載する。止めないルールも同じ案内に並べる'
  - name: '`hookSpecificOutput.additionalContext`'
    type: str
    description: 止めない案内。参照の方法（制約「案内文の構成」）と、未読で未案内のルールのパス（`read_tool` を持つエントリのルールは、ツールの名前と引数の行も）。設定ファイルか索引が読めないとき・索引のエントリを読み飛ばしたとき・記録が読めないか書き込めないときはその場所と理由
    constraints: 10,000 字以内
    notes: 操作を止めないときだけ記載する。「再試行してください」は含めない
response_example: |-
  ```json
  {
    "hookSpecificOutput": {
      "hookEventName": "PreToolUse",
      "permissionDecision": "deny",
      "permissionDecisionReason": "この操作に関連する未読のルールがあります。下のルールを参照してから、同じ操作を再試行してください。\nパスを Read で参照してください。\n- /home/user/rules/python.md"
    }
  }
  ```
exceptions:
  - name: なし（正常終了）
    condition: 案内の有無に関わらず終了コード 0 で終える
    notes: 終了コード 2 は Claude Code が操作を止める合図になるため使用しない
  - name: OSError / 書式の誤り（索引が読めない）
    condition: 索引が無い・読めない・書式に合わない
    notes: フックの中で捕まえ、操作を止めずに `additionalContext` へ索引の場所と理由を記載し、ログへ `read_index` を書き込んで終了コード 0 で終える。読めた索引のエントリでの案内は続ける
  - name: OSError（既読の記録が読めない）
    condition: 記録ファイルはあるが読めない（権限など）
    notes: 索引が読めないときと同じく、操作を止めずに `additionalContext` へ記録ファイルの場所と理由を記載し、ログへ `read_record` を書き込む。ファイルが無いときは失敗ではなく既読なしとして扱う
  - name: Exception（想定外の例外）
    condition: 上のどれにも該当しない例外
    notes: 最上位で捕まえ、操作を止めずに `additionalContext` へ「ルールの案内が動かなかったこと」とログの場所を記載し、ログへ `unexpected` を書き込んで終了コード 0 で終える
  - name: OSError（案内済みの記録が読めない・書き込めない）
    condition: 案内済みの記録ファイルはあるが読めない、または記録フォルダか記録ファイルに書き込めない（権限・容量）
    notes: 既読の記録が読めないときと同じく、操作を止めずに案内を出し、`additionalContext` へ記録ファイルの場所と理由を記載し、ログへ `read_record` か `write_record` を書き込む。読めないときは未案内として扱う。ファイルが無いときは失敗ではなく未案内として扱う
  - name: OSError / 書式の誤り（設定ファイルが読めない）
    condition: '`RULE_INJECT_CONFIG` が指すファイルが無い、または設定ファイル（指していなければ既定のパス）が読めない・書式に合わない・知らないキーか許す値の外の値を持つ'
    notes: フックの中で捕まえ、設定ファイルを使用せず（既定値でも動かさず）索引を読まない。操作を止めずに `additionalContext` へ設定ファイルの場所と理由を記載し、既定のログのフォルダへ `read_settings` を書き込んで終了コード 0 で終える。廃止したキー（`global.server_port`）のときは、理由に `global-setup` での移し替えを含める
constraints:
  - item: タイムアウト
    constraint: 1 秒（`hooks.json` の `timeout`）
    decided_by: NFR-122-1#requirements[フックの実行時間]
  - item: 案内文の長さ
    constraint: 10,000 字。超えるときは止めるルールを先に並べ、収まるところまで場所を記載して残りの件数を添える
    decided_by: NFR-122-1#requirements[フックの案内文の長さ]
  - item: 索引
    constraint: '読む索引は、設定ファイルの `global.indexes`（キーが無いときはユーザーの既定の配置場所 `${XDG_CONFIG_HOME:-~/.config}/rule-inject/rules.yaml`）の後ろに、該当した `projects` の要素の `indexes` を並びの順に追加したもの（該当した要素のどれも `indexes` を持たないときはプロジェクトの既定の配置場所 `${CLAUDE_PROJECT_DIR}/rules.yaml`）。全てのエントリを合わせて照合する。`enabled: false` のエントリは照合に使用しない。既定の配置場所のファイルが無いとき・`CLAUDE_PROJECT_DIR` が無いときは理由を記載せずに読まない。`indexes` が空の並び `[]` のときは、その既定の配置場所も読まない'
    notes: 書式は設定の設計書。標準ライブラリだけで読む。`projects` の中の索引の相対パスは環境変数 `CLAUDE_PROJECT_DIR` から解く。空の並びを既定の配置場所と別に扱うのは、既定の配置場所に別の用途の `rules.yaml` があるときに読ませない手段を残すため
  - item: ルールのまとめ方
    constraint: 同じルールの場所（解決後の絶対パス）に該当したエントリは 1 件にまとめ、どれか 1 つでも止めるなら止める
  - item: 読むコマンド
    constraint: '`cat` / `head` / `tail` / `less` / `more` / `grep` / `rg` / `sed` / `awk` / `wc` / `bat`。`&&` / `||` / `;` / `|` と引用符の外の改行（直前に `\` がある行継続は除く）で区切った各コマンドの、`-` で始まらない引数をパスとして扱う。引用符の外に `*` / `?` / `[` を含む引数は、その時点の基準のフォルダから glob として展開し、該当したファイルを名前の順に扱う。`for {変数} in {単語の並び}; do … done` の `do` から `done` までの読むコマンドが `$変数` / `${変数}` を引数に取るときは、単語の並び（glob は同じく展開する）をパスとして扱う'
    notes: 引数がパターンのコマンド（`grep` の最初の引数など）もパスとして照合する。実在しないパスは捨てる。引用符の中の glob は展開しない
  - item: 認可
    constraint: 制限なし
  - item: ログ
    constraint: 失敗したときだけ ER 図「ログ」の形式で 1 行書き込む。標準出力には JSON 以外を出さない
    notes: ログに書き込めないときは同じ 1 行を標準エラー出力へ出す
  - item: ルールの場所の変数参照
    constraint: エントリの `rule` の `!{名前}`（名前は `[A-Za-z_][A-Za-z0-9_]*`）をフックが受け取った環境変数の値に置き換えてから場所を解く。空の値は空文字に置き換える。未設定の名前が残ったエントリは読み飛ばし、索引が読めないときと同じく `additionalContext` へ索引の場所・エントリの `rule`・展開できない名前を記載し、ログへ `read_index` を書き込む
  - item: 案内済みの記録
    constraint: 止めない案内（`additionalContext`）に記載したルールの場所を `{state_dir}/{session_id}.guided.txt` に 1 行ずつ追記し、次からはその場所を止めない案内に記載しない。止める案内（`permissionDecisionReason`）に並べた場所は記録しない
    notes: 書式は ER 図「既読の記録」の案内済みの記録。止める案内は読むまで毎回出す。案内文の長さに収まらず記載しなかった場所は記録しない
  - item: 引数の照合
    constraint: '`tools` に該当したエントリのうち `args` を持つものは、記載した全てのキーの値がどれかのパターンに該当するときだけ該当とする。キーが引数に無いとき・値がオブジェクトのときは該当としない。値が配列のとき、およびドット区切りのキーの途中が配列のときは要素ごとにたどり、どれか 1 つが該当すれば該当とする。文字列以外のスカラーは JSON の表記（`true`・`null`・`1.5`）で文字列にして照合する'
    notes: '`args` は MCP のツールの呼び出しにだけ照合する'
  - item: パターンの正規表現
    constraint: '`paths`・`exclude`・`tools`・`args` のパターンのうち `re:` で始まるものは、残りを正規表現として部分一致（`re.search`）で照合する。それ以外は glob のまま照合する。正規表現は索引を読むときにコンパイルし、コンパイルできないパターンを持つエントリは読み飛ばし、索引が読めないときと同じく `additionalContext` へ索引の場所・パターン・理由を記載し、ログへ `read_index` を書き込む'
    decided_by: NFR-122-1#requirements[フックの実行時間]
    notes: 読み飛ばしは、そのエントリだけに及ぶ
  - item: URL のルール
    constraint: 変数参照を置き換えた後の `rule` が `http://` か `https://` で始まるエントリは読み飛ばし、索引が読めないときと同じく `additionalContext` へ索引の場所・エントリの `rule`・Read で読めない旨を記載し、ログへ `read_index` を書き込む
    notes: 読み飛ばしは、そのエントリだけに及ぶ
  - item: 既読の判定
    constraint: そのセッションの既読の記録に、ルールの場所と今のルールのファイルの中身の SHA-256 の組み合わせがあるときだけ既読として扱う。ハッシュが違う行・ハッシュを持たない行だけの場所と、ファイルを読めず今のハッシュを取れないルールは未読として扱う
    notes: ハッシュの取り方は既読の記録の制約「本文のハッシュ」と同じ。今のハッシュは該当したルールの分だけ取る。記録ファイルは書き換えず、再度読んだときに既読の記録が新しいハッシュの行を追記する
  - item: 設定ファイル
    constraint: 環境変数 `RULE_INJECT_CONFIG` の値（先頭の `~` はホームに展開）の YAML を読む。`RULE_INJECT_CONFIG` が無いときは `${XDG_CONFIG_HOME:-~/.config}/rule-inject/settings.yaml` を読み、そのファイルも無いときは設定ファイルのキーを全て既定値で扱う。`projects` の要素は `match` で照合し、該当した要素を並びの順に `global` へ重ねる。`CLAUDE_PROJECT_DIR` が無いときはどの要素も適用しない
    notes: キー・既定値・許す値・`match` の当て方は設定の設計書。標準ライブラリだけで読む
  - item: 条件の木の照合
    constraint: '`args` のキーが `{道筋}[{field}]`（例 `filter[tags]`）のときは、ドットの道筋が指す値を条件の木（`field`・`op`・`values` の条件と、`and`・`or`・`not` の束の入れ子）として読み、`and`・`or` の中を深さを問わずたどって、`field` が `{field}` と一致する条件の `values` の要素を照合する値にする。`not` の中と、`op` が `ne`・`not_contains`・`not_exists` の条件は値にしない。道筋の途中や値が配列のときは、ドットの道筋と同じく要素ごとにたどる。条件の木として読めない値（オブジェクトでない・`field` も束のキーも持たない）からは値を取らない。照合する値が 1 つも無いキーは該当しない'
    notes: '`not` と否定の `op` の条件は、その値の文書を読まない検索のため照合しない（[条件の木のタグの照合の要件](https://github.com/shuhei1101/rule-inject/blob/0029e8f3d759afb62c8660609754a615c05fc74f/dev/pr/77/%E8%A6%81%E4%BB%B6.md) の推奨案 A）。`[` と `]` を含まないキーは、今どおりドットの道筋として読む'
  - item: 参照するツールの案内
    constraint: '該当したエントリが `read_tool` を持つルールは、パスの行（`- {パス}`）の下に `  ツール: {tool} {args}` の行を配置する。`args` は記載の JSON を読み、キーの順を保って 1 行に変換した JSON（`ensure_ascii` なし・区切りは `, `・`: `）で、`args` を持たないときは `{}` を配置する。`optional_args` を持つときは、行の末尾に `（省略可: {optional_args}）`（同じ変換の JSON）を続ける。同じルールのパスにまとめたエントリの `read_tool` は、`tool`・`args`・`optional_args` が同じものを 1 つにし、該当した順に並べる'
    notes: パスの行と `ツール:` の行は 1 件として案内文の長さに数え、収まらないときは両方とも記載しない
  - item: 案内文の構成
    constraint: 補足「案内文の構成」の表の行を上から順に並べる
    notes: 文面はユーザーの確認で決めた（[参照するツールの案内の確認ログ](https://github.com/shuhei1101/rule-inject/blob/5d7df8abcf051d8a0367ab1b9dc34b7cf33730a0/dev/pr/102/%E7%A2%BA%E8%AA%8D%E3%83%AD%E3%82%B0.md)）
  - item: 参照するツールの書式
    constraint: '`read_tool` はオブジェクトで、`tool` に `mcp__` で始まる文字列を持ち、`args`・`optional_args` を持つときは JSON のオブジェクトを表す文字列にする（標準ライブラリの `json` で読む）。許す値の外の値のエントリを持つ索引は、`enabled` が真偽値でないときと同じく読めない索引として扱う'
    notes: '`read_tool` は案内と既読にだけ使用し、操作を止めるかの照合（`paths`・`tools`・`args`）には使用しない'
