id: IF-122-22
visibility: internal
title: "設定の移し替え"
entry:
  kind: operation
  value: '`python -m rule_inject.migrate`（`global-setup` が呼ぶコマンド。ローカルのクローンでサーバーの依存を指定して実行する）'
flows:
  - name: 正常系
    summary: 古い設定ファイルの手順を示す
    setup:
      - name: Mock
        description: なし（コマンドを子プロセスで実行する）
      - name: 設定ファイル
        description: '`version` が無く、`global.server_port: 9000` を持つ設定ファイル'
      - name: 引数
        description: '`--plan`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as global-setup
        participant IF as 設定の移し替え
        participant CF as 設定ファイル

        C->>IF: --plan
        IF-->>CF: 参照する
        IF-->>C: 手順
      ```
    expected:
      - 終了コードが 0
      - 標準出力の JSON の `steps` に手順が 1 件以上ある
      - 設定ファイルが変わっていない
    test: test_normal
  - name: 正常系（手順を適用する）
    summary: バックアップを作成して設定ファイルを書き換え、`env` へ移す値を返却する
    setup:
      - name: Mock
        description: なし（コマンドを子プロセスで実行する）
      - name: 設定ファイル
        description: '`version` が無く、`global.server_port: 9000` とコメントを持つ設定ファイル'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as global-setup
        participant IF as 設定の移し替え
        participant CF as 設定ファイル

        C->>IF: 実行する
        IF-->>CF: 参照する
        IF->>CF: バックアップを作成する
        IF->>CF: 書き換える
        IF-->>C: 適用した手順・バックアップのパス・env の値
      ```
    expected:
      - 終了コードが 0
      - 設定ファイルに `global.server_port` が無く、`version` があり、コメントが残っている
      - 標準出力の JSON の `env` に `RULE_INJECT_PORT` の `9000` がある
      - 標準出力の JSON の `backup` のパスに、元の内容のファイルがある
    test: test_normal_when_applied
  - name: 正常系（設定が今のバージョン）
    summary: 手順が無ければ空の手順を返却する
    setup:
      - name: Mock
        description: なし（コマンドを子プロセスで実行する）
      - name: 設定ファイル
        description: '`version` が今のバージョンの設定ファイル'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as global-setup
        participant IF as 設定の移し替え
        participant CF as 設定ファイル

        C->>IF: 実行する
        IF-->>CF: 参照する
        IF-->>C: 空の手順
      ```
    expected:
      - 終了コードが 0
      - 標準出力の JSON の `steps` が空
      - 設定ファイルが変わっていない
    test: test_normal_when_current
  - name: 正常系（設定ファイルが無い）
    summary: 空の手順を返却する
    setup:
      - name: Mock
        description: なし（コマンドを子プロセスで実行する）
      - name: 環境変数
        description: '`XDG_CONFIG_HOME` をファイルの無い一時フォルダへ向ける'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as global-setup
        participant IF as 設定の移し替え

        C->>IF: 実行する
        IF-->>C: 空の手順
      ```
    expected:
      - 終了コードが 0
      - 標準出力の JSON の `steps` が空
    test: test_normal_when_missing
  - name: 異常系（設定がツールより新しい・終了コード 6）
    summary: 書き換えずに両方のバージョンを出力して終わる
    setup:
      - name: Mock
        description: なし（コマンドを子プロセスで実行する）
      - name: 設定ファイル
        description: '`version` がツールのバージョンより新しい設定ファイル'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as global-setup
        participant IF as 設定の移し替え
        participant CF as 設定ファイル

        C->>IF: 実行する
        IF-->>CF: 参照する
        IF-->>C: 標準エラーに両方のバージョン<br>終了コード 6
      ```
    expected:
      - 終了コードが 6
      - 標準エラーに設定のバージョンとツールのバージョンが記載されている
      - 設定ファイルが変わっていない
    test: test_error_when_settings_newer
  - name: 異常系（YAML として読み取れない・SettingsReadError）
    summary: 書き換えずに場所と理由を出力して終わる
    setup:
      - name: Mock
        description: なし（コマンドを子プロセスで実行する）
      - name: 設定ファイル
        description: YAML として読み取れない設定ファイル
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as global-setup
        participant IF as 設定の移し替え
        participant CF as 設定ファイル

        C->>IF: 実行する
        IF-->>CF: 参照する
        IF-->>C: 標準エラーに場所と理由<br>終了コード 1
      ```
    expected:
      - 終了コードが 1
      - 標準エラーに設定ファイルの場所と理由が記載されている
    test: test_error_when_unreadable
lead: 端末の設定ファイルを今のバージョンへ移し替えるコマンドの入出力を定め、設定の移し替えを修正するときに参照する。
test_file: tests/integration/plugin/test_migrate_settings.py
identifier: migrate_settings
idempotent: true
side_effects: 手順があるとき、バックアップを `${XDG_CONFIG_HOME:-~/.config}/rule-inject/bk/` に作成し、設定ファイルを書き換える。`settings.json` には記載しない
exclusivity: 排他しない（`global-setup` が 1 回だけ呼ぶ）
request:
  - name: --plan
    type: bool
    required: false
    default: 'false'
    location: argument
    description: 手順を示すだけで書き換えない
  - name: RULE_INJECT_CONFIG
    type: str
    required: false
    default: '`${XDG_CONFIG_HOME:-~/.config}/rule-inject/settings.yaml`'
    description: 設定ファイルの場所（環境変数）
    constraints: 絶対パスか `~` で始まるパス
response:
  - name: from
    type: str | None
    description: 設定ファイルの `version`。ファイルかキーが無いときは `None`
  - name: to
    type: str
    description: ツールのバージョン。移し替え後の `version`
  - name: steps
    type: list[str]
    description: 手順の説明の並び。適用するときは適用した手順
  - name: migrations
    type: list[str]
    description: '`steps` のうち、`version` の更新を除いた移し替えの手順の説明'
    notes: '`version` だけが古いときは空。インターフェース定義「サーバーの更新」が、移し替えが要るかの判定に使う'
  - name: backup
    type: str | None
    description: バックアップのパス。書き換えなかったときは `None`
  - name: env
    type: dict[str, str]
    description: '`settings.json` の `env` へ移す環境変数の名前と値。無ければ空。書き込みは呼び出し元が担う'
exceptions:
  - name: なし（正常終了）
    condition: 手順を示した、適用した、または手順が無い
  - name: 終了コード 6
    condition: 設定ファイルの `version` がツールのバージョンより新しい
  - name: SettingsReadError
    condition: 設定ファイルが読み取れない・YAML として読み取れない。標準エラーへ場所と理由を出力し、終了コード 1 で終わる
constraints:
  - item: コメントの維持
    constraint: 書き換えないキーとコメントを残す
    notes: サーバーの依存の `ruamel.yaml` を使用する
  - item: 手順の適用条件
    constraint: 手順が持つ判定で、設定の中身に必要な手順だけをバージョンの古い順に適用する。`version` がツールのバージョンと違うときは、最後に `version` を更新する
    notes: '`version` は最後に移し替えたツールのバージョンで、手順の選択には使用しない'
  - item: 最初の手順
    constraint: '`global.server_port` を削除し、値を `env` の `RULE_INJECT_PORT` として返却する。`.mcp.json` の既定と同じ `8783` のときは返却しない'
