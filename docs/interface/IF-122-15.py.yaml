id: IF-122-15
visibility: internal
title: "圧縮の後の通知"
entry:
  kind: trigger
  value: '`SessionStart` フック（timeout 1 秒）'
flows:
  - name: 正常系
    summary: 圧縮の後でなければ何も出力しない
    setup:
      - name: Mock
        description: なし（フックを子プロセスとして起動し、標準入力へ JSON を指定する）
      - name: 入力
        description: '`hook_event_name: SessionStart`、`source: startup`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant S as 圧縮の後の通知

        CC->>S: 標準入力（SessionStart）
        S-->>CC: 出力なし<br>終了コード 0
      ```
    expected:
      - 標準出力が空
      - 終了コードが `0`
    test: test_normal
  - name: 正常系（圧縮の後に記録が残っている）
    summary: 圧縮の後に記録ファイルが残っていれば、削除できなかったことを通知する
    setup:
      - name: Mock
        description: なし
      - name: 既読の記録
        description: そのセッションの記録ファイルを配置する
        notes: 圧縮の前に削除できなかった状態を作る
      - name: 入力
        description: '`source: compact`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant S as 圧縮の後の通知
        participant ST as 記録ファイル

        CC->>S: 標準入力（SessionStart・source: compact）
        S->>ST: 有無を見る（残っている）
        S-->>CC: additionalContext（削除できなかったこと）<br>終了コード 0
      ```
    expected:
      - '`additionalContext` に記録を削除できなかったことと記録ファイル・ログの場所が載っている'
      - '`additionalContext` に空で作ってから記載する決まりが載っていない'
      - 終了コードが `0`
    test: test_normal_when_record_left_after_compact
  - name: 正常系（圧縮の後に記録が残っていない）
    summary: 圧縮の後でも、記録ファイルが無ければ何も出力しない
    setup:
      - name: Mock
        description: なし
      - name: 既読の記録
        description: そのセッションの記録ファイルを配置しない
      - name: 入力
        description: '`source: compact`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant S as 圧縮の後の通知
        participant ST as 記録ファイル

        CC->>S: 標準入力（SessionStart・source: compact）
        S->>ST: 有無を見る（無い）
        S-->>CC: 出力なし<br>終了コード 0
      ```
    expected:
      - 標準出力が空
      - 終了コードが `0`
    test: test_normal_when_no_record_after_compact
  - name: 異常系（設定ファイルが読めない・理由を載せる）
    summary: 圧縮の後に設定ファイルが読めないとき、理由を通知する
    setup:
      - name: Mock
        description: なし
      - name: 設定ファイル
        description: '`RULE_INJECT_CONFIG` が実在しないパスを指す'
      - name: ログ
        description: '`XDG_STATE_HOME` は空の一時フォルダを指す'
      - name: 入力
        description: '`hook_event_name: SessionStart`、`source: compact`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant S as 圧縮の後の通知
        participant CFG as 設定ファイル
        participant LOG as ログ

        CC->>S: 標準入力（SessionStart・compact）
        S->>CFG: 読む（無い）
        S->>LOG: 既定のログのフォルダへ read_settings を追記する
        S-->>CC: additionalContext（設定ファイルの場所と理由）<br>終了コード 0
      ```
    expected:
      - '`additionalContext` に設定ファイルの場所と理由が載っている'
      - '`additionalContext` に空で作ってから記載する決まりが載っていない'
      - '既定のログのフォルダのログに `operation: read_settings` の行が 1 行ある'
      - 終了コードが `0`
    test: test_error_when_settings_unreadable
lead: 圧縮の後に始まったセッションへ、削除できずに残った既読の記録と設定ファイルが読めない理由を通知するフックの入出力を定め、圧縮の後の通知を修正するときに参照する。
idempotent: true
side_effects: なし（既読の記録ファイルの有無を確認するだけ）
response:
  - name: '`hookSpecificOutput.hookEventName`'
    type: Literal['SessionStart']
    description: フックの種類
  - name: '`hookSpecificOutput.additionalContext`'
    type: str
    description: '`source: compact` で記録ファイルが残っているときは、「圧縮の前に既読の記録を削除できず、読んだことになっているルールが案内されないこと」と記録ファイル・ログの場所。`source: compact` で設定ファイルが読めないときは、設定ファイルの場所と理由'
    constraints: 10,000 字以内
    notes: 通知が無いときは、標準出力に何も出さない。新しいファイルの作り方の決まりは MCP サーバーの instructions（[サーバーの起動](id:IF-122-6)）で届ける
exceptions:
  - name: なし（正常終了）
    condition: 終了コード 0 で終える
  - name: Exception（想定外の例外）
    condition: 記録ファイルの有無を確認するだけのため通常は起きない
    notes: 最上位で捕まえ、ログへ `unexpected` を書き込んで終了コード 0 で終える
  - name: OSError / 書式の誤り（設定ファイルが読めない）
    condition: '`source: compact` で、`RULE_INJECT_CONFIG` が指すファイルが無い、または設定ファイル（指していなければ既定のパス）が読めない・書式に合わない・知らないキーか許す値の外の値を持つ'
    notes: フックの中で捕まえ、削除できずに残った記録を確認せず、設定ファイルの場所と理由を記載し、既定のログのフォルダへ `read_settings` を書き込んで終了コード 0 で終える
constraints:
  - item: タイムアウト
    constraint: 1 秒（`hooks.json` の `timeout`）
    decided_by: NFR-122-1#requirements[フックの実行時間]
  - item: 文面
    constraint: 特定の開発基盤や作者の環境を思わせる単語を含めない
  - item: ログ
    constraint: 失敗したときだけ ER 図「ログ」の形式で 1 行書き込む。書き込めないときは標準エラー出力へ出す
  - item: 設定ファイル
    constraint: '`source: compact` のときだけ、ルール案内の制約「設定ファイル」と同じく読む。使用するキーは `global.state_dir`・`global.log_dir`'
identifier: work_rules
request:
  - name: '`session_id`'
    type: str
    required: true
    description: 始まったセッションの識別子
    constraints: 1〜128 文字の英数字 / `_` / `-`
  - name: '`source`'
    type: Literal['startup', 'resume', 'clear', 'compact']
    required: true
    description: セッションが始まったきっかけ
    notes: '`compact` のときだけ、削除できずに残った既読の記録ファイルが無いかを確認する'
test_file: tests/integration/plugin/test_work_rules.py
