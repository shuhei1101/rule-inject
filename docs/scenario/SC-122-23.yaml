      - name: ルールの本文
        description: ローカルに配置した、セクションを 2 つ以上持つルールの Markdown
      - name: 索引
        description: 正常シナリオと同じエントリに、ルールを参照する MCP のツール（`mcp__docs__search_docs`）と、`sections` を含む引数を記載した YAML（`read_by` を持たない）
        notes: 引数は、テストが受けた引数と照らして見分けられる値にする
      - name: 読み方の指示
        description: プロンプトでは読み方を指示しない
        notes: '`--allowedTools` で `mcp__docs__search_docs` と Read を許可し、案内のとおりにツールを選ぶかを確認する'
      - name: 書く操作の許可
        description: 正常シナリオと同じ（`--allowedTools` で Write と Edit を許可する）
