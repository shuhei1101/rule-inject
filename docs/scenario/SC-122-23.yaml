        click UC2 "id:SC-122-8#scenarios[正常シナリオ（Bashで読む）]"
        click UC3 "id:SC-122-16#scenarios[正常シナリオ（既読のため案内しない）]"
      ```
    expected:
      - 1 回目の書く操作は止められ、案内にルールの場所が載っている
      - 再試行した書く操作は止められず、対象のファイルに中身が書き込まれている
    test: test_normal_when_read_by_bash
    uses:
      - SC-122-16#scenarios[正常シナリオ（止めて案内する）]
      - SC-122-8#scenarios[正常シナリオ（Bashで読む）]
