lead: 未読のルールで止められ、ルールの本文を読んでから同じ操作をやり直して通る一連の流れを示し、案内と既読の記録の連携を変えるときに参照する。
issue: 2
primary_actor: Claude Code のセッション
stakeholders:
  - name: ユーザー
    interest: 索引に記載したルールが、対象のファイルに書き込む前に必ず読まれること
trigger: Claude Code が、索引のエントリにヒットするファイルを書き込もうとする
preconditions:
  - プラグインが Claude Code に読み込まれている
  - 設定ファイルで指した場所に索引が配置され、対象のファイルにヒットするエントリ（書く操作が必須）が 1 つある
success_guarantee: 索引が読め、フックが時間内に終わる限り、対象のファイルはヒットするルールの本文を読んだ後にだけ書き込まれる。
minimal_guarantee: 設定ファイルと索引が読め、フックが時間内に終わる限り、ルールを読むまで対象のファイルは書き込まれない。索引か設定ファイルが読めないときは、読めなかった場所と理由がコンテキストに載る。
test_file: tests/e2e/複合ユースケース/test_read_rule_then_touch_file.py
