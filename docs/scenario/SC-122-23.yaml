id: SC-122-23
visibility: internal
title: "ルールを読んでからファイルを触る"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし。実の Claude Code を `claude -p --setting-sources project --plugin-dir {プラグイン}` で動かし、利用者の設定（`~/.claude`）のフック・プラグイン・MCP サーバーを読み込ませない
        notes: 残るのは組み込みのプラグイン（agents-md・telemetry）だけ。起動時の init のプラグイン一覧で確認した（2026-09-29）。`--bare` は API キーの課金になるため使用しない
      - name: ルールの本文
        description: ローカルに配置したルールの Markdown
      - name: 索引
        description: ルールの場所と、適用するパスの glob（対象のファイルにヒットする）・書く操作を必須とするエントリを 1 つ持つ YAML
        notes: '`RULE_INJECT_CONFIG` で指した設定ファイルの `projects` の、起動したプロジェクトに該当する要素で指す。対象のファイルはまだ無いパスにし、書き込まれたかで結末を見分ける'
      - name: 書く操作の許可
        description: '`--allowedTools` で Write と Edit を許可する'
        notes: Claude Code は作業の決まりに従い、対象のファイルを Write で空で作ってから Edit で中身を書き込むことがある
    flow: |-
      ```mermaid
      flowchart TD
        S0([Claude Code]) -->|対象のファイルを書く操作| UC1([未読のルールの案内を受ける:正常シナリオ（止めて案内する）])
        UC1 -->|案内に載ったルールの場所| UC2([ルールを読んだことが記録される:正常シナリオ（Readで読む）])
        UC2 -->|既読の記録 + 同じ操作の再試行| UC3([未読のルールの案内を受ける:正常シナリオ（既読のため案内しない）])
        UC3 --> DONE([対象のファイルが書かれた状態])

        click UC1 "id:SC-122-16#scenarios[正常シナリオ（止めて案内する）]"
        click UC2 "id:SC-122-8#scenarios[正常シナリオ（Readで読む）]"
        click UC3 "id:SC-122-16#scenarios[正常シナリオ（既読のため案内しない）]"
      ```
    expected:
      - 1 回目の書く操作は止められ、案内にルールのパスと、Read で参照してから同じ操作を再試行する旨が載っている
      - Read の結果に、ルールの本文が載っている
      - 再試行した書く操作は止められず、対象のファイルに中身が書き込まれている
    test: test_normal
    uses:
      - SC-122-16#scenarios[正常シナリオ（止めて案内する）]
      - SC-122-8#scenarios[正常シナリオ（Readで読む）]
      - SC-122-16#scenarios[正常シナリオ（既読のため案内しない）]
  - name: 正常シナリオ（本文をBashで読む）
    setup:
      - name: Mock
        description: 正常シナリオと同じ（`claude -p --setting-sources project --plugin-dir {プラグイン}`）
      - name: ルールの本文
        description: ローカルに配置したルールの Markdown
      - name: 索引
        description: 正常シナリオと同じエントリを 1 つ持つ YAML
      - name: 読み方の指示
        description: プロンプトで、ルールの本文を Read ではなく Bash の `cat` で読むよう指示する
        notes: '`--allowedTools` で Bash を許可し、Read を `--disallowedTools` で除外して読み方を 1 つに定める'
      - name: 書く操作の許可
        description: 正常シナリオと同じ（`--allowedTools` で Write と Edit を許可する）
    flow: |-
      ```mermaid
      flowchart TD
        S0([Claude Code]) -->|対象のファイルを書く操作| UC1([未読のルールの案内を受ける:正常シナリオ（止めて案内する）])
        UC1 -->|案内に載ったルールの場所| UC2([ルールを読んだことが記録される:正常シナリオ（Bashで読む）])
        UC2 -->|既読の記録 + 同じ操作の再試行| UC3([未読のルールの案内を受ける:正常シナリオ（既読のため案内しない）])
        UC3 --> DONE([対象のファイルが書かれた状態])

