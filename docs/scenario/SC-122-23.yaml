  - name: 正常シナリオ（案内されたツールで読む）
    setup:
      - name: Mock
        description: 正常シナリオと同じ（`claude -p --setting-sources project --plugin-dir {プラグイン}`）。文書を返却する MCP のツールは、テストが用意する stdio の MCP サーバーで代える
