id: SC-122-25
visibility: internal
title: "索引のエントリを直して案内を確かめる"
scenarios:
  - name: 正常シナリオ（エントリを新規作成する）
    setup:
      - name: Mock
        description: なし。実の Claude Code を `claude -p --setting-sources project --plugin-dir {プラグイン}` で動かし、利用者の設定（`~/.claude`）のフック・プラグイン・MCP サーバーを読み込ませない
        notes: サーバーは `--mcp-config` で HTTP の接続先（`http://127.0.0.1:{ポート}/mcp`）として指定する
      - name: MCP サーバー
        description: テストがローカルのクローンから起動した常駐の MCP サーバー
        notes: 起動の方法は単一ユースケース『MCPサーバーを常駐させる』に従う。ポートは空いているポートを設定ファイルに記載して指定する
      - name: ルールの本文
        description: ローカルに配置したルールの Markdown
      - name: 索引
        description: 対象のファイルにヒットするエントリを持たない YAML
        notes: '`RULE_INJECT_CONFIG` で指した設定ファイルの `projects` の、起動したプロジェクトに該当する要素で指す'
      - name: ツールの許可
        description: '`--allowedTools` でサーバーの編集・検索のツールと、Write・Edit を許可する'
        notes: 編集・検索・書く操作を別々の `claude -p` で指示し、2 回目からは `--resume {session_id}` で続ける。対象のファイルはまだ無いパスにし、書き込まれたかで結末を見分ける
    flow: |-
      ```mermaid
      flowchart TD
        S0([Claude Code]) -->|ルールの場所・対象のパスの glob・書く操作を必須とするエントリ| UC1([索引のエントリを編集する:正常シナリオ（エントリを新規作成する）])
        UC1 -->|対象のファイルのパス| UC2([操作に当たるルールを検索する:正常シナリオ（ファイルのパスで検索する）])
        UC2 -->|対象のファイルを書く操作| UC3([未読のルールの案内を受ける:正常シナリオ（止めて案内する）])
        UC3 --> DONE([対象のファイルが書かれていない状態])

        click UC1 "id:SC-122-19#scenarios[正常シナリオ（エントリを新規作成する）]"
        click UC2 "id:SC-122-12#scenarios[正常シナリオ（ファイルのパスで検索する）]"
        click UC3 "id:SC-122-16#scenarios[正常シナリオ（止めて案内する）]"
      ```
    expected:
      - 索引のファイルに、作成したエントリが追加されている
      - 検索のツールの結果に、作成したエントリのルールの場所と、未読のときに操作を止めることが載っている
      - 書く操作は止められ、案内に作成したエントリのルールの場所が載っている
      - 対象のファイルが作られていない
    test: test_normal_when_entry_created
    uses:
      - SC-122-19#scenarios[正常シナリオ（エントリを新規作成する）]
      - SC-122-12#scenarios[正常シナリオ（ファイルのパスで検索する）]
      - SC-122-16#scenarios[正常シナリオ（止めて案内する）]
  - name: 正常シナリオ（エントリを無効にする）
    setup:
      - name: Mock
        description: エントリを新規作成するシナリオと同じ（`claude -p --setting-sources project --plugin-dir {プラグイン}`、サーバーは `--mcp-config` で指定する）
      - name: MCP サーバー
        description: エントリを新規作成するシナリオと同じ常駐の MCP サーバー
      - name: ルールの本文
        description: ローカルに配置したルールの Markdown
      - name: 索引
        description: 対象のファイルにヒットし、書く操作を必須とするエントリを 1 つだけ持つ YAML
        notes: '`RULE_INJECT_CONFIG` で指した設定ファイルの `projects` の、起動したプロジェクトに該当する要素で指す'
      - name: ツールの許可
        description: エントリを新規作成するシナリオと同じ（サーバーの編集・検索のツールと、Write・Edit を許可する）
        notes: 対象のファイルはまだ無いパスにし、書き込まれたかで結末を見分ける
    flow: |-
      ```mermaid
      flowchart TD
        S0([Claude Code]) -->|エントリに enabled: false を書く編集| UC1([索引のエントリを編集する:正常シナリオ（エントリを無効にする）])
        UC1 -->|対象のファイルのパス| UC2([操作に当たるルールを検索する:正常シナリオ（該当するルールが無い）])
        UC2 -->|対象のファイルを書く操作| UC3([未読のルールの案内を受ける:正常シナリオ（無効のエントリに該当する）])
        UC3 --> DONE([対象のファイルが書かれた状態])

        click UC1 "id:SC-122-19#scenarios[正常シナリオ（エントリを無効にする）]"
        click UC2 "id:SC-122-12#scenarios[正常シナリオ（該当するルールが無い）]"
        click UC3 "id:SC-122-16#scenarios[正常シナリオ（無効のエントリに該当する）]"
      ```
    expected:
      - '索引のファイルの対象のエントリに `enabled: false` が記載されている'
      - 検索のツールの結果に、ヒットするルールが無い
      - 書く操作は止められず、対象のファイルに中身が書き込まれている
    test: test_normal_when_entry_disabled
    uses:
      - SC-122-19#scenarios[正常シナリオ（エントリを無効にする）]
      - SC-122-12#scenarios[正常シナリオ（該当するルールが無い）]
      - SC-122-16#scenarios[正常シナリオ（無効のエントリに該当する）]
lead: 索引のエントリを修正して検索で確認した後、修正したエントリで案内が出る一連の流れを示し、索引の編集と案内の連携を変えるときに参照する。
issue: 58
primary_actor: Claude Code のセッション
stakeholders:
  - name: ユーザー
    interest: ツールで修正したエントリが、索引を手で書き換えたときと同じく、次の操作から案内に反映されること
trigger: Claude Code が、常駐の MCP サーバーの編集のツールで索引のエントリを修正する
preconditions:
  - プラグインが Claude Code に読み込まれている
  - MCP サーバーが常駐し、Claude Code に HTTP の MCP サーバーとして登録されている
  - フックとサーバーが同じ設定ファイルを読み、設定ファイルで指した場所に索引が配置されている
success_guarantee: 編集のツールが書き込んだエントリは、サーバーを再起動せずに、検索のツールと次のフックの呼び出しの両方で同じヒットの仕方をする。
minimal_guarantee: 書き込んだ後の索引がチェックに通らないときは索引を書き換えず、フックの案内は編集の前のまま変わらない。
test_file: tests/e2e/複合ユースケース/test_fix_index_entry_then_check_guidance.py
