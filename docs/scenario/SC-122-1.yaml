id: SC-122-1
visibility: internal
title: "MCPサーバーの状態を確認する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし。テストがローカルのクローンから常駐の MCP サーバーを起動し、MCP の Python SDK のクライアント（Streamable HTTP）でツールを呼ぶ
        notes: クライアントが Claude Code の代わりにツールを呼ぶ
      - name: 設定ファイル
        description: 索引を記載した設定ファイル
        notes: '`RULE_INJECT_CONFIG` で指し、`RULE_INJECT_PORT` に空いているポートを指定する'
    flow: |-
      sequenceDiagram
        participant CL as MCP クライアント
        participant SV as MCP サーバー
        participant CF as 設定ファイル
        participant GC as クローン

        CL->>SV: 状態の確認
        SV->>CF: 読む
        CF-->>SV: 読めた
        SV->>GC: バージョンと commit を取得する
        GC-->>SV: バージョンと commit
        SV-->>CL: ポート・プロセス・起動した時刻・バージョン・commit・設定ファイル
    expected:
      - 応答のポートが `RULE_INJECT_PORT` と同じ
      - 応答のプロセス ID がテストが起動したサーバーのプロセスと同じ
      - 応答のバージョンがクローンの `version.ini` と同じで、commit がクローンの `HEAD` と同じ
      - 応答の設定ファイルの場所が `RULE_INJECT_CONFIG` と同じで、読めたと載っている
    test: test_normal
  - name: 正常シナリオ（設定ファイルが読めない）
    setup:
      - name: Mock
        description: 正常シナリオと同じ（SDK のクライアントでツールを呼ぶ）
      - name: 設定ファイル
        description: サーバーを起動した後に、`global` に知らないキーを追記する
        notes: 起動時は読めるファイルにしておく
    flow: |-
      sequenceDiagram
        participant CL as MCP クライアント
        participant SV as MCP サーバー
        participant CF as 設定ファイル

        CL->>SV: 状態の確認
        SV->>CF: 読む
        CF-->>SV: 読めない（知らないキー）
        SV-->>CL: 状態と、設定ファイルを読めない理由
    expected:
      - ツールのエラーにならず、ポート・プロセス ID・バージョンが載っている
      - 応答の設定ファイルに、読めないことと理由（知らないキー）が載っている
    test: test_normal_when_settings_unreadable
lead: Claude Code が常駐の MCP サーバーの状態の確認のツールを呼び出して状態を受け取る流れを示し、状態の確認を変えるときに参照する。
issue: 107
primary_actor: Claude Code のセッション
stakeholders:
  - name: 利用者
    interest: サーバーがどのバージョン・どの commit で動いているかと、設定ファイルを読めているかを、端末でコマンドを打たずに知れること
trigger: Claude Code が状態の確認のツールを呼ぶ
preconditions:
  - MCP サーバーが常駐し、Claude Code からプラグインの `.mcp.json` の接続先で接続できる
  - サーバーはローカルのクローンから起動している
success_guarantee: 待ち受けのポート・プロセス ID・起動した時刻・ツールのバージョン・クローンの場所と commit・設定ファイルの場所と読めるかを返却する。
minimal_guarantee: 設定ファイル・索引・既読の記録・クローンを書き換えない。設定ファイルが読めなくても、状態の確認はエラーにせず読めない理由を返却する。
test_file: tests/e2e/単一ユースケース/test_view_server_status.py
