summary: 単一 / 複合ユースケースの業務フロー設計（E2E テストの元）
items:
  - page: SC-122-16.yaml
    summary: 操作の対象に当たる未読のルールを、止めて、または止めずに案内する
  - page: SC-122-8.yaml
    summary: Read か Bash でルールの本文を読んだ場所を既読として記録する
  - page: SC-122-11.yaml
    summary: 会話の圧縮の前に、そのセッションの既読の記録を捨てる
  - page: SC-122-6.yaml
    summary: MCP サーバーへの接続時に、新しいファイルは空で作ってから記載する決まりを instructions で受け取る
  - page: SC-122-21.yaml
    summary: セッションの開始時に、最終更新から保持期間を過ぎた既読の記録ファイルを削除する
  - page: SC-122-10.yaml
    summary: 日付が保持日数以上前のログのファイルを、セッションの開始時に削除する
  - page: SC-122-17.yaml
    summary: Grep・Glob・検索の Bash の結果に出たファイルに当たる未読のルールを、止めずに案内する
  - page: SC-122-4.yaml
    summary: 起動のコマンドで MCP サーバーを前面で動かし、Claude Code から HTTP で接続して、SIGTERM で止める
  - page: SC-122-9.yaml
    summary: プロジェクトで今効いている索引とエントリを、読めない索引・読み飛ばしたエントリ・無効のエントリとともに受け取る
  - page: SC-122-12.yaml
    summary: ファイルのパスか MCP のツールの呼び出しに当たるルールと、未読のときに操作を止めるかを受け取る
  - page: SC-122-20.yaml
    summary: 索引ごとに、フックが読めない理由・JSON Schema への違反・ルールの場所にファイルが無いエントリを受け取る
  - page: SC-122-19.yaml
    summary: 設定ファイルで読む索引のエントリを、コメントと書式を残して新規作成・編集・削除する
  - page: SC-122-15.yaml
    summary: MCP サーバーのツールで、セッションの既読のルールと読んだ方法を受け取る
  - page: SC-122-14.yaml
    summary: MCP サーバーのツールで、セッションの既読の記録を削除してルールを未読に戻す
  - page: SC-122-13.yaml
    summary: 環境変数が無いときに、既定のパスの設定ファイルでルールの案内を受ける
  - page: SC-122-18.yaml
    summary: global-setup のスキルで、端末の設定・サーバー・フックを用意して確認する
  - page: SC-122-7.yaml
    summary: setup のスキルで、リポジトリの索引が参照される状態にしてチェックの結果を受け取る
  - page: SC-122-1.yaml
    summary: MCP サーバーのツールで、待ち受け・バージョン・クローンの commit・設定ファイルを読めるかを受け取る
  - page: SC-122-2.yaml
    summary: MCP サーバーのツールで、直した設定ファイルを読めたかと読んだ値を受け取る
  - page: SC-122-3.yaml
    summary: MCP サーバーのツールで、サーバーを起動し直し、接続し直して確かめる
  - page: SC-122-5.yaml
    summary: MCP サーバーのツールで、クローンへ上流の commit を取り込み、依存を入れ直して起動し直す
  - page: SC-122-22.yaml
    summary: セッションの開始時に、応答しない MCP サーバーを systemd --user のユニットで起動し、`/mcp` で接続し直す案内を受け取る
  - page: SC-122-23.yaml
    summary: 当たる未読のルールで止められ、本文を読んでから同じ操作を再試行して通る流れ
  - page: SC-122-25.yaml
    summary: MCP サーバーのツールで索引のエントリを直し、検索で確かめた後、次のフックの呼び出しから直したエントリで案内が出る流れ
  - page: SC-122-24.yaml
    summary: MCP サーバーのツールで既読のルールを確かめて既読の記録を削除し、次のフックの呼び出しから未読として案内される流れ
