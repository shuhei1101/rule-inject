id: SC-122-2
visibility: internal
title: "MCPサーバーの設定を再読込する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし。テストがローカルのクローンから常駐の MCP サーバーを起動し、MCP の Python SDK のクライアント（Streamable HTTP）でツールを呼ぶ
      - name: 設定ファイル
        description: サーバーを起動した後に、`global.indexes` へ索引を 1 つ追記する
        notes: '`RULE_INJECT_CONFIG` で指す'
    flow: |-
      sequenceDiagram
        participant CL as MCP クライアント
        participant SV as MCP サーバー
        participant CF as 設定ファイル

        CL->>SV: 再読込
        SV->>CF: 読む
        CF-->>SV: 読めた
        SV-->>CL: 読めた・読んだ値
    expected:
      - 応答に、設定ファイルの場所と読めたことが載っている
      - 応答に、読んだ値（読む索引・記録フォルダ・保持日数・project-index の接続先）が載り、追記した索引が読む索引に含まれている
      - 続けて呼んだ `list_rules` の応答の索引に、追記した索引が載っている
    test: test_normal
  - name: 異常シナリオ（設定ファイルが読めない）
    setup:
      - name: Mock
        description: 正常シナリオと同じ（SDK のクライアントでツールを呼ぶ）
      - name: 設定ファイル
        description: サーバーを起動した後に、`global` に知らないキーを追記する
    flow: |-
      sequenceDiagram
        participant CL as MCP クライアント
        participant SV as MCP サーバー
        participant CF as 設定ファイル

        CL->>SV: 再読込
        SV->>CF: 読む
        CF-->>SV: 読めない（知らないキー）
        SV-->>CL: ツールのエラー（場所と理由）
    expected:
      - ツールのエラーが返り、設定ファイルの場所と読めない理由が載っている
      - サーバーは待ち受けたまま、続けて呼んだ状態の確認が応答する
    test: test_error_when_settings_unreadable
lead: 設定ファイルを修正した後に MCP サーバーの再読込のツールで読み込んだ値を受け取る流れを示し、設定の再読込を変えるときに参照する。
issue: 107
primary_actor: Claude Code のセッション
stakeholders:
  - name: 利用者
    interest: 設定ファイルを修正した後に、修正した値が次のツールの呼び出しから有効になるかを知れること
trigger: Claude Code が再読込のツールを呼ぶ
preconditions:
  - MCP サーバーが常駐し、Claude Code からプラグインの `.mcp.json` の接続先で接続できる
success_guarantee: 設定ファイルを再度読み込み、読めたかと、読んだ値（読む索引・記録フォルダ・保持日数・project-index の接続先）を返却する。
minimal_guarantee: 設定ファイル・索引・既読の記録を書き換えず、待ち受けを止めない。読めないときは場所と理由を返却する。
test_file: tests/e2e/単一ユースケース/test_reload_server_settings.py
