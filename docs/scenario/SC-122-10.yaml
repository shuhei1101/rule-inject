id: SC-122-10
visibility: internal
title: "古いログが掃除される"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし。実の Claude Code を `claude -p --setting-sources project --plugin-dir {プラグイン}` で動かし、利用者の設定のフック・プラグインを読み込ませない
      - name: ログのフォルダ
        description: '`RULE_INJECT_CONFIG` で指した設定ファイルの `global` のログのフォルダで、テスト用のフォルダを指す'
        notes: '設定ファイルにログの保持日数は記載せず、既定の 3 日で動かす'
      - name: 古いログ
        description: 日付が 3 日前（UTC）のログのファイルを配置する
      - name: 新しいログ
        description: 日付が 2 日前（UTC）のログのファイルを配置する
      - name: 操作
        description: プロンプトで、ツールを呼ばずに 1 単語で回答するよう指示する
        notes: '`--max-turns 1`。セッションの開始で掃除が走ればよく、ツールは呼ばせない'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant S as SessionStart フック
        participant LG as ログのフォルダ

        CC->>S: セッションの開始（session_id・source）
        S->>LG: ログのファイルを列挙する
        LG-->>S: ファイル名の日付
        S->>LG: 日付が保持日数以上前のファイルを削除する
      ```

      <!-- /map -->
    expected:
      - 古いログのファイルが無い
      - 新しいログのファイルが残っている
    test: test_normal
lead: セッションの開始時にフックが保持日数を過ぎたログのファイルを削除する流れを示し、ログの掃除を変えるときに参照する。
issue: 11
primary_actor: Claude Code のセッション
trigger: セッションの開始（新規・再開・`/clear`・圧縮の後）
notes:
  日付で分ける理由: '削除するのは追記されなくなった過去の日付のファイルだけなので、削除している間に別のセッションが書き込んだ行を失わない。中身を読まずにファイル名だけで決まるため、フックの実行時間にも影響しない（[PR #12「プラグインのログ（rule-inject.log）を掃除する」](https://github.com/shuhei1101/rule-inject/pull/12) の確認事項で利用者が決めた方式）'
test_file: tests/e2e/単一ユースケース/test_old_log_cleaned.py
