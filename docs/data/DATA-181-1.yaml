id: DATA-181-1
visibility: internal
title: 'データ: ログ'
lead: フックが失敗した操作のログの 1 行。フックが書き込み、利用者が参照する。
datastore: JSON Lines
fields:
- key: time
  title: 時刻
  type: datetime
  required: true
  description: 失敗した時刻（UTC）
- key: component
  title: 出した元
  type: string
  required: true
  description: インターフェース定義の識別子（`rule_guide` / `record_read` / `discard_read` / `work_rules` / `sweep_read` / `start_server`）
- key: session_id
  title: セッション
  type: string
  required: false
  description: 入力にあればその値
- key: operation
  title: 失敗の操作
  type: string
  required: true
  description: '`read_settings` / `read_index` / `read_record` / `write_record` / `write_history` / `delete_record` / `delete_log` / `check_unit` / `start_unit` / `unexpected` のいずれか'
- key: path
  title: 対象のパス
  type: string
  required: false
  description: 失敗した操作の対象のファイルかフォルダ
- key: reason
  title: 理由
  type: string
  required: true
  description: 例外のクラス名と文面
