id: CFG-122-1
visibility: internal
title: "設定: プラグイン"
lead: プラグインが読み込む環境変数・設定ファイルのキーと、ルール索引のキーを定め、設定や索引のキーを追加・変更するときに参照する。
files:
  - file: ~/.claude/settings.json
    manages: 設定ファイルの場所を指す環境変数 `RULE_INJECT_CONFIG`（`env`）
    notes: Claude Code のユーザーの設定。フックは `env` の値を環境変数として受け取る
  - file: 索引（*.yaml）
    manages: ルールの場所と、適用するパス・ツール名・操作の種別の紐づけ
    notes: 利用者が記載する。配置場所と名前は自由で、設定ファイルの `indexes` で指す。フックが標準ライブラリだけで読み込めるよう、YAML のうちここに挙げたキーと形式（マップ・文字列のリスト・文字列）だけを読み込む
  - file: ${XDG_CONFIG_HOME:-~/.config}/rule-inject/settings.yaml
    manages: 索引の場所・既読の記録とログの配置場所・保持日数（最上位の `version`・`global`・`projects`）
    notes: 利用者か `global-setup` が記載する。既定と違う場所に配置するときは `RULE_INJECT_CONFIG` で指す。ファイルが無いときは全てのキーを既定値で動かす。フックが標準ライブラリだけで読み込めるよう、ここに挙げたキーと形式（マップ・マップのリスト・文字列のリスト・文字列・整数）だけを読み込む
  - file: settings.sample.yaml
    manages: 設定ファイルのキーの一覧（実値を含まないサンプル）
    notes: プラグインの直下に配置する。フックは読み込まない
  - file: .mcp.json
    manages: Claude Code が接続する MCP サーバーの URL（`http://127.0.0.1:${RULE_INJECT_PORT:-8783}/mcp`）
    notes: プラグインのルートに配置する。`RULE_INJECT_PORT` を変えるときは `~/.claude/settings.json` の `env` に記載する
settings:
  - key: default_on
    title: 既定の必須の操作
    file: 索引（*.yaml）
    type: list[Literal['read', 'write', 'mcp']]
    required: false
    default: '`[read, write, mcp]`'
    description: その索引のエントリが `on` を記載しないときの、操作を止める操作の種別
    reload: immediate
    visibility: user
    status: planned
  - key: rules[].rule
    title: ルールの場所
    file: 索引（*.yaml）
    type: str
    required: true
    description: ルールの本文の場所
    missing: その索引を読み込まず、索引を読み込めないときと同じく索引の場所と理由をコンテキストへ追加する。設定されていない環境変数の `!{名前}` が残ったときは、そのエントリだけをスキップし、理由をコンテキストへ追加する
    reload: immediate
    allowed: '絶対パス、`~` で始まるパス、索引ファイルのフォルダからの相対パス。`http://` か `https://` で始まる URL のエントリは Read で参照できないため、案内にも既読にも使用せずスキップする（理由はルール案内が案内に記載する）。`!{名前}`（名前は `[A-Za-z_][A-Za-z0-9_]*`）を記載すると、フックが受け取った環境変数の値に置き換えてから場所を解決する'
    visibility: user
    status: planned
  - key: rules[].paths
    title: 適用するパス
    file: 索引（*.yaml）
    type: list[str]
    required: false
    default: なし（パスでは適用しない）
    description: 操作の対象の絶対パスに照合する glob か正規表現
    reload: immediate
    allowed: '`**/` か `*` で始まる glob。`**` はフォルダをまたぐ。`re:` で始めると、残りを正規表現として操作の対象の絶対パスに部分一致（`re.search`）で照合する。読み込めない正規表現を記載したエントリはスキップし、索引の場所・パターン・理由をコンテキストへ追加する'
    visibility: user
    status: planned
  - key: rules[].exclude
    title: 除外するパス
    file: 索引（*.yaml）
    type: list[str]
    required: false
    default: なし（除外しない）
    description: '`paths` にヒットしても、このパターンにヒットするパスにはそのエントリを適用しない'
    reload: immediate
    allowed: '`paths` と同じ記法（glob か `re:` の正規表現）'
    visibility: user
    status: planned
  - key: rules[].tools
    title: 適用するツール名
    file: 索引（*.yaml）
    type: list[str]
    required: false
    default: なし（ツール名では適用しない）
    description: MCP のツールの完全名に照合する glob か正規表現
    reload: immediate
    allowed: '`mcp__` で始まる glob（例 `mcp__*__create_*`）か、`re:` で始まる正規表現（ツールの完全名に部分一致で照合する。例 `re:__create_`）'
    visibility: user
    status: planned
  - key: rules[].args
    title: 適用する引数
    file: 索引（*.yaml）
    type: dict[str, list[str]]
    required: false
    default: なし（引数では絞らない）
    description: '`tools` にヒットした MCP のツールの引数に照合するパターン。引数のキー → パターンのリストのマップで、記載した全てのキーの値がどれかのパターンにヒットするときだけエントリを適用する'
    reload: immediate
    allowed: キーは引数の名前で、オブジェクトの子はドットで結ぶ（例 `filter.kind`）。パターンは glob か `re:` で始まる正規表現（値に部分一致で照合する）。`キー:` の下にパターンのリストを並べたブロックのマップだけを読み込み、フローのマップ・空の `args`・キーの重複は索引を読み込めなくする。キーが引数に無いとき・値がオブジェクトのときは適用しない。値が配列のとき、およびドット区切りのキーの途中が配列のときは要素ごとに照合し、どれか 1 つがヒットすれば適用する。文字列以外のスカラーは JSON の表記（`true`・`null`・`1.5`）で照合する。`{道筋}[{field}]` のキー（例 `filter[tags]`）は、道筋の値を条件の木として読み込み、`field` が一致する条件の `values` に照合する（`not` の中と否定の `op` は値にしない。インターフェース定義「ルール案内」の制約「条件の木の照合」）
    visibility: user
    status: planned
  - key: rules[].on
    title: 止める操作
    file: 索引（*.yaml）
    type: list[Literal['read', 'write', 'mcp']]
    required: false
    default: 索引の `default_on`
    description: 未読のときに操作を止める操作の種別。ヒットした操作がここに無ければ、止めずに案内する
    reload: immediate
    allowed: '`read`（Read・Bash での読み取り）/ `write`（Edit・Write）/ `mcp`（MCP のツールの呼び出し）'
    visibility: user
    status: planned
  - key: rules[].read_by
    title: 既読にする呼び出し
    file: 索引（*.yaml）
    type: list[object]
    required: false
    default: なし（MCP のツールの呼び出しでは既読にしない）
    description: そのエントリのルールを既読にする MCP のツールの呼び出し。要素のどれか 1 つにヒットした呼び出しが終わった後に、そのルールをそのセッションの既読にする。案内の適用の条件の `tools`・`args` にヒットしただけでは既読にしない
    reload: immediate
    allowed: 要素は `tools`（必須）と `args`（任意）を持つマップ
    status: planned
    visibility: user
  - key: rules[].read_by[].tools
    title: 既読にするツール名
    file: 索引（*.yaml）
    type: list[str]
    required: true
    description: 既読にする MCP のツールの完全名に照合する glob か正規表現
    missing: その索引を読み込まず、索引を読み込めないときと同じく索引の場所と理由をコンテキストへ追加する
    reload: immediate
    allowed: '`rules[].tools` と同じ記法（`mcp__` で始まる glob か `re:` で始まる正規表現）'
    status: planned
    visibility: user
  - key: rules[].read_by[].args
    title: 既読にする引数
    file: 索引（*.yaml）
    type: dict[str, list[str]]
    required: false
    default: なし（引数では絞らない）
    description: 同じ要素の `tools` にヒットした呼び出しの引数に照合するパターン。記載した全てのキーの値がどれかのパターンにヒットするときだけ既読にする
    reload: immediate
    allowed: '`rules[].args` と同じ記法と照合の規則'
    status: planned
    visibility: user
  - key: rules[].read_tool
    title: 参照するツール
    file: 索引（*.yaml）
    type: object
    required: false
    default: なし（案内はパスを Read で参照する旨だけ）
    description: ルールを参照する MCP のツールと引数。案内でルールの場所の下にツールの名前と引数を記載し、その値と一致する呼び出しが終わった後に、結果の範囲と `read_by` によらずそのルールをそのセッションの既読にする
    missing: 書式に合わないときは、その索引を読み込まず、索引を読み込めないときと同じく索引の場所と理由をコンテキストへ追加する
    reload: immediate
    allowed: '`tool`（必須）と `args`・`optional_args`（任意）だけを持つマップ'
    status: planned
    visibility: user
  - key: rules[].read_tool.tool
    title: 参照するツール名
    file: 索引（*.yaml）
    type: str
    required: true
    description: ルールを参照する MCP のツールの完全名。パターンでなく、そのまま案内に記載して呼び出す名前
    reload: immediate
    allowed: '`mcp__` で始まる文字列'
    status: planned
    visibility: user
  - key: rules[].read_tool.args
    title: 参照する引数
    file: 索引（*.yaml）
    type: str
    required: false
    default: なし（引数を指定せずに呼び出す）
    description: ツールに指定する引数を JSON のオブジェクトで記載した文字列。案内にそのまま JSON で記載し、呼び出しの引数の最上位に記載した全てのキーがあり値が等しいとき既読にする（呼び出しが余分なキーを持っていてもよい）
    reload: immediate
    allowed: JSON のオブジェクトを表す文字列（YAML では単一引用符で囲む）。JSON として読み込めない・オブジェクトでない値は索引を読み込めなくする。値はパターンとしては扱わず、JSON の値として比べる（オブジェクトはキーの順を問わず、配列は順まで同じ、真偽値と数値は区別する）
    status: planned
    visibility: user
  - key: rules[].read_tool.optional_args
    title: 省略してよい引数
    file: 索引（*.yaml）
    type: str
    required: false
    default: なし
    description: ツールに指定してよいが省略してもよい引数を JSON のオブジェクトで記載した文字列。案内の `ツール:` の行の末尾に「省略可」として記載し、既読の判定には使用しない（`sections`・`fields` など範囲を絞る引数を記載する）
    reload: immediate
    allowed: '`rules[].read_tool.args` と同じ記法'
    status: planned
    visibility: user
  - key: RULE_INJECT_CONFIG
    title: 設定ファイルの場所
    file: ~/.claude/settings.json
    type: str
    required: false
    default: '`${XDG_CONFIG_HOME:-~/.config}/rule-inject/settings.yaml`（ファイルが無ければ全てのキーを既定値で動かす）'
    description: 設定ファイル `settings.yaml` のパス。先頭の `~` はホームに展開する
    missing: 指したファイルが無いときと、指したファイルか既定のパスのファイルが YAML として読み込めない・知らないキーや許す値の外の値を持つときは、設定ファイルを使用せず、各フックが既定のログのフォルダへ `read_settings` を記録し、案内を返却するフックはファイルの場所と理由を案内に記載する（既定値で動かさない）
    env_var: RULE_INJECT_CONFIG
    reload: restart
    allowed: 絶対パスか `~` で始まるパス
    reason: プロジェクトスコープの `env` には記載しない。プロジェクトごとの違いは設定ファイルの `projects` に記載する
    status: planned
    visibility: user
  - key: global.indexes
    title: ユーザーの索引
    file: ~/.config/rule-inject/settings.yaml
    type: list[str]
    required: false
    default: '`[${XDG_CONFIG_HOME:-~/.config}/rule-inject/rules.yaml]`（ファイルが無ければ理由を記載せずに読み込まない）'
    description: どのプロジェクトで起動しても読み込む索引のパスの並び。空の並び `[]` にすると、既定の配置場所も読み込まない
    reload: immediate
    allowed: 絶対パスか `~` で始まるパス。相対パスは設定ファイルの誤りとして扱う
    status: planned
    visibility: user
  - key: global.state_dir
    title: 既読の記録の配置場所
    file: ~/.config/rule-inject/settings.yaml
    type: str
    required: false
    default: '`${XDG_STATE_HOME:-~/.local/state}/rule-inject`'
    description: セッションごとの既読の記録ファイル・案内済みの記録ファイル・既読の履歴ファイルを配置するフォルダ
    reload: immediate
    allowed: 絶対パスか `~` で始まるパス。環境変数 `RULE_INJECT_STATE_DIR` があるときはそちらを使用する
    reason: 掃除は起動したプロジェクトの記録フォルダしか確認しないため、`projects` で分けると開かないプロジェクトの記録が残る。そのため `global` だけに設定する
    status: planned
    visibility: user
  - key: global.log_dir
    title: ログの配置場所
    file: ~/.config/rule-inject/settings.yaml
    type: str
    required: false
    default: '`RULE_INJECT_STATE_DIR` があればその下の `logs`、無ければ `${XDG_STATE_HOME:-~/.local/state}/rule-inject/logs`'
    description: フックが失敗した操作を記録する、日付ごとのログのファイルを配置するフォルダ。設定ファイルを読み込めなかったことのログは既定値のフォルダへ書き込む
    reload: immediate
    allowed: 絶対パスか `~` で始まるパス
    status: planned
    visibility: user
    reason: 掃除は起動したプロジェクトのログのフォルダしか確認しないため、`projects` で分けると開かないプロジェクトのログが残る。そのため `global` だけに設定する
  - key: global.record_retention_days
    title: 既読の記録の保持日数
    file: ~/.config/rule-inject/settings.yaml
    type: int
    required: false
    default: '30'
    description: 最後に追記してからこの日数を過ぎた既読の記録ファイル・案内済みの記録ファイル・既読の履歴ファイルを、セッションの開始時に削除する
    reload: immediate
    allowed: 1 以上の整数。それ以外の値は設定ファイルの誤りとして扱う
    status: planned
    visibility: user
    reason: 記録フォルダは全てのプロジェクトで共通のため、`projects` で分けると他のプロジェクトの記録を削除する日数が起動したプロジェクトの値で決まる。そのため `global` だけに設定する
  - key: global.log_retention_days
    title: ログの保持日数
    file: ~/.config/rule-inject/settings.yaml
    type: int
    required: false
    default: '3'
    description: 日付が今日（UTC）からこの日数以上前のログのファイルを、セッションの開始時に削除する
    reload: immediate
    allowed: 1 以上の整数。それ以外の値は設定ファイルの誤りとして扱う
    status: planned
    visibility: user
    reason: ログのフォルダは全てのプロジェクトで共通のため、`projects` で分けると他のプロジェクトのログを削除する日数が起動したプロジェクトの値で決まる。そのため `global` だけに設定する
  - key: projects[].match
    title: 適用するプロジェクト
    file: ~/.config/rule-inject/settings.yaml
    type: str
    required: true
    description: その要素を適用するプロジェクト。絶対パスなら、`CLAUDE_PROJECT_DIR` がそのパスかその配下のときに適用する。それ以外はプロジェクト名として、リポジトリのフォルダ名が一致したときに適用する。`.claude/worktrees/` の下の worktree は本体のパスとフォルダ名で判定する
    missing: 設定ファイルの誤りとして扱う
    reload: immediate
    allowed: 絶対パスかプロジェクト名
    status: planned
    visibility: user
  - key: projects[].indexes
    title: プロジェクトの索引
    file: ~/.config/rule-inject/settings.yaml
    type: list[str]
    required: false
    default: ヒットした要素のどれも持たないとき `[${CLAUDE_PROJECT_DIR}/rules.yaml]`（ファイルか `CLAUDE_PROJECT_DIR` が無ければ理由を記載せずに読み込まない）
    description: ヒットしたプロジェクトだけで読み込む索引のパスの並び。ヒットした要素の並びを順に `global.indexes` の後ろへ追加する。ヒットした要素が空の並び `[]` を持つと、既定の配置場所も読み込まない
    reload: immediate
    allowed: 絶対パス・`~` で始まるパス・プロジェクトの直下（`CLAUDE_PROJECT_DIR`）からの相対パス
    reason: '`CLAUDE_PROJECT_DIR` はセッションを始めたプロジェクトの直下で、どのフックにも同じ値で指定される。フックの入力の `cwd` は Claude が `cd` した先へ動くため基準に使用しない。要素が持てるキーは `match` と `indexes` だけで、他のキーは設定ファイルの誤りとして扱う'
    status: planned
    visibility: user
  - key: rules[].enabled
    title: 有効
    file: 索引（*.yaml）
    type: bool
    required: false
    default: 'true'
    description: エントリを照合に使用するか。`false` のエントリは、案内（止める・止めない）にも既読の記録（`read_by`・`read_tool` を含む）にも使用しない。同じルールの場所を指す有効なエントリは今までどおり照合する
    reload: immediate
    allowed: '`true` / `false`。それ以外の値はその索引を読み込めない索引として扱う'
    status: planned
    visibility: user
    introduced:
      pr: 57
  - key: global.dev_docs_url
    title: project-indexの接続先
    file: ~/.config/rule-inject/settings.yaml
    type: str
    required: false
    default: http://127.0.0.1:8786/mcp
    description: '`check_indexes` が、使用されているタグを取得する project-index の MCP サーバーの URL。フックは使用しない'
    reload: immediate
    allowed: '`http://` か `https://` で始まる URL。それ以外の値は設定ファイルの誤りとして扱う'
    refs:
      - API-122-1#base_urls
    reason: 既定は project-index の既定の待ち受けに合わせる。サーバーは全てのプロジェクトで 1 つのため `global` だけに設定する
    status: planned
    visibility: user
  - key: version
    title: 設定ファイルのバージョン
    file: ${XDG_CONFIG_HOME:-~/.config}/rule-inject/settings.yaml
    type: str
    required: false
    default: なし（移し替えの前の設定として扱う）
    description: 設定ファイルを最後に移し替えたツールのバージョン。`global-setup` が読み込み、フックとサーバーは参照しない
    reload: immediate
    allowed: '`{major}.{minor}.{patch}`'
    status: planned
    visibility: user
  - key: RULE_INJECT_PORT
    title: MCP サーバーのポート
    file: ~/.claude/settings.json
    type: int
    required: false
    default: '`8783`'
    description: MCP サーバーの待ち受けと、`.mcp.json` の接続先のポート
    missing: 許す値の外のときは、サーバーが待ち受けずに終了する
    env_var: RULE_INJECT_PORT
    reload: restart
    allowed: 1024〜65535 の整数
    reason: '`.mcp.json` は設定ファイルを読み込めないため、`env` だけに設定する。サーバーを起動する環境にも同じ値を指定する'
    status: planned
    visibility: user
  - key: RULE_INJECT_STATE_DIR
    title: 状態の配置場所
    file: ~/.claude/settings.json
    type: str
    required: false
    default: なし（`global.state_dir`、無ければ `${XDG_STATE_HOME:-~/.local/state}/rule-inject`）
    description: 既読の記録の配置場所を上書きする。既定のログのフォルダもこの下の `logs` になる
    env_var: RULE_INJECT_STATE_DIR
    reload: restart
    allowed: 絶対パスか `~` で始まるパス
    status: planned
    visibility: user
  - key: global.server_service
    title: サーバーのサービス名
    file: ~/.config/rule-inject/settings.yaml
    type: str
    required: false
    default: '`rule-inject`'
    description: セッションの開始時に応答しない MCP サーバーを起動する、systemd --user のユニットのサービス名。`global-setup` がユニットを配置したときに `--service` の値を記載する
    reload: immediate
