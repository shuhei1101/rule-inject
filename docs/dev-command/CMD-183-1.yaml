      - TP-122-1#layers[lint]
  - name: ビルド・生成
    prerequisites:
      - AI Monitor のクローンがある（`uv` で AI Monitor の依存を入れてある）
    commands: |-
      1. フォルダの目次の原本（`index.yaml`）か公開ドキュメントの一覧（`docs/guide/files.yml`）を変えたら、`index.yaml` を持つフォルダの `README.md`・`docs/_theme/_data/nav.project.yml`・`docs/guide/` の分類のトップページ・`docs/_config.yml` の `exclude` を再生成し、原本と一緒に commit する

      ```bash
      cd {AI Monitor のクローン} && PYTHONPATH=src uv run python -m ai_monitor.design_docs publish --root {rule-inject の作業ツリー}
      ```

      2. YAML の設計書から `docs/generated/` へ Markdown を生成する（Git で管理しない）

      ```bash
      cd {AI Monitor のクローン} && PYTHONPATH=src uv run python -m ai_monitor.design_docs generate --root {rule-inject の作業ツリー}
      ```

      3. 追従する AI Monitor のバージョンを上げたら、`docs/_theme/` をそのバージョンの共通レイアウトで置き換え、`ai-monitor-theme.yaml` の `version` と一緒に commit する

      ```bash
      cd {AI Monitor のクローン} && PYTHONPATH=src uv run python -m ai_monitor.distribution import-site --version v{MAJOR}.{MINOR}.{PATCH} --root {rule-inject の作業ツリー}
      ```
    effects: 1 は `index.yaml` を持つフォルダの `README.md`・`docs/_theme/_data/nav.project.yml`・`docs/guide/` の分類のトップページ（`はじめに.md`・`使用方法.md`・`リファレンス.md`）と、`docs/_config.yml` の `exclude` を上書きする。3 は `docs/_theme/` のうちそのバージョンの中身と違うファイルを上書きし、そのバージョンに無いファイルを削除する（`nav.project.yml` は書き換えない）
    verification:
      state: 済
      date: '2026-11-14'
      detail: worktree で 1〜3 を実行し、どれも終了コード 0 で終わった。1 は `docs/README.md` と `docs/dev-command/README.md` だけを書き換えた（約 32 秒）。2 は 129 件の Markdown を `docs/generated/` に書き出し、Git の変更は出なかった（約 27 秒）。3 は `ai-monitor-theme.yaml` の `v0.3.0` を指定し、何も書き換えなかった（約 10 秒）。AI Monitor の 1・2 は配信元の設定を `dev-docs.yaml` の名前で参照するため、`project-index.yaml` を指す `dev-docs.yaml` を一時的に作って実行し、commit しなかった
