  - uv（Python は `.python-version` のバージョンを uv が入れる）
categories:
  - name: 環境構築（クローン直後）
    commands: 未確定
  - name: 取り込み後の追従（pull 後）
    commands: 未確定
  - name: 依存の追加・更新・削除
    commands: 未確定
