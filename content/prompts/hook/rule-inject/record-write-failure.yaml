# yaml-language-server: $schema=https://raw.githubusercontent.com/shuhei1101/knowledge/design-schemas/v8.2.0/schemas/prompt.schema.yaml
id: hook/rule-inject/record-write-failure
name: 既読にできない通知の冒頭
description: 既読の記録に書き込めず、ルールを既読にできなかったことを伝える
kind: hook
lang: ja
tags:
  - topic:フック
  - topic:プロンプト
vars:
  locations:
    type: string
    required: true
    description: 既読にしようとしたルールの場所を `, ` でつないだ文字列
    example: '/home/user/rules/python.md'
parts:
  - id: body
    texts:
      - lang: ja
        text: |-
          次のルールを既読にできませんでした（{{ locations }}）。
