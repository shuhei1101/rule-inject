# yaml-language-server: $schema=https://raw.githubusercontent.com/shuhei1101/knowledge/design-schemas/v8.2.0/schemas/prompt.schema.yaml
id: mcp/rule-inject/instructions
name: rule-inject の MCP の instructions
description: 新しいファイルを空の内容で作ってから中身を記載する決まりと、rule-inject の MCP のツールを呼ぶ場面・呼ばない場面・ツール間の順序を伝える
kind: instructions
lang: ja
tags:
  - tool:mcp
  - topic:プロンプト
  - topic:MCPサーバー
parts:
  - id: body
    texts:
      - lang: ja
        text: |-
          rule-inject は、Claude Code がファイルを触る前に、そのファイルに該当する未読のルールを案内する。新しいファイルは Write で空の内容で作った時点でそのファイルに該当するルールが案内されるため、案内されたルールを参照してから Edit で中身を記載する。この MCP のツールは、ルールと索引そのものを扱う作業で呼ぶ。有効なルールの一覧は list_rules、ファイルやツールの呼び出しにヒットするルールの検索は search_rules、索引のエントリの編集と索引のチェックは write_index_entry・delete_index_entry・check_indexes、既読の記録の確認と削除は get_read_records・delete_read_records、設定ファイルを書き換えた後の再読込とサーバーの状態の確認・再起動・更新は reload_settings・get_server_status・restart_server・update_server で行う。ルールの本文は、案内された場所を Read で参照する。プロジェクトのコードや文書は grep・Read で探す。どのルールがヒットするかは、索引を grep・Read せずに search_rules で調べる。索引は Edit で編集せず、write_index_entry・delete_index_entry で編集する。エントリを書き換え・削除する前に、list_rules で position と rev を取得する。ルールが案内されないときは、search_rules でヒットするかを確認してから、get_read_records で既読かを確認する。
