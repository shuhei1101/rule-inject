# yaml-language-server: $schema=https://raw.githubusercontent.com/shuhei1101/project-index/c552062f75e45aa81587209ba0f86bcb67dc1bab/schemas/project-index.schema.json
version: "3"
name: rule-inject
worktrees: [".claude/worktrees/*"]
description: Claude Code がファイルを触る前に、そのファイルに該当するルールを案内するプラグインの設計書・公開ドキュメント・ソースコード・テスト
instructions: |-
  設計書（`docs/` の種類のフォルダ）と各フォルダの `index.yaml` は YAML が原本で、種類ごとの行に分かれる。書式は knowledge の `schemas/design/{種類}.schema.yaml`（`documents[].schema` の `ref` のタグ）が持ち（用語集は `schemas/glossary.schema.yaml`）、他の設計書は `{ID}#{項目のパス}` で指す。
  公開ドキュメント（`docs/guide/`）は `files.yml`、リポジトリの直下・ソースコード（`src/`・`hooks/`）・テスト（`tests/`）・スキル（`skills/`）のファイルは `files.yaml` が名前・概要文・タグ・関連を持つ。各文書の公開範囲は `visibility`（`public` / `internal`）で、YAML の文書はキー、Markdown は `files.yml` の行が持つ。
  コードは `implements` で設計書を、テストは `tests` でコードを指す。設計書からコードを辿るときは `trace_related` を使用する。
direct_commit:
  branch: develop
  kinds:
    - architecture
    - nonfunctional
    - scenario
    - interface
    - module
    - config
    - er
    - data
    - external_api
    - library
    - test_procedure
    - layout
    - dev_command
    - agent
    - mcp_server
    - launch
    - agent_flow
    - llm_call
    - evaluation
    - eval_criterion
    - eval_case
    - index
    - glossary
    - rule_index
    - {id: docs, body: false}
    - {id: src, body: false}
    - {id: hooks, body: false}
    - {id: tests, body: false}
    - skills
    - {id: root, body: false}
    - prompts
documents:
  - id: architecture
    title: アーキテクチャ図
    alias_type: doc
    paths: ["docs/architecture/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/architecture.schema.yaml
      ref: design-schemas/v8.2.0
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: nonfunctional
