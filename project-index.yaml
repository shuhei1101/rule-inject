# yaml-language-server: $schema=https://raw.githubusercontent.com/shuhei1101/project-index/c552062f75e45aa81587209ba0f86bcb67dc1bab/schemas/project-index.schema.json
version: "3"
name: rule-inject
worktrees: [".claude/worktrees/*"]
description: Claude Code がファイルを触る前に、そのファイルに該当するルールを案内するプラグインの設計書・公開ドキュメント・ソースコード・テスト
instructions: |-
  設計書（`docs/` の種類のフォルダ）と各フォルダの `index.yaml` は YAML が原本で、種類ごとの行に分かれる。書式は種類ごとの行の `schema` が指すスキーマが持ち、他の設計書は `{ID}#{項目のパス}` で指す。
  公開ドキュメント（`docs/guide/`）と `docs/` の直下のファイルは `files.yml`、リポジトリの直下・ソースコード（`src/`・`hooks/`）・テスト（`tests/`）・スキル（`skills/`）のファイルは `files.yaml` が名前・概要文・タグ・関連を持つ。各文書の公開範囲は `visibility`（`public` / `internal`）で、YAML の文書はキー、Markdown は `files.yml` の行が持つ。
  コードは `implements` で設計書を、テストは `tests` でコードを指す。設計書からコードを辿るときは `trace_related` を使用する。
documents:
  - id: architecture
    title: アーキテクチャ図
    alias_type: doc
    paths: ["docs/architecture/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/architecture.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: nonfunctional
    title: 非機能要件
    alias_type: doc
    paths: ["docs/nonfunctional/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/nonfunctional.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: scenario
    title: シナリオ
    alias_type: doc
    paths: ["docs/scenario/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/scenario.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: interface
    title: インターフェース定義
    alias_type: doc
    paths: ["docs/interface/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/interface.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: module
    title: モジュール構成
    alias_type: doc
    paths: ["docs/module/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/module.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: config
    title: 設定
    alias_type: doc
    paths: ["docs/config/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/config.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: er
    title: ER図
    alias_type: doc
    paths: ["docs/er/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/er.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: external_api
    title: 外部API
    alias_type: doc
    paths: ["docs/external-api/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/external-api.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: library
    title: 外部ライブラリ
    alias_type: doc
    paths: ["docs/library/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/library.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: test_procedure
    title: テスト実行方法
    alias_type: doc
    paths: ["docs/test-procedure/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/test-procedure.schema.yaml
    metadata:
      name: title
      visibility: visibility
  - id: layout
    title: フォルダ構成
    alias_type: doc
    paths: ["docs/layout/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/layout.schema.yaml
      ref: design-schemas/v8.2.0
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: glossary
    title: 用語集
    paths: ["docs/glossary/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/glossary.schema.yaml
    records: terms
    alias_type: term
  - id: index
    title: 目次
    paths:
      - docs/index.yaml
      - "docs/*/index.yaml"
    schema: schemas/index.schema.yaml
    metadata:
      description: summary
  - id: docs
    title: 公開ドキュメント
    alias_type: doc
    paths: [docs/guide/files.yml, docs/_root/files.yml]
    exclude: ["*.yaml", "*.yml", README.md, index.md, はじめに.md, 使用方法.md, リファレンス.md, _config.yml, default.html, sidebar-source.html, tab-link.html, app.js, style.css, llms.txt, search.json]
    schema: schemas/files.schema.yaml
    records: files
    body_file: path
    metadata:
      visibility: visibility
  - id: src
    title: ソースコード
    paths: [src/files.yaml]
    schema: schemas/files.schema.yaml
    records: files
    body_file: path
  - id: hooks
    title: フックの起動
    paths: [hooks/files.yaml]
    schema: schemas/files.schema.yaml
    records: files
    body_file: path
  - id: tests
    title: テスト
    paths: [tests/files.yaml]
    schema: schemas/files.schema.yaml
    records: files
    body_file: path
  - id: skills
    title: スキル
    paths: [skills/files.yaml]
    schema: schemas/files.schema.yaml
    records: files
    body_file: path
  - id: root
    title: リポジトリの直下のファイル
    paths: [files.yaml]
    schema: schemas/files.schema.yaml
    records: files
    body_file: path
