title: "プラグイン / 案内 / types.py"
data_models:
  - name: GuidedRule
    title: 案内するルール
    container: features/guidance/types.py
    usecase: 未読のルールの案内を受ける
    role: Protocol
    summary: 案内文の組み立てが読む属性だけを持つ型（`typing.Protocol`）。索引の `MatchedRule` を import せず、フックが `MatchedRule` をそのまま渡せる
    properties:
      - name: location
        type: str
        description: ルールの場所
      - name: blocking
        type: bool
        description: 操作を止めるルールか
  - name: Guidance
    title: 案内文
    container: features/guidance/types.py
    usecase: 未読のルールの案内を受ける
    role: DTO
    summary: 組み立てた案内文と、上限に収まって載せたルールの場所。フックは `shown` だけを案内済みにする
    properties:
      - name: text
        type: str
        description: 案内文
      - name: shown
        type: tuple[str, ...]
        description: 案内文に載せたルールの場所（載せた順）
