title: "プラグイン / 案内 / service.py"
test_files:
  - tests/unit/rule_inject/features/guidance/test_service.py
constants:
  - name: GUIDANCE_LIMIT
    title: 案内文の上限
    container: features/guidance/service.py
    summary: 案内文 1 つの字数の上限
    value: '`10000`'
    refs:
      - dev/設計書/非機能要件/非機能要件#requirements[フックの案内文の長さ]
  - name: BLOCKING_HEADER
    title: 止める案内の冒頭
    container: features/guidance/service.py
    summary: 止めるときの案内文の冒頭
    value: '`操作の対象に当たる未読のルールがあります。下の場所を Read で読んでから、同じ操作をやり直してください。`'
  - name: NON_BLOCKING_HEADER
    title: 止めない案内の冒頭
    container: features/guidance/service.py
    summary: 止めないときの案内文の冒頭（再試行を促さない）
    value: '`操作の対象に当たる未読のルールがあります。必要に応じて下の場所を Read で読んでください。この案内はルールごとにセッションで 1 回だけ出ます。`'
  - name: WORK_RULES
    title: 作業の決まり
    container: features/guidance/service.py
    summary: SessionStart で載せる文面
    value: '`新しいファイルは、まず Write で空の内容で作り、案内されたルールを読んでから Edit で中身を書いてください。空で作った時点で、そのファイルに当たるルールが案内されます。`'
  - name: SEARCH_HEADER
    title: 検索結果の案内の冒頭
    container: features/guidance/service.py
    summary: 検索結果の案内の冒頭（読むかは任意と伝え、再試行を促さない）
    value: '`検索で当たったファイルに未読のルールがあります（読むかは任意です）。読む場合は下の場所を Read で読んでください。この案内はルールごとにセッションで 1 回だけ出ます。`'
  - name: READ_TOOL_NOTE
    title: 参照するツールの添え書き
    container: features/guidance/service.py
    summary: 案内に `ツール:` の行が 1 つでもあるとき、冒頭の文の後ろに続ける文
    value: '`` `ツール:` の行があるルールは、そのツールと引数で参照してください。ツールが使えないときは場所を Read で読んでください。 ``'
  - name: READ_TOOL_PREFIX
    title: 参照するツールの行の頭
    container: features/guidance/service.py
    summary: 場所の行の下に置く行の頭
    value: '`"  ツール: "`'
functions:
  - name: build_guidance
    title: 案内文の組み立て
    container: features/guidance/service.py
    usecase: 未読のルールの案内を受ける
    summary: 未読のルールの場所を上限に収まる分だけ並べた案内文を返す
    kind: 関数
    scope: public
    args:
      - name: rules
        type: Sequence[GuidedRule]
        required: true
        passing: positional
        description: 未読のルール
      - name: limit
        type: int
        required: false
        default: GUIDANCE_LIMIT
        passing: keyword
        description: 字数の上限
    returns:
      type: Guidance
      description: 止めるルールがあれば `BLOCKING_HEADER`、無ければ `NON_BLOCKING_HEADER` で始まる案内文と、載せた場所
    process: |-
      1. 止めるルールを先に、元の順を保って並べる
      2. 冒頭の後に、ルールごとに `- {場所}` の行と、`read_tools` ごとの `ツール:` の行（`_tool_line`）を 1 件として追加し、末尾に残りの件数の行を追加しても `limit` を超えないところまで載せる（1 件の途中では切らない）
      3. 載せきれなかったときは `ほか {N} 件のルールは、上のルールを読んで操作をやり直したときに案内します。` を末尾に追加する
      4. 載せたルールに `ツール:` の行が 1 つでもあれば、冒頭の文の後ろ（同じ行）に `READ_TOOL_NOTE` を続ける。`read_tools` を持つルールが 1 つでもあるときは、手順 2 の字数に `READ_TOOL_NOTE` の分を含めて数える
    unit_tests:
      - name: test_build_guidance_when_blocking
        case: 正常
        summary: 止める案内
        condition: 止めるルール 1 件と止めないルール 1 件
        mock: なし
        expected: '`BLOCKING_HEADER` で始まり、止めるルールが先に並ぶ'
      - name: test_build_guidance_when_not_blocking
        case: 正常
        summary: 止めない案内
        condition: 止めないルールだけ
        mock: なし
        expected: '`NON_BLOCKING_HEADER` で始まり、「やり直してください」を含まない'
      - name: test_build_guidance_when_too_long
        case: 正常
        summary: 上限を超える分を件数にする
        condition: 1 件 150 字の場所を 100 件、`limit=10000`
        mock: なし
        expected: 10,000 字以内で、末尾に載せきれなかった件数がある
      - name: test_build_guidance_when_shown
        case: 正常
        summary: 載せた場所だけを shown に返す
        condition: 1 件 150 字の場所を 100 件、`limit=10000`
        mock: なし
        expected: '`shown` の件数が案内文の `- ` の行数と同じで、並びも同じ'
      - name: test_build_guidance_when_read_tools
        case: 正常
        summary: 参照するツールの行と添え書きを載せる
        condition: '`read_tools` に `mcp__docs__search_docs` と `(("id", "python"), ("sections", ("命名",)))` を持つ止めるルールと、`read_tools` が空のルール'
        mock: なし
        expected: '1 行目が `BLOCKING_HEADER` + `READ_TOOL_NOTE`。1 つ目の場所の次の行が `  ツール: mcp__docs__search_docs {"id": "python", "sections": ["命名"]}`、2 つ目の場所の次に `ツール:` の行が無い'
      - name: test_build_guidance_when_no_read_tools
        case: 正常
        summary: 参照するツールが無ければ文面を変えない
        condition: '`read_tools` が空の止めるルールだけ'
        mock: なし
        expected: 1 行目が `BLOCKING_HEADER` だけで、`ツール:` の行が無い
      - name: test_build_guidance_when_read_tool_too_long
        case: 正常
        summary: 場所の行とツールの行を分けて載せない
        condition: '`read_tools` を 1 つ持つルールを、場所の行だけなら収まり、ツールの行を加えると収まらない `limit` で 2 件'
        mock: なし
        expected: 2 件目は場所の行もツールの行も無く、件数の行がある。`shown` は 1 件
      - name: test_build_guidance_when_tool_rule_omitted
        case: 正常
        summary: ツールの行を載せなければ添え書きを付けない
        condition: '`read_tools` を持たないルールが先、`read_tools` を持つルールが後で、後のルールが `limit` に収まらない'
        mock: なし
        expected: 1 行目が `BLOCKING_HEADER` だけ（`READ_TOOL_NOTE` が無い）
  - name: build_failure_notice
    title: 失敗の知らせの組み立て
    container: features/guidance/service.py
    usecase: 共通
    summary: 索引・記録の読み書きの失敗を、場所と理由とログの場所つきの文にする
    kind: 関数
    scope: public
    args:
      - name: summary
        type: str
        required: true
        passing: positional
        description: '何が起きたかの 1 文（例: 索引を読めませんでした）'
      - name: errors
        type: Sequence[RuleInjectError]
        required: true
        passing: positional
        description: 失敗
      - name: log_path
        type: Path
        required: true
        passing: positional
        description: ログの場所
      - name: limit
        type: int
        required: false
        default: GUIDANCE_LIMIT
        passing: keyword
        description: 字数の上限
    returns:
      type: str
      description: '`{summary}` と `- {path}: {reason}` の行とログの場所'
    unit_tests:
      - name: test_build_failure_notice
        case: 正常
        summary: 場所と理由を並べる
        condition: IndexReadError 2 件
        mock: なし
        expected: '2 行の `- {path}: {reason}` とログの場所を含む'
  - name: build_search_guidance
    title: 検索結果の案内文の組み立て
    container: features/guidance/service.py
    usecase: 検索の結果に出たファイルのルールの案内を受ける
    summary: 検索で当たったファイルの未読・未案内のルールの場所を、上限に収まる分だけ並べた案内文を返す
    kind: 関数
    scope: public
    args:
      - name: rules
        type: Sequence[GuidedRule]
        required: true
        passing: positional
        description: 案内するルール（`blocking` は見ない）
      - name: unchecked
        type: int
        required: false
        default: '`0`'
        passing: keyword
        description: 照合するパスの数の上限で照合しなかったパスの件数
      - name: limit
        type: int
        required: false
        default: GUIDANCE_LIMIT
        passing: keyword
        description: 字数の上限
    returns:
      type: Guidance
      description: '`SEARCH_HEADER` で始まる案内文と、載せた場所'
    process: |-
      1. 冒頭の後に、`build_guidance` の手順 2 と同じく場所の行と `ツール:` の行を 1 件ずつ、末尾の行を追加しても `limit` を超えないところまで載せる。添え書き（`READ_TOOL_NOTE`）も `build_guidance` の手順 4 と同じ
      2. 載せきれなかったときは `ほか {N} 件のルールは、次に当たったときに案内します。` を末尾に追加する
      3. `unchecked` が 1 以上なら `検索結果のうち {unchecked} 件は照合していません。` を末尾に追加する
    unit_tests:
      - name: test_build_search_guidance
        case: 正常
        summary: 読むかは任意と伝える案内
        condition: '`read_tools` が空のルール 2 件'
        mock: なし
        expected: '`SEARCH_HEADER` で始まり 2 行の場所がある。「やり直してください」を含まない。`shown` が 2 件'
      - name: test_build_search_guidance_when_unchecked
        case: 正常
        summary: 照合しなかった件数を添える
        condition: '`read_tools` が空のルール 1 件、`unchecked=5`'
        mock: なし
        expected: 末尾に `検索結果のうち 5 件は照合していません。`
      - name: test_build_search_guidance_when_too_long
        case: 正常
        summary: 上限を超える分を件数にする
        condition: 1 件 150 字の場所のルールを 100 件、`limit=10000`
        mock: なし
        expected: 10,000 字以内で、末尾に載せきれなかった件数があり、`shown` は載せた分だけ
      - name: test_build_search_guidance_when_read_tools
        case: 正常
        summary: 参照するツールの行と添え書きを載せる
        condition: '`read_tools` に `mcp__docs__search_docs` と `(("id", "python"),)` を持つルール 1 件'
        mock: なし
        expected: '1 行目が `SEARCH_HEADER` + `READ_TOOL_NOTE`、場所の次の行が `  ツール: mcp__docs__search_docs {"id": "python"}`'
  - name: _tool_line
    title: 参照するツールの行
    container: features/guidance/service.py
    usecase: 未読のルールの案内を受ける
    summary: 参照するツール 1 つを `ツール:` の行にする
    kind: 関数
    scope: internal
    args:
      - name: read_tool
        type: GuidedReadTool
        required: true
        passing: positional
        description: 参照するツール
    returns:
      type: str
      description: '`READ_TOOL_PREFIX` + `{tool} {args の JSON}`'
    process: '`args` を書いた順の辞書（値のタプルはリスト）にし、`json.dumps(ensure_ascii=False)`（区切りは既定の `, `・`: `）で JSON にする。`args` が空なら `{}`'
    unit_tests:
      - name: test_tool_line
        case: 正常
        summary: 書いた順の JSON にする
        condition: '`mcp__docs__search_docs` と `(("sections", ("命名",)), ("id", "python"))`。別に `args` が空'
        mock: なし
        expected: '`  ツール: mcp__docs__search_docs {"sections": ["命名"], "id": "python"}` と `  ツール: mcp__docs__search_docs {}`'
