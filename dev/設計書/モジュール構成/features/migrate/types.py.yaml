id: MOD-122-18
title: "プラグイン / 設定の移し替え / types.py"
data_models:
  - name: MigrationResult
    title: 移し替えの結果
    container: features/migrate/types.py
    usecase: 端末をセットアップする
    role: DTO
    summary: インターフェース定義「設定の移し替え」のレスポンス（`@dataclass(frozen=True, slots=True, kw_only=True)`）
    properties:
      - name: source_version
        type: str | None
        description: 設定ファイルの `version`。ファイルかキーが無いときは `None`
      - name: target_version
        type: str
        description: ツールのバージョン。移し替え後の `version`
      - name: steps
        type: tuple[str, ...]
        description: 手順の説明の並び
      - name: backup
        type: str | None
        description: バックアップのパス。書き換えなかったときは `None`
      - name: env
        type: dict[str, str]
        description: '`settings.json` の `env` へ移す環境変数の名前と値'
      - name: migrations
        type: tuple[str, ...]
        description: '`steps` のうち、`version` の更新を除いた移し替えの手順の説明。`version` だけが古いときは空'
classes:
  - name: SettingsNewerError
    title: 設定が新しい誤り
    container: features/migrate/types.py
    usecase: 端末をセットアップする
    role: 例外
    summary: 設定ファイルの `version` がツールのバージョンより新しいことを表す
    kind: クラス
    inherits: Exception
    properties:
      - name: settings_version
        type: str
        description: 設定ファイルの `version`
      - name: tool_version
        type: str
        description: 比べたツールのバージョン
