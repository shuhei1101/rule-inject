title: "プラグイン / 設定の移し替え / service.py"
test_files:
  - tests/unit/rule_inject/features/migrate/test_service.py
constants:
  - name: PACKAGE_NAME
    title: パッケージ名
    container: features/migrate/service.py
    summary: ツールのバージョンを検索するパッケージの名前
    value: '`"rule-inject"`'
  - name: MIGRATIONS
    title: 移し替えの手順の並び
    container: features/migrate/service.py
    summary: '`migrations/` のモジュールを、バージョンの古い順に並べたもの'
    entries:
      - key: '0'
        value: '`migrations.v0_2_3`'
functions:
  - name: plan_migration
    title: 手順の算出
    container: features/migrate/service.py
    usecase: 端末をセットアップする
    summary: 設定ファイルに適用する手順を求め、書き換えずに返却する
    kind: 関数
    scope: public
    args:
      - name: path
        type: Path
        required: true
        passing: positional
        description: 設定ファイルのパス
    returns:
      type: MigrationResult
      description: '`backup` が `None`、`env` が空の結果。ファイルが無ければ `steps` が空'
    process: |-
      1. ファイルが無ければ `source_version` が `None`、`steps` が空の結果を返却する
      2. `ruamel.yaml` で読み取り、最上位の `version` を取り出す（`_load`）
      3. `version` が `_tool_version` より新しければ `SettingsNewerError` を送出する
      4. `MIGRATIONS` の順に、`applies(data)` が真の手順の `DESCRIPTION` を並べる
      5. 4 の並びを `migrations` にし、`version` が `_tool_version` と違えば、`version` を更新する手順を末尾に加えた並びを `steps` にして返却する
    exceptions:
      - name: SettingsNewerError
        condition: '`version` が `_tool_version` より新しい'
        message: 設定のバージョンとツールのバージョンを持つ
      - name: SettingsReadError
        condition: ファイルが読み取れない・YAML として読み取れない
        message: path は設定ファイルの場所、reason は `describe(exc)`
    unit_tests:
      - name: test_plan_migration
        case: 正常
        summary: 古い設定の手順を示す
        condition: '`version` が無く `global.server_port: 9000` を持つファイル'
        mock: なし（一時ファイル）
        expected: '`steps` がポートの移し替えと `version` の更新の 2 件、`migrations` がポートの移し替えの 1 件、`source_version` が `None`、ファイルが変わっていない'
      - name: test_plan_migration_when_missing
        case: 正常
        summary: ファイルが無ければ手順は無い
        condition: 実在しないパス
        mock: なし
        expected: '`steps` が空'
      - name: test_plan_migration_when_current
        case: 正常
        summary: 今のバージョンで適用する手順が無ければ空
        condition: '`version` が `_tool_version` と同じで `global.server_port` が無いファイル'
        mock: なし（一時ファイル）
        expected: '`steps` が空'
      - name: test_plan_migration_when_old_version_only
        case: 正常
        summary: 手順が無くても古いバージョンなら更新する
        condition: '`version: 0.0.1` で `global.server_port` が無いファイル'
        mock: なし（一時ファイル）
        expected: '`steps` が `version` の更新の 1 件で、`migrations` が空'
      - name: test_plan_migration_when_newer
        case: 異常
        summary: 設定のほうが新しい
        condition: '`version: 99.0.0` のファイル'
        mock: なし（一時ファイル）
        expected: '`SettingsNewerError`（`settings_version` が `99.0.0`）'
        exception: '`version` が `_tool_version` より新しい'
      - name: test_plan_migration_when_unreadable
        case: 異常
        summary: YAML として読み取れない
        condition: YAML の文法の誤りを持つファイル
        mock: なし（一時ファイル）
        expected: '`SettingsReadError`（path が設定ファイルの場所）'
        exception: ファイルが読み取れない・YAML として読み取れない
  - name: apply_migration
    title: 手順の適用
    container: features/migrate/service.py
    usecase: 端末をセットアップする
    summary: バックアップを作成して手順を適用し、設定ファイルを書き換える
    kind: 関数
    scope: public
    side_effects: '`backup_dir` にバックアップを作成し、`path` を書き換える'
    args:
      - name: path
        type: Path
        required: true
        passing: positional
        description: 設定ファイルのパス
      - name: backup_dir
        type: Path
        required: true
        passing: positional
        description: バックアップを配置するフォルダ
      - name: now
        type: datetime
        required: true
        passing: keyword
        description: バックアップのファイル名の時刻
    returns:
      type: MigrationResult
      description: 適用した手順・バックアップのパス・`env` の値。手順が無ければ `plan_migration` の結果
    process: |-
      1. `plan_migration(path)` の `steps` が空なら、その結果を返却する
      2. `backup_dir` を作成し、元のファイルを `settings.{yyyymmddHHMMSS}.yaml` へコピーする
      3. `MIGRATIONS` の順に、`applies(data)` が真の手順の `apply(data)` を呼び、返却された環境変数を `env` へ重ねる
      4. 最上位の `version` を `_tool_version` にし、コメントを残して書き出す
    unit_tests:
      - name: test_apply_migration
        case: 正常
        summary: キーを移してコメントを残す
        condition: '`version` が無く `global.server_port: 9000` とコメントを持つファイル'
        mock: なし（一時ファイル）
        expected: '`global.server_port` が無く、`version` が `_tool_version` で、コメントが残り、`env` が `RULE_INJECT_PORT=9000`、`backup` のファイルが元の内容'
      - name: test_apply_migration_when_no_steps
        case: 正常
        summary: 手順が無ければ書き換えない
        condition: '`version` が `_tool_version` と同じファイル'
        mock: なし（一時ファイル）
        expected: '`backup` が `None`、ファイルが変わっていない'
  - name: _tool_version
    title: ツールのバージョン
    container: features/migrate/service.py
    usecase: 端末をセットアップする
    summary: 動いているツールのバージョンを返却する
    kind: 関数
    scope: internal
    returns:
      type: str
      description: '`{major}.{minor}.{patch}`'
    process: 1. `importlib.metadata.version(PACKAGE_NAME)` を返却する
notes:
  手順とバージョンの関係: |-
    設定ファイルの `version` は、規約『YAML』の `config-file-05` のとおり最後に移し替えたツールのバージョンにし、手順の適用は `version` と比べず、手順の `applies` が設定の中身から判定する。
    手順を出す release のバージョンを、手順を書く時点で決めなくてよい。
