title: "プラグイン / 索引 / service.py"
test_files:
  - tests/unit/rule_inject/features/index/test_service.py
constants:
  - name: REGEX_PREFIX
    title: 正規表現のプレフィックス
    container: features/index/service.py
    summary: パターンを正規表現として読む先頭の文字列
    value: '`re:`'
  - name: ARG_KEY_SEPARATOR
    title: 引数のキーの区切り
    container: features/index/service.py
    summary: 引数のキーをオブジェクトの子へたどる区切り
    value: '`.`'
  - name: URL_SCHEMES
    title: URL の頭
    container: features/index/service.py
    summary: Read で読めないため読み飛ばす `rule` の頭
    value: '`("http://", "https://")`'
  - name: REV_LENGTH
    title: エントリのバージョンの長さ
    container: features/index/service.py
    summary: SHA-256 の 16 進のうちバージョンに使う先頭の字数
    value: '`12`'
  - name: TREE_GROUP_KEYS
    title: 条件の木でたどる束のキー
    container: features/index/service.py
    summary: 条件の木で中へたどる束。`not` はたどらない
    value: '`("and", "or")`'
  - name: NEGATED_OPS
    title: 値にしない否定の op
    container: features/index/service.py
    summary: 条件の木の条件のうち、`values` を照合する値にしない `op`
    value: '`frozenset({"ne", "not_contains", "not_exists"})`'
functions:
  - name: load_indexes
    title: 索引の読み込み
    container: features/index/service.py
    usecase: 共通
    summary: 設定が決めた索引を順に読み、読めたエントリと読めなかった索引・読み飛ばしたエントリを返す
    kind: 関数
    scope: public
    args:
      - name: index_paths
        type: Sequence[str]
        required: true
        passing: positional
        description: 読む索引の絶対パスの並び（`Settings.indexes`）
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 環境変数（`rule` の変数参照の値を使う）
    returns:
      type: IndexLoadResult
      description: 読めたエントリと読めなかった索引
    process: |-
      1. `index_paths` を渡された順に `read_index(index_path, env)` で読む。`IndexReadError` は `failures` に集め、次の索引へ進む
      2. 状態が `effective` のエントリの `entry` を `entries` に、`skipped` のエントリを `IndexReadError`（path は索引の場所、reason は `reason`）として `failures` に追加する。`disabled` のエントリはどちらにも入れない（無効のエントリは照合に使わないため、展開できない変数参照・URL・読めない正規表現を持っていても理由を載せない）
    unit_tests:
      - name: test_load_indexes
        case: 正常
        summary: 渡された索引を順に読む
        condition: 絶対パスの索引を 3 つ渡す
        mock: なし
        expected: 3 索引のエントリが渡した順に読め、`rule` が索引のフォルダから解かれている。`failures` が空
      - name: test_load_indexes_when_on_missing
        case: 正常
        summary: '`on` を `default_on` と `DEFAULT_ON` で埋める'
        condition: '`default_on: [write]` の索引と `default_on` の無い索引。どちらも `on` を書かないエントリ'
        mock: なし
        expected: 前者の `on` が `{write}`、後者が `{read, write, mcp}`
      - name: test_load_indexes_when_unreadable
        case: 正常
        summary: 読めない索引を failures に集めて続ける
        condition: 実在しないパス、書式に合わないファイル、正しい索引の 3 つ
        mock: なし
        expected: '`failures` に 2 件（パスと理由）、`entries` に正しい索引のエントリ'
      - name: test_load_indexes_when_rule_has_variable
        case: 正常
        summary: '`rule` の変数参照を展開してから解く'
        condition: '`rule: "!{RULES}/a.md"` と `rule: "./!{SUB}/b.md"` の 2 エントリ。`env` に `RULES=/r` と `SUB=s`'
        mock: なし
        expected: '`location` が `/r/a.md` と `{索引のフォルダ}/s/b.md`。`failures` が空'
      - name: test_load_indexes_when_rule_variable_unset
        case: 正常
        summary: 展開できないエントリだけを読み飛ばす
        condition: '`rule: "!{UNSET}/a.md"` と通常の `rule` の 2 エントリ。`UNSET` は `env` に無い'
        mock: なし
        expected: '`entries` に通常のエントリだけ。`failures` に 1 件（path が索引、reason に `!{UNSET}/a.md` と `UNSET`）'
      - name: test_load_indexes_when_regex_unreadable
        case: 正常
        summary: 読めない正規表現を持つエントリだけを読み飛ばす
        condition: '`paths: ["re:["]` のエントリと、`paths: ["re:\\.py$"]`・`args` に `kind: ["rule"]` を持つ通常のエントリの 2 つ'
        mock: なし
        expected: '`entries` に通常のエントリだけ（`paths` の `regex` がコンパイル済み、`args` が `ArgCondition` 1 件）。`failures` に 1 件（path が索引、reason に `re:[`）'
      - name: test_load_indexes_when_read_by
        case: 正常
        summary: '`read_by` を `ReadByCondition` にして読む'
        condition: '`read_by` に `tools: ["re:__get_doc$"]`・`args` に `path: ["*.md"]` の要素を 1 つ持つエントリと、`read_by` の無いエントリ'
        mock: なし
        expected: 前者の `read_by` が 1 件（`tools` の `regex` がコンパイル済み、`args` が `ArgCondition` 1 件）、後者の `read_by` が空。`failures` が空
      - name: test_load_indexes_when_rule_is_url
        case: 正常
        summary: '`rule` が URL のエントリだけを読み飛ばす'
        condition: '`rule: https://example.com/a.md`・`rule: "!{BASE}/b.md"`（`env` に `BASE=http://example.com`）・通常の `rule` の 3 エントリ'
        mock: なし
        expected: '`entries` に通常のエントリだけ。`failures` に 2 件（path が索引、reason に `https://example.com/a.md` と `http://example.com/b.md`）'
      - name: test_load_indexes_when_empty
        case: 正常
        summary: 索引が無ければ何も読まない
        condition: '`index_paths` に `[]`'
        mock: なし
        expected: '`entries` も `failures` も空'
      - name: test_load_indexes_when_entry_disabled
        case: 正常
        summary: '`enabled: false` のエントリを外す'
        condition: '`enabled: false` の通常のエントリ、`enabled: false` で `rule: "!{UNSET}/a.md"`（`UNSET` は `env` に無い）のエントリ、`enabled: true` のエントリ、`enabled` を書かないエントリの 4 つ'
        mock: なし
        expected: '`entries` に後ろの 2 エントリだけ。`failures` が空'
  - name: match_path
    title: パスの照合
    container: features/index/service.py
    usecase: 共通
    summary: 対象のパスに当たるエントリをルールごとに 1 件へまとめる
    kind: 関数
    scope: public
    args:
      - name: entries
        type: Sequence[IndexEntry]
        required: true
        passing: positional
        description: 索引のエントリ
      - name: path
        type: str
        required: true
        passing: positional
        description: 対象の絶対パス
      - name: operation
        type: Operation
        required: true
        passing: positional
        description: 操作の種別
    returns:
      type: list[MatchedRule]
      description: 当たったルール（索引の順）
    process: |-
      1. `entry_matches_path` が True のエントリを選ぶ（glob は `_glob_match`、正規表現は部分一致。`_match_pattern`）
      2. 同じ `location` を 1 件にまとめ、`operation` がどれかの `on` に入っていれば `blocking` を True にする
    unit_tests:
      - name: test_match_path
        case: 正常
        summary: 当たるエントリを選ぶ
        condition: '`**/*.py` と `**/*.ts` の 2 エントリ、`/p/src/a.py`、`write`'
        mock: なし
        expected: '`.py` のルール 1 件、`blocking` が True'
      - name: test_match_path_when_excluded
        case: 正常
        summary: 外すパスには当てない
        condition: '`exclude: ["**/tests/**"]`、`/p/tests/a.py`'
        mock: なし
        expected: 空
      - name: test_match_path_when_duplicate
        case: 正常
        summary: 同じルールのエントリを 1 件にまとめる
        condition: '同じ `location` で `on: [read]` と `on: [write]` の 2 エントリ、`write`'
        mock: なし
        expected: 1 件、`blocking` が True
      - name: test_match_path_when_not_blocking
        case: 正常
        summary: 操作が `on` に無ければ止めない
        condition: '`on: [write]` のエントリ、`read`'
        mock: なし
        expected: 1 件、`blocking` が False
      - name: test_match_path_when_regex
        case: 正常
        summary: '`re:` のパターンに部分一致で当て、正規表現の `exclude` で外す'
        condition: '`paths: ["re:/src/[a-z_]+\\.py$"]`・`exclude: ["re:/src/_"]`、`/p/src/app.py` と `/p/src/_gen.py`'
        mock: なし
        expected: 前者は 1 件、後者は空
  - name: match_tool
    title: ツール名の照合
    container: features/index/service.py
    usecase: 共通
    summary: MCP のツール名に当たるエントリをルールごとに 1 件へまとめる
    kind: 関数
    scope: public
    args:
      - name: entries
        type: Sequence[IndexEntry]
        required: true
        passing: positional
        description: 索引のエントリ
      - name: tool_name
        type: str
        required: true
        passing: positional
        description: MCP のツールの完全名
      - name: tool_input
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: MCP のツールの引数（JSON 由来の値のため Any）
    returns:
      type: list[MatchedRule]
      description: 当たったルール。操作の種別は `mcp` として `blocking` を決める
    process: |-
      1. `tools` のどれかに当たるエントリを選ぶ（glob は `fnmatch.fnmatchcase`、正規表現は部分一致。`_match_pattern`）
      2. `args` を持つエントリは、`_match_args(entry.args, tool_input)` が True のときだけ残す
      3. `match_path` と同じ規則でルールごとにまとめる
    unit_tests:
      - name: test_match_tool
        case: 正常
        summary: ツール名の glob に当てる
        condition: '`tools: ["mcp__*__create_*"]`、`mcp__github__create_issue`'
        mock: なし
        expected: 1 件、`blocking` が True（`on` に `mcp` を含む）
      - name: test_match_tool_when_not_matched
        case: 正常
        summary: 当たらない
        condition: '`mcp__github__list_issues`'
        mock: なし
        expected: 空
      - name: test_match_tool_when_args_match
        case: 正常
        summary: 引数の条件が全て当たれば当てる
        condition: '`tools: ["mcp__*__search_*"]`・`args` に `tags: ["re:^python$"]` と `filter.kind: ["rule"]`、`tool_input` は `{"tags": ["go", "python"], "filter": {"kind": "rule"}}`'
        mock: なし
        expected: 1 件
      - name: test_match_tool_when_args_partly_unmatched
        case: 正常
        summary: 引数の条件が 1 つでも当たらなければ当てない
        condition: '同じエントリ、`tool_input` は `{"tags": ["python"]}`（`filter.kind` が無い）'
        mock: なし
        expected: 空
      - name: test_match_tool_when_regex_tool
        case: 正常
        summary: ツール名の正規表現に部分一致で当てる
        condition: '`tools: ["re:__create_"]`、`mcp__github__create_issue`'
        mock: なし
        expected: 1 件
  - name: rule_locations
    title: ルールの場所の一覧
    container: features/index/service.py
    usecase: 共通
    summary: 索引に載ったルールの場所の集合を返す（既読の記録の判定に使う）
    kind: 関数
    scope: public
    args:
      - name: entries
        type: Sequence[IndexEntry]
        required: true
        passing: positional
        description: 索引のエントリ
    returns:
      type: frozenset[str]
      description: 解決後のルールの場所
    unit_tests:
      - name: test_rule_locations
        case: 正常
        summary: 重なりを落とした集合を返す
        condition: 同じ `location` を持つ 2 エントリと別の 1 エントリ
        mock: なし
        expected: 2 件の集合
  - name: _glob_match
    title: glob の照合
    container: features/index/service.py
    usecase: 共通
    summary: '`**` をフォルダをまたぐ一致として扱い、絶対パスに glob を当てる'
    kind: 関数
    scope: internal
    args:
      - name: pattern
        type: str
        required: true
        passing: positional
        description: glob
      - name: path
        type: str
        required: true
        passing: positional
        description: 絶対パス
    returns:
      type: bool
      description: 当たるか
    process: |-
      1. glob を正規表現へ読み替える（`**/` → 0 個以上のフォルダ、`*` → `/` を含まない文字列、`?` → `/` 以外の 1 字、`{a,b}` → 選択）
      2. パス全体に当てる
    reason: フックの Python の最低のバージョン（3.12）には `PurePath.full_match` が無く、`fnmatch` は `*` が `/` もまたぐため
    unit_tests:
      - name: test_glob_match_when_double_star
        case: 正常
        summary: '`**` がフォルダをまたぐ'
        condition: '`**/*.py` と `/a/b/c.py`、`/c.py`'
        mock: なし
        expected: どちらも True
      - name: test_glob_match_when_single_star
        case: 正常
        summary: '`*` はフォルダをまたがない'
        condition: '`*/x/*.md` と `/a/x/b/c.md`'
        mock: なし
        expected: 'False'
      - name: test_glob_match_when_braces
        case: 正常
        summary: 波括弧の候補を選ぶ
        condition: '`**/*.{ts,tsx}` と `/a/b.tsx`、`/a/b.js`'
        mock: なし
        expected: True と False
  - name: _compile_pattern
    title: パターンの読み取り
    container: features/index/service.py
    usecase: 共通
    summary: 索引に書かれたパターンを `MatchPattern` にする
    kind: 関数
    scope: internal
    args:
      - name: source
        type: str
        required: true
        passing: positional
        description: 索引に書かれたパターン
    returns:
      type: MatchPattern
      description: '`REGEX_PREFIX` で始まれば残りを `re.compile` したもの、それ以外は `regex` が None のもの'
    exceptions:
      - name: re.error
        condition: '`re:` の後ろが正規表現として読めない'
        message: '`re` の理由のまま'
    unit_tests:
      - name: test_compile_pattern_when_regex
        case: 正常
        summary: '`re:` で始まるパターンをコンパイルする'
        condition: '`re:^a.+b$`'
        mock: なし
        expected: '`source` が `re:^a.+b$`、`regex.pattern` が `^a.+b$`'
      - name: test_compile_pattern_when_glob
        case: 正常
        summary: '`re:` で始まらないパターンは glob のまま'
        condition: '`**/*.py`'
        mock: なし
        expected: '`regex` が None'
      - name: test_compile_pattern_when_invalid_regex
        case: 異常
        summary: 読めない正規表現を拒む
        condition: '`re:[`'
        mock: なし
        expected: re.error
        exception: '`re:` の後ろが正規表現として読めない'
  - name: _match_pattern
    title: パターンの照合
    container: features/index/service.py
    usecase: 共通
    summary: 値に `MatchPattern` を当てる。正規表現は部分一致、glob は渡した glob の照合で当てる
    kind: 関数
    scope: internal
    args:
      - name: pattern
        type: MatchPattern
        required: true
        passing: positional
        description: パターン
      - name: value
        type: str
        required: true
        passing: positional
        description: 照合する値（絶対パス・ツール名・引数の値）
      - name: glob_match
        type: Callable[[str, str], bool]
        required: true
        passing: keyword
        description: glob のときの照合（パスは `_glob_match`、ツール名と引数の値は `fnmatch.fnmatchcase` を引数の順をそろえて渡す）
    returns:
      type: bool
      description: 当たるか
    unit_tests:
      - name: test_match_pattern_when_regex_partial
        case: 正常
        summary: 正規表現は部分一致で当たる
        condition: '`re:src/` と `/p/src/a.py`'
        mock: なし
        expected: 'True'
      - name: test_match_pattern_when_regex_anchored
        case: 正常
        summary: アンカーで全体一致にできる
        condition: '`re:^python$` と `python3`'
        mock: なし
        expected: 'False'
  - name: _argument_values
    title: 引数の値の取り出し
    container: features/index/service.py
    usecase: 共通
    summary: ドット区切りの道筋が指す引数の値を、`field` があればその値を条件の木として読んだ値を、照合する文字列の並びにする
    kind: 関数
    scope: internal
    args:
      - name: tool_input
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: MCP のツールの引数
      - name: path
        type: str
        required: true
        passing: positional
        description: ドットで結んだ引数の道筋（`ArgCondition.path`）
      - name: field
        type: str | None
        required: false
        default: None
        passing: positional
        description: 道筋の値を条件の木として読むときの `field`（`ArgCondition.field`）。`None` なら道筋の値をそのまま使う
    returns:
      type: list[str]
      description: 照合する値。キーが無ければ空
    process: |-
      1. 道筋をドットで分け、先頭から順にたどる。たどる途中の値が配列なら要素ごとにたどり、オブジェクトでない値や無いキーは捨てる
      2. `field` があれば、たどり着いた値（配列なら要素ごと）を `_tree_values(値, field)` で条件の木の値に置き換える
      3. 値が配列なら要素ごとに取り出す
      4. 文字列はそのまま、文字列以外のスカラー（数・真偽・`null`）は `json.dumps` の表記にし、オブジェクトと配列の中の配列は捨てる
    unit_tests:
      - name: test_argument_values_when_nested_array
        case: 正常
        summary: 途中の配列を要素ごとにたどる
        condition: '`{"filters": [{"tag": "a"}, {"tag": "b"}, {"x": 1}]}` と `filters.tag`'
        mock: なし
        expected: '`["a", "b"]`'
      - name: test_argument_values_when_scalars
        case: 正常
        summary: 文字列以外のスカラーを JSON の表記にする
        condition: '`{"v": [true, null, 1.5, "s", {"k": 1}]}` と `v`'
        mock: なし
        expected: '`["true", "null", "1.5", "s"]`（オブジェクトは捨てる）'
      - name: test_argument_values_when_missing
        case: 正常
        summary: 無いキーは空
        condition: '`{"a": "x"}` と `a.b`'
        mock: なし
        expected: 空
      - name: test_argument_values_when_tree
        case: 正常
        summary: 道筋の値を条件の木として読む
        condition: '`{"filter": {"or": [{"field": "tags", "op": "in", "values": ["a", 1]}, {"field": "kind", "op": "eq", "values": ["rule"]}]}}` と `filter`・`tags`'
        mock: なし
        expected: '`["a", "1"]`'
      - name: test_argument_values_when_tree_in_array
        case: 正常
        summary: 道筋の値が配列のときは要素ごとに条件の木として読む
        condition: '`{"filters": [{"field": "tags", "op": "in", "values": ["a"]}, {"field": "tags", "op": "in", "values": ["b"]}]}` と `filters`・`tags`'
        mock: なし
        expected: '`["a", "b"]`'
  - name: match_read_by
    title: 既読にする呼び出しの照合
    container: features/index/service.py
    usecase: ルールを読んだことが記録される
    summary: MCP のツールの呼び出しが `read_by` に当たるエントリのルールの場所を返す
    kind: 関数
    scope: public
    args:
      - name: entries
        type: Sequence[IndexEntry]
        required: true
        passing: positional
        description: 索引のエントリ
      - name: tool_name
        type: str
        required: true
        passing: positional
        description: MCP のツールの完全名
      - name: tool_input
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: MCP のツールの引数（JSON 由来の値のため Any）
    returns:
      type: list[str]
      description: 当たったルールの場所（索引の順。重なりを落とす）
    process: |-
      1. エントリごとに `read_by` の要素を見て、`tools` のどれかにツール名が当たり（glob は `fnmatch.fnmatchcase`、正規表現は部分一致。`_match_pattern`）、`_match_args(condition.args, tool_input)` が True の要素が 1 つでもあれば、そのエントリの `location` を取る
      2. エントリの `tools`・`args`（案内の当て方）は見ない
      3. 同じ `location` を 1 件にまとめる（並びは保つ）
    unit_tests:
      - name: test_match_read_by
        case: 正常
        summary: '`read_by` のツール名と引数に当てる'
        condition: '`read_by` に `tools: ["mcp__docs__get_doc"]`・`args` に `path: ["re:\\.md$"]` のエントリ、`mcp__docs__get_doc` と `{"path": "a.md"}`'
        mock: なし
        expected: そのエントリの場所 1 件
      - name: test_match_read_by_when_args_unmatched
        case: 正常
        summary: 引数が当たらなければ当てない
        condition: '同じエントリ、`{"path": "a.txt"}`'
        mock: なし
        expected: 空
      - name: test_match_read_by_when_any_condition
        case: 正常
        summary: 要素のどれか 1 つに当たれば当てる
        condition: '`read_by` に `tools: ["mcp__a__x"]` の要素と `tools: ["mcp__b__*"]` の要素を持つエントリ、`mcp__b__get` と `{}`'
        mock: なし
        expected: そのエントリの場所 1 件
      - name: test_match_read_by_when_guide_only
        case: 正常
        summary: 案内の `tools` に当たるだけでは当てない
        condition: '`tools: ["mcp__*"]` を持ち `read_by` の無いエントリ、`mcp__docs__get_doc` と `{}`'
        mock: なし
        expected: 空
      - name: test_match_read_by_when_duplicate
        case: 正常
        summary: 同じルールのエントリを 1 件にまとめる
        condition: 同じ `location` でどちらも `read_by` に当たる 2 エントリ
        mock: なし
        expected: 場所 1 件
  - name: _match_args
    title: 引数の条件の照合
    container: features/index/service.py
    usecase: 共通
    summary: 引数の条件が全て当たるかを返す（`match_tool` と `match_read_by` が共有する）
    kind: 関数
    scope: internal
    args:
      - name: conditions
        type: Sequence[ArgCondition]
        required: true
        passing: positional
        description: 引数の条件
      - name: tool_input
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: MCP のツールの引数
    returns:
      type: bool
      description: 全ての条件が当たれば True（条件が空なら True）
    process: 1. 全ての `ArgCondition` について、`_argument_values(tool_input, path, field)` の値のどれかに `patterns` のどれかが `match_arg_pattern` で当たるかを確かめる。値が 1 つも無ければ当てない
    unit_tests:
      - name: test_match_args_when_empty
        case: 正常
        summary: 条件が空なら当たる
        condition: '`conditions` が空、`tool_input` が `{}`'
        mock: なし
        expected: 'True'
      - name: test_match_args_when_tree_negated_only
        case: 正常
        summary: 条件の木の否定の中にだけある値には当てない
        condition: '`filter`・`tags` で `python` を当てる条件と、`{"filter": {"not": {"field": "tags", "op": "in", "values": ["python"]}}}`'
        mock: なし
        expected: 'False'
      - name: test_match_args_when_tree
        case: 正常
        summary: 入れ子の and・or の中の条件の値に当たる
        condition: '`filter`・`tags` で `python` を当てる条件と、`{"filter": {"and": [{"field": "kind", "op": "eq", "values": ["rule"]}, {"or": [{"field": "tags", "op": "in", "values": ["python"]}]}]}}`'
        mock: なし
        expected: 'True'
  - name: read_index
    title: 索引 1 つの読み取り
    container: features/index/service.py
    usecase: 効いているルールの一覧を見る
    summary: 索引 1 つを読み、エントリごとに位置・バージョン・照合に使うかを返す
    kind: 関数
    scope: public
    args:
      - name: index_path
        type: str
        required: true
        passing: positional
        description: 索引の絶対パス
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 環境変数（`rule` の変数参照の値を使う）
    returns:
      type: IndexContent
      description: エントリごとの読み取り結果
    process: |-
      1. UTF-8 で読み `read_index_text` に渡す。OSError は `IndexReadError`（path は索引の場所、reason は `describe(exc)`）を送出する

      `read_index_text` の処理:

      1. `parse_index` に渡す。ValueError は `IndexReadError`（path は索引の場所、reason は `describe(exc)`）を送出する
      2. エントリごとに `entry_rev(raw)` を求める
      3. `enabled` が `false` のエントリは、展開・解決・コンパイルをせずに `disabled` にする
      4. `rule` を `expand_variables(rule, env)` で展開する。未設定の名前が残ったエントリは `skipped`（reason は `rule {書かれた rule} の変数参照を展開できない: {名前を「、」で並べたもの}`）
      5. 展開した `rule` が `URL_SCHEMES` のどれかで始まるエントリは `skipped`（reason は `rule {展開した rule} は URL のため Read で読めない`）
      6. `paths`・`exclude`・`tools`・`args`・`read_by` の `tools`・`args` の各パターンを `_compile_pattern` で `MatchPattern` にする。コンパイルできないパターンを持つエントリは `skipped`（reason は `パターン {書かれたパターン} の正規表現を読めない: {re.error の理由}`）
      7. 残りは、展開した `rule` を索引ファイルのフォルダから解き、`on` が無ければ索引の `default_on`（無ければ `DEFAULT_ON`）で埋めた `IndexEntry` を持つ `effective` にする
    exceptions:
      - name: IndexReadError
        condition: 索引が無い・読めない・`parse_index` が ValueError を送出する
        message: path は索引の場所、reason は `describe(exc)`
    unit_tests:
      - name: test_read_index
        case: 正常
        summary: エントリごとの位置・バージョン・状態を返す
        condition: '通常のエントリ、`enabled: false` のエントリ、`rule: https://example.com/a.md` のエントリの 3 つ'
        mock: なし
        expected: '`outcomes` が位置 0・1・2 の順で、状態が `effective`（`entry` あり）・`disabled`・`skipped`（`reason` に URL）。`rev` が各エントリの `entry_rev(raw)`'
      - name: test_read_index_when_unreadable
        case: 異常
        summary: 読めない索引を拒む
        condition: 実在しないパスと、書式に合わないファイル（パラメータ展開）
        mock: なし
        expected: IndexReadError（path が索引の場所）
        exception: 索引が無い・読めない・`parse_index` が ValueError を送出する
  - name: entry_rev
    title: エントリのバージョン
    container: features/index/service.py
    usecase: 索引のエントリを編集する
    summary: エントリのキーと値から、書式によらないバージョンを求める
    kind: 関数
    scope: public
    args:
      - name: raw
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: '`parse_index` が返したエントリ'
    returns:
      type: str
      description: SHA-256 の 16 進の先頭 `REV_LENGTH` 字
    process: 1. キーの順に並べた JSON（`sort_keys=True`・`ensure_ascii=False`・区切りは `,` と `:`）を UTF-8 にして SHA-256 を求める
    unit_tests:
      - name: test_entry_rev_when_format_differs
        case: 正常
        summary: 書式だけの違いでは変わらない
        condition: 同じ値を、単一引用符とキーの順・二重引用符と逆のキーの順で書いた 2 つの内容を `parse_index` で読んだエントリ
        mock: なし
        expected: 同じ 12 字
      - name: test_entry_rev_when_value_differs
        case: 正常
        summary: 値が違えば変わる
        condition: '`paths` だけが違う 2 つのエントリ'
        mock: なし
        expected: 違う値
  - name: read_index_text
    title: 索引の内容の読み取り
    container: features/index/service.py
    usecase: 索引をチェックする
    summary: ファイルに書く前の索引の内容を、`read_index` と同じ規則で読む
    kind: 関数
    scope: public
    args:
      - name: index_path
        type: str
        required: true
        passing: positional
        description: 索引の絶対パス（`rule` を解くフォルダと、理由に載せる場所に使う）
      - name: text
        type: str
        required: true
        passing: positional
        description: 索引の内容
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 環境変数
    returns:
      type: IndexContent
      description: エントリごとの読み取り結果
    process: '`read_index` の `read_index_text` の処理'
    exceptions:
      - name: IndexReadError
        condition: '`parse_index` が ValueError を送出する'
        message: path は索引の場所、reason は `describe(exc)`（行の番号を含む）
    unit_tests:
      - name: test_read_index_text_when_unparsable
        case: 異常
        summary: フックが読めない内容を拒む
        condition: '`rules:` の下に字下げの崩れた行を持つ内容'
        mock: なし
        expected: IndexReadError（reason に行の番号）
        exception: '`parse_index` が ValueError を送出する'
      - name: test_read_index_text_when_tree_key
        case: 正常
        summary: 引数のキーを道筋と条件の木の field に分ける
        condition: '`args` に `filter[tags]`・`filter.kind`・`a[b]c` のキーを持つエントリと、`read_by[0].args` に `filter[tags]` を持つエントリ'
        mock: なし
        expected: '`ArgCondition` の `key`・`path`・`field` が、`filter[tags]`・`filter`・`tags`、`filter.kind`・`filter.kind`・`None`、`a[b]c`・`a[b]c`・`None`。`read_by` の条件も同じく分ける'
  - name: entry_revs
    title: 内容のエントリのバージョン
    container: features/index/service.py
    usecase: 索引のエントリを編集する
    summary: 索引の内容から、エントリごとのバージョンを位置の順に返す。編集の前後のバージョンを一覧・チェックと同じ求め方でそろえる
    kind: 関数
    scope: public
    args:
      - name: text
        type: str
        required: true
        passing: positional
        description: 索引の内容
    returns:
      type: tuple[str, ...]
      description: 位置の順の `entry_rev`
    process: '`parse_index(text)` のエントリごとに `entry_rev` を求める。`parse_index` の ValueError はそのまま送出する'
    exceptions:
      - name: ValueError
        condition: '`parse_index` が ValueError を送出する'
        message: '`parse_index` のまま（行の番号を含む）'
    unit_tests:
      - name: test_entry_revs
        case: 正常
        summary: 一覧と同じバージョンを返す
        condition: 二重引用符のエスケープ（`"a\tb.md"`）・`[010, 0x1F]`・`[~]` を持つエントリを含む 3 件の内容
        mock: なし
        expected: '`read_index_text` の各エントリの `rev` と位置ごとに同じ'
      - name: test_entry_revs_when_unparsable
        case: 異常
        summary: フックが読めない内容を拒む
        condition: '`rules:` の下に字下げの崩れた行を持つ内容'
        mock: なし
        expected: ValueError（行の番号を含む）
        exception: '`parse_index` が ValueError を送出する'
  - name: entry_matches_path
    title: エントリ 1 件のパスの照合
    container: features/index/service.py
    usecase: 共通
    summary: エントリ 1 件が対象のパスに当たるかを返す
    kind: 関数
    scope: public
    args:
      - name: entry
        type: IndexEntry
        required: true
        passing: positional
        description: 索引のエントリ
      - name: path
        type: str
        required: true
        passing: positional
        description: 対象の絶対パス
    returns:
      type: bool
      description: '`paths` のどれかに当たり、`exclude` のどれにも当たらなければ True'
    process: 1. `paths` のどれかに当たり、`exclude` のどれにも当たらないかを `_match_pattern` で確かめる（`match_path` の選び方と同じ）
    unit_tests:
      - name: test_entry_matches_path
        case: 正常
        summary: 当たるパスと外すパスを見分ける
        condition: '`paths: ["**/*.py"]`・`exclude: ["**/tests/**"]` のエントリ、`/p/src/a.py` と `/p/tests/a.py`'
        mock: なし
        expected: 前者は True、後者は False
  - name: match_arg_pattern
    title: 引数の値へのパターンの照合
    container: features/index/service.py
    usecase: 共通
    summary: 引数の値 1 つに `MatchPattern` を当てる（`_match_args` と、索引のチェックの使われていないタグのパターンの確かめが共有する）
    kind: 関数
    scope: public
    args:
      - name: pattern
        type: MatchPattern
        required: true
        passing: positional
        description: パターン
      - name: value
        type: str
        required: true
        passing: positional
        description: 引数の値
    returns:
      type: bool
      description: 当たるか
    process: 1. `_match_pattern(pattern, value, glob_match=_fnmatch_glob)` を返す（正規表現は部分一致、glob は `fnmatch.fnmatchcase`）
    unit_tests:
      - name: test_match_arg_pattern
        case: 正常
        summary: glob は全体、正規表現は部分に当てる
        condition: '`m*` と `mcp`、`m*` と `xm`、`re:yth` と `python`（パラメータ展開）'
        mock: なし
        expected: True・False・True
  - name: _tree_values
    title: 条件の木の値の取り出し
    container: features/index/service.py
    usecase: 共通
    summary: 条件の木を `and`・`or` の入れ子までたどり、`field` が一致する条件の `values` を返す
    kind: 関数
    scope: internal
    args:
      - name: node
        type: Any
        required: true
        passing: positional
        description: 条件の木の節（条件か束）
      - name: field
        type: str
        required: true
        passing: positional
        description: 取り出す条件の `field`
    returns:
      type: list[Any]
      description: 当たった条件の `values` を木の並びの順につないだもの（文字列にするのは呼び出し元）。木として読めなければ空
    process: |-
      1. `node` がオブジェクトでなければ空を返す
      2. `TREE_GROUP_KEYS` のキーを持ちその値が配列なら、要素ごとに `_tree_values` を呼んでつなぐ。`not` の中はたどらない
      3. `field` キーの値が引数の `field` と一致し、`op` が `NEGATED_OPS` に入らず、`values` キーを持つなら、`values` を返す値に加える（配列は要素を、それ以外はその値を 1 つ）
      4. `field` も束のキーも持たない節からは何も取らない
    unit_tests:
      - name: test_tree_values_when_nested
        case: 正常
        summary: 入れ子の and・or の中の条件も取り出す
        condition: '`{"and": [{"field": "tags", "op": "in", "values": ["a"]}, {"or": [{"field": "tags", "op": "eq", "values": ["b"]}, {"field": "kind", "op": "eq", "values": ["rule"]}]}]}` と `tags`'
        mock: なし
        expected: '`["a", "b"]`'
      - name: test_tree_values_when_negated
        case: 正常
        summary: not の中と否定の op の条件は取らない
        condition: '`{"and": [{"not": {"field": "tags", "op": "in", "values": ["a"]}}, {"field": "tags", "op": "ne", "values": ["b"]}, {"field": "tags", "op": "not_contains", "values": ["c"]}, {"field": "tags", "op": "not_exists", "values": ["d"]}, {"field": "tags", "op": "in", "values": ["e"]}]}` と `tags`'
        mock: なし
        expected: '`["e"]`'
      - name: test_tree_values_when_not_tree
        case: 正常
        summary: 条件の木として読めない値からは取らない
        condition: '`"tags"`・`{"tags": ["a"]}`・`{"and": "x"}` と `tags`（パラメータ展開）'
        mock: なし
        expected: 空
