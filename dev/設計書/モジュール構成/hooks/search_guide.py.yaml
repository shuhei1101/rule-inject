title: "プラグイン / フック / search_guide.py"
test_files:
  - tests/unit/rule_inject/hooks/test_search_guide.py
functions:
  - name: search_guide
    title: 検索結果の案内の処理
    container: hooks/search_guide.py
    usecase: 検索の結果に出たファイルのルールの案内を受ける
    summary: 検索の結果に出た実在するファイルに当たる未読・未案内のルールを案内する PostToolUse の出力を作る
    kind: フック
    scope: public
    inherits: HookHandler
    side_effects: 案内に載せた場所を案内済みの記録へ追記する
    args:
      - name: payload
        type: dict[str, Any]
        required: true
        passing: positional
        description: PostToolUse の入力
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 環境変数
    returns:
      type: dict[str, Any] | None
      description: additionalContext（案内と知らせ）か、無ければ None
    process: |-
      1. session_id の形式が外れていれば None
      2. 結果の行と基準を決める。Grep・Glob は `tool_response.filenames` と `tool_response.content` の各行、基準は `cwd`。Bash は `search_output_base(command, cwd)` が None なら None、あれば `tool_response.stdout` の各行とその基準
      3. `extract_result_paths(lines, base)` で照合するパスを拾う。無ければ None
      4. `load_settings(env)` で設定を読む。SettingsReadError なら `log_settings_failure` でログ（`read_settings`）へ書き、`build_failure_notice(SETTINGS_FAILURE_SUMMARY, [error], ログの場所)` を additionalContext にして返す（照合しない）。以降の記録フォルダは `settings.state_dir`、ログのフォルダは `settings.log_dir`
      5. `load_indexes(settings.indexes, env)` で索引を読む。読めない索引と読み飛ばしたエントリはログ（`read_index`）と知らせの文に回す
      6. パスごとに `match_path(entries, path, "read")` で当て、ルールの場所ごとに 1 件へまとめる（出た順）
      7. `read_record` の既読の行で `current_read_locations` が返す場所と、`read_guided` の案内済みを除く。読めない記録は空として扱い、ログ（`read_record`）と知らせの文に回す
      8. 残った場所があれば `build_search_guidance(locations, unchecked=...)` で案内にし、`shown` を `append_guided` で案内済みにする。書けなければログ（`write_record`）と知らせの文に回す
      9. 案内と知らせを `hookSpecificOutput.additionalContext`（`hookEventName: PostToolUse`）にする。どちらも無ければ None
    unit_tests:
      - name: test_search_guide
        case: 正常
        summary: Grep の結果に当たるルールを案内する
        condition: '`**/*.py` のエントリ、`tool_response.filenames` に実在する `.py`'
        mock: なし（索引と記録フォルダは一時ファイル）
        expected: additionalContext が `SEARCH_HEADER` で始まり場所が載る。案内済みの記録に 1 行
      - name: test_search_guide_when_not_search
        case: 正常
        summary: 検索でない Bash は見ない
        condition: '`git merge main`、`stdout` に実在する `.py`'
        mock: なし
        expected: None
      - name: test_search_guide_when_read_or_guided
        case: 正常
        summary: 既読と案内済みを除く
        condition: 2 つのルールのうち 1 つが既読（記録に場所と今のハッシュの行）、1 つが案内済み
        mock: なし
        expected: None
      - name: test_search_guide_when_invalid_session_id
        case: 正常
        summary: session_id の形式が外れていれば案内しない
        condition: '`session_id` が `../x`'
        mock: なし
        expected: None
      - name: test_search_guide_when_guided_unwritable
        case: 正常
        summary: 案内済みに書けなくても案内を出す
        condition: 書き込み権限の無い記録フォルダ
        mock: なし
        expected: additionalContext に場所と記録ファイルの理由、ログに `write_record`
      - name: test_search_guide_when_rule_changed
        case: 正常
        summary: 読んだ後に変わったルールを案内する
        condition: '`**/*.py` のエントリ、`tool_response.filenames` に実在する `.py`。記録に場所と書き換える前のハッシュの行があり、ルールの中身を書き換える'
        mock: なし（索引と記録フォルダは一時ファイル）
        expected: additionalContext に場所が載る
      - name: test_search_guide_when_settings_unreadable
        case: 正常
        summary: 設定ファイルが読めないときは照合せずに知らせる
        condition: '`RULE_INJECT_CONFIG` が YAML として読めないファイルを指す。`XDG_STATE_HOME` は一時フォルダ。`tool_response.filenames` に実在する `.py`'
        mock: なし
        expected: 案内済みの記録が無い。additionalContext に `SETTINGS_FAILURE_SUMMARY`・設定ファイルの場所と理由。ログに `read_settings` が 1 行
