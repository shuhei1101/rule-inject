title: "プラグイン / フック / discard_read.py"
test_files:
  - tests/unit/rule_inject/hooks/test_discard_read.py
functions:
  - name: discard_read
    title: 既読の記録の破棄の処理
    container: hooks/discard_read.py
    usecase: 圧縮で既読の記録が捨てられる
    summary: そのセッションの既読の記録ファイルと案内済みの記録ファイルを削除する
    kind: フック
    scope: public
    inherits: HookHandler
    args:
      - name: payload
        type: dict[str, Any]
        required: true
        passing: positional
        description: PreCompact の入力
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 環境変数
    returns:
      type: None
      description: 常に出力しない
    process: |-
      1. session_id の形式が外れていれば何もしない
      2. `load_settings(env)` で設定を読む。SettingsReadError なら `log_settings_failure` でログ（`read_settings`）へ書いて終える（何も削除しない）
      3. `delete_record` と `delete_guided` を `settings.state_dir` で順に呼ぶ。片方が RecordDeleteError でももう片方を呼び、それぞれ `settings.log_dir` のログ（`delete_record`）へ書く
    unit_tests:
      - name: test_discard_read
        case: 正常
        summary: 記録を削除する
        condition: 記録ファイルがある
        mock: なし
        expected: 記録ファイルが無い
      - name: test_discard_read_when_undeletable
        case: 正常
        summary: 削除できないときログに書く
        condition: 書き込み権限の無い記録フォルダと、書き込み権限の無い空のログのフォルダ（設定ファイルの `global.log_dir`）
        mock: なし
        expected: 標準エラー出力に `delete_record`
      - name: test_discard_read_when_guided
        case: 正常
        summary: 案内済みの記録も削除する
        condition: そのセッションの `{id}.txt` と `{id}.guided.txt`
        mock: なし
        expected: どちらも無い
      - name: test_discard_read_when_settings_unreadable
        case: 正常
        summary: 設定ファイルが読めないときはログに書くだけで何も削除しない
        condition: '`RULE_INJECT_CONFIG` が知らないキーを持つ設定ファイルを指す。`XDG_STATE_HOME` は一時フォルダで、その下の `rule-inject` にそのセッションの記録ファイルがある'
        mock: なし
        expected: 記録ファイルが残る。`{XDG_STATE_HOME}/rule-inject/logs` のログに `read_settings` が 1 行
