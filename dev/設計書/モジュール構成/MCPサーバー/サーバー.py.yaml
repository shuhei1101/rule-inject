title: "MCP サーバー / サーバー"
lead: 常駐の MCP サーバーの起動の入口、コンポジションルート、ツールの本体と応答の形式。ツールは引数の確かめと `features/index` の呼び出しと応答の組み立てだけを行い、サブフィーチャー同士の組み合わせ（チェックを編集へ注入する）はコンポジションルートが行う。
directory: |-
  ```text
  src/rule_inject/server/
  ├── __init__.py
  ├── __main__.py   # 起動の入口（main）
  ├── app.py        # コンポジションルート（build_server）とツールの登録
  ├── tools.py      # 5 つのツールの本体と、設定・書き込める索引の解決
  ├── types.py      # ResponseFormat と応答のモデル（Pydantic）
  └── _format.py    # 応答の形式（JSON / Markdown）と長さの切り詰め
  ```
enums:
  - name: ResponseFormat
    title: 応答の形式
    container: server/types.py
    usecase: 共通
    summary: 読むツールの `format`（Literal）
    values:
      - value: markdown
        title: Markdown
        description: 同じ項目を Markdown の表で text に入れ、structuredContent を返さない
      - value: json
        title: JSON
        description: structuredContent と text に同じ JSON を入れる
constants:
  - name: SERVER_NAME
    title: サーバーの名前
    container: server/app.py
    summary: '`MCPServer` の `name`'
    value: '`"rule-inject"`'
  - name: HOST
    title: 待ち受けのアドレス
    container: server/__main__.py
    summary: 非機能要件「MCPサーバーの待ち受けのアドレス」の決定値
    value: '`"127.0.0.1"`'
  - name: MAX_RESPONSE_CHARS
    title: 応答の長さの上限
    container: server/_format.py
    summary: 非機能要件「MCPのツールの応答の長さ」の決定値（text の字数）
    value: '`40_000`'
  - name: DEFAULT_LIST_LIMIT
    title: 一覧の件数の既定
    container: server/tools.py
    summary: '`list_rules` の `limit` の既定'
    value: '`100`'
  - name: MAX_LIST_LIMIT
    title: 一覧の件数の上限
    container: server/tools.py
    summary: '`list_rules` の `limit` の上限'
    value: '`500`'
  - name: CURSOR_PATTERN
    title: 続きの位置の書式
    container: server/tools.py
    summary: '`cursor` が受け付ける値（効いているエントリの並びの中の位置を 10 進で書いた文字列）。引数の Schema の `pattern` に置き、外れた値は SDK の引数の検証で断る'
    value: '`r"^[0-9]+$"`'
data_models:
  - name: RuleEntry
    title: 効いているエントリ
    container: server/types.py
    usecase: 効いているルールの一覧を見る
    role: DTO
    summary: インターフェース定義「ルールの一覧」の `entries[]`
    properties:
      - name: index
        type: str
        description: エントリを持つ索引の場所
      - name: position
        type: int
        description: 索引の `rules` の中の位置
      - name: rev
        type: str
        description: エントリのバージョン
      - name: rule
        type: str
        description: 解いたルールの場所
      - name: paths
        type: list[str]
        description: 索引に書いたままのパターン
      - name: exclude
        type: list[str]
        description: 同上
      - name: tools
        type: list[str]
        description: 同上
      - name: args
        type: dict[str, list[str]]
        description: 同上
      - name: on
        type: list[Operation]
        description: '`default_on` を埋めた操作の種別（`OPERATIONS` の順）'
      - name: read_by
        type: list[dict[str, Any]]
        description: 索引に書いたままの `read_by`
  - name: IndexIssue
    title: 索引ごとの理由
    container: server/types.py
    usecase: 効いているルールの一覧を見る
    role: DTO
    summary: '`unreadable_indexes[]`'
    properties:
      - name: index
        type: str
        description: 読めない索引の場所
      - name: reason
        type: str
        description: フックが案内に載せる理由
  - name: EntryIssue
    title: 照合に使わないエントリ
    container: server/types.py
    usecase: 効いているルールの一覧を見る
    role: DTO
    summary: '`skipped_entries[]` と `disabled_entries[]`'
    properties:
      - name: index
        type: str
        description: エントリを持つ索引の場所
      - name: position
        type: int
        description: 位置
      - name: rev
        type: str
        description: バージョン
      - name: rule
        type: str
        description: 索引に書いたままの `rule`
      - name: reason
        type: str | None
        description: 読み飛ばした理由。`disabled_entries` では応答に含めない（`exclude_none`）
  - name: ListRulesResult
    title: ルールの一覧の応答
    container: server/types.py
    usecase: 効いているルールの一覧を見る
    role: DTO
    summary: インターフェース定義「ルールの一覧」のレスポンス
    properties:
      - name: success
        type: bool
        description: 常に `True`
      - name: output
        type: str
        description: 索引の数と各一覧の件数の 1 行
      - name: config_path
        type: str | None
        description: 設定ファイルの場所
      - name: indexes
        type: list[str]
        description: 読む索引の場所
      - name: entries
        type: list[RuleEntry]
        description: 効いているエントリのこのページ
      - name: unreadable_indexes
        type: list[IndexIssue]
        description: 先頭のページだけ
      - name: skipped_entries
        type: list[EntryIssue]
        description: 先頭のページだけ
      - name: disabled_entries
        type: list[EntryIssue]
        description: 先頭のページだけ
      - name: total
        type: int
        description: 効いているエントリの総数
      - name: next_cursor
        type: str | None
        description: 続きの位置
  - name: RuleMatch
    title: 当たったルール
    container: server/types.py
    usecase: 操作に当たるルールを検索する
    role: DTO
    summary: '`matched[]`'
    properties:
      - name: rule
        type: str
        description: 解いたルールの場所
      - name: blocking
        type: bool
        description: 未読のときに操作を止めるか
      - name: entries
        type: list[EntryRef]
        description: 当たったエントリ（`index`・`position`）
  - name: EntryRef
    title: エントリの場所
    container: server/types.py
    usecase: 操作に当たるルールを検索する
    role: DTO
    summary: '`matched[].entries[]`'
    properties:
      - name: index
        type: str
        description: 索引の場所
      - name: position
        type: int
        description: 位置
  - name: SearchRulesResult
    title: ルールの検索の応答
    container: server/types.py
    usecase: 操作に当たるルールを検索する
    role: DTO
    summary: インターフェース定義「ルールの検索」のレスポンス
    properties:
      - name: success
        type: bool
        description: 常に `True`
      - name: output
        type: str
        description: 当たったルールと止めるルールの件数の 1 行
      - name: config_path
        type: str | None
        description: 設定ファイルの場所
      - name: operation
        type: Operation
        description: 照合に使った操作の種別
      - name: matched
        type: list[RuleMatch]
        description: 当たったルール
      - name: unreadable_indexes
        type: list[IndexIssue]
        description: 読めない索引
      - name: skipped_entries
        type: list[EntryIssue]
        description: 読み飛ばしたエントリ
  - name: IndexReport
    title: 索引ごとのチェックの結果
    container: server/types.py
    usecase: 索引をチェックする
    role: DTO
    summary: インターフェース定義「索引のチェック」の `indexes[]`。`IndexCheck` の問題を種類ごとの一覧に分ける
    properties:
      - name: index
        type: str
        description: 索引の場所
      - name: hook_error
        type: str | None
        description: '`hook_error` の理由'
      - name: violations
        type: list[dict[str, str]]
        description: '`violation` の `location`・`reason`'
      - name: missing_rules
        type: list[dict[str, Any]]
        description: '`missing_rule` の `position`・`rule`（理由に入れた解いた場所）'
      - name: skipped_entries
        type: list[dict[str, Any]]
        description: '`skipped_entry` の `position`・`reason`'
  - name: CheckIndexesResult
    title: 索引のチェックの応答
    container: server/types.py
    usecase: 索引をチェックする
    role: DTO
    summary: インターフェース定義「索引のチェック」のレスポンス
    properties:
      - name: success
        type: bool
        description: 常に `True`
      - name: output
        type: str
        description: 索引の数と問題の件数の 1 行
      - name: config_path
        type: str | None
        description: 設定ファイルの場所
      - name: problem_count
        type: int
        description: 問題の件数の合計
      - name: indexes
        type: list[IndexReport]
        description: 索引ごとの結果（フックが読む順）
  - name: WriteEntryResult
    title: エントリの書き込みの応答
    container: server/types.py
    usecase: 索引のエントリを編集する
    role: DTO
    summary: インターフェース定義「エントリの書き込み」のレスポンス（`success`・`output`・`index`・`position`・`rev`・`written`・`diff`）
    properties:
      - name: success
        type: bool
        description: 常に `True`（書けないときは ToolError）
      - name: output
        type: str
        description: 書き込んだ索引と位置の 1 行
      - name: index
        type: str
        description: '`EditResult.index`'
      - name: position
        type: int
        description: '`EditResult.position`'
      - name: rev
        type: str
        description: '`EditResult.rev`'
      - name: written
        type: bool
        description: '`EditResult.written`'
      - name: diff
        type: str
        description: '`EditResult.diff`'
  - name: DeleteEntryResult
    title: エントリの削除の応答
    container: server/types.py
    usecase: 索引のエントリを編集する
    role: DTO
    summary: インターフェース定義「エントリの削除」のレスポンス（`success`・`output`・`index`・`rule`・`written`・`diff`）
    properties:
      - name: success
        type: bool
        description: 常に `True`
      - name: output
        type: str
        description: 削除した索引と位置の 1 行
      - name: index
        type: str
        description: '`EditResult.index`'
      - name: rule
        type: str
        description: '`EditResult.rule`'
      - name: written
        type: bool
        description: '`EditResult.written`'
      - name: diff
        type: str
        description: '`EditResult.diff`'
functions:
  - name: main
    title: 起動の入口
    container: server/__main__.py
    usecase: MCPサーバーを常駐させる
    summary: 設定ファイルとポートを確かめ、`HOST` のポートで Streamable HTTP として待ち受ける（`python -m rule_inject.server`）
    kind: 関数
    scope: public
    returns:
      type: None
      description: 終わるときは終了コードで抜ける
    process: |-
      1. `env = os.environ` として `load_settings(env)` で設定ファイルと `RULE_INJECT_PORT` を確かめる。`SettingsReadError` は標準エラーへ `{path}: {reason}` を書き、終了コード 1 で終わる
      2. `socket.create_server((HOST, settings.server_port))` で待ち受けられるか確かめて閉じる。OSError は標準エラーへポートの番号と「別のプロセスが使っている」旨を書き、終了コード 1 で終わる（uvicorn は待ち受けの失敗を自分のログに書いて終わるため、先に確かめる）
      3. `build_server(env).run("streamable-http", host=HOST, port=settings.server_port)` で待ち受ける。Ctrl+C・SIGTERM は uvicorn が待ち受けを閉じてから終わる
    unit_tests:
      - name: test_main_when_settings_unreadable
        case: 異常
        summary: 設定ファイルが読めなければ待ち受けずに終わる
        condition: '`RULE_INJECT_CONFIG` が無いファイルを指す'
        mock: '`MCPServer.run`（呼ばれないことを確かめる）'
        expected: '`SystemExit(1)` で、標準エラーに設定ファイルの場所'
      - name: test_main_when_port_in_use
        case: 異常
        summary: ポートが使われていれば待ち受けずに終わる
        condition: テストが同じポートで待ち受けておき、`RULE_INJECT_PORT` にそのポート
        mock: '`MCPServer.run`（呼ばれないことを確かめる）'
        expected: '`SystemExit(1)` で、標準エラーにポートの番号'
  - name: build_server
    title: サーバーの組み立て
    container: server/app.py
    usecase: MCPサーバーを常駐させる
    summary: コンポジションルート。依存を作ってツールへ渡し、`MCPServer` に 5 つのツールを登録する
    kind: 関数
    scope: public
    args:
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: サーバーを起動した環境変数
    returns:
      type: MCPServer
      description: ツールを登録したサーバー
    process: |-
      1. `validator = load_validator()`、`locks = IndexLocks()`、`check = partial(check_change, env=env, validator=validator)` を作る
      2. `MCPServer(SERVER_NAME)` を作る
      3. 各ツールを、依存（`env`・`validator`・`locks`・`check`）を閉じ込めて引数をツールの引数だけにした関数で `add_tool(..., structured_output=False)` する（`partial` で渡すと依存の引数がツールの引数の Schema に残るため）。`annotations` は `list_rules`・`search_rules`・`check_indexes` が `readOnlyHint`、`write_index_entry` が `destructiveHint: false`、`delete_index_entry` が `destructiveHint: true` で、全て `openWorldHint: false`
      4. サーバーを返す
    unit_tests:
      - name: test_build_server
        case: 正常
        summary: 5 つのツールを依存の引数なしで登録する
        condition: 空の `env`
        mock: なし
        expected: '`list_tools` が 5 つの名前を返し、どの入力の Schema にも `env`・`validator`・`locks`・`check_change` が無く、`delete_index_entry` だけが `destructiveHint: true`'
  - name: list_rules
    title: ルールの一覧
    container: server/tools.py
    usecase: 効いているルールの一覧を見る
    summary: インターフェース定義「ルールの一覧」のツールの本体
    kind: 関数
    scope: public
    args:
      - name: project_dir
        type: str
        required: true
        passing: keyword
        description: プロジェクトの直下
      - name: limit
        type: Annotated[int, Field(ge=1, le=MAX_LIST_LIMIT)]
        required: false
        default: DEFAULT_LIST_LIMIT
        passing: keyword
        description: 返す件数の上限
      - name: cursor
        type: Annotated[str | None, Field(pattern=CURSOR_PATTERN)]
        required: false
        default: None
        passing: keyword
        description: 前の応答の `next_cursor`
      - name: format
        type: ResponseFormat
        required: false
        default: '"markdown"'
        passing: keyword
        description: 応答の形式
      - name: env
        type: Mapping[str, str]
        required: true
        passing: injected
        description: サーバーを起動した環境変数
    returns:
      type: CallToolResult
      description: '`respond(ListRulesResult, format)`'
    process: |-
      1. `_project_settings(project_dir, env)` で設定を読む
      2. `settings.indexes` を順に `read_index` で読む。`IndexReadError` は `unreadable_indexes` に、状態が `effective` のエントリは `RuleEntry`（パターンは `raw` のまま、`rule` と `on` は `entry` の値）に、`skipped` は `skipped_entries` に、`disabled` は `disabled_entries` に入れる
      3. 効いているエントリの `int(cursor or 0)` 番目から `limit` 件を取り、`cursor` があるときは `unreadable_indexes`・`skipped_entries`・`disabled_entries` を空にする
      4. `fit_page` で応答が `MAX_RESPONSE_CHARS` に収まる件数まで末尾から切り、残りがあれば `next_cursor` に次の位置を入れる
      5. `respond` で返す
    exceptions:
      - name: ToolError
        condition: '`_project_settings` が送出する'
        message: '`_project_settings` と同じ'
    unit_tests:
      - name: test_list_rules_when_paged
        case: 正常
        summary: '`limit` と `cursor` で続きを返し、理由の一覧は先頭のページだけに載せる'
        condition: '効いているエントリ 3 件と無効のエントリ 1 件の索引を `limit: 2` で 2 回呼ぶ'
        mock: なし
        expected: 1 回目は 2 件で `next_cursor` が `"2"`、`disabled_entries` が 1 件。2 回目は 1 件で `next_cursor` が `None`、`disabled_entries` が空。どちらも `total` が 3
  - name: search_rules
    title: ルールの検索
    container: server/tools.py
    usecase: 操作に当たるルールを検索する
    summary: インターフェース定義「ルールの検索」のツールの本体
    kind: 関数
    scope: public
    args:
      - name: project_dir
        type: str
        required: true
        passing: keyword
        description: プロジェクトの直下
      - name: path
        type: str | None
        required: false
        default: None
        passing: keyword
        description: 操作の対象のファイルのパス
      - name: operation
        type: Literal['read', 'write'] | None
        required: false
        default: None
        passing: keyword
        description: パスへの操作の種別
      - name: tool_name
        type: str | None
        required: false
        default: None
        passing: keyword
        description: MCP のツールの完全名
      - name: arguments
        type: dict[str, Any] | None
        required: false
        default: None
        passing: keyword
        description: MCP のツールの引数
      - name: format
        type: ResponseFormat
        required: false
        default: '"markdown"'
        passing: keyword
        description: 応答の形式
      - name: env
        type: Mapping[str, str]
        required: true
        passing: injected
        description: サーバーを起動した環境変数
    returns:
      type: CallToolResult
      description: '`respond(SearchRulesResult, format)`'
    process: |-
      1. `path` と `tool_name` が両方ある・どちらも無い、`path` があって `operation` が無い、`path` が絶対パスでないときは `ToolError`（渡し方）
      2. `_project_settings(project_dir, env)` で設定を読み、`list_rules` の手順 2 と同じく索引を読む
      3. 効いているエントリを 1 件ずつ、`path` のときは `match_path([entry], path, operation)`、ツールのときは `match_tool([entry], tool_name, arguments or {})`（操作の種別は `mcp`）で当て、当たったエントリの索引と位置を、ルールの場所ごとに初めて当たった順でまとめる。`blocking` はまとめたエントリの `MatchedRule.blocking` のどれかが真か
      4. `respond` で返す
    exceptions:
      - name: ToolError
        condition: 手順 1 の引数の組み合わせの誤り、または `_project_settings` が送出する
        message: 渡し方。`_project_settings` のときはその理由
    unit_tests:
      - name: test_search_rules_when_same_rule
        case: 正常
        summary: 同じルールに当たったエントリを 1 件にまとめ、どれかが止めれば止める
        condition: '同じ `rule` で `on: [read]` と `on: [write]` のエントリが同じパスに当たる。`operation: write`'
        mock: なし
        expected: '`matched` が 1 件で `blocking` が `true`、`entries` が 2 件'
      - name: test_search_rules_when_invalid_arguments
        case: 異常
        summary: 引数の組み合わせの誤りを拒む
        condition: '`path` と `tool_name` の両方、どちらも無し、`operation` 無しの `path`、相対パスの `path`（パラメータ展開）'
        mock: なし
        expected: ToolError
        exception: 手順 1 の引数の組み合わせの誤り、または `_project_settings` が送出する
  - name: check_indexes
    title: 索引のチェック
    container: server/tools.py
    usecase: 索引をチェックする
    summary: インターフェース定義「索引のチェック」のツールの本体
    kind: 関数
    scope: public
    args:
      - name: project_dir
        type: str
        required: true
        passing: keyword
        description: プロジェクトの直下
      - name: format
        type: ResponseFormat
        required: false
        default: '"markdown"'
        passing: keyword
        description: 応答の形式
      - name: env
        type: Mapping[str, str]
        required: true
        passing: injected
        description: サーバーを起動した環境変数
      - name: validator
        type: jsonschema.protocols.Validator
        required: true
        passing: injected
        description: '`load_validator` の戻り値'
    returns:
      type: CallToolResult
      description: '`respond(CheckIndexesResult, format)`'
    process: |-
      1. `_project_settings(project_dir, env)` で設定を読む
      2. `settings.indexes` を順に `check_index(index, env, validator=validator)` で確かめ、問題を種類ごとに `IndexReport` の一覧へ分ける
      3. `problem_count` に問題の件数の合計を入れ、`respond` で返す
    exceptions:
      - name: ToolError
        condition: '`_project_settings` が送出する'
        message: '`_project_settings` と同じ'
    unit_tests:
      - name: test_check_indexes
        case: 正常
        summary: 問題を種類ごとに分け、件数を合計する
        condition: 違反 1 件とファイルの無いルール 1 件を持つ索引と、無い索引
        mock: なし
        expected: '`problem_count` が 3。無い索引は `hook_error` だけを持つ'
  - name: write_index_entry
    title: エントリの書き込み
    container: server/tools.py
    usecase: 索引のエントリを編集する
    summary: インターフェース定義「エントリの書き込み」のツールの本体
    kind: 関数
    scope: public
    side_effects: 索引のファイルを書き換える
    args:
      - name: project_dir
        type: str
        required: true
        passing: keyword
        description: プロジェクトの直下
      - name: index
        type: str
        required: true
        passing: keyword
        description: 書き込む索引の場所
      - name: entry
        type: dict[str, Any]
        required: true
        passing: keyword
        description: 書き込むキーと値
      - name: position
        type: Annotated[int | None, Field(ge=0)]
        required: false
        default: None
        passing: keyword
        description: 書き換えるエントリの位置
      - name: expected_rev
        type: str | None
        required: false
        default: None
        passing: keyword
        description: 書き換える前のバージョン
      - name: remove_keys
        type: list[str] | None
        required: false
        default: None
        passing: keyword
        description: 削除するキー
      - name: dry_run
        type: bool
        required: false
        default: 'False'
        passing: keyword
        description: 書き込まずに確かめるか
      - name: env
        type: Mapping[str, str]
        required: true
        passing: injected
        description: サーバーを起動した環境変数
      - name: locks
        type: IndexLocks
        required: true
        passing: injected
        description: 索引ごとのロック
      - name: check_change
        type: CheckChange
        required: true
        passing: injected
        description: 書き込みのチェック
    returns:
      type: CallToolResult
      description: '`respond(WriteEntryResult, "json")`'
    process: |-
      1. `position` があって `expected_rev` が無い、`position` が無いのに `remove_keys` がある、`entry` と `remove_keys` に同じキーがあるときは `ToolError`（渡し方）
      2. `_project_settings(project_dir, env)` で設定を読み、`_editable_index(index, settings)` で書き込む索引を決める
      3. `write_entry` を呼ぶ。`IndexEditError` は `ToolError`（`{path}: {reason}`）
      4. `output` を `{index} の rules[{position}] を書き込みました`（`dry_run` のときは `…を書き込まずに確かめました`）にして返す
    exceptions:
      - name: ToolError
        condition: 手順 1 の誤り、または `_project_settings`・`_editable_index` が送出する、または `write_entry` が `IndexEditError` を送出する
        message: インターフェース定義「エントリの書き込み」の例外の補足
    unit_tests:
      - name: test_write_index_entry_when_invalid_arguments
        case: 異常
        summary: 引数の組み合わせの誤りを拒む
        condition: '`expected_rev` 無しの `position`、`position` 無しの `remove_keys`、`entry` と `remove_keys` の同じキー（パラメータ展開）'
        mock: '`write_entry`（呼ばれないことを確かめる）'
        expected: ToolError
        exception: 手順 1 の誤り、または `_project_settings`・`_editable_index` が送出する、または `write_entry` が `IndexEditError` を送出する
  - name: delete_index_entry
    title: エントリの削除
    container: server/tools.py
    usecase: 索引のエントリを編集する
    summary: インターフェース定義「エントリの削除」のツールの本体
    kind: 関数
    scope: public
    side_effects: 索引のファイルを書き換える
    args:
      - name: project_dir
        type: str
        required: true
        passing: keyword
        description: プロジェクトの直下
      - name: index
        type: str
        required: true
        passing: keyword
        description: 索引の場所
      - name: position
        type: Annotated[int, Field(ge=0)]
        required: true
        passing: keyword
        description: 削除するエントリの位置
      - name: expected_rev
        type: str
        required: true
        passing: keyword
        description: 削除するエントリのバージョン
      - name: dry_run
        type: bool
        required: false
        default: 'False'
        passing: keyword
        description: 書き込まずに確かめるか
      - name: env
        type: Mapping[str, str]
        required: true
        passing: injected
        description: サーバーを起動した環境変数
      - name: locks
        type: IndexLocks
        required: true
        passing: injected
        description: 索引ごとのロック
    returns:
      type: CallToolResult
      description: '`respond(DeleteEntryResult, "json")`'
    process: |-
      1. `write_index_entry` の手順 2 と同じく索引を決める
      2. `delete_entry` を呼ぶ。`IndexEditError` は `ToolError`（`{path}: {reason}`）
      3. `output` を `{index} の rules[{position}] を削除しました`（`dry_run` のときは `…を削除せずに確かめました`）にして返す
    exceptions:
      - name: ToolError
        condition: '`_project_settings`・`_editable_index` が送出する、または `delete_entry` が `IndexEditError` を送出する'
        message: インターフェース定義「エントリの削除」の例外の補足
  - name: _project_settings
    title: プロジェクトの設定
    container: server/tools.py
    usecase: 共通
    summary: '`project_dir` を `CLAUDE_PROJECT_DIR` として、フックと同じ規則で設定を読む。ツールの呼び出しのたびに読み直す'
    kind: 関数
    scope: internal
    args:
      - name: project_dir
        type: str
        required: true
        passing: positional
        description: プロジェクトの直下
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: サーバーを起動した環境変数
    returns:
      type: Settings
      description: そのプロジェクトでフックが使う設定
    process: |-
      1. `project_dir` が絶対パスでなければ `ToolError`（絶対パスで渡す旨）
      2. `load_settings({**env, CLAUDE_PROJECT_DIR: project_dir})` を返す。`SettingsReadError` は `ToolError`（`{path}: {reason}`）
    exceptions:
      - name: ToolError
        condition: '`project_dir` が絶対パスでない、または設定ファイルが読めない'
        message: 絶対パスで渡す旨、または設定ファイルの場所と理由
    unit_tests:
      - name: test_project_settings_when_project_matched
        case: 正常
        summary: '`project_dir` で `projects[].match` を当てる'
        condition: '`projects` に `match: /home/user/project` と `indexes: [rules.yaml]` を持つ設定ファイルと、`project_dir: /home/user/project`'
        mock: なし
        expected: '`indexes` の末尾が `/home/user/project/rules.yaml`'
      - name: test_project_settings_when_relative
        case: 異常
        summary: 相対パスを拒む
        condition: '`project_dir: project`'
        mock: なし
        expected: ToolError
        exception: '`project_dir` が絶対パスでない、または設定ファイルが読めない'
  - name: _editable_index
    title: 書き込める索引
    container: server/tools.py
    usecase: 索引のエントリを編集する
    summary: '`index` が設定で読む索引のどれかを確かめ、シンボリックリンクを解いた場所を返す'
    kind: 関数
    scope: internal
    args:
      - name: index
        type: str
        required: true
        passing: positional
        description: ツールに渡された索引の場所
      - name: settings
        type: Settings
        required: true
        passing: positional
        description: '`_project_settings` の戻り値'
    returns:
      type: str
      description: シンボリックリンクを解いた索引の場所
    process: |-
      1. 先頭の `~` を展開し、`os.path.realpath` で解く
      2. `settings.indexes` をそれぞれ `os.path.realpath` で解いた中に無ければ `ToolError`（設定ファイルで読む索引でない旨と、読む索引の場所）
    exceptions:
      - name: ToolError
        condition: 設定ファイルで読む索引でない
        message: 設定ファイルで読む索引でない旨と、読む索引の場所
    unit_tests:
      - name: test_editable_index_when_symlink
        case: 正常
        summary: シンボリックリンクを解いて比べる
        condition: 読む索引を指すシンボリックリンクを `index` に渡す
        mock: なし
        expected: 解いた索引の場所
      - name: test_editable_index_when_not_read
        case: 異常
        summary: 読む索引でないファイルを拒む
        condition: 読む索引と同じフォルダの別の YAML
        mock: なし
        expected: ToolError（読む索引の場所を含む）
        exception: 設定ファイルで読む索引でない
  - name: respond
    title: 応答の組み立て
    container: server/_format.py
    usecase: 共通
    summary: 応答のモデルを、形式に合わせた `CallToolResult` にする
    kind: 関数
    scope: public
    args:
      - name: result
        type: BaseModel
        required: true
        passing: positional
        description: 応答のモデル
      - name: format
        type: ResponseFormat
        required: true
        passing: positional
        description: 応答の形式
    returns:
      type: CallToolResult
      description: ツールの結果
    process: |-
      1. `json` のときは `model_dump(mode="json", exclude_none=False)` を structuredContent に、同じ値の JSON を text に入れる
      2. `markdown` のときは `render_markdown(result)` を text に入れ、structuredContent を返さない
    unit_tests:
      - name: test_respond
        case: 正常
        summary: 形式ごとに structuredContent の有無を切り替える
        condition: 同じ `CheckIndexesResult` を `json` と `markdown` で渡す（パラメータ展開）
        mock: なし
        expected: '`json` は structuredContent が text の JSON と同じ値、`markdown` は structuredContent が `None` で text が表を含む'
  - name: render_markdown
    title: Markdown の応答
    container: server/_format.py
    usecase: 共通
    summary: 応答のモデルの各項目を Markdown にする。全ての応答のモデルに共通の 1 つの関数
    kind: 関数
    scope: public
    args:
      - name: result
        type: BaseModel
        required: true
        passing: positional
        description: 応答のモデル
    returns:
      type: str
      description: Markdown
    process: |-
      1. 先頭に `output` を置く
      2. スカラーの項目は `- {項目}: {値}` の行にする。`diff` は `diff` のコードブロックにする
      3. モデルのリストの項目は `## {項目}` の見出しと、モデルの項目を列にした表にする（リスト・マップの値は JSON の 1 行）。入れ子のリスト（`indexes[].violations` など）は親の行ごとに `### {親の場所}` の見出しを置き、同じ規則で表にする。空のリストは `なし`
    unit_tests:
      - name: test_render_markdown
        case: 正常
        summary: リストは表に、空のリストは「なし」にする
        condition: '`entries` 2 件と空の `skipped_entries` を持つ `ListRulesResult`'
        mock: なし
        expected: '`## entries` の下に 2 行の表、`## skipped_entries` の下に `なし`'
  - name: fit_page
    title: 応答の長さの切り詰め
    container: server/_format.py
    usecase: 効いているルールの一覧を見る
    summary: 応答の text が `MAX_RESPONSE_CHARS` に収まるまで、一覧の末尾から要素を切る
    kind: 関数
    scope: public
    args:
      - name: build
        type: Callable[[int], BaseModel]
        required: true
        passing: positional
        description: 一覧に入れる件数を受け、その件数で応答のモデルを作る関数
      - name: count
        type: int
        required: true
        passing: positional
        description: 切る前の件数
      - name: format
        type: ResponseFormat
        required: true
        passing: positional
        description: 応答の形式（形式ごとに text の長さが違う）
    returns:
      type: tuple[BaseModel, int]
      description: 収まった応答と、その件数
    process: 件数を `count` から二分探索で減らし、`respond(build(件数), format)` の text が `MAX_RESPONSE_CHARS` 以下になる最大の件数を返す。0 件でも超えるときは 0 件の応答を返す（理由の一覧が長いとき）
    unit_tests:
      - name: test_fit_page
        case: 正常
        summary: 上限に収まる最大の件数を返す
        condition: 1 件あたり約 1,000 字のエントリ 100 件
        mock: なし
        expected: 返した応答の text が `MAX_RESPONSE_CHARS` 以下で、件数を 1 件増やすと超える
test_files:
  - tests/unit/rule_inject/server/test_main.py
  - tests/unit/rule_inject/server/test_app.py
  - tests/unit/rule_inject/server/test_tools.py
  - tests/unit/rule_inject/server/test_format.py
