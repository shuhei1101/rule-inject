title: "MCP サーバー / サーバー"
lead: 常駐の MCP サーバーの起動の入口、コンポジションルート、ツールの本体と応答の形式。ツールは引数の確かめと `features/index`・`features/record` の呼び出しと応答の組み立てだけを行い、サブフィーチャー同士の組み合わせ（チェックを編集へ注入する）はコンポジションルートが行う。
directory: |-
  ```text
  src/rule_inject/server/
  ├── __init__.py
  ├── __main__.py      # 起動の入口（main）
  ├── app.py           # コンポジションルート（build_server）とツールの登録
  ├── tools.py         # ルールの一覧・検索・エントリの書き込み・削除のツールの本体と、設定・書き込める索引の解決
  ├── check_tools.py   # 索引のチェックのツールの本体と、続きの位置の文字列の変換
  ├── record_tools.py  # 既読の記録の確認・削除のツールの本体
  ├── types.py         # ResponseFormat と応答のモデル（Pydantic）
  └── _format.py       # 応答の形式（JSON / Markdown）と長さの切り詰め
  ```
enums:
  - name: ResponseFormat
    title: 応答の形式
    container: server/types.py
    usecase: 共通
    summary: 読むツールの `format`（Literal）
    values:
      - value: markdown
        title: Markdown
        description: 同じ項目を Markdown の表で text に入れ、structuredContent を返さない
      - value: json
        title: JSON
        description: structuredContent と text に同じ JSON を入れる
constants:
  - name: SERVER_NAME
    title: サーバーの名前
    container: server/app.py
    summary: '`MCPServer` の `name`'
    value: '`"rule-inject"`'
  - name: HOST
    title: 待ち受けのアドレス
    container: server/__main__.py
    summary: 非機能要件「MCPサーバーの待ち受けのアドレス」の決定値
    value: '`"127.0.0.1"`'
  - name: MAX_RESPONSE_CHARS
    title: 応答の長さの上限
    container: server/_format.py
    summary: 非機能要件「MCPのツールの応答の長さ」の決定値（text の字数）
    value: '`40_000`'
  - name: DEFAULT_LIST_LIMIT
    title: 一覧の件数の既定
    container: server/tools.py
    summary: '`list_rules`・`get_read_records` の `limit` の既定'
    value: '`100`'
  - name: MAX_LIST_LIMIT
    title: 一覧の件数の上限
    container: server/tools.py
    summary: '`list_rules`・`get_read_records` の `limit` の上限'
    value: '`500`'
  - name: CURSOR_PATTERN
    title: 続きの位置の書式
    container: server/tools.py
    summary: '`list_rules`・`get_read_records` の `cursor` が受け付ける値（一覧の並びの中の位置を 10 進で書いた文字列）。引数の Schema の `pattern` に置き、外れた値は SDK の引数の検証で断る'
    value: '`r"^[0-9]+$"`'
  - name: UNMATCHED_SCAN_TIME_LIMIT
    title: プロジェクトのファイルを辿る時間の上限
    container: server/app.py
    summary: 非機能要件「プロジェクトのファイルを辿る時間」の決定値（秒）。`build_server` の `scan_time_limit` の既定
    value: '`30`'
data_models:
  - name: RuleEntry
    title: 効いているエントリ
    container: server/types.py
    usecase: 効いているルールの一覧を見る
    role: DTO
    summary: インターフェース定義「ルールの一覧」の `entries[]`
    properties:
      - name: index
        type: str
        description: エントリを持つ索引の場所
      - name: position
        type: int
        description: 索引の `rules` の中の位置
      - name: rev
        type: str
        description: エントリのバージョン
      - name: rule
        type: str
        description: 解いたルールの場所
      - name: paths
        type: list[str]
        description: 索引に書いたままのパターン
      - name: exclude
        type: list[str]
        description: 同上
      - name: tools
        type: list[str]
        description: 同上
      - name: args
        type: dict[str, list[str]]
        description: 同上
      - name: on
        type: list[Operation]
        description: '`default_on` を埋めた操作の種別（`OPERATIONS` の順）'
      - name: read_by
        type: list[dict[str, Any]]
        description: 索引に書いたままの `read_by`
  - name: IndexIssue
    title: 索引ごとの理由
    container: server/types.py
    usecase: 効いているルールの一覧を見る
    role: DTO
    summary: '`unreadable_indexes[]`'
    properties:
      - name: index
        type: str
        description: 読めない索引の場所
      - name: reason
        type: str
        description: フックが案内に載せる理由
  - name: EntryIssue
    title: 照合に使わないエントリ
    container: server/types.py
    usecase: 効いているルールの一覧を見る
    role: DTO
    summary: '`skipped_entries[]` と `disabled_entries[]`'
    properties:
      - name: index
        type: str
        description: エントリを持つ索引の場所
      - name: position
        type: int
        description: 位置
      - name: rev
        type: str
        description: バージョン
      - name: rule
        type: str
        description: 索引に書いたままの `rule`
      - name: reason
        type: str | None
        description: 読み飛ばした理由。`disabled_entries` では応答に含めない（`exclude_none`）
  - name: ListRulesResult
    title: ルールの一覧の応答
    container: server/types.py
    usecase: 効いているルールの一覧を見る
    role: DTO
    summary: インターフェース定義「ルールの一覧」のレスポンス
    properties:
      - name: success
        type: bool
        description: 常に `True`
      - name: output
        type: str
        description: 索引の数と各一覧の件数の 1 行
      - name: config_path
        type: str | None
        description: 設定ファイルの場所
      - name: indexes
        type: list[str]
        description: 読む索引の場所
      - name: entries
        type: list[RuleEntry]
        description: 効いているエントリのこのページ
      - name: unreadable_indexes
        type: list[IndexIssue]
        description: 先頭のページだけ
      - name: skipped_entries
        type: list[EntryIssue]
        description: 先頭のページだけ
      - name: disabled_entries
        type: list[EntryIssue]
        description: 先頭のページだけ
      - name: total
        type: int
        description: 効いているエントリの総数
      - name: next_cursor
        type: str | None
        description: 続きの位置
  - name: RuleMatch
    title: 当たったルール
    container: server/types.py
    usecase: 操作に当たるルールを検索する
    role: DTO
    summary: '`matched[]`'
    properties:
      - name: rule
        type: str
        description: 解いたルールの場所
      - name: blocking
        type: bool
        description: 未読のときに操作を止めるか
      - name: entries
        type: list[EntryRef]
        description: 当たったエントリ（`index`・`position`）
  - name: EntryRef
    title: エントリの場所
    container: server/types.py
    usecase: 操作に当たるルールを検索する
    role: DTO
    summary: '`matched[].entries[]`'
    properties:
      - name: index
        type: str
        description: 索引の場所
      - name: position
        type: int
        description: 位置
  - name: SearchRulesResult
    title: ルールの検索の応答
    container: server/types.py
    usecase: 操作に当たるルールを検索する
    role: DTO
    summary: インターフェース定義「ルールの検索」のレスポンス
    properties:
      - name: success
        type: bool
        description: 常に `True`
      - name: output
        type: str
        description: 当たったルールと止めるルールの件数の 1 行
      - name: config_path
        type: str | None
        description: 設定ファイルの場所
      - name: operation
        type: Operation
        description: 照合に使った操作の種別
      - name: matched
        type: list[RuleMatch]
        description: 当たったルール
      - name: unreadable_indexes
        type: list[IndexIssue]
        description: 読めない索引
      - name: skipped_entries
        type: list[EntryIssue]
        description: 読み飛ばしたエントリ
  - name: IndexReport
    title: 索引ごとのチェックの結果
    container: server/types.py
    usecase: 索引をチェックする
    role: DTO
    summary: インターフェース定義「索引のチェック」の `indexes[]`。`IndexCheck` の問題を種類ごとの一覧に分ける
    properties:
      - name: index
        type: str
        description: 索引の場所
      - name: hook_error
        type: str | None
        description: '`hook_error` の理由'
      - name: violations
        type: list[dict[str, str]]
        description: '`violation` の `location`・`reason`'
      - name: missing_rules
        type: list[dict[str, Any]]
        description: '`missing_rule` の `position`・`rule`（理由に入れた解いた場所）'
      - name: skipped_entries
        type: list[dict[str, Any]]
        description: '`skipped_entry` の `position`・`reason`'
      - name: origin
        type: Literal["global", "project"]
        description: 索引の出所。`Settings.project_indexes` に入っていれば `project`
      - name: unmatched_paths
        type: list[dict[str, Any]]
        description: '`unmatched_path` の `position`・`rev`・`rule`（理由に入れた解いた場所）'
  - name: CheckIndexesResult
    title: 索引のチェックの応答
    container: server/types.py
    usecase: 索引をチェックする
    role: DTO
    summary: インターフェース定義「索引のチェック」のレスポンス
    properties:
      - name: success
        type: bool
        description: 常に `True`
      - name: output
        type: str
        description: 索引の数と問題の件数の 1 行
      - name: config_path
        type: str | None
        description: 設定ファイルの場所
      - name: problem_count
        type: int
        description: 問題の件数の合計
      - name: indexes
        type: list[IndexReport]
        description: 索引ごとの結果（フックが読む順）
      - name: unmatched_scan
        type: UnmatchedScanReport
        description: '`paths` の当たらないエントリの検出の状態'
  - name: WriteEntryResult
    title: エントリの書き込みの応答
    container: server/types.py
    usecase: 索引のエントリを編集する
    role: DTO
    summary: インターフェース定義「エントリの書き込み」のレスポンス（`success`・`output`・`index`・`position`・`rev`・`written`・`diff`）
    properties:
      - name: success
        type: bool
        description: 常に `True`（書けないときは ToolError）
      - name: output
        type: str
        description: 書き込んだ索引と位置の 1 行
      - name: index
        type: str
        description: '`EditResult.index`'
      - name: position
        type: int
        description: '`EditResult.position`'
      - name: rev
        type: str
        description: '`EditResult.rev`'
      - name: written
        type: bool
        description: '`EditResult.written`'
      - name: diff
        type: str
        description: '`EditResult.diff`'
  - name: DeleteEntryResult
    title: エントリの削除の応答
    container: server/types.py
    usecase: 索引のエントリを編集する
    role: DTO
    summary: インターフェース定義「エントリの削除」のレスポンス（`success`・`output`・`index`・`rule`・`written`・`diff`）
    properties:
      - name: success
        type: bool
        description: 常に `True`
      - name: output
        type: str
        description: 削除した索引と位置の 1 行
      - name: index
        type: str
        description: '`EditResult.index`'
      - name: rule
        type: str
        description: '`EditResult.rule`'
      - name: written
        type: bool
        description: '`EditResult.written`'
      - name: diff
        type: str
        description: '`EditResult.diff`'
  - name: UnmatchedScanReport
    title: paths の当たらないエントリの検出の状態
    container: server/types.py
    usecase: 索引をチェックする
    role: DTO
    summary: インターフェース定義「索引のチェック」の `unmatched_scan`
    properties:
      - name: completed
        type: bool
        description: 最後まで辿れたか
      - name: scanned_files
        type: int
        description: 最初の呼び出しから辿ったファイルの数
      - name: reason
        type: str | None
        description: 終えられなかった理由（上限の秒数と `cursor` の使い方）
      - name: next_cursor
        type: str | None
        description: '`_encode_scan_cursor` の文字列'
  - name: ReadSummary
    title: 読み方ごとの既読のまとめ
    container: server/types.py
    usecase: 既読の記録を確かめる
    role: DTO
    summary: インターフェース定義「既読の記録の確認」の `rules[].reads[]`
    properties:
      - name: method
        type: ReadMethod
        description: 既読の履歴に残る読み方
      - name: tool
        type: str
        description: 既読にしたツールの名前
      - name: last_time
        type: str
        description: その読み方とツールで最後に既読にした時刻（履歴の `time` のまま）
      - name: count
        type: int
        description: その読み方とツールで既読にした回数
  - name: RuleRead
    title: 既読のルール
    container: server/types.py
    usecase: 既読の記録を確かめる
    role: DTO
    summary: インターフェース定義「既読の記録の確認」の `rules[]`
    properties:
      - name: location
        type: str
        description: 既読のルールの場所
      - name: state
        type: ReadState
        description: 今の本文と既読にした時点の本文の関係
      - name: reads
        type: list[ReadSummary]
        description: 読み方とツール名の組ごとのまとめ（最後に既読にした時刻の古い順）
  - name: RecordSessionItem
    title: 既読の記録のあるセッション
    container: server/types.py
    usecase: 既読の記録を確かめる
    role: DTO
    summary: インターフェース定義「既読の記録の確認」の `sessions[]`
    properties:
      - name: session_id
        type: str
        description: セッションの識別子
      - name: updated_at
        type: str
        description: 既読の記録のファイルの最終更新の時刻（ISO 8601、UTC）
      - name: rule_count
        type: int
        description: 既読のルールの場所の数
  - name: ReadRecordsResult
    title: 既読の記録の確認の応答
    container: server/types.py
    usecase: 既読の記録を確かめる
    role: DTO
    summary: インターフェース定義「既読の記録の確認」のレスポンス
    properties:
      - name: success
        type: bool
        description: 常に `True`
      - name: output
        type: str
        description: ルールまたはセッションの件数の 1 行
      - name: config_path
        type: str | None
        description: 設定ファイルの場所
      - name: state_dir
        type: str
        description: 読んだ記録フォルダ
      - name: session_id
        type: str | None
        description: 確かめたセッション
      - name: rules
        type: list[RuleRead]
        description: 既読のルール（セッションを省いたときは空）
      - name: sessions
        type: list[RecordSessionItem]
        description: 既読の記録のあるセッション（セッションを指したときは空）
      - name: total
        type: int
        description: ルールまたはセッションの総数
      - name: next_cursor
        type: str | None
        description: 続きを取るときに `cursor` へ渡す値
  - name: DeleteRecordsResult
    title: 既読の記録の削除の応答
    container: server/types.py
    usecase: 既読の記録を削除する
    role: DTO
    summary: インターフェース定義「既読の記録の削除」のレスポンス
    properties:
      - name: success
        type: bool
        description: 常に `True`
      - name: output
        type: str
        description: 削除した既読のルールの件数の 1 行
      - name: config_path
        type: str | None
        description: 設定ファイルの場所
      - name: state_dir
        type: str
        description: 削除した記録フォルダ
      - name: session_id
        type: str
        description: 削除したセッション
      - name: locations
        type: list[str]
        description: 削除する前に既読だったルールの場所（初めて現れた順）
functions:
  - name: main
    title: 起動の入口
    container: server/__main__.py
    usecase: MCPサーバーを常駐させる
    summary: 設定ファイルとポートを確かめ、`HOST` のポートで Streamable HTTP として待ち受ける（`python -m rule_inject.server`）
    kind: 関数
    scope: public
    returns:
      type: None
      description: 終わるときは終了コードで抜ける
    process: |-
      1. `env = os.environ` として `load_settings(env)` で設定ファイルと `RULE_INJECT_PORT` を確かめる。`SettingsReadError` は標準エラーへ `{path}: {reason}` を書き、終了コード 1 で終わる
      2. `socket.create_server((HOST, settings.server_port))` で待ち受けられるか確かめて閉じる。OSError は標準エラーへポートの番号と「別のプロセスが使っている」旨を書き、終了コード 1 で終わる（uvicorn は待ち受けの失敗を自分のログに書いて終わるため、先に確かめる）
      3. `build_server(env).run("streamable-http", host=HOST, port=settings.server_port)` で待ち受ける。Ctrl+C・SIGTERM は uvicorn が待ち受けを閉じてから終わる
    unit_tests:
      - name: test_main_when_settings_unreadable
        case: 異常
        summary: 設定ファイルが読めなければ待ち受けずに終わる
        condition: '`RULE_INJECT_CONFIG` が無いファイルを指す'
        mock: '`MCPServer.run`（呼ばれないことを確かめる）'
        expected: '`SystemExit(1)` で、標準エラーに設定ファイルの場所'
      - name: test_main_when_port_in_use
        case: 異常
        summary: ポートが使われていれば待ち受けずに終わる
        condition: テストが同じポートで待ち受けておき、`RULE_INJECT_PORT` にそのポート
        mock: '`MCPServer.run`（呼ばれないことを確かめる）'
        expected: '`SystemExit(1)` で、標準エラーにポートの番号'
  - name: build_server
    title: サーバーの組み立て
    container: server/app.py
    usecase: MCPサーバーを常駐させる
    summary: コンポジションルート。依存を作ってツールへ渡し、`MCPServer` に 7 つのツールを登録する
    kind: 関数
    scope: public
    args:
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: サーバーを起動した環境変数
      - name: scan_time_limit
        type: float
        required: false
        default: UNMATCHED_SCAN_TIME_LIMIT
        passing: keyword
        description: '`check_indexes` がプロジェクトのファイルを辿る時間の上限（秒）。結合テストが 0 を渡して上限で止まる流れを確かめる'
    returns:
      type: MCPServer
      description: ツールを登録したサーバー
    process: |-
      1. `validator = load_validator()`、`locks = IndexLocks()`、`check = partial(check_change, env=env, validator=validator)` を作る
      2. `MCPServer(SERVER_NAME)` を作る
      3. 各ツールを、依存（`env`・`validator`・`locks`・`check`・`scan_time_limit`）を閉じ込めて引数をツールの引数だけにした関数で `add_tool(..., structured_output=False)` する（`partial` で渡すと依存の引数がツールの引数の Schema に残るため）。`annotations` は `list_rules`・`search_rules`・`check_indexes`・`get_read_records` が `readOnlyHint`、`write_index_entry` が `destructiveHint: false`、`delete_index_entry`・`delete_read_records` が `destructiveHint: true` で、全て `openWorldHint: false`
      4. サーバーを返す
    unit_tests:
      - name: test_build_server
        case: 正常
        summary: 7 つのツールを依存の引数なしで登録する
        condition: 空の `env`
        mock: なし
        expected: '`list_tools` が 7 つの名前を返し、どの入力の Schema にも `env`・`validator`・`locks`・`check_change`・`scan_time_limit` が無く、`delete_index_entry` と `delete_read_records` だけが `destructiveHint: true`'
  - name: list_rules
    title: ルールの一覧
    container: server/tools.py
    usecase: 効いているルールの一覧を見る
    summary: インターフェース定義「ルールの一覧」のツールの本体
    kind: 関数
    scope: public
    args:
      - name: project_dir
        type: str
        required: true
        passing: keyword
        description: プロジェクトの直下
      - name: limit
        type: Annotated[int, Field(ge=1, le=MAX_LIST_LIMIT)]
        required: false
        default: DEFAULT_LIST_LIMIT
        passing: keyword
        description: 返す件数の上限
      - name: cursor
        type: Annotated[str | None, Field(pattern=CURSOR_PATTERN)]
        required: false
        default: None
        passing: keyword
        description: 前の応答の `next_cursor`
      - name: format
        type: ResponseFormat
        required: false
        default: '"markdown"'
        passing: keyword
        description: 応答の形式
      - name: env
        type: Mapping[str, str]
        required: true
        passing: injected
        description: サーバーを起動した環境変数
    returns:
      type: CallToolResult
      description: '`respond(ListRulesResult, format)`'
    process: |-
      1. `_project_settings(project_dir, env)` で設定を読む
      2. `settings.indexes` を順に `read_index` で読む。`IndexReadError` は `unreadable_indexes` に、状態が `effective` のエントリは `RuleEntry`（パターンは `raw` のまま、`rule` と `on` は `entry` の値）に、`skipped` は `skipped_entries` に、`disabled` は `disabled_entries` に入れる
      3. 効いているエントリの `int(cursor or 0)` 番目から `limit` 件を取り、`cursor` があるときは `unreadable_indexes`・`skipped_entries`・`disabled_entries` を空にする
      4. `fit_page` で応答が `MAX_RESPONSE_CHARS` に収まる件数まで末尾から切り、残りがあれば `next_cursor` に次の位置を入れる
      5. `respond` で返す
    exceptions:
      - name: ToolError
        condition: '`_project_settings` が送出する'
        message: '`_project_settings` と同じ'
    unit_tests:
      - name: test_list_rules_when_paged
        case: 正常
        summary: '`limit` と `cursor` で続きを返し、理由の一覧は先頭のページだけに載せる'
        condition: '効いているエントリ 3 件と無効のエントリ 1 件の索引を `limit: 2` で 2 回呼ぶ'
        mock: なし
        expected: 1 回目は 2 件で `next_cursor` が `"2"`、`disabled_entries` が 1 件。2 回目は 1 件で `next_cursor` が `None`、`disabled_entries` が空。どちらも `total` が 3
  - name: search_rules
    title: ルールの検索
    container: server/tools.py
    usecase: 操作に当たるルールを検索する
    summary: インターフェース定義「ルールの検索」のツールの本体
    kind: 関数
    scope: public
    args:
      - name: project_dir
        type: str
        required: true
        passing: keyword
        description: プロジェクトの直下
      - name: path
        type: str | None
        required: false
        default: None
        passing: keyword
        description: 操作の対象のファイルのパス
      - name: operation
        type: Literal['read', 'write'] | None
        required: false
        default: None
        passing: keyword
        description: パスへの操作の種別
      - name: tool_name
        type: str | None
        required: false
        default: None
        passing: keyword
        description: MCP のツールの完全名
      - name: arguments
        type: dict[str, Any] | None
        required: false
        default: None
        passing: keyword
        description: MCP のツールの引数
      - name: format
        type: ResponseFormat
        required: false
        default: '"markdown"'
        passing: keyword
        description: 応答の形式
      - name: env
        type: Mapping[str, str]
        required: true
        passing: injected
        description: サーバーを起動した環境変数
    returns:
      type: CallToolResult
      description: '`respond(SearchRulesResult, format)`'
    process: |-
      1. `path` と `tool_name` が両方ある・どちらも無い、`path` があって `operation` が無い、`path` が絶対パスでないときは `ToolError`（渡し方）
      2. `_project_settings(project_dir, env)` で設定を読み、`list_rules` の手順 2 と同じく索引を読む
      3. 効いているエントリを 1 件ずつ、`path` のときは `match_path([entry], path, operation)`、ツールのときは `match_tool([entry], tool_name, arguments or {})`（操作の種別は `mcp`）で当て、当たったエントリの索引と位置を、ルールの場所ごとに初めて当たった順でまとめる。`blocking` はまとめたエントリの `MatchedRule.blocking` のどれかが真か
      4. `respond` で返す
    exceptions:
      - name: ToolError
        condition: 手順 1 の引数の組み合わせの誤り、または `_project_settings` が送出する
        message: 渡し方。`_project_settings` のときはその理由
    unit_tests:
      - name: test_search_rules_when_same_rule
        case: 正常
        summary: 同じルールに当たったエントリを 1 件にまとめ、どれかが止めれば止める
        condition: '同じ `rule` で `on: [read]` と `on: [write]` のエントリが同じパスに当たる。`operation: write`'
        mock: なし
        expected: '`matched` が 1 件で `blocking` が `true`、`entries` が 2 件'
      - name: test_search_rules_when_invalid_arguments
        case: 異常
        summary: 引数の組み合わせの誤りを拒む
        condition: '`path` と `tool_name` の両方、どちらも無し、`operation` 無しの `path`、相対パスの `path`（パラメータ展開）'
        mock: なし
        expected: ToolError
        exception: 手順 1 の引数の組み合わせの誤り、または `_project_settings` が送出する
  - name: check_indexes
    title: 索引のチェック
    container: server/check_tools.py
    usecase: 索引をチェックする
    summary: インターフェース定義「索引のチェック」のツールの本体
    kind: 関数
    scope: public
    args:
      - name: project_dir
        type: str
        required: true
        passing: keyword
        description: プロジェクトの直下
      - name: format
        type: ResponseFormat
        required: false
        default: '"markdown"'
        passing: keyword
        description: 応答の形式
      - name: include_global
        type: bool
        required: false
        default: 'False'
        passing: keyword
        description: ユーザー全体の索引の `paths` の当たらないエントリも確かめるか
      - name: cursor
        type: str | None
        required: false
        default: None
        passing: keyword
        description: 前の呼び出しの `unmatched_scan.next_cursor`
      - name: env
        type: Mapping[str, str]
        required: true
        passing: injected
        description: サーバーを起動した環境変数
      - name: validator
        type: jsonschema.protocols.Validator
        required: true
        passing: injected
        description: '`load_validator` の戻り値'
      - name: scan_time_limit
        type: float
        required: true
        passing: injected
        description: プロジェクトのファイルを辿る時間の上限（秒）
    returns:
      type: CallToolResult
      description: '`respond(CheckIndexesResult, format)`'
    process: |-
      1. `_project_settings(project_dir, env)` で設定を読む。`cursor` があれば `_decode_scan_cursor(cursor, project_dir, include_global)` で続きの位置に戻す
      2. `settings.indexes` を順に `check_index(index, env, validator=validator)` で確かめ、問題を種類ごとに `IndexReport` の一覧へ分ける。`origin` は索引が `settings.project_indexes` に入っていれば `project`、無ければ `global`
      3. 読めた索引のうち `project` のもの（`include_global` が True なら全て）を `read_index` で読み、`scan_unmatched(project_dir, contents, cursor=..., time_limit=scan_time_limit)` で辿る。結果の問題を索引ごとの `unmatched_paths` へ入れる
      4. `unmatched_scan` に辿った状態を入れる。止まったときは `reason` に上限の秒数と `next_cursor` を `cursor` に渡すと続きから辿れる旨、`next_cursor` に `_encode_scan_cursor` の文字列を入れる
      5. `problem_count` に、全ての索引の `hook_error`・`violations`・`missing_rules`・`skipped_entries` と `project` の索引の `unmatched_paths` の件数の合計を入れ、`respond` で返す
    exceptions:
      - name: ToolError
        condition: '`_project_settings` が送出する、または `_decode_scan_cursor` が送出する'
        message: '`_project_settings` と同じ、または `cursor` が使えない旨'
    unit_tests:
      - name: test_check_indexes
        case: 正常
        summary: 問題を種類ごとに分け、件数を合計する
        condition: 違反 1 件とファイルの無いルール 1 件を持つ索引と、無い索引
        mock: なし
        expected: '`problem_count` が 3。無い索引は `hook_error` だけを持つ'
      - name: test_check_indexes_when_unmatched
        case: 正常
        summary: プロジェクトの索引の `paths` の当たらないエントリだけを載せて数える
        condition: '`global.indexes` とプロジェクトの索引の両方に当たらないエントリを 1 件ずつ、`include_global` は既定'
        mock: なし
        expected: '`project` の索引だけが `unmatched_paths` 1 件を持ち、`problem_count` が 1'
      - name: test_check_indexes_when_include_global
        case: 正常
        summary: '`include_global` でユーザー全体の索引も載せ、数えない'
        condition: 前のテストと同じで `include_global=True`
        mock: なし
        expected: 両方の索引が `unmatched_paths` 1 件を持ち、`problem_count` が 1
      - name: test_check_indexes_when_time_limit
        case: 正常
        summary: 辿る時間の上限で止まると続きの位置を返し、渡すと続きから辿る
        condition: 2 ファイルのプロジェクト、`scan_time_limit=0`。返った `next_cursor` を `cursor` に渡して呼び直す
        mock: なし
        expected: 1 回目は `completed` が False で `reason` に秒数と `cursor` を含む。2 回目は `scanned_files` が 2
      - name: test_check_indexes_when_cursor_invalid
        case: 異常
        summary: 使えない `cursor` を断る
        condition: '`cursor: "broken"`'
        mock: なし
        expected: ToolError
        exception: '`_project_settings` が送出する、または `_decode_scan_cursor` が送出する'
  - name: write_index_entry
    title: エントリの書き込み
    container: server/tools.py
    usecase: 索引のエントリを編集する
    summary: インターフェース定義「エントリの書き込み」のツールの本体
    kind: 関数
    scope: public
    side_effects: 索引のファイルを書き換える
    args:
      - name: project_dir
        type: str
        required: true
        passing: keyword
        description: プロジェクトの直下
      - name: index
        type: str
        required: true
        passing: keyword
        description: 書き込む索引の場所
      - name: entry
        type: dict[str, Any]
        required: true
        passing: keyword
        description: 書き込むキーと値
      - name: position
        type: Annotated[int | None, Field(ge=0)]
        required: false
        default: None
        passing: keyword
        description: 書き換えるエントリの位置
      - name: expected_rev
        type: str | None
        required: false
        default: None
        passing: keyword
        description: 書き換える前のバージョン
      - name: remove_keys
        type: list[str] | None
        required: false
        default: None
        passing: keyword
        description: 削除するキー
      - name: dry_run
        type: bool
        required: false
        default: 'False'
        passing: keyword
        description: 書き込まずに確かめるか
      - name: env
        type: Mapping[str, str]
        required: true
        passing: injected
        description: サーバーを起動した環境変数
      - name: locks
        type: IndexLocks
        required: true
        passing: injected
