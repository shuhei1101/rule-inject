title: "MCP サーバー / 索引のチェック"
lead: 索引をフックと同じ読み取り・JSON Schema・ルールの場所の実在の順に確かめ、問題を返す。書く前と書いた後の索引を比べ、新しく出た問題だけを返す。プロジェクトのファイルを辿り、`paths` の当たらないエントリを返す。`features/index` のサブフィーチャーで、サーバーの依存（`jsonschema`・`ruamel.yaml`）を使うためフックからは読み込まない。
directory: |-
  ```text
  src/rule_inject/features/index/check/
  ├── __init__.py         # 公開 API（load_validator / check_index / check_index_text / check_change / scan_unmatched）
  ├── types.py            # ProblemKind・IndexProblem・IndexCheck・ScanCursor・UnmatchedScan
  ├── service.py          # 索引のチェックと、書く前と書いた後の問題の比較
  ├── scan.py             # プロジェクトのファイルを辿り、paths の当たらないエントリを返す
  └── index.schema.yaml   # 索引の JSON Schema（2020-12）
  ```
enums:
  - name: ProblemKind
    title: 問題の種類
    container: features/index/check/types.py
    usecase: 索引をチェックする
    summary: 索引の問題の種類（Literal）。インターフェース定義「索引のチェック」の応答の一覧に当たる
    values:
      - value: hook_error
        title: フックが読めない
        description: '`hook_error`'
      - value: violation
        title: JSON Schema への違反
        description: '`violations`'
      - value: missing_rule
        title: ルールの場所にファイルが無い
        description: '`missing_rules`'
      - value: skipped_entry
        title: フックが読み飛ばすエントリ
        description: '`skipped_entries`'
      - value: unmatched_path
        title: paths がどのファイルにも当たらない
        description: '`unmatched_paths`。`check_index_text` は返さず、`scan_unmatched` だけが返す'
constants:
  - name: INDEX_SCHEMA_FILE
    title: 索引の JSON Schema のファイル名
    container: features/index/check/service.py
    summary: パッケージに同梱する JSON Schema のファイル名。中身は補足「索引の JSON Schema」
    value: '`"index.schema.yaml"`'
  - name: ROOT_LOCATION
    title: 索引の最上位の場所
    container: features/index/check/service.py
    summary: 問題が索引全体にかかるときの場所
    value: '`"$"`'
  - name: SKIPPED_DIR_NAMES
    title: 辿らないフォルダの名前
    container: features/index/check/scan.py
    summary: プロジェクトのファイルを辿るときに中へ入らないフォルダの名前
    value: '`frozenset({".git"})`'
data_models:
  - name: IndexProblem
    title: 索引の問題
    container: features/index/check/types.py
    usecase: 索引をチェックする
    role: DTO
    summary: 索引の 1 つの問題
    properties:
      - name: kind
        type: ProblemKind
        description: 問題の種類
      - name: location
        type: str
        description: 索引の中の場所。キーは `.`、リストの要素は `[位置]` で結ぶ（例 `rules[0].read_by[1].tools`）。索引全体にかかるときは `ROOT_LOCATION`
      - name: reason
        type: str
        description: 理由。`hook_error`・`skipped_entry` はフックが案内に載せる文言、`violation` は `jsonschema` の `message`、`missing_rule`・`unmatched_path` は解いたルールの場所
      - name: position
        type: int | None
        description: 問題のあるエントリの位置。エントリに属さない問題は `None`
      - name: rev
        type: str | None
        description: 問題のあるエントリのバージョン（`entry_rev`）。エントリに属さない問題は `None`
  - name: IndexCheck
    title: 索引のチェックの結果
    container: features/index/check/types.py
    usecase: 索引をチェックする
    role: DTO
    summary: 索引 1 つの問題の一覧
    properties:
      - name: index
        type: str
        description: チェックした索引の場所
      - name: problems
        type: tuple[IndexProblem, ...]
        description: 見つかった問題。`hook_error` があるときはその 1 件だけ
  - name: ScanCursor
    title: 辿る続きの位置
    container: features/index/check/types.py
    usecase: 索引をチェックする
    role: DTO
    summary: 辿る時間の上限で止まったときの続きの位置（`@dataclass(frozen=True, slots=True, kw_only=True)`）。文字列への変換はサーバーが行う
    properties:
      - name: last_file
        type: str
        description: 辿り終えた最後のファイルの、`project_dir` からの `/` 区切りのパス
      - name: scanned_files
        type: int
        description: 最初の呼び出しから辿ったファイルの数
      - name: unmatched
        type: tuple[tuple[str, int, str], ...]
        description: まだ当たっていないエントリの索引・位置・`rev`
      - name: fingerprint
        type: str
        description: 確かめるエントリの一覧（索引・位置・`rev`）の SHA-256 の 16 進数
  - name: UnmatchedScan
    title: paths の当たらないエントリの検出の結果
    container: features/index/check/types.py
    usecase: 索引をチェックする
    role: DTO
    summary: 1 回の呼び出しで辿った結果（`@dataclass(frozen=True, slots=True, kw_only=True)`）
    properties:
      - name: completed
        type: bool
        description: 最後まで辿れたか
      - name: scanned_files
        type: int
        description: 最初の呼び出しから辿ったファイルの数
      - name: checks
        type: tuple[IndexCheck, ...]
        description: 索引ごとの `unmatched_path` の問題（渡された索引の順、問題は位置の順）。`completed` が `False` のときはどの索引も空
      - name: next_cursor
        type: ScanCursor | None
        description: 続きの位置。`completed` が `True` のときは `None`
functions:
  - name: load_validator
    title: JSON Schema の読み込み
    container: features/index/check/service.py
    usecase: 索引をチェックする
    summary: パッケージに同梱した索引の JSON Schema を読み、検証器を作る
    kind: 関数
    scope: public
    returns:
      type: jsonschema.protocols.Validator
      description: '`Draft202012Validator`'
    process: |-
      1. `importlib.resources` で `INDEX_SCHEMA_FILE` を読み、`ruamel.yaml` の `YAML(typ="safe")` で読む
      2. `Draft202012Validator.check_schema` で Schema 自体を確かめ、`Draft202012Validator` を返す。サーバーはコンポジションルートで 1 回だけ呼ぶ（モジュールに状態を持たない）
    unit_tests:
      - name: test_load_validator
        case: 正常
        summary: 同梱の Schema が Schema として正しく、書式どおりの索引を通す
        condition: '`rule`・`paths`・`exclude`・`tools`・`args`・`on`・`read_by`・`enabled` を全て持つエントリと `default_on` を持つ索引'
        mock: なし
        expected: 例外を送出せず、返した検証器の `iter_errors` が 0 件
  - name: check_index
    title: 索引のチェック
    container: features/index/check/service.py
    usecase: 索引をチェックする
    summary: 索引のファイルを読み、`check_index_text` で確かめる
    kind: 関数
    scope: public
    args:
      - name: index_path
        type: str
        required: true
        passing: positional
        description: 索引の絶対パス
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 環境変数（`rule` の変数参照の展開に使う）
      - name: validator
        type: jsonschema.protocols.Validator
        required: true
        passing: keyword
        description: '`load_validator` の戻り値'
    returns:
      type: IndexCheck
      description: 問題の一覧
    process: |-
      1. UTF-8 で読む。OSError は `hook_error`（場所 `ROOT_LOCATION`、理由 `describe(exc)`）だけを持つ結果を返す（フックが読めない理由と同じ文言）
      2. `check_index_text(index_path, text, env, validator=validator)` を返す
    unit_tests:
      - name: test_check_index_when_missing
        case: 正常
        summary: 無い索引を hook_error で返す
        condition: 存在しない索引のパス
        mock: なし
        expected: 問題が `hook_error` の 1 件で、理由が `load_indexes` の失敗の理由と同じ
  - name: check_index_text
    title: 索引の内容のチェック
    container: features/index/check/service.py
    usecase: 索引をチェックする
    summary: 索引の内容を、フックと同じ読み取り→ JSON Schema → ルールの場所の実在の順に確かめる
    kind: 関数
    scope: public
    args:
      - name: index_path
        type: str
        required: true
        passing: positional
        description: 索引の絶対パス（`rule` を解くフォルダ）
      - name: text
        type: str
        required: true
        passing: positional
        description: 索引の内容
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 環境変数
      - name: validator
        type: jsonschema.protocols.Validator
        required: true
        passing: keyword
        description: '`load_validator` の戻り値'
    returns:
      type: IndexCheck
      description: 問題の一覧。並びは `violation`（`jsonschema` の場所の順）→ `missing_rule` → `skipped_entry`（どちらも位置の順）
    process: |-
      1. `read_index_text(index_path, text, env)` で読む。`IndexReadError` は `hook_error`（場所 `ROOT_LOCATION`、理由はその reason）だけを持つ結果を返し、JSON Schema に照らさずルールの場所も確かめない
      2. `YAML(typ="safe")` で読んだ値を `validator.iter_errors` に渡し、違反ごとに `violation` を作る。場所は `absolute_path` を `.` と `[位置]` で結び（空なら `ROOT_LOCATION`）、理由は `message`。`absolute_path` が `rules` と位置で始まるときは、その位置と、手順 1 の同じ位置のエントリの `rev` を持たせる
      3. 状態が `effective` のエントリのうち、解いたルールの場所にファイルが無いものを `missing_rule`（場所 `rules[{位置}].rule`、理由は解いた場所）にする。`disabled` のエントリは確かめない
      4. 状態が `skipped` のエントリを `skipped_entry`（場所 `rules[{位置}]`、理由はその reason）にする
    unit_tests:
      - name: test_check_index_text
        case: 正常
        summary: 問題の無い索引では問題を返さない
        condition: ルールのファイルがあるエントリ 1 件の索引
        mock: なし（`tmp_path` にルールのファイルを置く）
        expected: '`problems` が空'
      - name: test_check_index_text_when_unparsable
        case: 正常
        summary: フックが読めない索引はその理由だけを返す
        condition: 字下げの崩れた行と、Schema に違反する値を両方持つ内容
        mock: なし
        expected: 問題が `hook_error` の 1 件だけで、理由に行の番号
      - name: test_check_index_text_when_violation
        case: 正常
        summary: JSON Schema への違反を全て並べる
        condition: '`rules[0].paths: []` と `rules[1].on: []` を持つ索引（フックは読める）'
        mock: なし
        expected: '`violation` が 2 件で、場所が `rules[0].paths` と `rules[1].on`、`position` が 0 と 1、`rev` が各エントリのバージョン'
      - name: test_check_index_text_when_missing_rule
        case: 正常
        summary: ルールの場所にファイルが無いエントリを返し、無効のエントリは確かめない
        condition: 'ファイルが無い `rule` のエントリ 2 件（うち 1 件は `enabled: false`）'
        mock: なし
        expected: '`missing_rule` が有効のエントリの 1 件だけで、理由が解いた場所'
      - name: test_check_index_text_when_skipped
        case: 正常
        summary: フックが読み飛ばすエントリを返し、場所は確かめない
        condition: 未設定の変数参照を持つ `rule` のエントリ
        mock: なし
        expected: '`skipped_entry` が 1 件で、理由が `read_index_text` の reason と同じ。`missing_rule` が 0 件'
  - name: new_problems
    title: 新しく出た問題
    container: features/index/check/service.py
    usecase: 索引のエントリを編集する
    summary: 書いた後の索引の問題のうち、書く前に無かったものを返す
    kind: 関数
    scope: public
    args:
      - name: before
        type: IndexCheck
        required: true
        passing: positional
        description: 書く前の索引のチェックの結果
      - name: after
        type: IndexCheck
        required: true
        passing: positional
        description: 書いた後の索引のチェックの結果
      - name: changed_rev
        type: str | None
        required: true
        passing: positional
        description: 書いたエントリの書いた後のバージョン
    returns:
      type: tuple[IndexProblem, ...]
      description: 新しく出た問題（`after` の並びの順）
    process: |-
      1. `after` に `hook_error` があれば、それだけを返す（書く前も読めなかった場合も含む）
      2. 問題を、種類・`rev`・場所の先頭の `rules[{位置}]` を `rules[]` に置き換えた場所・理由の組で照らし合わせる（位置は新規作成・削除でずれるため比べない）
      3. `after` の問題のうち、`rev` が `changed_rev` のものと、手順 2 の組が `before` に無いものを返す
    unit_tests:
      - name: test_new_problems_when_existing
        case: 正常
        summary: もとからある問題は位置がずれても返さない
        condition: '`before` の `rules[1].paths` の違反と、`after` の同じ `rev`・理由の `rules[0].paths` の違反。`changed_rev` は別の値'
        mock: なし
        expected: 空
      - name: test_new_problems_when_changed_entry
        case: 正常
        summary: 書いたエントリの問題は書く前に同じ理由があっても返す
        condition: '`before` と `after` に同じ場所・理由の違反があり、`after` の `rev` が `changed_rev`'
        mock: なし
        expected: その違反 1 件
      - name: test_new_problems_when_hook_error
        case: 正常
        summary: 書いた後にフックが読めなければそれを返す
        condition: '`before` と `after` の両方が同じ `hook_error`'
        mock: なし
        expected: '`after` の `hook_error` 1 件'
  - name: check_change
    title: 書き込みのチェック
    container: features/index/check/service.py
    usecase: 索引のエントリを編集する
    summary: '書く前と書いた後の索引の内容を確かめ、新しく出た問題を `{索引の中の場所}: {理由}` の行で返す。エントリの編集に注入する'
    kind: 関数
    scope: public
    args:
      - name: index_path
        type: str
        required: true
        passing: positional
        description: 索引の絶対パス
      - name: before_text
        type: str
        required: true
        passing: positional
        description: 書く前の索引の内容
      - name: after_text
        type: str
        required: true
        passing: positional
        description: 書いた後の索引の内容
      - name: changed_rev
        type: str | None
        required: true
        passing: positional
        description: 書いたエントリの書いた後のバージョン
      - name: env
        type: Mapping[str, str]
        required: true
        passing: injected
        description: 環境変数（コンポジションルートが `partial` で渡す）
      - name: validator
        type: jsonschema.protocols.Validator
        required: true
        passing: injected
        description: '`load_validator` の戻り値（コンポジションルートが `partial` で渡す）'
    returns:
      type: tuple[str, ...]
      description: 新しく出た問題の行。空なら書いてよい
    process: |-
      1. `check_index_text` で `before_text` と `after_text` を確かめる
      2. `new_problems(before, after, changed_rev)` の問題を `{location}: {reason}` の行にして返す
    unit_tests:
      - name: test_check_change
        case: 正常
        summary: 新しく出た問題を行で返す
        condition: '書く前は問題が無く、書いた後は `rules[0].paths: []` の内容'
        mock: なし
        expected: '`rules[0].paths: {jsonschema の message}` の 1 行'
  - name: scan_unmatched
    title: paths の当たらないエントリの検出
    container: features/index/check/scan.py
    usecase: 索引をチェックする
    summary: '`project_dir` の下のファイルを辿り、効いているエントリのうち `paths` がどのファイルにも当たらないものを返す。時間の上限を超えたら続きの位置を返す'
    kind: 関数
    scope: public
    args:
      - name: project_dir
        type: str
        required: true
        passing: positional
        description: 辿るプロジェクトの絶対パス
      - name: contents
        type: Sequence[IndexContent]
        required: true
        passing: positional
        description: 確かめる索引の読み取り結果（呼び出し元が `include_global` で絞った後）
      - name: cursor
        type: ScanCursor | None
        required: true
        passing: keyword
        description: 前の呼び出しの続きの位置。`None` なら最初から辿る
      - name: time_limit
        type: float
        required: true
        passing: keyword
        description: 1 回の呼び出しで辿る時間の上限（秒）
      - name: clock
        type: Callable[[], float]
        required: false
        default: time.monotonic
        passing: keyword
        description: 経過時間を測る時計（テストで差し替える）
    returns:
      type: UnmatchedScan
      description: 辿った結果
    process: |-
      1. 状態が `effective` で `paths` を持つエントリを索引・位置・`rev` の鍵で並べ、`_fingerprint` で一覧の指紋を出す
      2. `cursor` があり指紋が同じなら、まだ当たっていないエントリを `cursor.unmatched` に絞り、`cursor.last_file` の後から辿る。指紋が違えば `cursor` を使わず最初から辿る
      3. `_iter_project_files` の順にファイルを取り、2 件目からは取る前に `clock()` の経過が `time_limit` 以上かを見る。超えていたら `completed=False` と、最後に辿ったファイル・辿った数・まだ当たっていないエントリ・指紋の `ScanCursor` を返す
      4. ファイルの絶対パスに、まだ当たっていないエントリを `entry_matches_path` で当て、当たったものを外す。全て当たったらその場で辿り終える
      5. 最後まで辿ったら、残ったエントリを索引ごとに `unmatched_path` の `IndexProblem`（場所 `rules[{position}].paths`・理由はルールの場所・位置・`rev`）にし、`contents` の順の `IndexCheck` で返す
    unit_tests:
      - name: test_scan_unmatched
        case: 正常
        summary: どのファイルにも当たらないエントリを返す
        condition: '`src/app.py` だけのプロジェクト、`paths: ["**/*.py"]` と `paths: ["**/*.toml"]` のエントリ'
        mock: なし
        expected: '`completed` が True、`rules[1].paths` の `unmatched_path` 1 件、`next_cursor` が None'
      - name: test_scan_unmatched_when_no_paths
        case: 正常
        summary: '`paths` を持たないエントリと効いていないエントリは確かめない'
        condition: '`tools` だけのエントリと `enabled: false` のエントリ'
        mock: なし
        expected: 問題が空
      - name: test_scan_unmatched_when_time_limit
        case: 正常
        summary: 時間の上限を超えたら続きの位置を返す
        condition: '`docs/readme.md` と `src/app.py` のプロジェクト、`time_limit=0`'
        mock: '`clock` を呼ぶたびに 1 進む時計'
        expected: '`completed` が False、`scanned_files` が 1、`next_cursor.last_file` が `docs/readme.md`、問題が空'
      - name: test_scan_unmatched_when_cursor
        case: 正常
        summary: 続きの位置から辿り、前に当たったエントリは確かめ直さない
        condition: '`docs/readme.md` と `src/app.py` のプロジェクトで、`time_limit=0` の 1 回目の呼び出しが返した `next_cursor` を渡し、`time_limit=30`'
        mock: なし
        expected: '`completed` が True、`scanned_files` が 2、`src/app.py` だけを辿る'
      - name: test_scan_unmatched_when_fingerprint_changed
        case: 正常
        summary: エントリの一覧が変わっていたら最初から辿る
        condition: 指紋の違う `ScanCursor` を渡す
        mock: なし
        expected: '`scanned_files` が全てのファイルの数'
  - name: _iter_project_files
    title: プロジェクトのファイルの列挙
    container: features/index/check/scan.py
    usecase: 索引をチェックする
    summary: '`project_dir` の下のファイルを、パスの部分ごとの名前の順で `/` 区切りの相対パスにして返す'
    kind: 関数
    scope: internal
    args:
      - name: project_dir
        type: str
        required: true
        passing: positional
        description: 辿るプロジェクトの絶対パス
      - name: after
        type: str | None
        required: true
        passing: positional
        description: このファイルより後だけを返す。`None` なら最初から
    returns:
      type: Iterator[str]
      description: ファイルの相対パス
    process: |-
      1. `os.scandir` でフォルダの中を名前の順に読む。`SKIPPED_DIR_NAMES` のフォルダとフォルダへのシンボリックリンクには入らない。読めないフォルダは飛ばす
      2. `after` があるときは、`after` の部分の並びより前のフォルダには入らず、`after` 以前のファイルは返さない
    unit_tests:
      - name: test_iter_project_files
        case: 正常
        summary: 部分ごとの名前の順に返し、`.git` には入らない
        condition: '`b.txt`・`a/z.txt`・`.git/HEAD` のプロジェクト'
        mock: なし
        expected: '`a/z.txt`・`b.txt` の順'
      - name: test_iter_project_files_when_after
        case: 正常
        summary: '`after` より後だけを返す'
        condition: 同じプロジェクト、`after="a/z.txt"`
        mock: なし
        expected: '`b.txt` だけ'
  - name: _fingerprint
    title: 確かめるエントリの指紋
    container: features/index/check/scan.py
    usecase: 索引をチェックする
    summary: 確かめるエントリの索引・位置・`rev` の並びを SHA-256 の 16 進数にする
    kind: 関数
    scope: internal
    args:
      - name: keys
        type: Sequence[tuple[str, int, str]]
        required: true
        passing: positional
        description: 確かめるエントリの索引・位置・`rev`
    returns:
      type: str
      description: 指紋
    process: 1. 並びを JSON にして SHA-256 を取る
notes:
  索引の JSON Schema: |-
    `index.schema.yaml` は JSON Schema 2020-12 を YAML で書き、フックの読み取り（`parse_index`）が受け付ける範囲の内側だけを通す。

    | 場所 | 通す値 |
    | --- | --- |
    | 最上位 | マップ。キーは `default_on`・`rules` だけ |
    | `default_on`・`rules[].on` | `read`・`write`・`mcp` のどれかを 1 つ以上、重なりなく並べたリスト |
    | `rules` | エントリのリストか `null`（`rules:` だけで値が無い） |
    | `rules[]` | マップ。`rule` が必須で、キーは `rule`・`paths`・`exclude`・`tools`・`args`・`on`・`read_by`・`enabled` だけ |
    | `rules[].rule` | 1 字以上の文字列 |
    | `rules[].paths`・`exclude`・`tools` | 1 字以上の文字列を 1 つ以上並べたリスト |
    | `rules[].args`・`read_by[].args` | 引数のキー → 1 字以上の文字列を 1 つ以上並べたリストのマップ（キーを 1 つ以上持つ） |
    | `rules[].read_by` | `tools` が必須で、キーは `tools`・`args` だけのマップを 1 つ以上並べたリスト |
    | `rules[].enabled` | 真偽値 |
