title: "MCP サーバー / エントリの編集"
lead: 索引のエントリを `ruamel.yaml` の round-trip で新規作成・書き換え・削除し、対象のエントリ以外の行を変えずに一時ファイルとの置き換えで書き戻す。書き込みのチェックは注入した関数で行い、索引のチェックを直接は読み込まない。`features/index` のサブフィーチャー。
directory: |-
  ```text
  src/rule_inject/features/index/edit/
  ├── __init__.py   # 公開 API（write_entry / delete_entry / IndexLocks）
  ├── types.py      # CheckChange・EditResult・IndexLocks
  ├── _yaml.py      # round-trip の設定と、書き込む値の書式
  └── service.py    # エントリの書き込み・削除とファイルの置き換え
  ```
function_types:
  - name: CheckChange
    title: 書き込みのチェック
    container: features/index/edit/types.py
    usecase: 索引のエントリを編集する
    summary: '書く前と書いた後の索引の内容を受け、新しく出た問題を `{索引の中の場所}: {理由}` の行で返す。実装は `dev/設計書/モジュール構成/MCPサーバー/索引のチェック.py` の `check_change`'
    args:
      - name: index_path
        type: str
        required: true
        passing: positional
        description: 索引の絶対パス
      - name: before_text
        type: str
        required: true
        passing: positional
        description: 書く前の内容
      - name: after_text
        type: str
        required: true
        passing: positional
        description: 書いた後の内容
      - name: changed_rev
        type: str | None
        required: true
        passing: positional
        description: 書いたエントリの書いた後のバージョン
    returns:
      type: tuple[str, ...]
      description: 新しく出た問題の行。空なら書いてよい
classes:
  - name: IndexLocks
    title: 索引ごとのロック
    container: features/index/edit/types.py
    usecase: 索引のエントリを編集する
    summary: 同じ索引への書き込み・削除を 1 つずつ行うための、索引の場所ごとの `threading.Lock`。サーバーのコンポジションルートが 1 つ作って渡す（モジュールに状態を持たない）
    kind: クラス
    properties:
      - name: _guard
        type: threading.Lock
        access: 内部 (_)
        description: '`_locks` の追加を 1 つずつ行うロック'
      - name: _locks
        type: dict[str, threading.Lock]
        access: 内部 (_)
        description: 索引の場所 → ロック
    methods:
      - name: lock_for
        title: 索引のロック
        summary: 索引の場所のロックを返す。無ければ `_guard` の中で作る
        kind: メソッド
        scope: public
        thread_safe: true
        args:
          - name: index_path
            type: str
            required: true
            passing: positional
            description: シンボリックリンクを解いた索引の場所
        returns:
          type: threading.Lock
          description: 同じ場所には同じロック
        unit_tests:
          - name: test_lock_for
            case: 正常
            summary: 同じ場所には同じロック、違う場所には別のロックを返す
            condition: 同じ場所で 2 回、別の場所で 1 回呼ぶ
            mock: なし
            expected: 1 回目と 2 回目が同じオブジェクトで、3 回目は別のオブジェクト
data_models:
  - name: EditResult
    title: 編集の結果
    container: features/index/edit/types.py
    usecase: 索引のエントリを編集する
    role: DTO
    summary: 書き込み・削除の結果
    properties:
      - name: index
        type: str
        description: 編集した索引の場所
      - name: position
        type: int
        description: 書き込んだ・削除したエントリの位置
      - name: rev
        type: str | None
        description: 書き込んだ後のエントリのバージョン。削除のときは `None`
      - name: rule
        type: str | None
        description: 削除したエントリの `rule`（索引に書いたまま）。書き込みのときは `None`
      - name: written
        type: bool
        description: 索引のファイルを書き換えたか
      - name: diff
        type: str
        description: 書き換えの前後の unified diff（前後 3 行）
constants:
  - name: YAML_WIDTH
    title: 折り返さない行の長さ
    container: features/index/edit/_yaml.py
    summary: 1 行のフロー形式のリストを折り返さないための `YAML.width`（PoC の結果）
    value: '`4096`'
  - name: MAPPING_INDENT
    title: マップの字下げ
    container: features/index/edit/_yaml.py
    summary: '`YAML.indent` の `mapping`'
    value: '`2`'
  - name: SEQUENCE_INDENT
    title: リストの字下げ
    container: features/index/edit/_yaml.py
    summary: '`YAML.indent` の `sequence`'
    value: '`4`'
  - name: SEQUENCE_OFFSET
    title: リストの記号の字下げ
    container: features/index/edit/_yaml.py
    summary: '`YAML.indent` の `offset`（`  - rule:` の字下げ）'
    value: '`2`'
  - name: ENTRY_KEY_ORDER
    title: 新しいエントリのキーの並び
    container: features/index/edit/service.py
    summary: 新規作成するエントリにキーを書く順。ここに無いキーは渡された順で後ろに置く
    value: '`("rule", "paths", "exclude", "tools", "args", "on", "read_by", "enabled")`'
functions:
  - name: round_trip_yaml
    title: round-trip の YAML
    container: features/index/edit/_yaml.py
    usecase: 索引のエントリを編集する
    summary: フックの読み取りが受け付ける書式で書き戻す `YAML` を作る
    kind: 関数
    scope: public
    returns:
      type: ruamel.yaml.YAML
      description: round-trip の `YAML`
    process: '`YAML()` に `width = YAML_WIDTH`、`indent(mapping=MAPPING_INDENT, sequence=SEQUENCE_INDENT, offset=SEQUENCE_OFFSET)`、`preserve_quotes = True` を設定して返す。呼ぶたびに作る（`YAML` はスレッドをまたいで共有しない）'
    unit_tests:
      - name: test_round_trip_yaml
        case: 正常
        summary: 書き換えない索引は 1 バイトも変わらずに書き戻る
        condition: コメント・単一引用符・二重引用符・80 字を超える 1 行のフロー形式のリスト・`  - rule:` の字下げを持つ索引
        mock: なし
        expected: 読んでそのまま書いた内容が元の内容と同じ
  - name: to_yaml_value
    title: 書き込む値
    container: features/index/edit/_yaml.py
    usecase: 索引のエントリを編集する
    summary: ツールの引数の値を、キーごとの書式を指定した round-trip の値にする
    kind: 関数
    scope: public
    args:
      - name: key
        type: str
        required: true
        passing: positional
        description: エントリのキー
      - name: value
        type: Any
        required: true
        passing: positional
        description: ツールの引数の `entry` の値
    returns:
      type: Any
      description: '`CommentedSeq`・`CommentedMap` か、受けたままの値'
    process: |-
      1. 文字列のリストは 1 行のフロー形式（`fa.set_flow_style()`）の `CommentedSeq` にする（`paths`・`exclude`・`tools`・`on`）
      2. `args` のマップはブロックの `CommentedMap` にし、各値を手順 1 のフロー形式にする
      3. `read_by` のリストはブロックの `CommentedSeq` にし、各要素のマップに手順 1・2 を当てる
      4. それ以外（`rule` の文字列・`enabled` の真偽値・型の合わない値）はそのまま返す。型の合わない値は書き込みのチェックが JSON Schema の違反として断る
    unit_tests:
      - name: test_to_yaml_value
        case: 正常
        summary: キーごとの書式で書き出す
        condition: '`paths: ["**/*.py"]`・`args: {doc_path: ["dev/**"]}`・`read_by: [{tools: ["mcp__a"], args: {path: ["x"]}}]` を新しいエントリとして書き出す'
        mock: なし
        expected: "`paths` は 1 行の `['**/*.py']`、`args` と `read_by` はブロックで、その中のリストは 1 行。書き出した内容を `parse_index` が読める"
  - name: write_entry
    title: エントリの書き込み
    container: features/index/edit/service.py
    usecase: 索引のエントリを編集する
    summary: エントリを末尾へ新規作成するか、位置で指したエントリのキーを書き換える。新しい問題が出るときは書き込まない
    kind: 関数
    scope: public
    side_effects: 索引のファイルを置き換える（`dry_run` と例外のときは変えない）
    args:
      - name: index_path
        type: str
        required: true
        passing: positional
        description: シンボリックリンクを解いた索引の絶対パス
      - name: entry
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: 書き込むキーと値
      - name: position
        type: int | None
        required: true
        passing: keyword
        description: 書き換えるエントリの位置。`None` なら末尾に新規作成する
      - name: expected_rev
        type: str | None
        required: true
        passing: keyword
        description: 書き換える前のエントリのバージョン（`position` があるときだけ使う）
      - name: remove_keys
        type: Sequence[str]
        required: true
        passing: keyword
        description: エントリから削除するキー
      - name: dry_run
        type: bool
        required: true
        passing: keyword
        description: 書き込まずにチェックと差分だけを返すか
      - name: locks
        type: IndexLocks
        required: true
        passing: injected
        description: 索引ごとのロック
      - name: check_change
        type: CheckChange
        required: true
        passing: injected
        description: 書き込みのチェック
    returns:
      type: EditResult
      description: 書き込んだ位置・バージョン・差分
    process: |-
      1. `locks.lock_for(index_path)` の中で以下を行う
      2. 索引を UTF-8 で読み、`round_trip_yaml()` で読む。読めない・YAML として読めない・最上位がマップでないときは `IndexEditError`
      3. `position` が無いとき: `rules` が無いか値が空（`None`）なら、ブロックのリストにする。`entry` のキーを `ENTRY_KEY_ORDER` の順に `to_yaml_value` で値にした `CommentedMap` を `rules` の末尾に追加し、その位置を書き込んだ位置にする
      4. `position` があるとき: `rules` のエントリの数以上なら `IndexEditError`（位置が無い旨とエントリの数）。`entry_revs(書く前の内容)[position]` が `expected_rev` と違えば `IndexEditError`（今のバージョンと、一覧を取り直してから呼び直す旨）。`entry_revs` が ValueError を送出したときは `IndexEditError`（フックの読み取りが読めずバージョンを確かめられない旨、その理由、索引を手で直す旨）。`entry` のキーを `to_yaml_value` で置き換え（既にあるキーはその場で、無いキーは末尾に追加）、`remove_keys` のキーを削除する
      5. 書いた後の内容を文字列へ書き出し、`entry_revs(書いた後の内容)[書き込んだ位置]` をバージョンにする。ValueError のときはバージョンを `None` にする（`check_change` がフックの読み取りの失敗を返す）。round-trip で読んだマップは書き換えにだけ使い、バージョンの元にしない
      6. `check_change(index_path, 書く前の内容, 書いた後の内容, バージョン)` が行を返したら `IndexEditError`（書いた後の索引がチェックに通らない旨と、その行を全て）。`dry_run` のときも同じ
      7. 書く前と書いた後の unified diff（前後 3 行、ファイル名は索引のファイル名）を作る
      8. `dry_run` でなければ `_replace_file` で置き換える
    exceptions:
      - name: IndexEditError
        condition: 索引が読めない・YAML として読めない・最上位がマップでない、`position` がエントリの数以上、書く前の内容をフックの読み取りが読めない、`expected_rev` が今のバージョンと違う、`check_change` が行を返した
        message: path は索引の場所、reason はインターフェース定義「エントリの書き込み」の例外の補足にある内容
    unit_tests:
      - name: test_write_entry_when_new
        case: 正常
        summary: 末尾に新規作成し、他の行を変えない
        condition: コメントと引用符を持つエントリ 2 件の索引。`check_change` は空を返す
        mock: '`check_change`'
        expected: '`position` が 2、`written` が `true`。ファイルの差分が追加した行だけで、`rev` が `read_index` のそのエントリの `rev` と同じ'
      - name: test_write_entry_when_no_rules
        case: 正常
        summary: '`rules` が無いか値が空の索引では `rules` をブロックのリストにする'
        condition: '`default_on` だけを持つ索引と、`rules:`（値なし）を持つ索引（パラメータ展開）'
        mock: '`check_change`'
        expected: '`rules` がブロックのリストになり、`position` が 0'
      - name: test_write_entry_when_update
        case: 正常
        summary: 渡したキーだけを書き換え、`remove_keys` を削除する
        condition: '`rules[0]` に `paths`・`on` を渡し、`remove_keys` に `exclude`'
        mock: '`check_change`'
        expected: '`paths`・`on` の行が書き換わり、`exclude` の行が消え、`rule` と他のエントリの行はそのまま'
      - name: test_write_entry_when_dry_run
        case: 正常
        summary: '`dry_run` は差分だけを返して書き換えない'
        condition: '`dry_run: true`'
        mock: '`check_change`'
        expected: '`written` が `false` で `diff` が空でなく、ファイルは元のまま'
      - name: test_write_entry_when_rev_mismatch
        case: 異常
        summary: バージョンが合わなければ書き込まない
        condition: '`expected_rev` に別の値'
        mock: '`check_change`'
        expected: IndexEditError（reason に今のバージョン）で、ファイルは元のまま
        exception: 索引が読めない・YAML として読めない・最上位がマップでない、`position` がエントリの数以上、書く前の内容をフックの読み取りが読めない、`expected_rev` が今のバージョンと違う、`check_change` が行を返した
      - name: test_write_entry_when_position_missing
        case: 異常
        summary: 無い位置へは書き込まない
        condition: 'エントリ 2 件の索引に `position: 2`'
        mock: '`check_change`'
        expected: IndexEditError（reason にエントリの数 2）
        exception: 索引が読めない・YAML として読めない・最上位がマップでない、`position` がエントリの数以上、書く前の内容をフックの読み取りが読めない、`expected_rev` が今のバージョンと違う、`check_change` が行を返した
      - name: test_write_entry_when_unparsable
        case: 異常
        summary: YAML として読めない索引には書き込まない
        condition: 閉じていない `[` を持つ索引と、最上位がリストの索引（パラメータ展開）
        mock: '`check_change`'
        expected: IndexEditError（path が索引の場所）
        exception: 索引が読めない・YAML として読めない・最上位がマップでない、`position` がエントリの数以上、書く前の内容をフックの読み取りが読めない、`expected_rev` が今のバージョンと違う、`check_change` が行を返した
      - name: test_write_entry_when_check_fails
        case: 異常
        summary: 新しい問題が出るときは書き込まない
        condition: '`check_change` が 2 行を返す'
        mock: '`check_change`'
        expected: IndexEditError（reason に 2 行とも含む）で、ファイルは元のまま。`check_change` には書いたエントリのバージョンが渡る
        exception: 索引が読めない・YAML として読めない・最上位がマップでない、`position` がエントリの数以上、書く前の内容をフックの読み取りが読めない、`expected_rev` が今のバージョンと違う、`check_change` が行を返した
      - name: test_write_entry_when_scalar_notation
        case: 正常
        summary: 書き方によらず一覧のバージョンで書き換えられる
        condition: 二重引用符のエスケープ（`"a\tb.md"`）・`[010, 0x1F, 1e3]`・`[~, null]` を持つエントリを、`read_index` のそのエントリの `rev` を `expected_rev` にして書き換える（パラメータ展開）
        mock: '`check_change`'
        expected: '`written` が `true` で、応答の `rev` が書いた後の `read_index` のそのエントリの `rev` と同じ。`check_change` にも同じバージョンが渡る'
      - name: test_write_entry_when_hook_unreadable
        case: 異常
        summary: フックが読めない索引のエントリは書き換えない
        condition: 'YAML としては読めるが `parse_index` が ValueError を送出する索引に `position: 0`'
        mock: '`check_change`'
        expected: IndexEditError（reason にフックの読み取りの理由）で、ファイルは元のまま
        exception: 索引が読めない・YAML として読めない・最上位がマップでない、`position` がエントリの数以上、書く前の内容をフックの読み取りが読めない、`expected_rev` が今のバージョンと違う、`check_change` が行を返した
  - name: delete_entry
    title: エントリの削除
    container: features/index/edit/service.py
    usecase: 索引のエントリを編集する
    summary: 位置で指したエントリを、そのエントリに付いたコメントとともに削除する
    kind: 関数
    scope: public
    side_effects: 索引のファイルを置き換える（`dry_run` と例外のときは変えない）
    args:
      - name: index_path
        type: str
        required: true
        passing: positional
        description: シンボリックリンクを解いた索引の絶対パス
      - name: position
        type: int
        required: true
        passing: keyword
        description: 削除するエントリの位置
      - name: expected_rev
        type: str
        required: true
        passing: keyword
        description: 削除するエントリのバージョン
      - name: dry_run
        type: bool
        required: true
        passing: keyword
        description: 書き込まずに差分だけを返すか
      - name: locks
        type: IndexLocks
        required: true
        passing: injected
        description: 索引ごとのロック（`write_entry` と同じもの）
    returns:
      type: EditResult
      description: 削除したエントリの `rule` と差分
    process: |-
      1. `write_entry` の手順 1・2・4 と同じくロックの中で読み、位置とバージョンを確かめる。バージョンを求められた索引は `parse_index` が読め、`rules` はエントリを `- ` で並べたブロックのリストに限られる（フロー形式は `parse_index` が拒む）
      2. 除く行の範囲を決める。行の番号（0 始まり）は、エントリの開始を `rules.lc.item(位置)`、最上位のキーを最上位のマップの `lc.key(キー)` から取る
         - エントリの最後の内容の行: そのエントリの開始の行から、次のエントリの開始の行（最後のエントリのときは `rules` の次の最上位のキーの行か、ファイルの終わり）の手前までのうち、空行とコメントだけの行を除いた最後の行
         - 始まり: 1 つ前のエントリの最後の内容の行の次の行。先頭のエントリのときは `rules` のキーの行の次の行
         - 終わり: 対象のエントリの最後の内容の行
         - 対象の直前のコメント行・対象の中のコメント・対象の行末のコメントが除かれ、前のエントリの行末のコメントと次のエントリの直前のコメント行は残る
      3. 書く前の内容からその範囲の行を除く。唯一のエントリを除いたときは `rules:` だけが残る
      4. `write_entry` の手順 7・8 と同じく差分を作り、`dry_run` でなければ置き換える。チェックは行わない
    exceptions:
      - name: IndexEditError
        condition: 索引が読めない・YAML として読めない・最上位がマップでない、`position` がエントリの数以上、書く前の内容をフックの読み取りが読めない、`expected_rev` が今のバージョンと違う
        message: '`write_entry` と同じ'
    unit_tests:
      - name: test_delete_entry
        case: 正常
        summary: 対象のエントリとそのコメントだけを除き、前後のエントリのコメントを残す
        condition: 各エントリの直前にコメント行を持ち、1 つ目が行末のコメント、2 つ目が中のコメントを持つエントリ 3 件と、その後ろの `default_on` を持つ索引。`rules[0]`・`rules[1]`・`rules[2]` を削除する（パラメータ展開）
        mock: なし
        expected: 差分が対象のエントリの行・その中と行末のコメント・直前のコメント行だけで、前のエントリの行末のコメント・次のエントリの直前のコメント行・`default_on` が元のまま。`rule` が書いたままの値で、残った内容を `parse_index` が読め、エントリが 1 つ減っている
      - name: test_delete_entry_when_only_entry
        case: 正常
        summary: 唯一のエントリを削除すると `rules:` だけが残る
        condition: エントリ 1 件の索引の `rules[0]` を削除する
        mock: なし
        expected: '`rules:` の行が残り、`parse_index` がエントリ 0 件として読める'
      - name: test_delete_entry_when_rev_mismatch
        case: 異常
        summary: バージョンが合わなければ削除しない
        condition: '`expected_rev` に別の値'
        mock: なし
        expected: IndexEditError で、ファイルは元のまま
        exception: 索引が読めない・YAML として読めない・最上位がマップでない、`position` がエントリの数以上、書く前の内容をフックの読み取りが読めない、`expected_rev` が今のバージョンと違う
      - name: test_delete_entry_when_hook_unreadable
        case: 異常
        summary: フックが読めない索引からは削除しない
        condition: '`on: [foo]` を持つ索引と、`rules: [{rule: a.md}, {rule: b.md}]` の索引の `rules[0]`（パラメータ展開）'
        mock: なし
        expected: IndexEditError（reason にフックの読み取りの理由と行の番号）で、ファイルは元のまま
        exception: 索引が読めない・YAML として読めない・最上位がマップでない、`position` がエントリの数以上、書く前の内容をフックの読み取りが読めない、`expected_rev` が今のバージョンと違う
  - name: _replace_file
    title: ファイルの置き換え
    container: features/index/edit/service.py
    usecase: 索引のエントリを編集する
    summary: 同じフォルダの一時ファイルに書き、索引と置き換える
    kind: 関数
    scope: internal
    side_effects: 索引のファイルを置き換える
    args:
      - name: index_path
        type: str
        required: true
        passing: positional
        description: 索引の絶対パス
      - name: text
        type: str
        required: true
        passing: positional
        description: 書き込む内容
    returns:
      type: None
      description: なし
    process: |-
      1. `tempfile.NamedTemporaryFile(dir=索引のフォルダ, delete=False)` に UTF-8 で書き、`fsync` する
      2. 索引のパーミッションを一時ファイルへ写し、`os.replace` で置き換える。失敗したら一時ファイルを消し、`IndexEditError`（reason は `describe(exc)`）を送出する
    exceptions:
      - name: IndexEditError
        condition: 一時ファイルを書けない・置き換えられない
        message: path は索引の場所、reason は `describe(exc)`
