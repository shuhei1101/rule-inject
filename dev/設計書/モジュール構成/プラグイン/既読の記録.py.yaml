title: "プラグイン / 既読の記録"
lead: セッションごとの既読の記録ファイルと案内済みの記録ファイルと既読の履歴ファイル（ER 図「既読の記録」）の読み・追記・削除・掃除。
directory: |-
  ```text
  src/rule_inject/features/record/
  ├── __init__.py   # 公開 API
  ├── types.py      # ReadMethod・ReadEntry
  └── service.py    # 記録ファイルの読み・追記・削除・掃除と、既読の履歴の追記と、本文のハッシュ
  ```
constants:
  - name: SESSION_ID_PATTERN
    title: セッションの識別子の形式
    container: features/record/service.py
    summary: 記録ファイル名に使える session_id の形式
    value: '`^[A-Za-z0-9_-]{1,128}$`'
  - name: GUIDED_SUFFIX
    title: 案内済みの記録ファイルの名前の末尾
    container: features/record/service.py
    summary: 案内済みの記録ファイルは `{session_id}{GUIDED_SUFFIX}`
    value: '`.guided.txt`'
  - name: HISTORY_SUFFIX
    title: 既読の履歴ファイルの名前の末尾
    container: features/record/service.py
    summary: 既読の履歴ファイルは `{session_id}{HISTORY_SUFFIX}`
    value: '`.history.jsonl`'
  - name: HASH_PREFIX
    title: 本文のハッシュの頭
    container: features/record/service.py
    summary: 本文のハッシュは `{HASH_PREFIX}{SHA-256 の 16 進数}`
    value: '`sha256:`'
  - name: FIELD_SEPARATOR
    title: 既読の行の区切り
    container: features/record/service.py
    summary: 既読の記録の 1 行で、場所と本文のハッシュを区切る文字
    value: '`\t`'
functions:
  - name: is_valid_session_id
    title: セッションの識別子の判定
    container: features/record/service.py
    usecase: 共通
    summary: session_id が記録ファイル名に使える形式かを返す
    kind: 関数
    scope: public
    args:
      - name: session_id
        type: object
        required: true
        passing: positional
        description: 入力の値
    returns:
      type: bool
      description: 文字列で `SESSION_ID_PATTERN` に合うか
    unit_tests:
      - name: test_is_valid_session_id
        case: 正常
        summary: UUID を許す
        condition: '`2f9c1b7e-0d54-4b7a-9d4f-5c3a1e2b7f10`'
        mock: なし
        expected: 'True'
      - name: test_is_valid_session_id_when_invalid
        case: 正常
        summary: 形式が外れた値を拒む
        condition: '`../x`、空文字、129 文字、None'
        mock: なし
        expected: すべて False
  - name: read_record
    title: 既読の読み込み
    container: features/record/service.py
    usecase: 共通
    summary: そのセッションの既読の行の集合を返す
    kind: 関数
    scope: public
    args:
      - name: state_dir
        type: Path
        required: true
        passing: positional
        description: 記録フォルダ
      - name: session_id
        type: str
        required: true
        passing: positional
        description: 形式を確かめた session_id
    returns:
      type: frozenset[ReadEntry]
      description: 既読の行。ファイルが無ければ空
    process: |-
      1. `{state_dir}/{session_id}.txt` を UTF-8 で読む
      2. 空行を除いた行を、最初の `FIELD_SEPARATOR` で場所とハッシュに分ける
         - `FIELD_SEPARATOR` を含まない行・場所が空の行・ハッシュが `HASH_PREFIX` で始まらない行は読み飛ばす
      3. 集合にする（重なりは 1 つになる）
    exceptions:
      - name: RecordReadError
        condition: ファイルはあるが読めない（FileNotFoundError 以外の OSError）
    unit_tests:
      - name: test_read_record
        case: 正常
        summary: 行を集合で返す
        condition: 同じ場所とハッシュの行が 2 行と、同じ場所で別のハッシュの行が 1 行の記録ファイル
        mock: なし
        expected: 2 件の集合（場所とハッシュが書いた値）
      - name: test_read_record_when_missing
        case: 正常
        summary: ファイルが無ければ空
        condition: 記録ファイルが無い
        mock: なし
        expected: 空の集合
      - name: test_read_record_when_unreadable
        case: 異常
        summary: 読めない
        condition: 読み取り権限の無い記録ファイル（`chmod 000`）
        mock: なし
        expected: RecordReadError（path が記録ファイル）
        exception: ファイルはあるが読めない
      - name: test_read_record_when_without_hash
        case: 正常
        summary: ハッシュを持たない行は読み飛ばす
        condition: 場所だけの行・`\tsha256:…` のように場所が空の行・`{場所}\tmd5:…` の行と、場所とハッシュの行が 1 行の記録ファイル
        mock: なし
        expected: 場所とハッシュの行の 1 件だけの集合
  - name: append_record
    title: 既読の追記
    container: features/record/service.py
    usecase: 共通
    summary: 既読の行を 1 行ずつ記録ファイルへ追記する
    kind: 関数
    scope: public
    side_effects: 記録フォルダを作り、記録ファイルへ追記する
    args:
      - name: state_dir
        type: Path
        required: true
        passing: positional
        description: 記録フォルダ
      - name: session_id
        type: str
        required: true
        passing: positional
        description: 形式を確かめた session_id
      - name: entries
        type: Sequence[ReadEntry]
        required: true
        passing: positional
        description: 既読にする行
    returns:
      type: None
      description: なし
    process: |-
      1. `entries` が空なら何もしない
      2. 行ごとに `{location}{FIELD_SEPARATOR}{hash}` にする
      3. 記録フォルダを作る（親も含め、あればそのまま）
      4. 全行を 1 つの文字列にし、`O_APPEND` で開いて 1 回で書く
    exceptions:
      - name: RecordWriteError
        condition: フォルダが作れない・追記できない（OSError）
    unit_tests:
      - name: test_append_record
        case: 正常
        summary: フォルダを作って追記する
        condition: まだ無い記録フォルダ、2 件の行を 2 回に分けて追記
        mock: なし
        expected: 記録ファイルに `{場所}\t{ハッシュ}` の 4 行が追記の順である
      - name: test_append_record_when_empty
        case: 正常
        summary: 空なら書かない
        condition: '`entries` が空'
        mock: なし
        expected: 記録ファイルもフォルダも作らない
      - name: test_append_record_when_unwritable
        case: 異常
        summary: 書けない
        condition: 書き込み権限の無い記録フォルダ（`chmod 555`）
        mock: なし
        expected: RecordWriteError（path が記録フォルダか記録ファイル）
        exception: フォルダが作れない・追記できない
  - name: delete_record
    title: 既読の削除
    container: features/record/service.py
    usecase: 共通
    summary: そのセッションの記録ファイルを削除する
    kind: 関数
    scope: public
    side_effects: 記録ファイルを削除する
    args:
      - name: state_dir
        type: Path
        required: true
        passing: positional
        description: 記録フォルダ
      - name: session_id
        type: str
        required: true
        passing: positional
        description: 形式を確かめた session_id
    returns:
      type: None
      description: なし（ファイルが無ければ何もしない）
    exceptions:
      - name: RecordDeleteError
        condition: ファイルはあるが削除できない（FileNotFoundError 以外の OSError）
    unit_tests:
      - name: test_delete_record
        case: 正常
        summary: 対象のセッションだけを削除する
        condition: 2 セッション分の記録ファイル
        mock: なし
        expected: 対象のファイルが無く、別のファイルが残る
      - name: test_delete_record_when_missing
        case: 正常
        summary: 無ければ何もしない
        condition: 記録ファイルが無い
        mock: なし
        expected: 例外を送出しない
      - name: test_delete_record_when_undeletable
        case: 異常
        summary: 削除できない
        condition: 記録フォルダを書き込み権限なし（`chmod 555`）
        mock: なし
        expected: RecordDeleteError
        exception: ファイルはあるが削除できない
  - name: record_exists
    title: 記録の有無
    container: features/record/service.py
    usecase: 共通
    summary: そのセッションの記録ファイルがあるかを返す（圧縮の後の削除できずに残った記録の確認に使う）
    kind: 関数
    scope: public
    args:
      - name: state_dir
        type: Path
        required: true
        passing: positional
        description: 記録フォルダ
      - name: session_id
        type: str
        required: true
        passing: positional
        description: 形式を確かめた session_id
    returns:
      type: bool
      description: あれば True
    unit_tests:
      - name: test_record_exists
        case: 正常
        summary: 有無を返す
        condition: 記録ファイルがあるセッションと無いセッション
        mock: なし
        expected: True と False
  - name: sweep_records
    title: 既読の掃除
    container: features/record/service.py
    usecase: 終わったセッションの既読の記録が掃除される
    summary: 保持期間を過ぎた別のセッションの既読の記録ファイルと案内済みの記録ファイルと既読の履歴ファイルを削除し、削除できなかったものを返す
    kind: 関数
    scope: public
    side_effects: 記録ファイルを削除する
    args:
      - name: state_dir
        type: Path
        required: true
        passing: positional
        description: 記録フォルダ
      - name: keep_session_id
        type: str
        required: true
        passing: positional
        description: 削除しないセッション（始まったセッション）の、形式を確かめた session_id
      - name: now
        type: Callable[[], float]
        required: false
        default: time.time
        passing: injected
        description: 現在の時刻（UNIX 時刻の秒）を返す関数
      - name: retention_days
        type: int
        required: true
        passing: keyword
        description: 保持日数（1 以上。呼び出し元が `read_retention_days` で読む）
    returns:
      type: tuple[RecordDeleteError, ...]
      description: 削除できなかった記録ファイルごとの失敗。全て削除できたか削除するものが無ければ空
    process: |-
      1. `os.scandir(state_dir)` で直下を列挙する。フォルダが無ければ（FileNotFoundError）空を返す（フォルダは作らない）
      2. 名前が `{session_id}{GUIDED_SUFFIX}`・`{session_id}{HISTORY_SUFFIX}`・`{session_id}{RECORD_SUFFIX}` の形式（末尾を `GUIDED_SUFFIX`・`HISTORY_SUFFIX` から先に外し、残りが `is_valid_session_id` に合う）で、シンボリックリンクを辿らずに通常のファイルで、`keep_session_id` のものでない項目だけを対象にする
      3. 最終更新（`st_mtime`）が `now() - retention_days 日` より前のものを削除する。既読の記録・案内済みの記録・既読の履歴は、それぞれ自分の最終更新で比べる。削除する前に無くなっていたもの（FileNotFoundError）は削除した状態と同じとして扱う
      4. 削除できないもの（その他の OSError）は RecordDeleteError にして集め、残りの掃除を続ける
    exceptions:
      - name: OSError
        condition: 記録フォルダはあるが列挙できない（FileNotFoundError 以外）。捕まえずに送出し、フックの最上位が `unexpected` として扱う
    unit_tests:
      - name: test_sweep_records
        case: 正常
        summary: 保持期間を過ぎた記録ファイルだけを削除する
        condition: '`retention_days` が 30、最終更新が 31 日前と 29 日前の記録ファイル、`now` を固定'
        mock: '`now`'
        expected: 31 日前のファイルが無く 29 日前のファイルが残る。戻り値は空
      - name: test_sweep_records_when_kept_session
        case: 正常
        summary: 始まったセッションの記録は削除しない
        condition: '`keep_session_id` の記録ファイルの最終更新が 31 日前'
        mock: '`now`'
        expected: そのファイルが残る
      - name: test_sweep_records_when_not_record
        case: 正常
        summary: 記録ファイルでないものは削除しない
        condition: 最終更新が 31 日前の `rule-inject.log`、名前が session_id の形式式に合わない `a b.txt`、`.txt` で終わるサブフォルダ、`.txt` で終わるシンボリックリンク
        mock: '`now`'
        expected: どれも残る
      - name: test_sweep_records_when_missing
        case: 正常
        summary: 記録フォルダが無ければ何もしない
        condition: まだ無い記録フォルダ
        mock: なし
        expected: 戻り値が空で、フォルダを作らない
      - name: test_sweep_records_when_undeletable
        case: 異常
        summary: 削除できない記録ファイルを返す
        condition: 最終更新が 31 日前の記録ファイルを置き、記録フォルダを書き込み権限なし（`chmod 555`）
        mock: '`now`'
        expected: RecordDeleteError が 1 件（path がその記録ファイル）で、ファイルが残る
        exception: 削除できない記録ファイルを払い出さずに返す
      - name: test_sweep_records_when_guided
        case: 正常
        summary: 保持期間を過ぎた案内済みの記録ファイルも削除する
        condition: 最終更新が 31 日前と 29 日前の `{id}.guided.txt`、`keep_session_id` の 31 日前の `{id}.guided.txt`、名前が形式に合わない 31 日前の `a b.guided.txt`
        mock: '`now`'
        expected: 31 日前の別のセッションの `.guided.txt` だけが無く、残りは残る
      - name: test_sweep_records_when_history
        case: 正常
        summary: 保持期間を過ぎた既読の履歴ファイルも削除する
        condition: 最終更新が 31 日前と 29 日前の `{id}.history.jsonl`、`keep_session_id` の 31 日前の `{id}.history.jsonl`、名前が形式に合わない 31 日前の `a b.history.jsonl`
        mock: '`now`'
        expected: 31 日前の別のセッションの `.history.jsonl` だけが無く、残りは残る
  - name: read_guided
    title: 案内済みの読み込み
    container: features/record/service.py
    usecase: 未読のルールの案内を受ける
    summary: そのセッションで止めずに案内した場所の集合を返す
    kind: 関数
    scope: public
    args:
      - name: state_dir
        type: Path
        required: true
        passing: positional
        description: 記録フォルダ
      - name: session_id
        type: str
        required: true
        passing: positional
        description: 形式を確かめた session_id
    returns:
      type: frozenset[str]
      description: 案内済みの場所。ファイルが無ければ空
    process: |-
      1. `{state_dir}/{session_id}{GUIDED_SUFFIX}` を UTF-8 で読み、空行を除いた行の集合にする（無ければ空）
      2. ファイルを読んで空行を除く部分だけを `read_record` と共通の内部の関数で行う。場所とハッシュに分ける処理は `read_record` だけが持つ
    exceptions:
      - name: RecordReadError
        condition: ファイルはあるが読めない（FileNotFoundError 以外の OSError）
    unit_tests:
      - name: test_read_guided
        case: 正常
        summary: 案内済みの記録を集合で返す
        condition: 同じセッションの `{id}.txt`（場所 A とハッシュの行）と `{id}.guided.txt`（場所 B が 2 行）
        mock: なし
        expected: B だけの 1 件の集合（既読の記録を読まない）
      - name: test_read_guided_when_missing
        case: 正常
        summary: ファイルが無ければ空
        condition: 案内済みの記録ファイルが無い
        mock: なし
        expected: 空の集合
      - name: test_read_guided_when_unreadable
        case: 異常
        summary: 読めない
        condition: 読み取り権限の無い案内済みの記録ファイル（`chmod 000`）
        mock: なし
        expected: RecordReadError（path が `{id}.guided.txt`）
        exception: ファイルはあるが読めない
  - name: append_guided
    title: 案内済みの追記
    container: features/record/service.py
    usecase: 未読のルールの案内を受ける
    summary: 止めずに案内した場所を 1 行ずつ案内済みの記録ファイルへ追記する
    kind: 関数
    scope: public
    side_effects: 記録フォルダを作り、案内済みの記録ファイルへ追記する
    args:
      - name: state_dir
        type: Path
        required: true
        passing: positional
        description: 記録フォルダ
      - name: session_id
        type: str
        required: true
        passing: positional
        description: 形式を確かめた session_id
      - name: locations
        type: Sequence[str]
        required: true
        passing: positional
        description: 案内済みにする場所
    returns:
      type: None
      description: なし
    process: 1. `append_record` と共通の内部の関数で、`{state_dir}/{session_id}{GUIDED_SUFFIX}` へ同じ規則（空なら書かない・フォルダを作る・`O_APPEND` で 1 回に書く）で追記する
    exceptions:
      - name: RecordWriteError
        condition: フォルダが作れない・追記できない（OSError）
    unit_tests:
      - name: test_append_guided
        case: 正常
        summary: 案内済みの記録ファイルへ追記する
        condition: まだ無い記録フォルダ、2 件の場所
        mock: なし
        expected: '`{id}.guided.txt` に 2 行があり、`{id}.txt` は作らない'
      - name: test_append_guided_when_unwritable
        case: 異常
        summary: 書けない
        condition: 記録フォルダを書き込み権限なし（`chmod 500`）
        mock: なし
        expected: RecordWriteError（path が `{id}.guided.txt`）
        exception: フォルダが作れない・追記できない
  - name: delete_guided
    title: 案内済みの削除
    container: features/record/service.py
    usecase: 圧縮で既読の記録が捨てられる
    summary: そのセッションの案内済みの記録ファイルを削除する（ファイルが無ければ何もしない）
    kind: 関数
    scope: public
    side_effects: 案内済みの記録ファイルを削除する
    args:
      - name: state_dir
        type: Path
        required: true
        passing: positional
        description: 記録フォルダ
      - name: session_id
        type: str
        required: true
        passing: positional
        description: 形式を確かめた session_id
    returns:
      type: None
      description: なし
    process: 1. `delete_record` と共通の内部の関数で `{state_dir}/{session_id}{GUIDED_SUFFIX}` を削除する。無ければ（FileNotFoundError）何もしない
    exceptions:
      - name: RecordDeleteError
        condition: ファイルはあるが削除できない（FileNotFoundError 以外の OSError）
    unit_tests:
      - name: test_delete_guided
        case: 正常
        summary: 案内済みの記録ファイルだけを削除する
        condition: 同じセッションの `{id}.txt` と `{id}.guided.txt`
        mock: なし
        expected: '`{id}.guided.txt` が無く `{id}.txt` が残る'
      - name: test_delete_guided_when_missing
        case: 正常
        summary: ファイルが無ければ何もしない
        condition: 案内済みの記録ファイルが無い
        mock: なし
        expected: 例外を送出しない
      - name: test_delete_guided_when_undeletable
        case: 異常
        summary: 削除できない
        condition: 案内済みの記録ファイルを置き、記録フォルダを書き込み権限なし（`chmod 555`）
        mock: なし
        expected: RecordDeleteError（path が `{id}.guided.txt`）
        exception: ファイルはあるが削除できない
  - name: append_history
    title: 既読の履歴の追記
    container: features/record/service.py
    usecase: ルールを読んだことが記録される
    summary: 既読にした場所ごとに、時刻・セッション・読み方・ツール名・場所の JSON を 1 行ずつ既読の履歴ファイルへ追記する
    kind: 関数
    scope: public
    side_effects: 記録フォルダを作り、既読の履歴ファイルへ追記する
    args:
      - name: state_dir
        type: Path
        required: true
        passing: positional
        description: 記録フォルダ
      - name: session_id
        type: str
        required: true
        passing: positional
        description: 形式を確かめた session_id
      - name: locations
        type: Sequence[str]
        required: true
        passing: positional
        description: 既読にした場所
      - name: method
        type: ReadMethod
        required: true
        passing: keyword
        description: 読み方
      - name: tool
        type: str
        required: true
        passing: keyword
        description: 既読にしたツールの名前（`Read`・`Bash`・MCP のツールの完全名）
      - name: now
        type: Callable[[], datetime]
        required: false
        default: 現在の UTC の時刻
        passing: injected
        description: 時刻の取得
    returns:
      type: None
      description: なし
    process: |-
      1. `locations` が空なら何もしない
      2. `now()` を 1 回だけ呼び、秒までの UTC の ISO 8601（`2026-10-24T09:30:00Z`）にする
      3. 場所ごとに `time`・`session_id`・`method`・`tool`・`location` を持つ JSON（`ensure_ascii=False`、改行を含まない）を 1 行にする
      4. `append_record` と共通の内部の関数と同じ規則（フォルダを作る・`O_APPEND` で 1 回に書く・一部だけ書けたら失敗）で `{state_dir}/{session_id}{HISTORY_SUFFIX}` へ書く。失敗は HistoryWriteError にする
    exceptions:
      - name: HistoryWriteError
        condition: フォルダが作れない・追記できない（OSError）
    unit_tests:
      - name: test_append_history
        case: 正常
        summary: 場所ごとに JSON を 1 行ずつ追記する
        condition: まだ無い記録フォルダ、2 件の場所、`method` が `mcp`、`tool` が `mcp__docs__get_doc`、`now` は 2026-10-24T09:30:00.5+00:00
        mock: '`now`'
        expected: '`{id}.history.jsonl` に 2 行。各行の `time` が `2026-10-24T09:30:00Z`、`session_id`・`method`・`tool` が渡した値、`location` が場所の順。`{id}.txt` は作らない'
      - name: test_append_history_when_empty
        case: 正常
        summary: 空なら書かない
        condition: '`locations` が空'
        mock: なし
        expected: 履歴ファイルもフォルダも作らない
      - name: test_append_history_when_unwritable
        case: 異常
        summary: 書けない
        condition: 記録フォルダに `{id}.history.jsonl` という名前のフォルダを置く
        mock: なし
        expected: HistoryWriteError（path が `{id}.history.jsonl`）
        exception: フォルダが作れない・追記できない
  - name: hash_locations
    title: 本文のハッシュの付与
    container: features/record/service.py
    usecase: ルールを読んだことが記録される
    summary: 既読にする場所ごとに今のルールのファイルの本文のハッシュを取り、既読の行にして返す
    kind: 関数
    scope: public
    args:
      - name: locations
        type: Sequence[str]
        required: true
        passing: positional
        description: 既読にする場所（解決後の絶対パス）
    returns:
      type: tuple[ReadEntry, ...]
      description: ハッシュを取れた場所の既読の行（`locations` の順）。読めなかった場所は含まない
    process: |-
      1. 場所ごとに、ファイルの中身をバイト列で読み、SHA-256 の 16 進数に `HASH_PREFIX` を付ける（本文のハッシュ）
         - 読めない場合（OSError。無い・フォルダ・権限が無い）、その場所を読み飛ばす
      2. ハッシュを取れた場所を `ReadEntry` にして返す
    unit_tests:
      - name: test_hash_locations
        case: 正常
        summary: 場所ごとに本文のハッシュを付ける
        condition: 中身が `test` のファイルと、中身が空のファイル
        mock: なし
        expected: 2 件。`test` のファイルの `hash` が `sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08`、空のファイルの `hash` が `sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855`
      - name: test_hash_locations_when_unreadable
        case: 正常
        summary: 読めない場所は含めない
        condition: 無いファイル・フォルダ・読み取り権限の無いファイル（`chmod 000`）と、読めるファイル
        mock: なし
        expected: 読めるファイルの 1 件だけ
  - name: current_read_locations
    title: 今の本文での既読の判定
    container: features/record/service.py
    usecase: 未読のルールの案内を受ける
    summary: 当たったルールの場所のうち、既読の行に場所と今の本文のハッシュの組があるものを返す
    kind: 関数
    scope: public
    args:
      - name: entries
        type: frozenset[ReadEntry]
        required: true
        passing: positional
        description: '`read_record` で読んだ既読の行'
      - name: locations
        type: Iterable[str]
        required: true
        passing: positional
        description: 当たったルールの場所
    returns:
      type: frozenset[str]
      description: 既読として扱う場所
    process: |-
      1. `entries` の場所に無い場所は、ハッシュを取らずに未読とする
      2. 残りの場所の今の本文のハッシュを `hash_locations` と同じ方法で取る（本文のハッシュの付与）
      3. 場所と今のハッシュの組が `entries` にある場所を返す。ハッシュを取れない場所は未読とする
    unit_tests:
      - name: test_current_read_locations
        case: 正常
        summary: 今の本文のハッシュの組がある場所を既読にする
        condition: 記録に場所 A と A の今のハッシュの行。場所は A と、記録に無い B
        mock: なし
        expected: A だけの集合
      - name: test_current_read_locations_when_changed
        case: 正常
        summary: 本文が変わった場所は未読にする
        condition: 記録に場所 A と書き換える前のハッシュの行。A のファイルの中身を書き換える
        mock: なし
        expected: 空の集合
      - name: test_current_read_locations_when_reread
        case: 正常
        summary: 読み直した新しいハッシュの行があれば既読にする
        condition: 記録に場所 A の書き換える前のハッシュの行と、書き換えた後のハッシュの行
        mock: なし
        expected: A だけの集合
      - name: test_current_read_locations_when_unreadable
        case: 正常
        summary: 今のハッシュを取れない場所は未読にする
        condition: 記録に場所 A の行があり、A のファイルを削除する
        mock: なし
        expected: 空の集合
test_files:
  - tests/unit/rule_inject/features/record/test_service.py
enums:
  - name: ReadMethod
    title: 読み方
    container: features/record/types.py
    usecase: ルールを読んだことが記録される
    summary: 既読の履歴の `method` の値（StrEnum）
    values:
      - value: read
        title: Read
        description: Read で読んだ
      - value: bash
        title: Bash
        description: Bash の読むコマンドで読んだ
      - value: mcp
        title: MCP のツール
        description: 'MCP のツールの結果の文書か、`read_by` に当たった MCP のツールの呼び出しで読んだ'
data_models:
  - name: ReadEntry
    title: 既読の行
    container: features/record/types.py
    usecase: 共通
    role: DTO
    summary: 既読の記録の 1 行（`@dataclass(frozen=True, slots=True, kw_only=True)`）
    properties:
      - name: location
        type: str
        description: ルールの場所（解決後の絶対パス。改行とタブを含まない）
      - name: hash
        type: str
        description: 既読にした時点のルールのファイルの中身の SHA-256（`sha256:{16 進数}`）
