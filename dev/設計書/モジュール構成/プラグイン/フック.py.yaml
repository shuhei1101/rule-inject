  - name: main
    title: フックの起動
    container: hooks/run.py（プラグインの直下）
    usecase: 共通
    summary: '`src/` を sys.path に追加し、引数で指したフックを `run_hook` で動かす'
    kind: 関数
    scope: public
    args:
      - name: argv
        type: list[str]
        required: true
        passing: positional
        description: '`["rule_guide"]` などフックの名前 1 つ'
    returns:
      type: int
      description: 終了コード（常に 0）
    process: |-
      1. 冒頭で `sys.version_info` を確かめる。`MIN_PYTHON` より古ければ、パッケージを import せずに、標準入力の `hook_event_name` が PreToolUse・PostToolUse・SessionStart ならバージョンが足りないことを additionalContext で返し（`sweep_read` は同じ SessionStart の `work_rules` が知らせるため返さない）、既定のログのフォルダ（`XDG_STATE_HOME`（無ければ `~/.local/state`）の下の `rule-inject/logs`。設定ファイルは読まない）の、UTC の今日の日付の `{yyyymmdd}_rule-inject.log` へ 1 行書いて 0 を返す（この分岐は古いバージョンでも読める書き方にするため、`default_log_dir`・`log_file_path` と同じ規則をこのファイルの中で持つ）
      2. `Path(__file__).parents[1] / "src"` を sys.path の先頭に追加する
      3. `HOOKS[argv[0]]` の出した元・処理・知らせ方を `run_hook` に渡す
    unit_tests:
      - name: test_main
        case: 正常
        summary: 子プロセスとして動かして終了コード 0
        condition: '`python3 hooks/run.py work_rules` に SessionStart の JSON を渡す'
        mock: なし
        expected: 終了コード 0、標準出力に additionalContext
      - name: test_main_when_python_too_old
        case: 正常
        summary: バージョンが足りないとき知らせて終える
        condition: '`sys.version_info` を (3, 11) に差し替え、`XDG_STATE_HOME` をテスト用のフォルダにして、PreToolUse の JSON を渡す'
        mock: '`sys.version_info`'
        expected: 戻り値 0、標準出力の additionalContext に必要なバージョンと動いたバージョン、`rule_inject` を import していない
      - name: test_main_when_python_too_old_and_sweep_read
        case: 正常
        summary: 掃除のフックはバージョンが足りなくても知らせを重ねない
        condition: '`sys.version_info` を (3, 11) に差し替え、`sweep_read` に SessionStart の JSON を渡す'
        mock: '`sys.version_info`'
        expected: 戻り値 0、標準出力が空、既定のログのフォルダ（`{XDG_STATE_HOME}/rule-inject/logs`）の今日の日付のファイルに 1 行。記録フォルダに `rule-inject.log` を作らない
  - name: search_guide
    title: 検索結果の案内の処理
    container: hooks/search_guide.py
    usecase: 検索の結果に出たファイルのルールの案内を受ける
    summary: 検索の結果に出た実在するファイルに当たる未読・未案内のルールを案内する PostToolUse の出力を作る
    kind: フック
    scope: public
    inherits: HookHandler
    side_effects: 案内に載せた場所を案内済みの記録へ追記する
    args:
      - name: payload
        type: dict[str, Any]
        required: true
        passing: positional
        description: PostToolUse の入力
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 環境変数
    returns:
      type: dict[str, Any] | None
      description: additionalContext（案内と知らせ）か、無ければ None
    process: |-
      1. session_id の形式が外れていれば None
      2. 結果の行と基準を決める。Grep・Glob は `tool_response.filenames` と `tool_response.content` の各行、基準は `cwd`。Bash は `search_output_base(command, cwd)` が None なら None、あれば `tool_response.stdout` の各行とその基準
      3. `extract_result_paths(lines, base)` で照合するパスを拾う。無ければ None
      4. `load_settings(env)` で設定を読む。SettingsReadError なら `log_settings_failure` でログ（`read_settings`）へ書き、`build_failure_notice(SETTINGS_FAILURE_SUMMARY, [error], ログの場所)` を additionalContext にして返す（照合しない）。以降の記録フォルダは `settings.state_dir`、ログのフォルダは `settings.log_dir`
      5. `load_indexes(settings.indexes, env)` で索引を読む。読めない索引と読み飛ばしたエントリはログ（`read_index`）と知らせの文に回す
      6. パスごとに `match_path(entries, path, "read")` で当て、ルールの場所ごとに 1 件へまとめる（出た順）
      7. `read_record` の既読の行で `current_read_locations` が返す場所と、`read_guided` の案内済みを除く。読めない記録は空として扱い、ログ（`read_record`）と知らせの文に回す
      8. 残った場所があれば `build_search_guidance(locations, unchecked=...)` で案内にし、`shown` を `append_guided` で案内済みにする。書けなければログ（`write_record`）と知らせの文に回す
      9. 案内と知らせを `hookSpecificOutput.additionalContext`（`hookEventName: PostToolUse`）にする。どちらも無ければ None
    unit_tests:
      - name: test_search_guide
        case: 正常
        summary: Grep の結果に当たるルールを案内する
        condition: '`**/*.py` のエントリ、`tool_response.filenames` に実在する `.py`'
        mock: なし（索引と記録フォルダは一時ファイル）
        expected: additionalContext が `SEARCH_HEADER` で始まり場所が載る。案内済みの記録に 1 行
      - name: test_search_guide_when_not_search
        case: 正常
        summary: 検索でない Bash は見ない
        condition: '`git merge main`、`stdout` に実在する `.py`'
        mock: なし
        expected: None
      - name: test_search_guide_when_read_or_guided
        case: 正常
        summary: 既読と案内済みを除く
        condition: 2 つのルールのうち 1 つが既読（記録に場所と今のハッシュの行）、1 つが案内済み
        mock: なし
        expected: None
      - name: test_search_guide_when_invalid_session_id
        case: 正常
        summary: session_id の形式が外れていれば案内しない
        condition: '`session_id` が `../x`'
        mock: なし
        expected: None
      - name: test_search_guide_when_guided_unwritable
        case: 正常
        summary: 案内済みに書けなくても案内を出す
        condition: 書き込み権限の無い記録フォルダ
        mock: なし
        expected: additionalContext に場所と記録ファイルの理由、ログに `write_record`
      - name: test_search_guide_when_rule_changed
        case: 正常
        summary: 読んだ後に変わったルールを案内する
        condition: '`**/*.py` のエントリ、`tool_response.filenames` に実在する `.py`。記録に場所と書き換える前のハッシュの行があり、ルールの中身を書き換える'
        mock: なし（索引と記録フォルダは一時ファイル）
        expected: additionalContext に場所が載る
      - name: test_search_guide_when_settings_unreadable
        case: 正常
        summary: 設定ファイルが読めないときは照合せずに知らせる
        condition: '`RULE_INJECT_CONFIG` が YAML として読めないファイルを指す。`XDG_STATE_HOME` は一時フォルダ。`tool_response.filenames` に実在する `.py`'
        mock: なし
        expected: 案内済みの記録が無い。additionalContext に `SETTINGS_FAILURE_SUMMARY`・設定ファイルの場所と理由。ログに `read_settings` が 1 行
  - name: log_settings_failure
    title: 設定ファイルの誤りのログ
    container: hooks/_runner.py
    usecase: 共通
    summary: 設定ファイルを読めなかったことを既定のログのフォルダへ書き、そのログのファイルの場所を返す
    kind: 関数
    scope: public
    side_effects: ログのファイルへ 1 行追記する
    args:
      - name: component
        type: Component
        required: true
        passing: positional
        description: 出した元
      - name: error
        type: SettingsReadError
        required: true
        passing: positional
        description: 設定ファイルの失敗
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 環境変数（`default_log_dir` に渡す）
      - name: session_id
        type: str | None
        required: true
        passing: positional
        description: フックの入力の session_id
    returns:
      type: Path
      description: 書いたログのファイルの場所（その日の `log_file_path`）
    process: |-
      1. `write_log(default_log_dir(env), component, operation="read_settings", ...)` で、設定ファイルの場所と理由を書く
      2. `log_file_path(default_log_dir(env), 今日（UTC）)` を返す
    unit_tests:
      - name: test_log_settings_failure
        case: 正常
        summary: 既定のログのフォルダへ書く
        condition: '`XDG_STATE_HOME` を一時フォルダにし、SettingsReadError を渡す'
        mock: なし
        expected: '`{XDG_STATE_HOME}/rule-inject/logs` の今日の日付のファイルに `operation: read_settings` と設定ファイルの場所・理由の 1 行があり、戻り値がそのファイルの場所'
  - name: settings_failure_notice
    title: 設定ファイルの誤りの知らせ
    container: hooks/_runner.py
    usecase: 共通
    summary: 設定ファイルを読めなかったことをログへ書き、場所と理由とログの場所を載せた知らせの文を返す
    kind: 関数
    scope: public
    side_effects: ログのファイルへ 1 行追記する
    args:
      - name: component
        type: Component
        required: true
        passing: positional
        description: 出した元
      - name: error
        type: SettingsReadError
        required: true
        passing: positional
        description: 設定ファイルの失敗
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 環境変数（`log_settings_failure` に渡す）
      - name: session_id
        type: str | None
        required: true
        passing: positional
        description: フックの入力の session_id
    returns:
      type: str
      description: '`additionalContext` に載せる知らせの文'
    process: |-
      1. `log_settings_failure(component, error, env, session_id)` でログへ書き、ログのファイルの場所を受け取る
      2. `build_failure_notice(SETTINGS_FAILURE_SUMMARY, [error], ログのファイルの場所)` を返す
notes:
  hooks.json: '6 つのフックとも `timeout: 1`、コマンドは `python3 "${CLAUDE_PLUGIN_ROOT}/hooks/run.py" {名前}`。matcher は PreToolUse のルール案内が `Read|Grep|Edit|Write|NotebookEdit|Bash|mcp__.*`、PostToolUse の既読の記録が `Read|Bash|mcp__.*`、検索結果の案内が `Grep|Glob|Bash`。PreCompact と SessionStart は matcher を持たない。SessionStart には作業の決まりの注入と既読の記録の掃除の 2 つのコマンドを並べる'
  Python のバージョン: フックは利用者の `python3` で動くため、`rule_inject` のコードは Python 3.12 より新しい書き方・標準ライブラリを使わない。`pyproject.toml` の `requires-python` は `>=3.12`
