title: "プラグイン / フック"
lead: Claude Code が呼ぶフックの入口。標準入力の JSON を読み、機能の関数を呼んで標準出力へ JSON を返し、想定外の例外も捕まえて終了コード 0 で終える。標準ライブラリだけで動く。
directory: |-
  ```text
  .claude-plugin/
  ├── plugin.json                 # プラグインの名前（rule-inject）と版
  └── marketplace.json            # このリポジトリを marketplace（rule-inject）として載せる定義。プラグインはリポジトリの直下（`./`）の 1 つ
  hooks/
  ├── hooks.json                  # 6 つのフックの matcher・timeout（1 秒）・コマンド
  └── run.py                      # src/ を sys.path に足して引数のフックを動かす
  src/rule_inject/hooks/
  ├── __init__.py
  ├── _runner.py                  # 標準入出力・想定外の例外・ログの共通処理
  ├── rule_guide.py               # ルール案内（PreToolUse）
  ├── session_id_injection.py     # セッションIDの付与（PreToolUse）
  ├── record_read.py              # 既読の記録（PostToolUse）
  ├── discard_read.py             # 既読の記録の破棄（PreCompact）
  ├── sweep_read.py               # 既読の記録の掃除（SessionStart）
  └── work_rules.py               # 作業の決まりの注入（SessionStart）
  ```
constants:
  - name: OWN_TOOL_PREFIX
    title: このプラグインの MCP のツール名の頭
    container: hooks/rule_guide.py
    summary: ルール案内が対象外にするツール名の頭
    value: '`mcp__plugin_rule-inject_rule-inject__`'
  - name: TOOL_OPERATIONS
    title: ツールと操作の種別
    container: hooks/rule_guide.py
    summary: ツール名から操作の種別への対応
    entries:
      - key: Read
        value: read
      - key: Grep
        value: read
      - key: Bash
        value: read
      - key: Edit
        value: write
      - key: Write
        value: write
      - key: NotebookEdit
        value: write
  - name: HOOKS
    title: フックの対応表
    container: hooks/__init__.py
    summary: run.py の引数の名前から、出した元・処理・想定外の例外の知らせ方を引く
    entries:
      - key: rule_guide
        value: '`("rule_guide", guide_rules, 止めずに additionalContext で知らせる)`'
      - key: session_id_injection
        value: '`("session_id_injection", inject_session_id, 出力しない)`'
      - key: record_read
        value: '`("record_read", record_read, additionalContext で知らせる)`'
      - key: discard_read
        value: '`("discard_read", discard_read, 出力しない)`'
      - key: work_rules
        value: '`("work_rules", work_rules, 出力しない)`'
      - key: sweep_read
        value: '`("sweep_read", sweep_read, 出力しない)`'
  - name: MIN_PYTHON
    title: フックの Python の最低の版
    container: hooks/run.py（プラグインの直下）
    summary: これより古い `python3` ではパッケージを import しない
    value: '`(3, 12)`'
    refs:
      - dev/設計書/非機能要件/非機能要件#requirements[フックのPythonの版]
function_types:
  - name: HookHandler
    title: フックの処理の関数型
    container: hooks/_runner.py
    usecase: 共通
    summary: 入力の JSON と環境変数を受け、標準出力へ返す JSON（無ければ None）を返す
    args:
      - name: payload
        type: dict[str, Any]
        required: true
        description: フックの入力
      - name: env
        type: Mapping[str, str]
        required: true
        description: 環境変数
    returns:
      type: dict[str, Any] | None
      description: 出力する JSON
    implementations:
      - target: guide_rules
      - target: inject_session_id
      - target: record_read
      - target: discard_read
      - target: work_rules
      - target: sweep_read
functions:
  - name: run_hook
    title: フックの実行
    container: hooks/_runner.py
    usecase: 共通
    summary: 標準入力を読み、処理を呼び、結果を標準出力へ出し、想定外の例外を捕まえて終了コード 0 を返す
    kind: 関数
    scope: public
    side_effects: 標準出力へ JSON を出す。失敗はログへ書く
    args:
      - name: component
        type: Component
        required: true
        passing: positional
        description: 出した元
      - name: handle
        type: HookHandler
        required: true
        passing: positional
        description: 処理
      - name: on_unexpected
        type: Callable[[str, Path], dict[str, Any] | None]
        required: true
        passing: positional
        description: 想定外の例外の文面とログの場所から、知らせの JSON を作る
      - name: stdin
        type: TextIO
        required: false
        default: sys.stdin
        passing: injected
        description: 標準入力
      - name: stdout
        type: TextIO
        required: false
        default: sys.stdout
        passing: injected
        description: 標準出力
      - name: env
        type: Mapping[str, str]
        required: false
        default: os.environ
        passing: injected
        description: 環境変数
    returns:
      type: int
      description: 常に 0
    process: |-
      1. 標準入力を JSON として読む
      2. `handle(payload, env)` を呼び、None でなければ JSON を 1 行出す
      3. 例外は捕まえ、`write_log(component, operation="unexpected")` を書き、`on_unexpected` の結果を出す
    unit_tests:
      - name: test_run_hook
        case: 正常
        summary: 処理の結果を出す
        condition: handle が dict を返す
        mock: なし（stdin / stdout は StringIO）
        expected: stdout にその JSON、戻り値 0
      - name: test_run_hook_when_none
        case: 正常
        summary: 出すものが無い
        condition: handle が None を返す
        mock: なし
        expected: stdout が空、戻り値 0
      - name: test_run_hook_when_unexpected
        case: 正常
        summary: 想定外の例外を捕まえる
        condition: handle が RuntimeError を送出する
        mock: なし
        expected: 'ログに `operation: unexpected` が 1 行、stdout に on_unexpected の JSON、戻り値 0'
  - name: guide_rules
    title: ルール案内の処理
    container: hooks/rule_guide.py
    usecase: 未読のルールの案内を受ける
    summary: 操作の対象に当たる未読のルールを案内する PreToolUse の出力を作る
    kind: フック
    scope: public
    inherits: HookHandler
    args:
      - name: payload
        type: dict[str, Any]
        required: true
        passing: positional
        description: PreToolUse の入力
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 環境変数
    returns:
      type: dict[str, Any] | None
      description: '止める案内（permissionDecision: deny）・止めない案内（additionalContext）・なし'
    process: |-
      1. `tool_name` が `OWN_TOOL_PREFIX` で始まれば None
      2. `load_indexes` で索引を読む。読めない索引はログ（`read_index`）と知らせの文に回す
      3. ツール名から操作の種別と対象を決める（`mcp__*` は `match_tool`、Bash は `extract_read_paths(READ_COMMANDS)`、Grep はファイルを指す `path`、ほかは `file_path` / `notebook_path`）
      4. 当たったルールから `read_record` の既読を除く。記録が読めなければログ（`read_record`）と知らせの文に回し、止めない
      5. 止めるルールがあれば deny と `build_guidance`、無ければ案内と知らせを additionalContext にする
    unit_tests:
      - name: test_handle_when_blocked
        case: 正常
        summary: 止める
        condition: '`on: [write]` のエントリと Write、既読なし'
        mock: なし（索引と記録フォルダは一時ファイル）
        expected: permissionDecision が deny、理由に場所
      - name: test_handle_when_already_read
        case: 正常
        summary: 既読なら何も出さない
        condition: 記録に場所がある
        mock: なし
        expected: None
      - name: test_handle_when_not_blocking
        case: 正常
        summary: 止めずに案内する
        condition: '`on: [write]` のエントリと Read'
        mock: なし
        expected: additionalContext だけがある
      - name: test_handle_when_bash
        case: 正常
        summary: Bash の読むコマンド
        condition: '`cat {実在する .py}`、`on: [read]`'
        mock: なし
        expected: deny
      - name: test_handle_when_grep_folder
        case: 正常
        summary: Grep がフォルダを指すときは照合しない
        condition: Grep の `path` がフォルダ
        mock: なし
        expected: None
      - name: test_handle_when_own_tool
        case: 正常
        summary: このプラグインのツールは対象外
        condition: '`mcp__plugin_rule-inject_rule-inject__read_rules`、`tools: ["mcp__*"]`'
        mock: なし
        expected: None
      - name: test_handle_when_index_unreadable
        case: 正常
        summary: 索引が読めない
        condition: 実在しない索引
        mock: なし
        expected: additionalContext に索引の場所と理由、ログに `read_index`
      - name: test_handle_when_record_unreadable
        case: 正常
        summary: 記録が読めない
        condition: 読み取り権限の無い記録ファイル
        mock: なし
        expected: deny を出さず additionalContext に理由、ログに `read_record`
  - name: inject_session_id
    title: セッションIDの付与の処理
    container: hooks/session_id_injection.py
    usecase: ルールの本文を取得する
    summary: tool_input を写して session_id を上書きした updatedInput を返す
    kind: フック
    scope: public
    inherits: HookHandler
    args:
      - name: payload
        type: dict[str, Any]
        required: true
        passing: positional
        description: PreToolUse の入力
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 環境変数（使わない）
    returns:
      type: dict[str, Any]
      description: '`hookSpecificOutput.updatedInput`（permissionDecision は載せない）'
    unit_tests:
      - name: test_inject_session_id
        case: 正常
        summary: 元の引数を写して足す
        condition: '`tool_input` に locations と paths'
        mock: なし
        expected: updatedInput に元の引数と入力の session_id、permissionDecision が無い
      - name: test_inject_session_id_when_model_supplied
        case: 正常
        summary: モデルの値を上書きする
        condition: '`tool_input.session_id` が `model-supplied`'
        mock: なし
        expected: updatedInput.session_id が入力の session_id
  - name: record_read
    title: 既読の記録の処理
    container: hooks/record_read.py
    usecase: ルールを読んだことが記録される
    summary: Read か Bash で読んだルールの場所を既読にし、書けなければ理由を返す
    kind: フック
    scope: public
    inherits: HookHandler
    args:
      - name: payload
        type: dict[str, Any]
        required: true
        passing: positional
        description: PostToolUse の入力
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 環境変数
    returns:
      type: dict[str, Any] | None
      description: 記録に書けなかったときだけ additionalContext
    process: |-
      1. 読んだパスを決める（Read は `file_path`、Bash は `extract_read_paths(FULL_READ_COMMANDS)`）
      2. `rule_locations` にあるものだけを `append_record` で追記する
      3. RecordWriteError はログ（`write_record`）と additionalContext にする
    unit_tests:
      - name: test_record_read_when_read_tool
        case: 正常
        summary: Read で読んだルールを記録する
        condition: Read、ルールの場所
        mock: なし
        expected: 記録ファイルに場所、戻り値 None
      - name: test_record_read_when_bash
        case: 正常
        summary: cat で読んだルールを記録する
        condition: '`cat {相対パス}`'
        mock: なし
        expected: 記録ファイルに絶対パス
      - name: test_record_read_when_not_rule
        case: 正常
        summary: ルールでないパスは記録しない
        condition: 索引に無いパス
        mock: なし
        expected: 記録ファイルが無い
      - name: test_record_read_when_unwritable
        case: 正常
        summary: 書けないとき理由を返す
        condition: 書き込み権限の無い記録フォルダ
        mock: なし
        expected: additionalContext に場所と理由
  - name: discard_read
    title: 既読の記録の破棄の処理
    container: hooks/discard_read.py
    usecase: 圧縮で既読の記録が捨てられる
    summary: そのセッションの記録ファイルを消す
    kind: フック
    scope: public
    inherits: HookHandler
    args:
      - name: payload
        type: dict[str, Any]
        required: true
        passing: positional
        description: PreCompact の入力
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 環境変数
    returns:
      type: None
      description: 常に出力しない
    process: |-
      1. session_id の形が外れていれば何もしない
      2. `delete_record` を呼ぶ。RecordDeleteError はログ（`delete_record`）へ書く
    unit_tests:
      - name: test_discard_read
        case: 正常
        summary: 記録を消す
        condition: 記録ファイルがある
        mock: なし
        expected: 記録ファイルが無い、None
      - name: test_discard_read_when_undeletable
        case: 正常
        summary: 消せないときログに書く
        condition: 書き込み権限の無い記録フォルダと、書き込み権限の無い空のログのフォルダ（`RULE_INJECT_LOG_DIR`）
        mock: なし
        expected: None、標準エラー出力に `delete_record`
  - name: work_rules
    title: 作業の決まりの注入の処理
    container: hooks/work_rules.py
    usecase: セッションの開始時に作業の決まりを受け取る
    summary: 作業の決まりを返し、圧縮の後に記録が残っていれば消せなかったことも返す
    kind: フック
    scope: public
    inherits: HookHandler
    args:
      - name: payload
        type: dict[str, Any]
        required: true
        passing: positional
        description: SessionStart の入力
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 環境変数
    returns:
      type: dict[str, Any]
      description: additionalContext に `WORK_RULES`（と消し残りの知らせ）
    unit_tests:
      - name: test_work_rules
        case: 正常
        summary: 作業の決まりを返す
        condition: '`source: startup`'
        mock: なし
        expected: additionalContext が `WORK_RULES`
      - name: test_work_rules_when_record_left_after_compact
        case: 正常
        summary: 圧縮の後の消し残りを知らせる
        condition: '`source: compact` で記録ファイルがある'
        mock: なし
        expected: additionalContext に `WORK_RULES` と記録ファイル・ログの場所
  - name: sweep_read
    title: 既読の記録の掃除の処理
    container: hooks/sweep_read.py
    usecase: 終わったセッションの既読の記録が掃除される
    summary: 保持期間を過ぎた別のセッションの記録ファイル、変更前のログ、保持日数を過ぎたログのファイルを消し、失敗をログへ書く
    kind: フック
    scope: public
    inherits: HookHandler
    args:
      - name: payload
        type: dict[str, Any]
        required: true
        passing: positional
        description: SessionStart の入力
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 環境変数
    returns:
      type: None
      description: 常に出力しない
    process: |-
      1. session_id の形が外れていれば何もしない
      2. 失敗は全て `write_log(log_dir(env), component=sweep_read, ...)` で書く
      3. `sweep_records(state_dir(env), session_id, retention_days=read_retention_days(env, RECORD_RETENTION_DAYS_ENV, DEFAULT_RECORD_RETENTION_DAYS))` を呼び、返った RecordDeleteError ごとにログ（`delete_record`）へ書く
      4. `delete_legacy_log(state_dir(env))` を呼び、LogDeleteError が返ればログ（`delete_log`）へ書く
      5. `sweep_logs(log_dir(env), read_retention_days(env, LOG_RETENTION_DAYS_ENV, DEFAULT_LOG_RETENTION_DAYS))` を呼び、返った LogDeleteError ごとにログ（`delete_log`）へ書く
    unit_tests:
      - name: test_sweep_read
        case: 正常
        summary: 保持期間を過ぎた記録を消す
        condition: 最終更新が 31 日前の別のセッションの記録ファイル
        mock: なし（最終更新は `os.utime` で戻す）
        expected: 記録ファイルが無い、None
      - name: test_sweep_read_when_invalid_session_id
        case: 正常
        summary: session_id の形が外れていれば何も消さない
        condition: '`session_id` が `../x`、最終更新が 31 日前の記録ファイル'
        mock: なし
        expected: 記録ファイルが残る、None
      - name: test_sweep_read_when_undeletable
        case: 正常
        summary: 消せず、ログにも書けないとき標準エラー出力に書く
        condition: 最終更新が 31 日前の記録ファイル、書き込み権限の無い記録フォルダと、書き込み権限の無い空のログのフォルダ（`RULE_INJECT_LOG_DIR`）
        mock: なし
        expected: 'None、標準エラー出力に `component: sweep_read`・`operation: delete_record`'
      - name: test_sweep_read_when_old_logs
        case: 正常
        summary: 保持日数を過ぎたログのファイルを消す
        condition: '`RULE_INJECT_LOG_DIR` に日付が今日と 3 日前（UTC）のログのファイル'
        mock: なし
        expected: 3 日前のファイルが無く、今日のファイルが残る、None
      - name: test_sweep_read_when_legacy_log
        case: 正常
        summary: 変更前のログを消す
        condition: 記録フォルダに最終更新が今の `rule-inject.log`
        mock: なし
        expected: '`rule-inject.log` が無い、None'
      - name: test_sweep_read_when_invalid_setting
        case: 正常
        summary: 保持の値が不正なら既定の日数で掃除する
        condition: '`RULE_INJECT_LOG_RETENTION_DAYS=0`、日付が今日・2 日前・3 日前のログのファイル'
        mock: なし
        expected: 3 日前のファイルが無く、今日と 2 日前のファイルが残る、None
  - name: main
    title: フックの起動
    container: hooks/run.py（プラグインの直下）
    usecase: 共通
    summary: '`src/` を sys.path に足し、引数で指したフックを `run_hook` で動かす'
    kind: 関数
    scope: public
    args:
      - name: argv
        type: list[str]
        required: true
        passing: positional
        description: '`["rule_guide"]` などフックの名前 1 つ'
    returns:
      type: int
      description: 終了コード（常に 0）
    process: |-
      1. 冒頭で `sys.version_info` を確かめる。`MIN_PYTHON` より古ければ、パッケージを import せずに、標準入力の `hook_event_name` が PreToolUse・PostToolUse・SessionStart なら版が足りないことを additionalContext で返し（`sweep_read` は同じ SessionStart の `work_rules` が知らせるため返さない）、ログのフォルダ（`RULE_INJECT_LOG_DIR`。無ければ `XDG_STATE_HOME`（無ければ `~/.local/state`）の下の `rule-inject/logs`）の、UTC の今日の日付の `{yyyymmdd}_rule-inject.log` へ 1 行書いて 0 を返す（この分岐は古い版でも読める書き方にするため、`log_dir`・`log_file_path` と同じ規則をこのファイルの中で持つ）
      2. `Path(__file__).parents[1] / "src"` を sys.path の先頭に足す
      3. `HOOKS[argv[0]]` の出した元・処理・知らせ方を `run_hook` に渡す
    unit_tests:
      - name: test_main
        case: 正常
        summary: 子プロセスとして動かして終了コード 0
        condition: '`python3 hooks/run.py work_rules` に SessionStart の JSON を渡す'
        mock: なし
        expected: 終了コード 0、標準出力に additionalContext
      - name: test_main_when_python_too_old
        case: 正常
        summary: 版が足りないとき知らせて終える
        condition: '`sys.version_info` を (3, 11) に差し替え、`RULE_INJECT_LOG_DIR` をテスト用のフォルダにして、PreToolUse の JSON を渡す'
        mock: '`sys.version_info`'
        expected: 戻り値 0、標準出力の additionalContext に必要な版と動いた版、`rule_inject` を import していない
      - name: test_main_when_python_too_old_and_sweep_read
        case: 正常
        summary: 掃除のフックは版が足りなくても知らせを重ねない
        condition: '`sys.version_info` を (3, 11) に差し替え、`sweep_read` に SessionStart の JSON を渡す'
        mock: '`sys.version_info`'
        expected: 戻り値 0、標準出力が空、ログのフォルダ（`RULE_INJECT_LOG_DIR`）の今日の日付のファイルに 1 行。記録フォルダに `rule-inject.log` を作らない
notes:
  hooks.json: '6 つのフックとも `timeout: 1`、コマンドは `python3 "${CLAUDE_PLUGIN_ROOT}/hooks/run.py" {名前}`。matcher は PreToolUse のルール案内が `Read|Grep|Edit|Write|NotebookEdit|Bash|mcp__.*`、セッションIDの付与が `mcp__plugin_rule-inject_rule-inject__.*`、PostToolUse が `Read|Bash`。PreCompact と SessionStart は matcher を持たない。SessionStart には作業の決まりの注入と既読の記録の掃除の 2 つのコマンドを並べる'
  標準ライブラリだけで動かす: '`rule_inject.hooks` とそこから呼ぶ `rule_inject.features.*`・`rule_inject.shared` は `mcp` を import しない。`mcp` を import するのは `rule_inject.server` だけ'
  Python の版: フックは利用者の `python3` で動くため、`rule_inject` のコードは Python 3.12 より新しい書き方・標準ライブラリを使わない。`pyproject.toml` の `requires-python` は `>=3.12`
