title: "プラグイン / フック"
lead: Claude Code が呼ぶフックの入口。標準入力の JSON を読み、機能の関数を呼んで標準出力へ JSON を返し、想定外の例外も捕まえて終了コード 0 で終える。標準ライブラリだけで動く。
directory: |-
  ```text
  .claude-plugin/
  ├── plugin.json                 # プラグインの名前（rule-inject）とバージョン
  └── marketplace.json            # このリポジトリを marketplace（rule-inject）として載せる定義。プラグインはリポジトリの直下（`./`）の 1 つ
  hooks/
  ├── hooks.json                  # 6 つのフックの matcher・timeout（1 秒）・コマンド
  └── run.py                      # src/ を sys.path に追加して引数のフックを動かす
  src/rule_inject/hooks/
  ├── __init__.py
  ├── _runner.py                  # 標準入出力・想定外の例外・ログ・設定ファイルの誤りのログの共通処理
  ├── rule_guide.py               # ルール案内（PreToolUse）
  ├── record_read.py              # 既読の記録（PostToolUse）
  ├── search_guide.py             # 検索結果の案内（PostToolUse）
  ├── discard_read.py             # 既読の記録の破棄（PreCompact）
  ├── sweep_read.py               # 既読の記録の掃除（SessionStart）
  └── work_rules.py               # 作業の決まりの注入（SessionStart）
  ```
constants:
  - name: TOOL_OPERATIONS
    title: ツールと操作の種別
    container: hooks/rule_guide.py
    summary: ツール名から操作の種別への対応
    entries:
      - key: Read
        value: read
      - key: Grep
        value: read
      - key: Bash
        value: read
      - key: Edit
        value: write
      - key: Write
        value: write
      - key: NotebookEdit
        value: write
  - name: HOOKS
    title: フックの対応表
    container: hooks/__init__.py
    summary: run.py の引数の名前から、出した元・処理・想定外の例外の知らせ方を引く
    entries:
      - key: rule_guide
        value: '`("rule_guide", guide_rules, 止めずに additionalContext で知らせる)`'
      - key: record_read
        value: '`("record_read", record_read, additionalContext で知らせる)`'
      - key: discard_read
        value: '`("discard_read", discard_read, 出力しない)`'
      - key: work_rules
        value: '`("work_rules", work_rules, 出力しない)`'
      - key: sweep_read
        value: '`("sweep_read", sweep_read, 出力しない)`'
      - key: search_guide
        value: '`("search_guide", search_guide, additionalContext で知らせる)`'
  - name: MIN_PYTHON
    title: フックの Python の最低のバージョン
    container: hooks/run.py（プラグインの直下）
    summary: これより古い `python3` ではパッケージを import しない
    value: '`(3, 12)`'
    refs:
      - dev/設計書/非機能要件/非機能要件#requirements[フックのPythonのバージョン]
  - name: SETTINGS_FAILURE_SUMMARY
    title: 設定ファイルの失敗の知らせの冒頭
    container: hooks/_runner.py
    summary: 設定ファイルを読めなかったときに `build_failure_notice` へ渡す 1 文
    value: '`設定ファイルを読めませんでした`'
function_types:
  - name: HookHandler
    title: フックの処理の関数型
    container: hooks/_runner.py
    usecase: 共通
    summary: 入力の JSON と環境変数を受け、標準出力へ返す JSON（無ければ None）を返す
    args:
      - name: payload
        type: dict[str, Any]
        required: true
        description: フックの入力
      - name: env
        type: Mapping[str, str]
        required: true
        description: 環境変数
    returns:
      type: dict[str, Any] | None
      description: 出力する JSON
    implementations:
      - target: guide_rules
      - target: record_read
      - target: discard_read
      - target: work_rules
      - target: sweep_read
functions:
  - name: run_hook
    title: フックの実行
    container: hooks/_runner.py
    usecase: 共通
    summary: 標準入力を読み、処理を呼び、結果を標準出力へ出し、想定外の例外を捕まえて終了コード 0 を返す
    kind: 関数
    scope: public
    side_effects: 標準出力へ JSON を出す。失敗はログへ書く
    args:
      - name: component
        type: Component
        required: true
        passing: positional
        description: 出した元
      - name: handle
        type: HookHandler
        required: true
        passing: positional
        description: 処理
      - name: on_unexpected
        type: Callable[[str, Path], dict[str, Any] | None]
        required: true
        passing: positional
        description: 想定外の例外の文面とログの場所から、知らせの JSON を作る
      - name: stdin
        type: TextIO
        required: false
        default: sys.stdin
        passing: injected
        description: 標準入力
      - name: stdout
        type: TextIO
        required: false
        default: sys.stdout
        passing: injected
        description: 標準出力
      - name: env
        type: Mapping[str, str]
        required: false
        default: os.environ
        passing: injected
        description: 環境変数
    returns:
      type: int
      description: 常に 0
    process: |-
      1. 標準入力を JSON として読む
      2. `handle(payload, env)` を呼び、None でなければ JSON を 1 行出す
      3. 例外は捕まえ、`write_log(component, operation="unexpected")` を書き、`on_unexpected` の結果を出す。ログのフォルダは `load_settings(env).log_dir`、SettingsReadError なら `default_log_dir(env)`
    unit_tests:
      - name: test_run_hook
        case: 正常
        summary: 処理の結果を出す
        condition: handle が dict を返す
        mock: なし（stdin / stdout は StringIO）
        expected: stdout にその JSON、戻り値 0
      - name: test_run_hook_when_none
        case: 正常
        summary: 出すものが無い
        condition: handle が None を返す
        mock: なし
        expected: stdout が空、戻り値 0
      - name: test_run_hook_when_unexpected
        case: 正常
        summary: 想定外の例外を捕まえる
        condition: handle が RuntimeError を送出する
        mock: なし
        expected: 'ログに `operation: unexpected` が 1 行、stdout に on_unexpected の JSON、戻り値 0'
      - name: test_run_hook_when_unexpected_and_settings_unreadable
        case: 正常
        summary: 設定ファイルが読めなくても想定外の例外を既定のログのフォルダへ書く
        condition: handle が RuntimeError を送出する。`RULE_INJECT_CONFIG` が YAML として読めないファイルを指し、`XDG_STATE_HOME` は一時フォルダ
        mock: なし
        expected: '`{XDG_STATE_HOME}/rule-inject/logs` のログに `operation: unexpected` が 1 行、戻り値 0'
  - name: guide_rules
    title: ルール案内の処理
    container: hooks/rule_guide.py
    usecase: 未読のルールの案内を受ける
    summary: 操作の対象に当たる未読のルールを案内する PreToolUse の出力を作る
    kind: フック
    scope: public
    inherits: HookHandler
    args:
      - name: payload
        type: dict[str, Any]
        required: true
        passing: positional
        description: PreToolUse の入力
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 環境変数
    returns:
      type: dict[str, Any] | None
      description: '止める案内（permissionDecision: deny）・止めない案内（additionalContext）・なし'
    process: |-
      1. `load_settings(env)` で設定を読む。SettingsReadError なら `log_settings_failure` でログ（`read_settings`）へ書き、`build_failure_notice(SETTINGS_FAILURE_SUMMARY, [error], ログの場所)` を additionalContext にして返す（照合しない）。以降の記録フォルダは `settings.state_dir`、ログのフォルダは `settings.log_dir`
      2. `load_indexes(settings.indexes, env)` で索引を読む。読めない索引と読み飛ばしたエントリはログ（`read_index`）と知らせの文に回す
      3. ツール名から操作の種別と対象を決める（`mcp__*` は `match_tool(entries, tool_name, tool_input)`、Bash は `extract_read_paths(READ_COMMANDS)`、Grep はファイルを指す `path`、ほかは `file_path` / `notebook_path`）
      4. 当たったルールから、`read_record` の既読の行で `current_read_locations` が返す場所を除く（本文が変わったルールは未読のまま残る）。記録が読めなければログ（`read_record`）と知らせの文に回し、止めない
      5. 止めるルールがあれば deny と `build_guidance` を返す（案内済みにはしない）
      6. 止めるルールが無ければ、`read_guided` の案内済みを除く。読めなければ未案内として扱い、ログ（`read_record`）と知らせの文に回す
      7. 残ったルールを `build_guidance` で案内にし、`shown` を `append_guided` で案内済みにする。書けなければログ（`write_record`）と知らせの文に回す
      8. 案内と知らせを additionalContext にする（どちらも無ければ None）
    unit_tests:
      - name: test_handle_when_blocked
        case: 正常
        summary: 止める
        condition: '`on: [write]` のエントリと Write、既読なし'
        mock: なし（索引と記録フォルダは一時ファイル）
        expected: permissionDecision が deny、理由に場所
      - name: test_handle_when_already_read
        case: 正常
        summary: 既読なら何も出さない
        condition: 記録に場所と今のハッシュの行がある
        mock: なし
        expected: None
      - name: test_handle_when_not_blocking
        case: 正常
        summary: 止めずに案内する
        condition: '`on: [write]` のエントリと Read'
        mock: なし
        expected: additionalContext だけがある
      - name: test_handle_when_bash
        case: 正常
        summary: Bash の読むコマンド
        condition: '`cat {実在する .py}`、`on: [read]`'
        mock: なし
        expected: deny
      - name: test_handle_when_grep_folder
        case: 正常
        summary: Grep がフォルダを指すときは照合しない
        condition: Grep の `path` がフォルダ
        mock: なし
        expected: None
      - name: test_handle_when_index_unreadable
        case: 正常
        summary: 索引が読めない
        condition: 実在しない索引
        mock: なし
        expected: additionalContext に索引の場所と理由、ログに `read_index`
      - name: test_handle_when_record_unreadable
        case: 正常
        summary: 記録が読めない
        condition: 読み取り権限の無い記録ファイル
        mock: なし
        expected: deny を出さず additionalContext に理由、ログに `read_record`
      - name: test_handle_when_already_guided
        case: 正常
        summary: 案内済みなら止めない案内を出さない
        condition: '`on: [write]` のエントリと Read、案内済みの記録に場所がある'
        mock: なし
        expected: None
      - name: test_handle_when_guided_recorded
        case: 正常
        summary: 止めない案内に載せた場所だけを案内済みにする
        condition: '`on: [write]` のエントリと Read を呼ぶ。別に `on: [write]` のエントリと Write を呼ぶ'
        mock: なし
        expected: Read の後は案内済みの記録に場所が 1 行。Write（deny）の後は行が増えない
      - name: test_handle_when_guided_unwritable
        case: 正常
        summary: 案内済みに書けなくても案内を出す
        condition: '`on: [write]` のエントリと Read、書き込み権限の無い記録フォルダ'
        mock: なし
        expected: additionalContext に場所と記録ファイルの理由、ログに `write_record`
      - name: test_handle_when_mcp_args
        case: 正常
        summary: MCP のツールの引数で当てる
        condition: '`tools: ["mcp__*__search_*"]`・`args` に `kind: ["rule"]`・`on: [mcp]` のエントリ。`tool_input` が `{"kind": "rule"}` の呼び出しと `{"kind": "note"}` の呼び出し'
        mock: なし（索引と記録フォルダは一時ファイル）
        expected: 前者は deny、後者は None
      - name: test_handle_when_rule_changed
        case: 正常
        summary: 読んだ後に変わったルールを案内する
        condition: '`on: [write]` のエントリと Write。記録に場所と書き換える前のハッシュの行があり、ルールの中身を書き換える'
        mock: なし（索引と記録フォルダは一時ファイル）
        expected: permissionDecision が deny、理由に場所
      - name: test_handle_when_settings_unreadable
        case: 正常
        summary: 設定ファイルが読めないときは照合せずに知らせる
        condition: '`RULE_INJECT_CONFIG` が知らないキーを持つ設定ファイルを指す。`XDG_STATE_HOME` は一時フォルダ。Write'
        mock: なし
        expected: deny を出さず、additionalContext に `SETTINGS_FAILURE_SUMMARY`・設定ファイルの場所と理由・ログの場所。`{XDG_STATE_HOME}/rule-inject/logs` のログに `read_settings` が 1 行
  - name: record_read
    title: 既読の記録の処理
    container: hooks/record_read.py
    usecase: ルールを読んだことが記録される
    summary: Read か Bash で全体を読んだルールの場所と、MCP のツールの結果に載った全文のルールの文書の場所（書式に従う文書が無ければ `read_by` に当たったルールの場所）を、本文のハッシュと一緒に既読にして既読の履歴へ書き、書けなければ理由を返す
    kind: フック
    scope: public
    inherits: HookHandler
    args:
      - name: payload
        type: dict[str, Any]
        required: true
        passing: positional
        description: PostToolUse の入力
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 環境変数
    returns:
      type: dict[str, Any] | None
      description: 既読の記録か既読の履歴に書けなかったときだけ additionalContext
    process: |-
      1. `load_settings(env)` で設定を読む。SettingsReadError なら `log_settings_failure` でログ（`read_settings`）へ書き、`build_failure_notice(SETTINGS_FAILURE_SUMMARY, [error], ログの場所)` を additionalContext にして返す（記録しない）。以降の索引は `load_indexes(settings.indexes, env)`、記録フォルダは `settings.state_dir`、ログのフォルダは `settings.log_dir`
      2. 既読にする場所を決める。`load_indexes` の `failures`（URL のために読み飛ばしたエントリを含む）は知らせず、ログにも書かない
         - Read の場合、`tool_response.file` の `startLine` が 1 で `numLines` が `totalLines` と同じときだけ（3 つとも bool でない整数のときだけ）、`file_path` のうち `rule_locations` にあるもの
         - Bash の場合、`extract_read_paths(FULL_READ_COMMANDS)` のうち `rule_locations` にあるもの
         - `mcp__` で始まるツールで、`extract_documents(tool_response)` が 1 件以上返す場合、`scope` が `DocumentScope.FULL` で `path` が `http://`・`https://` で始まらない文書の `path` を `resolve_location(path, cwd)` で解いたうち `rule_locations` にあるもの（`read_by` は照合しない）
         - `mcp__` で始まるツールで、文書が 0 件の場合、`match_read_by(entries, tool_name, tool_input)`
      3. 場所の重なりを除き、`hash_locations` で本文のハッシュを付ける。読めずハッシュを取れない場所は記録しない（知らせない。ログにも書かない）
      4. 行が無ければ None を返す
      5. `append_record` で既読の記録へ追記する。RecordWriteError はログ（`write_record`）と additionalContext にして返す（履歴へは書かない）
      6. `append_history(state_dir, session_id, locations, method=..., tool=tool_name)` で、記録した行の場所を既読の履歴へ書く。method は Read が `ReadMethod.READ`、Bash が `ReadMethod.BASH`、MCP のツールが `ReadMethod.MCP`
      7. HistoryWriteError はログ（`write_history`）と、場所と理由を載せた additionalContext にして返す（既読の記録はそのまま残す）
    unit_tests:
      - name: test_record_read_when_read_tool
        case: 正常
        summary: Read で読んだルールを記録する
        condition: Read、ルールの場所、`tool_response.file` が `startLine` 1・`numLines` と `totalLines` が同じ
        mock: なし
        expected: 記録ファイルに場所とルールの中身の `sha256:` のハッシュの 1 行、履歴ファイルに `method` が `read`・`tool` が `Read` の 1 行、戻り値 None
      - name: test_record_read_when_bash
        case: 正常
        summary: cat で読んだルールを記録する
        condition: '`cat {相対パス}`'
        mock: なし
        expected: 記録ファイルに絶対パスとハッシュの 1 行、履歴ファイルに `method` が `bash`・`tool` が `Bash` の 1 行
      - name: test_record_read_when_not_rule
        case: 正常
        summary: ルールでないパスは記録しない
        condition: 索引に無いパス
        mock: なし
        expected: 記録ファイルも履歴ファイルも無い
      - name: test_record_read_when_unwritable
        case: 正常
        summary: 書けないとき理由を返す
        condition: 書き込み権限の無い記録フォルダ
        mock: なし
        expected: additionalContext に場所と理由
      - name: test_record_read_when_mcp_tool
        case: 正常
        summary: '`read_by` に当たった MCP のツールの呼び出しでルールを記録する'
        condition: '`read_by` に `tools: ["mcp__docs__get_doc"]` を持つエントリ、`tool_name` が `mcp__docs__get_doc`'
        mock: なし
        expected: 記録ファイルにそのエントリの場所、履歴ファイルに `method` が `mcp`・`tool` が `mcp__docs__get_doc` の 1 行、戻り値 None
      - name: test_record_read_when_read_by_not_matched
        case: 正常
        summary: '`read_by` に当たらない MCP のツールは記録しない'
        condition: '`tools: ["mcp__*"]` を持ち `read_by` の無いエントリ、`tool_name` が `mcp__docs__get_doc`'
        mock: なし
        expected: 記録ファイルも履歴ファイルも無い、戻り値 None
      - name: test_record_read_when_history_unwritable
        case: 正常
        summary: 履歴に書けないとき既読を残して理由を返す
        condition: Read、ルールの場所、記録フォルダに `{id}.history.jsonl` という名前のフォルダを置く
        mock: なし
        expected: 記録ファイルに場所、additionalContext に場所と理由、ログに `write_history` の行
      - name: test_record_read_when_rule_is_url
        case: 正常
        summary: '`rule` が URL のエントリは `read_by` に当たっても記録せず、知らせもしない'
        condition: '`rule: https://example.com/a.md`・`read_by` に `tools: ["mcp__docs__get_doc"]` を持つエントリだけ、`tool_name` が `mcp__docs__get_doc`'
        mock: なし
        expected: 記録ファイルも履歴ファイルもログのファイルも無い、戻り値 None
      - name: test_record_read_when_read_partially
        case: 正常
        summary: Read で一部だけを読んだときは記録しない
        condition: Read、ルールの場所、`tool_response.file` が `startLine` 5・`numLines` 7・`totalLines` 11。別に `tool_response` に `file` が無い呼び出しと、`startLine` が文字列 `"1"` の呼び出し
        mock: なし
        expected: どの呼び出しでも記録ファイルも履歴ファイルも無い、戻り値 None
      - name: test_record_read_when_mcp_document
        case: 正常
        summary: MCP のツールの結果の全文の文書だけを記録する
        condition: ルール A・B のエントリ。`tool_response` が、A の `scope="full"` と B の `scope="summary"` の閉じた `<document>` を持つ文字列。A の `path` は `cwd` からの相対パス
        mock: なし
        expected: 記録ファイルに A の絶対パスとハッシュの 1 行だけ、履歴ファイルに `method` が `mcp` の 1 行、戻り値 None
      - name: test_record_read_when_mcp_document_without_read_by
        case: 正常
        summary: 書式に従う文書がある結果には `read_by` を当てない
        condition: '`read_by` に `tools: ["mcp__docs__get_doc"]` を持つルール A のエントリ、`tool_name` が `mcp__docs__get_doc`、`tool_response` が索引に無い文書の `{"path": "other.md", "scope": "full"}`'
        mock: なし
        expected: 記録ファイルも履歴ファイルも無い、戻り値 None
      - name: test_record_read_when_mcp_document_is_url
        case: 正常
        summary: '`path` が URL の文書は記録しない'
        condition: '`tool_response` が `{"path": "https://example.com/a.md", "scope": "full"}` だけ'
        mock: なし
        expected: 記録ファイルも履歴ファイルも無い、戻り値 None
      - name: test_record_read_when_rule_unreadable
        case: 正常
        summary: ハッシュを取れないルールは記録しない
        condition: ファイルが無いルールのエントリ。`read_by` に当たる MCP のツールの呼び出し
        mock: なし
