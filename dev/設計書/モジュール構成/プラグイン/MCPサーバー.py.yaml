title: "プラグイン / MCPサーバー"
lead: stdio の MCP サーバーの入口。`read_rules` を登録し、本文の取得の関数へつなぐ。
directory: |-
  ```text
  .mcp.json                   # rule-inject のサーバーを uv run で起動する
  pyproject.toml              # uv のプロジェクト（requires-python >=3.12、依存は mcp>=2.2,<3）
  src/rule_inject/server/
  ├── __init__.py
  ├── __main__.py             # python -m rule_inject.server で起動
  └── app.py                  # build_server（read_rules の登録）
  ```
functions:
  - name: build_server
    title: MCP サーバーの組み立て
    container: server/app.py
    usecase: ルールの本文を取得する
    summary: '`read_rules` を登録した MCPServer を返す'
    kind: 関数
    scope: public
    args:
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 環境変数
      - name: fetch
        type: FetchUrlFn
        required: false
        default: fetch_url
        passing: injected
        description: URL の取得
    returns:
      type: MCPServer
      description: 名前 `rule-inject` のサーバー
    process: |-
      1. `MCPServer("rule-inject")` を作る
      2. `read_rules` を `tool(meta={"anthropic/maxResultSizeChars": MAX_RESULT_CHARS})` で登録する。引数の説明はインターフェース定義の文面を docstring の Args に書く
      3. ツールの中では呼ばれるたびに `load_indexes(env)` と `state_dir(env)` を求め、`read_rules` を呼んで `render_result` を返す
      4. ToolArgumentError・RecordWriteError・想定外の例外はログへ書いてから、文面を載せて送出し直す（SDK が isError の応答にする）
    unit_tests:
      - name: test_build_server
        case: 正常
        summary: read_rules が上限の指定つきで登録される
        condition: 空の環境変数
        mock: なし
        expected: ツールの一覧に `read_rules` があり、`_meta["anthropic/maxResultSizeChars"]` が `40000`、引数の説明がある
      - name: test_build_server_when_error
        case: 正常
        summary: 引数が足りない呼び出しをエラーにしてログに書く
        condition: '`session_id` なしでツールを呼ぶ'
        mock: なし
        expected: エラーの応答、文面に session_id
  - name: main
    title: MCP サーバーの起動
    container: server/__main__.py
    usecase: ルールの本文を取得する
    summary: '`build_server(os.environ)` を stdio で動かす'
    kind: 関数
    scope: public
    returns:
      type: None
      description: なし
    unit_tests:
      - name: test_main
        case: 正常
        summary: 子プロセスで起動して tools/list に答える
        condition: '`uv run python -m rule_inject.server` に initialize と tools/list を送る'
        mock: なし
        expected: '`read_rules` を含む応答'
notes:
  .mcp.json: '`{"mcpServers": {"rule-inject": {"command": "uv", "args": ["run", "--project", "${CLAUDE_PLUGIN_ROOT}", "python", "-m", "rule_inject.server"]}}}`。サーバーのキーとプラグイン名がどちらも `rule-inject` のため、ツールの完全名は `mcp__plugin_rule-inject_rule-inject__read_rules` になる'
