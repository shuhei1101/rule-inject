title: "プラグイン / 共通"
lead: フックが共有する、設定ファイルの読み取り・既定の記録フォルダとログのフォルダ・場所の解決・変数参照の展開・ログ・例外。標準ライブラリだけで書く。
directory: |-
  ```text
  src/rule_inject/
  ├── __init__.py
  └── shared/
      ├── __init__.py
      ├── errors.py          # 設定ファイル・索引の読み取りと編集・既読の記録・既読の履歴・ログの例外
      ├── paths.py           # 既定の記録フォルダ・ログのフォルダとルールの場所の解決
      ├── settings.py        # 設定ファイルの読み取りと `projects` の当て方
      ├── _settings_yaml.py  # 設定ファイルの YAML の一部だけを読む
      ├── yaml_lines.py      # 設定ファイルと索引の YAML に共通の、行・文字列・リストの読み取り
      ├── variables.py       # `!{名前}` を環境変数の値へ展開する
      └── logger.py          # 失敗を日付ごとのログ（JSON Lines）へ書き、古いログを削除する
  ```
classes:
  - name: RuleInjectError
    title: プラグインの例外
    container: shared/errors.py
    usecase: 共通
    summary: このプラグインが送出する例外の基底
    kind: クラス
    inherits: Exception
    properties:
      - name: path
        type: str
        description: 失敗した操作の対象のファイル・フォルダ・場所
      - name: reason
        type: str
        description: 理由（元の例外のクラス名と文面）
  - name: IndexReadError
    title: 索引が読めない
    container: shared/errors.py
    usecase: 共通
    summary: 索引が無い・読めない・書式に合わない
    kind: クラス
    inherits: RuleInjectError
  - name: RecordReadError
    title: 既読の記録が読めない
    container: shared/errors.py
    usecase: 共通
    summary: 記録ファイルはあるが読めない
    kind: クラス
    inherits: RuleInjectError
  - name: RecordWriteError
    title: 既読の記録に書けない
    container: shared/errors.py
    usecase: 共通
    summary: 記録フォルダが作れない・記録ファイルに追記できない
    kind: クラス
    inherits: RuleInjectError
  - name: RecordDeleteError
    title: 既読の記録を削除できない
    container: shared/errors.py
    usecase: 共通
    summary: 記録ファイルはあるが削除できない
    kind: クラス
    inherits: RuleInjectError
  - name: LogDeleteError
    title: ログを削除できない
    container: shared/errors.py
    usecase: 古いログが掃除される
    summary: 削除する対象のログのファイルはあるが削除できない
    kind: クラス
    inherits: RuleInjectError
  - name: HistoryWriteError
    title: 既読の履歴に書けない
    container: shared/errors.py
    usecase: ルールを読んだことが記録される
    summary: 記録フォルダが作れない・既読の履歴ファイルに追記できない
    kind: クラス
    inherits: RuleInjectError
  - name: SettingsReadError
    title: 設定ファイルが読めない
    container: shared/errors.py
    usecase: 共通
    summary: 設定ファイルが無い・読めない・知らないキーや許す値の外の値を持つ。`path` は設定ファイルの場所
    kind: クラス
    inherits: RuleInjectError
  - name: IndexEditError
    title: 索引を編集できない
    container: shared/errors.py
    usecase: 索引のエントリを編集する
    summary: 索引が YAML として読めない・エントリの位置が無い・バージョンが合わない・書いた後の索引がチェックに通らない。`path` は索引の場所、`reason` はツールの結果にそのまま載せる文言
    kind: クラス
    inherits: RuleInjectError
enums:
  - name: LogOperation
    title: 失敗した操作
    container: shared/logger.py
    usecase: 共通
    summary: ログの `operation` の値
    values:
      - value: read_index
        title: 索引の読み込み
        description: 索引が読めない
      - value: read_record
        title: 既読の読み込み
        description: 記録ファイルが読めない
      - value: write_record
        title: 既読の追記
        description: 記録に書けない
      - value: delete_record
        title: 既読の削除
        description: 記録ファイルを削除できない
      - value: unexpected
        title: 想定外
        description: 上のどれにも当たらない例外
      - value: delete_log
        title: ログの削除
        description: 保持日数を過ぎたログのファイルか変更前のログを削除できない
      - value: write_history
        title: 既読の履歴の追記
        description: 既読の履歴に書けない
      - value: read_settings
        title: 設定ファイルの読み取り
        description: 設定ファイルが無い・読めない・知らないキーや許す値の外の値を持つ。既定のログのフォルダへ書く
  - name: Component
    title: 出した元
    container: shared/logger.py
    usecase: 共通
    summary: ログの `component` の値（インターフェース定義の識別子）
    values:
      - value: rule_guide
        title: ルール案内
        description: PreToolUse の案内
      - value: record_read
        title: 既読の記録
        description: PostToolUse
      - value: discard_read
        title: 既読の記録の破棄
        description: PreCompact
      - value: work_rules
        title: 作業の決まりの注入
        description: SessionStart
      - value: sweep_read
        title: 既読の記録の掃除
        description: SessionStart
      - value: search_guide
        title: 検索結果の案内
        description: PostToolUse の検索結果への案内
constants:
  - name: STATE_DIR_NAME
    title: 記録フォルダの名前
    container: shared/paths.py
    summary: 既定の記録フォルダの最後の名前
    value: '`rule-inject`'
  - name: LOG_DIR_NAME
    title: ログのフォルダの名前
    container: shared/paths.py
    summary: 既定のログのフォルダの最後の名前（既定の記録フォルダの下）
    value: '`logs`'
  - name: LOG_FILE_SUFFIX
    title: ログのファイル名の後半
    container: shared/logger.py
    summary: '`{yyyymmdd}` に続くログのファイル名の後半'
    value: '`_rule-inject.log`'
  - name: LEGACY_LOG_FILE_NAME
    title: 変更前のログのファイル名
    container: shared/logger.py
    summary: 記録フォルダの直下に残った変更前のログの名前
    value: '`rule-inject.log`'
  - name: DEFAULT_RECORD_RETENTION_DAYS
    title: 既読の記録の保持日数の既定
    container: shared/settings.py
    summary: 設定ファイルに `global.record_retention_days` が無いときの既読の記録の保持日数
    value: '`30`'
  - name: DEFAULT_LOG_RETENTION_DAYS
    title: ログの保持日数の既定
    container: shared/settings.py
    summary: 設定ファイルに `global.log_retention_days` が無いときのログの保持日数
    value: '`3`'
  - name: VARIABLE_PATTERN
    title: 変数参照の形式
    container: shared/variables.py
    summary: '`!{名前}` の正規表現。名前をグループで取る'
    value: '`!\{([A-Za-z_][A-Za-z0-9_]*)\}`'
  - name: CONFIG_ENV
    title: 設定ファイルの環境変数
    container: shared/settings.py
    summary: 設定ファイルの場所を指す環境変数の名前
    value: '`RULE_INJECT_CONFIG`'
  - name: USER_INDEX_DEFAULT
    title: ユーザーの索引の既定の置き場所
    container: shared/settings.py
    summary: '`global.indexes` が無いときに読む索引の、設定フォルダからのパス。設定フォルダは `XDG_CONFIG_HOME`（無いか空なら `~/.config`）'
    value: '`rule-inject/rules.yaml`'
  - name: PROJECT_INDEX_DEFAULT
    title: プロジェクトの索引の既定の置き場所
    container: shared/settings.py
    summary: 当たった `projects` の要素のどれも `indexes` を持たないときに読む索引の、`CLAUDE_PROJECT_DIR` からのパス
    value: '`rules.yaml`'
  - name: WORKTREES_DIR
    title: worktree の置き場所
    container: shared/settings.py
    summary: '`projects[].match` を当てるとき、この下を本体のリポジトリとして見るフォルダの、リポジトリの直下からのパス'
    value: '`.claude/worktrees`'
  - name: DEFAULT_SERVER_PORT
    title: MCPサーバーのポートの既定
    container: shared/settings.py
    summary: 設定ファイルに `global.server_port` が無いときのポート
    value: '`8783`'
  - name: PORT_ENV
    title: ポートを上書きする環境変数
    container: shared/settings.py
    summary: '`global.server_port` をその起動だけ上書きする環境変数の名前'
    value: '`"RULE_INJECT_PORT"`'
functions:
  - name: resolve_location
    title: 場所の解決
    container: shared/paths.py
    usecase: 共通
    summary: ルールの場所や対象のパスを、照合・記録に使う正規の形式へ揃える
    kind: 関数
    scope: public
    args:
      - name: location
        type: str
        required: true
        passing: positional
        description: 絶対パス・`~` で始まるパス・相対パス
      - name: base
        type: Path
        required: true
        passing: positional
        description: 相対パスを解く基準
    returns:
      type: str
      description: '`~` を展開して基準から解き、`..` を畳んだ絶対パス（シンボリックリンクは辿らない）'
    process: |-
      1. `~` を展開し、相対なら `base` と結ぶ
      2. `os.path.normpath` で畳んで返す
    unit_tests:
      - name: test_resolve_location_when_relative
        case: 正常
        summary: 相対パスを基準から解く
        condition: '`../r/a.md`、基準 `/p/idx`'
        mock: なし
        expected: '`/p/r/a.md`'
      - name: test_resolve_location_when_home
        case: 正常
        summary: '`~` を展開する'
        condition: '`~/r/a.md`'
        mock: なし
        expected: ホームの下の `r/a.md` の絶対パス
  - name: write_log
    title: ログの書き出し
    container: shared/logger.py
    usecase: 共通
    summary: 失敗した操作を ER 図「ログ」の形式で 1 行追記する
    kind: 関数
    scope: public
    side_effects: その時刻の日付のログのファイルに 1 行追記する。書けないときは標準エラー出力へ 1 行出す
    args:
      - name: log_folder
        type: Path
        required: true
        passing: positional
        description: ログのフォルダ（呼び出し元は `Settings.log_dir` を、設定ファイルが読めないときは `default_log_dir(env)` を渡す）
      - name: component
        type: Component
        required: true
        passing: keyword
        description: 出した元
      - name: operation
        type: LogOperation
        required: true
        passing: keyword
        description: 失敗した操作
      - name: reason
        type: str
        required: true
        passing: keyword
        description: 理由
      - name: session_id
        type: str | None
        required: false
        default: None
        passing: keyword
        description: セッション
      - name: path
        type: str | None
        required: false
        default: None
        passing: keyword
        description: 対象のパス
      - name: now
        type: Callable[[], datetime]
        required: false
        default: 現在の UTC の時刻
        passing: injected
        description: 時刻の取得
    returns:
      type: None
      description: なし
    process: |-
      1. `now()` を 1 回だけ呼び、時刻（UTC の ISO 8601）と引数を JSON の 1 行にする
      2. ログのフォルダを作り、`log_file_path(log_folder, その時刻の日付)` へ追記する
      3. OSError なら同じ 1 行を標準エラー出力へ出す（例外は送出しない）
    unit_tests:
      - name: test_write_log
        case: 正常
        summary: ログに 1 行追記する
        condition: 書ける一時フォルダ、`now` は固定の時刻
        mock: なし
        expected: '`now` の日付の `{yyyymmdd}_rule-inject.log` に time・component・session_id・operation・path・reason を持つ JSON が 1 行ある'
      - name: test_write_log_when_unwritable
        case: 異常
        summary: 書けないとき標準エラー出力へ出す
        condition: 書き込み権限の無いフォルダ
        mock: なし
        expected: 例外を送出せず、標準エラー出力に同じ JSON が 1 行出る
      - name: test_write_log_when_date_changes
        case: 正常
        summary: 日付が変わると別のファイルに書く
        condition: '`now` を 2026-09-29T23:59:59+00:00 と 2026-09-30T00:00:00+00:00 にして 1 回ずつ呼ぶ'
        mock: なし
        expected: '`20260929_rule-inject.log` と `20260930_rule-inject.log` に 1 行ずつある'
  - name: log_file_path
    title: ログのファイルのパス
    container: shared/logger.py
    usecase: 共通
    summary: その日付のログのファイルのパスを返す
    kind: 関数
    scope: public
    args:
      - name: log_folder
        type: Path
        required: true
        passing: positional
        description: ログのフォルダ
      - name: day
        type: date
        required: true
        passing: positional
        description: UTC の日付
    returns:
      type: Path
      description: '`{log_folder}/{yyyymmdd}{LOG_FILE_SUFFIX}`'
    process: |-
      1. `day` を `%Y%m%d` で文字にし、`LOG_FILE_SUFFIX` を続けた名前を `log_folder` と結ぶ

      案内文で利用者に見せるログの場所は、`log_file_path(Settings.log_dir, 今日（UTC）)`（設定ファイルが読めないときは `default_log_dir(env)`）を渡す
    unit_tests:
      - name: test_log_file_path
        case: 正常
        summary: 日付を頭に置いた名前になる
        condition: '`day` が 2026-09-29'
        mock: なし
        expected: '`{log_folder}/20260929_rule-inject.log`'
  - name: sweep_logs
    title: ログの掃除
    container: shared/logger.py
    usecase: 古いログが掃除される
    summary: 日付が保持日数以上前のログのファイルを削除し、削除できなかったものを返す
    kind: 関数
    scope: public
    side_effects: ログのファイルを削除する
    args:
      - name: log_folder
        type: Path
        required: true
        passing: positional
        description: ログのフォルダ
      - name: retention_days
        type: int
        required: true
        passing: positional
        description: 保持日数（1 以上）
      - name: today
        type: Callable[[], date]
        required: false
        default: 今日の UTC の日付
        passing: injected
        description: 今日の日付の取得
    returns:
      type: tuple[LogDeleteError, ...]
      description: 削除できなかったログのファイルごとの失敗。全て削除できたか削除するものが無ければ空
    process: |-
      1. `os.scandir(log_folder)` で直下を列挙する。フォルダが無ければ（FileNotFoundError）空を返す（フォルダは作らない）
      2. `retention_days` が `today()` から `date.min` までの日数より大きければ、削除するものが無いとして空を返す（日付の引き算が暦の範囲を超えないようにする）
      3. 名前が `{8 桁の数字}{LOG_FILE_SUFFIX}` で、数字が `%Y%m%d` として読め、シンボリックリンクを辿らずに通常のファイルの項目だけを対象にする
      4. 日付が `today() - retention_days 日` 以前のものを削除する。削除する前に無くなっていたもの（FileNotFoundError）は削除した状態と同じとして扱う
      5. 削除できないもの（その他の OSError）は LogDeleteError にして集め、残りの掃除を続ける
    exceptions:
      - name: OSError
        condition: ログのフォルダはあるが列挙できない（FileNotFoundError 以外）。捕まえずに送出し、フックの最上位が `unexpected` として扱う
    unit_tests:
      - name: test_sweep_logs
        case: 正常
        summary: 日付が保持日数以上前のファイルだけを削除する
        condition: '`today` を 2026-09-29 に固定、`retention_days` が 3、20260929・20260927・20260926 のログのファイル'
        mock: '`today`'
        expected: 20260926 のファイルが無く、他は残る。戻り値は空
      - name: test_sweep_logs_when_not_log
        case: 正常
        summary: ログのファイルでないものは削除しない
        condition: '`today` を固定、形式に合わない `notes.txt`・`2026_rule-inject.log`・`20261399_rule-inject.log`、名前が古い日付の形式に合うサブフォルダとシンボリックリンク'
        mock: '`today`'
        expected: どれも残る
      - name: test_sweep_logs_when_missing
        case: 正常
        summary: ログのフォルダが無ければ何もしない
        condition: まだ無いログのフォルダ
        mock: なし
        expected: 戻り値が空で、フォルダを作らない
      - name: test_sweep_logs_when_undeletable
        case: 異常
        summary: 削除できないログのファイルを返す
        condition: 保持日数を過ぎたログのファイルを置き、ログのフォルダを書き込み権限なし（`chmod 555`）
        mock: '`today`'
        expected: LogDeleteError が 1 件（path がそのファイル）で、ファイルが残る
      - name: test_sweep_logs_when_retention_too_long
        case: 正常
        summary: 暦の範囲を超えるほど大きい保持日数なら何も削除しない
        condition: '`today` を 2026-09-29 に固定、`retention_days` が 999999、日付が 2020-01-01 のログのファイル'
        mock: '`today`'
        expected: 例外を送出せず、ファイルが残り、戻り値は空
  - name: delete_legacy_log
    title: 変更前のログの削除
    container: shared/logger.py
    usecase: 古いログが掃除される
    summary: 記録フォルダに残った変更前のログを削除し、削除できなければ失敗を返す
    kind: 関数
    scope: public
    side_effects: '`{state_folder}/{LEGACY_LOG_FILE_NAME}` を削除する'
    args:
      - name: state_folder
        type: Path
        required: true
        passing: positional
        description: 記録フォルダ
    returns:
      type: LogDeleteError | None
      description: 削除できなかったときの失敗。削除できたか無かったときは None
    process: |-
      1. `{state_folder}/{LEGACY_LOG_FILE_NAME}` をシンボリックリンクを辿らずに調べ、通常のファイルでなければ（無いときも）None を返す
      2. 削除する。削除する前に無くなっていたもの（FileNotFoundError）は None を返す
      3. 削除できない（その他の OSError）ときは LogDeleteError を返す
    unit_tests:
      - name: test_delete_legacy_log
        case: 正常
        summary: 変更前のログを削除する
        condition: 記録フォルダに `rule-inject.log`
        mock: なし
        expected: ファイルが無く、None
      - name: test_delete_legacy_log_when_missing
        case: 正常
        summary: 無ければ何もしない
        condition: 記録フォルダが無い場合と、`rule-inject.log` が無い場合と、`rule-inject.log` がフォルダの場合（パラメータ展開）
        mock: なし
        expected: None。フォルダは残る
      - name: test_delete_legacy_log_when_undeletable
        case: 異常
        summary: 削除できないとき失敗を返す
        condition: '`rule-inject.log` を置き、記録フォルダを書き込み権限なし（`chmod 555`）'
        mock: なし
        expected: LogDeleteError（path がそのファイル）で、ファイルが残る
  - name: expand_variables
    title: 変数参照の展開
    container: shared/variables.py
    usecase: 共通
    summary: 文字列の `!{名前}` を環境変数の値に置き換え、展開できなかった名前と一緒に返す
    kind: 関数
    scope: public
    args:
      - name: text
        type: str
        required: true
        passing: positional
        description: 展開する文字列
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 環境変数
    returns:
      type: Expansion
      description: 展開した文字列と未設定の名前
    process: |-
      1. `VARIABLE_PATTERN` に当たる箇所を前から順に置き換える（`re.sub` を 1 回。置き換えた値の中の `!{…}` は展開し直さない）
      2. 名前が `env` にあればその値（空なら空文字）に、無ければ `!{名前}` のままにする
      3. 無かった名前を、重なりを落として出た順に `unresolved` へ並べる
    unit_tests:
      - name: test_expand_variables
        case: 正常
        summary: 設定された名前を展開する
        condition: '`a !{X} b !{X}`、`env` に `X=1`'
        mock: なし
        expected: '`text` が `a 1 b 1`、`unresolved` が空'
      - name: test_expand_variables_when_empty_value
        case: 正常
        summary: 空の値は空文字にする
        condition: '`[!{E}]`、`env` に `E=`'
        mock: なし
        expected: '`text` が `[]`、`unresolved` が空'
      - name: test_expand_variables_when_unset
        case: 正常
        summary: 未設定の名前を残して並べる
        condition: '`!{B} !{A} !{B}`、`env` が空'
        mock: なし
        expected: '`text` がそのまま、`unresolved` が `("B", "A")`'
      - name: test_expand_variables_when_not_name
        case: 正常
        summary: 名前の形式に合わないものは置き換えない
        condition: '`!{ X }`・`!{1X}`・`{X}`・`$X`、`env` に `X=1`'
        mock: なし
        expected: '`text` がそのまま、`unresolved` が空'
      - name: test_expand_variables_when_value_has_reference
