title: "プラグイン / 本文の取得"
lead: 'ルールの本文をローカルか URL から読み、応答の上限に収める。読む場所の選び出しと既読の記録は持たず、MCPサーバーの `read_rules` が組み立てる。'
directory: |-
  ```text
  src/rule_inject/features/fetch/
  ├── __init__.py   # 公開 API
  ├── types.py      # RulePage・FetchFailure・ReadRulesResult・FetchUrlFn
  ├── client.py     # URL の本文の取得（urllib）
  └── service.py    # 本文の読み込みと応答の上限への収め方
  ```
constants:
  - name: MAX_RESULT_CHARS
    title: 応答の上限
    container: features/fetch/service.py
    summary: 応答の JSON 全体の字数の上限（`anthropic/maxResultSizeChars` にも同じ値を付ける）
    value: '`40000`'
    refs:
      - dev/設計書/非機能要件/非機能要件#requirements[MCPのツールの応答の大きさ]
  - name: FETCH_TIMEOUT_SEC
    title: URL の取得の待ち時間
    container: features/fetch/client.py
    summary: URL 1 件あたりの待ち時間（秒）
    value: '`1.0`'
    refs:
      - dev/設計書/非機能要件/非機能要件#requirements[URLのルールの取得の待ち時間]
classes:
  - name: FetchError
    title: URL の取得の失敗
    container: features/fetch/client.py
    usecase: ルールの本文を取得する
    summary: HTTP の応答コード・待ち時間の超過・接続の失敗
    kind: クラス
    inherits: RuleInjectError
data_models:
  - name: RulePage
    title: ルールの本文
    container: features/fetch/types.py
    usecase: ルールの本文を取得する
    role: DTO
    summary: '`pages[]` の 1 件'
    properties:
      - name: location
        type: str
        description: 解決後の場所
      - name: body
        type: str
        description: 本文
  - name: FetchFailure
    title: 取得できなかった場所
    container: features/fetch/types.py
    usecase: ルールの本文を取得する
    role: DTO
    summary: '`failures[]` の 1 件'
    properties:
      - name: location
        type: str
        description: 場所
      - name: reason
        type: str
        description: 理由
  - name: ReadRulesResult
    title: read_rules の応答
    container: features/fetch/types.py
    usecase: ルールの本文を取得する
    role: DTO
    summary: 返す本文・次に回す場所・取得できなかった場所
    properties:
      - name: pages
        type: list[RulePage]
        description: 返す本文
      - name: deferred
        type: list[str]
        description: 上限に収まらず返さなかった場所
      - name: failures
        type: list[FetchFailure]
        description: 取得できなかった場所
function_types:
  - name: FetchUrlFn
    title: URL の取得の関数型
    container: features/fetch/types.py
    usecase: ルールの本文を取得する
    summary: URL と待ち時間を受けて本文を返す（テストで差し替える）
    args:
      - name: url
        type: str
        required: true
        description: URL
      - name: timeout
        type: float
        required: true
        description: 待ち時間（秒）
    returns:
      type: str
      description: 本文。失敗は FetchError
    implementations:
      - target: fetch_url
functions:
  - name: fetch_url
    title: URL の本文の取得
    container: features/fetch/client.py
    usecase: ルールの本文を取得する
    summary: URL を 1 回だけ GET して本文を返す（再試行しない）
    kind: 関数
    scope: public
    inherits: FetchUrlFn
    args:
      - name: url
        type: str
        required: true
        passing: positional
        description: '`https://` の URL'
      - name: timeout
        type: float
        required: false
        default: FETCH_TIMEOUT_SEC
        passing: positional
        description: 待ち時間（秒）
    returns:
      type: str
      description: UTF-8 で読んだ本文
    process: |-
      1. `https://` で始まらなければ、取得せずに `HTTPS でない URL は取得しない` で FetchError にする
      2. `urllib.request.urlopen` を `timeout` つきで 1 回呼ぶ
      3. 200 以外は `HTTP {コード}`、待ち時間の超過は `待ち時間（{timeout} 秒）の超過`、そのほかの URLError / OSError はその文面で FetchError にする
    exceptions:
      - name: FetchError
        condition: '`https://` でない URL'
      - name: FetchError
        condition: 200 以外の応答・待ち時間の超過・接続の失敗
    unit_tests:
      - name: test_fetch_url
        case: 正常
        summary: 本文を返す
        condition: 200 と本文を返す Mock
        mock: '`urllib.request.urlopen`'
        expected: 本文。urlopen に `timeout=1.0` が渡り、1 回だけ呼ばれる
      - name: test_fetch_url_when_http_error
        case: 異常
        summary: '404'
        condition: HTTPError(404) を送出する Mock
        mock: '`urllib.request.urlopen`'
        expected: FetchError（reason が `HTTP 404`）。1 回だけ呼ばれる
        exception: 200 以外の応答
      - name: test_fetch_url_when_timeout
        case: 異常
        summary: 待ち時間の超過
        condition: TimeoutError を送出する Mock
        mock: '`urllib.request.urlopen`'
        expected: FetchError（reason に待ち時間の超過）
        exception: 待ち時間の超過
      - name: test_fetch_url_when_http
        case: 異常
        summary: 平文の http:// は取得しない
        condition: '`http://example.com/a.md`'
        mock: '`urllib.request.urlopen`'
        expected: FetchError（reason が `HTTPS でない URL は取得しない`）、urlopen は呼ばれない
        exception: '`https://` でない URL'
    connectivity_tests:
      - name: test_ext_fetch_url_when_github_raw
        api: GitHub の raw のファイル
        summary: 実際の URL から本文を取得できる
        checks: '`https://raw.githubusercontent.com/shuhei1101/rule-inject/master/README.md` が 1 秒以内に返り、本文が空でない'
        cost: なし
  - name: render_result
    title: 応答の JSON 化
    container: features/fetch/service.py
    usecase: ルールの本文を取得する
    summary: ReadRulesResult を応答の JSON 文字列にする（字数の数え方と実際の応答を揃える）
    kind: 関数
    scope: public
    args:
      - name: result
        type: ReadRulesResult
        required: true
        passing: positional
        description: 応答
    returns:
      type: str
      description: '`ensure_ascii=False` の JSON'
    unit_tests:
      - name: test_render_result
        case: 正常
        summary: 3 つのキーを持つ JSON
        condition: pages 1 件・deferred 1 件・failures 1 件
        mock: なし
        expected: pages・deferred・failures を持ち、日本語がエスケープされていない
  - name: collect_pages
    title: 本文の収集
    container: features/fetch/service.py
    usecase: ルールの本文を取得する
    summary: 場所ごとに本文を読み、応答の上限に収めて返す
    kind: 関数
    scope: public
    args:
      - name: locations
        type: Sequence[str]
        required: true
        passing: positional
        description: 本文を読むルールの場所（解決後）
      - name: failures
        type: Sequence[FetchFailure]
        required: false
        default: '`()`'
        passing: keyword
        description: 呼び出し元が先に決めた、取得しない場所（応答の failures の先頭に載せ、上限の計算に含める）
      - name: fetch
        type: FetchUrlFn
        required: false
        default: fetch_url
        passing: injected
        description: URL の取得
      - name: limit
        type: int
        required: false
        default: MAX_RESULT_CHARS
        passing: keyword
        description: 応答の上限
    returns:
      type: ReadRulesResult
      description: 返す本文・次に回す場所・取得できなかった場所
    process: |-
      1. 場所ごとに本文を読む（URL は `fetch`、パスは UTF-8）。失敗は理由を添えて failures へ
      2. `render_result` で数えて本文 1 件だけで `limit` を超えるものは `1 件で応答の上限（{limit} 字）を超える` として failures へ
      3. 残りを順に見て、「載せた本文 + この本文」と「回した場所 + まだ判定していない場所」を deferred に入れた応答が `limit` に収まれば載せる
      4. 収まらないとき、本文を 1 件でも載せていれば deferred へ。まだ 1 件も載せていなければ `ほかの場所と合わせると応答の上限（{limit} 字）を超える。この場所だけを locations に渡して取り直す` として failures へ（呼び出しのたびに少なくとも 1 件が pages か failures に出て、呼び直しで進む）
    unit_tests:
      - name: test_collect_pages
        case: 正常
        summary: ローカルの本文を返す
        condition: 実在するルールのファイル 1 件
        mock: fetch
        expected: pages に 1 件。fetch は呼ばれない
      - name: test_collect_pages_when_url
        case: 正常
        summary: URL を fetch で取得する
        condition: URL 1 件、fetch は本文を返す
        mock: fetch
        expected: pages に URL と本文。fetch に URL と `1.0` が渡る
      - name: test_collect_pages_when_given_failures
        case: 正常
        summary: 呼び出し元の failures を先頭に載せる
        condition: '`failures` に 1 件、実在するルール 1 件'
        mock: なし
        expected: failures の先頭に渡した 1 件、pages に 1 件
      - name: test_collect_pages_when_over_limit
        case: 正常
        summary: 上限を超える本文を deferred へ回す
        condition: 50 字の本文 2 件と、`limit` を「本文 1 件と deferred 1 件を `render_result` した字数」にした呼び出し（ルールの場所は一時フォルダの絶対パスで長さが決まらないため）
        mock: なし
        expected: pages 1 件、deferred 1 件、応答は `limit` 以下
      - name: test_collect_pages_when_single_over_limit
        case: 正常
        summary: 1 件で上限を超える本文
        condition: '`limit=100` と 200 字の本文 1 件'
        mock: なし
        expected: failures に 1 件（上限を超える）
      - name: test_collect_pages_when_none_fit_with_others
        case: 正常
        summary: 1 件も載せられないときは進む形で返す
        condition: 単独なら収まるが、ほかの場所と合わせると `limit` を超える本文 3 件
        mock: なし
        expected: pages 0 件・deferred 0 件、failures に 3 件（単独で取り直す理由）。応答の deferred が空で、同じ場所を増えずに次に回さない
      - name: test_collect_pages_when_fetch_failed
        case: 正常
        summary: 取得できない場所を failures へ
        condition: 実在しないローカルの場所と、FetchError を送出する URL
        mock: fetch
        expected: failures に 2 件、pages は空
