title: "プラグイン / コマンドの解析"
lead: Bash のコマンドの文字列から、読むコマンドが読むファイルの絶対パスを取り出し、検索のコマンドとその結果の行から実在するファイルを拾う。
directory: |-
  ```text
  src/rule_inject/features/command/
  ├── __init__.py   # 公開 API
  └── service.py    # 読むコマンドの引数からパスを取り出し、検索の結果の行からパスを拾う
  ```
constants:
  - name: READ_COMMANDS
    title: 読むコマンド
    container: features/command/service.py
    summary: ルール案内が読む操作として扱うコマンド
    value: '`frozenset({"cat", "head", "tail", "less", "more", "grep", "rg", "sed", "awk", "wc", "bat"})`'
  - name: FULL_READ_COMMANDS
    title: 全体を読むコマンド
    container: features/command/service.py
    summary: 既読の記録が既読にするコマンド（本文全体を出すもの）
    value: '`frozenset({"cat", "bat", "less", "more"})`'
  - name: SEARCH_COMMANDS
    title: 検索のコマンド
    container: features/command/service.py
    summary: 検索結果の案内が結果を読むコマンド
    value: '`frozenset({"grep", "rg", "find", "ls"})`'
  - name: SEARCH_PATH_LIMIT
    title: 照合するパスの数
    container: features/command/service.py
    summary: 検索の結果から拾って照合するパスの上限
    value: '`100`'
    refs:
      - dev/設計書/非機能要件/非機能要件#requirements[検索結果から照合するパスの数]
functions:
  - name: extract_read_paths
    title: 読むパスの取り出し
    container: features/command/service.py
    usecase: 共通
    summary: コマンドの文字列から、指定のコマンドが読む実在するファイルの絶対パスを返す
    kind: 関数
    scope: public
    args:
      - name: command
        type: str
        required: true
        passing: positional
        description: Bash のコマンド
      - name: cwd
        type: Path
        required: true
        passing: positional
        description: 相対パスを解く基準（フックの入力の `cwd`）
      - name: commands
        type: frozenset[str]
        required: true
        passing: positional
        description: 対象にするコマンド名（`READ_COMMANDS` か `FULL_READ_COMMANDS`）
    returns:
      type: list[str]
      description: 実在するファイルの絶対パス（出てきた順、重なりなし）
    process: |-
      1. `shlex`（`punctuation_chars=True`）で語に分ける。引用符が閉じていないなどで分けられなければ空を返す
      2. `&&` / `||` / `;` / `|` で区切った各コマンドを順に見る。`cd {フォルダ}` は以降の基準を動かす
      3. 先頭の語のベース名が `commands` にあれば、`-` で始まらない引数を基準から解き、実在するファイルだけを残す
    unit_tests:
      - name: test_extract_read_paths
        case: 正常
        summary: cd とパイプをまたいでパスを取り出す
        condition: '`cd src && cat app.py | head -n 5`、`src/app.py` が実在、`READ_COMMANDS`'
        mock: なし
        expected: '`{cwd}/src/app.py` の 1 件'
      - name: test_extract_read_paths_when_pattern_arg
        case: 正常
        summary: 実在しない引数を捨てる
        condition: '`grep -n foo a.md`、`a.md` だけ実在'
        mock: なし
        expected: '`a.md` の絶対パスだけ'
      - name: test_extract_read_paths_when_not_full_read
        case: 正常
        summary: 対象外のコマンドは見ない
        condition: '`grep foo a.md`、`FULL_READ_COMMANDS`'
        mock: なし
        expected: 空
      - name: test_extract_read_paths_when_unparsable
        case: 正常
        summary: 分けられないコマンド
        condition: '`cat "a.md`（引用符が閉じていない）'
        mock: なし
        expected: 空（例外を送出しない）
  - name: search_output_base
    title: 検索の出力の基準
    container: features/command/service.py
    usecase: 検索の結果に出たファイルのルールの案内を受ける
    summary: コマンドが検索のコマンドなら、その出力の相対パスを解くフォルダを返す
    kind: 関数
    scope: public
    args:
      - name: command
        type: str
        required: true
        passing: positional
        description: Bash のコマンド
      - name: cwd
        type: Path
        required: true
        passing: positional
        description: フックの入力の `cwd`
    returns:
      type: Path | None
      description: 出力を解くフォルダ。検索のコマンドでなければ None
    process: |-
      1. `extract_read_paths` と同じ規則で語に分け、記号だけの語でコマンドごとに区切る。分けられなければ None
      2. `cd {フォルダ}` を除いた最初のコマンドの先頭の語のベース名が `SEARCH_COMMANDS` に無ければ None（名前の部分一致にしない）
      3. 基準は `cwd` をそれまでの `cd` で動かしたフォルダにする。`ls` で、`-` で始まらない引数が 1 つだけでそれが実在するフォルダなら、そのフォルダを基準にする
    unit_tests:
      - name: test_search_output_base
        case: 正常
        summary: 検索のコマンドの基準を返す
        condition: '`find src -type f | head`'
        mock: なし
        expected: '`cwd`'
      - name: test_search_output_base_when_cd
        case: 正常
        summary: cd で基準を動かす
        condition: '`cd sub && grep -rl foo .`'
        mock: なし
        expected: '`{cwd}/sub`'
      - name: test_search_output_base_when_ls_dir
        case: 正常
        summary: ls のフォルダを基準にする
        condition: '`ls -1 src`、`src` が実在するフォルダ'
        mock: なし
        expected: '`{cwd}/src`'
      - name: test_search_output_base_when_not_search
        case: 正常
        summary: 検索でないコマンドは None
        condition: '`git merge main`、`cat a.md`、`rgx foo`'
        mock: なし
        expected: どれも None
      - name: test_search_output_base_when_unparsable
        case: 正常
        summary: 分けられないコマンド
        condition: '`grep "foo`'
        mock: なし
        expected: None（例外を送出しない）
  - name: extract_result_paths
    title: 結果の行からのパスの拾い出し
    container: features/command/service.py
    usecase: 検索の結果に出たファイルのルールの案内を受ける
    summary: 検索の結果の行から実在するファイルの絶対パスを拾い、上限までを照合するパスにする
    kind: 関数
    scope: public
    args:
      - name: lines
        type: Iterable[str]
        required: true
        passing: positional
        description: Grep・Glob の `filenames` の各要素か、Grep の `content`・Bash の `stdout` の各行
      - name: base
        type: Path
        required: true
        passing: positional
        description: 相対パスを解くフォルダ
      - name: limit
        type: int
        required: false
        default: SEARCH_PATH_LIMIT
        passing: keyword
        description: 照合するパスの上限
    returns:
      type: ResultPaths
      description: 照合するパスと照合しない件数
    process: |-
      1. 行ごとに前後の空白を落とし、行全体を `base` から解いて実在するファイルならそのパスを拾う
      2. そうでなければ最初の `:` より前を解いて、実在するファイルなら拾う（`{パス}:{行番号}:{行}` と `{パス}:{件数}`）。フォルダ・実在しないものは捨てる
      3. 拾ったパスの重なりを落とし、出た順に先頭から `limit` 件を `paths`、残りの件数を `unchecked` にする
    unit_tests:
      - name: test_extract_result_paths
        case: 正常
        summary: パスだけの行と `{パス}:…` の行を拾う
        condition: '`a.py`・`b.md:3:x`・`b.md:1`・`missing.py`・`sub`（フォルダ）の 5 行。`a.py` と `b.md` が実在'
        mock: なし
        expected: '`paths` が `{base}/a.py` と `{base}/b.md` の 2 件、`unchecked` が 0'
      - name: test_extract_result_paths_when_colon_in_name
        case: 正常
        summary: 名前に `:` を含むファイルを行全体で拾う
        condition: 実在する `a:b.md` の 1 行
        mock: なし
        expected: '`{base}/a:b.md` の 1 件'
      - name: test_extract_result_paths_when_over_limit
        case: 正常
        summary: 上限を超えた分を件数にする
        condition: 実在するファイル 105 行、`limit=100`
        mock: なし
        expected: '`paths` が先頭 100 件、`unchecked` が 5'
test_files:
  - tests/unit/rule_inject/features/command/test_service.py
data_models:
  - name: ResultPaths
    title: 検索の結果から拾ったパス
    container: features/command/service.py
    usecase: 検索の結果に出たファイルのルールの案内を受ける
    role: DTO
    summary: 照合するパスと、上限で照合しなかったパスの件数
    properties:
      - name: paths
        type: tuple[str, ...]
        description: 照合する実在するファイルの絶対パス（出た順、重なりなし、`limit` 件まで）
      - name: unchecked
        type: int
        description: 上限を超えて照合しない実在するファイルの件数
