title: "プラグイン / フック"
lead: Claude Code が呼ぶフックの入口。標準入力の JSON を読み、機能の関数を呼んで標準出力へ JSON を返し、想定外の例外も捕まえて終了コード 0 で終える。標準ライブラリだけで動く。
directory: |-
  ```text
  .claude-plugin/
  ├── plugin.json                 # プラグインの名前（rule-inject）とバージョン
  └── marketplace.json            # このリポジトリを marketplace（rule-inject）として載せる定義。プラグインはリポジトリの直下（`./`）の 1 つ
  hooks/
  ├── hooks.json                  # 6 つのフックの matcher・timeout（1 秒）・コマンド
  └── run.py                      # src/ を sys.path に追加して引数のフックを動かす
  src/rule_inject/hooks/
  ├── __init__.py
  ├── _runner.py                  # 標準入出力・想定外の例外・ログ・設定ファイルの誤りのログの共通処理
  ├── rule_guide.py               # ルール案内（PreToolUse）
  ├── record_read.py              # 既読の記録（PostToolUse）
  ├── search_guide.py             # 検索結果の案内（PostToolUse）
  ├── discard_read.py             # 既読の記録の破棄（PreCompact）
  ├── sweep_read.py               # 既読の記録の掃除（SessionStart）
  └── work_rules.py               # 作業の決まりの注入（SessionStart）
  ```
notes:
  hooks.json: '6 つのフックとも `timeout: 1`、コマンドは `python3 "${CLAUDE_PLUGIN_ROOT}/hooks/run.py" {名前}`。matcher は PreToolUse のルール案内が `Read|Grep|Edit|Write|NotebookEdit|Bash|mcp__.*`、PostToolUse の既読の記録が `Read|Bash|mcp__.*`、検索結果の案内が `Grep|Glob|Bash`。PreCompact と SessionStart は matcher を持たない。SessionStart には作業の決まりの注入と既読の記録の掃除の 2 つのコマンドを並べる'
  Python のバージョン: フックは利用者の `python3` で動くため、`rule_inject` のコードは Python 3.12 より新しい書き方・標準ライブラリを使わない。`pyproject.toml` の `requires-python` は `>=3.12`
