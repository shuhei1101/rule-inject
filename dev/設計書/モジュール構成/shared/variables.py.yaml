title: "プラグイン / 共通 / variables.py"
test_files:
  - tests/unit/rule_inject/shared/test_variables.py
constants:
  - name: VARIABLE_PATTERN
    title: 変数参照の形式
    container: shared/variables.py
    summary: '`!{名前}` の正規表現。名前をグループで取る'
    value: '`!\{([A-Za-z_][A-Za-z0-9_]*)\}`'
functions:
  - name: expand_variables
    title: 変数参照の展開
    container: shared/variables.py
    usecase: 共通
    summary: 文字列の `!{名前}` を環境変数の値に置き換え、展開できなかった名前と一緒に返す
    kind: 関数
    scope: public
    args:
      - name: text
        type: str
        required: true
        passing: positional
        description: 展開する文字列
      - name: env
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 環境変数
    returns:
      type: Expansion
      description: 展開した文字列と未設定の名前
    process: |-
      1. `VARIABLE_PATTERN` に当たる箇所を前から順に置き換える（`re.sub` を 1 回。置き換えた値の中の `!{…}` は展開し直さない）
      2. 名前が `env` にあればその値（空なら空文字）に、無ければ `!{名前}` のままにする
      3. 無かった名前を、重なりを落として出た順に `unresolved` へ並べる
    unit_tests:
      - name: test_expand_variables
        case: 正常
        summary: 設定された名前を展開する
        condition: '`a !{X} b !{X}`、`env` に `X=1`'
        mock: なし
        expected: '`text` が `a 1 b 1`、`unresolved` が空'
      - name: test_expand_variables_when_empty_value
        case: 正常
        summary: 空の値は空文字にする
        condition: '`[!{E}]`、`env` に `E=`'
        mock: なし
        expected: '`text` が `[]`、`unresolved` が空'
      - name: test_expand_variables_when_unset
        case: 正常
        summary: 未設定の名前を残して並べる
        condition: '`!{B} !{A} !{B}`、`env` が空'
        mock: なし
        expected: '`text` がそのまま、`unresolved` が `("B", "A")`'
      - name: test_expand_variables_when_not_name
        case: 正常
        summary: 名前の形式に合わないものは置き換えない
        condition: '`!{ X }`・`!{1X}`・`{X}`・`$X`、`env` に `X=1`'
        mock: なし
        expected: '`text` がそのまま、`unresolved` が空'
      - name: test_expand_variables_when_value_has_reference
        case: 正常
        summary: 値の中の変数参照は展開し直さない
        condition: '`!{X}`、`env` に `X=!{Y}` と `Y=2`'
        mock: なし
        expected: '`text` が `!{Y}`'
data_models:
  - name: Expansion
    title: 変数参照の展開の結果
    container: shared/variables.py
    usecase: 共通
    role: DTO
    summary: 展開した文字列と、展開できなかった名前
    properties:
      - name: text
        type: str
        description: 設定された名前を値に置き換え、未設定の名前を `!{名前}` のまま残した文字列
      - name: unresolved
        type: tuple[str, ...]
        description: 未設定の名前。重なりを落とし、出た順に並べる
