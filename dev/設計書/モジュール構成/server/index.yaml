    summary: 索引のチェックのツールと続きの位置の変換
  - page: dev_docs.py.yaml
    summary: dev-docs から使われているタグを引くクライアント
  - page: record_tools.py.yaml
    summary: 既読の記録の確認・削除のツール
  - page: types.py.yaml
    summary: 応答の形式の種類と応答のモデル
  - page: _format.py.yaml
    summary: 応答の形式と長さの切り詰め
  - page: admin_tools.py.yaml
    summary: サーバーの状態の確認・設定の再読込・再起動・更新のツール
  - page: control.py.yaml
    summary: 処理中の呼び出しの数と再起動の状態、停止の進め方
