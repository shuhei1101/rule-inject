title: "MCP サーバー / サーバー / check_tools.py"
test_files:
  - tests/unit/rule_inject/server/test_check_tools.py
functions:
  - name: check_indexes
    title: 索引のチェック
    container: server/check_tools.py
    usecase: 索引をチェックする
    summary: インターフェース定義「索引のチェック」のツールの本体
    kind: 関数
    scope: public
    args:
      - name: project_dir
        type: str
        required: true
        passing: keyword
        description: プロジェクトの直下
      - name: format
        type: ResponseFormat
        required: false
        default: '"markdown"'
        passing: keyword
        description: 応答の形式
      - name: include_global
        type: bool
        required: false
        default: 'False'
        passing: keyword
        description: ユーザー全体の索引の `paths` の当たらないエントリも確かめるか
      - name: cursor
        type: str | None
        required: false
        default: None
        passing: keyword
        description: 前の呼び出しの `unmatched_scan.next_cursor`
      - name: env
        type: Mapping[str, str]
        required: true
        passing: injected
        description: サーバーを起動した環境変数
      - name: validator
        type: jsonschema.protocols.Validator
        required: true
        passing: injected
        description: '`load_validator` の戻り値'
      - name: scan_time_limit
        type: float
        required: true
        passing: injected
        description: プロジェクトのファイルを辿る時間の上限（秒）
      - name: dev_docs_timeout
        type: float
        required: true
        passing: injected
        description: dev-docs への問い合わせの待ち時間の上限（秒）
    returns:
      type: CallToolResult
      description: '`respond(CheckIndexesResult, format)`'
    process: |-
      1. `_project_settings(project_dir, env)` で設定を読む。`cursor` があれば `_decode_scan_cursor(cursor, project_dir, include_global)` で続きの位置に戻す
      2. `settings.indexes` を順に `check_index(index, env, validator=validator)` で確かめ、問題を種類ごとに `IndexReport` の一覧へ分ける。`origin` は索引が `settings.project_indexes` に入っていれば `project`、無ければ `global`
      3. 読めた索引を全て `read_index` で読み、`tag_patterns` でタグのパターンを集める。辿るのは、そのうち `project` のもの（`include_global` が True なら全て）
      4. `asyncio.TaskGroup` の中で、パターンが 1 つ以上あれば先に `fetch_used_tags(settings.dev_docs_url, project_dir, timeout=dev_docs_timeout)` のタスクを作り、続けて `asyncio.to_thread(scan_unmatched, project_dir, contents, cursor=..., time_limit=scan_time_limit)` を待つ（問い合わせと辿るのを並べて行い、辿り終えた後に問い合わせの応答を待つ）。辿った結果の問題を索引ごとの `unmatched_paths` へ入れる
      5. `unmatched_scan` に辿った状態を入れる。止まったときは `reason` に上限の秒数と `next_cursor` を `cursor` に渡すと続きから辿れる旨、`next_cursor` に `_encode_scan_cursor` の文字列を入れる
      6. `tag_check` を決める。パターンが無ければ `no_patterns`、`UsedTags.reason` があれば `skipped` とその理由、それ以外は `checked` にして `unused_tag_patterns(patterns, used.tags)` の結果を索引ごとの `unused_tag_patterns` へ入れる（`global` と `project` のどちらの索引も）
      7. `problem_count` に、全ての索引の `hook_error`・`violations`・`missing_rules`・`skipped_entries` と `project` の索引の `unmatched_paths` の件数の合計を入れ（`unused_tag_patterns` は数えない）、`respond` で返す
    exceptions:
      - name: ToolError
        condition: '`_project_settings` が送出する、または `_decode_scan_cursor` が送出する'
        message: '`_project_settings` と同じ、または `cursor` が使えない旨'
    unit_tests:
      - name: test_check_indexes
        case: 正常
        summary: 問題を種類ごとに分け、件数を合計する
        condition: 違反 1 件とファイルの無いルール 1 件を持つ索引と、無い索引
        mock: なし
        expected: '`problem_count` が 3。無い索引は `hook_error` だけを持つ'
      - name: test_check_indexes_when_unmatched
        case: 正常
        summary: プロジェクトの索引の `paths` の当たらないエントリだけを載せて数える
        condition: '`global.indexes` とプロジェクトの索引の両方に当たらないエントリを 1 件ずつ、`include_global` は既定'
        mock: なし
        expected: '`project` の索引だけが `unmatched_paths` 1 件を持ち、`problem_count` が 1'
      - name: test_check_indexes_when_include_global
        case: 正常
        summary: '`include_global` でユーザー全体の索引も載せ、数えない'
        condition: 前のテストと同じで `include_global=True`
        mock: なし
        expected: 両方の索引が `unmatched_paths` 1 件を持ち、`problem_count` が 1
      - name: test_check_indexes_when_time_limit
        case: 正常
        summary: 辿る時間の上限で止まると続きの位置を返し、渡すと続きから辿る
        condition: 2 ファイルのプロジェクト、`scan_time_limit=0`。返った `next_cursor` を `cursor` に渡して呼び直す
        mock: なし
        expected: 1 回目は `completed` が False で `reason` に秒数と `cursor` を含む。2 回目は `scanned_files` が 2
      - name: test_check_indexes_when_cursor_invalid
        case: 異常
        summary: 使えない `cursor` を断る
        condition: '`cursor: "broken"`'
        mock: なし
        expected: ToolError
        exception: '`_project_settings` が送出する、または `_decode_scan_cursor` が送出する'
      - name: test_check_indexes_when_tag_unused
        case: 正常
        summary: 使われていないタグのパターンを全ての索引に載せ、数えない
        condition: '`global.indexes` の索引とプロジェクトの索引に `args: {"filter[tags]": ["pyhton"]}` のエントリを 1 件ずつ、`include_global` は既定'
        mock: '`fetch_used_tags` を `UsedTags(tags=("python",), reason=None)` を返して引数を記録する関数に差し替える'
        expected: 両方の索引が `unused_tag_patterns` 1 件（`location` `args`・`key` `filter[tags]`・`pattern` `pyhton`・`rev`）を持つ。`tag_check.state` が `checked`、`problem_count` が 0。`fetch_used_tags` の呼び出しが 1 回で、接続先が `Settings.dev_docs_url`、`cwd` に渡す値が `project_dir`
      - name: test_check_indexes_when_tag_check_skipped
        case: 正常
        summary: dev-docs に届かないときはタグの確かめだけを飛ばす
        condition: 前のテストの索引に、ファイルの無いルールのエントリを 1 件加える
        mock: '`fetch_used_tags` を `UsedTags(tags=(), reason="x")` を返す関数に差し替える'
        expected: '`tag_check` が `skipped`・`reason` `x`。どの索引の `unused_tag_patterns` も空。`missing_rules` 1 件で `problem_count` が 1'
      - name: test_check_indexes_when_no_tag_patterns
        case: 正常
        summary: タグのパターンが無ければ dev-docs に問い合わせない
        condition: '`args: {"filter.tags": ["go"]}` だけを持つ索引'
        mock: '`fetch_used_tags` を呼ばれた回数を数える関数に差し替える'
        expected: '`tag_check` が `no_patterns`・`reason` None。`fetch_used_tags` が呼ばれていない'
      - name: test_check_indexes_when_query_parallel
        case: 正常
        summary: dev-docs への問い合わせを、ファイルを辿るのと並べて行う
        condition: タグのパターンを 1 つ持つ索引
        mock: '`fetch_used_tags` を、呼ばれたら `threading.Event` を立てて `UsedTags(tags=("a",), reason=None)` を返す関数に、`scan_unmatched` を、その Event を 5 秒まで待ち、待てたかを記録して本物を呼ぶ関数に差し替える'
        expected: 偽の `scan_unmatched` が Event を待てている（辿り終える前に問い合わせが始まっている）。`tag_check.state` が `checked`
    is_async: true
  - name: _encode_scan_cursor
    title: 続きの位置の文字列化
    container: server/check_tools.py
    usecase: 索引をチェックする
    summary: '`ScanCursor` と `project_dir`・`include_global` を 1 つの不透明な文字列にする'
    kind: 関数
    scope: internal
    args:
      - name: cursor
        type: ScanCursor
        required: true
        passing: positional
        description: 続きの位置
      - name: project_dir
        type: str
        required: true
        passing: positional
        description: 呼び出しの `project_dir`
      - name: include_global
        type: bool
        required: true
        passing: positional
        description: 呼び出しの `include_global`
    returns:
      type: str
      description: JSON を base64url（末尾の `=` なし）にした文字列
    process: 1. 全ての項目を JSON にし、`base64.urlsafe_b64encode` で文字列にする
  - name: _decode_scan_cursor
    title: 続きの位置の復元
    container: server/check_tools.py
    usecase: 索引をチェックする
    summary: '`_encode_scan_cursor` の文字列を `ScanCursor` に戻し、呼び出しの `project_dir`・`include_global` と合うかを確かめる'
    kind: 関数
    scope: internal
    args:
      - name: cursor
        type: str
        required: true
        passing: positional
        description: 受けた `cursor`
      - name: project_dir
        type: str
        required: true
        passing: positional
        description: 呼び出しの `project_dir`
      - name: include_global
        type: bool
        required: true
        passing: positional
        description: 呼び出しの `include_global`
    returns:
      type: ScanCursor
      description: 続きの位置
    process: |-
      1. base64url と JSON として読み、項目の型を確かめる。読めなければ `ToolError`
      2. `project_dir`・`include_global` が呼び出しと違えば `ToolError`
      3. `ScanCursor` を返す
    exceptions:
      - name: ToolError
        condition: 文字列が読めない、または `project_dir`・`include_global` が前の呼び出しと違う
        message: '`cursor` が使えない旨と、`cursor` を省いて最初から辿るか前の呼び出しと同じ値で渡す旨'
    unit_tests:
      - name: test_decode_scan_cursor
        case: 正常
        summary: 文字列にした続きの位置を戻す
        condition: '`_encode_scan_cursor` の文字列と同じ `project_dir`・`include_global`'
        mock: なし
        expected: 元と同じ `ScanCursor`
      - name: test_decode_scan_cursor_when_mismatched
        case: 異常
        summary: 呼び出しの引数が違えば断る
        condition: '`include_global` を変えて渡す'
        mock: なし
        expected: ToolError
        exception: 文字列が読めない、または `project_dir`・`include_global` が前の呼び出しと違う
