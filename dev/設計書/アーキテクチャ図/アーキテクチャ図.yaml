title: "アーキテクチャ図"
overview:
  direction: LR
  nodes:
    - id: U
      label: ユーザー
      shape: stadium
      kind: actor
    - id: CC
      label: Claude Code
      kind: external
    - id: HOOK
      label: フック
      kind: system
    - id: STATE
      label: 既読の記録
      shape: cylinder
      kind: store
    - id: IDX
      label: ルール索引（YAML）
      shape: cylinder
      kind: store
    - id: RULE
      label: ルールの本文（ローカル）
      shape: cylinder
      kind: store
    - id: SRV
      label: MCP サーバー
      kind: system
    - id: DD
      label: dev-docs
      kind: external
  edges:
    - from: U
      to: IDX
      label: 記述
    - from: CC
      to: HOOK
      label: フックの呼び出し
    - from: CC
      to: RULE
      label: Read
    - from: HOOK
      to: IDX
      label: 照合
    - from: HOOK
      to: STATE
      label: 読み書き
    - from: CC
      to: SRV
      label: ツールの呼び出し（HTTP）
    - from: SRV
      to: IDX
      label: 照合・書き込み
    - from: SRV
      to: DD
      label: 使われているタグの問い合わせ（HTTP）
  subgraphs:
    - id: SYS
      label: rule-inject
      nodes:
        - HOOK
        - SRV
        - STATE
repository:
  style: モノレポ
  repositories:
    - name: shuhei1101/rule-inject
subsystems:
  - name: プラグイン
    scope: plugin
    role: Claude Code の操作の対象に当たる未読のルールの案内と、既読の記録
    runtime: Python 3（標準ライブラリだけ）
    runs_on: ユーザーの端末（Linux / WSL）
  - name: MCP サーバー
    scope: server
    role: 効いているルールの一覧・検索、索引のチェックとエントリの作成・編集・削除を MCP のツールで提供する常駐のサーバー
    runtime: Python 3（mcp・jsonschema・ruamel.yaml）
    runs_on: ユーザーの端末（Linux / WSL）の 127.0.0.1
    refs:
      - dev/設計書/インターフェース定義/MCPサーバー/サーバーの起動.py#
    status: planned
lead: rule-inject のサブシステムと、Claude Code・ルールの置き場所との境界。
external_systems:
  - name: Claude Code
    purpose: フックの呼び出し
    direction: 双方向
    protocol: フックの JSON（標準入出力）
    notes:
      事前確認: 不要。Claude Code がフックを起動する側のため、呼ばれた時点で到達している。
    detail: dev/設計書/外部ライブラリ/claude-code#
  - name: dev-docs
    purpose: '`check_indexes` で使われているタグを引く'
    direction: 双方向
    protocol: MCP（Streamable HTTP）
    detail: dev/設計書/外部API/dev-docs#
    status: planned
constraints: |-
  - フックは Python の標準ライブラリだけで書く
  - 動かす場所はユーザーの端末（Linux / WSL）で、フックは MCP サーバーが動いていなくても案内できる
  - 特定の開発基盤に依存する処理と、特定の開発基盤や作者の環境を思わせる語を持たない
