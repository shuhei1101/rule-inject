title: "claude-code"
kind: "CLI"
version:
  current: 2.1.296
  checked_on: '2026-10-13'
  source: '`claude --version`'
catalogs:
  - name: フック
    version: 2.1.284
    entries:
      - name: PreToolUse
        kind: フック
        purpose: ツールを呼ぶ直前に、案内（`permissionDecision` / `permissionDecisionReason` / `additionalContext`）と引数の置き換え（`updatedInput`）を返す
      - name: PostToolUse
        kind: フック
        purpose: ツールを呼んだ後に、読んだ場所を既読として記録し、`read_rules` の結果を `updatedMCPToolOutput` で置き換える
      - name: PreCompact
        kind: フック
        purpose: 圧縮の前に既読の記録を捨てる
      - name: SessionStart
        kind: フック
        purpose: セッションの開始時に作業の決まりを載せ、保持期間を過ぎた既読の記録を消す
  - name: プラグインのファイル
    version: 2.1.284
    entries:
      - name: .claude-plugin/plugin.json
        kind: ファイル
        purpose: プラグインの名前と版
      - name: hooks/hooks.json
        kind: ファイル
        purpose: フックの出来事・matcher・コマンド・timeout
      - name: .mcp.json
        kind: ファイル
        purpose: 同梱の MCP サーバーの起動コマンド
      - name: CLAUDE_PLUGIN_ROOT
        kind: 環境変数
        purpose: フックと `.mcp.json` の中でプラグインの場所を指す
      - name: .claude-plugin/marketplace.json
        kind: ファイル
        purpose: リポジトリを marketplace として載せ、`/plugin marketplace add` と `/plugin install` で入れられるようにする
      - name: CLAUDE_PLUGIN_DATA
        kind: 環境変数
        purpose: 版をまたいで残るプラグインのデータの場所。`.mcp.json` で MCP サーバーの仮想環境（`UV_PROJECT_ENVIRONMENT`）を指す
  - name: セッションの記録
    version: 2.1.296
    entries:
      - name: attachment.type が hook_additional_context の行
        kind: 記録の行
        purpose: フックが返した案内の文面を載せる、セッションの記録（`.jsonl`）の行。案内の回数はこの行の数で数える
        description: '`type` が `attachment`、`attachment.type` が `hook_additional_context`。`attachment.content` は文字列の配列で、行の直下の `rendered[].content` に `<system-reminder>` で包んだ写しを持つ。'
lead: Anthropic の AI コーディングエージェントの CLI（`claude`）。プラグインが持つフックと MCP サーバーを読み込み、出来事ごとに呼ぶ。
dependency_scope: 必須
adoption: 採用
upstream: anthropics/claude-code
license: Anthropic の商用利用規約（オープンソースではない）
docs_url: https://code.claude.com/docs/en/hooks
verification:
  state: 未確認
  date: '2026-09-29'
  detail: PoC 検証（#4）と設計の段で、`-p` での `updatedInput` の注入・`permissionDecisionReason` の長さ・`/compact` での `PreCompact` を確かめた。本実装のフックは、入力の JSON を標準入力へ渡す単体テストで確かめ、`claude plugin validate` でプラグインと marketplace のマニフェストを通した。実際の Claude Code に本実装のフックと MCP サーバーを動かさせる確認は API の利用（課金）が要り、E2E テストの実行を担う tester が行うため、この工程では動かせない
