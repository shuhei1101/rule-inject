docs_url: https://yaml.dev/doc/ruamel.yaml/
dependency_scope: 任意
adoption: 採用
used_in:
  - src/rule_inject/features/index/edit/_yaml.py
  - src/rule_inject/features/index/edit/service.py
  - src/rule_inject/features/index/check/service.py
