title: "mcp"
kind: "ライブラリ"
version:
  current: 2.2.0
  latest: 2.2.0
  checked_on: '2026-09-29'
  source: '`uv.lock`'
  pinning: '`mcp>=2.2,<3`'
catalogs:
  - name: API
    version: 2.2.0
    entries:
      - name: MCPServer
        kind: クラス
        purpose: stdio の MCP サーバーを作る（`mcp.server.mcpserver`）
      - name: MCPServer.tool
        kind: デコレータ
        purpose: 関数をツールとして登録し、引数の型と docstring から入力の Schema と説明を作る
      - name: MCPServer.run
        kind: メソッド
        purpose: stdio でサーバーを動かす
lead: Model Context Protocol の公式の Python SDK。MCP のサーバーとクライアントを書くためのクラスを持つ。
purl: pkg:pypi/mcp
dependency_scope: 開発のみ
adoption: 採用
upstream: modelcontextprotocol/python-sdk
license: MIT（商用利用可）
official_url: https://github.com/modelcontextprotocol/python-sdk
verification:
  state: 済
  date: '2026-09-29'
  detail: 本実装で 2.2.0（uv.lock）の `MCPServer.tool`（`name`・`meta`・`Annotated` の `Field` による引数の説明）を、単体テストのインメモリのクライアントと stdio の子プロセスで動かし、ツールの一覧の `_meta`・引数の説明・`ToolError` のエラー応答が想定どおりに返ることを確かめた。Claude Code からの呼び出しは PoC 検証（#4）で確かめた
selection:
  candidates: 公式の Python SDK（`mcp`）だけを候補にした。
  decision: Issue の構成方針（MCP サーバーは Python の uv のプロジェクト）に合う公式の実装で、stdio のサーバーを数行で書ける。
  consequences: |-
    2.x で `FastMCP` が `MCPServer`（`mcp.server.mcpserver`）に改名されているため、1.x の書き方は使わない。メジャーバージョンで API が変わるので `<3` で固定する。

    プラグインの MCP サーバーを廃止し（#44）、プラグインの依存から外した。E2E テストの `read_by` のシナリオで立てる文書の MCP サーバーだけが使う。
used_in:
  - tests/e2e/conftest.py
