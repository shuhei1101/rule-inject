id: SC-122-7
title: "リポジトリの索引を登録する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし。実の Claude Code を `claude -p --plugin-dir {プラグイン}` で動かしてスキルを実行する
      - name: 端末の設定
        description: '`global-setup` で作った内容の端末の設定'
      - name: サーバー
        description: '`RULE_INJECT_PORT` の空いているポートで起動したサーバー'
      - name: 索引
        description: リポジトリの直下の `rules.yaml`
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant SK as setup
        participant CF as 端末の設定
        participant SV as MCP サーバー

        U->>SK: 実行する
        SK->>CF: あることを確認する
        SK->>SV: 索引のチェック
        SV-->>SK: 参照する索引と問題
        SK-->>U: 既定で参照される旨とチェックの結果を示す
      ```
    expected:
      - 端末の設定が変わっていない
      - 結果に `rules.yaml` のパスとチェックの結果が記載されている
    test: test_normal
  - name: 正常シナリオ（別の場所の索引を登録する）
    setup:
      - name: Mock
        description: 正常シナリオと同じ
      - name: 端末の設定
        description: 正常シナリオと同じ
      - name: サーバー
        description: 正常シナリオと同じ
      - name: 引数
        description: リポジトリの中の `rules/project.yaml` をスキルの引数で指定する
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant SK as setup
        participant CF as 端末の設定
        participant SV as MCP サーバー

        U->>SK: 実行する（索引のパス）
        SK->>CF: projects の要素を記載する
        SK->>SV: 索引のチェック
        SV-->>SK: 参照する索引と問題
        SK-->>U: 記載した要素とチェックの結果を示す
      ```
    expected:
      - 端末の設定の `projects` に、リポジトリを指す `match` と索引の `indexes` を持つ要素がある
      - 結果に記載した要素とチェックの結果が記載されている
    test: test_normal_when_custom_index
  - name: 異常シナリオ（端末の設定が無い）
    setup:
      - name: Mock
        description: 正常シナリオと同じ
      - name: 環境変数
        description: '`XDG_CONFIG_HOME` をファイルの無いテスト用のフォルダへ向ける'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant SK as setup

        U->>SK: 実行する
        SK-->>U: global-setup を案内して止まる
      ```
    expected:
      - 端末の設定が作られていない
      - 結果に `global-setup` の案内が記載されている
    test: test_error_when_settings_missing
  - name: 異常シナリオ（索引が無い）
    setup:
      - name: Mock
        description: 正常シナリオと同じ
      - name: 端末の設定
        description: 正常シナリオと同じ
      - name: 索引
        description: リポジトリの直下に `rules.yaml` を配置せず、引数も指定しない
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant SK as setup

        U->>SK: 実行する
        SK->>SK: rules.yaml が無い
        SK-->>U: 索引の書式の案内を示して止まる
      ```
    expected:
      - 端末の設定が変わっていない
      - 結果に索引が無い旨が記載されている
    test: test_error_when_index_missing
  - name: 異常シナリオ（サーバーにつながらない）
    setup:
      - name: Mock
        description: 正常シナリオと同じ
      - name: 端末の設定
        description: 正常シナリオと同じ
      - name: 環境変数
        description: '`RULE_INJECT_PORT` に、どのサーバーも待ち受けていないポートを指定する'
      - name: 索引
        description: 正常シナリオと同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant SK as setup
        participant SV as MCP サーバー

        U->>SK: 実行する
        SK->>SV: 索引のチェック
        SV-->>SK: 接続できない
        SK-->>U: サーバーの起動の案内を示して止まる
      ```
    expected:
      - 端末の設定が変わっていない
      - 結果に `global-setup` かサーバーの起動の案内が記載されている
    test: test_error_when_server_unreachable
lead: 利用者が `setup` のスキルを実行し、リポジトリの索引が参照される状態にして、索引のチェックの結果を受け取る。
issue: 105
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: リポジトリの索引が有効なことを確認できること
trigger: 利用者がリポジトリで `/rule-inject:setup` を実行する
preconditions:
  - プラグインを読み込んでいる
success_guarantee: リポジトリの索引がそのリポジトリで読まれ、索引のチェックの結果が示される。
minimal_guarantee: 端末の設定が無いときと、リポジトリに索引が無いときは、端末の設定を書き換えない。
test_file: tests/e2e/単一ユースケース/test_register_repository_index.py
