title: "MCPサーバーを常駐させる"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし。実の Claude Code を `claude -p --setting-sources project --plugin-dir {プラグイン}` で 2 つ並行に動かし、利用者の設定のフック・プラグインを読み込ませない
      - name: ポート
        description: テスト用の空いているポートを `RULE_INJECT_PORT` で、MCP サーバーと 2 つの Claude Code の両方に渡す
        notes: 利用者が使う 8783 の常駐サーバーとぶつけない
      - name: 常駐サーバー
        description: '`python -m rule_inject.server` を起動し、ポートで待ち受けるまで待つ'
        notes: 索引を指す環境変数（`RULE_INJECT_INDEXES_*`）は、常駐サーバーを起動した環境には置かない
      - name: ルールの本文
        description: ローカルに置いたルールの Markdown を 2 つ
        notes: 応答に出たかでどちらの本文が返ったかを見分ける文字列を、それぞれに含める
      - name: 索引
        description: ルール 1 を当てる索引と、ルール 2 を当てる索引の YAML を 1 つずつ
        notes: 2 つのエントリは同じパスの glob を持ち、どちらの索引で引いたかだけで当たるルールが分かれるようにする
      - name: セッションごとの値
        description: セッション 1 の Claude Code には索引 1 を、セッション 2 の Claude Code には索引 2 を、`RULE_INJECT_INDEXES_USER` で渡す
      - name: 操作
        description: 2 つのセッションのプロンプトで、同じ対象のパスを渡してツールを 1 回呼ぶよう指示する
        notes: '`--allowedTools` でツールを許可する'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant MCP as 常駐の MCP サーバー
        participant CC1 as Claude Code（セッション 1）
        participant CC2 as Claude Code（セッション 2）
        participant H as PreToolUse フック

        U->>MCP: 起動する（RULE_INJECT_PORT）
        MCP->>MCP: 127.0.0.1 のポートの /mcp で待ち受ける
        CC1->>H: MCP のツール（対象のパス）
        H-->>CC1: 元の引数にセッション 1 の session_id とセッションごとの値を足した引数
        CC1->>MCP: read_rules（対象のパス + session_id + セッションごとの値）
        MCP->>MCP: セッション 1 の値で索引 1 を引く
        MCP-->>CC1: ルール 1 の本文
        CC2->>H: MCP のツール（対象のパス）
        H-->>CC2: 元の引数にセッション 2 の session_id とセッションごとの値を足した引数
        CC2->>MCP: read_rules（対象のパス + session_id + セッションごとの値）
        MCP->>MCP: セッション 2 の値で索引 2 を引く
        MCP-->>CC2: ルール 2 の本文
      ```
    expected:
      - セッション 1 のツールの応答にルール 1 の本文だけが載り、ルール 2 の本文が載っていない
      - セッション 2 のツールの応答にルール 2 の本文だけが載り、ルール 1 の本文が載っていない
      - セッション 1 の既読の記録にルール 1 の場所だけが、セッション 2 の既読の記録にルール 2 の場所だけが載っている
      - ポートで待ち受ける MCP サーバーのプロセスが 1 つだけで、Claude Code の起動で増えていない
      - MCP サーバーが待ち受けるアドレスが `127.0.0.1` だけである
    test: test_normal
  - name: 正常シナリオ（ポートを指定しない）
    setup:
      - name: Mock
        description: なし。MCP サーバーだけを起動する
      - name: ポート
        description: '`RULE_INJECT_PORT` を置かずに起動する'
        notes: 8783 が空いていないときはテストを飛ばす（利用者の常駐サーバーを止めない）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant MCP as 常駐の MCP サーバー

        U->>MCP: 起動する（RULE_INJECT_PORT なし）
        MCP->>MCP: 127.0.0.1:8783 の /mcp で待ち受ける
      ```
    expected:
      - '`127.0.0.1:8783` の `/mcp` に MCP の initialize を送ると応答が返る'
    test: test_normal_when_port_not_set
  - name: 正常シナリオ（停止する）
    setup:
      - name: Mock
        description: なし。MCP サーバーだけを起動する
      - name: ポート
        description: テスト用の空いているポートを `RULE_INJECT_PORT` で渡す
      - name: 常駐サーバー
        description: '`python -m rule_inject.server` を起動し、ポートで待ち受けるまで待つ'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant MCP as 常駐の MCP サーバー

        U->>MCP: 停止する（SIGTERM）
        MCP-->>U: 終了する
      ```
    expected:
      - MCP サーバーのプロセスが終了している
      - ポートで待ち受けるプロセスが無い
    test: test_normal_when_stopped
  - name: 異常シナリオ（ポートが使われている）
    setup:
      - name: Mock
        description: なし。MCP サーバーだけを起動する
      - name: ポート
        description: テストが先に待ち受けたポートを `RULE_INJECT_PORT` で渡す
        notes: ポートが使われている状態を決定的に起こす
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant MCP as 常駐の MCP サーバー

        U->>MCP: 起動する（使われているポート）
        MCP->>MCP: 待ち受けられない
        MCP-->>U: ポートの番号と理由を出して終了する
      ```
    expected:
      - MCP サーバーのプロセスが 0 以外の終了コードで終わる
      - 標準エラー出力に、ポートの番号と使われていることが載っている
    test: test_error_when_port_in_use
  - name: 異常シナリオ（ポートの値が不正）
    setup:
      - name: Mock
        description: なし。MCP サーバーだけを起動する
      - name: ポート
        description: '`RULE_INJECT_PORT` に 1〜65535 の整数でない値（`abc`）を渡す'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant MCP as 常駐の MCP サーバー

        U->>MCP: 起動する（RULE_INJECT_PORT=abc）
        MCP->>MCP: ポートの値を読めない
        MCP-->>U: 環境変数の名前と値を出して終了する
      ```
    expected:
      - MCP サーバーのプロセスが 0 以外の終了コードで終わる
      - 標準エラー出力に、`RULE_INJECT_PORT` と渡した値が載っている
    test: test_error_when_port_invalid
lead: 利用者が MCP サーバーを HTTP の常駐サーバーとして起動し、並行する複数の Claude Code のセッションが 1 つのサーバーのプロセスを共有して `read_rules` を呼ぶ。待ち受けのポートは既定で 8783 で、環境変数 `RULE_INJECT_PORT` で変えられる。
issue: 36
primary_actor: 利用者
trigger: 利用者が `python -m rule_inject.server` で MCP サーバーを起動する
preconditions:
  - プラグインが Claude Code に読み込まれている
  - uv が入っている
