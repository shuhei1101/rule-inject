title: "終わったセッションの既読の記録が掃除される"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし。実の Claude Code を `claude -p --setting-sources project --plugin-dir {プラグイン}` で動かし、利用者の設定のフック・プラグインを読み込ませない
      - name: 古い既読の記録
        description: 終わったセッションの記録ファイルを 1 つ置き、最終更新を保持期間より 1 日前にする
        notes: 最終更新は `os.utime` で戻す
      - name: 新しい既読の記録
        description: 別のセッションの記録ファイルを 1 つ置き、最終更新を保持期間より 1 日新しく（保持期間の内側に）する
      - name: 操作
        description: プロンプトで、ツールを呼ばずに 1 語で答えるよう指示する
        notes: '`--max-turns 1`。セッションの開始で掃除が走ればよく、ツールは呼ばせない'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant S as SessionStart フック
        participant ST as 既読の記録

        CC->>S: セッションの開始（session_id・source）
        S->>ST: 最終更新が保持期間を過ぎた記録ファイルを探す
        ST-->>S: 古い記録ファイル
        S->>ST: 古い記録ファイルを消す
      ```
    expected:
      - 古い既読の記録ファイルが無い
      - 新しい既読の記録ファイルが残っている
    test: test_normal
lead: セッションの開始時に `SessionStart` フックが、最終更新から保持期間を過ぎた既読の記録ファイルを消す。圧縮しないまま終わったセッションの記録ファイルも、保持期間を過ぎれば残らない。
issue: 5
primary_actor: Claude Code のセッション
trigger: セッションの開始（新規・再開・`/clear`・圧縮の後）
notes:
  終わりで消さない理由: 'Claude Code は会話を保持期間（`cleanupPeriodDays`、既定 30 日）のあいだ残し、`/exit` や `/clear` で終えたセッションも `--resume` か `/resume` で再開できる。再開したセッションは同じ `session_id` で続き、読んだルールの本文も文脈に残る（PR #9 の PoC 検証の回 4）。セッションの終わり（`SessionEnd`）で記録を消すと、再開したときに読んだルールがまた案内されるため、終わりでは消さず、保持期間で消す'
test_file: tests/e2e/単一ユースケース/test_ended_session_records_cleaned.py
