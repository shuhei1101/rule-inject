title: ""
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし。実の Claude Code を `claude -p --setting-sources project --plugin-dir {プラグイン}` で動かし、利用者の設定のフック・プラグインを読み込ませない
      - name: 古い既読の記録
        description: 終わったセッションの記録ファイルを 1 つ置き、最終更新を保持期間より 1 日前にする
        notes: 最終更新は `os.utime` で戻す
      - name: 新しい既読の記録
        description: 別のセッションの記録ファイルを 1 つ置き、最終更新を保持期間より 1 日新しく（保持期間の内側に）する
      - name: 操作
        description: プロンプトで、ツールを呼ばずに 1 語で答えるよう指示する
        notes: '`--max-turns 1`。セッションの開始で掃除が走ればよく、ツールは呼ばせない'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant S as SessionStart フック
        participant ST as 既読の記録

        CC->>S: セッションの開始（session_id・source）
        S->>ST: 最終更新が保持期間を過ぎた記録ファイルを探す
        ST-->>S: 古い記録ファイル
        S->>ST: 古い記録ファイルを消す
      ```
    expected:
      - 古い既読の記録ファイルが無い
      - 新しい既読の記録ファイルが残っている
    test: test_normal
