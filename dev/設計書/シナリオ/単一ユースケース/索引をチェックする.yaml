title: "索引をチェックする"
scenarios:
  - name: 正常シナリオ（違反が無い）
    setup:
      - name: Mock
        description: なし。テストがローカルのクローンから常駐の MCP サーバーを起動し、MCP の Python SDK のクライアント（Streamable HTTP）でツールを呼ぶ
        notes: クライアントが Claude Code の代わりにツールを呼ぶ
      - name: 設定ファイル
        description: '`projects` にプロジェクトの直下を `match` とする要素とプロジェクトの索引を持つ'
        notes: '`RULE_INJECT_CONFIG` で指す'
      - name: 索引
        description: 索引の書式どおりのエントリだけを持ち、各 `rule` の場所にルールの本文があり、各 `paths` がプロジェクトのファイルのどれかに当たる YAML
        notes: '-'
    flow: |-
      sequenceDiagram
        participant CL as MCP クライアント
        participant SV as MCP サーバー
        participant CF as 設定ファイル
        participant IDX as 索引
        participant SC as 索引の JSON Schema
        participant FS as ルールの本文

        CL->>SV: チェック（プロジェクトの直下）
        SV->>CF: プロジェクトに当たる索引を引く
        CF-->>SV: 索引の場所
        SV->>IDX: フックと同じ読み取りで読む
        IDX-->>SV: 読めた
        SV->>SC: 索引を照らす
        SC-->>SV: 違反なし
        SV->>FS: 各エントリのルールの場所を確かめる
        FS-->>SV: ある
        SV-->>CL: 索引ごとに違反なし
    expected:
      - 応答に、チェックした索引の場所と、読んだ設定ファイルの場所が載っている
      - 応答のどの索引にも、違反とファイルが無いエントリと `paths` の当たらないエントリが無い
    test: test_normal_when_no_violation
  - name: 正常シナリオ（Schemaに違反する）
    setup:
      - name: Mock
        description: 違反が無いシナリオと同じ（SDK のクライアントでツールを呼ぶ）
      - name: 設定ファイル
        description: 違反が無いシナリオと同じ
      - name: 索引
        description: フックは読めるが、索引の書式の値の範囲を外れるエントリを 1 つ持つ YAML
        notes: '例: `paths: []`（フックは読めるが、Schema は要素が 1 つ以上のリストを求める）'
    flow: |-
      sequenceDiagram
        participant CL as MCP クライアント
        participant SV as MCP サーバー
        participant CF as 設定ファイル
        participant IDX as 索引
        participant SC as 索引の JSON Schema

        CL->>SV: チェック（プロジェクトの直下）
        SV->>CF: プロジェクトに当たる索引を引く
        CF-->>SV: 索引の場所
        SV->>IDX: フックと同じ読み取りで読む
        IDX-->>SV: 読めた
        SV->>SC: 索引を照らす
        SC-->>SV: 違反
        SV-->>CL: 違反（索引の場所・索引の中の場所・理由）
    expected:
      - 応答の違反に、索引の場所と、索引の中の場所（例 `rules[0].paths`）と理由が載っている
    test: test_normal_when_schema_violated
  - name: 正常シナリオ（フックが読めない）
    setup:
      - name: Mock
        description: 違反が無いシナリオと同じ（SDK のクライアントでツールを呼ぶ）
      - name: 設定ファイル
        description: 違反が無いシナリオと同じ
      - name: 索引
        description: フックの読み取りが受け付けない書式（2 行にまたがるフロー形式のリスト）を含む YAML
    flow: |-
      sequenceDiagram
        participant CL as MCP クライアント
        participant SV as MCP サーバー
        participant CF as 設定ファイル
        participant IDX as 索引

        CL->>SV: チェック（プロジェクトの直下）
        SV->>CF: プロジェクトに当たる索引を引く
        CF-->>SV: 索引の場所
        SV->>IDX: フックと同じ読み取りで読む
        IDX-->>SV: 読めない（行と理由）
        SV-->>CL: フックが読めない理由（Schema には照らさない）
    expected:
      - 応答に、その索引をフックが読めないことと、行の番号を含む理由が載っている
      - その索引には Schema の違反が載っていない
    test: test_normal_when_unreadable_by_hook
  - name: 正常シナリオ（ルールの場所にファイルが無い）
    setup:
      - name: Mock
        description: 違反が無いシナリオと同じ（SDK のクライアントでツールを呼ぶ）
      - name: 設定ファイル
        description: 違反が無いシナリオと同じ
      - name: 索引
        description: '`rule` の場所にファイルが無いエントリを 1 つ持つ YAML'
    flow: |-
      sequenceDiagram
        participant CL as MCP クライアント
        participant SV as MCP サーバー
        participant CF as 設定ファイル
        participant IDX as 索引
        participant SC as 索引の JSON Schema
        participant FS as ルールの本文

        CL->>SV: チェック（プロジェクトの直下）
        SV->>CF: プロジェクトに当たる索引を引く
        CF-->>SV: 索引の場所
        SV->>IDX: フックと同じ読み取りで読む
        IDX-->>SV: 読めた
        SV->>SC: 索引を照らす
        SC-->>SV: 違反なし
        SV->>FS: 各エントリのルールの場所を確かめる
        FS-->>SV: 無い場所が 1 つ
        SV-->>CL: ファイルが無いエントリ
    expected:
      - 応答のファイルが無いエントリに、索引の場所・エントリの位置・解決したルールの場所が載っている
    test: test_normal_when_rule_file_missing
  - name: 正常シナリオ（pathsがどのファイルにも当たらない）
    setup:
      - name: Mock
        description: 違反が無いシナリオと同じ（SDK のクライアントでツールを呼ぶ）
        notes: '-'
      - name: 設定ファイル
        description: 違反が無いシナリオの設定に、`global.indexes` でユーザー全体の索引を指す
        notes: '-'
      - name: プロジェクトのファイル
        description: プロジェクトの直下に置いた数個のファイル
        notes: '例: `src/app.py` だけを置く'
      - name: 索引
        description: '`paths` がプロジェクトのファイルに当たるエントリと、どのファイルにも当たらないエントリを 1 つずつ持ち、各 `rule` の場所にルールの本文がある YAML'
        notes: '例: 当たる `**/*.py` と、当たらない `**/*.rs`'
      - name: ユーザー全体の索引
        description: '`paths` がプロジェクトのどのファイルにも当たらないエントリを 1 つ持ち、`rule` の場所にルールの本文がある YAML'
        notes: '例: `**/*.go`'
    flow: |-
      sequenceDiagram
        participant CL as MCP クライアント
        participant SV as MCP サーバー
        participant CF as 設定ファイル
        participant IDX as 索引
        participant SC as 索引の JSON Schema
        participant PJ as プロジェクトのファイル

        CL->>SV: チェック（プロジェクトの直下）
        SV->>CF: プロジェクトに当たる索引を引く
        CF-->>SV: 索引の場所
        SV->>IDX: フックと同じ読み取りで読む
        IDX-->>SV: 読めた
        SV->>SC: 索引を照らす
        SC-->>SV: 違反なし
        SV->>PJ: プロジェクトの直下からファイルを辿る
        PJ-->>SV: ファイルの絶対パス
        SV->>SV: プロジェクトの索引の効いているエントリの paths と exclude を各パスに当てる
        SV-->>CL: paths の当たらないエントリ
    expected:
      - 応答の `paths` の当たらないエントリに、索引の場所・エントリの位置・解決したルールの場所が載っている
      - '`paths` がファイルに当たるエントリは、`paths` の当たらないエントリに載っていない'
      - ユーザー全体の索引のエントリは、`paths` の当たらないエントリに載っていない
      - 索引のファイルが書き換わっていない
    test: test_normal_when_paths_unmatched
  - name: 正常シナリオ（ユーザー全体の索引も確かめる）
    setup:
      - name: Mock
        description: 違反が無いシナリオと同じ（SDK のクライアントでツールを呼ぶ）
        notes: '-'
      - name: 設定ファイル
        description: paths がどのファイルにも当たらないシナリオと同じ
        notes: '-'
      - name: プロジェクトのファイル
        description: paths がどのファイルにも当たらないシナリオと同じ
        notes: '-'
      - name: 索引
        description: paths がどのファイルにも当たらないシナリオと同じ
        notes: '-'
      - name: ユーザー全体の索引
        description: paths がどのファイルにも当たらないシナリオと同じ
        notes: '-'
      - name: ツールの引数
        description: ユーザー全体の索引も確かめる引数をオンにする
        notes: '-'
    flow: |-
      sequenceDiagram
        participant CL as MCP クライアント
        participant SV as MCP サーバー
        participant CF as 設定ファイル
        participant IDX as 索引
        participant SC as 索引の JSON Schema
        participant PJ as プロジェクトのファイル

        CL->>SV: チェック（プロジェクトの直下・ユーザー全体の索引も確かめる）
        SV->>CF: プロジェクトに当たる索引を引く
        CF-->>SV: 索引の場所（ユーザー全体・プロジェクト）
        SV->>IDX: フックと同じ読み取りで読む
        IDX-->>SV: 読めた
        SV->>SC: 索引を照らす
        SC-->>SV: 違反なし
        SV->>PJ: プロジェクトの直下からファイルを辿る
        PJ-->>SV: ファイルの絶対パス
        SV->>SV: 全ての索引の効いているエントリの paths と exclude を各パスに当てる
        SV-->>CL: paths の当たらないエントリ（プロジェクトの索引・ユーザー全体の索引を分けて）
    expected:
      - 応答のプロジェクトの索引の `paths` の当たらないエントリに、プロジェクトの索引の当たらないエントリだけが載っている
      - 応答に、ユーザー全体の索引の当たらないエントリが、索引の場所・エントリの位置・解決したルールの場所つきで分けて載っている
      - '`problem_count` にユーザー全体の索引の当たらないエントリが数えられていない'
      - 索引のファイルが書き換わっていない
    test: test_normal_when_global_included
  - name: 正常シナリオ（タグのパターンが使われているどのタグにも当たらない）
    setup:
      - name: Mock
        description: '違反が無いシナリオと同じ（SDK のクライアントでツールを呼ぶ）。dev-docs は、テストが起動した文書の MCP サーバーに差し替え、`search_docs` の `group_by: tags` に決まったタグの一覧を返させる'
        notes: '例: `python`・`mcp` の 2 つのタグを返す'
      - name: 設定ファイル
        description: 違反が無いシナリオの設定に、dev-docs の接続先として差し替えた文書の MCP サーバーを指す
      - name: 索引
        description: 'MCP のツールの引数の条件の木の `field: tags` の値に当てるエントリを 2 つ持ち、各 `rule` の場所にルールの本文があり、各 `paths` を持たない YAML'
        notes: '例: 使われているタグに当たる `re:^python` と、どのタグにも当たらない `re:^rust`'
    flow: |-
      sequenceDiagram
        participant CL as MCP クライアント
        participant SV as MCP サーバー
        participant CF as 設定ファイル
        participant IDX as 索引
        participant DD as dev-docs

        CL->>SV: チェック（プロジェクトの直下）
        SV->>CF: プロジェクトに当たる索引と dev-docs の接続先を引く
        CF-->>SV: 索引の場所と接続先
        SV->>IDX: フックと同じ読み取りで読む
        IDX-->>SV: 読めた
        SV->>DD: 使われているタグを件数つきで引く
        DD-->>SV: タグの一覧
        SV->>SV: 効いているエントリのタグのパターンを各タグに当てる
        SV-->>CL: 使われているどのタグにも当たらないタグのパターン
    expected:
      - 応答の使われていないタグのパターンに、索引の場所・エントリの位置・どのタグにも当たらないパターンが載っている
      - 使われているタグに当たるパターンは、使われていないタグのパターンに載っていない
      - 応答に、タグの確かめを飛ばしたことが載っていない
      - 索引のファイルが書き換わっていない
    test: test_normal_when_tag_pattern_unused
  - name: 異常シナリオ（dev-docsに届かない）
    setup:
      - name: Mock
        description: 違反が無いシナリオと同じ（SDK のクライアントでツールを呼ぶ）。dev-docs は起動しない
      - name: 設定ファイル
        description: 違反が無いシナリオの設定に、dev-docs の接続先として待ち受けていないポートを指す
      - name: 索引
        description: タグのパターンが使われているどのタグにも当たらないシナリオと同じ YAML に、`rule` の場所にファイルが無いエントリを 1 つ加えたもの
        notes: タグの確かめを飛ばしても、ほかの問題を返すことを見分ける
    flow: |-
      sequenceDiagram
        participant CL as MCP クライアント
        participant SV as MCP サーバー
        participant CF as 設定ファイル
        participant IDX as 索引
        participant FS as ルールの本文
        participant DD as dev-docs

        CL->>SV: チェック（プロジェクトの直下）
        SV->>CF: プロジェクトに当たる索引と dev-docs の接続先を引く
        CF-->>SV: 索引の場所と接続先
        SV->>IDX: フックと同じ読み取りで読む
        IDX-->>SV: 読めた
        SV->>FS: 各エントリのルールの場所を確かめる
        FS-->>SV: 無いものがある
        SV->>DD: 使われているタグを件数つきで引く
        DD--xSV: 接続できない
        SV-->>CL: ファイルが無いエントリと、タグの確かめを飛ばしたこと
    expected:
      - 応答に、タグの確かめを飛ばしたことと、dev-docs に接続できなかった理由が載っている
      - 応答の使われていないタグのパターンに、どのエントリも載っていない
      - 応答に、`rule` の場所にファイルが無いエントリが載っている
      - ツールはエラーを返さない
    test: test_error_when_dev_docs_unreachable
lead: Claude Code が常駐の MCP サーバーのチェックのツールにプロジェクトの直下を渡し、そのプロジェクトで読む索引ごとに、フックが読めない理由・索引の JSON Schema への違反・`rule` の場所にファイルが無いエントリを受け取る。
issue: 58
primary_actor: Claude Code のセッション
stakeholders:
  - name: 利用者
    interest: 手で書いた索引の誤りを、案内が出なくなってからではなく、書いた直後に場所つきで知れること
trigger: Claude Code がチェックのツールを呼ぶ
preconditions:
  - MCP サーバーが常駐し、Claude Code に HTTP の MCP サーバーとして登録されている
  - フックとサーバーが同じ設定ファイルを読む
success_guarantee: 索引ごとに、まずフックと同じ読み取りで読み、読めたときだけ JSON Schema に照らす。違反は索引の場所・索引の中の場所・理由を持つ。
minimal_guarantee: 索引とサーバーの状態を書き換えない。
test_file: tests/e2e/単一ユースケース/test_check_indexes.py
