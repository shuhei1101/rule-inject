title: "ルールの本文を取得する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし。実の Claude Code を `claude -p --setting-sources project --plugin-dir {プラグイン}` で動かし、利用者の設定のフック・プラグインを読み込ませない
      - name: ルールの本文
        description: ローカルに置いたルールの Markdown
        notes: 応答に出たかで本文が返ったことを見分ける文字列を含める
      - name: 索引
        description: ルールの場所を持つエントリを 1 つ持つ YAML
      - name: 操作
        description: プロンプトで、ルールの場所を渡してツールを 1 回呼ぶよう指示する
        notes: '`--allowedTools` でツールを許可する'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as PreToolUse フック
        participant MCP as MCP サーバー
        participant RULE as ルールの本文
        participant ST as 既読の記録

        CC->>H: MCP のツール（ルールの場所）
        H-->>CC: 元の引数に session_id を足した引数
        CC->>MCP: ルールの場所 + session_id
        MCP->>RULE: 本文を読む
        RULE-->>MCP: 本文
        MCP->>ST: そのセッションの既読に場所を足す
        MCP-->>CC: 本文
      ```
    expected:
      - ツールの応答にルールの本文が載っている
      - そのセッションの既読の記録に、ルールの場所が載っている
    test: test_normal
  - name: 正常シナリオ（対象のパスで引く）
    setup:
      - name: Mock
        description: 正常シナリオと同じ（`claude -p --setting-sources project --plugin-dir {プラグイン}`）
      - name: ルールの本文
        description: ローカルに置いたルールの Markdown を 2 つ
        notes: 対象のパスに当たるものと当たらないもの。応答で見分ける文字列をそれぞれに含める
      - name: 索引
        description: 2 つのルールに、当てるパスの glob が違うエントリを 1 つずつ持つ YAML
      - name: 操作
        description: プロンプトで、対象のファイルのパスを渡してツールを 1 回呼ぶよう指示する
        notes: '`--allowedTools` でツールを許可する'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as PreToolUse フック
        participant MCP as MCP サーバー
        participant IDX as 索引
        participant RULE as ルールの本文
        participant ST as 既読の記録

        CC->>H: MCP のツール（対象のパス）
        H-->>CC: 元の引数に session_id を足した引数
        CC->>MCP: 対象のパス + session_id
        MCP->>IDX: 対象のパスに当たるエントリを引く
        IDX-->>MCP: 当たったルールの場所
        MCP->>RULE: 本文を読む
        RULE-->>MCP: 本文
        MCP->>ST: そのセッションの既読に場所を足す
        MCP-->>CC: 当たったルールの本文
      ```
    expected:
      - ツールの応答に、対象のパスに当たるルールの本文だけが載っている
      - そのセッションの既読の記録に、当たったルールの場所だけが載っている
    test: test_normal_when_by_target_path
  - name: 異常シナリオ（場所から本文を取れない）
    setup:
      - name: Mock
        description: 正常シナリオと同じ（`claude -p --setting-sources project --plugin-dir {プラグイン}`）
      - name: 索引
        description: 実在しないローカルのパスをルールの場所に持つエントリを 1 つ持つ YAML
        notes: 取得の失敗を決定的に起こす
      - name: 操作
        description: プロンプトで、その場所を渡してツールを 1 回呼ぶよう指示する
        notes: '`--allowedTools` でツールを許可する'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as PreToolUse フック
        participant MCP as MCP サーバー
        participant RULE as ルールの本文
        participant ST as 既読の記録

        CC->>H: MCP のツール（ルールの場所）
        H-->>CC: 元の引数に session_id を足した引数
        CC->>MCP: ルールの場所 + session_id
        MCP->>RULE: 本文を読む
        RULE-->>MCP: 読めない
        MCP-->>CC: 取得できなかった場所と理由
      ```
    expected:
      - ツールの応答に、取得できなかった場所と理由が載っている
      - そのセッションの既読の記録に、その場所が載っていない
    test: test_error_when_location_unreadable
lead: Claude Code が MCP サーバーのツールで、ルールの場所か対象のパスを渡してルールの本文を受け取る。取得できた場所は、そのセッションの既読として記録される。
issue: 2
primary_actor: Claude Code のセッション
trigger: Claude Code が、案内に載ったルールの場所か、これから触るファイルのパスを渡してツールを呼ぶ
preconditions:
  - プラグインが Claude Code に読み込まれ、MCP サーバーが起動している
  - 索引を指す環境変数が設定されている
test_file: tests/e2e/単一ユースケース/test_fetch_rule_body.py
