title: "未読のルールの案内を受ける"
scenarios:
  - name: 正常シナリオ（止めて案内する）
    setup:
      - name: Mock
        description: なし。実の Claude Code を `claude -p --setting-sources project --plugin-dir {プラグイン}` で動かし、利用者の設定のフック・プラグインを読み込ませない
      - name: ルールの本文
        description: ローカルに置いたルールの Markdown
      - name: 索引
        description: 対象のファイルに当たるパスの glob と、書く操作を必須とするエントリを 1 つ持つ YAML
        notes: '`RULE_INJECT_CONFIG` で指した設定ファイルの `projects` の、起動したプロジェクトに当たる要素で指す'
      - name: 既読の記録
        description: そのセッションの記録が無い（新しいセッション）
      - name: 操作
        description: プロンプトで、対象のファイルを Write で書くよう指示する
        notes: 対象のファイルはまだ無いパスにし、書かれたかで結末を見分ける
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as PreToolUse フック
        participant IDX as 索引
        participant ST as 既読の記録

        CC->>H: Write（対象のパス）
        H->>IDX: 対象のパス・操作の種別に当たるエントリを引く
        IDX-->>H: ルールの場所（書く操作が必須）
        H->>ST: そのセッションの既読を引く
        ST-->>H: 未読
        H-->>CC: 操作を止め、ルールの場所と読み方を案内する
      ```
    expected:
      - '`claude -p` の結果の `permission_denials` に Write が載っている'
      - 止めた理由の文面に、ルールの場所と、Read で読んでから同じ操作をやり直す旨が載っている
      - 対象のファイルが作られていない
    test: test_normal_when_blocked
  - name: 正常シナリオ（既読のため案内しない）
    setup:
      - name: Mock
        description: 止めて案内するシナリオと同じ（`claude -p --setting-sources project --plugin-dir {プラグイン}`）
      - name: ルールの本文
        description: ローカルに置いたルールの Markdown
      - name: 索引
        description: 止めて案内するシナリオと同じエントリを 1 つ持つ YAML
      - name: 既読の記録
        description: そのセッションでルールの場所が既読になっている
        notes: 前の実行でルールの本文を Read で読んだセッションを `--resume {session_id}` で続ける
      - name: 操作
        description: プロンプトで、対象のファイルを Write で書くよう指示する
        notes: 対象のファイルはまだ無いパス。`--allowedTools` で Write と Edit を許可する（Claude Code は作業の決まりに従い、Write で空で作ってから Edit で中身を書くことがある）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as PreToolUse フック
        participant IDX as 索引
        participant ST as 既読の記録
        participant FS as 対象のファイル

        CC->>H: Write（対象のパス）
        H->>IDX: 対象のパス・操作の種別に当たるエントリを引く
        IDX-->>H: ルールの場所
        H->>ST: そのセッションの既読を引く
        ST-->>H: 既読
        H-->>CC: 何も返さない
        CC->>FS: 書く
      ```
    expected:
      - '`claude -p` の結果の `permission_denials` が空'
      - 対象のファイルに中身が書かれている
    test: test_normal_when_already_read
  - name: 正常シナリオ（止めずに案内する）
    setup:
      - name: Mock
        description: 止めて案内するシナリオと同じ（`claude -p --setting-sources project --plugin-dir {プラグイン}`）
      - name: ルールの本文
        description: ローカルに置いたルールの Markdown
      - name: 索引
        description: 対象のファイルに当たるパスの glob と、書く操作だけを必須とするエントリを 1 つ持つ YAML
        notes: 読む操作は必須に含めない
      - name: 既読の記録
        description: そのセッションの記録が無い（新しいセッション）
      - name: 操作
        description: プロンプトで、既にある対象のファイルを Read で読むよう指示する
        notes: 対象のファイルには、応答に出たかで読めたことを見分ける文字列を置く
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as PreToolUse フック
        participant IDX as 索引
        participant ST as 既読の記録
        participant GD as 案内済みの記録
        participant FS as 対象のファイル

        CC->>H: Read（対象のパス）
        H->>IDX: 対象のパス・操作の種別に当たるエントリを引く
        IDX-->>H: ルールの場所（読む操作は必須でない）
        H->>ST: そのセッションの既読を引く
        ST-->>H: 未読
        H->>GD: そのセッションの案内済みを引く
        GD-->>H: 未案内
        H->>GD: ルールの場所を追加する
        H-->>CC: 操作を止めず、ルールの場所をコンテキストへ載せる
        CC->>FS: 読む
      ```
    expected:
      - '`claude -p` の結果の `permission_denials` が空'
      - 応答に対象のファイルの文字列が出ている
      - セッションの記録（transcript）に、操作を止めない案内の文面とルールの場所が載っている
      - 操作を止めない案内の文面に、読む場合は Read で読む旨が載っている
      - そのセッションの案内済みの記録に、ルールの場所が載っている
    test: test_normal_when_not_blocked
  - name: 正常シナリオ（Bashで読む対象に当たる）
    setup:
      - name: Mock
        description: 止めて案内するシナリオと同じ（`claude -p --setting-sources project --plugin-dir {プラグイン}`）
      - name: ルールの本文
        description: ローカルに置いたルールの Markdown
      - name: 索引
        description: 対象のファイルに当たるパスの glob と、読む操作を必須とするエントリを 1 つ持つ YAML
      - name: 既読の記録
        description: そのセッションの記録が無い（新しいセッション）
      - name: 操作
        description: プロンプトで、既にある対象のファイルを Bash の `cat` で読むよう指示する
        notes: '`--allowedTools` で Bash を許可し、Read を `--disallowedTools` で外して読み方を 1 つに定める'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as PreToolUse フック
        participant IDX as 索引
        participant ST as 既読の記録

        CC->>H: Bash（cat 対象のパス）
        H->>H: コマンドから読む対象のパスを取り出す
        H->>IDX: 対象のパスと読む操作に当たるエントリを引く
        IDX-->>H: ルールの場所（読む操作が必須）
        H->>ST: そのセッションの既読を引く
        ST-->>H: 未読
        H-->>CC: 操作を止め、ルールの場所と読み方を案内する
      ```
    expected:
      - '`claude -p` の結果の `permission_denials` に Bash が載っている'
      - 止めた理由の文面に、ルールの場所が載っている
    test: test_normal_when_read_by_bash
  - name: 正常シナリオ（案内が長い）
    setup:
      - name: Mock
        description: 止めて案内するシナリオと同じ（`claude -p --setting-sources project --plugin-dir {プラグイン}`）
      - name: ルールの本文
        description: ローカルに置いたルールの Markdown を 100 件
        notes: 場所のパスを 1 件 150 字前後にし、全件を並べると 10,000 字を超えるようにする
      - name: 索引
        description: 100 件のルールそれぞれに、対象のファイルに当たるパスの glob と書く操作を必須とするエントリを持つ YAML
      - name: 既読の記録
        description: そのセッションの記録が無い（新しいセッション）
      - name: 操作
        description: プロンプトで、対象のファイルを Write で書くよう指示する
        notes: 対象のファイルはまだ無いパス
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as PreToolUse フック
        participant IDX as 索引
        participant ST as 既読の記録

        CC->>H: Write（対象のパス）
        H->>IDX: 対象のパス・操作の種別に当たるエントリを引く
        IDX-->>H: ルールの場所 100 件
        H->>ST: そのセッションの既読を引く
        ST-->>H: 全件未読
        H->>H: 10,000 字に収まるところまで場所を並べ、残りの件数を添える
        H-->>CC: 操作を止め、載せた場所と残りの件数を案内する
      ```
    expected:
      - '`claude -p` の結果の `permission_denials` に Write が載っている'
      - 止めた理由の文面が 10,000 字以内
      - 止めた理由の文面に、載せきれなかったルールの件数が載っている
    test: test_normal_when_guidance_too_long
  - name: 異常シナリオ（索引が読めない）
    setup:
      - name: Mock
        description: 止めて案内するシナリオと同じ（`claude -p --setting-sources project --plugin-dir {プラグイン}`）
      - name: 索引
        description: YAML として読めないファイルを指す
        notes: 実在しないパスを指す場合も同じ結末になる
      - name: 操作
        description: プロンプトで、対象のファイルを Write で書くよう指示する
        notes: 対象のファイルはまだ無いパス。既読のため案内しないシナリオと同じく、`--allowedTools` で Write と Edit を許可する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as PreToolUse フック
        participant IDX as 索引
        participant FS as 対象のファイル

        CC->>H: Write（対象のパス）
        H->>IDX: 読む
        IDX-->>H: 読めない
        H-->>CC: 操作を止めず、読めなかった索引の場所と理由をコンテキストへ載せる
        CC->>FS: 書く
      ```
    expected:
      - '`claude -p` の結果の `permission_denials` が空'
      - 対象のファイルに中身が書かれている
      - セッションの記録（transcript）に、読めなかった索引の場所と理由が載っている
    test: test_error_when_index_unreadable
  - name: 正常シナリオ（案内済みのため案内しない）
    setup:
      - name: Mock
        description: 止めて案内するシナリオと同じ（`claude -p --setting-sources project --plugin-dir {プラグイン}`）
      - name: ルールの本文
        description: ローカルに置いたルールの Markdown
      - name: 索引
        description: 止めずに案内するシナリオと同じエントリを 1 つ持つ YAML
        notes: 読む操作は必須に含めない
      - name: 案内済みの記録
        description: そのセッションでルールの場所を止めずに案内している
        notes: 止めずに案内するシナリオを流したセッションを `--resume {session_id}` で続ける
      - name: 操作
        description: プロンプトで、同じ対象のファイルをもう一度 Read で読むよう指示する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as PreToolUse フック
        participant IDX as 索引
        participant ST as 既読の記録
        participant GD as 案内済みの記録
        participant FS as 対象のファイル

        CC->>H: Read（対象のパス）
        H->>IDX: 対象のパス・操作の種別に当たるエントリを引く
        IDX-->>H: ルールの場所（読む操作は必須でない）
        H->>ST: そのセッションの既読を引く
        ST-->>H: 未読
        H->>GD: そのセッションの案内済みを引く
        GD-->>H: 案内済み
        H-->>CC: 何も返さない
        CC->>FS: 読む
      ```
    expected:
      - '`claude -p` の結果の `permission_denials` が空'
      - 応答に対象のファイルの文字列が出ている
      - この実行で増えたセッションの記録（transcript）に、操作を止めない案内の文面が載っていない
    test: test_normal_when_already_guided
  - name: 正常シナリオ（既定の置き場所の索引）
    setup:
      - name: Mock
        description: 止めて案内するシナリオと同じ（`claude -p --setting-sources project --plugin-dir {プラグイン}`）
      - name: ルールの本文
        description: ローカルに置いたルールの Markdown
      - name: 索引
        description: 止めて案内するシナリオと同じエントリを 1 つ持つ YAML を、プロジェクトの直下の `rules.yaml` に置く
        notes: '`RULE_INJECT_CONFIG` を設定しない（設定ファイルなし）。ユーザーの既定の置き場所は、`XDG_CONFIG_HOME` を空のフォルダに向けて索引が無い状態にする'
      - name: 既読の記録
        description: そのセッションの記録が無い（新しいセッション）
      - name: 操作
        description: プロンプトで、対象のファイルを Write で書くよう指示する
        notes: 対象のファイルはまだ無いパス
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as PreToolUse フック
        participant IDX as 既定の置き場所の索引
        participant ST as 既読の記録

        CC->>H: Write（対象のパス）
        H->>H: 設定ファイルが無いため、既定の置き場所を索引にする
        H->>IDX: 対象のパス・操作の種別に当たるエントリを引く
        IDX-->>H: ルールの場所（書く操作が必須）
        H->>ST: そのセッションの既読を引く
        ST-->>H: 未読
        H-->>CC: 操作を止め、ルールの場所と読み方を案内する
      ```
    expected:
      - '`claude -p` の結果の `permission_denials` に Write が載っている'
      - 止めた理由の文面に、ルールの場所が載っている
      - 止めた理由の文面に、ユーザーの既定の置き場所の索引が読めなかった知らせが載っていない
    test: test_normal_when_default_index
  - name: 正常シナリオ（ルールの場所に変数参照がある）
    setup:
      - name: Mock
        description: 止めて案内するシナリオと同じ（`claude -p --setting-sources project --plugin-dir {プラグイン}`）
      - name: ルールの本文
        description: ローカルに置いたルールの Markdown
      - name: 索引
        description: ルールのフォルダを `!{名前}` で書いた `rule` と、書く操作を必須とするエントリを 1 つ持つ YAML
        notes: '`!{名前}` の環境変数にルールのフォルダを設定して起動する'
      - name: 既読の記録
        description: そのセッションの記録が無い（新しいセッション）
      - name: 操作
        description: プロンプトで、対象のファイルを Write で書くよう指示する
        notes: 対象のファイルはまだ無いパス
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as PreToolUse フック
        participant IDX as 索引
        participant ST as 既読の記録

        CC->>H: Write（対象のパス）
        H->>IDX: 読む
        IDX-->>H: エントリ（`rule` に変数参照）
        H->>H: 変数参照を環境変数の値に置き換えて、ルールの場所を解く
        H->>H: 対象のパス・操作の種別に当たるエントリを引く
        H->>ST: そのセッションの既読を引く
        ST-->>H: 未読
        H-->>CC: 操作を止め、展開したルールの場所と読み方を案内する
      ```
    expected:
      - '`claude -p` の結果の `permission_denials` に Write が載っている'
      - 止めた理由の文面に、変数参照を展開したルールの場所が載っている
    test: test_normal_when_rule_has_variable
  - name: 異常シナリオ（ルールの場所の変数参照を展開できない）
    setup:
      - name: Mock
        description: 止めて案内するシナリオと同じ（`claude -p --setting-sources project --plugin-dir {プラグイン}`）
      - name: 索引
        description: 設定していない環境変数の `!{名前}` を `rule` に書き、書く操作を必須とするエントリを 1 つ持つ YAML
        notes: その名前の環境変数を設定せずに起動する
      - name: 操作
        description: プロンプトで、対象のファイルを Write で書くよう指示する
        notes: 対象のファイルはまだ無いパス。既読のため案内しないシナリオと同じく、`--allowedTools` で Write と Edit を許可する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as PreToolUse フック
        participant IDX as 索引
        participant FS as 対象のファイル

        CC->>H: Write（対象のパス）
        H->>IDX: 読む
        IDX-->>H: エントリ（`rule` に未設定の変数参照）
        H->>H: 展開できない名前が残ったエントリを読み飛ばす
        H-->>CC: 操作を止めず、読み飛ばしたエントリと展開できない名前をコンテキストへ載せる
        CC->>FS: 書く
      ```
    expected:
      - '`claude -p` の結果の `permission_denials` が空'
      - 対象のファイルに中身が書かれている
      - セッションの記録（transcript）に、読み飛ばした索引の場所と展開できない名前が載っている
    test: test_error_when_rule_variable_unset
  - name: 異常シナリオ（索引に読めない正規表現がある）
    setup:
      - name: Mock
        description: 止めて案内するシナリオと同じ（`claude -p --setting-sources project --plugin-dir {プラグイン}`）
      - name: 索引
        description: '`paths` に正規表現として読めないパターン（例 `re:[`）を書き、書く操作を必須とするエントリを 1 つ持つ YAML'
      - name: 操作
        description: プロンプトで、対象のファイルを Write で書くよう指示する
        notes: 対象のファイルはまだ無いパス。既読のため案内しないシナリオと同じく、`--allowedTools` で Write と Edit を許可する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as PreToolUse フック
        participant IDX as 索引
        participant FS as 対象のファイル

        CC->>H: Write（対象のパス）
        H->>IDX: 読む
        IDX-->>H: エントリ（`paths` に読めない正規表現）
        H->>H: 正規表現を読めないエントリを読み飛ばす
        H-->>CC: 操作を止めず、読み飛ばした索引の場所・パターン・理由をコンテキストへ載せる
        CC->>FS: 書く
      ```
    expected:
      - '`claude -p` の結果の `permission_denials` が空'
      - 対象のファイルに中身が書かれている
      - セッションの記録（transcript）に、読み飛ばした索引の場所・読めなかったパターン・理由が載っている
    test: test_error_when_regex_unreadable
  - name: 正常シナリオ（読んだ後に変わったルールを案内する）
    setup:
      - name: Mock
        description: 止めて案内するシナリオと同じ（`claude -p --setting-sources project --plugin-dir {プラグイン}`）
      - name: ルールの本文
        description: ローカルに置いたルールの Markdown
      - name: 索引
        description: 止めて案内するシナリオと同じエントリを 1 つ持つ YAML
      - name: 既読の記録
        description: そのセッションでルールの場所が既読になっている
        notes: 前の実行でルールの本文を Read で読んだセッションを `--resume {session_id}` で続ける
      - name: ルールの書き換え
        description: 続ける前に、テストがルールの本文に 1 行を追加する
      - name: 操作
        description: プロンプトで、対象のファイルを Write で書くよう指示する
        notes: 対象のファイルはまだ無いパスにし、書かれたかで結末を見分ける
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as PreToolUse フック
        participant IDX as 索引
        participant ST as 既読の記録

        CC->>H: Write（対象のパス）
        H->>IDX: 対象のパス・操作の種別に当たるエントリを引く
        IDX-->>H: ルールの場所（書く操作が必須）
        H->>ST: そのセッションの既読を引く
        ST-->>H: 既読（読んだ時点の本文のハッシュ）
        H->>H: 今のルールの本文のハッシュと比べる
        H-->>CC: ハッシュが違うため未読として操作を止め、ルールの場所と読み方を案内する
      ```
    expected:
      - '`claude -p` の結果の `permission_denials` に Write が載っている'
      - 止めた理由の文面に、ルールの場所と、Read で読んでから同じ操作をやり直す旨が載っている
      - 対象のファイルが作られていない
    test: test_normal_when_rule_changed_after_read
  - name: 異常シナリオ（設定ファイルが読めない）
    setup:
      - name: Mock
        description: 止めて案内するシナリオと同じ（`claude -p --setting-sources project --plugin-dir {プラグイン}`）
      - name: 設定ファイル
        description: '`RULE_INJECT_CONFIG` で、設定ファイルとして読めないファイル（YAML として崩れたもの・許さないキーを持つもの 等）を指す'
        notes: 実在しないパスを指す場合も同じ結末になる
      - name: 索引
        description: 止めて案内するシナリオと同じエントリを 1 つ持つ YAML を、プロジェクトの直下の `rules.yaml` に置く
        notes: 読めない設定ファイルを設定なしとして扱わないこと（既定の置き場所の索引で止めないこと）を確かめる
      - name: 操作
        description: プロンプトで、対象のファイルを Write で書くよう指示する
        notes: 対象のファイルはまだ無いパス。既読のため案内しないシナリオと同じく、`--allowedTools` で Write と Edit を許可する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as PreToolUse フック
        participant CF as 設定ファイル
        participant FS as 対象のファイル

        CC->>H: Write（対象のパス）
        H->>CF: 読む
        CF-->>H: 読めない
        H-->>CC: 操作を止めず、読めなかった設定ファイルの場所と理由をコンテキストへ載せる
        CC->>FS: 書く
      ```
    expected:
      - '`claude -p` の結果の `permission_denials` が空'
      - 対象のファイルに中身が書かれている
      - セッションの記録（transcript）に、読めなかった設定ファイルの場所と理由が載っている
    test: test_error_when_settings_unreadable
lead: Claude Code がツールを呼ぶ直前に、`PreToolUse` フックが操作の対象に当たる未読のルールを案内する。操作の種別がエントリに当たれば操作を止め、当たらなければ止めずに案内する。止めない案内は、ルールごとにセッションで 1 回だけ出す。
