primary_actor: Claude Code のセッション
trigger: Claude Code が Read / Edit / Write / Bash / MCP のツールを呼ぶ
preconditions:
  - プラグインが Claude Code に読み込まれている
  - 索引を、設定ファイルで指した場所か既定の置き場所に置いている
notes:
  結合テストで確かめる要望: |-
    次の要望は利用者から見える結末が上のシナリオと変わらないため、E2E ではなくインターフェース定義（結合テスト）で確かめる。

    - 同じルールに複数のエントリが当たったとき、案内と止めるかの判定をルールごとに 1 つへまとめる
    - エントリの当てる範囲から外すパスの glob
    - 当てるツール名で MCP のツールの呼び出しに当たる案内
    - MCP のツールの引数のキーと値のパターン（`args`）で当たる案内と、値が配列のときの要素ごとの照合・オブジェクトの子のドット区切りのキー・引数にキーが無いときに当てないこと
    - `paths`・`exclude`・`tools`・`args` のパターンを `re:` で始めて正規表現として当てること（部分一致）と、`re:` で始めないパターンを今の glob のまま当てること
    - ユーザーの既定の置き場所の索引と、既定の置き場所にファイルが無いとき（`CLAUDE_PROJECT_DIR` が無いときを含む）に理由を載せずに読まないこと
    - 設定ファイルの `projects` の `match` を絶対パス（配下と `.claude/worktrees/` の下の worktree を含む）・プロジェクト名で当てることと、当たらない要素の索引を読まないこと
    - 当たった `projects` の要素の索引を `global` の索引の後ろに追加し、`projects` の中の相対パスを起動したプロジェクトの直下から解くこと
    - 設定ファイルに知らないキーがあるときに、読めない設定ファイルと同じく理由を載せること
    - 案内済みの記録が読めない・書けないときの扱い
    - 止める案内に載せたルールを、案内済みにしないこと（読むまで止め続ける）
