summary: 単一ユースケースのシナリオ
items:
  - page: 未読のルールの案内を受ける.yaml
    summary: 操作の対象に当たる未読のルールを、止めて、または止めずに案内する
  - page: ルールの本文を取得する.yaml
    summary: MCP のツールでルールの本文を受け取り、既読として記録する
  - page: ルールを読んだことが記録される.yaml
    summary: Read か Bash でルールの本文を読んだ場所を既読として記録する
  - page: 圧縮で既読の記録が捨てられる.yaml
    summary: 会話の圧縮の前に、そのセッションの既読の記録を捨てる
  - page: セッションの開始時に作業の決まりを受け取る.yaml
    summary: 新しいファイルは空で作ってから書く決まりをコンテキストへ載せる
  - page: 終わったセッションの既読の記録が掃除される.yaml
    summary: セッションの開始時に、最終更新から保持期間を過ぎた既読の記録ファイルを消す
  - page: 古いログが掃除される.yaml
    summary: 日付が保持日数以上前のログのファイルを、セッションの開始時に消す
