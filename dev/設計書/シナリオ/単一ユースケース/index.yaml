summary: 単一ユースケースのシナリオ
items:
  - page: 未読のルールの案内を受ける.yaml
    summary: 操作の対象に当たる未読のルールを、止めて、または止めずに案内する
  - page: ルールを読んだことが記録される.yaml
    summary: Read か Bash でルールの本文を読んだ場所を既読として記録する
  - page: 圧縮で既読の記録が捨てられる.yaml
    summary: 会話の圧縮の前に、そのセッションの既読の記録を捨てる
  - page: セッションの開始時に作業の決まりを受け取る.yaml
    summary: 新しいファイルは空で作ってから書く決まりをコンテキストへ載せる
  - page: 終わったセッションの既読の記録が掃除される.yaml
    summary: セッションの開始時に、最終更新から保持期間を過ぎた既読の記録ファイルを削除する
  - page: 古いログが掃除される.yaml
    summary: 日付が保持日数以上前のログのファイルを、セッションの開始時に削除する
  - page: 検索の結果に出たファイルのルールの案内を受ける.yaml
    summary: Grep・Glob・検索の Bash の結果に出たファイルに当たる未読のルールを、止めずに案内する
  - page: MCPサーバーを常駐させる.yaml
    summary: 起動のコマンドで MCP サーバーを前面で動かし、Claude Code から HTTP で接続して、SIGTERM で止める
  - page: 効いているルールの一覧を見る.yaml
    summary: プロジェクトで今効いている索引とエントリを、読めない索引・読み飛ばしたエントリ・無効のエントリとともに受け取る
  - page: 操作に当たるルールを検索する.yaml
    summary: ファイルのパスか MCP のツールの呼び出しに当たるルールと、未読のときに操作を止めるかを受け取る
  - page: 索引をチェックする.yaml
    summary: 索引ごとに、フックが読めない理由・JSON Schema への違反・ルールの場所にファイルが無いエントリを受け取る
  - page: 索引のエントリを編集する.yaml
    summary: 設定ファイルで読む索引のエントリを、コメントと書式を残して新規作成・編集・削除する
