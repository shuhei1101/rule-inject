title: "古いログが掃除される"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし。実の Claude Code を `claude -p --setting-sources project --plugin-dir {プラグイン}` で動かし、利用者の設定のフック・プラグインを読み込ませない
      - name: ログのフォルダ
        description: '`RULE_INJECT_CONFIG` で指した設定ファイルの `global` のログのフォルダで、テスト用のフォルダを指す'
        notes: '設定ファイルにログの保持日数は書かず、既定の 3 日で動かす'
      - name: 古いログ
        description: 日付が 3 日前（UTC）のログのファイルを置く
      - name: 新しいログ
        description: 日付が 2 日前（UTC）のログのファイルを置く
      - name: 操作
        description: プロンプトで、ツールを呼ばずに 1 語で回答するよう指示する
        notes: '`--max-turns 1`。セッションの開始で掃除が走ればよく、ツールは呼ばせない'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant S as SessionStart フック
        participant LG as ログのフォルダ

        CC->>S: セッションの開始（session_id・source）
        S->>LG: ログのファイルを列挙する
        LG-->>S: ファイル名の日付
        S->>LG: 日付が保持日数以上前のファイルを削除する
      ```
    expected:
      - 古いログのファイルが無い
      - 新しいログのファイルが残っている
    test: test_normal
lead: ログは日付ごとのファイル（`{yyyymmdd}_rule-inject.log`）に分かれる。セッションの開始時に `SessionStart` フックが、日付が保持日数以上前のログのファイルを削除する。
issue: 11
primary_actor: Claude Code のセッション
trigger: セッションの開始（新規・再開・`/clear`・圧縮の後）
notes:
  日付で分ける理由: '削除するのは追記されなくなった過去の日付のファイルだけなので、削除している間に別のセッションが書いた行を失わない。中身を読まずにファイル名だけで決まるため、フックの実行時間にも効かない（PR #12 の確認事項で利用者が決めた方式）'
test_file: tests/e2e/単一ユースケース/test_old_log_cleaned.py
