title: "ルールを読んでからファイルを触る"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし。実の Claude Code を `claude -p --setting-sources project --plugin-dir {プラグイン}` で動かし、利用者の設定（`~/.claude`）のフック・プラグイン・MCP サーバーを読み込ませない
        notes: 残るのは組み込みのプラグイン（agents-md・telemetry）だけ。起動時の init のプラグイン一覧で確かめた（2026-09-29）。`--bare` は API キーの課金になるため使わない
      - name: ルールの本文
        description: ローカルに置いたルールの Markdown
      - name: 索引
        description: ルールの場所と、当てるパスの glob（対象のファイルに当たる）・書く操作を必須とするエントリを 1 つ持つ YAML
        notes: プロジェクト用の環境変数で指す。対象のファイルはまだ無いパスにし、書かれたかで結末を見分ける
    flow: |-
      ```mermaid
      flowchart TD
        S0([Claude Code]) -->|対象のファイルを書く操作| UC1([未読のルールの案内を受ける:正常シナリオ（止めて案内する）])
        UC1 -->|案内に載ったルールの場所| UC2([ルールの本文を取得する:正常シナリオ])
        UC2 -->|既読の記録 + 同じ操作のやり直し| UC3([未読のルールの案内を受ける:正常シナリオ（既読のため案内しない）])
        UC3 --> DONE([対象のファイルが書かれた状態])

        click UC1 "../単一ユースケース/未読のルールの案内を受ける.yaml#正常シナリオ（止めて案内する）"
        click UC2 "../単一ユースケース/ルールの本文を取得する.yaml#正常シナリオ"
        click UC3 "../単一ユースケース/未読のルールの案内を受ける.yaml#正常シナリオ（既読のため案内しない）"
      ```
    expected:
      - 1 回目の書く操作は止められ、案内にルールの場所が載っている
      - ルールの本文を取得したツールの応答に、ルールの本文が載っている
      - やり直した書く操作は止められず、対象のファイルに中身が書かれている
    test: test_normal
    uses:
      - dev/設計書/シナリオ/単一ユースケース/未読のルールの案内を受ける#scenarios[正常シナリオ（止めて案内する）]
      - dev/設計書/シナリオ/単一ユースケース/ルールの本文を取得する#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/未読のルールの案内を受ける#scenarios[正常シナリオ（既読のため案内しない）]
  - name: 正常シナリオ（本文をBashで読む）
    setup:
      - name: Mock
        description: 正常シナリオと同じ（`claude -p --setting-sources project --plugin-dir {プラグイン}`）
      - name: ルールの本文
        description: ローカルに置いたルールの Markdown
      - name: 索引
        description: 正常シナリオと同じエントリを 1 つ持つ YAML
      - name: 読み方の指示
        description: プロンプトで、ルールの本文を MCP のツールではなく Bash の `cat` で読むよう指示する
        notes: '`--allowedTools` で Bash を許可し、MCP のツールを `--disallowedTools` で外して読み方を 1 つに定める'
    flow: |-
      ```mermaid
      flowchart TD
        S0([Claude Code]) -->|対象のファイルを書く操作| UC1([未読のルールの案内を受ける:正常シナリオ（止めて案内する）])
        UC1 -->|案内に載ったルールの場所| UC2([ルールを読んだことが記録される:正常シナリオ（Bashで読む）])
        UC2 -->|既読の記録 + 同じ操作のやり直し| UC3([未読のルールの案内を受ける:正常シナリオ（既読のため案内しない）])
        UC3 --> DONE([対象のファイルが書かれた状態])

        click UC1 "../単一ユースケース/未読のルールの案内を受ける.yaml#正常シナリオ（止めて案内する）"
        click UC2 "../単一ユースケース/ルールを読んだことが記録される.yaml#正常シナリオ（Bashで読む）"
        click UC3 "../単一ユースケース/未読のルールの案内を受ける.yaml#正常シナリオ（既読のため案内しない）"
      ```
    expected:
      - 1 回目の書く操作は止められ、案内にルールの場所が載っている
      - やり直した書く操作は止められず、対象のファイルに中身が書かれている
    test: test_normal_when_read_by_bash
    uses:
      - dev/設計書/シナリオ/単一ユースケース/未読のルールの案内を受ける#scenarios[正常シナリオ（止めて案内する）]
      - dev/設計書/シナリオ/単一ユースケース/ルールを読んだことが記録される#scenarios[正常シナリオ（Bashで読む）]
      - dev/設計書/シナリオ/単一ユースケース/未読のルールの案内を受ける#scenarios[正常シナリオ（既読のため案内しない）]
  - name: 正常シナリオ（圧縮の後）
    setup:
      - name: Mock
        description: 正常シナリオと同じ（`claude -p --setting-sources project --plugin-dir {プラグイン}`）
      - name: ルールの本文
        description: ローカルに置いたルールの Markdown
      - name: 索引
        description: 正常シナリオと同じエントリを 1 つ持つ YAML
      - name: 既読のセッション
        description: 正常シナリオを終え、ルールを既読にしたセッション
        notes: 以降の実行は、このセッションを `--resume {session_id}` で続ける
      - name: 圧縮
        description: '`claude -p "/compact" --resume {session_id}` で手動の圧縮を起こす'
        notes: '`-p` の `--resume` でも、同じ session_id に `PreCompact`（`trigger: manual`）が走ることを確かめた（2026-09-29、Claude Code 2.1.284）'
    flow: |-
      ```mermaid
      flowchart TD
        S0([Claude Code]) -->|会話の圧縮| UC0([圧縮で既読の記録が捨てられる:正常シナリオ])
        UC0 -->|対象のファイルを書く操作| UC1([未読のルールの案内を受ける:正常シナリオ（止めて案内する）])
        UC1 -->|案内に載ったルールの場所| UC2([ルールの本文を取得する:正常シナリオ])
        UC2 -->|既読の記録 + 同じ操作のやり直し| UC3([未読のルールの案内を受ける:正常シナリオ（既読のため案内しない）])
        UC3 --> DONE([対象のファイルが書かれた状態])

        click UC0 "../単一ユースケース/圧縮で既読の記録が捨てられる.yaml#正常シナリオ"
        click UC1 "../単一ユースケース/未読のルールの案内を受ける.yaml#正常シナリオ（止めて案内する）"
        click UC2 "../単一ユースケース/ルールの本文を取得する.yaml#正常シナリオ"
        click UC3 "../単一ユースケース/未読のルールの案内を受ける.yaml#正常シナリオ（既読のため案内しない）"
      ```
    expected:
      - 圧縮の後の 1 回目の書く操作は止められ、案内にルールの場所が載っている
      - 本文を取得し直した後の書く操作は止められず、対象のファイルに中身が書かれている
    test: test_normal_when_after_compact
    uses:
      - dev/設計書/シナリオ/単一ユースケース/圧縮で既読の記録が捨てられる#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/未読のルールの案内を受ける#scenarios[正常シナリオ（止めて案内する）]
      - dev/設計書/シナリオ/単一ユースケース/ルールの本文を取得する#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/未読のルールの案内を受ける#scenarios[正常シナリオ（既読のため案内しない）]
lead: Claude Code がファイルを書こうとしたとき、当たる未読のルールで止められ、ルールの本文を読んでから同じ操作をやり直して通る一連の流れ。
issue: 2
primary_actor: Claude Code のセッション
stakeholders:
  - name: ユーザー
    interest: 索引に書いたルールが、対象のファイルを書く前に必ず読まれること
trigger: Claude Code が、索引のエントリに当たるファイルを書こうとする
preconditions:
  - プラグインが Claude Code に読み込まれている
  - 索引を指す環境変数が設定され、対象のファイルに当たるエントリ（書く操作が必須）が 1 つある
success_guarantee: 索引が読め、フックが時間内に終わる限り、対象のファイルは当たるルールの本文を読んだ後にだけ書かれる。
minimal_guarantee: 索引が読め、フックが時間内に終わる限り、ルールを読むまで対象のファイルは書かれない。索引が読めないときは、読めなかった索引の場所と理由がコンテキストに載る。
test_file: tests/e2e/複合ユースケース/test_read_rule_then_touch_file.py
