title: "ルールを読んでからファイルを触る"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし。実の Claude Code を `claude -p --setting-sources project --plugin-dir {プラグイン}` で動かし、利用者の設定（`~/.claude`）のフック・プラグイン・MCP サーバーを読み込ませない
        notes: 残るのは組み込みのプラグイン（agents-md・telemetry）だけ。起動時の init のプラグイン一覧で確かめた（2026-09-29）。`--bare` は API キーの課金になるため使わない
      - name: ルールの本文
        description: ローカルに置いたルールの Markdown
      - name: 索引
        description: ルールの場所と、当てるパスの glob（対象のファイルに当たる）・書く操作を必須とするエントリを 1 つ持つ YAML
        notes: '`RULE_INJECT_CONFIG` で指した設定ファイルの `projects` の、起動したプロジェクトに当たる要素で指す。対象のファイルはまだ無いパスにし、書かれたかで結末を見分ける'
      - name: 書く操作の許可
        description: '`--allowedTools` で Write と Edit を許可する'
        notes: Claude Code は作業の決まりに従い、対象のファイルを Write で空で作ってから Edit で中身を書くことがある
    flow: |-
      ```mermaid
      flowchart TD
        S0([Claude Code]) -->|対象のファイルを書く操作| UC1([未読のルールの案内を受ける:正常シナリオ（止めて案内する）])
        UC1 -->|案内に載ったルールの場所| UC2([ルールを読んだことが記録される:正常シナリオ（Readで読む）])
        UC2 -->|既読の記録 + 同じ操作の再試行| UC3([未読のルールの案内を受ける:正常シナリオ（既読のため案内しない）])
        UC3 --> DONE([対象のファイルが書かれた状態])

        click UC1 "../単一ユースケース/未読のルールの案内を受ける.yaml#正常シナリオ（止めて案内する）"
        click UC2 "../単一ユースケース/ルールを読んだことが記録される.yaml#正常シナリオ（Readで読む）"
        click UC3 "../単一ユースケース/未読のルールの案内を受ける.yaml#正常シナリオ（既読のため案内しない）"
      ```
    expected:
      - 1 回目の書く操作は止められ、案内にルールの場所と、Read で読んでから同じ操作をやり直す旨が載っている
      - Read の結果に、ルールの本文が載っている
      - やり直した書く操作は止められず、対象のファイルに中身が書かれている
    test: test_normal
    uses:
      - dev/設計書/シナリオ/単一ユースケース/未読のルールの案内を受ける#scenarios[正常シナリオ（止めて案内する）]
      - dev/設計書/シナリオ/単一ユースケース/ルールを読んだことが記録される#scenarios[正常シナリオ（Readで読む）]
      - dev/設計書/シナリオ/単一ユースケース/未読のルールの案内を受ける#scenarios[正常シナリオ（既読のため案内しない）]
  - name: 正常シナリオ（本文をBashで読む）
    setup:
      - name: Mock
        description: 正常シナリオと同じ（`claude -p --setting-sources project --plugin-dir {プラグイン}`）
      - name: ルールの本文
        description: ローカルに置いたルールの Markdown
      - name: 索引
        description: 正常シナリオと同じエントリを 1 つ持つ YAML
      - name: 読み方の指示
        description: プロンプトで、ルールの本文を Read ではなく Bash の `cat` で読むよう指示する
        notes: '`--allowedTools` で Bash を許可し、Read を `--disallowedTools` で外して読み方を 1 つに定める'
      - name: 書く操作の許可
        description: 正常シナリオと同じ（`--allowedTools` で Write と Edit を許可する）
    flow: |-
      ```mermaid
      flowchart TD
        S0([Claude Code]) -->|対象のファイルを書く操作| UC1([未読のルールの案内を受ける:正常シナリオ（止めて案内する）])
        UC1 -->|案内に載ったルールの場所| UC2([ルールを読んだことが記録される:正常シナリオ（Bashで読む）])
        UC2 -->|既読の記録 + 同じ操作の再試行| UC3([未読のルールの案内を受ける:正常シナリオ（既読のため案内しない）])
        UC3 --> DONE([対象のファイルが書かれた状態])

        click UC1 "../単一ユースケース/未読のルールの案内を受ける.yaml#正常シナリオ（止めて案内する）"
        click UC2 "../単一ユースケース/ルールを読んだことが記録される.yaml#正常シナリオ（Bashで読む）"
        click UC3 "../単一ユースケース/未読のルールの案内を受ける.yaml#正常シナリオ（既読のため案内しない）"
      ```
    expected:
      - 1 回目の書く操作は止められ、案内にルールの場所が載っている
      - やり直した書く操作は止められず、対象のファイルに中身が書かれている
    test: test_normal_when_read_by_bash
    uses:
      - dev/設計書/シナリオ/単一ユースケース/未読のルールの案内を受ける#scenarios[正常シナリオ（止めて案内する）]
      - dev/設計書/シナリオ/単一ユースケース/ルールを読んだことが記録される#scenarios[正常シナリオ（Bashで読む）]
      - dev/設計書/シナリオ/単一ユースケース/未読のルールの案内を受ける#scenarios[正常シナリオ（既読のため案内しない）]
  - name: 正常シナリオ（圧縮の後）
    setup:
      - name: Mock
        description: 正常シナリオと同じ（`claude -p --setting-sources project --plugin-dir {プラグイン}`）
      - name: ルールの本文
        description: ローカルに置いたルールの Markdown
      - name: 索引
        description: 正常シナリオと同じエントリを 1 つ持つ YAML
      - name: 既読のセッション
        description: 正常シナリオを終え、ルールを既読にしたセッション
        notes: 以降の実行は、このセッションを `--resume {session_id}` で続ける
      - name: 圧縮
        description: '`claude -p "/compact" --resume {session_id}` で手動の圧縮を起こす'
        notes: '`-p` の `--resume` でも、同じ session_id に `PreCompact`（`trigger: manual`）が走ることを確かめた（2026-09-29、Claude Code 2.1.284）'
      - name: 書く操作の許可
        description: 正常シナリオと同じ（`--allowedTools` で Write と Edit を許可する）
    flow: |-
      ```mermaid
      flowchart TD
        S0([Claude Code]) -->|会話の圧縮| UC0([圧縮で既読の記録が捨てられる:正常シナリオ])
        UC0 -->|対象のファイルを書く操作| UC1([未読のルールの案内を受ける:正常シナリオ（止めて案内する）])
        UC1 -->|案内に載ったルールの場所| UC2([ルールを読んだことが記録される:正常シナリオ（Readで読む）])
        UC2 -->|既読の記録 + 同じ操作の再試行| UC3([未読のルールの案内を受ける:正常シナリオ（既読のため案内しない）])
        UC3 --> DONE([対象のファイルが書かれた状態])

        click UC0 "../単一ユースケース/圧縮で既読の記録が捨てられる.yaml#正常シナリオ"
        click UC1 "../単一ユースケース/未読のルールの案内を受ける.yaml#正常シナリオ（止めて案内する）"
        click UC2 "../単一ユースケース/ルールを読んだことが記録される.yaml#正常シナリオ（Readで読む）"
        click UC3 "../単一ユースケース/未読のルールの案内を受ける.yaml#正常シナリオ（既読のため案内しない）"
      ```
    expected:
      - 圧縮の後の 1 回目の書く操作は止められ、案内にルールの場所が載っている
      - 本文を Read で読み直した後の書く操作は止められず、対象のファイルに中身が書かれている
    test: test_normal_when_after_compact
    uses:
      - dev/設計書/シナリオ/単一ユースケース/圧縮で既読の記録が捨てられる#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/未読のルールの案内を受ける#scenarios[正常シナリオ（止めて案内する）]
      - dev/設計書/シナリオ/単一ユースケース/ルールを読んだことが記録される#scenarios[正常シナリオ（Readで読む）]
      - dev/設計書/シナリオ/単一ユースケース/未読のルールの案内を受ける#scenarios[正常シナリオ（既読のため案内しない）]
  - name: 正常シナリオ（本文を文書のMCPで読む）
    setup:
      - name: Mock
        description: 正常シナリオと同じ（`claude -p --setting-sources project --plugin-dir {プラグイン}`）。文書を返す MCP のツールは、テストが置く stdio の MCP サーバーで代える
        notes: MCP サーバーは `--mcp-config` で渡す。ツール `search_docs` は、ルールの本文を `<document path="{ルールの場所}" scope="full">` で包んで返す
      - name: ルールの本文
        description: ローカルに置いたルールの Markdown
      - name: 索引
        description: 正常シナリオと同じエントリを 1 つ持つ YAML（`read_by` を持たない）
      - name: 読み方の指示
        description: プロンプトで、ルールの本文を Read ではなく `search_docs` で読むよう指示する
        notes: '`--allowedTools` で `mcp__docs__search_docs` を許可し、Read と Bash を `--disallowedTools` で外して読み方を 1 つに定める'
      - name: 書く操作の許可
        description: 正常シナリオと同じ（`--allowedTools` で Write と Edit を許可する）
    flow: |-
      ```mermaid
      flowchart TD
        S0([Claude Code]) -->|対象のファイルを書く操作| UC1([未読のルールの案内を受ける:正常シナリオ（止めて案内する）])
        UC1 -->|案内に載ったルールの場所| UC2([ルールを読んだことが記録される:正常シナリオ（文書のMCPの結果で読む）])
        UC2 -->|既読の記録 + 同じ操作の再試行| UC3([未読のルールの案内を受ける:正常シナリオ（既読のため案内しない）])
        UC3 --> DONE([対象のファイルが書かれた状態])

        click UC1 "../単一ユースケース/未読のルールの案内を受ける.yaml#正常シナリオ（止めて案内する）"
        click UC2 "../単一ユースケース/ルールを読んだことが記録される.yaml#正常シナリオ（文書のMCPの結果で読む）"
        click UC3 "../単一ユースケース/未読のルールの案内を受ける.yaml#正常シナリオ（既読のため案内しない）"
      ```
    expected:
      - 1 回目の書く操作は止められ、案内にルールの場所が載っている
      - '`search_docs` の結果に、ルールの本文が載っている'
      - やり直した書く操作は止められず、対象のファイルに中身が書かれている
    test: test_normal_when_read_by_mcp_result
    uses:
      - dev/設計書/シナリオ/単一ユースケース/未読のルールの案内を受ける#scenarios[正常シナリオ（止めて案内する）]
      - dev/設計書/シナリオ/単一ユースケース/ルールを読んだことが記録される#scenarios[正常シナリオ（文書のMCPの結果で読む）]
      - dev/設計書/シナリオ/単一ユースケース/未読のルールの案内を受ける#scenarios[正常シナリオ（既読のため案内しない）]
  - name: 正常シナリオ（ルールが変わった後）
    setup:
      - name: Mock
        description: 正常シナリオと同じ（`claude -p --setting-sources project --plugin-dir {プラグイン}`）
      - name: ルールの本文
        description: ローカルに置いたルールの Markdown
      - name: 索引
        description: 正常シナリオと同じエントリを 1 つ持つ YAML
      - name: 既読のセッション
        description: 正常シナリオを終え、ルールを既読にしたセッション
        notes: 以降の実行は、このセッションを `--resume {session_id}` で続ける
      - name: ルールの書き換え
        description: 続ける前に、テストがルールの本文に、応答に出たかで読み直したことを見分ける 1 行を追加する
      - name: 書く操作の許可
        description: 正常シナリオと同じ（`--allowedTools` で Write と Edit を許可する）
        notes: 対象のファイルは正常シナリオと別の、まだ無いパスにする
    flow: |-
      ```mermaid
      flowchart TD
        S0([Claude Code]) -->|ルールが変わった後に対象のファイルを書く操作| UC1([未読のルールの案内を受ける:正常シナリオ（読んだ後に変わったルールを案内する）])
        UC1 -->|案内に載ったルールの場所| UC2([ルールを読んだことが記録される:正常シナリオ（Readで読む）])
        UC2 -->|新しいハッシュの既読の記録 + 同じ操作の再試行| UC3([未読のルールの案内を受ける:正常シナリオ（既読のため案内しない）])
        UC3 --> DONE([対象のファイルが書かれた状態])

        click UC1 "../単一ユースケース/未読のルールの案内を受ける.yaml#正常シナリオ（読んだ後に変わったルールを案内する）"
        click UC2 "../単一ユースケース/ルールを読んだことが記録される.yaml#正常シナリオ（Readで読む）"
        click UC3 "../単一ユースケース/未読のルールの案内を受ける.yaml#正常シナリオ（既読のため案内しない）"
      ```
    expected:
      - ルールが変わった後の 1 回目の書く操作は止められ、案内にルールの場所が載っている
      - Read の結果に、書き換えた後のルールの本文が載っている
      - 本文を Read で読み直した後の書く操作は止められず、対象のファイルに中身が書かれている
    test: test_normal_when_rule_changed
    uses:
      - dev/設計書/シナリオ/単一ユースケース/未読のルールの案内を受ける#scenarios[正常シナリオ（読んだ後に変わったルールを案内する）]
      - dev/設計書/シナリオ/単一ユースケース/ルールを読んだことが記録される#scenarios[正常シナリオ（Readで読む）]
      - dev/設計書/シナリオ/単一ユースケース/未読のルールの案内を受ける#scenarios[正常シナリオ（既読のため案内しない）]
lead: Claude Code がファイルを書こうとしたとき、当たる未読のルールで止められ、ルールの本文を読んでから同じ操作をやり直して通る一連の流れ。
issue: 2
primary_actor: Claude Code のセッション
stakeholders:
  - name: ユーザー
    interest: 索引に書いたルールが、対象のファイルを書く前に必ず読まれること
trigger: Claude Code が、索引のエントリに当たるファイルを書こうとする
preconditions:
  - プラグインが Claude Code に読み込まれている
  - 設定ファイルで指した場所に索引が置かれ、対象のファイルに当たるエントリ（書く操作が必須）が 1 つある
success_guarantee: 索引が読め、フックが時間内に終わる限り、対象のファイルは当たるルールの本文を読んだ後にだけ書かれる。
minimal_guarantee: 設定ファイルと索引が読め、フックが時間内に終わる限り、ルールを読むまで対象のファイルは書かれない。索引か設定ファイルが読めないときは、読めなかった場所と理由がコンテキストに載る。
test_file: tests/e2e/複合ユースケース/test_read_rule_then_touch_file.py
