title: "索引のエントリを直して案内を確かめる"
scenarios:
  - name: 正常シナリオ（エントリを新規作成する）
    setup:
      - name: Mock
        description: なし。実の Claude Code を `claude -p --setting-sources project --plugin-dir {プラグイン}` で動かし、利用者の設定（`~/.claude`）のフック・プラグイン・MCP サーバーを読み込ませない
        notes: サーバーは `--mcp-config` で HTTP の接続先（`http://127.0.0.1:{ポート}/mcp`）として渡す
      - name: MCP サーバー
        description: テストがローカルのクローンから起動した常駐の MCP サーバー
        notes: 起動の方法は単一ユースケース『MCPサーバーを常駐させる』に従う。ポートは空いているポートを設定ファイルに書いて渡す
      - name: ルールの本文
        description: ローカルに置いたルールの Markdown
      - name: 索引
        description: 対象のファイルに当たるエントリを持たない YAML
        notes: '`RULE_INJECT_CONFIG` で指した設定ファイルの `projects` の、起動したプロジェクトに当たる要素で指す'
      - name: ツールの許可
        description: '`--allowedTools` でサーバーの編集・検索のツールと、Write・Edit を許可する'
        notes: 編集・検索・書く操作を別々の `claude -p` で指示し、2 回目からは `--resume {session_id}` で続ける。対象のファイルはまだ無いパスにし、書かれたかで結末を見分ける
    flow: |-
      ```mermaid
      flowchart TD
        S0([Claude Code]) -->|ルールの場所・対象のパスの glob・書く操作を必須とするエントリ| UC1([索引のエントリを編集する:正常シナリオ（エントリを新規作成する）])
        UC1 -->|対象のファイルのパス| UC2([操作に当たるルールを検索する:正常シナリオ（ファイルのパスで検索する）])
        UC2 -->|対象のファイルを書く操作| UC3([未読のルールの案内を受ける:正常シナリオ（止めて案内する）])
        UC3 --> DONE([対象のファイルが書かれていない状態])

        click UC1 "../単一ユースケース/索引のエントリを編集する.yaml#正常シナリオ（エントリを新規作成する）"
        click UC2 "../単一ユースケース/操作に当たるルールを検索する.yaml#正常シナリオ（ファイルのパスで検索する）"
        click UC3 "../単一ユースケース/未読のルールの案内を受ける.yaml#正常シナリオ（止めて案内する）"
      ```
    expected:
      - 索引のファイルに、作成したエントリが追加されている
      - 検索のツールの結果に、作成したエントリのルールの場所と、未読のときに操作を止めることが載っている
      - 書く操作は止められ、案内に作成したエントリのルールの場所が載っている
      - 対象のファイルが作られていない
    test: test_normal_when_entry_created
    uses:
      - dev/設計書/シナリオ/単一ユースケース/索引のエントリを編集する#scenarios[正常シナリオ（エントリを新規作成する）]
      - dev/設計書/シナリオ/単一ユースケース/操作に当たるルールを検索する#scenarios[正常シナリオ（ファイルのパスで検索する）]
      - dev/設計書/シナリオ/単一ユースケース/未読のルールの案内を受ける#scenarios[正常シナリオ（止めて案内する）]
  - name: 正常シナリオ（エントリを無効にする）
    setup:
      - name: Mock
        description: エントリを新規作成するシナリオと同じ（`claude -p --setting-sources project --plugin-dir {プラグイン}`、サーバーは `--mcp-config` で渡す）
      - name: MCP サーバー
        description: エントリを新規作成するシナリオと同じ常駐の MCP サーバー
      - name: ルールの本文
        description: ローカルに置いたルールの Markdown
      - name: 索引
        description: 対象のファイルに当たり、書く操作を必須とするエントリを 1 つだけ持つ YAML
        notes: '`RULE_INJECT_CONFIG` で指した設定ファイルの `projects` の、起動したプロジェクトに当たる要素で指す'
      - name: ツールの許可
        description: エントリを新規作成するシナリオと同じ（サーバーの編集・検索のツールと、Write・Edit を許可する）
        notes: 対象のファイルはまだ無いパスにし、書かれたかで結末を見分ける
    flow: |-
      ```mermaid
      flowchart TD
        S0([Claude Code]) -->|エントリに enabled: false を書く編集| UC1([索引のエントリを編集する:正常シナリオ（エントリを無効にする）])
        UC1 -->|対象のファイルのパス| UC2([操作に当たるルールを検索する:正常シナリオ（当たるルールが無い）])
        UC2 -->|対象のファイルを書く操作| UC3([未読のルールの案内を受ける:正常シナリオ（無効のエントリに当たる）])
        UC3 --> DONE([対象のファイルが書かれた状態])

        click UC1 "../単一ユースケース/索引のエントリを編集する.yaml#正常シナリオ（エントリを無効にする）"
        click UC2 "../単一ユースケース/操作に当たるルールを検索する.yaml#正常シナリオ（当たるルールが無い）"
        click UC3 "../単一ユースケース/未読のルールの案内を受ける.yaml#正常シナリオ（無効のエントリに当たる）"
      ```
    expected:
      - '索引のファイルの対象のエントリに `enabled: false` が書かれている'
      - 検索のツールの結果に、当たるルールが無い
      - 書く操作は止められず、対象のファイルに中身が書かれている
    test: test_normal_when_entry_disabled
    uses:
      - dev/設計書/シナリオ/単一ユースケース/索引のエントリを編集する#scenarios[正常シナリオ（エントリを無効にする）]
      - dev/設計書/シナリオ/単一ユースケース/操作に当たるルールを検索する#scenarios[正常シナリオ（当たるルールが無い）]
      - dev/設計書/シナリオ/単一ユースケース/未読のルールの案内を受ける#scenarios[正常シナリオ（無効のエントリに当たる）]
lead: 常駐の MCP サーバーのツールで索引のエントリを直し、検索のツールで当たり方を確かめた後、次のフックの呼び出しから直したエントリで案内が出る一連の流れ。
issue: 58
primary_actor: Claude Code のセッション
stakeholders:
  - name: ユーザー
    interest: ツールで直したエントリが、索引を手で書き直したときと同じく、次の操作から案内に効くこと
trigger: Claude Code が、常駐の MCP サーバーの編集のツールで索引のエントリを直す
preconditions:
  - プラグインが Claude Code に読み込まれている
  - MCP サーバーが常駐し、Claude Code に HTTP の MCP サーバーとして登録されている
  - フックとサーバーが同じ設定ファイルを読み、設定ファイルで指した場所に索引が置かれている
success_guarantee: 編集のツールが書き込んだエントリは、サーバーを再起動せずに、検索のツールと次のフックの呼び出しの両方で同じ当たり方をする。
minimal_guarantee: 書いた後の索引がチェックに通らないときは索引を書き換えず、フックの案内は編集の前のまま変わらない。
