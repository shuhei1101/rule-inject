title: "テスト実行方法"
layers:
  - name: 単体テスト（バック）
    run_all: |-
      ```bash
      uv run pytest tests/unit
      ```
    prerequisites:
      - MCP サーバーのテストは、`pyproject.toml` の任意の依存 `server`（`mcp`・`jsonschema`・`ruamel.yaml`）を使う。同じ依存を `dev` グループにも入れ、`uv run` が入れる
  - name: 結合テスト（バック）
    run_all: |-
      ```bash
      uv run pytest tests/integration
      ```
    prerequisites:
      - MCP サーバーのテスト（`tests/integration/server/`）は、単体テストと同じ依存を使い、サーバーを `127.0.0.1` の空いているポート（`RULE_INJECT_PORT`）で子プロセスとして立て、`mcp` の Streamable HTTP のクライアントで呼ぶ
      - サーバー・偽の dev-docs の起動を待つときは、子プロセスの標準エラーに `Uvicorn running on http://127.0.0.1:{ポート}` が出たことで確かめ、待ち受けに失敗して子プロセスが終わったら別の空いているポートで起動し直す（5 回まで。導き方は補足の「起動し直す回数」）
      - 起動を待つ上限と、起動して失敗で終わるまでを待つ上限は、どちらも 1 回の起動につき 51 秒にする（導き方は補足の「起動を待つ上限」）
    notes:
      起動し直す回数: |-
        | 元の値 | 値 | 出所 |
        | --- | --- | --- |
        | 取り合いが起きうる時間 | ポートを閉じてから子プロセスが待ち受けるまで。負荷の低いとき 7.8 秒 | #87 のレビューでの実測 |
        | OS が自動で割り当てるポートの幅 | 4,096 個（56905〜61000。ポート 0 で取る番号もこの範囲から出る） | `/proc/sys/net/ipv4/ip_local_port_range` |
        | 1 回の実行での子プロセスの起動 | 約 13 回（個別の起動 7 回 + モジュールごとの共有のサーバー） | `tests/integration/server/` |
        | 1 回の起動で取り合いが起きる確率 p | 0.1（負荷の高いときの 3 回の実行で、失敗の種類 3 件を取り合いの件数の上限とみなした 3 / 39 ≒ 0.08 を切り上げ。下の「起動を待つ上限」の 1,000 回の実測では 45 回 = 0.045） | #80 の実装での失敗（#83） |

        1 回の実行が起動し直しても取り合いで失敗する確率を 0.1% 以下にする（規約『資源の値の決め方』の許せる誤り率に揃える）。13 × 0.1^n ≦ 0.001 から n ≧ 4.1 で、回数は 5 回。
      起動を待つ上限: |-
        | 元の値 | 値 | 出所 |
        | --- | --- | --- |
        | 起動のコマンドから標準エラーに待ち受けの開始の行が出るまで | 1,000 回で p50 8.2 秒・p99 25.5 秒・p99.9 33.8 秒（待ち受けた 955 回。45 回は取り合いで終了） | `dev/pr/87/実測/`（結合テストを 2 本並べて流し続け、測る処理も 4 本並べた中。load average 9〜37 / 8 コア） |

        規約『資源の値の決め方』の「下流を待つタイムアウト」で、p99.9 の 33.8 秒 + その 50% の 16.9 秒 = 50.7 秒を切り上げて 51 秒。起動して失敗で終わるまでを待つ上限も、起動の時間を含むため同じ 51 秒にする。
  - name: E2E テスト
    description: 実の Claude Code（`claude -p --plugin-dir {Linux 側の一時フォルダへコピーしたプラグインのフォルダ} --setting-sources project`）を起動して、シナリオごとに確かめる。pytest で実行し、`--run-e2e` を付けたときだけ動く（付けなければ全て skip する）。
    prerequisites:
      - '`claude`（Claude Code の CLI）が PATH にあり、ログイン済みであること。`claude -p` を起動するたびに費用がかかる'
      - Python 3.12 と uv（pytest と、`read_by` のシナリオで立てる文書の MCP サーバーの依存を入れる）
      - 利用者の設定（`~/.claude`）のフック・プラグイン・MCP サーバーを読み込ませない（`--setting-sources project`）。`--bare` は API の課金になるため使わない
      - 誤実行を防ぐため `--run-e2e` を必須にする
      - 環境変数 `E2E_CLAUDE_BIN`（`claude` の場所）と `E2E_CLAUDE_MODEL`（`--model` に渡すモデル）は、必要なときだけ指す
      - pytest の一時フォルダ（`TMPDIR`、既定は `/tmp`）が Linux 側のファイルシステムにあること。クローンは `/mnt/c` にあってよい
    run_all: |-
      ```bash
      uv run pytest tests/e2e --run-e2e
      ```
    run_one:
      label: シナリオ
      command: |-
        ```bash
        uv run pytest {シナリオのテストファイルパス} --run-e2e
        ```
    carry_over: |-
      実行を始めたセッションが終わっても続くよう、進行の記録のフォルダ `RUN_DIR` を決め、環境変数 `E2E_RUN_DIR` で渡してバックグラウンドで動かす。

      ```bash
      RUN_DIR=$(mktemp -d)
      E2E_RUN_DIR="$RUN_DIR" nohup uv run pytest tests/e2e --run-e2e > "$RUN_DIR/pytest.log" 2>&1 &
      ```

      `RUN_DIR` の中身は次のとおり。

      | ファイル | 中身 |
      | --- | --- |
      | `results.jsonl` | シナリオが終わるたびに 1 行（`nodeid`・`outcome`・`duration_sec`・`time`）追記する |
      | `done` | 実行が終わったとき（中断も含む）に書く。中身は pytest の終了コード |
      | `release_head` | 実行を始めた時点の commit（`git rev-parse HEAD`） |
      | `abort` | 中断の合図。実行の中では作らない |
    monitoring: |-
      `results.jsonl` に行が増えることで、シナリオごとの進行を見る。`done` が現れたら終わり。

      ```bash
      tail -f "$RUN_DIR/results.jsonl"
      ```
    abort: |-
      合図のファイルを作る。pytest は、次のシナリオを始める前にこのファイルを見つけて止まる（動いているシナリオは終わるまで続く）。

      ```bash
      touch "$RUN_DIR/abort"
      ```
    duration: 1 シナリオで `claude -p` を 1〜3 回起動する（読み込みだけのもの 1 回、既読にしてからのもの 2 回、圧縮を含むもの 2〜3 回）。所要時間は実測していない
    parallel: false
    external_cost: 16 シナリオで `claude -p` を 20 回起動し、そのたびに Claude Code の利用枠か API の利用料がかかる。全件を実行する前に、費用がかかることをユーザーが承知していること
    results: 進行と結果は `$RUN_DIR/results.jsonl`。全 pass のログはテストの側では置かない（E2E の結果の集約は tester が担う）
  - name: 非機能要件テスト
    run_all: |-
      ```bash
      uv run pytest tests/nfr
      ```
  - name: lint
    description: |-
      ruff で linter・formatter の check を、mypy で型検査を、import-linter で依存の向きを検査する。型検査と依存の向きの検査はプロジェクト全体に回す。
      反映作業のスクリプト（`dev/pr/{PR 番号}/反映作業/{作業名}/`）は `mypy .` から外し（`[tool.mypy]` の `exclude`）、作業のフォルダごとに `mypy` を回す。
    prerequisites:
      - 検査の設定は `pyproject.toml` の `[tool.ruff]`・`[tool.mypy]`・`[tool.importlinter]` が持つ
    run_all: |-
      ```bash
      (rc=0; uv run ruff check . || rc=1; uv run ruff format --check . || rc=1; uv run mypy . || rc=1; for d in dev/pr/*/反映作業/*/; do uv run mypy "$d"*.py || rc=1; done; uv run lint-imports || rc=1; exit $rc)
      ```
