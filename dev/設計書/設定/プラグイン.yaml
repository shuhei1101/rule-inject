title: "設定: プラグイン"
lead: プラグインが読む環境変数・設定ファイルのキーと、ルール索引（YAML）のキーの一覧。
files:
  - file: ~/.claude/settings.json
    manages: 設定ファイルの場所を指す環境変数 `RULE_INJECT_CONFIG`（`env`）
    notes: Claude Code のユーザーの設定。フックは `env` の値を環境変数として受け取る
  - file: 索引（*.yaml）
    manages: ルールの場所と、当てるパス・ツール名・操作の種別の紐づけ
    notes: 利用者が書く。置き場所と名前は自由で、設定ファイルの `indexes` で指す。フックが標準ライブラリだけで読めるよう、YAML のうちここに挙げたキーと形（マップ・文字列のリスト・文字列）だけを読む
  - file: ~/.config/rule-inject/settings.yaml
    manages: 索引の場所・既読の記録とログの置き場所・保持日数（最上位の `global` と `projects`）
    notes: 利用者が書き、`RULE_INJECT_CONFIG` で指す。`RULE_INJECT_CONFIG` が無いときは読まず、全てのキーを既定値で動かす。フックが標準ライブラリだけで読めるよう、ここに挙げたキーと形（マップ・マップのリスト・文字列のリスト・文字列・整数）だけを読む
  - file: settings.sample.yaml
    manages: 設定ファイルのキーの一覧（実値を入れないサンプル）
    notes: プラグインの直下に置く。フックは読まない
settings:
  - key: default_on
    title: 既定の必須の操作
    file: 索引（*.yaml）
    type: list[Literal['read', 'write', 'mcp']]
    required: false
    default: '`[read, write, mcp]`'
    description: その索引のエントリが `on` を書かないときの、操作を止める操作の種別
    reload: immediate
    visibility: user
    status: planned
  - key: rules[].rule
    title: ルールの場所
    file: 索引（*.yaml）
    type: str
    required: true
    description: ルールの本文の場所
    missing: その索引を読まず、索引が読めないときと同じく索引の場所と理由をコンテキストへ載せる。設定されていない環境変数の `!{名前}` が残ったときは、そのエントリだけを読み飛ばし、理由をコンテキストへ載せる
    reload: immediate
    allowed: '絶対パス、`~` で始まるパス、索引ファイルのフォルダからの相対パス。`http://` か `https://` で始まる URL のエントリは Read で読めないため、案内にも既読にも使わず読み飛ばす（理由はルール案内が案内に載せる）。`!{名前}`（名前は `[A-Za-z_][A-Za-z0-9_]*`）を書くと、フックが受け取った環境変数の値に置き換えてから場所を解く'
    visibility: user
    status: planned
  - key: rules[].paths
    title: 当てるパス
    file: 索引（*.yaml）
    type: list[str]
    required: false
    default: なし（パスでは当てない）
    description: 操作の対象の絶対パスに当てる glob か正規表現
    reload: immediate
    allowed: '`**/` か `*` で始まる glob。`**` はフォルダをまたぐ。`re:` で始めると、残りを正規表現として操作の対象の絶対パスに部分一致（`re.search`）で照合する。読めない正規表現を書いたエントリは読み飛ばし、索引の場所・パターン・理由をコンテキストへ載せる'
    visibility: user
    status: planned
  - key: rules[].exclude
    title: 外すパス
    file: 索引（*.yaml）
    type: list[str]
    required: false
    default: なし（外さない）
    description: '`paths` に当たっても、このパターンに当たるパスにはそのエントリを当てない'
    reload: immediate
    allowed: '`paths` と同じ書き方（glob か `re:` の正規表現）'
    visibility: user
    status: planned
  - key: rules[].tools
    title: 当てるツール名
    file: 索引（*.yaml）
    type: list[str]
    required: false
    default: なし（ツール名では当てない）
    description: MCP のツールの完全名に当てる glob か正規表現
    reload: immediate
    allowed: '`mcp__` で始まる glob（例 `mcp__*__create_*`）か、`re:` で始まる正規表現（ツールの完全名に部分一致で照合する。例 `re:__create_`）'
    visibility: user
    status: planned
  - key: rules[].args
    title: 当てる引数
    file: 索引（*.yaml）
    type: dict[str, list[str]]
    required: false
    default: なし（引数では絞らない）
    description: '`tools` に当たった MCP のツールの引数に当てるパターン。引数のキー → パターンのリストのマップで、書いた全てのキーの値がどれかのパターンに当たるときだけエントリを当てる'
    reload: immediate
    allowed: キーは引数の名前で、オブジェクトの子はドットで結ぶ（例 `filter.kind`）。パターンは glob か `re:` で始まる正規表現（値に部分一致で照合する）。`キー:` の下にパターンのリストを並べたブロックのマップだけを読み、フローのマップ・空の `args`・キーの重複は索引を読めなくする。キーが引数に無いとき・値がオブジェクトのときは当てない。値が配列のとき、およびドット区切りのキーの途中が配列のときは要素ごとに照合し、どれか 1 つが当たれば当てる。文字列以外のスカラーは JSON の表記（`true`・`null`・`1.5`）で照合する
    visibility: user
    status: planned
  - key: rules[].on
    title: 止める操作
    file: 索引（*.yaml）
    type: list[Literal['read', 'write', 'mcp']]
    required: false
    default: 索引の `default_on`
    description: 未読のときに操作を止める操作の種別。当たった操作がここに無ければ、止めずに案内する
    reload: immediate
    allowed: '`read`（Read・Bash での読み取り）/ `write`（Edit・Write）/ `mcp`（MCP のツールの呼び出し）'
    visibility: user
    status: planned
  - key: rules[].read_by
    title: 既読にする呼び出し
    file: 索引（*.yaml）
    type: list[object]
    required: false
    default: なし（MCP のツールの呼び出しでは既読にしない）
    description: そのエントリのルールを既読にする MCP のツールの呼び出し。要素のどれか 1 つに当たった呼び出しが終わった後に、そのルールをそのセッションの既読にする。案内の当て方の `tools`・`args` に当たっただけでは既読にしない
    reload: immediate
    allowed: 要素は `tools`（必須）と `args`（任意）を持つマップ
    status: planned
    visibility: user
  - key: rules[].read_by[].tools
    title: 既読にするツール名
    file: 索引（*.yaml）
    type: list[str]
    required: true
    description: 既読にする MCP のツールの完全名に当てる glob か正規表現
    missing: その索引を読まず、索引が読めないときと同じく索引の場所と理由をコンテキストへ載せる
    reload: immediate
    allowed: '`rules[].tools` と同じ書き方（`mcp__` で始まる glob か `re:` で始まる正規表現）'
    status: planned
    visibility: user
  - key: rules[].read_by[].args
    title: 既読にする引数
    file: 索引（*.yaml）
    type: dict[str, list[str]]
    required: false
    default: なし（引数では絞らない）
    description: 同じ要素の `tools` に当たった呼び出しの引数に当てるパターン。書いた全てのキーの値がどれかのパターンに当たるときだけ既読にする
    reload: immediate
    allowed: '`rules[].args` と同じ書き方と照合の規則'
    status: planned
    visibility: user
  - key: RULE_INJECT_CONFIG
    title: 設定ファイルの場所
    file: ~/.claude/settings.json
    type: str
    required: false
    default: なし（設定ファイルを読まず、全てのキーを既定値で動かす）
    description: 設定ファイル `settings.yaml` のパス。先頭の `~` はホームに展開する
    missing: 指したファイルが無い・YAML として読めない・知らないキーや許す値の外の値を持つときは、設定ファイルを使わず、各フックが既定のログのフォルダへ `read_settings` を書き、案内を返すフックはファイルの場所と理由を案内に載せる（既定値で動かさない）
    env_var: RULE_INJECT_CONFIG
    reload: restart
    allowed: 絶対パスか `~` で始まるパス
    reason: プロジェクトスコープの `env` には書かない。プロジェクトごとの違いは設定ファイルの `projects` に書く
    status: planned
    visibility: user
  - key: global.indexes
    title: ユーザーの索引
    file: ~/.config/rule-inject/settings.yaml
    type: list[str]
    required: false
    default: '`[${XDG_CONFIG_HOME:-~/.config}/rule-inject/rules.yaml]`（ファイルが無ければ理由を載せずに読まない）'
    description: どのプロジェクトで起動しても読む索引のパスの並び。空の並び `[]` にすると、既定の置き場所も読まない
    reload: immediate
    allowed: 絶対パスか `~` で始まるパス。相対パスは設定ファイルの誤りとして扱う
    status: planned
    visibility: user
  - key: global.state_dir
    title: 既読の記録の置き場所
    file: ~/.config/rule-inject/settings.yaml
    type: str
    required: false
    default: '`${XDG_STATE_HOME:-~/.local/state}/rule-inject`'
    description: セッションごとの既読の記録ファイル・案内済みの記録ファイル・既読の履歴ファイルを置くフォルダ
    reload: immediate
    allowed: 絶対パスか `~` で始まるパス
    reason: 掃除は起動したプロジェクトの記録フォルダしか見ないため、`projects` で分けると開かないプロジェクトの記録が残る。そのため `global` だけに置く
    status: planned
    visibility: user
  - key: global.log_dir
    title: ログの置き場所
    file: ~/.config/rule-inject/settings.yaml
    type: str
    required: false
    default: '`${XDG_STATE_HOME:-~/.local/state}/rule-inject/logs`'
    description: フックが失敗した操作を書く、日付ごとのログのファイルを置くフォルダ。設定ファイルが読めなかったことのログは既定値のフォルダへ書く
    reload: immediate
    allowed: 絶対パスか `~` で始まるパス
    status: planned
    visibility: user
    reason: 掃除は起動したプロジェクトのログのフォルダしか見ないため、`projects` で分けると開かないプロジェクトのログが残る。そのため `global` だけに置く
  - key: global.record_retention_days
    title: 既読の記録の保持日数
    file: ~/.config/rule-inject/settings.yaml
    type: int
    required: false
    default: '30'
    description: 最後に書き足してからこの日数を過ぎた既読の記録ファイル・案内済みの記録ファイル・既読の履歴ファイルを、セッションの開始時に消す
    reload: immediate
    allowed: 1 以上の整数。それ以外の値は設定ファイルの誤りとして扱う
    status: planned
    visibility: user
    reason: 記録フォルダは全てのプロジェクトで共通のため、`projects` で分けると他のプロジェクトの記録を消す日数が起動したプロジェクトの値で決まる。そのため `global` だけに置く
  - key: global.log_retention_days
    title: ログの保持日数
    file: ~/.config/rule-inject/settings.yaml
    type: int
    required: false
    default: '3'
    description: 日付が今日（UTC）からこの日数以上前のログのファイルを、セッションの開始時に消す
    reload: immediate
    allowed: 1 以上の整数。それ以外の値は設定ファイルの誤りとして扱う
    status: planned
    visibility: user
    reason: ログのフォルダは全てのプロジェクトで共通のため、`projects` で分けると他のプロジェクトのログを消す日数が起動したプロジェクトの値で決まる。そのため `global` だけに置く
  - key: projects[].match
    title: 当てるプロジェクト
    file: ~/.config/rule-inject/settings.yaml
    type: str
    required: true
    description: その要素を当てるプロジェクト。絶対パスなら、`CLAUDE_PROJECT_DIR` がそのパスかその配下のときに当てる。それ以外はプロジェクト名として、リポジトリのフォルダ名が一致したときに当てる。`.claude/worktrees/` の下の worktree は本体のパスとフォルダ名で見る
    missing: 設定ファイルの誤りとして扱う
    reload: immediate
    allowed: 絶対パスかプロジェクト名
    status: planned
    visibility: user
  - key: projects[].indexes
    title: プロジェクトの索引
    file: ~/.config/rule-inject/settings.yaml
    type: list[str]
    required: false
    default: 当たった要素のどれも持たないとき `[${CLAUDE_PROJECT_DIR}/rules.yaml]`（ファイルか `CLAUDE_PROJECT_DIR` が無ければ理由を載せずに読まない）
    description: 当たったプロジェクトだけで読む索引のパスの並び。当たった要素の並びを順に `global.indexes` の後ろへ足す。当たった要素が空の並び `[]` を持つと、既定の置き場所も読まない
    reload: immediate
    allowed: 絶対パス・`~` で始まるパス・プロジェクトの直下（`CLAUDE_PROJECT_DIR`）からの相対パス
    reason: '`CLAUDE_PROJECT_DIR` はセッションを始めたプロジェクトの直下で、どのフックにも同じ値で渡る。フックの入力の `cwd` は Claude が `cd` した先へ動くため基準に使わない。要素が持てるキーは `match` と `indexes` だけで、他のキーは設定ファイルの誤りとして扱う'
    status: planned
    visibility: user
