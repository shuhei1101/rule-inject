title: "設定: プラグイン"
lead: プラグインが読む環境変数と、ルール索引（YAML）のキーの一覧。
files:
  - file: ~/.claude/settings.json
    manages: 全プロジェクトで使う索引を指す環境変数（`env`）
    notes: Claude Code のユーザーの設定。フックと MCP サーバーは `env` の値を環境変数として受け取る
  - file: .claude/settings.json
    manages: そのプロジェクトだけで使う索引を指す環境変数（`env`）
    notes: Claude Code のプロジェクトの設定（利用者のプロジェクトのリポジトリに置く）
  - file: 索引（*.yaml）
    manages: ルールの場所と、当てるパス・ツール名・操作の種別の紐づけ
    notes: 利用者が書く。置き場所と名前は自由で、環境変数で指す。フックが標準ライブラリだけで読めるよう、YAML のうちここに挙げたキーと形（マップ・文字列のリスト・文字列）だけを読む
settings:
  - key: RULE_INJECT_INDEXES_USER
    title: ユーザーの索引
    file: ~/.claude/settings.json
    type: str
    required: false
    default: '`${XDG_CONFIG_HOME:-~/.config}/rule-inject/rules.yaml`（ファイルが無ければ理由を載せずに読まない）'
    description: 全プロジェクトで使う索引のパス。カンマ区切りで複数並べられる。空の文字列にすると、既定の置き場所も読まない
    env_var: RULE_INJECT_INDEXES_USER
    reload: restart
    allowed: 絶対パスか `~` で始まるパス
    visibility: user
    status: planned
  - key: RULE_INJECT_INDEXES_PROJECT
    title: プロジェクトの索引
    file: .claude/settings.json
    type: str
    required: false
    default: '`${CLAUDE_PROJECT_DIR}/rules.yaml`（ファイルか `CLAUDE_PROJECT_DIR` が無ければ理由を載せずに読まない）'
    description: そのプロジェクトだけで使う索引のパス。カンマ区切りで複数並べられる。空の文字列にすると、既定の置き場所も読まない
    env_var: RULE_INJECT_INDEXES_PROJECT
    reload: restart
    allowed: 絶対パス・`~` で始まるパス・プロジェクトの直下（環境変数 `CLAUDE_PROJECT_DIR`）からの相対パス
    visibility: user
    status: planned
    reason: '`CLAUDE_PROJECT_DIR` はセッションを始めたプロジェクトの直下で、フックにも stdio の MCP サーバーにも同じ値で渡る。フックの入力の `cwd` は Claude が `cd` した先へ動くため基準に使わない'
  - key: RULE_INJECT_STATE_DIR
    title: 既読の記録の置き場所
    file: ~/.claude/settings.json
    type: str
    required: false
    default: '`${XDG_STATE_HOME:-~/.local/state}/rule-inject`'
    description: セッションごとの既読の記録ファイルを置くフォルダ
    env_var: RULE_INJECT_STATE_DIR
    reload: restart
    allowed: 絶対パスか `~` で始まるパス
    visibility: user
    status: planned
    reason: フックと MCP サーバーが同じ場所を読み書きするため、両方が同じ規則で場所を決める
  - key: default_on
    title: 既定の必須の操作
    file: 索引（*.yaml）
    type: list[Literal['read', 'write', 'mcp']]
    required: false
    default: '`[read, write, mcp]`'
    description: その索引のエントリが `on` を書かないときの、操作を止める操作の種別
    reload: immediate
    visibility: user
    status: planned
  - key: rules[].rule
    title: ルールの場所
    file: 索引（*.yaml）
    type: str
    required: true
    description: ルールの本文の場所
    missing: そのエントリを読み飛ばし、索引が読めないときと同じく理由をコンテキストへ載せる。設定されていない環境変数の `!{名前}` が残ったときも同じ
    reload: immediate
    allowed: '`https://` で始まる URL、絶対パス、`~` で始まるパス、索引ファイルのフォルダからの相対パス。`http://` の URL は書けるが、本文は取得しない（平文で取得したルールを案内に使わないため）。`!{名前}`（名前は `[A-Za-z_][A-Za-z0-9_]*`）を書くと、フックと MCP サーバーが受け取った環境変数の値に置き換えてから場所を解く'
    visibility: user
    status: planned
  - key: rules[].paths
    title: 当てるパス
    file: 索引（*.yaml）
    type: list[str]
    required: false
    default: なし（パスでは当てない）
    description: 操作の対象の絶対パスに当てる glob か正規表現
    reload: immediate
    allowed: '`**/` か `*` で始まる glob。`**` はフォルダをまたぐ。`re:` で始めると、残りを正規表現として操作の対象の絶対パスに部分一致（`re.search`）で照合する。読めない正規表現を書いたエントリは読み飛ばし、索引の場所・パターン・理由をコンテキストへ載せる'
    visibility: user
    status: planned
  - key: rules[].exclude
    title: 外すパス
    file: 索引（*.yaml）
    type: list[str]
    required: false
    default: なし（外さない）
    description: '`paths` に当たっても、このパターンに当たるパスにはそのエントリを当てない'
    reload: immediate
    allowed: '`paths` と同じ書き方（glob か `re:` の正規表現）'
    visibility: user
    status: planned
  - key: rules[].tools
    title: 当てるツール名
    file: 索引（*.yaml）
    type: list[str]
    required: false
    default: なし（ツール名では当てない）
    description: MCP のツールの完全名に当てる glob か正規表現
    reload: immediate
    allowed: '`mcp__` で始まる glob（例 `mcp__*__create_*`）か、`re:` で始まる正規表現（ツールの完全名に部分一致で照合する。例 `re:__create_`）'
    visibility: user
    status: planned
  - key: rules[].on
    title: 止める操作
    file: 索引（*.yaml）
    type: list[Literal['read', 'write', 'mcp']]
    required: false
    default: 索引の `default_on`
    description: 未読のときに操作を止める操作の種別。当たった操作がここに無ければ、止めずに案内する
    reload: immediate
    allowed: '`read`（Read・Bash での読み取り）/ `write`（Edit・Write）/ `mcp`（MCP のツールの呼び出し）'
    visibility: user
    status: planned
  - key: RULE_INJECT_RECORD_RETENTION_DAYS
    title: 既読の記録の保持日数
    file: ~/.claude/settings.json
    type: int
    default: '30'
    description: 最後に書き足してからこの日数を過ぎた既読の記録ファイルを、セッションの開始時に消す
    env_var: RULE_INJECT_RECORD_RETENTION_DAYS
    reload: restart
    allowed: 1 以上の整数。それ以外の値は既定値で扱う
    status: planned
    visibility: user
  - key: RULE_INJECT_LOG_DIR
    title: ログの置き場所
    file: ~/.claude/settings.json
    type: str
    default: '`${XDG_STATE_HOME:-~/.local/state}/rule-inject/logs`'
    description: フックと MCP サーバーが失敗した操作を書く、日付ごとのログのファイルを置くフォルダ
    env_var: RULE_INJECT_LOG_DIR
    reload: restart
    allowed: 絶対パスか `~` で始まるパス
    status: planned
    visibility: user
  - key: RULE_INJECT_LOG_RETENTION_DAYS
    title: ログの保持日数
    file: ~/.claude/settings.json
    type: int
    default: '3'
    description: 日付が今日（UTC）からこの日数以上前のログのファイルを、セッションの開始時に消す
    env_var: RULE_INJECT_LOG_RETENTION_DAYS
    reload: restart
    allowed: 1 以上の整数。それ以外の値は既定値で扱う
    status: planned
    visibility: user
  - key: rules[].args
    title: 当てる引数
    file: 索引（*.yaml）
    type: dict[str, list[str]]
    required: false
    default: なし（引数では絞らない）
    description: '`tools` に当たった MCP のツールの引数に当てるパターン。引数のキー → パターンのリストのマップで、書いた全てのキーの値がどれかのパターンに当たるときだけエントリを当てる'
    reload: immediate
    allowed: キーは引数の名前で、オブジェクトの子はドットで結ぶ（例 `filter.kind`）。パターンは glob か `re:` で始まる正規表現（値に部分一致で照合する）。`キー:` の下にパターンのリストを並べたブロックのマップだけを読み、フローのマップ・空の `args`・キーの重複は索引を読めなくする。キーが引数に無いとき・値がオブジェクトのときは当てない。値が配列のとき、およびドット区切りのキーの途中が配列のときは要素ごとに照合し、どれか 1 つが当たれば当てる。文字列以外のスカラーは JSON の表記（`true`・`null`・`1.5`）で照合する
    visibility: user
    status: planned
