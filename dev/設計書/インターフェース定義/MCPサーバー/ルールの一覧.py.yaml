title: "ルールの一覧"
entry:
  kind: mcp_tool
  value: '`list_rules`'
flows:
  - name: 正常系
    summary: ユーザーの索引とプロジェクトの索引のエントリを、フックが読む順に返す
    setup:
      - name: Mock
        description: なし（同じプロセスで立てたサーバーへ MCP の Python SDK のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: '`global.indexes` にユーザーの索引、`projects` にプロジェクトの直下を `match` とし索引を 1 つ持つ要素'
        notes: '`RULE_INJECT_CONFIG` で指す'
      - name: 索引
        description: 'ユーザーの索引とプロジェクトの索引に、`on` を書かないエントリと `on: [write]` のエントリを 1 つずつ'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as list_rules
        participant CF as 設定ファイル
        participant IDX as 索引

        C->>IF: project_dir
        IF->>CF: 読む
        CF-->>IF: 索引の場所
        IF->>IDX: フックと同じ読み取りで読む
        IDX-->>IF: エントリ
        IF-->>C: config_path・indexes・entries
      ```
    expected:
      - '`config_path` が `RULE_INJECT_CONFIG` の場所'
      - '`indexes` がユーザーの索引・プロジェクトの索引の順'
      - '`entries` の 4 件がそれぞれ解いたルールの場所を持ち、`on` を書かないエントリの `on` が `[read, write, mcp]`'
      - '`total` が 4 で `next_cursor` が `None`'
    test: test_normal
  - name: 正常系（読めない索引と除いたエントリがある）
    summary: 読めない索引・読み飛ばしたエントリ・無効のエントリを分けて返す
    setup:
      - name: Mock
        description: なし（同じプロセスで立てたサーバーへ MCP の Python SDK のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: 正常系の `projects[].indexes` に無い索引の場所を 1 つ追加する
      - name: 索引
        description: 'プロジェクトの索引に、展開できない `!{名前}` を `rule` に持つエントリと `enabled: false` のエントリを追加する'
        notes: 変数参照の名前は環境変数に置かない
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as list_rules
        participant CF as 設定ファイル
        participant IDX as 索引

        C->>IF: project_dir
        IF->>CF: 読む
        CF-->>IF: 索引の場所（無い場所を含む）
        IF->>IDX: フックと同じ読み取りで読む
        IDX-->>IF: エントリ・読めない索引
        IF-->>C: entries・unreadable_indexes・skipped_entries・disabled_entries
      ```
    expected:
      - '`unreadable_indexes` に無い索引の場所と理由が載っている'
      - '`skipped_entries` に変数参照を展開できないエントリの位置と、理由に展開できない名前が載っている'
      - '`disabled_entries` に `enabled: false` のエントリの位置が載り、`entries` には載っていない'
    test: test_normal_when_some_entries_excluded
  - name: 正常系（続きがある）
    summary: '`limit` を超えた分を `next_cursor` で続けて取る'
    setup:
      - name: Mock
        description: なし（同じプロセスで立てたサーバーへ MCP の Python SDK のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: 正常系と同じ
      - name: 引数
        description: '`limit: 3` で呼び、返った `next_cursor` を `cursor` に渡してもう 1 回呼ぶ'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as list_rules
        participant IDX as 索引

        C->>IF: project_dir・limit 3
        IF->>IDX: 読む
        IF-->>C: 3 件・next_cursor
        C->>IF: project_dir・limit 3・cursor
        IF->>IDX: 読む
        IF-->>C: 残り 1 件・next_cursor なし
      ```
    expected:
      - 1 回目の `entries` が 3 件で `next_cursor` がある
      - 2 回目の `entries` が残りの 1 件で `next_cursor` が `None`
      - 2 回とも `total` が 4
    test: test_normal_when_paged
  - name: 異常系（絶対パスでない・ToolError）
    summary: 相対パスの `project_dir` をエラーにする
    setup:
      - name: Mock
        description: なし（同じプロセスで立てたサーバーへ MCP の Python SDK のクライアントで接続し、ツールを呼ぶ）
      - name: 引数
        description: '`project_dir` に相対パスを渡す'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as list_rules

        C->>IF: project_dir（相対パス）
        IF-->>C: isError: true（絶対パスで渡す旨）
      ```
    expected:
      - '結果が `isError: true` で、絶対パスで渡す旨が載っている'
    test: test_error_when_project_dir_not_absolute
  - name: 異常系（設定ファイルが読めない・ToolError）
    summary: 呼び出しの時点で読めない設定ファイルをエラーにする
    setup:
      - name: Mock
        description: なし（同じプロセスで立てたサーバーへ MCP の Python SDK のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: '`global` に知らないキーを持つ設定ファイル'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as list_rules
        participant CF as 設定ファイル

        C->>IF: project_dir
        IF->>CF: 読む
        CF-->>IF: 知らないキー
        IF-->>C: isError: true（設定ファイルの場所と理由）
      ```
    expected:
      - '結果が `isError: true` で、設定ファイルの場所と知らないキーの理由が載っている'
    test: test_error_when_settings_unreadable
lead: プロジェクトの直下を受け、フックがそのプロジェクトで読む索引と、効いているエントリを返す。読めない索引・読み飛ばしたエントリ・無効のエントリも理由とともに返す。
identifier: list_rules
idempotent: true
side_effects: なし（`readOnlyHint`）
request:
  - name: project_dir
    type: str
    required: true
    location: argument
    description: プロジェクトの直下
    constraints: 絶対パス
    notes: フックの `CLAUDE_PROJECT_DIR` に当たる値。この値で `projects[].match` を当て、`projects[].indexes` の相対パスを解く
  - name: limit
    type: int
    required: false
    default: '100'
    location: argument
    description: 返す効いているエントリの件数の上限
    constraints: 1〜500
  - name: cursor
    type: str
    required: false
    default: なし（先頭から返す）
    location: argument
    description: 前の応答の `next_cursor`
  - name: format
    type: Literal['markdown', 'json']
    required: false
    default: markdown
    location: argument
    description: 応答の形式
    notes: '`json` のときは structuredContent と text に同じ JSON を入れる。`markdown` のときは同じ項目を Markdown の表で text に入れ、structuredContent を返さない'
request_example: |-
  ```json
  {"project_dir": "/home/user/project", "format": "json"}
  ```
response:
  - name: success
    type: bool
    description: 一覧を作れたか
    notes: 読めない索引があっても `true`
  - name: output
    type: str
    description: 索引の数と各一覧の件数の 1 行
  - name: config_path
    type: str | None
    description: サーバーが読んだ設定ファイルの場所
    notes: '`RULE_INJECT_CONFIG` が無いときは `None`'
  - name: indexes
    type: list[str]
    description: 読む索引の場所
    notes: フックが読む順
  - name: entries[].index
    type: str
    description: エントリを持つ索引の場所
  - name: entries[].position
    type: int
    description: 索引の `rules` の中の位置
    constraints: 0 始まり
    notes: 書き込み・削除のツールの `position` に渡す
  - name: entries[].rev
    type: str
    description: エントリのバージョン
    notes: 書き込み・削除のツールの `expected_rev` に渡す。求め方は制約「エントリのバージョン」
  - name: entries[].rule
    type: str
    description: 変数参照を展開し、索引のフォルダから解いたルールの場所
  - name: entries[].paths
    type: list[str]
    description: 当てるパスのパターン（索引に書いたまま）
  - name: entries[].exclude
    type: list[str]
    description: 外すパスのパターン
  - name: entries[].tools
    type: list[str]
    description: 当てるツール名のパターン
  - name: entries[].args
    type: dict[str, list[str]]
    description: 当てる引数のパターン
  - name: entries[].on
    type: list[Literal['read', 'write', 'mcp']]
    description: 止める操作の種別
    notes: エントリが `on` を書かないときは、索引の `default_on`（それも無ければ 3 つ全て）を埋めた値
  - name: entries[].read_by
    type: list[dict]
    description: 既読にする呼び出し（`tools`・`args`）
  - name: unreadable_indexes[].index
    type: str
    description: 読めない索引の場所
  - name: unreadable_indexes[].reason
    type: str
    description: 読めない理由
    notes: フックが案内に載せる理由と同じ文言
  - name: skipped_entries[].index
    type: str
    description: 読み飛ばしたエントリを持つ索引の場所
  - name: skipped_entries[].position
    type: int
    description: 索引の `rules` の中の位置
  - name: skipped_entries[].rev
    type: str
    description: エントリのバージョン
  - name: skipped_entries[].rule
    type: str
    description: 索引に書いたままの `rule`
  - name: skipped_entries[].reason
    type: str
    description: 読み飛ばした理由
    notes: 展開できない変数参照の名前・URL の `rule`・コンパイルできない正規表現。フックが案内に載せる理由と同じ文言
  - name: disabled_entries[].index
    type: str
    description: '`enabled: false` のエントリを持つ索引の場所'
  - name: disabled_entries[].position
    type: int
    description: 索引の `rules` の中の位置
  - name: disabled_entries[].rev
    type: str
    description: エントリのバージョン
  - name: disabled_entries[].rule
    type: str
    description: 索引に書いたままの `rule`
  - name: total
    type: int
    description: 効いているエントリの総数
  - name: next_cursor
    type: str | None
    description: 続きを取るときに `cursor` へ渡す値
    notes: 続きが無いときは `None`
response_example: |-
  ```json
  {
    "success": true,
    "output": "索引 2 件・効いているエントリ 2 件・読めない索引 0 件・読み飛ばしたエントリ 0 件・無効のエントリ 0 件",
    "config_path": "/home/user/.config/rule-inject/settings.yaml",
    "indexes": ["/home/user/.config/rule-inject/rules.yaml", "/home/user/project/rules.yaml"],
    "entries": [
      {
        "index": "/home/user/project/rules.yaml",
        "position": 0,
        "rev": "3f9a1c0b2d4e",
        "rule": "/home/user/project/docs/python.md",
        "paths": ["**/*.py"],
        "exclude": [],
        "tools": [],
        "args": {},
        "on": ["write"],
        "read_by": []
      }
    ],
    "unreadable_indexes": [],
    "skipped_entries": [],
    "disabled_entries": [],
    "total": 2,
    "next_cursor": null
  }
  ```
exceptions:
  - name: なし（正常終了）
    condition: 一覧を作れた
    notes: 読めない索引・読み飛ばしたエントリはエラーにせず応答に載せる
  - name: ToolError（絶対パスでない）
    condition: '`project_dir` が絶対パスでない'
    notes: 'ツールの結果を `isError: true` にし、絶対パスで渡す旨を返す'
  - name: ToolError（設定ファイルが読めない）
    condition: 呼び出しの時点で設定ファイルが無い・読めない・書式に合わない・知らないキーか許す値の外の値を持つ
    notes: 'ツールの結果を `isError: true` にし、設定ファイルの場所と理由を返す（既定値では動かさない）'
error_format: 'MCP のツールの結果を `isError: true` にし、text に理由を 1 行で入れる。structuredContent は返さない'
constraints:
  - item: 読む索引
    constraint: フックと同じ規則（設定ファイルの `global.indexes`・当たった `projects[].indexes`・既定の置き場所）を、`project_dir` を `CLAUDE_PROJECT_DIR` として当てる
    notes: 規則はインターフェース定義「ルール案内」の制約「索引」。フックと同じコードで読む
  - item: 変数参照
    constraint: '`rule` の `!{名前}` はサーバーを起動した環境の環境変数で展開する'
    notes: フックと同じ結果にするには、起動の側にも同じ環境変数を置く
  - item: エントリのバージョン
    constraint: エントリのキーと値（索引に書いたまま）をキーの順に並べた JSON の SHA-256 の先頭 12 文字
    notes: コメント・引用符・字下げだけの違いでは変わらない
  - item: 応答の長さ
    constraint: 効いているエントリを `limit` 件まで返し、応答が上限を超えるときはその手前で切って `next_cursor` を返す
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[MCPのツールの応答の長さ]
    notes: 読めない索引・読み飛ばしたエントリ・無効のエントリは先頭のページだけに載せる
  - item: 認可
    constraint: 制限なし
refs:
  - dev/設計書/シナリオ/単一ユースケース/効いているルールの一覧を見る#
