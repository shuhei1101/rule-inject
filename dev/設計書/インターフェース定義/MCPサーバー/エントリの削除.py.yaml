title: "エントリの削除"
entry:
  kind: mcp_tool
  value: '`delete_index_entry`'
flows:
  - name: 正常系
    summary: 位置で指したエントリを削除し、他のエントリとコメントを残す
    setup:
      - name: Mock
        description: なし（同じプロセスで立てたサーバーへ MCP の Python SDK のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: '`projects` にプロジェクトの直下を `match` とし索引を 1 つ持つ要素'
      - name: 索引
        description: コメントを持つエントリを 2 つ持つ
        notes: 削除の前の内容を控える
      - name: 引数
        description: '`position: 0` と 1 つ目のエントリの `expected_rev`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as delete_index_entry
        participant CF as 設定ファイル
        participant IDX as 索引

        C->>IF: project_dir・index・position 0・expected_rev
        IF->>CF: 読む
        CF-->>IF: 読む索引
        IF->>IDX: round-trip で読む
        IDX-->>IF: 書式つきの内容
        IF->>IF: バージョンを比べ、エントリを除く
        IF->>IDX: 一時ファイルを書き、置き換える
        IF-->>C: rule・diff
      ```
    expected:
      - 索引から 1 つ目のエントリが無くなり、2 つ目のエントリとそのコメントは変わっていない
      - 応答の `rule` が削除したエントリの `rule` で、`written` が `true`
    test: test_normal
  - name: 正常系（書き込まずに確かめる）
    summary: '`dry_run` で差分だけを返す'
    setup:
      - name: Mock
        description: なし（同じプロセスで立てたサーバーへ MCP の Python SDK のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: 正常系と同じ
      - name: 索引
        description: 正常系と同じ
        notes: 削除の前のバイト列を控える
      - name: 引数
        description: '正常系と同じ引数と `dry_run: true`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as delete_index_entry
        participant IDX as 索引

        C->>IF: index・position 0・expected_rev・dry_run: true
        IF->>IDX: round-trip で読む
        IDX-->>IF: 書式つきの内容
        IF->>IF: エントリを除く
        IF-->>C: written: false・diff
      ```
    expected:
      - '`written` が `false` で、`diff` に削除するエントリの行が載っている'
      - 索引のファイルが削除の前のバイト列のまま
    test: test_normal_when_dry_run
  - name: 正常系（もとから問題のある索引から削除する）
    summary: 他のエントリにもとから問題が残っていても削除する
    setup:
      - name: Mock
        description: なし（同じプロセスで立てたサーバーへ MCP の Python SDK のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: 正常系と同じ
      - name: 索引
        description: '1 つ目が `rule` の場所にファイルが無く、2 つ目が `paths: []` を持つ'
      - name: 引数
        description: '`position: 0` と 1 つ目のエントリの `expected_rev`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as delete_index_entry
        participant IDX as 索引

        C->>IF: index・position 0・expected_rev
        IF->>IDX: round-trip で読む
        IDX-->>IF: 書式つきの内容
        IF->>IF: バージョンを比べ、エントリを除く
        IF->>IDX: 一時ファイルを書き、置き換える
        IF-->>C: rule・diff
      ```
    expected:
      - '`written` が `true` で、索引のエントリが `paths: []` を持つ 1 つだけ'
      - 残ったエントリの行が削除の前のまま
    test: test_normal_when_existing_problems_remain
  - name: 異常系（絶対パスでない・ToolError）
    summary: 相対パスの `project_dir` をエラーにする
    setup:
      - name: Mock
        description: なし（同じプロセスで立てたサーバーへ MCP の Python SDK のクライアントで接続し、ツールを呼ぶ）
      - name: 引数
        description: '`project_dir` に相対パスを渡す'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as delete_index_entry

        C->>IF: project_dir（相対パス）
        IF-->>C: isError: true（絶対パスで渡す旨）
      ```
    expected:
      - '結果が `isError: true` で、絶対パスで渡す旨が載っている'
    test: test_error_when_project_dir_not_absolute
  - name: 異常系（設定ファイルが読めない・ToolError）
    summary: 呼び出しの時点で読めない設定ファイルをエラーにする
    setup:
      - name: Mock
        description: なし（同じプロセスで立てたサーバーへ MCP の Python SDK のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: '`global` に知らないキーを持つ設定ファイル'
      - name: 索引
        description: エントリを 1 つ持つ
        notes: 削除の前のバイト列を控える
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as delete_index_entry
        participant CF as 設定ファイル

        C->>IF: project_dir・index・position・expected_rev
        IF->>CF: 読む
        CF-->>IF: 知らないキー
        IF-->>C: isError: true（設定ファイルの場所と理由）
      ```
    expected:
      - '結果が `isError: true` で、設定ファイルの場所と知らないキーの理由が載っている'
      - 索引のファイルが削除の前のバイト列のまま
    test: test_error_when_settings_unreadable
  - name: 異常系（設定ファイルで読む索引でない・ToolError）
    summary: 設定ファイルで読まないファイルからの削除を断る
    setup:
      - name: Mock
        description: なし（同じプロセスで立てたサーバーへ MCP の Python SDK のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: 正常系と同じ
      - name: 対象のファイル
        description: 設定ファイルで読まない場所に置いた、索引の書式の YAML
        notes: 削除の前のバイト列を控える
      - name: 引数
        description: '`index` に対象のファイル、`position: 0` とそのエントリの `expected_rev`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as delete_index_entry
        participant CF as 設定ファイル

        C->>IF: project_dir・index（読まない場所）・position 0
        IF->>CF: 読む
        CF-->>IF: 読む索引（index を含まない）
        IF-->>C: isError: true（設定ファイルで読む索引でない旨）
      ```
    expected:
      - '結果が `isError: true` で、設定ファイルで読む索引でない旨が載っている'
      - 対象のファイルが削除の前のバイト列のまま
    test: test_error_when_not_configured_index
  - name: 異常系（索引がYAMLとして読めない・ToolError）
    summary: YAML として読めない索引からの削除を断る
    setup:
      - name: Mock
        description: なし（同じプロセスで立てたサーバーへ MCP の Python SDK のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: 正常系と同じ
      - name: 索引
        description: 閉じていないフロー形式のリストを持ち、YAML として読めない
        notes: 削除の前のバイト列を控える
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as delete_index_entry
        participant IDX as 索引

        C->>IF: index・position 0・expected_rev
        IF->>IDX: round-trip で読む
        IDX-->>IF: 読めない
        IF-->>C: isError: true（索引の場所と理由）
      ```
    expected:
      - '結果が `isError: true` で、索引の場所と読めない理由が載っている'
      - 索引のファイルが削除の前のバイト列のまま
    test: test_error_when_index_unparsable
  - name: 異常系（エントリの位置が無い・ToolError）
    summary: エントリの数以上の位置の削除を断る
    setup:
      - name: Mock
        description: なし（同じプロセスで立てたサーバーへ MCP の Python SDK のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: 正常系と同じ
      - name: 索引
        description: エントリを 1 つ持つ
        notes: 削除の前のバイト列を控える
      - name: 引数
        description: '`position: 1` と任意の `expected_rev`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as delete_index_entry
        participant IDX as 索引

        C->>IF: index・position 1・expected_rev
        IF->>IDX: round-trip で読む
        IDX-->>IF: エントリ 1 つ
        IF-->>C: isError: true（位置が無い旨とエントリの数）
      ```
    expected:
      - '結果が `isError: true` で、位置が無い旨とエントリの数 1 が載っている'
      - 索引のファイルが削除の前のバイト列のまま
    test: test_error_when_entry_not_found
  - name: 異常系（バージョンが合わない・ToolError）
    summary: 一覧を取った後に書き換えられたエントリの削除を断る
    setup:
      - name: Mock
        description: なし（同じプロセスで立てたサーバーへ MCP の Python SDK のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: 正常系と同じ
      - name: 索引
        description: エントリを 1 つ持ち、一覧で `rev` を取った後にテストがそのエントリの `paths` を直接書き換える
        notes: 書き換えた後のバイト列を控える
      - name: 引数
        description: '`position: 0` と、書き換える前に取った `expected_rev`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as delete_index_entry
        participant IDX as 索引

        C->>IF: index・position 0・古い expected_rev
        IF->>IDX: round-trip で読む
        IDX-->>IF: 書き換えられたエントリ
        IF-->>C: isError: true（今のバージョンと取り直す旨）
      ```
    expected:
      - '結果が `isError: true` で、今のバージョンと一覧を取り直す旨が載っている'
      - 索引のファイルがテストが書き換えた後のバイト列のまま
    test: test_error_when_rev_mismatch
lead: 設定ファイルで読む索引から、位置で指したエントリを削除する。
identifier: delete_index_entry
idempotent: false
side_effects: 索引のファイルを書き換える（`dry_run` のときとエラーのときは書き換えない）。`destructiveHint`
exclusivity: インターフェース定義「エントリの書き込み」と同じロックを使う
request:
  - name: project_dir
    type: str
    required: true
    location: argument
    description: プロジェクトの直下
    constraints: 絶対パス
    notes: インターフェース定義「エントリの書き込み」の `project_dir` と同じ
  - name: index
    type: str
    required: true
    location: argument
    description: エントリを削除する索引の場所
    constraints: 絶対パスか `~` で始まるパス。設定ファイルで読む索引に限る
  - name: position
    type: int
    required: true
    location: argument
    description: 削除するエントリの位置
    constraints: 0 以上
  - name: expected_rev
    type: str
    required: true
    location: argument
    description: 削除するエントリのバージョン
    notes: インターフェース定義「ルールの一覧」の `rev`
  - name: dry_run
    type: bool
    required: false
    default: 'false'
    location: argument
    description: 書き込まずに差分だけを返すか
request_example: |-
  ```json
  {
    "project_dir": "/home/user/project",
    "index": "/home/user/project/rules.yaml",
    "position": 0,
    "expected_rev": "3f9a1c0b2d4e"
  }
  ```
response:
  - name: success
    type: bool
    description: 削除したか
  - name: output
    type: str
    description: 削除した索引と位置の 1 行
  - name: index
    type: str
    description: 削除した索引の場所（`~` を展開した後）
  - name: rule
    type: str
    description: 削除したエントリの `rule`（索引に書いたまま）
  - name: written
    type: bool
    description: 索引のファイルを書き換えたか
    notes: '`dry_run` のときは `false`'
  - name: diff
    type: str
    description: 索引のファイルの書き換えの前後の unified diff
    notes: 前後 3 行を添える
response_notes: 削除した位置より後ろのエントリは位置が 1 つずつ前へずれる。続けて書き込むときは一覧を取り直す
exceptions:
  - name: なし（正常終了）
    condition: エントリを除いて書き込んだ（`dry_run` のときは書き込まずに返した）
  - name: ToolError（絶対パスでない）
    condition: '`project_dir` が絶対パスでない'
    notes: インターフェース定義「ルールの一覧」と同じ
  - name: ToolError（設定ファイルが読めない）
    condition: インターフェース定義「ルールの一覧」と同じ
    notes: 設定ファイルの場所と理由を返す
  - name: ToolError（設定ファイルで読む索引でない）
    condition: インターフェース定義「エントリの書き込み」と同じ
    notes: 設定ファイルで読む索引でない旨と、読む索引の場所を返す
  - name: ToolError（索引が YAML として読めない）
    condition: インターフェース定義「エントリの書き込み」と同じ
    notes: 索引の場所と理由を返す
  - name: ToolError（エントリの位置が無い）
    condition: '`position` が索引のエントリの数以上'
    notes: 位置が無い旨と索引のエントリの数を返す
  - name: ToolError（バージョンが合わない）
    condition: '`expected_rev` が今のエントリのバージョンと違う'
    notes: 今のバージョンと、一覧を取り直してから呼び直す旨を返す
error_format: インターフェース定義「エントリの書き込み」と同じ
constraints:
  - item: 書き込める索引
    constraint: インターフェース定義「エントリの書き込み」と同じ
  - item: 書き込みの手順
    constraint: インターフェース定義「エントリの書き込み」と同じ（変更は対象のエントリを除くこと。チェックは行わない）
  - item: チェック
    constraint: 行わない
    notes: エントリを除くだけでは、フックが読めなくなることも新しい問題が出ることも無い。もとからある問題で削除を止めない（インターフェース定義「エントリの書き込み」の制約「チェック」）
  - item: 書式の維持
    constraint: 対象のエントリの行と、そのエントリに付いたコメントだけを除き、他の行を変えない
    notes: 次のエントリの直前に置いたコメントは次のエントリに付くものとして残す
  - item: エントリのバージョン
    constraint: インターフェース定義「ルールの一覧」の制約「エントリのバージョン」と同じ求め方
  - item: 認可
    constraint: 制限なし
    notes: 書き込める範囲は制約「書き込める索引」で絞る。削除を別のツールにし、利用者が Claude Code の許可の設定で削除だけを止められるようにする
refs:
  - dev/設計書/シナリオ/単一ユースケース/索引のエントリを編集する#
