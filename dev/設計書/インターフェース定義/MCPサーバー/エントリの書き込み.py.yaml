title: "エントリの書き込み"
entry:
  kind: mcp_tool
  value: '`write_index_entry`'
flows:
  - name: 正常系（エントリを新規作成する）
    summary: 末尾にエントリを追加し、他の行を変えない
    setup:
      - name: Mock
        description: なし（同じプロセスで立てたサーバーへ MCP の Python SDK のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: '`projects` にプロジェクトの直下を `match` とし索引を 1 つ持つ要素'
      - name: 索引
        description: コメント・引用符つきの値・1 行のフロー形式の `paths` を持つエントリを 1 つ持つ
        notes: 書き込みの前の内容を控える
      - name: ルールの本文
        description: 新しいエントリが指す Markdown
      - name: 引数
        description: '`index` と、`rule`・80 字を超える `paths` の glob・`on` を持つ `entry`（`position` なし）'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as write_index_entry
        participant CF as 設定ファイル
        participant IDX as 索引

        C->>IF: project_dir・index・entry
        IF->>CF: 読む
        CF-->>IF: 読む索引
        IF->>IDX: round-trip で読む
        IDX-->>IF: 書式つきの内容
        IF->>IF: 末尾に追加し、チェックする
        IF->>IDX: 一時ファイルを書き、置き換える
        IF-->>C: position・rev・diff
      ```
    expected:
      - 索引の末尾に渡したエントリがあり、新しい `paths` が 1 行のフロー形式
      - 書き込みの前との差分が追加したエントリの行だけ
      - 索引を `load_indexes` で読むと、追加したエントリが読み飛ばされずに読める
      - '`position` が 1、`written` が `true`'
    test: test_normal_when_entry_created
  - name: 正常系（エントリを編集する）
    summary: 位置で指したエントリのキーだけを書き換える
    setup:
      - name: Mock
        description: なし（同じプロセスで立てたサーバーへ MCP の Python SDK のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: エントリを新規作成するフローと同じ
      - name: 索引
        description: コメントを持つエントリを 2 つ持つ
        notes: 書き込みの前の内容を控える
      - name: 引数
        description: '`position: 1`、2 つ目のエントリの `expected_rev`、`entry` に新しい `paths` だけ'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as write_index_entry
        participant IDX as 索引

        C->>IF: index・position 1・expected_rev・entry
        IF->>IDX: round-trip で読む
        IDX-->>IF: 書式つきの内容
        IF->>IF: バージョンを比べ、paths を書き換えてチェックする
        IF->>IDX: 一時ファイルを書き、置き換える
        IF-->>C: position・rev・diff
      ```
    expected:
      - 2 つ目のエントリの `paths` が渡した値で、他のキーは変わっていない
      - 書き込みの前との差分が書き換えた行だけで、1 つ目のエントリとコメントは変わっていない
      - 応答の `rev` が `expected_rev` と違う
    test: test_normal_when_entry_updated
  - name: 正常系（エントリを無効にする）
    summary: '`enabled: false` を書き、照合に使われなくする'
    setup:
      - name: Mock
        description: なし（同じプロセスで立てたサーバーへ MCP の Python SDK のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: エントリを新規作成するフローと同じ
      - name: 索引
        description: '`enabled` を書かないエントリを 1 つ持つ'
      - name: 引数
        description: '`position: 0`、`expected_rev`、`entry: {enabled: false}`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as write_index_entry
        participant IDX as 索引

        C->>IF: index・position 0・expected_rev・enabled: false
        IF->>IDX: round-trip で読む
        IDX-->>IF: 書式つきの内容
        IF->>IF: enabled: false を書き、チェックする
        IF->>IDX: 一時ファイルを書き、置き換える
        IF-->>C: position・rev・diff
      ```
    expected:
      - '対象のエントリに `enabled: false` が書かれている'
      - 索引を `load_indexes` で読むと、対象のエントリが読めたエントリに入っていない
    test: test_normal_when_entry_disabled
  - name: 正常系（書き込まずに確かめる）
    summary: '`dry_run` でチェックと差分だけを返す'
    setup:
      - name: Mock
        description: なし（同じプロセスで立てたサーバーへ MCP の Python SDK のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: エントリを新規作成するフローと同じ
      - name: 索引
        description: エントリを 1 つ持つ
        notes: 書き込みの前のバイト列を控える
      - name: 引数
        description: 'エントリを新規作成するフローと同じ `entry` と `dry_run: true`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as write_index_entry
        participant IDX as 索引

        C->>IF: index・entry・dry_run: true
        IF->>IDX: round-trip で読む
        IDX-->>IF: 書式つきの内容
        IF->>IF: 末尾に追加し、チェックする
        IF-->>C: written: false・diff
      ```
    expected:
      - '`written` が `false` で、`diff` に追加するエントリの行が載っている'
      - 索引のファイルが書き込みの前のバイト列のまま
    test: test_normal_when_dry_run
  - name: 正常系（もとから問題のある索引のエントリを修正する）
    summary: 他のエントリにもとから問題が残っていても、新しい問題を生まない書き込みは通す
    setup:
      - name: Mock
        description: なし（同じプロセスで立てたサーバーへ MCP の Python SDK のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: エントリを新規作成するフローと同じ
      - name: 索引
        description: '1 つ目が `paths: []`、2 つ目が `rule` の場所にファイルが無いエントリを持つ'
      - name: 引数
        description: '`position: 0`、1 つ目のエントリの `expected_rev`、`entry` に空でない `paths`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as write_index_entry
        participant IDX as 索引

        C->>IF: index・position 0・expected_rev・entry
        IF->>IDX: round-trip で読む
        IDX-->>IF: 書式つきの内容
        IF->>IF: 書く前と書いた後をチェックし、新しい問題が無いことを確かめる
        IF->>IDX: 一時ファイルを書き、置き換える
        IF-->>C: position・rev・diff
      ```
    expected:
      - '`written` が `true` で、1 つ目のエントリの `paths` が渡した値'
      - 2 つ目のエントリが書き込みの前のまま残っている
    test: test_normal_when_existing_problems_remain
  - name: 異常系（引数の組み合わせが誤り・ToolError）
    summary: '`position` だけを渡し `expected_rev` を渡さない呼び出しをエラーにする'
    setup:
      - name: Mock
        description: なし（同じプロセスで立てたサーバーへ MCP の Python SDK のクライアントで接続し、ツールを呼ぶ）
      - name: 引数
        description: '`position: 0` と `entry` を渡し、`expected_rev` を渡さない'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as write_index_entry

        C->>IF: index・position 0・entry
        IF-->>C: isError: true（expected_rev を渡す旨）
      ```
    expected:
      - '結果が `isError: true` で、`expected_rev` を渡す旨が載っている'
    test: test_error_when_arguments_invalid
  - name: 異常系（設定ファイルが読めない・ToolError）
    summary: 呼び出しの時点で読めない設定ファイルをエラーにする
    setup:
      - name: Mock
        description: なし（同じプロセスで立てたサーバーへ MCP の Python SDK のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: '`global` に知らないキーを持つ設定ファイル'
      - name: 索引
        description: エントリを 1 つ持つ
        notes: 書き込みの前のバイト列を控える
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as write_index_entry
        participant CF as 設定ファイル

        C->>IF: project_dir・index・entry
        IF->>CF: 読む
        CF-->>IF: 知らないキー
        IF-->>C: isError: true（設定ファイルの場所と理由）
      ```
    expected:
      - '結果が `isError: true` で、設定ファイルの場所と知らないキーの理由が載っている'
      - 索引のファイルが書き込みの前のバイト列のまま
    test: test_error_when_settings_unreadable
  - name: 異常系（設定ファイルで読む索引でない・ToolError）
    summary: 設定ファイルで読まないファイルへの書き込みを断る
    setup:
      - name: Mock
        description: なし（同じプロセスで立てたサーバーへ MCP の Python SDK のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: エントリを新規作成するフローと同じ
      - name: 対象のファイル
        description: 設定ファイルで読まない場所に置いた、索引の書式の YAML
        notes: 書き込みの前のバイト列を控える
      - name: 引数
        description: '`index` に対象のファイル、書式どおりの `entry`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as write_index_entry
        participant CF as 設定ファイル

        C->>IF: project_dir・index（読まない場所）・entry
        IF->>CF: 読む
        CF-->>IF: 読む索引（index を含まない）
        IF-->>C: isError: true（設定ファイルで読む索引でない旨）
      ```
    expected:
      - '結果が `isError: true` で、設定ファイルで読む索引でない旨と読む索引の場所が載っている'
      - 対象のファイルが書き込みの前のバイト列のまま
    test: test_error_when_not_configured_index
  - name: 異常系（索引がYAMLとして読めない・ToolError）
    summary: YAML として読めない索引への書き込みを断る
    setup:
      - name: Mock
        description: なし（同じプロセスで立てたサーバーへ MCP の Python SDK のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: エントリを新規作成するフローと同じ
      - name: 索引
        description: 閉じていないフロー形式のリストを持ち、YAML として読めない
        notes: 書き込みの前のバイト列を控える
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as write_index_entry
        participant IDX as 索引

        C->>IF: index・entry
        IF->>IDX: round-trip で読む
        IDX-->>IF: 読めない
        IF-->>C: isError: true（索引の場所と理由）
      ```
    expected:
      - '結果が `isError: true` で、索引の場所と読めない理由が載っている'
      - 索引のファイルが書き込みの前のバイト列のまま
    test: test_error_when_index_unparsable
  - name: 異常系（エントリの位置が無い・ToolError）
    summary: エントリの数以上の位置への書き込みを断る
    setup:
      - name: Mock
        description: なし（同じプロセスで立てたサーバーへ MCP の Python SDK のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: エントリを新規作成するフローと同じ
      - name: 索引
        description: エントリを 1 つ持つ
        notes: 書き込みの前のバイト列を控える
      - name: 引数
        description: '`position: 1` と任意の `expected_rev`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as write_index_entry
        participant IDX as 索引

        C->>IF: index・position 1・expected_rev・entry
        IF->>IDX: round-trip で読む
        IDX-->>IF: エントリ 1 つ
        IF-->>C: isError: true（位置が無い旨とエントリの数）
      ```
    expected:
      - '結果が `isError: true` で、位置が無い旨とエントリの数 1 が載っている'
      - 索引のファイルが書き込みの前のバイト列のまま
    test: test_error_when_entry_not_found
  - name: 異常系（バージョンが合わない・ToolError）
    summary: 一覧を取った後に書き換えられたエントリへの書き込みを断る
    setup:
      - name: Mock
        description: なし（同じプロセスで立てたサーバーへ MCP の Python SDK のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: エントリを新規作成するフローと同じ
      - name: 索引
        description: エントリを 1 つ持ち、一覧で `rev` を取った後にテストがそのエントリの `paths` を直接書き換える
        notes: 書き換えた後のバイト列を控える
      - name: 引数
        description: '`position: 0` と、書き換える前に取った `expected_rev`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as write_index_entry
        participant IDX as 索引

        C->>IF: index・position 0・古い expected_rev・entry
        IF->>IDX: round-trip で読む
        IDX-->>IF: 書き換えられたエントリ
        IF-->>C: isError: true（今のバージョンと取り直す旨）
      ```
    expected:
      - '結果が `isError: true` で、今のバージョンと一覧を取り直す旨が載っている'
      - 索引のファイルがテストが書き換えた後のバイト列のまま
    test: test_error_when_rev_mismatch
  - name: 異常系（書いた後の索引がチェックに通らない・ToolError）
    summary: Schema に違反するエントリの新規作成を断る
    setup:
      - name: Mock
        description: なし（同じプロセスで立てたサーバーへ MCP の Python SDK のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: エントリを新規作成するフローと同じ
      - name: 索引
        description: エントリを 1 つ持つ
        notes: 書き込みの前のバイト列を控える
      - name: 引数
        description: '`paths: []` を持つ `entry`（`position` なし）'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as write_index_entry
        participant IDX as 索引

        C->>IF: index・entry（paths: []）
        IF->>IDX: round-trip で読む
        IDX-->>IF: 書式つきの内容
        IF->>IF: 末尾に追加し、チェックする（違反）
        IF-->>C: isError: true（違反の場所と理由）
      ```
    expected:
      - '結果が `isError: true` で、`rules[1].paths` と違反の理由が載っている'
      - 索引のファイルが書き込みの前のバイト列のまま
    test: test_error_when_check_failed
lead: 設定ファイルで読む索引に、エントリを末尾へ新規作成するか、位置で指したエントリのキーを書き換える。書いた後の索引に新しい問題が出るときは書き込まない。
identifier: write_index_entry
idempotent: false
side_effects: 索引のファイルを書き換える（`dry_run` のときとエラーのときは書き換えない）
exclusivity: 同じ索引への書き込み・削除は、サーバーのプロセスの中の索引ごとのロックで 1 つずつ行う
request:
  - name: project_dir
    type: str
    required: true
    location: argument
    description: プロジェクトの直下
    constraints: 絶対パス
    notes: 設定ファイルで読む索引を決めるのに使う。インターフェース定義「ルールの一覧」の `project_dir` と同じ
  - name: index
    type: str
    required: true
    location: argument
    description: 書き込む索引の場所
    constraints: 絶対パスか `~` で始まるパス。設定ファイルで読む索引に限る
  - name: entry
    type: dict[str, Any]
    required: true
    location: argument
    description: 書き込むキーと値
    constraints: キーは `rule`・`paths`・`exclude`・`tools`・`args`・`on`・`read_by`・`enabled`
    notes: '`position` が無いときは新しいエントリの全てのキー、あるときは書き換えるキーだけを渡す（渡さないキーはそのまま残る）'
  - name: position
    type: int
    required: false
    default: なし（`rules` の末尾に新規作成する）
    location: argument
    description: 書き換えるエントリの位置
    constraints: 0 以上
    notes: インターフェース定義「ルールの一覧」の `position`
  - name: expected_rev
    type: str
    required: false
    default: なし（`position` を渡すときは必須）
    location: argument
    description: 書き換える前のエントリのバージョン
    notes: インターフェース定義「ルールの一覧」の `rev`
  - name: remove_keys
    type: list[str]
    required: false
    default: なし（キーを消さない）
    location: argument
    description: エントリから削除するキー
    notes: '`position` を渡すときだけ使う。`entry` と同じキーは渡せない'
  - name: dry_run
    type: bool
    required: false
    default: 'false'
    location: argument
    description: 書き込まずにチェックと差分だけを返すか
request_example: |-
  ```json
  {
    "project_dir": "/home/user/project",
    "index": "/home/user/project/rules.yaml",
    "entry": {"rule": "docs/python.md", "paths": ["**/*.py"], "on": ["write"]}
  }
  ```
response:
  - name: success
    type: bool
    description: 書き込んだか（`dry_run` のときは新しい問題が無かったか）
  - name: output
    type: str
    description: 書き込んだ索引と位置の 1 行
  - name: index
    type: str
    description: 書き込んだ索引の場所（`~` を展開した後）
  - name: position
    type: int
    description: 書き込んだエントリの位置
  - name: rev
    type: str
    description: 書き込んだ後のエントリのバージョン
  - name: written
    type: bool
    description: 索引のファイルを書き換えたか
    notes: '`dry_run` のときは `false`'
  - name: diff
    type: str
    description: 索引のファイルの書き換えの前後の unified diff
    notes: 前後 3 行を添える
response_example: |-
  ```json
  {
    "success": true,
    "output": "/home/user/project/rules.yaml の rules[2] を書き込みました",
    "index": "/home/user/project/rules.yaml",
    "position": 2,
    "rev": "8b1d0e7a4c2f",
    "written": true,
    "diff": "--- rules.yaml\n+++ rules.yaml\n@@ -8,3 +8,6 @@\n..."
  }
  ```
exceptions:
  - name: なし（正常終了）
    condition: 書いた後の索引に新しい問題が無く、書き込んだ（`dry_run` のときは書き込まずに返した）
  - name: ToolError（引数の組み合わせが誤り）
    condition: '`project_dir` が絶対パスでない、`position` を渡して `expected_rev` を渡さない、`position` が無いのに `remove_keys` を渡す、`entry` と `remove_keys` に同じキーがある'
    notes: 'ツールの結果を `isError: true` にし、渡し方を返す'
  - name: ToolError（設定ファイルが読めない）
    condition: インターフェース定義「ルールの一覧」と同じ
    notes: 設定ファイルの場所と理由を返す
  - name: ToolError（設定ファイルで読む索引でない）
    condition: '`index` が、`project_dir` で設定ファイルから決まる読む索引のどれでもない'
    notes: 設定ファイルで読む索引でない旨と、読む索引の場所を返す
  - name: ToolError（索引が YAML として読めない）
    condition: 索引のファイルが無い・読めない・YAML として読めない、または最上位がマップでない
    notes: 索引の場所と理由を返す
  - name: ToolError（エントリの位置が無い）
    condition: '`position` が索引のエントリの数以上'
    notes: 位置が無い旨と索引のエントリの数を返す
  - name: ToolError（バージョンが合わない）
    condition: '`expected_rev` が今のエントリのバージョンと違う'
    notes: 今のバージョンと、一覧を取り直してから呼び直す旨を返す
  - name: ToolError（書いた後の索引がチェックに通らない）
    condition: 書いた後の索引をフックが読めない、または書く前の索引に無かった問題（JSON Schema の違反・ルールの場所にファイルが無いエントリ）が出る
    notes: 書き込まずに、新しく出た問題ごとの索引の中の場所と理由を返す
error_format: 'インターフェース定義「ルールの一覧」と同じ。チェックに通らないときは、問題を `{索引の中の場所}: {理由}` の行で全て並べる'
constraints:
  - item: 書き込める索引
    constraint: '`project_dir` を `CLAUDE_PROJECT_DIR` として設定ファイルから決めた読む索引だけ。`~` を展開し、シンボリックリンクを解いた場所で比べる'
    notes: 任意のファイルへの書き込みを防ぐ
  - item: 書き込みの手順
    constraint: ロックの中で、索引を読む → バージョンを比べる → 変更を当てる前と後の内容をチェックする → 同じフォルダの一時ファイルに書き、索引と置き換える
    notes: フックは置き換えの前か後のどちらかの内容だけを読む。書き込まなかったときは索引のファイルを 1 バイトも変えない
  - item: チェック
    constraint: インターフェース定義「索引のチェック」と同じ順と内容（フックと同じ読み取り → JSON Schema → ルールの場所の実在）で、書く前と書いた後の索引を確かめる。書いた後にフックが読めないか、書く前に無かった問題が出るときだけ断る
    notes: 問題はエントリのバージョンと理由で照らし合わせる（位置は新規作成・削除でずれるため）。書き換えたエントリの問題は、書く前に同じ理由があっても新しい問題として扱う。もとからある問題は、この書き込みで生じたものではないため書き込みを止めない
  - item: 書式の維持
    constraint: '`ruamel.yaml` の round-trip で読み書きし、対象のエントリ以外の行（コメント・引用符・字下げ・キーの並び）を変えない。新しく書く文字列のリストは 1 行のフロー形式、`args` はブロックのマップ、`read_by` はブロックのリストで書く'
    notes: 設定は PoC の結果（`width` 4096・字下げ mapping 2 / sequence 4 / offset 2・`preserve_quotes`）。フックの読み取りが受け付ける形式だけで書く
  - item: 新規作成の位置
    constraint: '`rules` の末尾。`rules` が無い索引では `rules` を追加する'
  - item: エントリのバージョン
    constraint: インターフェース定義「ルールの一覧」の制約「エントリのバージョン」と同じ求め方
    notes: 一覧を取った後に手で直されたエントリを上書きしない
  - item: 反映
    constraint: 書き込んだ内容は、サーバーを再起動せずに次のツールの呼び出しと次のフックの呼び出しに効く
    notes: 索引をキャッシュしない
  - item: 認可
    constraint: 制限なし
    notes: 書き込める範囲は制約「書き込める索引」で絞る
refs:
