id: IF-122-12
title: "設定の再読込"
entry:
  kind: mcp_tool
  value: reload_settings
flows:
  - name: 正常系
    summary: 設定ファイルを読み直し、読んだ値を返す
    setup:
      - name: Mock
        description: なし（`127.0.0.1` の空いているポートで子プロセスとして立てたサーバーへ、MCP の Python SDK の Streamable HTTP のクライアントで接続し、ツールを呼ぶ）
      - name: 設定ファイル
        description: サーバーを起動した後に、`global.indexes` へ索引を 1 つ書き足し、`global.log_retention_days` を 7 にする
    flow: |-
      sequenceDiagram
        participant C as クライアント
        participant IF as reload_settings
        participant CF as 設定ファイル

        C->>IF: 引数なし
        IF->>CF: 読む
        CF-->>IF: 読めた
        IF-->>C: config_path・indexes・state_dir・保持日数・dev_docs_url
    expected:
      - '`config_path` が `RULE_INJECT_CONFIG` と同じ'
      - '`indexes` に書き足した索引が載り、`log_retention_days` が 7'
      - 設定ファイルが書き換わっていない
    test: test_normal
  - name: 正常系（プロジェクトを指す）
    summary: '`project_dir` を受けると、そのプロジェクトで読む索引を返す'
    setup:
      - name: Mock
        description: 正常系と同じ
      - name: 設定ファイル
        description: '`projects[]` に `match` がテストのプロジェクトに当たる要素があり、その `indexes` に索引が 1 つある'
      - name: 引数
        description: '`project_dir` にテストのプロジェクトの直下'
    flow: |-
      sequenceDiagram
        participant C as クライアント
        participant IF as reload_settings
        participant CF as 設定ファイル

        C->>IF: project_dir
        IF->>CF: 読む
        CF-->>IF: 読めた
        IF-->>C: そのプロジェクトで読む索引
    expected:
      - '`indexes` に、`global.indexes` に続けて `projects[]` の索引が載っている'
    test: test_normal_when_project_given
  - name: 異常系（設定ファイルが読めない・ToolError）
    summary: 読めない設定ファイルは場所と理由をエラーで返し、待ち受けは続ける
    setup:
      - name: Mock
        description: 正常系と同じ
      - name: 設定ファイル
        description: サーバーを起動した後に、`global` に知らないキーを書き足す
    flow: |-
      sequenceDiagram
        participant C as クライアント
        participant IF as reload_settings
        participant CF as 設定ファイル

        C->>IF: 引数なし
        IF->>CF: 読む
        CF-->>IF: 読めない（知らないキー）
        IF-->>C: isError: true（場所と理由）
    expected:
      - '結果が `isError: true` で、設定ファイルの場所と知らないキーの名前が載っている'
      - 続けて呼んだ `get_server_status` が応答する
    test: test_error_when_settings_unreadable
lead: 設定ファイルを読み直し、読めたかと、読んだ値（読む索引・記録フォルダ・保持日数・dev-docs の接続先）を返す。プロセスの中の状態は変えない。
identifier: reload_settings
idempotent: true
side_effects: なし（`readOnlyHint`）。設定ファイルは各ツールの呼び出しのたびに読み直しているため、プロセスの中に持つ値を入れ替えない
request:
  - name: project_dir
    type: str | None
    required: false
    default: なし（`global.indexes`（無ければユーザーの既定の索引）だけを返す）
    location: argument
    description: 読む索引を決めるプロジェクトの直下
    constraints: 絶対パス
    notes: インターフェース定義「ルールの一覧」の `project_dir` と同じ
request_example: |-
  ```json
  {"project_dir": "/home/user/project"}
  ```
response:
  - name: success
    type: bool
    description: 読めたか
  - name: output
    type: str
    description: 設定ファイルの場所と読む索引の数の 1 行
  - name: config_path
    type: str | None
    description: 読んだ設定ファイルの場所
    notes: 既定のパスにファイルが無く読まなかったときは `null`（全てのキーを既定値で返す）
  - name: indexes
    type: list[str]
    description: 読む索引の場所。フックが読む順
  - name: state_dir
    type: str
    description: 既読の記録とログを置く記録フォルダ
  - name: record_retention_days
    type: int
    description: 既読の記録の保持期間（日）
  - name: log_retention_days
    type: int
    description: ログの保持日数
  - name: dev_docs_url
    type: str
    description: '`check_indexes` が問い合わせる dev-docs の接続先'
response_example: |-
  ```json
  {
    "success": true,
    "output": "/home/user/.config/rule-inject/settings.yaml を読みました（索引 2 つ）",
    "config_path": "/home/user/.config/rule-inject/settings.yaml",
    "indexes": ["/home/user/.config/rule-inject/rules.yaml", "/home/user/project/rules.yaml"],
    "state_dir": "/home/user/.local/state/rule-inject",
    "record_retention_days": 30,
    "log_retention_days": 3,
    "dev_docs_url": "http://127.0.0.1:8781/mcp"
  }
  ```
response_notes: '待ち受けのポートは起動したプロセスの環境変数 `RULE_INJECT_PORT` だけから読み、動いているプロセスでは変わらないため返さない（`get_server_status` の `port`）。'
exceptions:
  - name: なし（正常終了）
    condition: 設定ファイルを読めた
  - name: ToolError（設定ファイルが読めない）
    condition: 設定ファイルが読めない・書式に合わない・知らないキーか許す値の外の値を持つ
    notes: インターフェース定義「ルールの一覧」と同じく、設定ファイルの場所と理由を返す
  - name: ToolError（project_dir が絶対パスでない）
    condition: '`project_dir` が絶対パスでない'
    notes: インターフェース定義「ルールの一覧」と同じ
  - name: ToolError（再起動の途中）
    condition: 再起動・更新の再起動を始めた後で、まだ待ち受けを閉じていない
    notes: インターフェース定義「サーバーの再起動」の制約「再起動の途中の呼び出し」
error_format: インターフェース定義「ルールの一覧」と同じ
constraints:
  - item: 読み方
    constraint: フックと他のツールと同じ設定の読み取り（`load_settings`）を、ツールの呼び出しの時点の環境で呼ぶ
  - item: 認可
    constraint: 制限なし
refs:
  - SC-122-2#
test_file: tests/integration/server/test_reload_settings.py
