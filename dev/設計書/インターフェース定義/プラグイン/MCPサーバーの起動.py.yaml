title: "MCPサーバーの起動"
entry:
  kind: operation
  value: '`python -m rule_inject.server`（常駐するプロセスの起動）'
flows:
  - name: 正常系
    summary: 指定したポートの /mcp で待ち受け、read_rules を一覧に出す
    setup:
      - name: Mock
        description: なし（サーバーを子プロセスとして起動し、HTTP の MCP のクライアントでつなぐ）
      - name: ポート
        description: 空いているポートを `RULE_INJECT_PORT` で渡す
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant S as MCPサーバーの起動

        C->>S: 起動する（RULE_INJECT_PORT）
        S->>S: 127.0.0.1 のポートの /mcp で待ち受ける
        C->>S: tools/list
        S-->>C: read_rules
      ```
    expected:
      - '`http://127.0.0.1:{ポート}/mcp` につながり、`tools/list` に `read_rules` が載っている'
      - サーバーが待ち受けるアドレスが `127.0.0.1` だけである
    test: test_normal
  - name: 正常系（停止する）
    summary: 停止の合図でポートを閉じて終える
    setup:
      - name: Mock
        description: なし
      - name: サーバー
        description: 空いているポートで起動し、待ち受けるまで待つ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant S as MCPサーバーの起動

        C->>S: SIGTERM
        S->>S: ポートを閉じる
        S-->>C: 終了コード 0
      ```
    expected:
      - プロセスが終了コード 0 で終わっている
      - そのポートへの接続が拒まれる
    test: test_normal_when_stopped
  - name: 異常系（ポートの値が不正・SystemExit）
    summary: 1〜65535 の整数でないポートでは待ち受けずに終える
    setup:
      - name: Mock
        description: なし
      - name: ポート
        description: '`RULE_INJECT_PORT` に `abc`・`0`・`65536` を渡す'
        notes: パラメータ化して同じテストで確かめる
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant S as MCPサーバーの起動

        C->>S: 起動する（RULE_INJECT_PORT=abc）
        S-->>C: 標準エラー出力に理由<br>終了コード 1
      ```
    expected:
      - 終了コードが 1
      - 標準エラー出力に `RULE_INJECT_PORT`・渡した値・`1〜65535` が載っている
    test: test_error_when_port_invalid
  - name: 異常系（ポートが使われている・SystemExit）
    summary: 他のプロセスが占有しているポートでは待ち受けずに終える
    setup:
      - name: Mock
        description: なし
      - name: ポート
        description: テストが `127.0.0.1` で bind したソケットのポートを `RULE_INJECT_PORT` で渡す
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant S as MCPサーバーの起動

        C->>S: 起動する（使われているポート）
        S->>S: 待ち受ける（失敗）
        S-->>C: 標準エラー出力に理由<br>終了コード 1
      ```
    expected:
      - 終了コードが 1
      - 標準エラー出力にポートの番号と `RULE_INJECT_PORT` が載っている
    test: test_error_when_port_in_use
lead: '`127.0.0.1` のポート（`RULE_INJECT_PORT`、無ければ 8783）の `/mcp` で Streamable HTTP の MCP サーバーを待ち受け、停止の合図で終える。'
identifier: server_main
side_effects: '`127.0.0.1` のポートを占有する'
exclusivity: 同じポートで 2 つ目を起動すると、後から起動した方が「ポートが使われている」で終える
request:
  - name: '`RULE_INJECT_PORT`'
    type: str
    required: false
    default: '8783'
    location: argument
    description: 待ち受けるポート（起動する環境の環境変数）
    constraints: 1〜65535 の整数。前後の空白は許さない
    notes: 空の文字列は未設定と同じく 8783 で待ち受ける。`.mcp.json` の `${RULE_INJECT_PORT:-8783}` と同じ扱い
exceptions:
  - name: なし（正常終了）
    condition: 停止の合図（SIGINT・SIGTERM）を受け、ポートを閉じて終了コード 0 で終える
  - name: SystemExit（ポートの値が不正）
    condition: '`RULE_INJECT_PORT` が 1〜65535 の整数でない'
    notes: 待ち受けずに、環境変数の名前・渡された値・許す範囲を標準エラー出力へ出して終了コード 1 で終える
  - name: SystemExit（ポートが使われている）
    condition: '`127.0.0.1` のそのポートを他のプロセスが占有している'
    notes: ポートの番号と、`RULE_INJECT_PORT` で変えられることを標準エラー出力へ出して終了コード 1 で終える
constraints:
  - item: 待ち受けのアドレス
    constraint: '`127.0.0.1` だけで待ち受ける。変える設定は持たない'
    notes: ツールの引数にセッションの環境変数が載るため、他の端末からつながせない
  - item: パス
    constraint: '`/mcp`'
    notes: '`.mcp.json` の `url` と合わせる'
  - item: 既定のポート
    constraint: '8783'
    notes: knowledge『MCP サーバー作成ルール』の既定のポートの台帳
  - item: 認可
    constraint: 制限なし
  - item: ログ
    constraint: 起動に失敗した理由は標準エラー出力へ出す
    notes: セッションの値が無い時点の失敗のため、ログのファイルには書かない
