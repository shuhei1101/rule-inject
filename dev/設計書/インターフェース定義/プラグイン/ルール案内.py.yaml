lead: 操作の対象のパスかツール名に当たるルールのうち、そのセッションで未読のものを案内する。操作の種別がエントリの `on` に当たるルールがあれば操作を止め、無ければ止めずに案内する。止めない案内は、そのセッションで案内済みのルールを除き、ルールごとに 1 回だけ出す。
idempotent: false
side_effects: 止めない案内に載せたルールの場所を、そのセッションの案内済みの記録へ 1 行ずつ追記する（既読の記録は読むだけ）
request:
  - name: '`session_id`'
    type: str
    required: true
    description: 呼び出し元のセッションの識別子
    constraints: 1〜128 文字の英数字 / `_` / `-`
    notes: 既読の記録のファイル名に使う。形が外れた値は既読なしとして扱う
  - name: '`cwd`'
    type: str
    required: true
    description: セッションの作業フォルダ
    notes: Bash のコマンドの相対パスを解く基準。設定ファイルの `projects` の索引の相対パスは `cwd` ではなく環境変数 `CLAUDE_PROJECT_DIR` から解く
  - name: '`tool_name`'
    type: str
    required: true
    description: 呼ばれるツールの名前
    constraints: '`Read` / `Grep` / `Edit` / `Write` / `NotebookEdit` / `Bash` / `mcp__` で始まる完全名'
    notes: 操作の種別へ読み替える（`Read`・`Grep`・`Bash` の読み取り → `read`、`Edit`・`Write`・`NotebookEdit` → `write`、`mcp__*` → `mcp`）
  - name: '`tool_input.file_path`'
    type: str
    required: false
    default: なし（パスでは照合しない）
    description: 操作の対象のファイルのパス
    notes: Read / Edit / Write のとき届く。まだ無いパスも受ける
  - name: '`tool_input.notebook_path`'
    type: str
    required: false
    default: なし（パスでは照合しない）
    description: 操作の対象のノートブックのパス
    notes: NotebookEdit のとき届く
  - name: '`tool_input.command`'
    type: str
    required: false
    default: なし（パスでは照合しない）
    description: Bash で実行しようとしているコマンド
    notes: 読むコマンド（制約の「読むコマンド」）の引数から、読む対象のパスを取り出す
  - name: '`tool_input.path`'
    type: str
    required: false
    default: なし（パスでは照合しない）
    description: Grep で検索するファイルかフォルダのパス
    notes: Grep のとき届く。ファイルを指すときだけ照合する（フォルダは中のどのファイルを読むかが実行前に決まらないため照合しない）
  - name: tool_input.*
    type: Any
    required: false
    default: なし（引数では照合しない）
    description: MCP のツールの引数
    notes: '`mcp__*` のとき、エントリの `args` と照合する。オブジェクトの子はドットで結んだキーで指す'
request_example: |-
  ```json
  {
    "session_id": "2f9c1b7e-0d54-4b7a-9d4f-5c3a1e2b7f10",
    "cwd": "/home/user/project",
    "hook_event_name": "PreToolUse",
    "tool_name": "Write",
    "tool_input": {"file_path": "/home/user/project/src/app.py", "content": ""}
  }
  ```
response:
  - name: '`hookSpecificOutput.hookEventName`'
    type: Literal['PreToolUse']
    description: フックの種類
    notes: 案内があるときだけ出力する。案内が無いときは標準出力に何も出さない
  - name: '`hookSpecificOutput.permissionDecision`'
    type: Literal['deny']
    description: 操作を止める
    notes: 操作の種別が `on` に当たる未読のルールが 1 件でもあるときだけ載せる
  - name: '`hookSpecificOutput.permissionDecisionReason`'
    type: str
    description: 止める案内。未読のルールの場所と、本文の読み方（Read）と、読んだ後に同じ操作をやり直すこと
    constraints: 10,000 字以内
    notes: '`permissionDecision` を載せたときだけ載せる。止めないルールも同じ案内に並べる'
  - name: '`hookSpecificOutput.additionalContext`'
    type: str
    description: 止めない案内。未読で未案内のルールの場所と読み方。設定ファイルか索引が読めないとき・索引のエントリを読み飛ばしたとき・記録が読めないか書けないときはその場所と理由
    constraints: 10,000 字以内
    notes: 操作を止めないときだけ載せる。「やり直してください」は含めない
response_example: |-
  ```json
  {
    "hookSpecificOutput": {
      "hookEventName": "PreToolUse",
      "permissionDecision": "deny",
      "permissionDecisionReason": "操作の対象に当たる未読のルールがあります。下の場所を Read で読んでから、同じ操作をやり直してください。\n- /home/user/rules/python.md"
    }
  }
  ```
exceptions:
  - name: なし（正常終了）
    condition: 案内の有無に関わらず終了コード 0 で終える
    notes: 終了コード 2 は Claude Code が操作を止める合図になるため使わない
  - name: OSError / 書式の誤り（索引が読めない）
    condition: 索引が無い・読めない・書式に合わない
    notes: フックの中で捕まえ、操作を止めずに `additionalContext` へ索引の場所と理由を載せ、ログへ `read_index` を書いて終了コード 0 で終える。読めた索引のエントリでの案内は続ける
  - name: OSError（既読の記録が読めない）
    condition: 記録ファイルはあるが読めない（権限など）
    notes: 索引が読めないときと揃え、操作を止めずに `additionalContext` へ記録ファイルの場所と理由を載せ、ログへ `read_record` を書く。ファイルが無いときは失敗ではなく既読なしとして扱う
  - name: Exception（想定外の例外）
    condition: 上のどれにも当たらない例外
    notes: 最上位で捕まえ、操作を止めずに `additionalContext` へ「ルールの案内が動かなかったこと」とログの場所を載せ、ログへ `unexpected` を書いて終了コード 0 で終える
  - name: OSError（案内済みの記録が読めない・書けない）
    condition: 案内済みの記録ファイルはあるが読めない、または記録フォルダか記録ファイルに書けない（権限・容量）
    notes: 既読の記録が読めないときと揃え、操作を止めずに案内を出し、`additionalContext` へ記録ファイルの場所と理由を載せ、ログへ `read_record` か `write_record` を書く。読めないときは未案内として扱う。ファイルが無いときは失敗ではなく未案内として扱う
  - name: OSError / 書式の誤り（設定ファイルが読めない）
    condition: '`RULE_INJECT_CONFIG` が指すファイルが無い・読めない・書式に合わない・知らないキーか許す値の外の値を持つ'
    notes: フックの中で捕まえ、設定ファイルを使わず（既定値でも動かさず）索引を読まない。操作を止めずに `additionalContext` へ設定ファイルの場所と理由を載せ、既定のログのフォルダへ `read_settings` を書いて終了コード 0 で終える
constraints:
  - item: タイムアウト
    constraint: 1 秒（`hooks.json` の `timeout`）
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[フックの実行時間]
  - item: 案内文の長さ
    constraint: 10,000 字。超えるときは止めるルールを先に並べ、収まるところまで場所を載せて残りの件数を添える
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[フックの案内文の長さ]
  - item: 索引
    constraint: '読む索引は、設定ファイルの `global.indexes`（キーが無いときはユーザーの既定の置き場所 `${XDG_CONFIG_HOME:-~/.config}/rule-inject/rules.yaml`）の後ろに、当たった `projects` の要素の `indexes` を並びの順に足したもの（当たった要素のどれも `indexes` を持たないときはプロジェクトの既定の置き場所 `${CLAUDE_PROJECT_DIR}/rules.yaml`）。全てのエントリを合わせて当てる。既定の置き場所のファイルが無いとき・`CLAUDE_PROJECT_DIR` が無いときは理由を載せずに読まない。`indexes` が空の並び `[]` のときは、その既定の置き場所も読まない'
    notes: 書式は設定の設計書。標準ライブラリだけで読む。`projects` の中の索引の相対パスは環境変数 `CLAUDE_PROJECT_DIR` から解く。空の並びを既定の置き場所と別に扱うのは、既定の置き場所に別の用途の `rules.yaml` があるときに読ませない手段を残すため
  - item: ルールのまとめ方
    constraint: 同じルールの場所（解決後の絶対パス）に当たったエントリは 1 件にまとめ、どれか 1 つでも止めるなら止める
  - item: 読むコマンド
    constraint: '`cat` / `head` / `tail` / `less` / `more` / `grep` / `rg` / `sed` / `awk` / `wc` / `bat`。`&&` / `||` / `;` / `|` と引用符の外の改行（直前に `\` がある行継続は除く）で区切った各コマンドの、`-` で始まらない引数をパスとして扱う。引用符の外に `*` / `?` / `[` を含む引数は、その時点の基準のフォルダから glob として展開し、当たったファイルを名前の順に扱う。`for {変数} in {語の並び}; do … done` の `do` から `done` までの読むコマンドが `$変数` / `${変数}` を引数に取るときは、語の並び（glob は同じく展開する）をパスとして扱う'
    notes: 引数がパターンのコマンド（`grep` の最初の引数など）もパスとして照合する。実在しないパスは捨てる。引用符の中の glob は展開しない
  - item: 認可
    constraint: 制限なし
  - item: ログ
    constraint: 失敗したときだけ ER 図「ログ」の形で 1 行書く。標準出力には JSON 以外を出さない
    notes: ログに書けないときは同じ 1 行を標準エラー出力へ出す
  - item: ルールの場所の変数参照
    constraint: エントリの `rule` の `!{名前}`（名前は `[A-Za-z_][A-Za-z0-9_]*`）をフックが受け取った環境変数の値に置き換えてから場所を解く。空の値は空文字に置き換える。未設定の名前が残ったエントリは読み飛ばし、索引が読めないときと同じく `additionalContext` へ索引の場所・エントリの `rule`・展開できない名前を載せ、ログへ `read_index` を書く
  - item: 案内済みの記録
    constraint: 止めない案内（`additionalContext`）に載せたルールの場所を `{state_dir}/{session_id}.guided.txt` に 1 行ずつ追記し、次からはその場所を止めない案内に載せない。止める案内（`permissionDecisionReason`）に並べた場所は記録しない
    notes: 書式は ER 図「既読の記録」の案内済みの記録。止める案内は読むまで毎回出す。案内文の長さに収まらず載せなかった場所は記録しない
  - item: 引数の照合
    constraint: '`tools` に当たったエントリのうち `args` を持つものは、書いた全てのキーの値がどれかのパターンに当たるときだけ当てる。キーが引数に無いとき・値がオブジェクトのときは当てない。値が配列のとき、およびドット区切りのキーの途中が配列のときは要素ごとにたどり、どれか 1 つが当たれば当てる。文字列以外のスカラーは JSON の表記（`true`・`null`・`1.5`）で文字列にして照合する'
    notes: '`args` は MCP のツールの呼び出しにだけ当てる'
  - item: パターンの正規表現
    constraint: '`paths`・`exclude`・`tools`・`args` のパターンのうち `re:` で始まるものは、残りを正規表現として部分一致（`re.search`）で照合する。それ以外は glob のまま照合する。正規表現は索引を読むときにコンパイルし、コンパイルできないパターンを持つエントリは読み飛ばし、索引が読めないときと同じく `additionalContext` へ索引の場所・パターン・理由を載せ、ログへ `read_index` を書く'
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[フックの実行時間]
    notes: 読み飛ばしは、そのエントリだけに及ぶ
  - item: URL のルール
    constraint: 変数参照を置き換えた後の `rule` が `http://` か `https://` で始まるエントリは読み飛ばし、索引が読めないときと同じく `additionalContext` へ索引の場所・エントリの `rule`・Read で読めない旨を載せ、ログへ `read_index` を書く
    notes: 読み飛ばしは、そのエントリだけに及ぶ
  - item: 既読の判定
    constraint: そのセッションの既読の記録に、ルールの場所と今のルールのファイルの中身の SHA-256 の組み合わせがあるときだけ既読として扱う。ハッシュが違う行・ハッシュを持たない行だけの場所と、ファイルを読めず今のハッシュを取れないルールは未読として扱う
    notes: ハッシュの取り方は既読の記録の制約「本文のハッシュ」と同じ。今のハッシュは当たったルールの分だけ取る。記録ファイルは書き換えず、読み直したときに既読の記録が新しいハッシュの行を追記する
  - item: 設定ファイル
    constraint: 環境変数 `RULE_INJECT_CONFIG` の値（先頭の `~` はホームに展開）の YAML を読む。`RULE_INJECT_CONFIG` が無いときは読まず、設定ファイルのキーを全て既定値で扱う。`projects` の要素は `match` で当て、当たった要素を並びの順に `global` へ重ねる。`CLAUDE_PROJECT_DIR` が無いときはどの要素にも当てない
    notes: キー・既定値・許す値・`match` の当て方は設定の設計書。標準ライブラリだけで読む
