title: "ルール案内"
entry:
  kind: trigger
  value: '`PreToolUse` フック（matcher `Read|Grep|Edit|Write|NotebookEdit|Bash|mcp__.*`、timeout 1 秒）'
flows:
  - name: 正常系（止めて案内する）
    summary: 書く操作が必須の未読のルールで Write を止める
    setup:
      - name: Mock
        description: なし（フックを子プロセスとして起動し、標準入力へ JSON を渡す）
      - name: 索引
        description: '`paths: ["**/*.py"]`・`on: [write]` のエントリを 1 つ持つ一時ファイル'
        notes: '`RULE_INJECT_CONFIG` で指した設定ファイルの `global.indexes` で指す'
      - name: 既読の記録
        description: 空の一時フォルダ
        notes: '同じ設定ファイルの `global.state_dir` で指す'
      - name: 入力
        description: '`tool_name: Write`、`tool_input.file_path` は `.py` のパス'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant IDX as 索引
        participant ST as 既読の記録

        CC->>H: 標準入力（Write・対象のパス）
        H->>IDX: 読む
        H->>H: 対象のパスに当たるエントリを選ぶ
        H->>ST: そのセッションの既読を読む
        H-->>CC: permissionDecision: deny + 案内<br>終了コード 0
      ```
    expected:
      - '`permissionDecision` が `deny`'
      - '`permissionDecisionReason` にルールの場所と、Read で読んでから同じ操作をやり直す旨が載っている'
      - 終了コードが `0`
    test: test_normal_when_blocked
  - name: 正常系（既読のため案内しない）
    summary: 当たるルールが既読なら何も出さない
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: 止めて案内するフローと同じ
      - name: 既読の記録
        description: そのセッションの記録に、ルールの場所と今のルールのファイルの SHA-256 の行がある
      - name: 入力
        description: 止めて案内するフローと同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant IDX as 索引
        participant ST as 既読の記録

        CC->>H: 標準入力（Write・対象のパス）
        H->>IDX: 読む
        H->>ST: 既読を読む
        H->>H: ルールの今のハッシュを取り、記録のハッシュと比べる（同じため既読）
        H-->>CC: 標準出力なし<br>終了コード 0
      ```
    expected:
      - 標準出力が空
      - 終了コードが `0`
    test: test_normal_when_already_read
  - name: 正常系（止めずに案内する）
    summary: 操作の種別が `on` に当たらない未読のルールは止めずに案内する
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: '`paths: ["**/*.py"]`・`on: [write]` のエントリを 1 つ持つ'
      - name: 既読の記録
        description: 空
      - name: 入力
        description: '`tool_name: Read`、`tool_input.file_path` は `.py` のパス'
        notes: 読む操作は `on` に無い
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant IDX as 索引
        participant ST as 既読の記録
        participant GD as 案内済みの記録

        CC->>H: 標準入力（Read・対象のパス）
        H->>IDX: 読む
        H->>ST: 既読を読む（未読）
        H->>GD: 案内済みを読む（未案内）
        H->>GD: ルールの場所を追記する
        H-->>CC: additionalContext（案内）<br>終了コード 0
      ```
    expected:
      - '`permissionDecision` が無い'
      - '`additionalContext` にルールの場所が載り、「やり直してください」を含まない'
      - 案内済みの記録にルールの場所が 1 行ある
      - 終了コードが `0`
    test: test_normal_when_not_blocked
  - name: 正常系（Bashで読む対象に当たる）
    summary: 読むコマンドの引数から取り出したパスで照合して止める
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: '`paths: ["**/*.py"]`・`on: [read]` のエントリを 1 つ持つ'
      - name: 既読の記録
        description: 空
      - name: 入力
        description: '`tool_name: Bash`、`tool_input.command` は `cd src && cat app.py | head -n 5`'
        notes: 実在する `.py` を `cwd` の下に置く
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant IDX as 索引
        participant ST as 既読の記録

        CC->>H: 標準入力（Bash・コマンド）
        H->>H: 読むコマンドの引数からパスを取り出す
        H->>IDX: 読む
        H->>ST: 既読を読む（未読）
        H-->>CC: permissionDecision: deny + 案内<br>終了コード 0
      ```
    expected:
      - '`permissionDecision` が `deny`'
      - '`permissionDecisionReason` にルールの場所が載っている'
    test: test_normal_when_read_by_bash
  - name: 正常系（MCPのツールに当たる）
    summary: '`tools` の glob に当たる MCP のツールの呼び出しを止める'
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: '`tools: ["mcp__*__create_*"]` のエントリを 1 つ持ち、`on` を書かない（`default_on` の既定で `mcp` を含む）'
      - name: 既読の記録
        description: 空
      - name: 入力
        description: '`tool_name: mcp__github__create_issue`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant IDX as 索引
        participant ST as 既読の記録

        CC->>H: 標準入力（MCP のツール名）
        H->>IDX: 読む
        H->>H: ツール名に当たるエントリを選ぶ
        H->>ST: 既読を読む（未読）
        H-->>CC: permissionDecision: deny + 案内<br>終了コード 0
      ```
    expected:
      - '`permissionDecision` が `deny`'
      - '`permissionDecisionReason` にルールの場所が載っている'
    test: test_normal_when_mcp_tool
  - name: 正常系（同じルールに複数のエントリが当たる）
    summary: 同じルールのエントリ 2 つを 1 件にまとめ、どちらかが止めるなら止める
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: '同じルールを指す 2 つのエントリ（`on: [read]` と `on: [write]`、どちらも `**/*.py` に当たる）'
        notes: 片方は絶対パス、片方は索引からの相対パスで同じファイルを指す
      - name: 既読の記録
        description: 空
      - name: 入力
        description: '`tool_name: Write`、`.py` のパス'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant IDX as 索引

        CC->>H: 標準入力（Write・対象のパス）
        H->>IDX: 読む
        H->>H: 当たった 2 エントリをルールの場所ごとに 1 件にまとめる
        H-->>CC: permissionDecision: deny + 案内（場所 1 件）<br>終了コード 0
      ```
    expected:
      - '`permissionDecision` が `deny`'
      - '`permissionDecisionReason` にルールの場所が 1 回だけ載っている'
    test: test_normal_when_duplicate_entries
  - name: 正常系（外すパスに当たる）
    summary: '`exclude` に当たるパスには案内しない'
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: '`paths: ["**/*.py"]`・`exclude: ["**/tests/**"]` のエントリを 1 つ持つ'
      - name: 既読の記録
        description: 空
      - name: 入力
        description: '`tool_name: Write`、`tests/` の下の `.py` のパス'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant IDX as 索引

        CC->>H: 標準入力（Write・tests の下のパス）
        H->>IDX: 読む
        H->>H: exclude に当たるためエントリを外す
        H-->>CC: 標準出力なし<br>終了コード 0
      ```
    expected:
      - 標準出力が空
      - 終了コードが `0`
    test: test_normal_when_excluded
  - name: 正常系（案内が長い）
    summary: 案内が 10,000 字を超えるとき、収まる分だけ載せて残りの件数を添える
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: '`**/*.py` に当たるエントリ 100 件（場所のパスは 1 件 150 字前後、半数は `on: [write]`、半数は `on: [read]`）'
      - name: 既読の記録
        description: 空
      - name: 入力
        description: '`tool_name: Write`、`.py` のパス'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant IDX as 索引

        CC->>H: 標準入力（Write・対象のパス）
        H->>IDX: 読む（100 件当たる）
        H->>H: 止めるルールを先に並べ、<br>10,000 字に収まる分と残りの件数を書く
        H-->>CC: permissionDecision: deny + 案内<br>終了コード 0
      ```
    expected:
      - '`permissionDecisionReason` が 10,000 字以内'
      - 止めるルールが止めないルールより前に並んでいる
      - 載せきれなかったルールの件数が末尾に載っている
    test: test_normal_when_guidance_too_long
  - name: 異常系（索引が読めない・止めずに理由を載せる）
    summary: 索引が無いか書式に合わないとき、操作を止めずに理由を載せる
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: '設定ファイルの `global.indexes` が実在しないパスと、書式に合わないファイルの 2 つを指す'
      - name: 入力
        description: '`tool_name: Write`、`.py` のパス'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant IDX as 索引

        CC->>H: 標準入力（Write・対象のパス）
        H->>IDX: 読む（読めない）
        H-->>CC: additionalContext（読めなかった索引の場所と理由）<br>終了コード 0
      ```
    expected:
      - '`permissionDecision` が無い'
      - '`additionalContext` に 2 つの索引の場所と理由が載っている'
      - 終了コードが `0`
    test: test_error_when_index_unreadable
  - name: 異常系（既読の記録が読めない・止めずに理由を載せる）
    summary: 記録ファイルが読めないとき、操作を止めずに理由を載せ、ログに書く
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: '`paths: ["**/*.py"]`・`on: [write]` のエントリを 1 つ持つ'
      - name: 既読の記録
        description: そのセッションの記録ファイルを読み取り権限なし（`chmod 000`）で置く
      - name: 入力
        description: '`tool_name: Write`、`.py` のパス'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant ST as 既読の記録
        participant LOG as ログ

        CC->>H: 標準入力（Write・対象のパス）
        H->>ST: 読む（読めない）
        H->>LOG: read_record を追記する
        H-->>CC: additionalContext（記録ファイルの場所と理由）<br>終了コード 0
      ```
    expected:
      - '`permissionDecision` が無い'
      - '`additionalContext` に記録ファイルの場所と理由が載っている'
      - 'ログに `operation: read_record` の行が 1 行ある'
      - 終了コードが `0`
    test: test_error_when_record_unreadable
  - name: 正常系（Grepで読む対象に当たる）
    summary: 組み込みの Grep が指すファイルで照合して止める
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: '`paths: ["**/*.py"]`・`on: [read]` のエントリを 1 つ持つ'
      - name: 既読の記録
        description: 空
      - name: 入力
        description: '`tool_name: Grep`、`tool_input.path` は実在する `.py` のファイル'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant IDX as 索引
        participant ST as 既読の記録

        CC->>H: 標準入力（Grep・ファイルのパス）
        H->>IDX: 読む
        H->>ST: 既読を読む（未読）
        H-->>CC: permissionDecision: deny + 案内<br>終了コード 0
      ```
    expected:
      - '`permissionDecision` が `deny`'
      - '`permissionDecisionReason` にルールの場所が載っている'
    test: test_normal_when_read_by_grep
  - name: 正常系（案内済みのため案内しない）
    summary: 止めない案内に当たるルールが案内済みなら何も出さない
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: 止めずに案内するフローと同じ
      - name: 既読の記録
        description: 空
      - name: 案内済みの記録
        description: そのセッションの案内済みの記録にルールの場所がある
      - name: 入力
        description: 止めずに案内するフローと同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant ST as 既読の記録
        participant GD as 案内済みの記録

        CC->>H: 標準入力（Read・対象のパス）
        H->>ST: 既読を読む（未読）
        H->>GD: 案内済みを読む（案内済み）
        H-->>CC: 標準出力なし<br>終了コード 0
      ```
    expected:
      - 標準出力が空
      - 案内済みの記録の行が増えていない
      - 終了コードが `0`
    test: test_normal_when_already_guided
  - name: 正常系（止める案内は案内済みにしない）
    summary: 止める案内に並べたルールは案内済みにせず、次も止める
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: 止めて案内するフローと同じ
      - name: 既読の記録
        description: 空
      - name: 入力
        description: 止めて案内するフローと同じ入力を 2 回続けて渡す
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant GD as 案内済みの記録

        CC->>H: 標準入力（Write・対象のパス）
        H-->>CC: permissionDecision: deny + 案内
        CC->>H: 標準入力（同じ入力）
        H-->>CC: permissionDecision: deny + 案内
      ```
    expected:
      - 2 回とも `permissionDecision` が `deny`
      - 案内済みの記録ファイルが無い
    test: test_normal_when_blocked_twice
  - name: 正常系（既定の置き場所の索引）
    summary: 設定ファイルが無いとき、既定の置き場所の索引で案内する
    setup:
      - name: Mock
        description: なし
        notes: '-'
      - name: 索引
        description: 止めて案内するフローと同じエントリを、`CLAUDE_PROJECT_DIR` の直下の `rules.yaml` に置く
        notes: '`RULE_INJECT_CONFIG` を渡さない。`XDG_CONFIG_HOME` は索引の無い空の一時フォルダを指す'
      - name: 既読の記録
        description: 空
        notes: '-'
      - name: 入力
        description: 止めて案内するフローと同じ
        notes: '-'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant IDX as 既定の置き場所の索引

        CC->>H: 標準入力（Write・対象のパス）
        H->>H: 設定ファイルが無いため既定の置き場所を索引にする
        H->>IDX: 読む（ユーザーの既定は無いため読まない）
        H-->>CC: permissionDecision: deny + 案内<br>終了コード 0
      ```
    expected:
      - '`permissionDecision` が `deny`'
      - '`permissionDecisionReason` にルールの場所が載り、索引が読めなかった知らせが載っていない'
      - ログのファイルが無い
    test: test_normal_when_default_index
  - name: 正常系（索引の並びが空）
    summary: 当たった `projects` の要素の `indexes` を空の並びにしたとき、プロジェクトの既定の置き場所の索引を読まない
    setup:
      - name: Mock
        description: なし
        notes: '-'
      - name: 索引
        description: 既定の置き場所のフローと同じ `rules.yaml` を置く
        notes: '設定ファイルの `projects` に、`CLAUDE_PROJECT_DIR` のフォルダ名を `match` に持ち `indexes: []` の要素を置く'
      - name: 入力
        description: 止めて案内するフローと同じ
        notes: '-'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内

        CC->>H: 標準入力（Write・対象のパス）
        H->>H: 空の並びのため既定の置き場所を読まない
        H-->>CC: 標準出力なし<br>終了コード 0
      ```
    expected:
      - 標準出力が空
      - 終了コードが `0`
    test: test_normal_when_indexes_empty
  - name: 正常系（ルールの場所に変数参照がある）
    summary: '`rule` の `!{名前}` を環境変数で展開した場所で案内する'
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: '`rule: "!{RULES_DIR}/python.md"`・`paths: ["**/*.py"]`・`on: [write]` のエントリを 1 つ持つ'
        notes: 環境変数 `RULES_DIR` にルールのフォルダを渡す
      - name: 既読の記録
        description: 空
      - name: 入力
        description: 止めて案内するフローと同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant IDX as 索引

        CC->>H: 標準入力（Write・対象のパス）
        H->>IDX: 読む
        H->>H: rule の変数参照を展開して場所を解く
        H-->>CC: permissionDecision: deny + 案内<br>終了コード 0
      ```
    expected:
      - '`permissionDecision` が `deny`'
      - '`permissionDecisionReason` に展開したルールの場所（`{RULES_DIR の値}/python.md`）が載り、`!{RULES_DIR}` が載っていない'
    test: test_normal_when_rule_has_variable
  - name: 異常系（ルールの場所の変数参照を展開できない・止めずに理由を載せる）
    summary: 未設定の名前が残ったエントリを読み飛ばし、理由を載せる
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: '`rule: "!{UNSET_DIR}/python.md"`・`on: [write]` のエントリと、`paths: ["**/*.py"]`・`on: [read]` の通常のエントリを 1 つずつ持つ'
        notes: '`UNSET_DIR` を渡さない。通常のエントリは入力のパスに当て、読み飛ばしの後もその案内が出ることを見る'
      - name: 入力
        description: '`tool_name: Write`、`.py` のパス'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant IDX as 索引
        participant LOG as ログ

        CC->>H: 標準入力（Write・対象のパス）
        H->>IDX: 読む
        H->>H: 展開できない名前が残ったエントリを読み飛ばす
        H->>LOG: read_index を追記する
        H-->>CC: additionalContext（索引の場所・rule・展開できない名前）<br>終了コード 0
      ```
    expected:
      - '`permissionDecision` が無い'
      - '`additionalContext` に索引の場所・エントリの `rule`・`UNSET_DIR` が載っている'
      - '`additionalContext` に通常のエントリのルールの場所が載っている'
      - 'ログに `operation: read_index` の行が 1 行ある'
      - 終了コードが `0`
    test: test_error_when_rule_variable_unset
  - name: 異常系（案内済みの記録に書けない・止めずに理由を載せる）
