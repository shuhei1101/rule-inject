title: "ルール案内"
entry:
  kind: trigger
  value: '`PreToolUse` フック（matcher `Read|Edit|Write|NotebookEdit|Bash|mcp__.*`、timeout 1 秒）'
flows:
  - name: 正常系（止めて案内する）
    summary: 書く操作が必須の未読のルールで Write を止める
    setup:
      - name: Mock
        description: なし（フックを子プロセスとして起動し、標準入力へ JSON を渡す）
      - name: 索引
        description: '`paths: ["**/*.py"]`・`on: [write]` のエントリを 1 つ持つ一時ファイル'
        notes: '`RULE_INJECT_INDEXES_PROJECT` で指す'
      - name: 既読の記録
        description: 空の一時フォルダ
        notes: '`RULE_INJECT_STATE_DIR` で指す'
      - name: 入力
        description: '`tool_name: Write`、`tool_input.file_path` は `.py` のパス'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant IDX as 索引
        participant ST as 既読の記録

        CC->>H: 標準入力（Write・対象のパス）
        H->>IDX: 読む
        H->>H: 対象のパスに当たるエントリを選ぶ
        H->>ST: そのセッションの既読を読む
        H-->>CC: permissionDecision: deny + 案内<br>終了コード 0
      ```
    expected:
      - '`permissionDecision` が `deny`'
      - '`permissionDecisionReason` にルールの場所と `read_rules` が載っている'
      - 終了コードが `0`
    test: test_normal_when_blocked
  - name: 正常系（既読のため案内しない）
    summary: 当たるルールが既読なら何も出さない
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: 止めて案内するフローと同じ
      - name: 既読の記録
        description: そのセッションの記録にルールの場所がある
      - name: 入力
        description: 止めて案内するフローと同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant IDX as 索引
        participant ST as 既読の記録

        CC->>H: 標準入力（Write・対象のパス）
        H->>IDX: 読む
        H->>ST: 既読を読む（既読）
        H-->>CC: 標準出力なし<br>終了コード 0
      ```
    expected:
      - 標準出力が空
      - 終了コードが `0`
    test: test_normal_when_already_read
  - name: 正常系（止めずに案内する）
    summary: 操作の種別が `on` に当たらない未読のルールは止めずに案内する
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: '`paths: ["**/*.py"]`・`on: [write]` のエントリを 1 つ持つ'
      - name: 既読の記録
        description: 空
      - name: 入力
        description: '`tool_name: Read`、`tool_input.file_path` は `.py` のパス'
        notes: 読む操作は `on` に無い
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant IDX as 索引
        participant ST as 既読の記録

        CC->>H: 標準入力（Read・対象のパス）
        H->>IDX: 読む
        H->>ST: 既読を読む（未読）
        H-->>CC: additionalContext（案内）<br>終了コード 0
      ```
    expected:
      - '`permissionDecision` が無い'
      - '`additionalContext` にルールの場所が載り、「やり直してください」を含まない'
      - 終了コードが `0`
    test: test_normal_when_not_blocked
  - name: 正常系（Bashで読む対象に当たる）
    summary: 読むコマンドの引数から取り出したパスで照合して止める
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: '`paths: ["**/*.py"]`・`on: [read]` のエントリを 1 つ持つ'
      - name: 既読の記録
        description: 空
      - name: 入力
        description: '`tool_name: Bash`、`tool_input.command` は `cd src && cat app.py | head -n 5`'
        notes: 実在する `.py` を `cwd` の下に置く
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant IDX as 索引
        participant ST as 既読の記録

        CC->>H: 標準入力（Bash・コマンド）
        H->>H: 読むコマンドの引数からパスを取り出す
        H->>IDX: 読む
        H->>ST: 既読を読む（未読）
        H-->>CC: permissionDecision: deny + 案内<br>終了コード 0
      ```
    expected:
      - '`permissionDecision` が `deny`'
      - '`permissionDecisionReason` にルールの場所が載っている'
    test: test_normal_when_read_by_bash
  - name: 正常系（MCPのツールに当たる）
    summary: '`tools` の glob に当たる MCP のツールの呼び出しを止める'
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: '`tools: ["mcp__*__create_*"]` のエントリを 1 つ持ち、`on` を書かない（`default_on` の既定で `mcp` を含む）'
      - name: 既読の記録
        description: 空
      - name: 入力
        description: '`tool_name: mcp__github__create_issue`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant IDX as 索引
        participant ST as 既読の記録

        CC->>H: 標準入力（MCP のツール名）
        H->>IDX: 読む
        H->>H: ツール名に当たるエントリを選ぶ
        H->>ST: 既読を読む（未読）
        H-->>CC: permissionDecision: deny + 案内<br>終了コード 0
      ```
    expected:
      - '`permissionDecision` が `deny`'
      - '`permissionDecisionReason` にルールの場所が載っている'
    test: test_normal_when_mcp_tool
  - name: 正常系（同じルールに複数のエントリが当たる）
    summary: 同じルールのエントリ 2 つを 1 件にまとめ、どちらかが止めるなら止める
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: '同じルールを指す 2 つのエントリ（`on: [read]` と `on: [write]`、どちらも `**/*.py` に当たる）'
        notes: 片方は絶対パス、片方は索引からの相対パスで同じファイルを指す
      - name: 既読の記録
        description: 空
      - name: 入力
        description: '`tool_name: Write`、`.py` のパス'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant IDX as 索引

        CC->>H: 標準入力（Write・対象のパス）
        H->>IDX: 読む
        H->>H: 当たった 2 エントリをルールの場所ごとに 1 件にまとめる
        H-->>CC: permissionDecision: deny + 案内（場所 1 件）<br>終了コード 0
      ```
    expected:
      - '`permissionDecision` が `deny`'
      - '`permissionDecisionReason` にルールの場所が 1 回だけ載っている'
    test: test_normal_when_duplicate_entries
  - name: 正常系（外すパスに当たる）
    summary: '`exclude` に当たるパスには案内しない'
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: '`paths: ["**/*.py"]`・`exclude: ["**/tests/**"]` のエントリを 1 つ持つ'
      - name: 既読の記録
        description: 空
      - name: 入力
        description: '`tool_name: Write`、`tests/` の下の `.py` のパス'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant IDX as 索引

        CC->>H: 標準入力（Write・tests の下のパス）
        H->>IDX: 読む
        H->>H: exclude に当たるためエントリを外す
        H-->>CC: 標準出力なし<br>終了コード 0
      ```
    expected:
      - 標準出力が空
      - 終了コードが `0`
    test: test_normal_when_excluded
  - name: 正常系（案内が長い）
    summary: 案内が 10,000 字を超えるとき、収まる分だけ載せて残りの件数を添える
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: '`**/*.py` に当たるエントリ 100 件（場所のパスは 1 件 150 字前後、半数は `on: [write]`、半数は `on: [read]`）'
      - name: 既読の記録
        description: 空
      - name: 入力
        description: '`tool_name: Write`、`.py` のパス'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant IDX as 索引

        CC->>H: 標準入力（Write・対象のパス）
        H->>IDX: 読む（100 件当たる）
        H->>H: 止めるルールを先に並べ、<br>10,000 字に収まる分と残りの件数を書く
        H-->>CC: permissionDecision: deny + 案内<br>終了コード 0
      ```
    expected:
      - '`permissionDecisionReason` が 10,000 字以内'
      - 止めるルールが止めないルールより前に並んでいる
      - 載せきれなかったルールの件数が末尾に載っている
    test: test_normal_when_guidance_too_long
  - name: 正常系（本文を取得するツール）
    summary: このプラグインの MCP のツールには、当たるエントリがあっても案内しない
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: '`tools: ["mcp__*"]` のエントリを 1 つ持つ'
      - name: 既読の記録
        description: 空
      - name: 入力
        description: '`tool_name: mcp__plugin_rule-inject_rule-inject__read_rules`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内

        CC->>H: 標準入力（read_rules）
        H->>H: 対象外のツールとして照合しない
        H-->>CC: 標準出力なし<br>終了コード 0
      ```
    expected:
      - 標準出力が空
      - 終了コードが `0`
    test: test_normal_when_own_tool
  - name: 異常系（索引が読めない・止めずに理由を載せる）
    summary: 索引が無いか書式に合わないとき、操作を止めずに理由を載せる
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: '`RULE_INJECT_INDEXES_PROJECT` が実在しないパスと、書式に合わないファイルの 2 つを指す'
      - name: 入力
        description: '`tool_name: Write`、`.py` のパス'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as ルール案内
        participant IDX as 索引

        CC->>H: 標準入力（Write・対象のパス）
        H->>IDX: 読む（読めない）
        H-->>CC: additionalContext（読めなかった索引の場所と理由）<br>終了コード 0
      ```
    expected:
      - '`permissionDecision` が無い'
      - '`additionalContext` に 2 つの索引の場所と理由が載っている'
      - 終了コードが `0`
    test: test_error_when_index_unreadable
lead: 操作の対象のパスかツール名に当たるルールのうち、そのセッションで未読のものを案内する。操作の種別がエントリの `on` に当たるルールがあれば操作を止め、無ければ止めずに案内する。
idempotent: true
side_effects: なし（既読の記録は読むだけ）
request:
  - name: '`session_id`'
    type: str
    required: true
    description: 呼び出し元のセッションの識別子
    constraints: 1〜128 文字の英数字 / `_` / `-`
    notes: 既読の記録のファイル名に使う。形が外れた値は既読なしとして扱う
  - name: '`cwd`'
    type: str
    required: true
    description: セッションの作業フォルダ
    notes: Bash のコマンドの相対パスを解く基準。プロジェクトの索引の相対パスは `cwd` ではなく環境変数 `CLAUDE_PROJECT_DIR` から解く
  - name: '`tool_name`'
    type: str
    required: true
    description: 呼ばれるツールの名前
    constraints: '`Read` / `Edit` / `Write` / `NotebookEdit` / `Bash` / `mcp__` で始まる完全名'
    notes: 操作の種別へ読み替える（`Read`・`Bash` の読み取り → `read`、`Edit`・`Write`・`NotebookEdit` → `write`、`mcp__*` → `mcp`）
  - name: '`tool_input.file_path`'
    type: str
    required: false
    default: なし（パスでは照合しない）
    description: 操作の対象のファイルのパス
    notes: Read / Edit / Write のとき届く。まだ無いパスも受ける
  - name: '`tool_input.notebook_path`'
    type: str
    required: false
    default: なし（パスでは照合しない）
    description: 操作の対象のノートブックのパス
    notes: NotebookEdit のとき届く
  - name: '`tool_input.command`'
    type: str
    required: false
    default: なし（パスでは照合しない）
    description: Bash で実行しようとしているコマンド
    notes: 読むコマンド（制約の「読むコマンド」）の引数から、読む対象のパスを取り出す
request_example: |-
  ```json
  {
    "session_id": "2f9c1b7e-0d54-4b7a-9d4f-5c3a1e2b7f10",
    "cwd": "/home/user/project",
    "hook_event_name": "PreToolUse",
    "tool_name": "Write",
    "tool_input": {"file_path": "/home/user/project/src/app.py", "content": ""}
  }
  ```
response:
  - name: '`hookSpecificOutput.hookEventName`'
    type: Literal['PreToolUse']
    description: フックの種類
    notes: 案内があるときだけ出力する。案内が無いときは標準出力に何も出さない
  - name: '`hookSpecificOutput.permissionDecision`'
    type: Literal['deny']
    description: 操作を止める
    notes: 操作の種別が `on` に当たる未読のルールが 1 件でもあるときだけ載せる
  - name: '`hookSpecificOutput.permissionDecisionReason`'
    type: str
    description: 止める案内。未読のルールの場所と、本文の読み方（MCP のツール `read_rules`）と、読んだ後に同じ操作をやり直すこと
    constraints: 10,000 字以内
    notes: '`permissionDecision` を載せたときだけ載せる。止めないルールも同じ案内に並べる'
  - name: '`hookSpecificOutput.additionalContext`'
    type: str
    description: 止めない案内。未読のルールの場所と読み方。索引が読めないときはその索引の場所と理由
    constraints: 10,000 字以内
    notes: 操作を止めないときだけ載せる。「やり直してください」は含めない
response_example: |-
  ```json
  {
    "hookSpecificOutput": {
      "hookEventName": "PreToolUse",
      "permissionDecision": "deny",
      "permissionDecisionReason": "操作の対象に当たる未読のルールがあります。read_rules で本文を取得してから、同じ操作をやり直してください。\n- /home/user/rules/python.md"
    }
  }
  ```
exceptions:
  - name: なし（正常終了）
    condition: 索引が読めないときも含め、終了コード 0 で終える
    notes: 終了コード 2 は Claude Code が操作を止める合図になるため使わない
constraints:
  - item: タイムアウト
    constraint: 1 秒（`hooks.json` の `timeout`）
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[フックの実行時間]
  - item: 案内文の長さ
    constraint: 10,000 字。超えるときは止めるルールを先に並べ、収まるところまで場所を載せて残りの件数を添える
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[フックの案内文の長さ]
  - item: 索引
    constraint: 環境変数 `RULE_INJECT_INDEXES_USER` / `RULE_INJECT_INDEXES_PROJECT` のカンマ区切りのパスを順に読み、全てのエントリを合わせて当てる
    notes: 書式は設定の設計書。標準ライブラリだけで読む。プロジェクトの索引の相対パスは環境変数 `CLAUDE_PROJECT_DIR` から解く
  - item: ルールのまとめ方
    constraint: 同じルールの場所（解決後の絶対パスか URL）に当たったエントリは 1 件にまとめ、どれか 1 つでも止めるなら止める
  - item: 読むコマンド
    constraint: '`cat` / `head` / `tail` / `less` / `more` / `grep` / `rg` / `sed` / `awk` / `wc` / `bat`。`&&` / `||` / `;` / `|` で区切った各コマンドの、`-` で始まらない引数をパスとして扱う'
    notes: 引数がパターンのコマンド（`grep` の最初の引数など）もパスとして照合する。実在しないパスは捨てる
  - item: 対象外のツール
    constraint: このプラグインの MCP のツール（`mcp__plugin_rule-inject_rule-inject__*`）には案内しない
    notes: ルールを読むためのツールが止められて読めなくなるのを防ぐ
  - item: 認可
    constraint: 制限なし
