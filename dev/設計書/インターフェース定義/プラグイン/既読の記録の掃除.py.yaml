title: "既読の記録の掃除"
entry:
  kind: trigger
  value: '`SessionStart` フック（timeout 1 秒）'
flows:
  - name: 正常系
    summary: 保持期間を過ぎた記録ファイルだけを消す
    setup:
      - name: Mock
        description: なし（フックを子プロセスとして起動し、標準入力へ JSON を渡す）
      - name: 既読の記録
        description: 別のセッションの記録ファイルを 2 つ置き、最終更新を保持期間より 1 日前と 1 日後にする。記録フォルダにログ（`rule-inject.log`）も上限の大きさ以下で置き、最終更新を保持期間より前にする
      - name: 入力
        description: '`source: startup`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant C as 既読の記録の掃除
        participant ST as 記録フォルダ

        CC->>C: 標準入力（session_id・source）
        C->>ST: 記録ファイルを列挙する
        ST-->>C: 記録ファイルと最終更新
        C->>ST: 保持期間を過ぎた記録ファイルを消す
        C-->>CC: 終了コード 0
      ```
    expected:
      - 保持期間を過ぎた記録ファイルが無い
      - 保持期間の内側の記録ファイルが残っている
      - ログが残っている
      - 標準出力が空
      - 終了コードが `0`
    test: test_normal
  - name: 正常系（始まったセッションの記録が古い）
    summary: 始まったセッション自身の記録ファイルは、保持期間を過ぎていても消さない
    setup:
      - name: Mock
        description: なし
      - name: 既読の記録
        description: 始まったセッションの記録ファイルと、別のセッションの記録ファイルを 1 つずつ置き、どちらも最終更新を保持期間より 1 日前にする
        notes: 古い記録を持つセッションを再開した状態。別のセッションのファイルが消えることで、掃除が走ったうえで始まったセッションのファイルだけが残ったと見分ける
      - name: 入力
        description: '`source: resume`、`session_id` は始まったセッション'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant C as 既読の記録の掃除
        participant ST as 記録フォルダ

        CC->>C: 標準入力（session_id・source: resume）
        C->>ST: 記録ファイルを列挙する
        C->>C: 始まったセッションのファイルを除く
        C-->>CC: 終了コード 0
      ```
    expected:
      - 始まったセッションの記録ファイルが残っている
      - 別のセッションの記録ファイルが無い
      - 終了コードが `0`
    test: test_normal_when_own_record_old
  - name: 正常系（記録フォルダが無い）
    summary: 記録フォルダがまだ無くても正常に終える
    setup:
      - name: Mock
        description: なし
      - name: 既読の記録
        description: '`RULE_INJECT_STATE_DIR` がまだ無いフォルダを指す'
      - name: 入力
        description: '`source: startup`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant C as 既読の記録の掃除

        CC->>C: 標準入力（session_id・source）
        C->>C: 記録フォルダが無い
        C-->>CC: 終了コード 0
      ```
    expected:
      - 記録フォルダを作らない
      - 終了コードが `0`
    test: test_normal_when_no_state_dir
  - name: 異常系（記録を消せない・ログにも書けない）
    summary: 記録ファイルを消せず、ログにも書けないとき、セッションの開始は止めずに標準エラー出力に書く
    setup:
      - name: Mock
        description: なし
      - name: 既読の記録
        description: 保持期間を過ぎた別のセッションの記録ファイルを置き、フォルダを書き込み権限なし（`chmod 555`）にする。`rule-inject.log` は置かない
        notes: ログも作れないため、標準エラー出力へ出る経路に定まる
      - name: 入力
        description: '`source: startup`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant C as 既読の記録の掃除
        participant ST as 記録フォルダ

        CC->>C: 標準入力（session_id・source）
        C->>ST: 古い記録ファイルを消す（消せない）
        C->>C: ログに書けないため標準エラー出力へ出す
        C-->>CC: 終了コード 0
      ```
    expected:
      - 標準出力が空
      - '標準エラー出力に `component: sweep_read`・`operation: delete_record` の 1 行がある'
      - 記録ファイルが残っている（次のセッションの開始でまた消す）
      - 終了コードが `0`
    test: test_error_when_record_undeletable
  - name: 正常系（ログが上限を超えている）
    summary: 上限の大きさを超えたログを 1 世代前の名前へ付け替え、それまでの 1 世代前を消す
    setup:
      - name: Mock
        description: なし
      - name: ログ
        description: '`rule-inject.log` を上限の大きさより 1 バイト大きく置き、`rule-inject.log.1` を見分けられる中身で置く'
        notes: 上限とちょうど同じ大きさの境界は「ログが上限以下」のフローで確かめる
      - name: 入力
        description: '`source: startup`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant C as 既読の記録の掃除
        participant ST as 記録フォルダ

        CC->>C: 標準入力（session_id・source）
        C->>ST: 保持期間を過ぎた記録ファイルを消す
        C->>ST: 錠のファイルを待たずに取る
        C->>ST: ログの大きさを確かめる
        ST-->>C: 上限を超えた大きさ
        C->>ST: ログを 1 世代前の名前へ付け替える
        C->>ST: 錠を放す
        C-->>CC: 終了コード 0
      ```
    expected:
      - '`rule-inject.log.1` の中身が、置いた `rule-inject.log` の中身と同じ'
      - '`rule-inject.log` が無い'
      - 標準出力が空
      - 終了コードが `0`
  - name: 正常系（ログが上限以下）
    summary: 大きさが上限ちょうどのログは付け替えない
    setup:
      - name: Mock
        description: なし
      - name: ログ
        description: '`rule-inject.log` を上限の大きさちょうどで置き、`rule-inject.log.1` を見分けられる中身で置く'
      - name: 入力
        description: '`source: startup`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant C as 既読の記録の掃除
        participant ST as 記録フォルダ

        CC->>C: 標準入力（session_id・source）
        C->>ST: ログの大きさを確かめる
        ST-->>C: 上限以下の大きさ
        C-->>CC: 終了コード 0
      ```
    expected:
      - '`rule-inject.log` の中身が置いたまま'
      - '`rule-inject.log.1` の中身が置いたまま'
      - 終了コードが `0`
  - name: 異常系（ログを付け替えられない）
    summary: 上限を超えたログを付け替えられないとき、セッションの開始は止めずに失敗を書く
    setup:
      - name: Mock
        description: なし
      - name: ログ
        description: '`rule-inject.log` を上限の大きさより 1 バイト大きく置き、`rule-inject.log.lock` も置いてから、フォルダを書き込み権限なし（`chmod 555`）にする'
        notes: 錠は取れるが、フォルダに書き込めないため付け替えられない。既にある `rule-inject.log` への追記はできるため、失敗はログへ書かれる
      - name: 入力
        description: '`source: startup`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant C as 既読の記録の掃除
        participant ST as 記録フォルダ

        CC->>C: 標準入力（session_id・source）
        C->>ST: ログを 1 世代前の名前へ付け替える（付け替えられない）
        C->>ST: ログへ失敗を 1 行書く
        C-->>CC: 終了コード 0
      ```
    expected:
      - 標準出力が空
      - '`rule-inject.log` の最後の行が `component: sweep_read`・`operation: rotate_log`'
      - '`rule-inject.log.1` が無い（次のセッションの開始でまた付け替える）'
      - 終了コードが `0`
  - name: 正常系（別のセッションが付け替えている）
    summary: 錠を取れないとき、ログが上限を超えていても付け替えずに終える
    setup:
      - name: Mock
        description: なし
      - name: ログ
        description: '`rule-inject.log` を上限の大きさより 1 バイト大きく置く'
      - name: 錠
        description: テストのプロセスが `rule-inject.log.lock` を `flock(LOCK_EX)` で取ったままフックを起動する
        notes: 別のセッションが付け替えている状態を決定的に作る
      - name: 入力
        description: '`source: startup`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant C as 既読の記録の掃除
        participant ST as 記録フォルダ

        CC->>C: 標準入力（session_id・source）
        C->>ST: 錠のファイルを待たずに取る（取れない）
        C-->>CC: 終了コード 0
      ```
    expected:
      - '`rule-inject.log` の中身が置いたまま'
      - '`rule-inject.log.1` が無い'
      - 標準出力が空
      - 終了コードが `0`
lead: セッションの開始時に、最終更新から非機能要件「既読の記録の保持期間」を過ぎた既読の記録ファイルを消し、非機能要件「ログの上限の大きさ」を超えたログを 1 世代前の名前へ付け替える。始まったセッション自身の記録ファイルと、記録ファイルでもログでもないファイルは消さない。
identifier: sweep_read
idempotent: true
side_effects: 保持期間を過ぎた別のセッションの既読の記録ファイルを消す。上限の大きさを超えた `rule-inject.log` を `rule-inject.log.1` へ付け替え、それまでの `rule-inject.log.1` を消す
exclusivity: 複数のセッションが同時に始まって同じファイルを消すとき、先に消されて無いファイルは消した状態と同じとして扱う。ログは、錠のファイル `rule-inject.log.lock` を `flock(LOCK_EX | LOCK_NB)` で取れたときだけ、錠を持ったまま大きさを確かめて付け替える。取れなければ、別のセッションが付け替えているとして何もしない（待たない）。錠を取った後にログが無いか上限以下なら、先に付け替えられた状態と同じとして付け替えない。付け替えと同時の追記は、付け替えた後の 1 世代前か新しいログのどちらかに入る（`write_log` は書くたびにログを開き直す）
request:
  - name: '`session_id`'
    type: str
    required: true
    description: 始まったセッションの識別子
    constraints: 1〜128 文字の英数字 / `_` / `-`
    notes: このセッションの記録ファイルは消さない。形が外れた値のときは何も消さない
  - name: '`source`'
    type: Literal['startup', 'resume', 'clear', 'compact', 'fork']
    required: true
    description: セッションが始まったきっかけ
    notes: どれでも同じように掃除する
exceptions:
  - name: なし（正常終了）
    condition: 終了コード 0 で終え、標準出力には何も出さない
  - name: OSError（記録を消せない）
    condition: 保持期間を過ぎた記録ファイルはあるが消せない（権限など）
    notes: フックの中で捕まえ、ログへ `delete_record` を書き、残りのファイルの掃除を続けて終了コード 0 で終える（セッションの開始は止めない）。消せなかったファイルは次のセッションの開始でまた消す
  - name: Exception（想定外の例外）
    condition: 上のどれにも当たらない例外
    notes: 最上位で捕まえ、ログへ `unexpected` を書いて終了コード 0 で終える
  - name: OSError（ログを付け替えられない）
    condition: 上限を超えたログはあるが、錠のファイルを開けないか付け替えられない（権限など）。錠を他のセッションが持っていることは失敗にしない
    notes: フックの中で捕まえ、ログへ `rotate_log` を書き、終了コード 0 で終える（セッションの開始は止めない）。既読の記録の掃除は続ける。付け替えられなかったログは次のセッションの開始でまた付け替える
constraints:
  - item: タイムアウト
    constraint: 1 秒（`hooks.json` の `timeout`）
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[フックの実行時間]
  - item: 保持期間
    constraint: 最終更新から 30 日を過ぎた記録ファイルを消す
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[既読の記録の保持期間]
  - item: 消す対象
    constraint: 記録フォルダの直下で、名前が `{session_id}.txt`（`session_id` の形）に合う通常のファイルだけ。ログ・錠のファイル・サブフォルダ・シンボリックリンクは消さない（ログは付け替えの対象）
  - item: ログ
    constraint: 失敗したときだけ ER 図「ログ」の形で 1 行書く。書けないときは標準エラー出力へ出す
  - item: ログの付け替え
    constraint: 錠のファイル `rule-inject.log.lock` を取れたときだけ、記録フォルダの直下の `rule-inject.log` が通常のファイルで大きさが 1 MiB を超えるとき、`rule-inject.log.1` へ付け替える（それまでの `rule-inject.log.1` は置き換わって消える）。中身は読まない
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[ログの上限の大きさ]
notes:
  作業の決まりの注入との分担: 同じ `SessionStart` で動く作業の決まりの注入とは別のフックにする。注入は標準出力へ additionalContext を返し、掃除は何も返さない。始まったセッション自身の記録ファイルを消さないため、注入の圧縮の後の消し残りの確認とぶつからない
test_file: tests/integration/plugin/test_sweep_read.py
