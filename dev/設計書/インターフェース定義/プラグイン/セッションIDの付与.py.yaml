title: "セッションIDの付与"
entry:
  kind: trigger
  value: '`PreToolUse` フック（matcher `mcp__plugin_rule-inject_rule-inject__.*`、timeout 1 秒）'
flows:
  - name: 正常系
    summary: 元の引数に session_id と、索引で解いたルールの場所・記録とログのフォルダを足した updatedInput を返す
    setup:
      - name: Mock
        description: なし（フックを子プロセスとして起動し、標準入力へ JSON を渡す）
      - name: 索引
        description: 一時フォルダのルール 1 件をルールの場所に持つエントリを 1 つ持つ YAML（`RULE_INJECT_INDEXES_USER` で指す）
      - name: 入力
        description: '`tool_input.locations` にそのルールの場所を持ち、`session_id` を持たない'
      - name: 環境変数
        description: フックの子プロセスに `CLAUDE_PROJECT_DIR`・`RULE_INJECT_INDEXES_USER`・`RULE_INJECT_STATE_DIR`・`RULE_INJECT_LOG_DIR`・`GH_TOKEN=gh-secret` を渡す
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as セッションIDの付与
        participant IDX as 索引

        CC->>H: 標準入力（session_id・tool_input）
        H->>IDX: 自分の環境変数で索引を読む
        H->>H: locations を索引のルールの場所と照らす
        H->>H: tool_input を写して session_id・resolved_locations・rejected・state_dir・log_dir を足す
        H-->>CC: updatedInput<br>終了コード 0
      ```
    expected:
      - '`updatedInput` に `locations` と `paths` が元の値のまま載っている'
      - '`updatedInput.session_id` が入力の `session_id` と同じ'
      - '`updatedInput.resolved_locations` がそのルールの場所 1 件だけ'
      - '`updatedInput.rejected` が空'
      - '`updatedInput.state_dir` が `RULE_INJECT_STATE_DIR` の値、`updatedInput.log_dir` が `RULE_INJECT_LOG_DIR` の値'
      - '`permissionDecision` が無い'
      - '`updatedInput` を JSON にした文字列に `gh-secret` が無い'
    test: test_normal
  - name: 正常系（モデルがsession_idを渡した）
    test: test_normal_when_model_supplied_session_id
    summary: モデルが渡した session_id・resolved_locations・rejected・state_dir・log_dir をフックが求めた値で上書きする
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: ルールの場所を持つエントリを 1 つ持つ
      - name: 入力
        description: '`tool_input` に `session_id=model-supplied`・`resolved_locations=["/etc/passwd"]`・`rejected=[]`・`state_dir=/tmp/model`・`log_dir=/tmp/model` を持ち、`locations` を持たない'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as セッションIDの付与

        CC->>H: 標準入力（tool_input にモデルが渡した値）
        H->>H: session_id・resolved_locations・rejected・state_dir・log_dir をフックが求めた値で上書きする
        H-->>CC: updatedInput<br>終了コード 0
      ```
    expected:
      - '`updatedInput.session_id` が入力の `session_id` と同じで、`model-supplied` でない'
      - '`updatedInput.resolved_locations` が空で、`/etc/passwd` を含まない'
      - '`updatedInput.state_dir` が `RULE_INJECT_STATE_DIR` の値、`updatedInput.log_dir` が `RULE_INJECT_LOG_DIR` の値で、`/tmp/model` でない'
  - name: 正常系（対象のパスで引く）
    summary: paths に当たるエントリのルールの場所だけを resolved_locations に載せる
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: '`**/*.py` に当たるルールと `**/*.ts` に当たるルールの 2 エントリ'
      - name: 入力
        description: '`tool_input.paths` に `.py` の絶対パスを 1 つ持ち、`locations` を持たない'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as セッションIDの付与
        participant IDX as 索引

        CC->>H: 標準入力（tool_input.paths）
        H->>IDX: paths に当たるエントリを選ぶ
        H-->>CC: updatedInput（resolved_locations）<br>終了コード 0
      ```
    expected:
      - '`updatedInput.resolved_locations` が `.py` のルールの場所 1 件だけ'
      - '`updatedInput.paths` が元の値のまま載っている'
    test: test_normal_when_by_target_path
  - name: 正常系（索引に載っていない場所）
    summary: 索引に無い場所と相対パスを rejected に載せ、resolved_locations に載せない
    setup:
      - name: Mock
        description: なし
      - name: 索引
        description: ルールの場所を持つエントリを 1 つ持つ
      - name: 入力
        description: '`tool_input.locations` に、索引に無い絶対パス 1 つ・索引に無い URL 1 つ・相対パス 1 つを持つ'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as セッションIDの付与
        participant IDX as 索引

        CC->>H: 標準入力（tool_input.locations 3 件）
        H->>IDX: 索引のルールの場所と照らす（一致しない）
        H-->>CC: updatedInput（rejected 3 件）<br>終了コード 0
      ```
    expected:
      - '`updatedInput.resolved_locations` が空'
      - '`updatedInput.rejected` に絶対パスと URL が「索引に載っていない場所」、相対パスが絶対パスで渡すよう求める理由で載っている'
    test: test_normal_when_location_not_in_index
lead: このプラグインの MCP のツールが呼ばれる直前に、元の引数をすべて写し、`session_id` と、フックのプロセスの環境変数で索引を引いて解いた値（`resolved_locations`・`rejected`・`state_dir`・`log_dir`）を足した `updatedInput` を返す。環境変数そのものは引数に載せない。許可の判定（`permissionDecision`）は返さない。
idempotent: true
side_effects: なし
request:
  - name: '`session_id`'
    type: str
    required: true
    description: 呼び出し元のセッションの識別子
  - name: '`tool_name`'
    type: str
    required: true
    description: 呼ばれる MCP のツールの完全名
    constraints: '`mcp__plugin_rule-inject_rule-inject__` で始まる'
  - name: '`tool_input`'
    type: dict[str, Any]
    required: true
    description: モデルが渡した引数
    notes: モデルが `session_id`・`resolved_locations`・`rejected`・`state_dir`・`log_dir` を渡していても、フックが求めた値で上書きする
response:
  - name: '`hookSpecificOutput.hookEventName`'
    type: Literal['PreToolUse']
    description: フックの種類
  - name: '`hookSpecificOutput.updatedInput`'
    type: dict[str, Any]
    description: '`tool_input` をすべて写し、`session_id` をフックの入力の値にし、制約「フックが解く値」の `resolved_locations`・`rejected`・`state_dir`・`log_dir` を足した引数'
    notes: '`updatedInput` は引数を丸ごと置き換えるため、元の引数を落とさない'
exceptions:
  - name: なし（正常終了）
    condition: 終了コード 0 で終える
  - name: Exception（想定外の例外）
    condition: 入力が読めないなど、`updatedInput` を作れない
    notes: 最上位で捕まえ、ログへ `unexpected` を書いて何も出力せず終了コード 0 で終える。フックが足す引数が足されないため、ツール側が ToolError で利用者に見せる
constraints:
  - item: タイムアウト
    constraint: 1 秒（`hooks.json` の `timeout`）
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[フックの実行時間]
  - item: 許可の判定
    constraint: '`permissionDecision` を返さない'
    notes: '`allow` を返すと利用者の許可の確認が飛ぶため（PoC 検証の回 4）。返さなくても `updatedInput` が効くことを PoC 検証の回 1〜3 で確かめた'
  - item: ログ
    constraint: 失敗したときだけ ER 図「ログ」の形で 1 行書く。書けないときは標準エラー出力へ出す
  - item: フックが解く値
    constraint: '`resolved_locations` は、`tool_input.locations` のうち索引に載ったルールの場所（解決後の絶対パスか URL）に一致するものと、`tool_input.paths` に当たるエントリのルールの場所を、渡された順に重複なく並べたもの。`rejected` は、索引に載っていない `locations` を理由「索引に載っていない場所」で、相対パスの `locations`・`paths` を絶対パスで渡すよう求める理由で並べたもの（`{location, reason}`）。`state_dir`・`log_dir` は、フックの既読の記録・ログと同じ求め方で解いた絶対パス'
    notes: 索引はルール案内と同じ環境変数・同じ既定の置き場所・同じ読み方で読み、`rule` の変数参照もルール案内と同じく展開する。展開できない名前が残ったエントリと読めない正規表現を持つエントリは読み飛ばす。引数は待ち受けのポートにいるプロセスへ HTTP で届くため、環境変数の値をそのまま載せない
identifier: session_id_injection
test_file: tests/integration/plugin/test_session_id_injection.py
