title: "セッションIDの付与"
entry:
  kind: trigger
  value: '`PreToolUse` フック（matcher `mcp__plugin_rule-inject_rule-inject__.*`、timeout 1 秒）'
flows:
  - name: 正常系
    summary: 元の引数に session_id を足した updatedInput を返す
    setup:
      - name: Mock
        description: なし（フックを子プロセスとして起動し、標準入力へ JSON を渡す）
      - name: 入力
        description: '`tool_input` に `locations` と `paths` を持ち、`session_id` を持たない'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as セッションIDの付与

        CC->>H: 標準入力（session_id・tool_input）
        H->>H: tool_input を写して session_id を足す
        H-->>CC: updatedInput<br>終了コード 0
      ```
    expected:
      - '`updatedInput` に `locations` と `paths` が元の値のまま載っている'
      - '`updatedInput.session_id` が入力の `session_id` と同じ'
      - '`permissionDecision` が無い'
    test: test_normal
  - name: 正常系（モデルがsession_idを渡した）
    summary: モデルが渡した session_id をフックの入力の値で上書きする
    setup:
      - name: Mock
        description: なし
      - name: 入力
        description: '`tool_input.session_id` に `model-supplied` を持つ'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant H as セッションIDの付与

        CC->>H: 標準入力（tool_input.session_id = model-supplied）
        H->>H: session_id をフックの入力の値で上書きする
        H-->>CC: updatedInput<br>終了コード 0
      ```
    expected:
      - '`updatedInput.session_id` が入力の `session_id` と同じで、`model-supplied` でない'
    test: test_normal_when_model_supplied_session_id
lead: このプラグインの MCP のツールが呼ばれる直前に、元の引数をすべて写して `session_id` を足した `updatedInput` を返す。許可の判定（`permissionDecision`）は返さない。
idempotent: true
side_effects: なし
request:
  - name: '`session_id`'
    type: str
    required: true
    description: 呼び出し元のセッションの識別子
  - name: '`tool_name`'
    type: str
    required: true
    description: 呼ばれる MCP のツールの完全名
    constraints: '`mcp__plugin_rule-inject_rule-inject__` で始まる'
  - name: '`tool_input`'
    type: dict[str, Any]
    required: true
    description: モデルが渡した引数
    notes: モデルが `session_id` を渡していても、フックの入力の `session_id` で上書きする
response:
  - name: '`hookSpecificOutput.hookEventName`'
    type: Literal['PreToolUse']
    description: フックの種類
  - name: '`hookSpecificOutput.updatedInput`'
    type: dict[str, Any]
    description: '`tool_input` をすべて写し、`session_id` をフックの入力の値にした引数'
    notes: '`updatedInput` は引数を丸ごと置き換えるため、元の引数を落とさない'
exceptions:
  - name: なし（正常終了）
    condition: 常に終了コード 0 で終える
constraints:
  - item: タイムアウト
    constraint: 1 秒（`hooks.json` の `timeout`）
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[フックの実行時間]
  - item: 許可の判定
    constraint: '`permissionDecision` を返さない'
    notes: '`allow` を返すと利用者の許可の確認が飛ぶため（PoC 検証の回 4）。返さなくても `updatedInput` が効くことを PoC 検証の回 1〜3 で確かめた'
