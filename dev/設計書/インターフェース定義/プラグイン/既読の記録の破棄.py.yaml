title: "既読の記録の破棄"
entry:
  kind: trigger
  value: '`PreCompact` フック（timeout 1 秒）'
flows:
  - name: 正常系
    summary: そのセッションの既読の記録ファイルと案内済みの記録ファイルだけを削除する
    setup:
      - name: Mock
        description: なし（フックを子プロセスとして起動し、標準入力へ JSON を渡す）
      - name: 既読の記録
        description: 対象のセッションと別のセッションの記録ファイルを 1 つずつ置く
      - name: 案内済みの記録
        description: 対象のセッションと別のセッションの `{session_id}.guided.txt` を 1 つずつ置く
      - name: 既読の履歴
        description: 対象のセッションの `{session_id}.history.jsonl` を 1 行の中身で置く
      - name: 入力
        description: '`session_id` は対象のセッション、`trigger: manual`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant C as 既読の記録の破棄
        participant ST as 記録ファイル

        CC->>C: 標準入力（session_id・trigger）
        C->>ST: そのセッションの既読の記録ファイルを削除する
        C->>ST: そのセッションの案内済みの記録ファイルを削除する
        C-->>CC: 終了コード 0
      ```
    expected:
      - 対象のセッションの記録ファイルが無い
      - 対象のセッションの案内済みの記録ファイルが無い
      - 対象のセッションの既読の履歴ファイルが中身ごと残っている
      - 別のセッションの記録ファイルと案内済みの記録ファイルが残っている
      - 終了コードが `0`
    test: test_normal
  - name: 正常系（記録が無い）
    summary: 記録ファイルが無いセッションでも正常に終える
    setup:
      - name: Mock
        description: なし
      - name: 既読の記録
        description: 空の一時フォルダ
      - name: 入力
        description: '`trigger: auto`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant C as 既読の記録の破棄

        CC->>C: 標準入力（session_id・trigger）
        C->>C: 削除するファイルが無い
        C-->>CC: 終了コード 0
      ```
    expected:
      - 終了コードが `0`
    test: test_normal_when_no_record
  - name: 異常系（記録を削除できない・ログに書く）
    summary: 記録ファイルを削除できないとき、圧縮は止めずにログと標準エラー出力に書く
    setup:
      - name: Mock
        description: なし
      - name: 既読の記録
        description: 対象のセッションの記録ファイルを置き、フォルダを書き込み権限なし（`chmod 555`）にする
      - name: ログのフォルダ
        description: '設定ファイルの `global.log_dir` を書き込み権限の無い空のフォルダ（`chmod 555`）にする'
      - name: 入力
        description: '`trigger: manual`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant C as 既読の記録の破棄
        participant ST as 記録ファイル

        CC->>C: 標準入力（session_id・trigger）
        C->>ST: 削除する（削除できない）
        C->>C: ログに書けないため標準エラー出力へ出す
        C-->>CC: 終了コード 0
      ```
    expected:
      - 標準出力が空
      - '標準エラー出力に `operation: delete_record` の 1 行がある'
      - 記録ファイルが残っている（圧縮の後の作業の決まりの注入が知らせる）
      - 終了コードが `0`
    test: test_error_when_record_undeletable
  - name: 異常系（設定ファイルが読めない・ログに書く）
    summary: 設定ファイルが読めないとき、何も削除せずにログに書く
    setup:
      - name: Mock
        description: なし
      - name: 設定ファイル
        description: '`RULE_INJECT_CONFIG` が YAML として読めないファイルを指す'
      - name: 既読の記録
        description: '`XDG_STATE_HOME` の既定の記録フォルダに、そのセッションの記録ファイルを置く'
      - name: 入力
        description: '`trigger: auto`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant D as 既読の記録の破棄
        participant CFG as 設定ファイル
        participant LOG as ログ

        CC->>D: 標準入力（session_id・trigger）
        D->>CFG: 読む（読めない）
        D->>LOG: 既定のログのフォルダへ read_settings を追記する
        D-->>CC: 終了コード 0
      ```
    expected:
      - 既定の記録フォルダの記録ファイルが残っている
      - '既定のログのフォルダのログに `operation: read_settings` の行が 1 行ある'
      - 標準出力が空
      - 終了コードが `0`
    test: test_error_when_settings_unreadable
lead: 会話の圧縮の前に、そのセッションの既読の記録ファイルと案内済みの記録ファイルを削除する。既読の履歴ファイルは削除しない。
idempotent: true
side_effects: そのセッションの既読の記録ファイル（`{session_id}.txt`）と案内済みの記録ファイル（`{session_id}.guided.txt`）を削除する。片方を削除できなくてももう片方は削除する。既読の履歴ファイル（`{session_id}.history.jsonl`）は削除しない
request:
  - name: '`session_id`'
    type: str
    required: true
    description: 圧縮するセッションの識別子
    constraints: 1〜128 文字の英数字 / `_` / `-`
    notes: 形式が外れた値のときは何も削除しない
  - name: '`trigger`'
    type: Literal['manual', 'auto']
    required: true
    description: 圧縮のきっかけ
    notes: どちらでも同じように削除する
exceptions:
  - name: なし（正常終了）
    condition: 終了コード 0 で終え、標準出力には何も出さない
    notes: 終了コード 2 は圧縮を止める合図になるため使わない
  - name: OSError（記録を削除できない）
    condition: 記録ファイルはあるが削除できない（権限など）
    notes: 'フックの中で捕まえ、ログへ `delete_record` を書いて終了コード 0 で終える（圧縮は止めない）。PreCompact の `systemMessage` は Claude Code が捨てるため、利用者とモデルへは圧縮の後の作業の決まりの注入（`source: compact`）が、削除できずに残った記録ファイルを見つけて知らせる'
  - name: Exception（想定外の例外）
    condition: 上のどれにも当たらない例外
    notes: 最上位で捕まえ、ログへ `unexpected` を書いて終了コード 0 で終える。記録ファイルが残れば、記録を削除できないときと同じく圧縮の後に知らせる
  - name: OSError / 書式の誤り（設定ファイルが読めない）
    condition: '`RULE_INJECT_CONFIG` が指すファイルが無い・読めない・書式に合わない・知らないキーか許す値の外の値を持つ'
    notes: フックの中で捕まえ、既定値で動かさず何も削除しない。既定のログのフォルダへ `read_settings` を書いて終了コード 0 で終える（圧縮は止めない）。圧縮の後の作業の決まりの注入が、設定ファイルの場所と理由を載せる
constraints:
  - item: タイムアウト
    constraint: 1 秒（`hooks.json` の `timeout`）
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[フックの実行時間]
  - item: ログ
    constraint: 失敗したときだけ ER 図「ログ」の形式で 1 行書く。書けないときは標準エラー出力へ出す
  - item: 設定ファイル
    constraint: ルール案内の制約「設定ファイル」と同じく読む。使うキーは `global.state_dir`・`global.log_dir`
identifier: discard_read
test_file: tests/integration/plugin/test_discard_read.py
