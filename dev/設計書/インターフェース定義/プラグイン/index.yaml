summary: フックと MCP のツールの入出力と処理フロー
items:
  - page: ルール案内.py.yaml
    summary: 操作の対象に当たる未読のルールを、止めて、または止めずに案内する（PreToolUse）
  - page: 既読の記録.py.yaml
    summary: Read か Bash で読んだルールの場所を既読として記録する（PostToolUse）
  - page: 既読の記録の破棄.py.yaml
    summary: 圧縮の前にそのセッションの既読の記録を削除する（PreCompact）
  - page: 作業の決まりの注入.py.yaml
    summary: 新しいファイルは空で作ってから書く決まりを載せる（SessionStart）
  - page: 既読の記録の掃除.py.yaml
    summary: セッションの開始時に、保持期間を過ぎた既読の記録を削除する（SessionStart）
  - page: 検索結果の案内.py.yaml
    summary: 検索の結果に出たファイルに当たる未読のルールを、止めずに案内する（PostToolUse）
  - page: 設定の移し替え.py.yaml
    summary: 端末の設定ファイルを今のバージョンへ移し替える（`python -m rule_inject.migrate`）
  - page: 端末のセットアップ.yaml
    summary: 端末の設定・サーバー・フックを用意して確認する（`/rule-inject:global-setup`）
  - page: 索引の登録.yaml
    summary: リポジトリの索引を参照できる状態にしてチェックする（`/rule-inject:setup`）
