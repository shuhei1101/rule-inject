summary: フックと MCP のツールの入出力と処理フロー
items:
  - page: ルール案内.py.yaml
    summary: 操作の対象に当たる未読のルールを、止めて、または止めずに案内する（PreToolUse）
  - page: セッションIDの付与.py.yaml
    summary: この MCP のツールの引数へ session_id と、索引で解いたルールの場所・記録とログのフォルダを足す（PreToolUse）
  - page: ルール本文の取得.py.yaml
    summary: ルールの場所か対象のパスから本文を返し、既読として記録する（MCP のツール read_rules）
  - page: 既読の記録.py.yaml
    summary: Read か Bash で読んだルールの場所を既読として記録する（PostToolUse）
  - page: 既読の記録の破棄.py.yaml
    summary: 圧縮の前にそのセッションの既読の記録を消す（PreCompact）
  - page: 作業の決まりの注入.py.yaml
    summary: 新しいファイルは空で作ってから書く決まりを載せる（SessionStart）
  - page: 既読の記録の掃除.py.yaml
    summary: セッションの開始時に、保持期間を過ぎた既読の記録を消す（SessionStart）
  - page: 検索結果の案内.py.yaml
    summary: 検索の結果に出たファイルに当たる未読のルールを、止めずに案内する（PostToolUse）
  - page: MCPサーバーの起動.py.yaml
    summary: 127.0.0.1 のポートの /mcp で常駐の MCP サーバーを待ち受ける（python -m rule_inject.server）
  - page: 本文の変数参照の展開.py.yaml
    summary: read_rules の本文の !{名前} をセッションの環境変数で展開する（PostToolUse）
