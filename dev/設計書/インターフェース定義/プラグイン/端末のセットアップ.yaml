title: "端末のセットアップ"
entry:
  kind: operation
  value: '`/rule-inject:global-setup`（プラグインのスキル）'
flows:
  - name: 正常系
    summary: 端末の設定を用意し、サーバーとフックを確認して結果を示す
    setup:
      - name: Mock
        description: なし（手順はスキルの本文で、シナリオ『端末をセットアップする』の E2E で確認する）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as 利用者
        participant IF as global-setup
        participant MG as 設定の移し替え
        participant SV as MCP サーバー

        C->>IF: 実行する
        IF->>MG: --plan
        MG-->>IF: 手順
        IF->>SV: tools/list
        SV-->>IF: ツールの一覧
        IF-->>C: 作ったもの・env に記載したキー・接続の結果
      ```
    expected:
      - 結果に端末の設定のパスと接続の結果が記載されている
lead: 端末ごとに、設定ファイルの作成か移し替え、`env` への記載、サーバーの起動と接続の確認、フックの確認を実行する。
identifier: global_setup
idempotent: true
side_effects: 端末の設定・`${CLAUDE_CONFIG_DIR:-~/.claude}/settings.json` の `env`・`~/.config/systemd/user/{サービス名}.service` に記載し、旧い `rule-inject` の登録を削除する
request:
  - name: --clone
    type: str
    required: false
    default: なし（質問する）
    location: argument
    description: サーバーを起動するローカルのクローンのパス
    constraints: 絶対パスか `~` で始まるパス
  - name: --config
    type: str
    required: false
    default: '`RULE_INJECT_CONFIG` の値、無ければ既定のパス'
    location: argument
    description: 端末の設定のパス
  - name: --index
    type: list[str]
    required: false
    default: なし（質問する）
    location: argument
    description: 雛形から作るときに `global.indexes` へ記載する索引のパス
  - name: --service
    type: str
    required: false
    default: rule-inject
    location: argument
    description: systemd のユーザーのユニットのサービス名
  - name: --yes
    type: bool
    required: false
    default: 'false'
    location: argument
    description: 移し替えと旧い登録の削除の確認に了承として回答する
  - name: --no
    type: bool
    required: false
    default: 'false'
    location: argument
    description: 確認に断りとして回答する
    constraints: '`--yes` と同時に指定しない'
constraints:
  - item: 確認
    constraint: '`--yes`・`--no` が無ければ `AskUserQuestion` で既定値を推奨の選択肢にして質問する'
  - item: サーバーの起動
    constraint: '`RULE_INJECT_PORT`（無ければ既定のポート）で MCP サーバーが待ち受けていれば起動しない。待ち受けていなければユニットを配置して `systemctl --user enable --now` で起動する'
    notes: ポートを別のプロセスが使用していて `tools/list` が返らないときは、ログの場所と修正方法を示して止まる
  - item: env への記載
    constraint: 設定のパスが既定と違うときの `RULE_INJECT_CONFIG` と、移し替えが返却した `env` だけを記載する
    notes: '`env` のほかのキーと、ファイルのほかの内容は変えない'
  - item: 旧い登録
    constraint: '`claude mcp get rule-inject` でユーザースコープの登録を調べ、確認してから `claude mcp remove -s user rule-inject` で削除する'
refs:
  - dev/設計書/シナリオ/単一ユースケース/端末をセットアップする#
  - dev/設計書/インターフェース定義/プラグイン/設定の移し替え.py#
