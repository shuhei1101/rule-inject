title: "非機能要件"
requirements:
  - name: フックの実行時間
    english_name: hook_duration
    category: 性能
    external_constraint: command フックの既定のタイムアウト 600 秒
    source_kind: 実行基盤の制限
    source: https://code.claude.com/docs/en/hooks
    value: '1'
    unit: 秒
    rationale: 外部の上限（600 秒）は、操作のたびに走るフックを待つ値として長すぎる。規約『資源の値の決め方』の「下流を待つタイムアウト」に従い、実測の p99.9 に余裕 50% を加算して、`hooks.json` の `timeout`（秒）に切り上げた。実測は参考の実装のもので、本実装の非機能要件テストで測り直す。正規表現は索引を読むときにエントリごとに 1 回だけコンパイルし、照合のたびにはコンパイルしない。コンパイルと照合を含めたフックの実行全体を、非機能要件テストで `args` を持つエントリ 231 件（実測の索引と同じ件数）と、照合する引数の値 100,000 字の条件で測る
    breakdown:
      - part: 実測 p99.9
        value: 409 ms
        notes: 参考の実装の PreToolUse フックを、索引 231 件・未読で止める経路で 1,000 回実行（p50 154 ms、p99 252 ms、2026-09-29、WSL）
      - part: 余裕
        value: 205 ms
        notes: 実測 p99.9 の 50%（規約の既定値）
      - part: 合計
        value: 614 ms
        notes: '`timeout` は秒で書くため 1 秒に切り上げる'
    overflow: Claude Code がフックを打ち切り、操作は案内なしで通常の許可の流れへ進む（止める判定が効かない。Hooks の公式ドキュメント「A timed-out command ... hook doesn't block the tool call」）。索引の件数を増やしたときは測り直す
    measurement: フックの入力の JSON を標準入力へ渡して実行し、終了までの時間を 1,000 回測って p99.9 を求める
  - name: フックの案内文の長さ
    english_name: hook_context_length
    category: 性能
    external_constraint: フックの additionalContext・systemMessage・initialUserMessage と plain stdout は 1 つあたり 10,000 字まで。超えるとファイルへ退避され、先頭 2,000 字のプレビューに置き換わる。止めるときの permissionDecisionReason はこの上限の対象に挙がっておらず、15,709 字を返すと切られず退避もされずにツールの結果へそのまま載った（2026-09-29、Claude Code 2.1.284 で実測）
    source_kind: 実行基盤の制限
    source: https://code.claude.com/docs/en/hooks
    value: 10,000
    unit: 字
    rationale: 止めずに案内する additionalContext は外部の上限そのまま。止める案内の permissionDecisionReason には実行基盤の上限が無いが、コンテキストを消費する量として同じ 10,000 字を自分で決めた上限にし、2 つの案内で処置を揃える
    overflow: 案内文を出力する前に字数を数える。超えるときは、止めるルールを先に並べてルールの場所を 10,000 字に収まるところまで載せ、載せきれなかった件数を末尾に添える。載せきれなかったルールは未読のまま残るので、載せた分を読んで操作をやり直したときに案内される（単一ユースケース「未読のルールの案内を受ける」の正常シナリオ（案内が長い））
  - name: 対応 OS
    english_name: supported_os
    category: 動作環境
    external_constraint: 制限なし
    source_kind: ユーザー要望
    source: https://github.com/shuhei1101/rule-inject/issues/2
    value: Linux / WSL
    rationale: Issue の構成方針のとおり。PoC 検証と設計の工程の実測は WSL（Linux 6.6）で行った。macOS・Windows（WSL なし）は要件のスコープ外
  - name: フックのPythonのバージョン
    english_name: hook_python_version
    category: 動作環境
    external_constraint: フックは利用者の端末の `python3`（OS が持つバージョン）で動き、バージョンを固定する仕組みが無い
    source_kind: 実行基盤の制限
    value: 3.12 以上
    rationale: PoC 検証と設計の工程で動かした環境が Python 3.12.3。実装は 3.12 より新しい書き方（`PurePath.full_match` など）を使わず、`pyproject.toml` の `requires-python` も `>=3.12` に揃える
    measurement: フックの入口（`hooks/run.py`）を 3.12 と 3.11 の `python3` で起動し、前者は案内が動き、後者はバージョンが足りない知らせが出ることを確かめる
    overflow: これより古い `python3` で起動されたときは、`hooks/run.py` が冒頭でバージョンを確かめ、パッケージを import する前に終える。PreToolUse・PostToolUse・SessionStart は `additionalContext` で「フックには Python 3.12 以上が要ること、動いた `python3` のバージョン」を知らせ、ログ（`unexpected`）に書いて終了コード 0 で終える
  - name: 既読の記録の保持期間
    english_name: record_retention
    category: 保守性
    external_constraint: Claude Code は会話の記録（transcript）を既定で 30 日残し（`cleanupPeriodDays`）、そのあいだは `/exit`・`/clear` で終えたセッションも再開できる
    source_kind: 実行基盤の制限
    source: https://code.claude.com/docs/en/sessions
    value: '30'
    unit: 日
    rationale: 再開できるセッションの記録を削除すると、文脈に残っているルールがまた案内される。会話の既定の保持期間と同じ長さにし、再開できるあいだは記録を残す。最終更新はルールを読んだ最後の時刻のため、ルールを追加で読まないまま 30 日を超えて続いたセッションでは、削除された後にルールがまた案内される（読めば既読に戻る）。`cleanupPeriodDays` を変えた利用者は 設定ファイルの `global.record_retention_days` で合わせられる（設定『プラグイン』）
    overflow: 最終更新から 30 日を過ぎた記録ファイルを、次に始まったセッションの `SessionStart` で削除する（単一ユースケース「終わったセッションの既読の記録が掃除される」）
  - name: ログの保持日数
    english_name: log_retention
    category: 保守性
    external_constraint: 制限なし
    source_kind: ユーザー要望
    source: https://github.com/shuhei1101/rule-inject/pull/12#discussion_r4134801433
    value: '3'
    unit: 日
    rationale: 利用者の回答で既定を 3 日にした。失敗の原因を追うのに要るのは直近の失敗で、失敗が続いても 1 日のファイルは数 MB に収まる。長く残したい利用者は 設定ファイルの `global.log_retention_days` で変える（設定『プラグイン』）
    overflow: 日付が今日（UTC）から保持日数以上前のログのファイルを、次に始まったセッションの `SessionStart` で削除する（単一ユースケース「古いログが掃除される」）
  - name: 検索結果から照合するパスの数
    english_name: search_result_paths
    category: 性能
    external_constraint: フックの `timeout` 1 秒（非機能要件「フックの実行時間」）
    source_kind: 実行基盤の制限
    source: dev/設計書/非機能要件/非機能要件#requirements[フックの実行時間]
    value: '100'
    unit: 件
    rationale: 規約『資源の値の決め方』の「入れ子の待ち」に従い、フックの 1 秒から既存の経路の待ち（非機能要件「フックの実行時間」の合計 614 ms）を引いた残りに安全率 20% を掛け、1 パスあたりの照合の実測で割って切り下げた。実測は「フックの実行時間」と同じ索引 231 件の前提で測った。照合の時間は索引の件数に比例するため、索引の件数を増やしたときや照合を速くしたときは測り直す
    measurement: 索引 231 件を読んだ状態で、100 件の実在するパスを結果に持つ Glob の入力を検索結果の案内のフックに渡し、終了までの時間を 1,000 回測って p99.9 が 1 秒に収まるかを見る
    overflow: 結果の先頭から 100 件だけを照合し、残りは照合しない。案内を出すときは照合しなかった件数を添える
    breakdown:
      - part: フックの timeout
        value: 1,000 ms
        notes: 非機能要件「フックの実行時間」
      - part: 既存の経路の待ち
        value: −614 ms
        notes: 非機能要件「フックの実行時間」の実測 p99.9 と余裕の合計（索引 231 件）
      - part: 安全率 20%
        value: −77 ms
        notes: 規約の既定値。残り 309 ms
      - part: 1 パスあたりの照合
        value: 2.55 ms
        notes: 索引 231 件・1 件あたり glob 2 つに 1,000 パスを当てる測定を 3 回行い、最も遅い回の平均（2026-10-11、WSL）。実在の確かめは 0.001 ms で無視できる
      - part: 合計
        value: 100 件
        notes: 309 ÷ 2.55 = 121 を、測定のばらつきを見込んで 100 に切り下げた
    status: planned
  - name: バージョンの一致
    english_name: version_consistency
    category: 保守性
    external_constraint: '`.claude-plugin/plugin.json` の `version` を置くと、その値を変えるまで利用者はそのバージョンに固定される（値が変わらない間、marketplace から入れた利用者へ新しいバージョンは届かない）'
    source_kind: 実行基盤の制限
    source: https://code.claude.com/docs/en/plugins-reference
    value: 4 つの値が全て一致
    rationale: '`.claude-plugin/plugin.json` の `version` が `version.ini`（先頭の `v` を除く）とずれると、バージョンの更新が利用者へ届かない（v0.1.1 と v0.2.0 で `plugin.json` が `0.1.0` のまま残った）。`pyproject.toml` の `version` と `uv.lock` の `rule-inject` の `version` は、規約『バージョニング』の `## SoT`（リポジトリ内のファイルはタグの値の複製）で揃える対象。食い違いはテストで検知する'
    measurement: '`version.ini`・`pyproject.toml`・`.claude-plugin/plugin.json`・`uv.lock`（`rule-inject` のパッケージ）の 4 つからバージョンを取り出して比べる。食い違うときは 4 つの値を並べて fail する'
    test_file: tests/nfr/test_version_consistency.py
    overflow: 食い違ったら非機能要件テストが fail し、`version.ini`・`pyproject.toml`・`plugin.json`・`uv.lock` の 4 つの値を並べて知らせる
    tests:
      - name: test_version_consistency_when_all_match
        summary: 4 つのバージョンが一致するとき、検査が通る
        condition: リポジトリの直下の `version.ini`・`pyproject.toml`・`.claude-plugin/plugin.json`・`uv.lock`（値は固定しない）
        measurement: 実物の 4 つのファイルからバージョンを取り出し、`version.ini` は先頭の `v` を除いて比べる
        expected: 検査が通る（fail しない）
      - name: test_version_consistency_when_mismatch
        summary: バージョンが 1 つでも食い違うとき、検査が 4 つの値を並べて fail する
        condition: '`version.ini` が `v0.1.1`、`pyproject.toml` の `version` が `0.1.1`、`uv.lock` の `rule-inject` の `version` が `0.1.1`、`plugin.json` の `version` が `0.1.0`（Issue #24 の食い違い）'
        measurement: 食い違うバージョンを置いた一時フォルダの 4 つのファイルを検査へ渡す
        expected: 検査が fail し、失敗の文に 4 つのファイルの値（`v0.1.1`・`0.1.1`・`0.1.1`・`0.1.0`）が並ぶ
  - name: MCPサーバーの待ち受けのアドレス
    english_name: server_bind_address
    category: セキュリティ
    external_constraint: 制限なし
    source_kind: ユーザー要望
    source: https://github.com/shuhei1101/rule-inject/issues/58
    value: 127.0.0.1
    rationale: 索引を書き換えるツールを持つため、同じ端末の Claude Code だけから届くようにループバックに限る。認証は持たない
    measurement: サーバーを起動し、待ち受けているソケットのアドレスが 127.0.0.1 だけであることを確かめる
    status: planned
  - name: MCPサーバーの既定のポート
    english_name: server_default_port
    category: 動作環境
    external_constraint: 制限なし
    source_kind: 制限なし
    value: '8783'
    rationale: コーディング規約『MCP』のポートの台帳で rule-inject に割り当てた値。同じ端末で動く他の MCP サーバーとぶつからない。環境変数 `RULE_INJECT_PORT` と設定ファイルの `global.server_port` で変えられる（設定『プラグイン』）
    overflow: ポートが使われているときは起動せず、ポートと理由を標準エラーへ出して終了コード 1 で終える（インターフェース定義「サーバーの起動」の異常系）
    status: planned
  - name: MCPのツールの応答の長さ
    english_name: tool_result_length
    category: 性能
    external_constraint: Claude Code は成功したツールの結果のテキストが 50,000 字を超えるとファイルへ退避する。結果は既定で 25,000 トークンに制限され（`MAX_MCP_OUTPUT_TOKENS`）、10,000 トークンを超えると警告が出る
    source_kind: 実行基盤の制限
    source: https://code.claude.com/docs/en/mcp
    value: 40,000
    unit: 字
    rationale: ファイルへの退避（50,000 字）に届かず、結果がそのままコンテキストに載るように余裕 20% を引いた。既定の `limit`（100 件）は、実測の索引でエントリ 1 件の JSON が平均 200 字ほどのため、20,000 字前後でこの値に収まる
    breakdown:
      - part: 外部の上限
        value: 50,000 字
        notes: これを超えるとファイルへ退避される
      - part: 余裕
        value: 10,000 字
        notes: 上限の 20%
      - part: 決定値
        value: 40,000 字
    overflow: 応答がこの字数を超えるときは、超える手前のエントリで切り、`total` と `next_cursor` を返して続きを取らせる（インターフェース定義「ルールの一覧」の正常系（続きがある））
    status: planned
lead: Claude Code のフックの制約から逆算した、rule-inject が守る値。
