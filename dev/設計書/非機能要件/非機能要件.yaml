title: "非機能要件"
requirements:
  - name: フックの実行時間
    english_name: hook_duration
    category: 性能
    external_constraint: command フックの既定のタイムアウト 600 秒
    source_kind: 実行基盤の制限
    source: https://code.claude.com/docs/en/hooks
    value: '1'
    unit: 秒
    rationale: 外部の上限（600 秒）は、操作のたびに走るフックを待つ値として長すぎる。規約『資源の値の決め方』の「下流を待つタイムアウト」に従い、実測の p99.9 に余裕 50% を足して、`hooks.json` の `timeout`（秒）に切り上げた。実測は参考の実装のもので、本実装の非機能要件テストで測り直す
    breakdown:
      - part: 実測 p99.9
        value: 409 ms
        notes: 参考の実装の PreToolUse フックを、索引 231 件・未読で止める経路で 1,000 回実行（p50 154 ms、p99 252 ms、2026-09-29、WSL）
      - part: 余裕
        value: 205 ms
        notes: 実測 p99.9 の 50%（規約の既定値）
      - part: 合計
        value: 614 ms
        notes: '`timeout` は秒で書くため 1 秒に切り上げる'
    overflow: Claude Code がフックを打ち切り、操作は案内なしで通常の許可の流れへ進む（止める判定が効かない。Hooks の公式ドキュメント「A timed-out command ... hook doesn't block the tool call」）。索引の件数を増やしたときは測り直す
    measurement: フックの入力の JSON を標準入力へ渡して実行し、終了までの時間を 1,000 回測って p99.9 を求める
  - name: フックの案内文の長さ
    english_name: hook_context_length
    category: 性能
    external_constraint: フックの additionalContext・systemMessage・initialUserMessage と plain stdout は 1 つあたり 10,000 字まで。超えるとファイルへ退避され、先頭 2,000 字のプレビューに置き換わる。止めるときの permissionDecisionReason はこの上限の対象に挙がっておらず、15,709 字を返すと切られず退避もされずにツールの結果へそのまま載った（2026-09-29、Claude Code 2.1.284 で実測）
    source_kind: 実行基盤の制限
    source: https://code.claude.com/docs/en/hooks
    value: 10,000
    unit: 字
    rationale: 止めずに案内する additionalContext は外部の上限そのまま。止める案内の permissionDecisionReason には実行基盤の上限が無いが、コンテキストを消費する量として同じ 10,000 字を自分で決めた上限にし、2 つの案内で処置を揃える
    overflow: 案内文を出力する前に字数を数える。超えるときは、止めるルールを先に並べてルールの場所を 10,000 字に収まるところまで載せ、載せきれなかった件数を末尾に添える。載せきれなかったルールは未読のまま残るので、載せた分を読んで操作をやり直したときに案内される（単一ユースケース「未読のルールの案内を受ける」の正常シナリオ（案内が長い））
  - name: MCPのツールの応答の大きさ
    english_name: mcp_output_size
    category: 性能
    external_constraint: MCP のツールの出力は既定で 25,000 トークンまで（10,000 トークンを超えると警告）。超えるとファイルへ退避され、会話にはファイルのパスだけが載る。ツールごとに `anthropic/maxResultSizeChars` で最大 500,000 字まで上げられる（テキストの応答。`MAX_MCP_OUTPUT_TOKENS` とは別に効く）
    source_kind: 実行基盤の制限
    source: https://code.claude.com/docs/en/mcp
    value: 40,000
    rationale: '`read_rules` に `anthropic/maxResultSizeChars` を付け、退避の判定と手元で数える単位を字数に揃える（トークンの見積もりを使わない）。値は、どのルールも 1 回で返せ、かつ 1 回の取得でコンテキストを使いすぎない量として、実際の索引の最大の本文に安全率 20% を足して切り上げた。展開の形はインターフェース定義「ルール本文の取得」'
    unit: 字
    breakdown:
      - part: 最大の本文
        value: 32,010 字
        notes: 参考の実装の利用者の索引（229 件）のルールの本文の最大（p50 985 字、p95 5,928 字、2026-09-29）
      - part: 安全率
        value: 6,402 字
        notes: 20%。応答の JSON の括弧・キー・エスケープを含む
      - part: 合計
        value: 38,412 字
        notes: 切り上げて 40,000 字。外部の上限（500,000 字）の内側
    overflow: 返す前に応答の字数を数える。収まらない本文は返さず、次の呼び出しで取得する場所として応答に並べ、既読にしない。本文 1 件だけで収まらないときは、取得できなかった場所として理由を添えて返す
  - name: 対応 OS
    english_name: supported_os
    category: 動作環境
    external_constraint: 制限なし
    source_kind: ユーザー要望
    source: https://github.com/shuhei1101/rule-inject/issues/2
    value: Linux / WSL
    rationale: Issue の構成方針のとおり。PoC 検証と設計の段の実測は WSL（Linux 6.6）で行った。macOS・Windows（WSL なし）は要件のスコープ外
  - name: URLのルールの取得の待ち時間
    english_name: rule_fetch_timeout
    category: 性能
    external_constraint: 制限なし
    source_kind: 制限なし
    value: '1'
    unit: 秒
    rationale: 規約『資源の値の決め方』の「下流を待つタイムアウト」に従い、代表として GitHub の raw のファイルを測った p99.9 に余裕 50% を足し、秒に切り上げた。実測は 100 回のため、非機能要件テストで 1,000 回に増やして測り直す
    measurement: 代表の URL を 1,000 回取得して p99.9 を求める
    overflow: 待ち時間を超えた場所は取得できなかった場所として理由を添えて返し、既読にしない。再試行はしない（呼び出し元がやり直す）
    breakdown:
      - part: 実測 p99.9
        value: 323 ms
        notes: '`https://raw.githubusercontent.com/shuhei1101/rule-inject/master/README.md` を 100 回取得（p50 18 ms、2026-09-29、WSL）'
      - part: 余裕
        value: 162 ms
        notes: 実測 p99.9 の 50%
      - part: 合計
        value: 485 ms
        notes: 秒に切り上げて 1 秒
  - name: フックのPythonの版
    english_name: hook_python_version
    category: 動作環境
    external_constraint: フックは利用者の端末の `python3`（OS が持つ版）で動く。MCP サーバーの `uv run` と違い、版を固定する仕組みが無い
    source_kind: 実行基盤の制限
    value: 3.12 以上
    rationale: PoC 検証と設計の段で動かした環境が Python 3.12.3。実装は 3.12 より新しい書き方（`PurePath.full_match` など）を使わず、`pyproject.toml` の `requires-python` も `>=3.12` に揃える
    measurement: フックの入口（`hooks/run.py`）を 3.12 と 3.11 の `python3` で起動し、前者は案内が動き、後者は版が足りない知らせが出ることを確かめる
    overflow: これより古い `python3` で起動されたときは、`hooks/run.py` が冒頭で版を確かめ、パッケージを import する前に終える。PreToolUse・PostToolUse・SessionStart は `additionalContext` で「フックには Python 3.12 以上が要ること、動いた `python3` の版」を知らせ、ログ（`unexpected`）に書いて終了コード 0 で終える
  - name: 既読の記録の保持期間
    english_name: record_retention
    category: 保守性
    external_constraint: Claude Code は会話の記録（transcript）を既定で 30 日残し（`cleanupPeriodDays`）、そのあいだは `/exit`・`/clear` で終えたセッションも再開できる
    source_kind: 実行基盤の制限
    source: https://code.claude.com/docs/en/sessions
    value: '30'
    unit: 日
    rationale: 再開できるセッションの記録を消すと、文脈に残っているルールがまた案内される。会話の既定の保持期間と同じ長さにし、再開できるあいだは記録を残す。最終更新はルールを読んだ最後の時刻のため、読み足さないまま 30 日を超えて続いたセッションでは、消えた後にルールがまた案内される（読めば既読に戻る）。`cleanupPeriodDays` を変えた利用者は `RULE_INJECT_RECORD_RETENTION_DAYS` で合わせられる（設定『プラグイン』）
    overflow: 最終更新から 30 日を過ぎた記録ファイルを、次に始まったセッションの `SessionStart` で消す（単一ユースケース「終わったセッションの既読の記録が掃除される」）
  - name: ログの保持日数
    english_name: log_retention
    category: 保守性
    external_constraint: 制限なし
    source_kind: ユーザー要望
    source: https://github.com/shuhei1101/rule-inject/pull/12#discussion_r4134801433
    value: '3'
    unit: 日
    rationale: 利用者の回答で既定を 3 日にした。失敗の原因を追うのに要るのは直近の失敗で、失敗が続いても 1 日のファイルは数 MB に収まる。長く残したい利用者は `RULE_INJECT_LOG_RETENTION_DAYS` で変える（設定『プラグイン』）
    overflow: 日付が今日（UTC）から保持日数以上前のログのファイルを、次に始まったセッションの `SessionStart` で消す（単一ユースケース「古いログが掃除される」）
  - name: 検索結果から照合するパスの数
    english_name: search_result_paths
    category: 性能
    external_constraint: フックの `timeout` 1 秒（非機能要件「フックの実行時間」）
    source_kind: 実行基盤の制限
    source: dev/設計書/非機能要件/非機能要件#requirements[フックの実行時間]
    value: '100'
    unit: 件
    rationale: 規約『資源の値の決め方』の「入れ子の待ち」に従い、フックの 1 秒から既存の経路の待ち（非機能要件「フックの実行時間」の合計 614 ms）を引いた残りに安全率 20% を掛け、1 パスあたりの照合の実測で割って切り下げた。実測は「フックの実行時間」と同じ索引 231 件の前提で測った。照合の時間は索引の件数に比例するため、索引の件数を増やしたときや照合を速くしたときは測り直す
    measurement: 索引 231 件を読んだ状態で、100 件の実在するパスを結果に持つ Glob の入力を検索結果の案内のフックに渡し、終了までの時間を 1,000 回測って p99.9 が 1 秒に収まるかを見る
    overflow: 結果の先頭から 100 件だけを照合し、残りは照合しない。案内を出すときは照合しなかった件数を添える
    breakdown:
      - part: フックの timeout
        value: 1,000 ms
        notes: 非機能要件「フックの実行時間」
      - part: 既存の経路の待ち
        value: −614 ms
        notes: 非機能要件「フックの実行時間」の実測 p99.9 と余裕の合計（索引 231 件）
      - part: 安全率 20%
        value: −77 ms
        notes: 規約の既定値。残り 309 ms
      - part: 1 パスあたりの照合
        value: 2.55 ms
        notes: 索引 231 件・1 件あたり glob 2 つに 1,000 パスを当てる測定を 3 回行い、最も遅い回の平均（2026-10-11、WSL）。実在の確かめは 0.001 ms で無視できる
      - part: 合計
        value: 100 件
        notes: 309 ÷ 2.55 = 121 を、測定のばらつきを見込んで 100 に切り下げた
    status: planned
lead: Claude Code のフックと MCP の制約から逆算した、rule-inject が守る値。
