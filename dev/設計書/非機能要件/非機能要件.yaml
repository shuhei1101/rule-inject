title: "非機能要件"
requirements:
  - name: フックの実行時間
    english_name: hook_duration
    category: 性能
    external_constraint: command フックの既定のタイムアウト 600 秒
    source_kind: 実行基盤の制限
    source: https://code.claude.com/docs/en/hooks
    value: '1'
    unit: 秒
    rationale: 外部の上限（600 秒）は、操作のたびに走るフックを待つ値として長すぎる。規約『資源の値の決め方』の「下流を待つタイムアウト」に従い、実測の p99.9 に余裕 50% を足して、`hooks.json` の `timeout`（秒）に切り上げた。実測は参考の実装のもので、本実装の非機能要件テストで測り直す
    breakdown:
      - part: 実測 p99.9
        value: 409 ms
        notes: 参考の実装の PreToolUse フックを、索引 231 件・未読で止める経路で 1,000 回実行（p50 154 ms、p99 252 ms、2026-09-29、WSL）
      - part: 余裕
        value: 205 ms
        notes: 実測 p99.9 の 50%（規約の既定値）
      - part: 合計
        value: 614 ms
        notes: '`timeout` は秒で書くため 1 秒に切り上げる'
    overflow: Claude Code がフックを打ち切り、操作は案内なしで通常の許可の流れへ進む（止める判定が効かない。Hooks の公式ドキュメント「A timed-out command ... hook doesn't block the tool call」）。索引の件数を増やしたときは測り直す
    measurement: フックの入力の JSON を標準入力へ渡して実行し、終了までの時間を 1,000 回測って p99.9 を求める
  - name: フックの案内文の長さ
    english_name: hook_context_length
    category: 性能
    external_constraint: フックの additionalContext などの文字列は 1 つあたり 10,000 字まで。超えるとファイルへ退避され、先頭 2,000 字のプレビューに置き換わる
    source_kind: 実行基盤の制限
    source: https://code.claude.com/docs/en/hooks
    value: 10,000
    unit: 字
    rationale: 外部の上限そのまま
    overflow: 案内文を出力する前に字数を数える。超えるときは、止めるルールを先に並べてルールの場所を 10,000 字に収まるところまで載せ、載せきれなかった件数を末尾に添える。載せきれなかったルールは未読のまま残るので、載せた分を読んで操作をやり直したときに案内される（単一ユースケース「未読のルールの案内を受ける」の正常シナリオ（案内が長い））
  - name: MCP のツールの応答の大きさ
    english_name: mcp_output_size
    category: 性能
    external_constraint: MCP のツールの出力は既定で 25,000 トークンまで（10,000 トークンを超えると警告）。超えるとファイルへ退避され、会話にはファイルのパスだけが載る。ツールごとに `anthropic/maxResultSizeChars` で最大 500,000 字まで上げられる（テキストの応答。`MAX_MCP_OUTPUT_TOKENS` とは別に効く）
    source_kind: 実行基盤の制限
    source: https://code.claude.com/docs/en/mcp
    value: 未確定
    rationale: 上限の指定を付けるかと値は、本文を 1 回で返すか分けて返すかと一緒にインターフェース定義設計で決める
  - name: 対応 OS
    english_name: supported_os
    category: 動作環境
    external_constraint: 未確定
    source_kind: ユーザー要望
    source: https://github.com/shuhei1101/rule-inject/issues/2
    value: 未確定
    rationale: Issue の構成方針は Linux / WSL。版の範囲は PoC 検証で動かした環境をもとに設計で決める
lead: Claude Code のフックと MCP の制約から逆算した、rule-inject が守る値。
