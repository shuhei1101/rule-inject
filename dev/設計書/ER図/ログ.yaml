title: "ER 図: ログ"
lead: フックと MCP サーバーが、失敗した操作を後から追えるように書き出すログ。
tables:
  - name: '{RULE_INJECT_LOG_DIR}/{yyyymmdd}_rule-inject.log'
    title: ログ
    datastore: JSON Lines（UTF-8、1 行 = 1 件）
    summary: 失敗した操作とその理由
    scale: '1 日 1 ファイル。失敗が続いても 1 ファイル数 MB で、残るのは非機能要件「ログの保持日数」の分のファイル'
    growth: 失敗のたびに、その時刻（UTC）の日付のファイルへ 1 行追記する。ファイルが無ければ作る
    retention: 'ファイル名の日付が今日（UTC）から非機能要件「ログの保持日数」以上前になったら、次のセッションの開始で消す'
    deletion: ファイルごとの物理削除。利用者が手で消してもよい
    access: 追記（O_APPEND）だけで書く。プラグインは読まない
    description: |-
      フックの標準出力は Claude Code へ返す JSON だけにするため、失敗はこのファイルへ書く。このファイルにも書けないときは、同じ 1 行を標準エラー出力へ出す（フックは Claude Code のデバッグのログ、MCP サーバーは MCP のログに残る）。

      `{RULE_INJECT_LOG_DIR}` は設定『プラグイン』の `RULE_INJECT_LOG_DIR`（既定 `${XDG_STATE_HOME:-~/.local/state}/rule-inject/logs`）。`{yyyymmdd}` は `time` の UTC の日付。
    columns:
      - name: time
        title: 時刻
        type: string
        not_null: true
        description: UTC のタイムゾーン付き ISO 8601（`2026-09-29T08:00:00+00:00`）
      - name: component
        title: 出した元
        type: string
        not_null: true
        description: インターフェース定義の識別子（`rule_guide` / `session_id_injection` / `read_rules` / `record_read` / `discard_read` / `work_rules` / `sweep_read`）
      - name: session_id
        title: セッション
        type: string
        not_null: false
        description: 入力にあればその値
      - name: operation
        title: 失敗した操作
        type: string
        not_null: true
        description: '`read_index` / `read_record` / `write_record` / `write_history` / `delete_record` / `delete_log` / `unexpected` のいずれか'
      - name: path
        title: 対象のパス
        type: string
        not_null: false
        description: 失敗した操作の対象のファイルかフォルダ
      - name: reason
        title: 理由
        type: string
        not_null: true
        description: 例外のクラス名と文面
