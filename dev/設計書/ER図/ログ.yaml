title: "ER 図: ログ"
lead: フックと MCP サーバーが、失敗した操作を後から追えるように書き出すログ。
tables:
  - name: '{RULE_INJECT_STATE_DIR}/rule-inject.log'
    title: ログ
    datastore: JSON Lines（UTF-8、1 行 = 1 件）
    summary: 失敗した操作とその理由
    scale: 次のセッションの開始の時点で、`rule-inject.log` と `rule-inject.log.1` を合わせて非機能要件「ログの上限の大きさ」の 2 倍まで
    growth: 失敗のたびに 1 行追記する
    retention: '大きさが上限を超えたら、次のセッションの開始で `rule-inject.log.1` へ付け替える。`rule-inject.log.1` は次の付け替えまで残る'
    deletion: 付け替えでそれまでの `rule-inject.log.1` を置き換える（物理削除）。利用者が手で消してもよい
    access: 追記（O_APPEND）だけで書く。プラグインは読まない
    description: フックの標準出力は Claude Code へ返す JSON だけにするため、失敗はこのファイルへ書く。このファイルにも書けないときは、同じ 1 行を標準エラー出力へ出す（フックは Claude Code のデバッグのログ、MCP サーバーは MCP のログに残る）。
    columns:
      - name: time
        title: 時刻
        type: string
        not_null: true
        description: UTC のタイムゾーン付き ISO 8601（`2026-09-29T08:00:00+00:00`）
      - name: component
        title: 出した元
        type: string
        not_null: true
        description: インターフェース定義の識別子（`rule_guide` / `session_id_injection` / `read_rules` / `record_read` / `discard_read` / `work_rules` / `sweep_read`）
      - name: session_id
        title: セッション
        type: string
        not_null: false
        description: 入力にあればその値
      - name: operation
        title: 失敗した操作
        type: string
        not_null: true
        description: '`read_index` / `read_record` / `write_record` / `delete_record` / `rotate_log` / `unexpected` のいずれか'
      - name: path
        title: 対象のパス
        type: string
        not_null: false
        description: 失敗した操作の対象のファイルかフォルダ
      - name: reason
        title: 理由
        type: string
        not_null: true
        description: 例外のクラス名と文面
