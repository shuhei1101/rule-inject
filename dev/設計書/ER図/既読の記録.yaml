title: "ER 図: 既読の記録"
lead: フックと MCP サーバーが共有する、セッションごとの既読のルールの場所と、フックが止めずに案内したルールの場所。
tables:
  - name: '{RULE_INJECT_STATE_DIR}/{session_id}.txt'
    title: 既読の記録
    datastore: テキストファイル（UTF-8、1 行 = 1 場所）
    summary: そのセッションで本文を読んだルールの場所
    primary_key: location
    scale: 1 セッション ~1,000 行
    growth: ルールを読むたびに 1 行ずつ追記する。同じ場所が重なっても消さず、読む側が集合として扱う
    retention: そのセッションの次の圧縮まで。圧縮せずに終わったセッションのファイルは、最終更新から非機能要件「既読の記録の保持期間」まで
    deletion: 圧縮の前にファイルごと物理削除する。保持期間を過ぎたファイルは、セッションの開始時にファイルごと物理削除する
    access: セッションのファイルを全行読む。書くときは追記（O_APPEND）だけ
    description: フック（標準ライブラリだけの Python）と MCP サーバーが別のプロセスで同時に書くため、行の追記だけで完結する形にする。フォルダが無ければ書く側が作る。
    columns:
      - name: location
        title: ルールの場所
        type: string
        not_null: true
        description: 解決後の絶対パスか URL。改行を含まない
  - name: '{RULE_INJECT_STATE_DIR}/{session_id}.guided.txt'
    title: 案内済みの記録
    datastore: テキストファイル（UTF-8、1 行 = 1 場所）
    summary: そのセッションで止めずに案内したルールの場所
    primary_key: location
    scale: 1 セッション ~1,000 行
    growth: 止めない案内を出すたびに、載せた場所を 1 行ずつ追記する。同じ場所が重なっても消さず、読む側が集合として扱う
    retention: 既読の記録と同じ。そのセッションの次の圧縮まで。圧縮せずに終わったセッションのファイルは、最終更新から非機能要件「既読の記録の保持期間」まで
    deletion: 圧縮の前に既読の記録と一緒にファイルごと物理削除する。保持期間を過ぎたファイルは、セッションの開始時にファイルごと物理削除する
    access: セッションのファイルを全行読む。書くときは追記（O_APPEND）だけ
    description: ルール案内（PreToolUse）と検索結果の案内（PostToolUse）が共有する。既読の記録と同じく行の追記だけで完結する形にし、フォルダが無ければ書く側が作る。止める案内に載せた場所は記録しない。
    columns:
      - name: location
        title: ルールの場所
        type: string
        not_null: true
        description: 解決後の絶対パスか URL。改行を含まない
    status: planned
