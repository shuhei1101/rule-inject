title: "ER 図: 既読の記録"
lead: フックが共有する、セッションごとの既読のルールの場所、フックが止めずに案内したルールの場所、既読にした履歴。
tables:
  - name: '{state_dir}/{session_id}.txt'
    title: 既読の記録
    datastore: テキストファイル（UTF-8、1 行 = 1 場所とハッシュをタブで区切った組）
    summary: そのセッションで本文を読んだルールの場所と、読んだ時点の本文のハッシュ
    primary_key: (location, hash)
    scale: 1 セッション ~1,000 行
    growth: ルールを読むたびに 1 行ずつ追記する。同じ場所とハッシュの組が重なっても消さず、読む側が集合として扱う。本文が変わった後に読み直したときは、古い行を残したまま新しいハッシュの行を追記する
    retention: そのセッションの次の圧縮まで。圧縮せずに終わったセッションのファイルは、最終更新から非機能要件「既読の記録の保持期間」まで
    deletion: 圧縮の前にファイルごと物理削除する。保持期間を過ぎたファイルは、セッションの開始時にファイルごと物理削除する
    access: セッションのファイルを全行読む。書くときは追記（O_APPEND）だけ
    description: |-
      `{state_dir}` は設定『プラグイン』の `global.state_dir`（既定 `${XDG_STATE_HOME:-~/.local/state}/rule-inject`）。
      複数のフックが別のプロセスで同時に書くため、行の追記だけで完結する形にする。フォルダが無ければ書く側が作る。
    columns:
      - name: location
        title: ルールの場所
        type: string
        not_null: true
        description: 解決後の絶対パス。改行とタブを含まない
      - name: hash
        title: 本文のハッシュ
        type: string
        not_null: true
        description: 既読にした時点のルールのファイルの中身（バイト列）の SHA-256。案内する側が今のハッシュと比べ、違えば未読として扱う。ハッシュを持たない行（この列を足す前の書式）は既読として扱わない
        example: sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
  - name: '{state_dir}/{session_id}.guided.txt'
    title: 案内済みの記録
    datastore: テキストファイル（UTF-8、1 行 = 1 場所）
    summary: そのセッションで止めずに案内したルールの場所
    primary_key: location
    scale: 1 セッション ~1,000 行
    growth: 止めない案内を出すたびに、載せた場所を 1 行ずつ追記する。同じ場所が重なっても消さず、読む側が集合として扱う
    retention: 既読の記録と同じ。そのセッションの次の圧縮まで。圧縮せずに終わったセッションのファイルは、最終更新から非機能要件「既読の記録の保持期間」まで
    deletion: 圧縮の前に既読の記録と一緒にファイルごと物理削除する。保持期間を過ぎたファイルは、セッションの開始時にファイルごと物理削除する
    access: セッションのファイルを全行読む。書くときは追記（O_APPEND）だけ
    description: ルール案内（PreToolUse）と検索結果の案内（PostToolUse）が共有する。既読の記録と同じく行の追記だけで完結する形にし、フォルダが無ければ書く側が作る。止める案内に載せた場所は記録しない。
    columns:
      - name: location
        title: ルールの場所
        type: string
        not_null: true
        description: 解決後の絶対パス。改行を含まない
    status: planned
  - name: '{state_dir}/{session_id}.history.jsonl'
    title: 既読の履歴
    datastore: JSON Lines（UTF-8、1 行 = 1 回の既読）
    summary: そのセッションでいつ・どの読み方でどのルールを既読にしたか。関連する文書の推薦などほかの仕組みが読む
    scale: 1 セッション ~10,000 行
    growth: 既読の記録へ書くたびに、同じ場所の行を 1 行ずつ追記する。同じ場所を何度読んでもそのたびに残す
    retention: 最終更新から非機能要件「既読の記録の保持期間」まで。圧縮では消さない
    deletion: 保持期間を過ぎたファイルを、セッションの開始時にファイルごと物理削除する
    access: このプラグインは追記（O_APPEND）だけで読まない。ほかの仕組みが全行読む
    description: 既読の記録と同じく、フック（Read・Bash・MCP のツール）が別のプロセスで同時に書くため、行の追記だけで完結する形にする。フォルダが無ければ書く側が作る。1 行は改行を含まない JSON のオブジェクト。
    columns:
      - name: time
        title: 時刻
        type: string
        not_null: true
        description: 既読にした時刻（UTC の ISO 8601、秒まで）
        example: '2026-10-24T09:30:00Z'
      - name: session_id
        title: セッション
        type: string
        not_null: true
        description: 既読にしたセッションの識別子。ファイル名の `session_id` と同じ
      - name: method
        title: 読み方
        type: string
        not_null: true
        description: 既読にした読み方
        enum_values: "'read'（Read）/ 'bash'（Bash の読むコマンド）/ 'mcp'（MCP のツールの結果に載った文書か、read_by に当たった MCP のツール）"
      - name: tool
        title: ツール名
        type: string
        not_null: true
        description: 既読にしたツールの名前（`Read`・`Bash`・MCP のツールの完全名）
        example: mcp__docs__get_doc
      - name: location
        title: ルールの場所
        type: string
        not_null: true
        description: 既読にしたルールの場所。既読の記録に書いた値と同じ
    status: planned
