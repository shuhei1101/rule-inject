# yaml-language-server: $schema=../schemas/files.schema.yaml
files:
  - path: rule_inject/features/command/service.py
    name: 読むコマンドのパスの取り出し
    description: Bash のコマンドから読むファイルの絶対パスを取り出し、検索の結果の行からもパスを取得して、コマンドで読んだルールを既読と判定する処理を修正するときに参照する。
    tags:
      - topic:既読の記録
      - topic:コマンドの解析
    related:
      - to: MOD-122-1
        type: implements
  - path: rule_inject/features/document/service.py
    name: MCP の結果の文書の取り出し
    description: MCP のツールの結果から文書の場所と範囲を取り出し、MCP で読んだ文書を既読にする処理を修正するときに参照する。
    tags:
      - topic:既読の記録
      - tool:mcp
    related:
      - to: MOD-122-2
        type: implements
  - path: rule_inject/features/document/types.py
    name: MCP の結果の文書の型
    description: MCP のツールの結果に載った文書の場所と範囲の型を持ち、MCP の結果から取り出す値の構造を調べるときに参照する。
    tags:
      - topic:既読の記録
      - tool:mcp
    related:
      - to: MOD-122-3
        type: implements
  - path: rule_inject/features/guidance/service.py
    name: 案内文の組み立て
    description: フックが返却する案内文（止める案内・止めない案内・検索結果の案内・失敗の通知）を組み立て、案内の文面を変えるときに参照する。
    tags:
      - topic:ルールの案内
    related:
      - to: MOD-122-4
        type: implements
  - path: rule_inject/features/guidance/types.py
    name: 案内文の型
    description: 案内に使用するルールの最小の型と、案内文と記載した場所の型を持ち、案内文の組み立てへ指定する値を調べるときに参照する。
    tags:
      - topic:ルールの案内
    related:
      - to: MOD-122-5
        type: implements
  - path: rule_inject/features/server_start/service.py
    name: サーバーの応答の確認とユニットの起動の依頼
    description: 常駐の MCP サーバーのポートへ接続できるかを確認して systemd --user のユニットへ起動を依頼し、応答の確認と起動の依頼の待ちを修正するときに参照する。
    tags:
      - topic:フック
      - topic:MCPサーバー
      - topic:起動
    related:
      - to: MOD-122-21
        type: implements
  - path: rule_inject/features/server_start/types.py
    name: 起動の依頼の結果の型
    description: ユニットへ起動を依頼したか、依頼しなかった理由を表す型を持ち、起動の依頼の結果を調べるときに参照する。
    tags:
      - topic:フック
      - topic:MCPサーバー
      - topic:起動
    related:
      - to: MOD-122-22
        type: implements
  - path: rule_inject/features/index/_yaml.py
    name: 索引の YAML の読み取り
    description: 索引の YAML のうち設定の設計書に挙げたキーと形式だけを標準ライブラリで読み取り、索引の読み込みで扱うキーを変えるときに参照する。
    tags:
      - topic:ルール索引
    related:
      - to: MOD-122-6
        type: implements
  - path: rule_inject/features/index/check/index.schema.yaml
    name: ルール索引のスキーマ
    description: rule-inject の索引のキーと値の範囲を JSON Schema で定め、索引のキーを追加・変更するときに参照する。
    tags:
      - topic:ルール索引
      - topic:索引のチェック
      - tool:jsonschema
    related:
      - to: MOD-122-54
        type: implements
  - path: rule_inject/features/index/check/scan.py
    name: ヒットしないエントリの走査
    description: プロジェクトのファイルを辿って paths がどのファイルにもヒットしないエントリを返却し、索引のチェックで未使用のエントリを探す処理を修正するときに参照する。
    tags:
      - topic:索引のチェック
    related:
      - to: MOD-122-7
        type: implements
  - path: rule_inject/features/index/check/service.py
    name: 索引のチェック
    description: 索引をスキーマに通して問題を並べ、書き込む前と後の問題を比べ、索引のチェックの判定を変えるときに参照する。
    tags:
      - topic:索引のチェック
      - tool:jsonschema
    related:
      - to: MOD-122-8
        type: implements
  - path: rule_inject/features/index/check/tags.py
    name: 使われていないタグのパターンの検出
    description: 索引のタグのパターンを集めて使われているタグのどれにもヒットしないものを返却し、タグの検査の処理を修正するときに参照する。
    tags:
      - topic:索引のチェック
      - topic:タグ
      - tool:dev-docs
    related:
      - to: MOD-122-9
        type: implements
  - path: rule_inject/features/index/check/types.py
    name: 索引のチェックの型
    description: 索引の問題の種類・問題・チェックの結果の型を持ち、チェックの結果に記載される値を調べるときに参照する。
    tags:
      - topic:索引のチェック
    related:
      - to: MOD-122-10
        type: implements
  - path: rule_inject/features/index/edit/_yaml.py
    name: 索引の書き込みの YAML の設定
    description: round-trip の設定と書き込む値の書式を持ち、索引へ書き込むときのコメントや並びの維持の仕方を変えるときに参照する。
