      - topic:索引の編集
      - tool:ruamel-yaml
    related:
      - to: MOD-122-11
        type: implements
  - path: rule_inject/features/index/edit/service.py
    name: 索引のエントリの書き込みと削除
    description: 索引のエントリの書き込み・削除と、ファイルの置き換えを受け持ち、索引を MCP から編集する処理を修正するときに参照する。
