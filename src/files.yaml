# yaml-language-server: $schema=../schemas/files.schema.yaml
files:
  - path: rule_inject/features/command/service.py
    name: 読むコマンドのパスの取り出し
    description: Bash のコマンドから読むファイルの絶対パスを取り出し、検索の結果の行からもパスを拾う。コマンドを読んで既読を判定する処理を読む・修正するときに開く。
    tags:
      - topic:既読の記録
      - topic:コマンドの解析
    related:
      - to: dev/設計書/モジュール構成/features/command/service.py
        type: implements
  - path: rule_inject/features/document/service.py
    name: MCP の結果の文書の取り出し
    description: MCP のツールの結果から、文書の場所と範囲を取り出す。MCP で読んだ文書を既読にする処理を読む・修正するときに開く。
    tags:
      - topic:既読の記録
      - tool:mcp
    related:
      - to: dev/設計書/モジュール構成/features/document/service.py
        type: implements
  - path: rule_inject/features/document/types.py
    name: MCP の結果の文書の型
    description: MCP のツールの結果に載った文書の場所と範囲の型を持つ。MCP の結果から取り出す値の構造を調べるときに開く。
    tags:
      - topic:既読の記録
      - tool:mcp
    related:
      - to: dev/設計書/モジュール構成/features/document/types.py
        type: implements
  - path: rule_inject/features/guidance/service.py
    name: 案内文の組み立て
    description: フックが返す案内文（止める案内・止めない案内・検索結果の案内・失敗の知らせ・作業の決まり）を組み立てる。案内の文面を変えるときに開く。
    tags:
      - topic:ルールの案内
    related:
      - to: dev/設計書/モジュール構成/features/guidance/service.py
        type: implements
  - path: rule_inject/features/guidance/types.py
    name: 案内文の型
    description: 案内が読むルールの最小の型と、案内文と載せた場所の型を持つ。案内文の組み立てへ渡す値を調べるときに開く。
    tags:
      - topic:ルールの案内
    related:
      - to: dev/設計書/モジュール構成/features/guidance/types.py
        type: implements
  - path: rule_inject/features/index/_yaml.py
    name: 索引の YAML の読み取り
    description: 索引の YAML のうち、設定の設計書に挙げたキーと形式だけを標準ライブラリで読む。索引の読み込みで読めるキーを変えるときに開く。
    tags:
      - topic:ルール索引
    related:
      - to: dev/設計書/モジュール構成/features/index/_yaml.py
        type: implements
  - path: rule_inject/features/index/check/index.schema.yaml
    name: ルール索引のスキーマ
    description: rule-inject の索引（rules.yaml）のキーと値の範囲を JSON Schema で定める。索引のキーを追加・変更するときに開く。
    tags:
      - topic:ルール索引
      - topic:索引のチェック
      - tool:jsonschema
    related:
      - to: dev/設計書/モジュール構成/分類/MCPサーバー/索引のチェック
        type: implements
  - path: rule_inject/features/index/check/scan.py
    name: 当たらないエントリの走査
    description: プロジェクトのファイルを辿り、paths がどのファイルにも当たらないエントリを返す。索引のチェックで未使用のエントリを探す処理を読む・修正するときに開く。
    tags:
      - topic:索引のチェック
    related:
      - to: dev/設計書/モジュール構成/features/index/check/scan.py
        type: implements
  - path: rule_inject/features/index/check/service.py
    name: 索引のチェック
    description: 索引をスキーマに通して問題を並べ、書き込む前と後の問題を比べる。索引のチェックの判定を変えるときに開く。
    tags:
      - topic:索引のチェック
      - tool:jsonschema
    related:
      - to: dev/設計書/モジュール構成/features/index/check/service.py
        type: implements
  - path: rule_inject/features/index/check/tags.py
    name: 使われていないタグのパターンの検出
    description: 索引のタグのパターンを集め、使われているタグのどれにも当たらないものを返す。タグの検査の処理を読む・修正するときに開く。
    tags:
      - topic:索引のチェック
      - topic:タグ
      - tool:dev-docs
    related:
      - to: dev/設計書/モジュール構成/features/index/check/tags.py
        type: implements
  - path: rule_inject/features/index/check/types.py
    name: 索引のチェックの型
    description: 索引の問題の種類・問題・チェックの結果の型を持つ。チェックの結果に載る値を調べるときに開く。
    tags:
      - topic:索引のチェック
    related:
      - to: dev/設計書/モジュール構成/features/index/check/types.py
        type: implements
  - path: rule_inject/features/index/edit/_yaml.py
    name: 索引の書き込みの YAML の設定
    description: round-trip の設定と、書き込む値の書式を持つ。索引へ書き込むときのコメントや並びの保ち方を変えるときに開く。
    tags:
      - topic:索引の編集
      - tool:ruamel-yaml
    related:
      - to: dev/設計書/モジュール構成/features/index/edit/_yaml.py
        type: implements
  - path: rule_inject/features/index/edit/service.py
    name: 索引のエントリの書き込みと削除
    description: 索引のエントリの書き込み・削除と、ファイルの置き換えを受け持つ。索引を MCP から編集する処理を読む・修正するときに開く。
    tags:
      - topic:索引の編集
      - tool:ruamel-yaml
    related:
      - to: dev/設計書/モジュール構成/features/index/edit/service.py
        type: implements
      - to: dev/設計書/インターフェース定義/MCPサーバー/エントリの書き込み.py
        type: see_also
      - to: dev/設計書/インターフェース定義/MCPサーバー/エントリの削除.py
        type: see_also
  - path: rule_inject/features/index/edit/types.py
    name: 索引の編集の型
    description: 編集の結果・索引ごとのロック・書き込みのチェックの型を持つ。索引の編集の結果に載る値を調べるときに開く。
    tags:
      - topic:索引の編集
    related:
      - to: dev/設計書/モジュール構成/features/index/edit/types.py
        type: implements
  - path: rule_inject/features/index/service.py
    name: 索引の読み込みと照合
    description: 索引を読み込み、操作の対象のパスやツール名に当たるルールを照合する。ルールが当たる条件を読む・修正するときに開く。
    tags:
      - topic:ルール索引
      - topic:ルールの案内
    related:
      - to: dev/設計書/モジュール構成/features/index/service.py
        type: implements
  - path: rule_inject/features/index/types.py
    name: 索引の型
    description: 操作の種別・エントリ・照合の結果・読み込みの結果の型を持つ。索引の照合が返す値を調べるときに開く。
    tags:
      - topic:ルール索引
    related:
      - to: dev/設計書/モジュール構成/features/index/types.py
        type: implements
  - path: rule_inject/features/record/service.py
    name: 既読の記録ファイルの読み書き
    description: セッションごとの既読の記録・案内済みの記録・既読の履歴の読み・追記・削除・掃除を受け持つ。既読の保存の仕組みを読む・修正するときに開く。
    tags:
      - topic:既読の記録
    related:
      - to: dev/設計書/モジュール構成/features/record/service.py
        type: implements
  - path: rule_inject/features/record/types.py
    name: 既読の記録の型
    description: 既読の行・読み方・既読の履歴の型を持つ。既読の記録ファイルの構造を調べるときに開く。
    tags:
      - topic:既読の記録
    related:
      - to: dev/設計書/モジュール構成/features/record/types.py
        type: implements
  - path: rule_inject/hooks/__init__.py
    name: フックの入口
    description: run.py の引数の名前から、処理と知らせ方を引く。フックを追加するときに開く。
    tags:
      - topic:フック
      - tool:claude-code
    related:
      - to: dev/設計書/モジュール構成/hooks/__init__.py
        type: implements
  - path: rule_inject/hooks/_runner.py
    name: フックの共通の実行処理
    description: フックの標準入出力・想定外の例外・ログを共通に扱う。フックの入出力の仕組みを読む・修正するときに開く。
    tags:
      - topic:フック
      - tool:claude-code
    related:
      - to: dev/設計書/モジュール構成/hooks/_runner.py
        type: implements
  - path: rule_inject/hooks/discard_read.py
    name: 既読の記録の破棄
    description: 圧縮の前（PreCompact）に、そのセッションの既読の記録と案内済みの記録を削除する。圧縮後に案内を受け直す仕組みを読む・修正するときに開く。
    tags:
      - topic:フック
      - topic:既読の記録
      - tool:claude-code
    related:
      - to: dev/設計書/モジュール構成/hooks/discard_read.py
        type: implements
      - to: dev/設計書/インターフェース定義/プラグイン/既読の記録の破棄.py
        type: implements
  - path: rule_inject/hooks/record_read.py
    name: 既読の記録
    description: Read・Bash・MCP のツールの結果でルールの本文を全体に読んだとき（PostToolUse）に、その場所を既読として記録する。既読の判定を読む・修正するときに開く。
    tags:
      - topic:フック
      - topic:既読の記録
      - tool:claude-code
    related:
      - to: dev/設計書/モジュール構成/hooks/record_read.py
        type: implements
      - to: dev/設計書/インターフェース定義/プラグイン/既読の記録.py
        type: implements
  - path: rule_inject/hooks/rule_guide.py
    name: ルール案内
    description: 操作の対象に当たる未読のルールを、操作の前（PreToolUse）に案内する。ルール案内の判定を読む・修正するときに開く。
    tags:
      - topic:フック
      - topic:ルールの案内
      - tool:claude-code
    related:
      - to: dev/設計書/モジュール構成/hooks/rule_guide.py
        type: implements
      - to: dev/設計書/インターフェース定義/プラグイン/ルール案内.py
        type: implements
  - path: rule_inject/hooks/search_guide.py
    name: 検索結果の案内
    description: 検索の結果に出たファイルに当たる未読・未案内のルールを、結果の後（PostToolUse）に案内する。検索結果の案内を読む・修正するときに開く。
    tags:
      - topic:フック
      - topic:ルールの案内
      - tool:claude-code
    related:
      - to: dev/設計書/モジュール構成/hooks/search_guide.py
        type: implements
      - to: dev/設計書/インターフェース定義/プラグイン/検索結果の案内.py
        type: implements
  - path: rule_inject/hooks/sweep_read.py
    name: 既読の記録の掃除
    description: セッションの開始時（SessionStart）に、保持期間を過ぎた既読の記録と古いログを削除する。記録の保持期間を読む・修正するときに開く。
    tags:
      - topic:フック
      - topic:既読の記録
      - tool:claude-code
    related:
      - to: dev/設計書/モジュール構成/hooks/sweep_read.py
        type: implements
      - to: dev/設計書/インターフェース定義/プラグイン/既読の記録の掃除.py
        type: implements
  - path: rule_inject/hooks/work_rules.py
    name: 作業の決まりの注入
    description: セッションの開始時（SessionStart）に、新しいファイルは空で作ってから書き込む決まりをコンテキストへ載せる。作業の決まりを読む・修正するときに開く。
    tags:
      - topic:フック
      - tool:claude-code
    related:
      - to: dev/設計書/モジュール構成/hooks/work_rules.py
        type: implements
      - to: dev/設計書/インターフェース定義/プラグイン/作業の決まりの注入.py
        type: implements
  - path: rule_inject/server/__main__.py
    name: サーバーの起動の入口
    description: 常駐の MCP サーバーを起動する入口で、ポートの使用中を検出する。サーバーの起動を読む・修正するときに開く。
    tags:
      - topic:MCPサーバー
      - topic:起動
      - tool:mcp
    related:
      - to: dev/設計書/モジュール構成/server/__main__.py
        type: implements
      - to: dev/設計書/インターフェース定義/MCPサーバー/サーバーの起動.py
        type: see_also
  - path: rule_inject/server/_format.py
    name: 応答の形式と長さの切り詰め
    description: ツールの応答を JSON か Markdown に整え、長いときは切り詰める。ツールの応答の見た目を変えるときに開く。
    tags:
      - topic:MCPツール
      - tool:mcp
    related:
      - to: dev/設計書/モジュール構成/server/_format.py
        type: implements
  - path: rule_inject/server/app.py
    name: サーバーのコンポジションルート
    description: 依存を作ってツールへ渡し、MCP サーバーへ全てのツールを登録する。ツールを追加するときに開く。
    tags:
      - topic:MCPサーバー
      - topic:MCPツール
      - tool:mcp
    related:
      - to: dev/設計書/モジュール構成/server/app.py
        type: implements
      - to: dev/設計書/インターフェース定義/MCPサーバー/サーバーの起動.py
        type: see_also
  - path: rule_inject/server/check_tools.py
    name: 索引のチェックのツール
    description: 索引のチェックのツールの本体と、続きの位置の文字列の変換を受け持つ。索引のチェックのツールの入出力を読む・修正するときに開く。
    tags:
      - topic:MCPツール
      - topic:索引のチェック
      - tool:mcp
    related:
      - to: dev/設計書/モジュール構成/server/check_tools.py
        type: implements
      - to: dev/設計書/インターフェース定義/MCPサーバー/索引のチェック.py
        type: implements
  - path: rule_inject/server/dev_docs.py
    name: 使われているタグを引くクライアント
    description: dev-docs の search_docs へ接続し、使われているタグを引く。索引のタグの検査が使うタグの取得を読む・修正するときに開く。
    tags:
      - topic:タグ
      - topic:索引のチェック
      - tool:dev-docs
      - tool:mcp
    related:
      - to: dev/設計書/モジュール構成/server/dev_docs.py
        type: implements
  - path: rule_inject/server/record_tools.py
    name: 既読の記録のツール
    description: 既読の記録の確認・削除のツールの本体を受け持つ。既読の記録を MCP から扱う処理を読む・修正するときに開く。
    tags:
      - topic:MCPツール
      - topic:既読の記録
      - tool:mcp
    related:
      - to: dev/設計書/モジュール構成/server/record_tools.py
        type: implements
      - to: dev/設計書/インターフェース定義/MCPサーバー/既読の記録の確認.py
        type: implements
      - to: dev/設計書/インターフェース定義/MCPサーバー/既読の記録の削除.py
        type: implements
  - path: rule_inject/server/tools.py
    name: ルールの一覧・検索・エントリ編集のツール
    description: ルールの一覧・検索・エントリの書き込み・削除のツールの本体と、設定・書き込める索引の解決を受け持つ。ルールを MCP から扱う処理を読む・修正するときに開く。
    tags:
      - topic:MCPツール
      - topic:ルール索引
      - tool:mcp
    related:
      - to: dev/設計書/モジュール構成/server/tools.py
        type: implements
      - to: dev/設計書/インターフェース定義/MCPサーバー/ルールの一覧.py
        type: implements
      - to: dev/設計書/インターフェース定義/MCPサーバー/ルールの検索.py
        type: implements
      - to: dev/設計書/インターフェース定義/MCPサーバー/エントリの書き込み.py
        type: implements
      - to: dev/設計書/インターフェース定義/MCPサーバー/エントリの削除.py
        type: implements
  - path: rule_inject/server/types.py
    name: サーバーの応答の型
    description: 応答の形式の種類と、ツールの応答のモデルを Pydantic で持つ。ツールの応答の構造を調べるときに開く。
    tags:
      - topic:MCPツール
      - tool:mcp
      - tool:pydantic
    related:
      - to: dev/設計書/モジュール構成/server/types.py
        type: implements
  - path: rule_inject/shared/_settings_yaml.py
    name: 設定ファイルの YAML の読み取り
    description: 設定ファイルの YAML のうち、設定の設計書に挙げたキーと形式だけを標準ライブラリで読む。設定ファイルで読めるキーを変えるときに開く。
    tags:
      - topic:設定ファイル
    related:
      - to: dev/設計書/モジュール構成/shared/_settings_yaml.py
        type: implements
  - path: rule_inject/shared/errors.py
    name: 共通の例外
    description: 設定ファイル・索引・既読の記録・既読の履歴・ログの読み書きで起きる例外を定める。例外の種類を調べるときに開く。
    tags:
      - topic:例外
    related:
      - to: dev/設計書/モジュール構成/shared/errors.py
        type: implements
  - path: rule_inject/shared/logger.py
    name: 失敗のログ
    description: 失敗した操作を日付ごとのログ（JSON Lines）へ記録し、古いログを削除する。ログの出力と保持を読む・修正するときに開く。
    tags:
      - topic:ログ
    related:
      - to: dev/設計書/モジュール構成/shared/logger.py
        type: implements
  - path: rule_inject/shared/paths.py
    name: 記録フォルダとルールの場所の解決
    description: 既定の記録フォルダ・ログのフォルダと、ルールの場所を解決する。記録の置き場所を読む・修正するときに開く。
    tags:
      - topic:設定ファイル
      - topic:既読の記録
    related:
      - to: dev/設計書/モジュール構成/shared/paths.py
        type: implements
  - path: rule_inject/shared/settings.py
    name: 設定ファイルの読み取り
    description: 設定ファイルを読み取り、projects の当て方を決める。設定ファイルの重ね方を読む・修正するときに開く。
    tags:
      - topic:設定ファイル
    related:
      - to: dev/設計書/モジュール構成/shared/settings.py
        type: implements
  - path: rule_inject/shared/variables.py
    name: 索引の変数参照の展開
    description: '!{名前} を環境変数の値へ展開する。索引の変数参照の動きを読む・修正するときに開く。'
    tags:
      - topic:変数参照
      - topic:ルール索引
    related:
      - to: dev/設計書/モジュール構成/shared/variables.py
        type: implements
  - path: rule_inject/shared/yaml_lines.py
    name: YAML の行の読み取り
    description: 設定ファイルと索引の YAML に共通の、行・文字列・リストの読み取りを標準ライブラリだけで行う。YAML の読み取りの共通処理を読む・修正するときに開く。
    tags:
      - topic:設定ファイル
      - topic:ルール索引
    related:
      - to: dev/設計書/モジュール構成/分類/プラグイン/共通
        type: implements
